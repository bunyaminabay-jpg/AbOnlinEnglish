.card{padding:6px 0}
.prog{font-size:13px;color:var(--mut);margin-bottom:6px}

<script>
const L=[];
const A=(n,t,e,s,nt,pat,c,d,r,p,m)=>L.push({n,t,e,s,nt,pat,c,d,r,p,m});
const X=(n,c2,d2,hata,r2,p2,story,can)=>{const l=L[n-1];l.c.push(...c2);l.r.push(...r2);l.p.push(...p2);Object.assign(l,{d2,hata,story,can})};
A(1,"BEN BURADAYIM","I'm here.","Yeni biriyle tanışıyorsun. Kim olduğunu, nerede olduğunu ve nasıl hissettiğini söylemek istiyorsun.","'I'm' = 'I am'. Türkçede 'Ben ... -im' dersin; İngilizcede 'I'm' başa gelir ve tek başına cümle kurar: I'm here. I'm tired. I'm a teacher.","I'm|I am|Are you|you're",
[["I'm here.","Buradayım."],["I'm Ayşe.","Ben Ayşe."],["I'm a teacher.","Ben öğretmenim."],["I'm tired.","Yorgunum."],["Are you OK?","İyi misin?"]],
[[0,"Hi! Are you Ali?"],[1,"No, I'm Emre. Nice to meet you.","Hayır, ben Emre. Memnun oldum."],[0,"Nice to meet you. Are you a student?"],[1,"Yes, I'm a student.","Evet, öğrenciyim."]],
[["I'm [happy].","Mutluyum."],["I'm [at home].","Evdeyim."],["I'm [a student].","Öğrenciyim."],["I'm [ready].","Hazırım."]],
[["Kendini 2 cümleyle tanıt: adın ve mesleğin.","I'm Elif. I'm a nurse."],["Şu an nasıl hissediyorsun? Bir cümle.","I'm a little tired, but I'm happy."]],
"Aynaya bak ve 'I'm ...' ile 3 cümle söyle: nerede olduğun, ne olduğun, nasıl hissettiğin.");

A(2,"İSTİYORUM","I want...","Bir kafede sipariş veriyorsun. İstediğini net ve kibar şekilde söylemelisin.","'I want' + isim doğrudan gelir: I want water. Kibar sürümü 'I'd like'. Olumsuzu 'I don't want'. Soru: Do you want...?","want|I'd like",
[["I want water.","Su istiyorum."],["I want a coffee.","Bir kahve istiyorum."],["I don't want sugar.","Şeker istemiyorum."],["Do you want tea?","Çay ister misin?"],["I'd like a sandwich.","Bir sandviç istiyorum (kibar)."]],
[[0,"Hello! What do you want?"],[1,"I want a coffee, please.","Bir kahve istiyorum, lütfen."],[0,"Do you want sugar?"],[1,"No, I don't want sugar.","Hayır, şeker istemiyorum."]],
[["I want [a coffee].","Bir kahve istiyorum."],["I want [some water].","Biraz su istiyorum."],["I want [a new phone].","Yeni bir telefon istiyorum."],["I want [to sleep].","Uyumak istiyorum."]],
[["Şu an ne istediğini 2 cümleyle söyle.","I want water. I want a rest."],["Bir restoranda sipariş ver.","I'd like a soup and a salad, please."]],
"Bir sonraki kafe ya da markette siparişi içinden İngilizce kur: 'I want...' veya 'I'd like...'.");

A(3,"YAPIYORUM","I work. I like. I live.","Yeni tanıştığın biriyle günlük hayatını, alışkanlıklarını ve sevdiklerini konuşuyorsun.","Alışkanlık ve gerçekleri anlatırken fiil yalın kalır: I work. Olumsuz için 'don't', soru için 'Do you...?'. I/you/we/they ile fiil değişmez.","I work|I live|I like|I don't|Do you",
[["I work in a school.","Bir okulda çalışıyorum."],["I live in a small city.","Küçük bir şehirde yaşıyorum."],["I like music.","Müziği severim."],["I don't drink coffee.","Kahve içmem."],["Do you work here?","Burada mı çalışıyorsun?"]],
[[0,"Where do you live?"],[1,"I live in a small city.","Küçük bir şehirde yaşıyorum."],[0,"Do you work there?"],[1,"Yes, I work in a school.","Evet, bir okulda çalışıyorum."]],
[["I [work] every day.","Her gün çalışırım."],["I [read] at night.","Geceleri okurum."],["I [don't eat] meat.","Et yemem."],["I [like] cold tea.","Soğuk çayı severim."]],
[["Her gün yaptığın 3 şeyi yaz.","I wake up at seven. I drink tea. I go to work."],["Sevmediğin bir şeyi söyle.","I don't like noise."]],
"Gün içinde yaptığın 3 şeyi 'I ...' ile içinden söyle; akşam sesli tekrar et.");

A(4,"NEREDE?","Where is it?","Yabancı bir yerdesin ve bir yer ya da eşya arıyorsun; yönü anlamalısın.","Where is + tekil şey, Where are + çoğul ya da 'sen'. Cevapta 'It's' + yer: in, on, at, next to, near.","Where|It's|next to|near",
[["Where is the station?","İstasyon nerede?"],["Where are you?","Neredesin?"],["It's on the left.","Solda."],["It's next to the bank.","Bankanın yanında."],["It's in the bag.","Çantanın içinde."]],
[[1,"Excuse me, where is the station?","Pardon, istasyon nerede?"],[0,"It's next to the bank."],[1,"Is it far?","Uzak mı?"],[0,"No, it's near. Go straight."]],
[["Where is [the bank]?","Banka nerede?"],["Where is [my phone]?","Telefonum nerede?"],["It's [in the bag].","Çantanın içinde."],["It's [on the table].","Masanın üstünde."]],
[["Odandaki 3 eşyanın yerini söyle.","The book is on the table. The lamp is next to the bed."],["Yolda birine bir yer sor.","Excuse me, where is the pharmacy?"]],
"Evde 5 eşyayı eline al ve 'Where is my...? It's...' diye kendi kendine diyalog kur.");

A(5,"ŞİMDİ NE OLUYOR?","What's happening now?","Telefonda biriyle konuşuyorsun; şu an ne yaptığını ve çevrende neler olduğunu anlatıyorsun.","Şu an olan şey: am/is/are + fiil-ing. Türkçedeki '-iyor' ekinin karşılığı.","~\\b\\w+ing\\b",
[["I'm working now.","Şimdi çalışıyorum."],["It's raining.","Yağmur yağıyor."],["What are you doing?","Ne yapıyorsun?"],["She's cooking dinner.","O akşam yemeği yapıyor."],["They're waiting outside.","Dışarıda bekliyorlar."]],
[[0,"Hello? What are you doing?"],[1,"I'm cooking dinner. What are you doing?","Akşam yemeği yapıyorum. Sen ne yapıyorsun?"],[0,"I'm watching TV."],[1,"Is it raining there?","Orada yağmur yağıyor mu?"]],
[["I'm [reading] a book.","Kitap okuyorum."],["He's [sleeping].","O uyuyor."],["We're [walking] home.","Eve yürüyoruz."],["It's [snowing].","Kar yağıyor."]],
[["Şu anda etrafında olan 3 şeyi söyle.","I'm sitting on a chair. The sun is shining. My phone is ringing."],["Bir arkadaşına şu an ne yaptığını anlat.","I'm drinking tea and watching a video."]],
"Bir kafede ya da sokakta gördüğün 3 kişiyi 'He/She is ...ing' ile içinden anlat.");

A(6,"MERAK EDİYORUM","What? Who? Why?","Yeni bir ortamdasın ve etrafındaki her şey hakkında soru sormak istiyorsun.","Soru kelimesi başa gelir, ardından yardımcı fiil (is/are/do/does) ve özne: Where do you live? Why are you late?","What|Who|Why|How|When|Where",
[["What is this?","Bu ne?"],["Who is that?","O kim?"],["Why are you late?","Neden geciktin?"],["How do you say this?","Bunu nasıl söylersin?"],["When does it start?","Ne zaman başlıyor?"]],
[[1,"Excuse me, what is this?","Pardon, bu ne?"],[0,"It's a local dessert."],[1,"How do you make it?","Nasıl yapılıyor?"],[0,"With milk and rice."]],
[["[What] is your name?","Adın ne?"],["[Where] do you live?","Nerede yaşıyorsun?"],["[Why] do you study English?","Neden İngilizce çalışıyorsun?"],["[When] does the class start?","Ders ne zaman başlıyor?"]],
[["Yeni tanıştığın birine 3 soru sor.","Where are you from? What do you do? Why are you here?"],["Bir şeyin nasıl çalıştığını sor.","How does this machine work?"]],
"Bugün merak ettiğin 3 şeyi İngilizce soru olarak sor (sesli ya da içinden).");

A(7,"BENİM / SENİN / ONUN","My, your, his, her","Eşyalar karışmış. Kimin neyi olduğunu söylemelisin.","my/your/his/her/our/their her zaman isimden önce gelir: my bag. mine/yours/ours tek başına kullanılır: It's mine.","my|your|his|her|our|their|mine|yours|ours",
[["This is my bag.","Bu benim çantam."],["Is this your phone?","Bu senin telefonun mu?"],["That's his car.","O onun arabası."],["Her name is Zeynep.","Onun adı Zeynep."],["It's ours.","Bu bizim."]],
[[0,"Is this your phone?"],[1,"No, it's not mine. Mine is black.","Hayır, benim değil. Benimki siyah."],[0,"Is it his?"],[1,"Maybe. Ask him.","Belki. Ona sor."]],
[["This is [my] book.","Bu benim kitabım."],["Is that [your] key?","Bu senin anahtarın mı?"],["[Her] brother is a doctor.","Onun kardeşi doktor."],["It's [their] house.","Bu onların evi."]],
[["Ailenden iki kişiyi tanıt.","My mother is a teacher. My brother is a student."],["Çantandaki 3 eşyayı say.","My keys, my wallet and my phone are in my bag."]],
"Çevrendeki 5 eşyaya 'my / your' ekleyerek isim ver: my cup, your pen...");

A(8,"DÜN NE OLDU?","What happened yesterday?","Bir arkadaşın dünkü gününü soruyor; sen kısa ve net cevap vermelisin.","Geçmiş: düzenli fiillere -ed (watched), düzensizlere ezber (go → went). Olumsuz ve soru: didn't / Did + yalın fiil.","~\\b(went|was|were|watched|visited|played|didn't|did|\\w+ed)\\b",
[["I went to work.","İşe gittim."],["I watched a movie.","Bir film izledim."],["It was cold.","Hava soğuktu."],["I didn't sleep well.","İyi uyumadım."],["Did you eat?","Yedin mi?"]],
[[0,"What did you do yesterday?"],[1,"I went to the market and I cooked dinner.","Markete gittim ve akşam yemeği pişirdim."],[0,"Did you watch the match?"],[1,"No, I didn't. I was tired.","Hayır, izlemedim. Yorgundum."]],
[["I [visited] my aunt.","Teyzemi ziyaret ettim."],["We [played] football.","Futbol oynadık."],["I [didn't call] him.","Onu aramadım."],["She [was] at home.","O evdeydi."]],
[["Dün yaptığın 3 şeyi yaz.","I got up at eight. I worked. I met a friend."],["Dünkü havayı ve ruh hâlini anlat.","It was sunny. I was happy."]],
"Yarın sabah dünü 4 cümleyle sesli özetle.");

A(9,"NE YAPTIN?","What did you do?","Biri hafta sonunu ya da seyahatini soruyor; sen de ona geçmiş sorular soruyorsun.","Geçmiş soruda fiil yalın kalır: Did you go? (Did you went değil). Soru kelimesi + did + özne + yalın fiil.","~\\b(did|was|were)\\b",
[["What did you do?","Ne yaptın?"],["Where did you go?","Nereye gittin?"],["Who did you meet?","Kiminle buluştun?"],["How was it?","Nasıldı?"],["Did you enjoy it?","Hoşuna gitti mi?"]],
[[0,"Where did you go last weekend?"],[1,"I went to the sea. It was great!","Denize gittim. Harikaydı!"],[0,"Who did you go with?"],[1,"I went with my cousins.","Kuzenlerimle gittim."]],
[["Where [did you go]?","Nereye gittin?"],["What [did you eat]?","Ne yedin?"],["Who [did you call]?","Kimi aradın?"],["How [was] the trip?","Gezi nasıldı?"]],
[["Birine hafta sonunu sor (3 soru).","Where did you go? Who did you meet? How was it?"],["Hafta sonunu anlat.","I visited my grandmother. We cooked and talked all day."]],
"Bugün 'What did you do?' sorusunu birine ya da kendine İngilizce sor ve cevabını ver.");

A(10,"İLK GERÇEK HAYAT","First real situations","Bir şehirde eczane arıyorsun. İlk 9 dersin bloklarını gerçek bir durumda birleştiriyorsun.","Bu ders yeni kalıp öğretmez; ilk 9 dersin bloklarını birleştirir. Takılırsan 'Can you repeat?' kurtarıcıdır.","Excuse me|looking for|didn't understand|repeat|What time",
[["Excuse me, can I ask something?","Pardon, bir şey sorabilir miyim?"],["I'm looking for a pharmacy.","Bir eczane arıyorum."],["What time does it open?","Saat kaçta açılıyor?"],["I didn't understand. Can you repeat?","Anlamadım. Tekrar eder misiniz?"],["Thank you so much!","Çok teşekkür ederim!"]],
[[1,"Excuse me, I'm looking for a pharmacy.","Pardon, bir eczane arıyorum."],[0,"There's one on Main Street."],[1,"I didn't understand. Can you repeat?","Anlamadım. Tekrar eder misiniz?"],[0,"Sure! Go straight, then turn left."]],
[["I'm looking for [a bank].","Bir banka arıyorum."],["What time does [the shop] open?","Dükkân saat kaçta açılıyor?"],["I didn't [understand].","Anlamadım."],["Can you [repeat] that?","Bunu tekrar eder misin?"]],
[["Yabancı bir şehirde yön sor.","Excuse me, where is the museum? Is it far?"],["Anlamadığını kibarca söyle.","Sorry, I didn't understand. Can you say it again?"]],
"Gerçek bir yabancıyla (turist, çevrimiçi dil arkadaşı) 2 cümlelik bir diyalog dene ya da kendi sesini kaydet.");

A(11,"YARIN NE OLACAK?","Tomorrow and plans","Yarınki planlarını anlatıyor ve söz veriyorsun.","Planlı gelecek: be going to. Anlık karar ve söz: will ('ll). Konuşmada 'I'll' çok yaygın.","~\\b(going to|will|won't)\\b|'ll",
[["I'm going to study tomorrow.","Yarın ders çalışacağım."],["I'll call you later.","Seni sonra arayacağım."],["It will rain tonight.","Bu gece yağmur yağacak."],["What are you going to do?","Ne yapacaksın?"],["I'm not going to go.","Gitmeyeceğim."]],
[[0,"What are you going to do tomorrow?"],[1,"I'm going to visit my parents.","Yarın ailemi ziyaret edeceğim."],[0,"I'll come with you!"],[1,"Great! I'll call you in the morning.","Harika! Sabah seni arayacağım."]],
[["I'm going to [travel] next week.","Gelecek hafta seyahat edeceğim."],["She's going to [be] late.","O geç kalacak."],["I'll [help] you.","Sana yardım edeceğim."],["We won't [forget].","Unutmayacağız."]],
[["Yarınki planını 3 cümleyle anlat.","I'm going to get up early. I'm going to work. In the evening I'll cook."],["Birine bir söz ver.","I'll send you the file tonight."]],
"Yarın için 3 planı akşam 'I'm going to ...' ile sesli söyle.");

A(12,"YAPABİLİR MİYİM?","Can I...? Could you...?","İzin istiyor, yeteneklerini söylüyor ve kibarca rica ediyorsun.","can + yalın fiil (to yok). 'Can' yetenek ve izin; 'Could you...?' daha kibar rica.","can|can't|could",
[["Can I sit here?","Buraya oturabilir miyim?"],["I can swim.","Yüzebilirim."],["I can't hear you.","Seni duyamıyorum."],["Can you help me?","Bana yardım edebilir misin?"],["Could you open the window?","Pencereyi açar mısınız?"]],
[[1,"Excuse me, can I sit here?","Pardon, buraya oturabilir miyim?"],[0,"Sure! Can you move your bag?"],[1,"Of course. Could you help me with my coat?","Tabii. Montumla yardım eder misiniz?"],[0,"No problem."]],
[["I can [cook].","Yemek yapabilirim."],["I can't [find] my keys.","Anahtarlarımı bulamıyorum."],["Can you [speak] slowly?","Yavaş konuşabilir misin?"],["Could you [help] me?","Bana yardım edebilir misiniz?"]],
[["Yapabildiğin 3 şeyi söyle.","I can cook, drive and play the guitar."],["Birinden kibar bir rica et.","Could you close the door, please?"]],
"Bir gün boyunca 3 ricayı 'Can/Could you...?' ile içinden kur.");

A(13,"CÜMLELERİ BİRLEŞTİRİYORUM","and, but, because, so","Tek tek cümleler yerine fikirlerini bağlayarak konuşmak istiyorsun.","and = ekleme, but = zıtlık, because = sebep, so = sonuç. 'Because' sebebi, 'so' sonucu getirir.","and|but|because|so|or",
[["I'm tired, but I'm happy.","Yorgunum ama mutluyum."],["I stayed home because it was raining.","Yağmur yağdığı için evde kaldım."],["It's late, so I'm going to sleep.","Geç oldu, o yüzden uyuyacağım."],["I like tea and coffee.","Çay ve kahveyi severim."],["I wanted to go, but I couldn't.","Gitmek istedim ama gidemedim."]],
[[0,"Why are you at home?"],[1,"I'm at home because I'm sick.","Hastayım, o yüzden evdeyim."],[0,"Do you want tea or coffee?"],[1,"Tea, please, and a blanket!","Çay lütfen, bir de battaniye!"]],
[["I like it, [but] it's expensive.","Hoşuma gitti ama pahalı."],["I'm happy [because] it's Friday.","Mutluyum çünkü Cuma."],["It's cold, [so] I wear a coat.","Hava soğuk, bu yüzden mont giyiyorum."],["Do you want this [or] that?","Bunu mu istiyorsun, şunu mu?"]],
[["Bir şeyi sevdiğini ve nedenini söyle.","I like autumn because it's calm."],["Bir planını ve engelini anlat.","I wanted to go out, but it was raining."]],
"Bugün bir kararını 'because' ile tek cümlede açıkla.");

A(14,"SEÇİYORUM","Which one? I prefer...","Bir mağazada ya da menüde seçenekler arasında seçim yapıyorsun.","Seçim: Which one? / I prefer A (to B). Karşılaştırmada 'more than'. Karar verirken: I'll take...","which|prefer|more than|either|take",
[["Which one do you like?","Hangisini beğeniyorsun?"],["I prefer this one.","Ben bunu tercih ederim."],["I like tea more than coffee.","Çayı kahveden çok severim."],["Either is fine.","İkisi de olur."],["I'll take the blue one.","Maviyi alacağım."]],
[[0,"Which one do you like, the red or the blue?"],[1,"I like the blue one. It's cheaper.","Maviyi beğeniyorum. Daha ucuz."],[0,"Do you want to try it?"],[1,"Yes, I'll take it.","Evet, onu alacağım."]],
[["I prefer [tea] to coffee.","Çayı kahveye tercih ederim."],["Which [color] do you want?","Hangi rengi istiyorsun?"],["I'll take [this one].","Bunu alacağım."],["I like [summer] more than winter.","Yazı kıştan çok severim."]],
[["İki şey arasında seçim yap ve nedenini söyle.","I prefer the sea to the mountains because it's relaxing."],["Bir mağazada seçim yap.","I'll take the black one, please."]],
"Bir alışverişte ya da menüde seçimini İngilizce söyle: 'I'll take...'.");

A(15,"NE KADAR?","How much? How many?","Alışveriş yapıyor, fiyat soruyor ve miktar belirtiyorsun.","How much = fiyat / sayılamayan; How many = sayılabilen çoğul. A lot of = çok, a little = biraz, too = fazla.","How much|How many|too|a little|a lot",
[["How much is this?","Bu ne kadar?"],["How many do you need?","Kaç tane lazım?"],["It's ten lira.","On lira."],["That's too expensive.","Bu çok pahalı."],["Can I have a little more?","Biraz daha alabilir miyim?"]],
[[1,"How much is this bag?","Bu çanta ne kadar?"],[0,"It's four hundred lira."],[1,"That's too expensive. Do you have a cheaper one?","Çok pahalı. Daha ucuzu var mı?"],[0,"Yes, this one is two hundred."]],
[["How much is [the ticket]?","Bilet ne kadar?"],["How many [people] are coming?","Kaç kişi geliyor?"],["I need [a lot of] time.","Çok zamana ihtiyacım var."],["I have [a little] money.","Biraz param var."]],
[["Bir alışverişte fiyat sor ve yorum yap.","How much is this jacket? It's too expensive."],["Evinde ne kadar/kaç tane olduğunu söyle.","I have two chairs and a lot of books."]],
"Bir markette 3 ürünün fiyatını İngilizce söyle: 'It's ... lira.'");

A(16,"HAYATIMDA HİÇ...?","Have you ever...?","Tanıştığın biriyle yaşam deneyimlerini paylaşıyorsun: nereye gittin, neyi denedin?","Şimdiyle bağı olan deneyim: have/has + 3. hâl (been, seen, tried). 'ever' sorularda, 'never' olumsuzda, 'already/yet' tamamlanmışlıkta.","~\\b(have|has|haven't|hasn't|I've|ever|never|already|yet)\\b",
[["Have you ever been to London?","Hiç Londra'ya gittin mi?"],["I've never tried sushi.","Hiç suşi denemedim."],["I've lived here for five years.","Beş yıldır burada yaşıyorum."],["I've already eaten.","Zaten yedim."],["Have you finished yet?","Henüz bitirdin mi?"]],
[[0,"Have you ever been abroad?"],[1,"Yes, I've been to Italy. Have you?","Evet, İtalya'ya gittim. Sen?"],[0,"No, I've never traveled outside my country."],[1,"Really? You should go!","Gerçekten mi? Gitmelisin!"]],
[["I've [visited] three countries.","Üç ülke gezdim."],["She's never [seen] snow.","O hiç kar görmedi."],["Have you ever [tried] this?","Bunu hiç denedin mi?"],["I've [lived] here for years.","Yıllardır burada yaşıyorum."]],
[["Hayatında yaptığın 3 deneyimi söyle.","I've visited Izmir. I've tried rock climbing. I've never been on a plane."],["Birine 'Have you ever...?' sorusu sor.","Have you ever learned another language?"]],
"Bir arkadaşına 3 'Have you ever...?' sorusu yaz ya da sesli sor.");

A(17,"NE YAPMALIYIM?","Should, must, have to","Bir sorunun var ve tavsiye istiyorsun; ya da birine tavsiye veriyorsun.","Tavsiye: should. Dış zorunluluk: have to. Güçlü kural: must. Hepsinden sonra yalın fiil gelir.","should|shouldn't|must|have to|has to",
[["You should rest.","Dinlenmelisin."],["I have to work tomorrow.","Yarın çalışmak zorundayım."],["You must wear a seatbelt.","Emniyet kemeri takmak zorundasın."],["You shouldn't worry.","Endişelenmemelisin."],["What should I do?","Ne yapmalıyım?"]],
[[1,"I have a headache. What should I do?","Başım ağrıyor. Ne yapmalıyım?"],[0,"You should drink water and rest."],[1,"I have to work today, though.","Ama bugün çalışmak zorundayım."],[0,"Then you shouldn't stay late."]],
[["You should [sleep] more.","Daha çok uyumalısın."],["I have to [leave] now.","Şimdi gitmek zorundayım."],["You must [be] careful.","Dikkatli olmalısın."],["We shouldn't [be] late.","Geç kalmamalıyız."]],
[["Bir arkadaşına sağlıklı yaşam için 2 tavsiye ver.","You should drink more water. You shouldn't stay up late."],["Yarın yapman gereken 2 şeyi söyle.","I have to send an email. I have to buy bread."]],
"Bir sorun duyduğunda (haber, arkadaş) içinden 'You should...' ile tavsiye ver.");

A(18,"O ANDA NE OLUYORDU?","Past continuous","Geçmişteki bir anda ne yaptığını ve arka planda neler olduğunu anlatıyorsun.","Geçmişte bir anda süren eylem: was/were + fiil-ing. Arka plan 'while' ile, kesen olay 'when' + geçmiş zamanla verilir.","~\\b(was|were|wasn't|weren't|when|while)\\b",
[["I was sleeping when you called.","Sen aradığında uyuyordum."],["What were you doing?","Ne yapıyordun?"],["It was raining while we were walking.","Biz yürürken yağmur yağıyordu."],["They were talking loudly.","Yüksek sesle konuşuyorlardı."],["I wasn't listening.","Dinlemiyordum."]],
[[0,"What were you doing at eight last night?"],[1,"I was cooking dinner. What about you?","Akşam yemeği pişiriyordum. Ya sen?"],[0,"I was watching a series when the power went out."],[1,"Oh no! What did you do?","Eyvah! Ne yaptın?"]],
[["I was [studying] at ten.","Saat ona doğru ders çalışıyordum."],["She was [driving] when it started.","Başladığında araba kullanıyordu."],["We were [talking] while he was cooking.","O yemek yaparken biz konuşuyorduk."],["I wasn't [paying] attention.","Dikkat etmiyordum."]],
[["Dün akşam 8'de ne yapıyordun?","I was watching TV and eating dinner."],["Bir olayı arka planıyla anlat.","I was walking home when it started to rain."]],
"Geçen haftadan bir ana odaklan ve 'I was ... when ...' ile 2 cümlede anlat.");

A(19,"BENİM HİKÂYEM","First, then, finally","Başına gelen bir olayı sırayla, bir hikâye gibi anlatıyorsun.","Hikâyede sıra ve sürpriz kelimeleri: first → then → after that → suddenly → finally. Yeni dil bilgisi değil, akış kuruyorsun. Geçmiş zaman kullan.","First|Then|After that|Suddenly|In the end|Finally|Later",
[["First, I woke up late.","Önce geç uyandım."],["Then I missed the bus.","Sonra otobüsü kaçırdım."],["After that, I called a taxi.","Ardından taksi çağırdım."],["Suddenly, my phone rang.","Birden telefonum çaldı."],["In the end, everything was fine.","Sonunda her şey yolundaydı."]],
[[0,"Why were you late yesterday?"],[1,"First, I missed the bus. Then I walked.","Önce otobüsü kaçırdım. Sonra yürüdüm."],[0,"Oh no. Did you arrive on time?"],[1,"Finally, yes! But I was very tired.","Sonunda evet! Ama çok yorgundum."]],
[["[First], I made tea.","Önce çay yaptım."],["[Then] I sat down.","Sonra oturdum."],["[Suddenly], the lights went out.","Birden ışıklar gitti."],["[In the end], we laughed.","Sonunda güldük."]],
[["Bir günü 4 cümleyle hikâye yap.","First, I got up. Then I had breakfast. After that I went to work. Finally I came home."],["Başına gelen komik ya da garip bir şeyi anlat.","Suddenly, I realized I forgot my keys."]],
"Bu hafta başına gelen bir olayı 5 cümleyle sesli kaydet.");

A(20,"İLK BÜTÜNSEL KONUŞMA","My first full talk","Aşama I'in finali: kendini, dünü, yarını ve bir deneyimini tek bir konuşmada birleştiriyorsun.","Bu ders bir mini final: 1 dakikalık konuşma. Yapı: Ben kimim → şu an ne yapıyorum → dün ne yaptım → yarın ne yapacağım → bir deneyim → kapanış.","Let me|That's|Yesterday|Tomorrow",
[["Let me tell you about myself.","Sana kendimden bahsedeyim."],["I live in a small city and I work in a school.","Küçük bir şehirde yaşıyorum ve bir okulda çalışıyorum."],["Last year I started learning something new.","Geçen yıl yeni bir şey öğrenmeye başladım."],["I'm going to keep practicing every day.","Her gün pratik yapmaya devam edeceğim."],["That's my story. Thank you for listening.","Hikâyem bu. Dinlediğin için teşekkürler."]],
[[0,"Tell me about yourself."],[1,"Sure. I live in a small city and I work in a school.","Tabii. Küçük bir şehirde yaşıyorum ve bir okulda çalışıyorum."],[0,"What do you do in your free time?"],[1,"I read and I walk. Yesterday I walked for an hour.","Okurum ve yürürüm. Dün bir saat yürüdüm."]],
[["Let me [tell you] about my day.","Sana günümden bahsedeyim."],["Yesterday I [went out] with friends.","Dün arkadaşlarımla dışarı çıktım."],["Tomorrow I'm going to [study].","Yarın ders çalışacağım."],["I've never [been] abroad.","Hiç yurt dışına çıkmadım."]],
[["1 dakikalık konuşmanın yazılı taslağını hazırla.","I'm Deniz and I live in Izmir. I work in a bank. Yesterday I met a friend. Tomorrow I'm going to visit my parents. I've never been abroad, but I want to travel."],["Konuşmanı bitirirken kullanacağın kapanış cümlesini yaz.","That's all from me. Thank you!"]],
"Telefonunun ses kaydedicisiyle 1 dakikalık kendini tanıtma konuşmasını kaydet; 40. derste karşılaştırmak için sakla.");

A(21,"NEDEN? / RAĞMEN / SONUÇ","Because, although, so","Bir kararını gerekçelendiriyor, zıtlıkları ve sonuçları bağlıyorsun.","Although + cümle, despite + isim. Because sebebi, so ve that's why sonucu bağlar.","because|although|despite|so|that's why",
[["I stayed because I was tired.","Yorgun olduğum için kaldım."],["Although it was late, I called him.","Geç olmasına rağmen onu aradım."],["It was cold, so we went inside.","Hava soğuktu, bu yüzden içeri girdik."],["Despite the rain, we walked.","Yağmura rağmen yürüdük."],["That's why I'm learning English.","İşte bu yüzden İngilizce öğreniyorum."]],
[[0,"Why do you study English?"],[1,"Because I want to travel. That's why I study every day.","Çünkü seyahat etmek istiyorum. Bu yüzden her gün çalışıyorum."],[0,"Even though you're busy?"],[1,"Yes. Although I'm busy, I always find time.","Evet. Meşgul olsam da her zaman zaman bulurum."]],
[["[Although] I was tired, I went.","Yorgun olsam da gittim."],["[Despite] the traffic, we arrived early.","Trafiğe rağmen erken vardık."],["I missed the bus, [so] I walked.","Otobüsü kaçırdım, o yüzden yürüdüm."],["[That's why] I called you.","İşte bu yüzden seni aradım."]],
[["Bir kararının sebebini ve sonucunu açıkla.","I moved because I wanted a quieter life, so now I live near the sea."],["'Although' ile bir zıtlık cümlesi kur.","Although it was expensive, I bought it."]],
"Bugün aldığın bir kararı 'because ... so ...' ile açıkla.");

A(22,"BİLMİYORUM AMA TARİF EDEBİLİRİM","I can describe it","Aklına doğru kelime gelmiyor. Pes etmek yerine kelimeyi tarif ederek anlatıyorsun.","Kelimeyi bilmiyorsan: kategori (a kind of) + işlev (you use it to...) + benzerlik (looks like). Bu bir iletişim stratejisidir ve akıcılığı korur.","something|kind of|looks like|opposite|You use it",
[["It's something you use to...","... için kullandığın bir şey."],["It's a kind of fruit.","Bir tür meyve."],["It looks like a small bird.","Küçük bir kuşa benziyor."],["It's the opposite of big.","'Big'in tersi."],["You use it when you want to...","... istediğinde kullanırsın."]],
[[1,"I forgot the word. It's something you use to cut paper.","Kelimeyi unuttum. Kağıt kesmek için kullandığın bir şey."],[0,"Scissors?"],[1,"Yes! Scissors. Thank you.","Evet! Makas. Teşekkürler."],[0,"No problem. It's a hard word."]],
[["It's something you use [to cook].","Pişirmek için kullandığın bir şey."],["It's a kind of [fruit].","Bir tür meyve."],["It looks like [a small bird].","Küçük bir kuşa benziyor."],["It's the opposite of [big].","'Big'in tersi."]],
[["Bilmediğin bir nesneyi tarif et (örn. şemsiye).","It's something you open when it rains."],["Soyut bir kelimeyi tarif et (örn. patience).","It's when you can wait calmly without getting angry."]],
"Evde 3 eşyayı adını söylemeden İngilizce tarif et.");

A(23,"EĞER...","If it rains, I'll stay home","Gerçekçi olasılıkları ve sonuçlarını konuşuyorsun: plan, uyarı, söz.","Gerçekçi olasılık: If + şimdiki zaman, will + yalın fiil. If cümlesinde 'will' kullanılmaz: If it rains (If it will rain değil).","~\\b(if|unless|will|won't)\\b|'ll",
[["If it rains, I'll stay home.","Yağmur yağarsa evde kalırım."],["If you study, you'll pass.","Çalışırsan geçersin."],["What will you do if you miss the train?","Treni kaçırırsan ne yapacaksın?"],["Unless you hurry, we'll be late.","Acele etmezsen geç kalacağız."],["I'll call you if I need help.","Yardıma ihtiyacım olursa seni ararım."]],
[[0,"What will you do if it rains tomorrow?"],[1,"If it rains, I'll stay home and read.","Yağmur yağarsa evde kalıp kitap okurum."],[0,"And if the weather is nice?"],[1,"If it's nice, I'll go for a walk.","Hava güzel olursa yürüyüşe çıkarım."]],
[["If I [have time], I'll call you.","Zamanım olursa seni ararım."],["If she [comes], we'll start.","O gelirse başlarız."],["Unless it [stops], we won't go.","Durmazsa gitmeyeceğiz."],["What will you do if [you fail]?","Başarısız olursan ne yapacaksın?"]],
[["Yarın için 2 olasılık ve sonucunu yaz.","If I finish early, I'll go out. If I don't, I'll stay home."],["Birine bir uyarı ver.","If you don't hurry, you'll miss the bus."]],
"Bugün 3 'If ..., I'll ...' planı yap.");

A(24,"FARZ ET Kİ...","If I had more time...","Gerçek olmayan durumları hayal ediyor, tavsiye veriyor ve dilek belirtiyorsun.","Gerçek dışı durum: If + geçmiş biçim, would + yalın fiil. 'Were' tüm kişilerle kullanılabilir: If I were you...","~\\b(if|would|could|wish|were|imagine)\\b|'d",
[["If I had more time, I would travel.","Daha çok zamanım olsa seyahat ederdim."],["If I were you, I'd talk to him.","Senin yerinde olsam onunla konuşurdum."],["What would you do if you won the lottery?","Piyangoyu kazansan ne yapardın?"],["I wish I could fly.","Keşke uçabilsem."],["Imagine you could live anywhere.","Her yerde yaşayabildiğini düşün."]],
[[0,"What would you do if you had a free year?"],[1,"If I had a free year, I'd travel around the world.","Boş bir yılım olsa dünyayı gezerdim."],[0,"Would you go alone?"],[1,"No, I'd go with my best friend.","Hayır, en iyi arkadaşımla giderdim."]],
[["If I [were] rich, I'd buy a boat.","Zengin olsam bir tekne alırdım."],["If I [had] a car, I'd drive there.","Arabam olsa oraya sürerdim."],["What [would] you change?","Neyi değiştirirdin?"],["I wish I [knew] more languages.","Keşke daha çok dil bilsem."]],
[["Hayalindeki bir durumu 2 cümleyle anlat.","If I lived by the sea, I would swim every morning."],["Birine 'If I were you...' ile tavsiye ver.","If I were you, I'd take a break."]],
"Gün içinde 'Keşke...' dediğin bir şeyi 'I wish...' ya da 'If I..., I would...' ile söyle.");

A(25,"BENİM FİKRİM","I think... In my opinion...","Bir konuda fikrini söylüyor, katılıp katılmadığını gerekçeleriyle belirtiyorsun.","Fikir verirken: I think..., In my opinion... + sebep (because...). 'I don't think it is' kalıbı 'I think it isn't'ten daha doğaldır.","think|opinion|agree|believe",
[["I think it's a good idea.","Bence iyi bir fikir."],["In my opinion, it's too risky.","Bence çok riskli."],["I agree with you.","Sana katılıyorum."],["I don't agree because...","Katılmıyorum çünkü..."],["What do you think about it?","Bu konuda ne düşünüyorsun?"]],
[[0,"What do you think about online classes?"],[1,"I think they're useful, but not enough.","Bence faydalı ama yeterli değil."],[0,"Why not enough?"],[1,"Because students need real conversation.","Çünkü öğrencilerin gerçek konuşmaya ihtiyacı var."]],
[["I think [it's useful].","Bence faydalı."],["In my opinion, [it's too long].","Bence çok uzun."],["I don't think [it's easy].","Bence kolay değil."],["I agree with [her].","Ona katılıyorum."]],
[["Bir konu hakkında fikrini ve nedenini yaz.","I think remote work is great because it saves time."],["Bir arkadaşının fikrine katıl ya da katılma.","I see your point, but I don't completely agree."]],
"Bugün bir haber ya da video hakkında 1 görüş cümlesini 'I think ... because ...' ile söyle.");

A(26,"OLAYLARIN SIRASI","Before, after, as soon as","Olayların hangisinin önce, hangisinin sonra olduğunu net biçimde anlatıyorsun.","Zaman bağlaçları sırayı kurar: before/after + eylem. As soon as = hemen; by the time = o zamana kadar. Önceki dersin hikâye akışını daha hassas yapar.","before|after|as soon as|while|by the time",
[["Before I left, I locked the door.","Çıkmadan önce kapıyı kilitledim."],["After I ate, I washed the dishes.","Yemek yedikten sonra bulaşıkları yıkadım."],["As soon as I arrived, I called you.","Varır varmaz seni aradım."],["While I was cooking, he was reading.","Ben yemek yaparken o okuyordu."],["By the time I got there, it was over.","Oraya vardığımda bitmişti."]],
[[0,"What did you do after the meeting?"],[1,"After the meeting, I went home and relaxed.","Toplantıdan sonra eve gidip dinlendim."],[0,"Did you call her?"],[1,"Yes, as soon as I arrived.","Evet, varır varmaz."]],
[["[Before] I slept, I read.","Uyumadan önce okudum."],["[After] I finished, I left.","Bitirdikten sonra çıktım."],["[As soon as] he came, we started.","O gelir gelmez başladık."],["[While] I was walking, I thought.","Yürürken düşündüm."]],
[["Sabah rutinini bağlaçlarla anlat.","Before I leave home, I drink tea. After I arrive at work, I check my email."],["Bir olayın zaman sırasını anlat.","As soon as I got home, I took a shower."]],
"Akşam yaptığın 3 şeyi 'before / after' ile sırala.");

A(27,"NE KADAR? NE DERECE?","A bit, quite, too, enough","Bir şeyi sadece iyi ya da kötü demek yerine, derecesini ince ayarla anlatıyorsun.","Derece kelimeleri anlamı ayarlar: a bit < quite < very < extremely. 'Too' olumsuzdur (fazla); 'enough' sıfattan sonra gelir: big enough.","a bit|quite|very|too|enough|so|really",
[["It's a bit expensive.","Biraz pahalı."],["It's quite good.","Oldukça iyi."],["It's too heavy for me.","Benim için fazla ağır."],["It's not big enough.","Yeterince büyük değil."],["It was so funny!","O kadar komikti ki!"]],
[[0,"How was the movie?"],[1,"It was quite good, but a bit long.","Oldukça iyiydi ama biraz uzundu."],[0,"Was it scary?"],[1,"Not really. It wasn't scary enough.","Pek değil. Yeterince korkutucu değildi."]],
[["It's [a bit] cold.","Biraz soğuk."],["It's [too] noisy here.","Burası fazla gürültülü."],["The room isn't [big enough].","Oda yeterince büyük değil."],["It's [really] interesting.","Gerçekten ilginç."]],
[["Bir filmi ya da yemeği dereceleyerek değerlendir.","It was quite good, but a bit too sweet."],["Bir yeri tarif ederken 3 derece kelimesi kullan.","The cafe is really small and a bit noisy, but very cozy."]],
"Bugün 3 şeyi (hava, yemek, iş) derece kelimeleriyle yorumla.");

A(28,"SEÇİM VE KARAR","I've decided to...","Kararlarını ve tercihlerini gerekçeleriyle açıklıyorsun.","Karar dili: decide to, would rather, it depends on. Kararını gerekçeyle sun: I've decided to... because...","decided|rather|depends|decide|go with",
[["I've decided to move.","Taşınmaya karar verdim."],["I'd rather stay home.","Evde kalmayı tercih ederim."],["It depends on the price.","Fiyata bağlı."],["I can't decide.","Karar veremiyorum."],["Let's go with the first option.","İlk seçenekle gidelim."]],
[[0,"Have you decided where to go?"],[1,"Not yet. It depends on the budget.","Henüz değil. Bütçeye bağlı."],[0,"Would you rather go to the sea or the mountains?"],[1,"I'd rather go to the sea.","Denize gitmeyi tercih ederim."]],
[["I've decided to [study] abroad.","Yurt dışında okumaya karar verdim."],["I'd rather [wait].","Beklemeyi tercih ederim."],["It depends on [the weather].","Havaya bağlı."],["Let's go with [the cheaper one].","Daha ucuz olanla gidelim."]],
[["Verdiğin bir kararı gerekçesiyle anlat.","I've decided to learn English because I want a better job."],["İki seçenek arasında kalıp 'it depends' ile cevap ver.","It depends on how much time I have."]],
"Küçük bir kararını (akşam yemeği) 'I'd rather ... because ...' ile gerekçelendir.");

A(29,"BİR ŞEY NASIL YAPILIYOR?","How does it work?","Bir yemeğin, cihazın ya da işlemin nasıl yapıldığını adım adım anlatıyorsun.","Süreç anlatımı: you + fiil (yapan önemli değil) ya da edilgen: is/are + 3. hâl (is made). 'Need to' adımları netleştirir.","~\\b(made|cooked|served|sold|you need to|first|then|finally)\\b",
[["First, you boil the water.","Önce suyu kaynatırsın."],["It's made from milk.","Sütten yapılır."],["You need to stir it slowly.","Yavaşça karıştırman gerek."],["It's cooked for ten minutes.","On dakika pişirilir."],["Finally, serve it hot.","Son olarak sıcak servis et."]],
[[0,"How do you make Turkish tea?"],[1,"First, you boil the water. Then you add the tea.","Önce suyu kaynatırsın. Sonra çayı eklersin."],[0,"How long do you wait?"],[1,"You wait for about fifteen minutes.","Yaklaşık on beş dakika beklersin."]],
[["It's made [from wood].","Ahşaptan yapılır."],["You need to [add salt].","Tuz eklemen gerek."],["It's [cooked] slowly.","Yavaş pişirilir."],["It's [sold] everywhere.","Her yerde satılır."]],
[["Basit bir işin yapılışını 4 adımda anlat.","First, you cut the bread. Then you add cheese. After that you heat it. Finally you eat it."],["Bir ürünün neyden yapıldığını söyle.","This table is made from wood."]],
"Bildiğin bir tarifi ya da işlemi arkadaşına anlatır gibi sesli kaydet.");

A(30,"PROBLEM ÇÖZÜYORUM","There's a problem","Aldığın bir hizmette sorun var; sakin ve kibar biçimde çözüm istiyorsun.","Sorun bildirme formülü: durum (There's a problem with...) + detay (It doesn't...) + istek (Could you...?). Sakin ve kibar kal.","problem|doesn't work|fix|refund|replace",
[["There's a problem with my order.","Siparişimde bir sorun var."],["It doesn't work.","Çalışmıyor."],["Could you fix it, please?","Düzeltebilir misiniz?"],["I'd like a refund.","İade istiyorum."],["What can we do about it?","Bununla ilgili ne yapabiliriz?"]],
[[1,"Hello, there's a problem with my order.","Merhaba, siparişimde bir sorun var."],[0,"I'm sorry. What's the problem?"],[1,"The item doesn't work. Could you replace it?","Ürün çalışmıyor. Değiştirebilir misiniz?"],[0,"Of course. We'll send a new one."]],
[["There's a problem with [the internet].","İnternetle ilgili bir sorun var."],["[The printer] doesn't work.","Yazıcı çalışmıyor."],["Could you [replace] it?","Değiştirebilir misiniz?"],["I'd like [a refund].","İade istiyorum."]],
[["Bir otel ya da mağaza sorununu bildir.","There's a problem with my room. The air conditioner doesn't work. Could you send someone?"],["Bir çözüm öner.","How about we try restarting it?"]],
"Gerçek ya da hayali bir şikâyeti (cihaz, hizmet) İngilizce kısa bir mesajla kurgula.");

A(31,"DAHA KİBAR SORUYORUM","Would you mind...?","Rica ve izin isterken tonu yumuşatıyor, daha kibar ve dolaylı konuşuyorsun.","'Would you mind' + fiil-ing. 'I was wondering if...' en kibar dolaylı rica. Daha uzun ve dolaylı = daha kibar.","Would you mind|Could I possibly|wondering|Do you mind|possible",
[["Would you mind opening the window?","Pencereyi açmanızın sakıncası var mı?"],["Could I possibly borrow your pen?","Kalemini ödünç alabilir miyim acaba?"],["I was wondering if you could help me.","Bana yardım edebilir misiniz diye düşünüyordum."],["Do you mind if I sit here?","Buraya oturmamın sakıncası var mı?"],["Would it be possible to change the time?","Saati değiştirmek mümkün olur mu?"]],
[[1,"Excuse me, would you mind closing the door?","Pardon, kapıyı kapatmanızın sakıncası var mı?"],[0,"Not at all."],[1,"I was wondering if you could also turn down the music.","Müziği de kısabilir misiniz diye düşünüyordum."],[0,"Sure, no problem."]],
[["Would you mind [waiting]?","Beklemenizin sakıncası var mı?"],["Could I possibly [use your phone]?","Telefonunuzu kullanabilir miyim acaba?"],["I was wondering if [you had time].","Zamanınız var mı diye düşünüyordum."],["Would it be possible [to change the time]?","Saati değiştirmek mümkün mü?"]],
[["Aynı ricayı 3 kibarlık düzeyinde yaz.","Open the window. / Can you open the window? / Would you mind opening the window?"],["Bir yöneticiye rica cümlesi yaz.","I was wondering if I could reschedule our meeting."]],
"Bugün 2 ricayı her zamankinden daha kibar kur.");

A(32,"TAHMİN EDİYORUM","He must be at home","Elinde kesin bilgi yok; ipuçlarına dayanarak tahmin yürütüyorsun.","Kesinlik ölçeği: must (çok emin) > probably > might / could (belki) > can't (imkânsız). Hepsinden sonra be + sıfat ya da fiil.","must|might|can't|could|may|probably|guess",
[["He must be at home.","Evde olmalı."],["She might be sick.","Hasta olabilir."],["It can't be true.","Doğru olamaz."],["They could be late.","Geç kalabilirler."],["I guess he forgot.","Sanırım unuttu."]],
[[0,"Why isn't Ali answering?"],[1,"He might be sleeping. It's late.","Uyuyor olabilir. Geç oldu."],[0,"Or he must be busy."],[1,"Maybe. It can't be serious.","Belki. Ciddi olamaz."]],
[["He must be [tired].","Yorgun olmalı."],["She might [know].","Biliyor olabilir."],["That can't be [his].","Bu onunki olamaz."],["They're probably [at work].","Muhtemelen işteler."]],
[["Kapı çalındı, kim olabilir? 3 tahmin yap.","It might be the neighbor. It could be a delivery. It can't be my brother."],["Bir fotoğraftaki durumu tahmin et.","She must be a teacher. She looks friendly."]],
"Gün içinde gördüğün 3 durum için tahmin yap: 'It must be...', 'It might be...'.");

A(33,"DETAYLANDIRIYORUM","The man who...","Bir kişiyi, yeri ya da nesneyi ayrıntılarla tanımlayarak daha zengin cümleler kuruyorsun.","who = kişi, which / that = nesne, where = yer. Cümleye bilgi ekler: the teacher + who helped me.","who|which|that|where",
[["She's the teacher who helped me.","Bana yardım eden öğretmen o."],["It's the place where we met.","Tanıştığımız yer orası."],["This is the book that I told you about.","Sana anlattığım kitap bu."],["It's a small, quiet street.","Küçük, sessiz bir sokak."],["He's the kind of person who never gives up.","O hiç pes etmeyen biri."]],
[[0,"Which one is your sister?"],[1,"She's the one who is wearing a red coat.","Kırmızı mont giyen."],[0,"And where do you live?"],[1,"I live in a house which has a big garden.","Büyük bahçesi olan bir evde yaşıyorum."]],
[["He's the man [who lives next door].","Yan kapıda yaşayan adam."],["It's a cafe [where you can study].","Ders çalışabileceğin bir kafe."],["I lost the phone [that I bought].","Aldığım telefonu kaybettim."],["She's a friend [who always listens].","Hep dinleyen bir arkadaş."]],
[["Sevdiğin bir yeri 'where / which' ile anlat.","It's a small cafe which has old books and where I go every Sunday."],["Bir arkadaşını 'who' ile tanıt.","He's a friend who always makes me laugh."]],
"En sevdiğin yeri 3 sıfat ve 1 'where' cümlesiyle anlat.");

A(34,"DEĞİŞİYORUM / ALIŞIYORUM","I used to... I'm used to...","Hayatındaki değişimi, eski alışkanlıkları ve yeni alıştığın şeyleri anlatıyorsun.","Used to + yalın fiil = eskiden yapardım (artık yok). Be used to + fiil-ing = alışkınım. Get used to = alışıyorum.","used to|getting used|become|changed",
[["I used to live in a village.","Eskiden bir köyde yaşardım."],["I'm used to waking up early.","Erken kalkmaya alışkınım."],["I'm getting used to the noise.","Gürültüye alışıyorum."],["Things have changed a lot.","Her şey çok değişti."],["I've become more patient.","Daha sabırlı oldum."]],
[[0,"Do you like living in the city?"],[1,"I'm getting used to it. I used to live in a village.","Alışıyorum. Eskiden bir köyde yaşıyordum."],[0,"Was it very different?"],[1,"Yes. I'm used to silence, so the noise is hard.","Evet. Sessizliğe alışkınım, o yüzden gürültü zor."]],
[["I used to [play] chess.","Eskiden satranç oynardım."],["I'm used to [working] late.","Geç çalışmaya alışkınım."],["I'm getting used to [the cold].","Soğuğa alışıyorum."],["I've [become] more confident.","Daha özgüvenli oldum."]],
[["Eskiden yaptığın ve artık yapmadığın bir şeyi söyle.","I used to play football every day, but now I don't."],["Son yıllardaki bir değişimini anlat.","I've become more organized because of my job."]],
"Hayatında değişen 3 şeyi 'used to' ile yaz ya da söyle.");

A(35,"GELECEĞİ KURGULUYORUM","Plans, goals, hopes","Uzun vadeli hedeflerini, umutlarını ve planlarını anlatıyorsun.","Uzun vadeli plan: hope to / plan to + fiil, my goal is to... 'By + zaman + will have + 3. hâl' = o zamana kadar tamamlanmış olacak.","hope|planning|plan|By next|In ten|goal|By 2030",
[["I hope to travel next year.","Gelecek yıl seyahat etmeyi umuyorum."],["I'm planning to start a project.","Bir proje başlatmayı planlıyorum."],["By next year, I'll have saved some money.","Gelecek yıla kadar biraz para biriktirmiş olacağım."],["In ten years, I'd like to be fluent.","On yıl sonra akıcı olmak isterim."],["My goal is to speak confidently.","Hedefim kendinden emin konuşmak."]],
[[0,"Where do you see yourself in five years?"],[1,"I hope to be working abroad.","Yurt dışında çalışıyor olmayı umuyorum."],[0,"That's ambitious."],[1,"My goal is to speak English fluently by then.","Hedefim o zamana kadar akıcı İngilizce konuşmak."]],
[["I hope to [learn] a new skill.","Yeni bir beceri öğrenmeyi umuyorum."],["I'm planning to [move] next year.","Gelecek yıl taşınmayı planlıyorum."],["By 2030, I'll have [finished] my degree.","2030'a kadar derecemi bitirmiş olacağım."],["My goal is to [write] a book.","Hedefim bir kitap yazmak."]],
[["5 yıl sonraki hayatını 3 cümleyle hayal et.","In five years, I'd like to live by the sea. I hope to be working remotely. My goal is to be fluent in English."],["Önümüzdeki 12 ay için bir hedef yaz.","By next year, I will have finished my first big project."]],
"5 yıllık bir vizyonu 1 dakikalık sesli not olarak kaydet.");

A(36,"KIRMAK İSTEMEDEN REDDEDİYORUM","I'd love to, but...","Bir daveti ya da isteği, ilişkiyi zedelemeden nazikçe reddediyorsun.","Kibar red = teşekkür + yumuşatıcı (I'm afraid / I'd love to) + sebep + alternatif. Doğrudan 'No' sert algılanabilir.","love to|pass|afraid|another time|appreciate",
[["I'd love to, but I can't.","Çok isterdim ama yapamam."],["Thanks for asking, but I'll pass.","Sorduğun için sağ ol ama pas geçeceğim."],["I'm afraid I'm not available.","Maalesef müsait değilim."],["Maybe another time?","Belki başka zaman?"],["I appreciate it, but I have other plans.","Takdir ediyorum ama başka planlarım var."]],
[[0,"Do you want to come to my party on Saturday?"],[1,"I'd love to, but I'm afraid I'm not available.","Çok isterdim ama maalesef müsait değilim."],[0,"Oh, that's a pity."],[1,"I know. Maybe another time?","Biliyorum. Belki başka zaman?"]],
[["I'd love to, but [I have work].","Çok isterdim ama işim var."],["Thanks, but [I'll pass].","Sağ ol ama pas geçeceğim."],["I'm afraid [I can't make it].","Maalesef gelemem."],["Maybe [next week]?","Belki gelecek hafta?"]],
[["Bir davete kibarca hayır de.","Thank you for inviting me, but I'm afraid I can't come. Maybe next time!"],["Bir teklife alternatif sun.","I can't on Friday, but I'm free on Sunday."]],
"Bu hafta gelen bir isteğe kibarca 'hayır' demeyi İngilizce prova et.");

A(37,"TONUMU DEĞİŞTİRİYORUM","Formal or informal?","Aynı mesajı arkadaşına ve yöneticine farklı tonlarda söylüyorsun.","Aynı mesaj, farklı ton. Arkadaşa kısa (Hey, thanks), resmi ortamda tam (Dear..., Could you..., Best regards). Ton = kelime + kalıp + uzunluk.","Hey|Good morning|Could you|thanks|look forward",
[["Hey, what's up?","Selam, n'aber?"],["Good morning, how are you today?","Günaydın, bugün nasılsınız?"],["Could you send me the report?","Raporu bana gönderebilir misiniz?"],["Send me the file, thanks!","Dosyayı gönder, sağ ol!"],["I look forward to hearing from you.","Cevabınızı bekliyorum."]],
[[0,"Hey! What's up?"],[1,"Not much! How about you?","Pek bir şey yok! Sen?"],[0,"Good morning. How may I help you?"],[1,"Good morning. I'd like to book a room, please.","Günaydın. Bir oda ayırtmak istiyorum lütfen."]],
[["[Hi] / [Dear Sir or Madam],","Selam / Sayın yetkili,"],["See you [later] / [Best regards],","Görüşürüz / Saygılarımla,"],["Can you help? / [Could you assist me]?","Yardım edebilir misin? / Bana yardımcı olabilir misiniz?"],["Thanks! / [Thank you very much].","Sağ ol! / Çok teşekkür ederim."]],
[["Aynı mesajı iki tonda yaz: arkadaşa ve yöneticiye.","Hey, can you send it today? / Could you please send it by this evening?"],["Resmi bir e-posta açılışı yaz.","Dear Mr. Smith, I hope you are well."]],
"Bir WhatsApp mesajını resmi e-posta tonuna çevir.");

A(38,"İŞ GÖRÜŞMESİ","Job interview","Bir iş görüşmesinde kendini tanıtıyor, deneyim ve güçlü yönlerini anlatıyorsun.","Mülakat yapısı: kendini tanıt → deneyim (I have X years of...) → güçlü yön + örnek → neden bu iş? → soru sor.","experience|strength|applying|role|time|good at",
[["I have five years of experience in teaching.","Öğretmenlikte beş yıllık deneyimim var."],["My greatest strength is communication.","En büyük gücüm iletişim."],["I'm applying because I want to grow.","Gelişmek istediğim için başvuruyorum."],["Can you tell me about the role?","Rol hakkında bilgi verir misiniz?"],["Thank you for your time.","Zaman ayırdığınız için teşekkürler."]],
[[0,"Tell me about yourself."],[1,"I'm a teacher with five years of experience. I enjoy working with people.","Beş yıllık deneyimi olan bir öğretmenim. İnsanlarla çalışmayı severim."],[0,"What's your greatest strength?"],[1,"I'm patient and I communicate clearly.","Sabırlıyım ve net iletişim kurarım."]],
[["I have [three years] of experience.","Üç yıllık deneyimim var."],["I'm good at [solving problems].","Sorun çözmede iyiyim."],["I'm applying because [I like the company].","Şirketi sevdiğim için başvuruyorum."],["I'm looking for [a new challenge].","Yeni bir zorluk arıyorum."]],
[["'Tell me about yourself' sorusuna 3 cümle cevap yaz.","I'm a graphic designer with four years of experience. I love creating clear visuals. I'm looking for a team where I can grow."],["Bir zayıf yönünü olumlu şekilde söyle.","I sometimes take on too much, but I'm learning to plan better."]],
"Mülakat sorusuna verdiğin cevabı sesli kaydet; 60 saniyeyi geçmesin.");

A(39,"HAZIRLIKSIZ KONUŞUYORUM","Thinking on my feet","Hiç hazırlanmadığın bir soruya akıcı ve düzenli cevap veriyorsun.","Hazırlıksız konuşma 3 parçalı: zaman kazanan kalıp → ana fikir + sebep → özet. Duraklamayı 'um' yerine bir kalıpla doldur.","Let me think|good question|Well|What I mean|To sum up",
[["Let me think for a second.","Bir saniye düşüneyim."],["That's a good question.","Güzel bir soru."],["Well, as far as I know...","Şey, bildiğim kadarıyla..."],["What I mean is...","Demek istediğim şu..."],["To sum up...","Özetlersem..."]],
[[0,"What do you think about social media?"],[1,"That's a good question. Well, I think it has pros and cons.","Güzel bir soru. Bence artıları da eksileri de var."],[0,"Such as?"],[1,"What I mean is it connects people but wastes time. To sum up, it depends.","Demek istediğim insanları bağlıyor ama zaman kaybettiriyor. Özetle, duruma bağlı."]],
[["Let me [think] about it.","Bunu düşüneyim."],["Well, [it depends].","Şey, duruma bağlı."],["What I mean is [it's difficult].","Demek istediğim zor."],["To sum up, [it was great].","Özetle, harikaydı."]],
[["'Sosyal medya' konusunda 20 saniyelik bir cevap yaz.","That's a good question. I think social media is useful but it can waste time. To sum up, we should use it carefully."],["Rastgele bir konuda kısa cevap yaz.","Well, I'd say autumn because it's calm and colorful."]],
"Telefonda rastgele bir konu seç ve 30 saniye hazırlıksız konuşup kaydet.");

A(40,"İKİNCİ BÜTÜNSEL KONUŞMA","My second full talk","Aşama II'nin finali: 2–3 dakikalık yapılandırılmış bir konuşma.","Mini final 2: arka plan → sebep → zorluk → ders → gelecek → sonuç. 20. dersteki kaydınla karşılaştır; ne kadar geliştiğini göreceksin.","background|reason|Although|If I could|In conclusion",
[["Let me start with a short background.","Kısa bir arka planla başlayayım."],["The reason I'm doing this is...","Bunu yapmamın nedeni..."],["Although it was hard, I learned a lot.","Zor olsa da çok şey öğrendim."],["If I could do it again, I would...","Tekrar yapabilsem..."],["In conclusion, I think...","Sonuç olarak bence..."]],
[[0,"Tell me about something you've achieved."],[1,"Let me start with a short background. I started learning English two years ago.","Kısa bir arka planla başlayayım. İki yıl önce İngilizce öğrenmeye başladım."],[0,"What was difficult?"],[1,"Although it was hard to speak, I practiced every day. In conclusion, it was worth it.","Konuşmak zor olsa da her gün pratik yaptım. Sonuç olarak değdi."]],
[["Let me start with [my story].","Hikâyemle başlayayım."],["The reason I [changed] is...","Değişmemin nedeni..."],["If I could, I would [start earlier].","Yapabilsem daha erken başlardım."],["In conclusion, [it was worth it].","Sonuç olarak değdi."]],
[["2 dakikalık konuşman için 6 cümlelik iskelet yaz.","Let me start with my background. I'm a teacher. The reason I study English is my career. Although it's hard, I learned a lot. In the future I'm going to write in English. In conclusion, it was worth it."],["Konuşmanın bitişini güçlendir.","In conclusion, I believe practice makes progress."]],
"20. dersteki kaydınla bu dersin kaydını karşılaştır; en az 3 gelişmeyi not al.");

A(41,"NEDENLERİ DERİNLEŞTİRİYORUM","One reason is... On top of that...","Bir sorunun tek değil, birkaç nedenini katmanlı olarak açıklıyorsun.","Derin neden-sonuç = neden (due to, one reason) + ek neden (on top of that) + sonuç (as a result). Tek 'because' yerine katmanlı açıklama.","reasons|due to|As a result|explains|On top of",
[["One of the main reasons is...","Ana nedenlerden biri..."],["This is largely due to...","Bu büyük ölçüde ... yüzünden."],["As a result of this, ...","Bunun sonucunda, ..."],["That explains why...","Bu, ... nedenini açıklıyor."],["On top of that, ...","Bunun da üstüne, ..."]],
[[0,"Why is learning a language so hard for adults?"],[1,"One of the main reasons is lack of time. On top of that, adults fear mistakes.","Ana nedenlerden biri zaman eksikliği. Üstüne yetişkinler hatadan korkar."],[0,"What's the result?"],[1,"As a result, they speak less and improve slowly.","Sonuç olarak az konuşur ve yavaş gelişirler."]],
[["One reason is [stress].","Bir neden stres."],["This is due to [lack of sleep].","Bu uykusuzluktan kaynaklanıyor."],["As a result, [prices rose].","Sonuç olarak fiyatlar yükseldi."],["On top of that, [it was late].","Üstüne geç de olmuştu."]],
[["Bir sorunun 2 nedenini ve sonucunu anlat.","One reason is high rent. On top of that, salaries are low. As a result, many people move away."],["Bir olayın nedenini 'That explains why...' ile bağla.","He didn't sleep. That explains why he looks tired."]],
"Gündemdeki bir konuya 'One reason... On top of that... As a result...' yapısını uygula.");

A(42,"GEÇMİŞİN GEÇMİŞİ","Had done","Geçmişteki bir olaydan önce neler olduğunu net biçimde anlatıyorsun.","Geçmişte bir olaydan önce gerçekleşen olay: had + 3. hâl. İki geçmiş olayın sırasını netleştirir: 'the film had started' → önce.","~\\b(had|hadn't|already|before|by the time)\\b",
[["When I arrived, the film had started.","Vardığımda film başlamıştı."],["I had never seen the sea before.","Daha önce denizi hiç görmemiştim."],["She said she had already left.","Zaten ayrıldığını söyledi."],["By the time we called, he had gone.","Aradığımızda o gitmişti."],["What had happened?","Ne olmuştu?"]],
[[0,"Why were you so surprised?"],[1,"Because I had never met him before.","Çünkü onu daha önce hiç görmemiştim."],[0,"Had you spoken on the phone?"],[1,"No, we hadn't. We had only chatted online.","Hayır. Sadece online yazışmıştık."]],
[["I had [finished] before he came.","O gelmeden önce bitirmiştim."],["She had never [tried] it.","O bunu hiç denememişti."],["They had already [left].","Zaten gitmişlerdi."],["Had you [heard] about it?","Bunu duymuş muydun?"]],
[["Bir olaydan önce olanları anlat.","When I got to the station, the train had left."],["Hiç yapmadığın bir şeyi anlat.","I had never flown before that trip."]],
"Hayatından bir dönüm noktası seç: öncesinde ne olmuştu? 3 cümle kur.");

A(43,"KARŞILAŞTIRIYORUM","Better than... not as... as","İki seçeneği, iki yöntemi ya da iki dönemi ince farklarla karşılaştırıyorsun.","Karşılaştırma araçları: -er than, not as ... as, the + comparative..., compared to, by far.","~\\b(than|as|the more|compared to|by far|better|best)\\b",
[["This is far better than that.","Bu ondan çok daha iyi."],["It's not as expensive as I thought.","Düşündüğüm kadar pahalı değil."],["The more I practice, the easier it gets.","Ne kadar pratik yaparsam o kadar kolaylaşıyor."],["Compared to last year, I've improved.","Geçen yıla kıyasla gelişmişim."],["It's the best option by far.","Açık ara en iyi seçenek."]],
[[0,"Is the new method better?"],[1,"It's far better than the old one. The more I use it, the easier it gets.","Eskisinden çok daha iyi. Ne kadar kullanırsam o kadar kolaylaşıyor."],[0,"Is it more expensive?"],[1,"Not at all. It's not as expensive as I thought.","Hiç değil. Düşündüğüm kadar pahalı değil."]],
[["It's [much more] useful than that.","Bundan çok daha yararlı."],["It's not as [hard] as it looks.","Göründüğü kadar zor değil."],["The [earlier], the better.","Ne kadar erken o kadar iyi."],["Compared to [Istanbul], it's quiet.","İstanbul'a kıyasla sessiz."]],
[["İki seçeneği 3 karşılaştırma cümlesiyle kıyasla.","Online lessons are cheaper than face-to-face ones, but they're not as personal. The best option is a mix."],["'The more... the...' yapısı kur.","The more I read, the more I understand."]],
"İki ürün ya da uygulamayı 'not as ... as' ve 'than' ile 4 cümlede karşılaştır.");

A(44,"DOLAYLI ANLATIYORUM","He said that...","Başkasının söylediklerini kendi cümlenle aktarıyorsun.","Başkasının sözünü aktarırken zaman bir adım geriye gider: 'I'm tired' → 'He said he was tired'. Sorularda if / whether ya da soru kelimesi + düz cümle sırası kullanılır.","said|told|asked",
[["He said he was tired.","Yorgun olduğunu söyledi."],["She told me she would call.","Arayacağını söyledi."],["They asked if I needed help.","Yardıma ihtiyacım olup olmadığını sordular."],["He told me not to worry.","Endişelenmememi söyledi."],["I was told that it was cancelled.","İptal edildiğini söylediler."]],
[[0,"What did the manager say?"],[1,"He said the meeting was moved to Monday.","Toplantının Pazartesi'ye alındığını söyledi."],[0,"Did he ask you anything?"],[1,"Yes, he asked if I could attend.","Evet, katılıp katılamayacağımı sordu."]],
[["She said she [was busy].","Meşgul olduğunu söyledi."],["He told me he [would help].","Yardım edeceğini söyledi."],["They asked [where I lived].","Nerede yaşadığımı sordular."],["She told me [to wait].","Beklememi söyledi."]],
[["Duyduğun bir konuşmayı aktar.","My boss said the deadline was Friday. He asked if I could finish earlier."],["Birinin tavsiyesini aktar.","My friend told me to start early."]],
"Bugün biriyle yaptığın bir konuşmayı 'He said... / I said...' ile 3 cümlede özetle.");

A(45,"PİŞMANLIKLAR VE VARSAYIMLAR","If I had known...","Geçmişte farklı olabilecek şeyleri, pişmanlıkları ve çıkarılan dersleri anlatıyorsun.","Geçmişte olmayan şeyi hayal etmek: If + had + 3. hâl, would have + 3. hâl. Pişmanlık: I wish I had... / should have...","~\\b(had|would have|should have|wish|hadn't)\\b",
[["If I had known, I would have helped.","Bilseydim yardım ederdim."],["I wish I had studied more.","Keşke daha çok çalışsaydım."],["If we hadn't left early, we would have missed it.","Erken çıkmasaydık kaçırırdık."],["I should have called you.","Seni aramalıydım."],["What would you have done?","Sen ne yapardın (o durumda)?"]],
[[0,"Why didn't you come to the meeting?"],[1,"If I had known about it, I would have come.","Haberim olsaydı gelirdim."],[0,"I should have told you."],[1,"It's OK. Next time, please send a reminder.","Sorun değil. Bir dahaki sefere hatırlatma gönder."]],
[["If I had [left] earlier, I'd have caught it.","Daha erken çıksaydım yetişirdim."],["I wish I had [asked].","Keşke sorsaydım."],["You should have [told] me.","Bana söylemeliydin."],["If she hadn't [called], we wouldn't have known.","O aramasaydı bilemezdik."]],
[["Geçmişte farklı yapabileceğin bir şeyi yaz.","If I had started earlier, I would have finished on time."],["Birine 'should have' ile yumuşak eleştiri yap.","You should have checked the schedule first."]],
"Bir pişmanlığını hayat dersine çevirerek 'If I had..., I would have...' ile anlat.");

A(46,"KATILIYORUM / KATILMIYORUM","I see your point, but...","Bir görüşe katılıyor ya da saygılı biçimde karşı çıkıyorsun.","Katılmamak saygısızlık değil: önce anladığını göster (I see your point), sonra karşı görüşü yumuşakla sun. 'Yes, but' tekniği.","see your point|agree|not so sure|to some extent|disagree",
[["I see your point, but...","Ne dediğini anlıyorum ama..."],["I couldn't agree more.","Daha çok katılamazdım."],["I'm not so sure about that.","Bundan o kadar emin değilim."],["That's true to some extent.","Bir dereceye kadar doğru."],["I'd have to disagree.","Katılmamak zorundayım."]],
[[0,"I think homework is useless."],[1,"I see your point, but I'd have to disagree.","Ne dediğini anlıyorum ama katılmıyorum."],[0,"Why?"],[1,"It's true to some extent, but practice helps memory.","Bir dereceye kadar doğru ama pratik hafızaya yardım eder."]],
[["I see your point, [but it's expensive].","Anlıyorum ama pahalı."],["I couldn't agree [more].","Daha çok katılamazdım."],["I'm not so sure [about that].","Bundan o kadar emin değilim."],["That's partly true, [but not always].","Kısmen doğru ama her zaman değil."]],
[["Bir görüşe nazikçe karşı çık.","I see your point, but I think the cost is too high."],["Bir görüşe tam katıl ve sebep ekle.","I couldn't agree more. It saves a lot of time."]],
"Bir sosyal medya yorumuna İngilizce yanıt yaz: önce anla, sonra karşı çık.");

A(47,"KARŞI ARGÜMAN","On the other hand...","Bir iddiaya karşı mantıklı bir karşı argüman kuruyor, iki tarafı da dengeli sunuyorsun.","Argüman = iddia + gerekçe; karşı argüman = bağlaç (however, on the other hand) + karşı gerekçe. Kişiye değil fikre karşı çık.","On the other hand|However|yet|argue|evidence|otherwise",
[["On the other hand, ...","Öte yandan, ..."],["However, there is a risk.","Ancak bir risk var."],["That may be true, yet...","Bu doğru olabilir, ama..."],["Some people argue that...","Bazı insanlar ... savunur."],["The evidence suggests otherwise.","Kanıtlar aksini gösteriyor."]],
[[0,"Everyone should learn coding."],[1,"Some people argue that it's essential. However, not everyone needs it.","Bazıları şart olduğunu savunur. Ancak herkesin ihtiyacı yok."],[0,"But it helps in every job."],[1,"That may be true, yet it depends on the field.","Bu doğru olabilir ama alana bağlı."]],
[["On the other hand, [it's cheaper].","Öte yandan daha ucuz."],["However, [there are exceptions].","Ancak istisnalar var."],["Some people argue [that it's unfair].","Bazıları haksız olduğunu savunur."],["The data suggests [otherwise].","Veriler aksini gösteriyor."]],
[["Bir iddia için bir karşı argüman yaz.","Many say cars are essential. However, in big cities public transport is faster."],["İki taraflı bir görüşü 3 cümlede ver.","On one hand, remote work is flexible. On the other hand, it can be lonely."]],
"Bir fikre hem lehinde hem aleyhinde 1'er cümle söyle.");

A(48,"İKNA EDİYORUM","Let me explain why...","Dinleyicini mantık ve duyguyla bir fikre ya da öneriye ikna etmeye çalışıyorsun.","İkna = dikkat çek (Imagine...) + kanıt (Research shows...) + fayda + öneri. Duyguyu ve mantığı birleştir.","explain|Imagine|Research|recommend|agree",
[["Let me explain why this matters.","Bunun neden önemli olduğunu açıklayayım."],["Imagine if we didn't act now.","Şimdi harekete geçmesek ne olurdu, hayal et."],["Research shows that...","Araştırmalar ... gösteriyor."],["That's exactly why I recommend...","Tam da bu yüzden ... öneriyorum."],["Wouldn't you agree that...?","... konusunda katılmaz mısınız?"]],
[[0,"Why should I join your project?"],[1,"Let me explain why. Research shows that teamwork saves time.","Nedenini açıklayayım. Araştırmalar ekip çalışmasının zaman kazandırdığını gösteriyor."],[0,"Hmm, what's in it for me?"],[1,"Wouldn't you agree that learning together is easier?","Birlikte öğrenmenin daha kolay olduğuna katılmaz mısınız?"]],
[["Research shows that [practice works].","Araştırmalar pratiğin işe yaradığını gösteriyor."],["Imagine if [you could speak freely].","Özgürce konuşabildiğini hayal et."],["That's why I recommend [this plan].","Bu yüzden bu planı öneriyorum."],["Wouldn't you agree [it's worth it]?","Buna değdiğine katılmaz mısın?"]],
[["Birini bir alışkanlığa ikna eden 4 cümlelik mini konuşma yaz.","Imagine speaking English without fear. Research shows daily practice builds confidence. That's why I recommend 15 minutes a day. Wouldn't you agree it's worth trying?"],["Bir ürünü ya da fikri tek cümlede sat.","This app will save you an hour every day."]],
"Bir arkadaşını bir şeye ikna etmek için 45 saniyelik ses kaydı yap.");

A(49,"TEKLİF VE PAZARLIK","How about we meet halfway?","Fiyat, koşul ya da zaman konusunda karşılıklı teklifle anlaşmaya varıyorsun.","Pazarlık: sınır belirt (out of my budget) → teklif (How about...) → şartlı taviz (I'd be willing to... if...) → anlaşma (Let's agree).","halfway|budget|better price|willing|agree",
[["How about we meet halfway?","Ortada buluşsak nasıl olur?"],["That's out of my budget.","Bu bütçemin dışında."],["Could you do a better price?","Daha iyi bir fiyat yapabilir misiniz?"],["I'd be willing to..., if...","... eğer ... ise yapmaya razıyım."],["Let's agree on that.","Buna anlaşalım."]],
[[1,"This is a bit out of my budget. Could you do a better price?","Bu bütçemin biraz dışında. Daha iyi bir fiyat yapabilir misiniz?"],[0,"I can lower it by ten percent."],[1,"I'd be willing to buy two if you make it fifteen.","İkisini almaya razıyım, eğer yüzde on beş yaparsanız."],[0,"Let's meet halfway: twelve percent."]],
[["How about [we split it]?","Bölüşsek nasıl olur?"],["I'd be willing to [pay more], if [it's faster].","Daha hızlıysa daha fazla ödemeye razıyım."],["That's [out of] my budget.","Bütçemin dışında."],["Let's [agree] on [this].","Bunda anlaşalım."]],
[["Bir satıcıyla 3 cümlelik pazarlık yaz.","It's out of my budget. Could you do a better price? I'd buy two if you lower it."],["Bir iş teklifinde şart öner.","I'd be happy to join if the hours are flexible."]],
"Hayali bir ilan için pazarlık mesajını İngilizce yaz.");

A(50,"TARTIŞMAYI YÖNETİYORUM","Let's go back to the main issue","Hararetli bir tartışmada söz hakkını koruyor, konuyu netleştiriyor ve tonu düşürüyorsun.","Tartışmada söz hakkı ve ton yönetimi: söz al (Can I add...), netleştir (To clarify...), odağı koru (Let's go back...), gerginliği düşür (agree to disagree).","Let me finish|add something|go back|agree to disagree|clarify",
[["Let me finish my point.","Düşüncemi bitireyim."],["Can I add something here?","Burada bir şey ekleyebilir miyim?"],["Let's go back to the main issue.","Ana konuya dönelim."],["Let's agree to disagree.","Farklı düşünmekte anlaşalım."],["To clarify, I meant...","Açıklığa kavuşturmak için, demek istediğim..."]],
[[0,"That makes no sense!"],[1,"Let me finish my point. To clarify, I meant the cost.","Düşüncemi bitireyim. Açıklığa kavuşturmak için maliyeti kastettim."],[0,"But you're ignoring the main problem."],[1,"Let's go back to the main issue, then. If we can't agree, let's agree to disagree.","Ana konuya dönelim o zaman. Anlaşamazsak farklı düşünmekte anlaşalım."]],
[["Can I [add something] here?","Burada bir şey ekleyebilir miyim?"],["Let's [go back] to [the plan].","Plana dönelim."],["To clarify, [I mean the second one].","Açıklarsam, ikincisini kastediyorum."],["Let's agree to [disagree].","Farklı düşünmekte anlaşalım."]],
[["Sözün kesilince söz hakkını geri almak için 2 cümle yaz.","Sorry, let me finish my point. Then I'd like to hear your view."],["Gergin bir tartışmayı sakinleştir.","Let's take a step back and look at the facts."]],
"Bir tartışmayı (haber, yorum) 'Let's go back to...' ile sakin tonda toparlayan 3 cümle kur.");

A(51,"KELİMEYİ BULAMAZSAM","Repair strategies","Konuşurken takıldığında akışı bozmadan kendini düzeltiyor ve yardım istiyorsun.","Takılmak normal; akışı koruyan kalıplar var. Strateji: soruyu sor → tarif et → yeniden ifade et. 22. dersteki tarif becerisini akıcılığı korumak için kullan.","word for|How do you say|I mean|train of thought|another way",
[["What's the word for...?","... için kelime ne?"],["How do you say ... in English?","İngilizcede ... nasıl denir?"],["I mean...","Yani..."],["Sorry, I lost my train of thought.","Pardon, düşünce akışımı kaybettim."],["Let me put it another way.","Başka şekilde söyleyeyim."]],
[[1,"It's a kind of... How do you say it?","Bir tür... Nasıl denir?"],[0,"A tool?"],[1,"Yes! Sorry, let me put it another way. It's a tool to fix things.","Evet! Pardon, başka şekilde söyleyeyim. Bir şeyleri tamir etmek için bir alet."],[0,"A screwdriver!"]],
[["What's the word for [it]?","Bunun kelimesi ne?"],["I mean, [it's too late].","Yani çok geç."],["Let me put it [simply].","Basitçe söyleyeyim."],["Sorry, I lost [my train of thought].","Pardon, düşünce akışımı kaybettim."]],
[["Takıldığın bir anda kullanacağın 3 cümle yaz.","What's the word for...? Let me put it another way. I lost my train of thought."],["Bir kavramı daha basit söyle.","I mean, it's easy to use."]],
"Konuşurken takıldığında bu kalıplardan birini hemen kullan ve hangisini kullandığını not et.");

A(52,"DOĞAL TEPKİLER","Really? No way!","Karşındakinin sözüne doğal tepkiler vererek sohbeti canlı tutuyorsun.","Doğal konuşma = bilgi + tepki. Kısa tepkiler akıcılık hissini artırır. Ton ve vurgu önemli: duyguyu sesine ekle.","Really|No way|makes sense|know what you mean|shame|Oh no",
[["Really? That's amazing!","Gerçekten mi? Harika!"],["No way!","Yok artık!"],["That makes sense.","Mantıklı."],["I know what you mean.","Ne demek istediğini anlıyorum."],["Oh, that's a shame.","Yazık olmuş."]],
[[0,"I finally got the job!"],[1,"No way! That's amazing! Congratulations!","Yok artık! Harika! Tebrikler!"],[0,"But I have to move."],[1,"Oh, that sounds stressful. I know what you mean.","Stresli olmalı. Ne demek istediğini anlıyorum."]],
