A(53,"ANEKDOT ANLATIYORUM","You won't believe what happened","Başından geçen ilginç bir olayı ilgi çekici bir anekdota çeviriyorsun.","İyi anekdot: giriş (You won't believe...) → başlangıç (It all started when...) → sürpriz (The funny thing is...) → kısa sonuç (Long story short...).","believe|It all started|funny thing|Long story short|Anyway",
[["You won't believe what happened.","Ne olduğuna inanmayacaksın."],["It all started when...","Hepsi ... ile başladı."],["The funny thing is...","Komik olan şu ki..."],["Long story short, ...","Uzun lafın kısası, ..."],["Anyway, ...","Neyse, ..."]],
[[0,"You look excited. What happened?"],[1,"You won't believe what happened! It all started when I missed my train.","Ne olduğuna inanmayacaksın! Her şey treni kaçırmamla başladı."],[0,"And then?"],[1,"Long story short, I met an old friend. The funny thing is we live in the same building.","Uzun lafın kısası eski bir arkadaşla karşılaştım. Komik olan aynı binada yaşıyoruz."]],
[["You won't believe [this].","Buna inanmayacaksın."],["It all started when [I lost my keys].","Her şey anahtarlarımı kaybetmemle başladı."],["The funny thing is [he was right].","Komik olan, haklıydı."],["Long story short, [we won].","Uzun lafın kısası, kazandık."]],
[["Kısa bir anekdot yaz (5 cümle).","You won't believe what happened. It all started when I forgot my umbrella. Suddenly it started to rain. Long story short, a stranger shared his umbrella and we became friends."],["Anekdotuna komik bir kapanış ekle.","Anyway, now I always carry two umbrellas."]],
"Bu haftaki bir olayı bir arkadaşına anekdot gibi anlat (ses kaydı).");

A(54,"HIZLI DÜŞÜNÜYORUM","Off the top of my head","Beklenmedik bir soruya kısa sürede düzenli ve doğal cevap veriyorsun.","Hız = kalıp + ilk fikir + 1 sebep. Mükemmel cevap arama; ilk fikri 2 cümleyle destekle.","comes to mind|top of my head|If I had to|Honestly|never thought",
[["The first thing that comes to mind is...","Aklıma gelen ilk şey..."],["Off the top of my head, ...","Aklıma ilk gelenle, ..."],["If I had to choose, I'd say...","Seçmek zorunda olsam ... derdim."],["Honestly, ...","Dürüst olmak gerekirse, ..."],["I've never thought about it, but...","Hiç düşünmemiştim ama..."]],
[[0,"Quick question: best advice you've ever received?"],[1,"Off the top of my head, 'Start before you're ready.'","Aklıma ilk gelen, 'Hazır olmadan başla.'"],[0,"Why that one?"],[1,"Honestly, it changed how I work.","Dürüst olmak gerekirse çalışma biçimimi değiştirdi."]],
[["Off the top of my head, [I'd say two].","Aklıma ilk gelenle, ikiyi söylerdim."],["If I had to choose, [I'd pick A].","Seçmek zorunda olsam A'yı seçerdim."],["Honestly, [I'm not sure].","Dürüst olmak gerekirse emin değilim."],["The first thing that comes to mind is [family].","Aklıma gelen ilk şey aile."]],
[["Hızlı: 'En sevdiğin yemek?' 2 cümle yaz.","The first thing that comes to mind is lentil soup. It's simple and comforting."],["'Bir günlük sınırsız bütçe' sorusunu hızlı cevapla.","If I had to choose, I'd spend it on a trip."]],
"Kendine 5 rastgele soru sor ve her birine 10 saniyede sesli cevap ver.");

A(55,"AKIŞI KORUYORUM","Speaking of which...","Uzun konuşmada konuyu kaybetmeden örneklerle ilerliyor ve ana mesaja dönüyorsun.","Uzun konuşmada akışı sürdürmek: geçişler (speaking of which), örnek (let me give you an example), ana mesaja dönüş (what I'm trying to say is...).","As I was saying|reminds me|Speaking of|example|trying to say",
[["As I was saying, ...","Dediğim gibi, ..."],["That reminds me of...","Bu bana ... hatırlattı."],["Speaking of which, ...","Lafı gelmişken, ..."],["Let me give you an example.","Bir örnek vereyim."],["What I'm trying to say is...","Anlatmaya çalıştığım şu..."]],
[[0,"So, how did the project go?"],[1,"Let me give you an example. Last month we tried a new method.","Bir örnek vereyim. Geçen ay yeni bir yöntem denedik."],[0,"And did it work?"],[1,"Speaking of which, it saved us two hours. What I'm trying to say is it's worth it.","Lafı gelmişken bize iki saat kazandırdı. Demek istediğim buna değer."]],
[["As I was saying, [it's simple].","Dediğim gibi, basit."],["That reminds me [of a story].","Bu bana bir hikâyeyi hatırlattı."],["Speaking of which, [have you seen it]?","Lafı gelmişken, gördün mü?"],["What I'm trying to say is [be patient].","Demek istediğim sabırlı ol."]],
[["1 dakikalık konuşmada kullanacağın 4 geçiş cümlesini yaz.","Let me give you an example. That reminds me of... As I was saying... What I'm trying to say is..."],["Bir görüşü örnekle destekle.","Let me give you an example: last week my students finished a project together."]],
"Bir konu seç ve 1 dakika duraksamadan konuş; kaydedip kaç kez durduğunu say.");

A(56,"UZMAN OLARAK TANITIYORUM","I specialize in...","Kendi uzmanlık alanında kendini ve çalışmanı profesyonel biçimde tanıtıyorsun.","Uzmanlık tanıtımı: alan (I specialize in) + geçmiş/süre + proje + fark. Bu dersten itibaren içerik senin alanından gelmeli.","specialize|background|field|projects|sets me apart",
[["I specialize in...","... alanında uzmanım."],["My background is in...","Geçmişim ... alanında."],["I've been working in this field for...","... yıldır bu alanda çalışıyorum."],["One of my main projects is...","Ana projelerimden biri..."],["What sets me apart is...","Beni ayıran şey..."]],
[[0,"What do you do exactly?"],[1,"I specialize in teaching English to adults. My background is in education.","Yetişkinlere İngilizce öğretiminde uzmanım. Geçmişim eğitim alanında."],[0,"What makes you different?"],[1,"What sets me apart is my focus on real conversation.","Beni ayıran şey gerçek konuşmaya odaklanmam."]],
[["I specialize in [design].","Tasarımda uzmanım."],["I've been working in [this field] for [six years].","Altı yıldır bu alanda çalışıyorum."],["My background is in [engineering].","Geçmişim mühendislikte."],["What sets me apart is [my patience].","Beni ayıran şey sabrım."]],
[["Kendi uzmanlığını 4 cümleyle tanıt.","I specialize in language teaching. I've been working in education for ten years. One of my projects is an online platform. What sets me apart is my focus on speaking."],["Alanındaki bir kavramı tek cümleyle tanımla.","Task-based learning means students learn by completing real tasks."]],
"Kendi alanında 30 saniyelik bir tanıtım konuşması (elevator pitch) hazırla ve kaydet.");

A(57,"TEKNİK BİR ŞEYİ SADE ANLATIYORUM","In simple terms...","Alanından teknik bir kavramı uzman olmayan birine sade ve anlaşılır biçimde anlatıyorsun.","Uzman dilini kolaylaştırma: tanım (in simple terms) + benzetme (think of it as) + örnek + tekrar (in other words). Jargonu sade bir cümleyle değiştir.","simple terms|Think of|works like|imagine|other words",
[["In simple terms, it means...","Basitçe, ... demek."],["Think of it as...","Bunu ... gibi düşün."],["It works like this:","Şöyle çalışır:"],["For example, imagine...","Örneğin hayal et..."],["In other words, ...","Başka deyişle, ..."]],
[[0,"What does 'comprehensible input' mean?"],[1,"In simple terms, it means language you can mostly understand.","Basitçe, çoğunu anlayabildiğin dil demek."],[0,"Why is it important?"],[1,"Think of it as food for your brain. In other words, you need it to grow.","Beynin için yemek gibi düşün. Başka deyişle büyümek için gerekli."]],
[["In simple terms, [it's a plan].","Basitçe bir plan."],["Think of it as [a map].","Bunu bir harita gibi düşün."],["It works like this: [you click, then it saves].","Şöyle çalışır: tıklarsın, kaydeder."],["In other words, [it's faster].","Başka deyişle daha hızlı."]],
[["Alanından bir kavramı 'Think of it as...' ile açıkla.","Think of a verb as the engine of a sentence. Without it, nothing moves."],["Alanından jargonu sade cümleyle ver.","In simple terms, feedback means telling someone how to improve."]],
"Alanından bir terimi 11 yaşında birine anlatır gibi sesli açıkla.");

A(58,"SUNUM YAPIYORUM","Today I'm going to talk about...","Kısa bir sunum yapıyorsun: açılış, ana noktalar, geçişler ve kapanış.","Sunum iskeleti: açılış → ana mesaj → 3 nokta → geçişler → kapanış. Yavaş, net, kısa cümleler ve duraklamalar kullan.","going to talk|start by|As you can see|Moving on|wrap up",
[["Today I'm going to talk about...","Bugün ... hakkında konuşacağım."],["Let me start by...","...ile başlayayım."],["As you can see on this slide, ...","Bu slaytta gördüğünüz gibi, ..."],["Moving on to the next point, ...","Bir sonraki noktaya geçersek, ..."],["To wrap up, ...","Toparlarsak, ..."]],
[[1,"Good morning, everyone. Today I'm going to talk about learning habits.","Günaydın herkese. Bugün öğrenme alışkanlıkları hakkında konuşacağım."],[0,"(The audience is listening.)"],[1,"As you can see on this slide, small steps work best. To wrap up, practice daily.","Bu slaytta gördüğünüz gibi küçük adımlar en iyisi. Toparlarsak her gün pratik yapın."],[0,"Thank you! Any questions?"]],
[["Today I'm going to talk about [our results].","Bugün sonuçlarımız hakkında konuşacağım."],["Let me start by [giving some background].","Biraz arka planla başlayayım."],["As you can see, [sales rose].","Gördüğünüz gibi satışlar arttı."],["To wrap up, [there are three points].","Toparlarsak üç nokta var."]],
[["Sunumun açılış ve kapanış cümlelerini yaz.","Good morning, everyone. Today I'm going to talk about learning habits. ... To wrap up, small daily steps matter most."],["Bir slayt için 2 cümle yaz.","As you can see, the numbers rose by twenty percent. This shows our method works."]],
"Kendi alanında 2 dakikalık mini sunumu telefona kaydet (açılış, üç nokta, kapanış).");

A(59,"SORU-CEVAP YÖNETİYORUM","That's a great question","Sunum sonrası sorulara sakin, net ve güvenli biçimde cevap veriyorsun.","Soru-cevap: soruyu onayla → gerekirse netleştir → kısa cevap ver → kontrol et. Bilmediğinde dürüst ol: 'I'll get back to you.'","great question|clarify|exact figures|answer your question|get back",
[["That's a great question.","Harika bir soru."],["Could you clarify what you mean?","Ne demek istediğinizi açar mısınız?"],["I don't have the exact figures, but...","Kesin rakamlar yanımda yok ama..."],["Does that answer your question?","Sorunuzu yanıtladı mı?"],["I'll get back to you on that.","Bu konuda size dönüş yapacağım."]],
[[0,"How many students have you taught?"],[1,"That's a great question. I don't have the exact figures, but it's over a thousand.","Harika soru. Kesin rakamlar yanımda yok ama binin üzerinde."],[0,"Is that all online?"],[1,"Mostly. Does that answer your question?","Çoğunlukla. Sorunuzu yanıtladı mı?"]],
[["That's a [good] question.","İyi bir soru."],["Could you [repeat] the question?","Soruyu tekrar eder misiniz?"],["I'll get back to you [tomorrow].","Yarın size dönerim."],["Does that [make sense]?","Mantıklı geldi mi?"]],
[["Zor bir soruya güvenli cevap yaz.","That's a great question. I don't have the exact data, but I'll get back to you by email."],["Soruyu anlamadığında netleştir.","Sorry, could you clarify what you mean by 'effective'?"]],
"Bir arkadaşından sana 5 zor soru sormasını iste; cevaplarını kaydet.");

A(60,"FİNAL: KENDİ ALANINDA SERBEST KONUŞMA","My field, my voice","Kendi alanında 3–5 dakika serbest konuşuyorsun: tanıt, anlat, örnekle, karşı görüşü ele al, özetle, soru al.","Final yapısı: tanıt → anlat → örnekle → karşı görüşü ele al → özetle → soru al. Artık kalıplar sende; içerik senin.","walk you through|learned|key is|Looking back|questions",
[["Let me walk you through my work.","Size çalışmamı adım adım anlatayım."],["What I've learned is...","Öğrendiğim şu..."],["If you ask me, the key is...","Bana sorarsanız anahtar..."],["Looking back, I would...","Geriye dönüp bakınca ..."],["I'm happy to take any questions.","Sorularınızı almaktan memnuniyet duyarım."]],
[[0,"Tell us about your work and what you've learned."],[1,"Let me walk you through my work. What I've learned is that practice beats perfection.","Çalışmamı anlatayım. Öğrendiğim şu ki pratik mükemmelliği yener."],[0,"What would you do differently?"],[1,"Looking back, I would start speaking earlier. I'm happy to take any questions.","Geriye dönüp bakınca daha erken konuşmaya başlardım. Sorularınızı almaktan memnuniyet duyarım."]],
[["Let me walk you through [the process].","Süreci adım adım anlatayım."],["What I've learned is [to listen].","Öğrendiğim dinlemek."],["If you ask me, the key is [consistency].","Bana sorarsan anahtar süreklilik."],["Looking back, I would [change one thing].","Geriye bakınca bir şeyi değiştirirdim."]],
[["Final konuşmasının iskeletini yaz (6 madde).","Intro. Background. Main idea. Example. Counterargument. Conclusion."],["Kapanış cümleni yaz.","Thank you for listening. I'm happy to take any questions."]],
"Final konuşmanı 3–5 dakika kaydet ve 20. ile 40. ders kayıtlarınla karşılaştır. Üç kaydı arka arkaya dinle.");

const save=()=>{try{localStorage.setItem('ozdem',JSON.stringify(S))}catch(e){}};
const dn=n=>Object.keys(S.done[n]||{}).length;
const mark=(n,ph)=>{(S.done[n]=S.done[n]||{})[ph]=1;save()};
let CUR=(location.hash&&location.hash.length>1)?location.hash:'#/';
function nav(h){CUR=h;try{history.pushState(null,'',h)}catch(e){}route()}
const go=(n,ph)=>{nav('#/l/'+n+'/'+ph)};
let TM=null;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---- speech ---- */
function voice(){if(!('speechSynthesis' in window))return null;const vs=speechSynthesis.getVoices();return vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
function say(t,r,cb){if(!('speechSynthesis' in window)){if(cb)cb();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[\[\]]/g,''));u.lang='en-US';const v=voice();if(v)u.voice=v;u.rate=r||S.rate||1;if(cb){u.onend=cb;u.onerror=cb}speechSynthesis.speak(u)}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,+b.dataset.rate||0)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(cb){if(!SR){cb(null,true);return}const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>cb(null);r.onnoresult=()=>cb(null);try{r.start()}catch(e){cb(null)}}
function sim(heard,target){const A=norm(heard).split(' '),B=norm(target).split(' ').filter(Boolean);if(!B.length)return 0;return Math.round(B.filter(x=>A.includes(x)).length/B.length*100)}

/* ---- review pool ---- */
function due(){const now=Date.now(),out=[];for(const k in S.box){if(S.box[k].d<=now){const [n,i]=k.split('-').map(Number);const l=L[n-1];if(l&&l.c[i])out.push({k,en:l.c[i][0],tr:l.c[i][1]})}}return out}
function updBadge(){const d=due().length,b=$('#bd');b.hidden=!d;b.textContent=d}

/* ---- home ---- */
function nextUp(){for(const l of L){if(dn(l.n)<10){let i=0;while(S.done[l.n]&&S.done[l.n][i])i++;return[l.n,i]}}return[60,0]}
function home(){
 const tot=Object.keys(S.done).reduce((a,k)=>a+dn(k),0),nx=nextUp();
 app.innerHTML=`<section class="hero"><p class="eyebrow">60 ders · 3 edinim aşaması · 10 adımlı döngü</p>
 <h1>Öz Dil Edinim Modeli</h1>
 <p class="lead">İngilizceyi kural ezberleyerek değil, <b>edinerek</b> öğren: anla, fark et, duy, taklit et, hatırla, üret, etkileş, değiştir, hayata taşı, otomatikleştir.</p>
 <div class="flow">${PH.map(p=>'<span>'+p[0]+'</span>').join('<i>→</i>')}</div>
 <div class="cta"><a class="btn" href="#/l/${nx[0]}/${nx[1]}" style="--c:var(--s1)">${tot?'Kaldığın yerden devam et':'Derse başla'} · Ders ${nx[0]}</a><span class="stat">${tot}/${L.length*10} adım tamamlandı · ${due().length} tekrar kartı bekliyor</span></div></section>
 ${ST.map((s,si)=>{const ls=L.filter(l=>stageOf(l.n)===s);const d=ls.reduce((a,l)=>a+dn(l.n),0);const pc=Math.round(d/(ls.length*10)*100);
 return `<section class="stage" style="--c:var(${s.col})"><div class="sh"><div class="rn">${s.n}</div><div><h2>AŞAMA ${s.n} — ${s.name}</h2><p>${s.range}. ${s.goal}</p></div><div class="pg">%${pc}<div class="bar"><b style="width:${pc}%"></b></div><a class="ghost" href="#/s/${si+1}" style="font-size:12px">Aşama finali →</a></div></div>
 ${LV.filter(v=>v.st===si+1).map(v=>`<div class="lv"><h3><em>DÜZEY ${v.id}</em>${v.name.toUpperCase()}</h3><div class="grid">${L.filter(l=>l.n>=v.a&&l.n<=v.b).map(l=>{let f=0;while(S.done[l.n]&&S.done[l.n][f])f++;if(f>9)f=0;return `<a class="tile" href="#/l/${l.n}/${f}"><b>${l.n}</b><span>${l.t}</span><em>${PH.map((p,i)=>`<s class="${S.done[l.n]&&S.done[l.n][i]?'on':''}"></s>`).join('')}</em></a>`}).join('')}</div></div>`).join('')}</section>`}).join('')}
 <details class="note"><summary>Öğretmen notu: modelin dayanakları</summary><ul>
 <li><b>Kalıp temelli edinim:</b> Dersler tek tek kelime/kural değil, işe yarayan hazır iletişim blokları (chunks) üzerine kurulu.</li>
 <li><b>Fark etme (noticing):</b> Her derste kalıp vurgulanır, öğrenci önce örüntüyü yakalar.</li>
 <li><b>Anlaşılır girdi + taklit:</b> Dinleme ve gölgeleme (shadowing) ritim ve vurguyu otomatikleştirir.</li>
 <li><b>Aralıklı geri çağırma:</b> HATIRLA kartları Leitner kutularıyla 1-3-7-14-30 gün aralıklarla geri gelir.</li>
 <li><b>Çıktı ve etkileşim:</b> ÜRET, ETKİLEŞ ve DEĞİŞTİR adımları öğrenciyi zorlanabilir çıktıya iter.</li>
 <li><b>Gerçek hayat transferi:</b> Her ders bir günlük görevle biter.</li>
 <li><i>Referans (yalnızca öğretmen için):</i> Aşama I ≈ A1–A2, Aşama II ≈ B1–B1+, Aşama III ≈ B2–C1. Navigasyon bu etiketlere dayanmaz.</li></ul></details>
 <footer>İlerlemen ve notların yalnızca bu tarayıcıda saklanır. <button class="ghost" id="rs">İlerlemeyi sıfırla</button></footer>`;
 $('#rs').onclick=()=>{if(confirm('Tüm ilerleme, kartlar ve notlar silinsin mi?')){S={done:{},box:{},prod:{},mis:{},rate:1};save();home();updBadge()}};
}

/* ---- lesson shell ---- */
function lesson(n,ph){
 const l=L[n-1];if(!l){home();return}
 ph=Math.max(0,Math.min(9,ph||0));const st=stageOf(n);
 app.innerHTML=`<div style="--c:var(${st.col})"><div class="lh"><a href="#/">← Yol haritası</a><span class="num">Ders ${n} · Aşama ${st.n}</span><h1>${l.t}</h1><p>${l.e}</p></div>
 <div class="steps">${PH.map((p,i)=>`<a href="#/l/${n}/${i}" class="step ${i===ph?'on':''} ${S.done[n]&&S.done[n][i]?'ok':''}"><b>${i+1}</b>${p[0]}</a>`).join('')}</div>
 <section class="phase"><div class="pi"><h2>${ph+1}. ${PH[ph][0]}</h2><p>${PH[ph][1]}</p></div><div id="pb"></div></section>
 <div class="nav2"><span>${ph>0?`<a class="ghost" href="#/l/${n}/${ph-1}">← ${PH[ph-1][0]}</a>`:(n>1?`<a class="ghost" href="#/l/${n-1}/0">← Ders ${n-1}</a>`:'')}</span><span>${ph<9?`<a class="ghost" href="#/l/${n}/${ph+1}">${PH[ph+1][0]} →</a>`:''}</span></div></div>`;
 R[ph]($('#pb'),l,n);
}
function nxt(n,ph){mark(n,ph);if(ph<9)go(n,ph+1);else{toast('Ders '+n+' tamamlandı ✓');if(n<60)go(n+1,0);else nav('#/')}}

/* ---- quiz ---- */
function quiz(el,l,done){
 const qs=shuffle(l.c).slice(0,4);let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){el.innerHTML=`<p class="res"><b>${ok}/${qs.length}</b> doğru. ${ok===qs.length?'Kalıbı yakaladın.':'Kalıbı bir daha dinleyip devam et.'}</p><button class="btn" id="qd">Devam →</button>`;$('#qd',el).onclick=done;return}
  const q=qs[i],opts=shuffle([q].concat(shuffle(l.c.filter(x=>x!==q)).slice(0,2)));
  el.innerHTML=`<p class="qh">Mini test ${i+1}/${qs.length} — Bu durumda hangisini söylersin?</p><div class="q">${esc(q[1])}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${hl(o[0])}</button>`).join('')}</div><div id="qn"></div>`;
  el.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>{
   if(el.querySelector('.good'))return;const good=opts[k]===q;if(good)ok++;
   b.classList.add(good?'good':'bad');el.querySelectorAll('.opt').forEach((x,j)=>{if(opts[j]===q)x.classList.add('good')});
   say(q[0]);$('#qn',el).innerHTML='<button class="btn" id="qx">Sonraki →</button>';$('#qx',el).onclick=()=>{i++;show()}});
 };show();
}

/* ---- cards (Leitner) ---- */
const DAYS=[0,1,3,7,14,30];
function cards(el,list,end,endLabel){
 let i=0,ok=0;
 const show=()=>{
  if(i>=list.length){el.innerHTML=`<div class="card"><h3>${ok}/${list.length}</h3><p class="res">Doğru hatırlanan kartlar daha seyrek, kaçırdıkların yakında yeniden gelir.</p><button class="btn" id="ce">${endLabel||'Devam →'}</button></div>`;$('#ce',el).onclick=end;updBadge();return}
  const c=list[i];
  el.innerHTML=`<div class="card"><div class="prog">${i+1}/${list.length}</div><div class="q">${esc(c.tr)}</div><input type="text" id="ans" placeholder="İngilizcesini yaz${SR?' ya da 🎤 ile söyle':''}…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div><button class="btn" id="chk">Kontrol et</button>${SR?'<button class="ghost" id="mic">🎤 Söyle</button>':''}<button class="ghost" id="shw">Bilmiyorum</button></div><div id="fb"></div></div>`;
  const inp=$('#ans',el);inp.focus();
  const fin=good=>{
   if(good)ok++;const k=c.k,b=good?Math.min(5,((S.box[k]||{}).b||0)+1):0;S.box[k]={b,d:Date.now()+DAYS[b]*864e5};save();
   $('#fb',el).innerHTML=`<div class="ans"><small>${good?'Doğru ✓':'Doğrusu'}</small><b style="font-size:20px">${esc(c.en)}</b></div><button class="btn" id="cn">Sonraki →</button>`;
   say(c.en);$('#cn',el).onclick=()=>{i++;show()};$('#cn',el).focus();$('#chk',el).disabled=true;$('#shw',el).disabled=true};
  const check=()=>{if(!$('#cn',el))fin(norm(inp.value)===norm(c.en))};
  $('#chk',el).onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){$('#cn',el)?$('#cn',el).click():check()}};
  $('#shw',el).onclick=()=>{if(!$('#cn',el))fin(false)};
  if(SR)$('#mic',el).onclick=()=>{$('#mic',el).textContent='🎧 Dinliyorum…';listen(t=>{$('#mic',el).textContent='🎤 Söyle';if(t){inp.value=t;check()}})};
 };show();
}

/* ---- extras ---- */
function storyBox(l){if(!l.story)return'';return `<div class="card"><div class="prog">Mini hikâye · dinle ve soruları cevapla</div><p style="font-size:18px;line-height:1.6">${hl(l.story[0],l.pat)}</p><button class="pill" data-say="${esc(l.story[0])}">🔊 Hikâyeyi dinle</button> <button class="pill" id="trb">Türkçesi</button><div id="trx"></div>${l.story[2].map((q,i)=>`<div class="cue" style="margin-top:10px"><b>${esc(q[0])}</b> <button class="ghost" data-q="${i}">Cevabı göster</button><div id="qa${i}"></div></div>`).join('')}</div>`}
function bindStory(el,l){if(!l.story)return;const t=$('#trb',el);if(t)t.onclick=()=>{$('#trx',el).innerHTML='<div class="ans"><small>Türkçesi</small>'+esc(l.story[1])+'</div>'};el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#qa'+b.dataset.q,el).innerHTML='<div class="ans">'+esc(l.story[2][+b.dataset.q][1])+'</div>'})}
function hataBox(l){if(!l.hata)return'';return `<div class="card"><div class="prog">Sık yapılan hatalar</div>${l.hata.map(h=>`<div class="ans" style="margin:8px 0"><small>✗ Yanlış</small><s>${esc(h[0])}</s><br><small>✓ Doğru</small><b>${hl(h[1],l.pat)}</b><br><span class="qh">${esc(h[2])}</span></div>`).join('')}</div>`}
const allD=l=>l.d.concat(l.d2||[]);
function recorder(el){
 el.innerHTML='<div class="card"><div class="prog">Sesli kayıt (yalnızca tarayıcında kalır)</div><button class="pill" id="rc">⏺ Kaydet</button> <span id="rs2" class="qh"></span><audio id="au" controls hidden style="width:100%;margin-top:8px"></audio></div>';
 let mr=null,ch=[];const b=$('#rc',el);
 b.onclick=async()=>{if(mr&&mr.state==='recording'){mr.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){$('#rs2',el).textContent='Tarayıcın kaydı desteklemiyor; telefonunun ses kaydedicisini kullan.';return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);ch=[];mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const a=$('#au',el);a.src=URL.createObjectURL(new Blob(ch));a.hidden=false;b.textContent='⏺ Yeniden kaydet';$('#rs2',el).textContent='Dinle, sonra örnekle karşılaştır.'};
   mr.start();b.textContent='⏹ Durdur';$('#rs2',el).textContent='Kaydediyorum…'}catch(e){$('#rs2',el).textContent='Mikrofon izni verilmedi.'}}}

/* ---- phases ---- */
const R=[];
R[0]=(el,l,n)=>{
 el.innerHTML=`<div class="sit">${l.s}</div><div class="chunks">${l.c.map(c=>`<button class="chunk" data-say="${esc(c[0])}"><span class="en">${hl(c[0],l.pat)}</span><span class="tr">${esc(c[1])}</span><i>🔊</i></button>`).join('')}</div><p class="qh">Kartlara dokun: sesi dinle. Çeviriye değil, durumla eşleştirmeye odaklan.</p>${storyBox(l)}<button class="btn" id="go">Anladım, devam →</button>`;
 bindStory(el,l);$('#go',el).onclick=()=>nxt(n,0)};
R[1]=(el,l,n)=>{

 quiz($('#qz',el),l,()=>nxt(n,1))};
R[2]=(el,l,n)=>{
 let blind=false;
 const draw=()=>{el.innerHTML=`<div class="tools"><button class="pill ${S.rate===1?'on':''}" data-r="1">Normal hız</button><button class="pill ${S.rate===.75?'on':''}" data-r=".75">Yavaş</button><button class="pill ${blind?'on':''}" id="bl">👂 Metni gizle</button><button class="pill" id="all">▶ Tüm diyalog</button></div>
 <div class="${blind?'blind':''}">${allD(l).map((x,i)=>`<div class="line ${x[0]?'me':''}"><button class="play" data-say="${esc(x[1])}">▶</button><div class="txt"><small>${x[0]?'Sen':'Karşı taraf'}</small><span class="en">${hl(x[1],l.pat)}</span></div></div>`).join('')}</div>${blind?'':storyBox(l)}<p class="qh">Önerilen sıra: 1) gizli dinle, 2) anladığını kendine anlat, 3) metni açıp kontrol et.</p><button class="btn" id="go">Dinledim, devam →</button>`;
 bindStory(el,l);el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();draw()});
 $('#bl',el).onclick=()=>{blind=!blind;draw()};
 $('#all',el).onclick=()=>{let i=0;const D=allD(l);const nx=()=>{if(i<D.length)say(D[i++][1],0,()=>setTimeout(nx,350))};nx()};
 $('#go',el).onclick=()=>nxt(n,2)};draw()};
R[3]=(el,l,n)=>{
 el.innerHTML=`<p class="qh">Her kalıp için: 🔊 dinle → 🎤 söyle. ${SR?'Tarayıcın söylediğini yazıya çevirip benzerlik gösterecek.':'Tarayıcın konuşma tanımayı desteklemiyor; yüksek sesle söyleyip kendini değerlendir.'}</p>${l.c.map((c,i)=>`<div class="row3"><div class="en">${hl(c[0],l.pat)}</div><div class="acts"><button class="pill" data-say="${esc(c[0])}">🔊 Dinle</button><button class="pill" data-say="${esc(c[0])}" data-rate=".7">🐢 Yavaş</button><button class="pill mic" data-i="${i}">🎤 Söyle</button></div><div class="fb" id="f${i}"></div></div>`).join('')}<button class="btn" id="go">Tamam, devam →</button>`;
 el.querySelectorAll('.mic').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,f=$('#f'+i,el);
  if(!SR){f.className='fb good';f.textContent='Güzel! Bir kez daha, bu kez ritmi tam yakalayarak.';return}
  f.className='fb';f.textContent='🎧 Dinliyorum…';
  listen(t=>{if(!t){f.className='fb bad';f.textContent='Duyamadım, tekrar dene.';return}const s=sim(t,l.c[i][0]);f.className='fb '+(s>=80?'good':'bad');f.textContent=`Duyduğum: "${t}" · benzerlik %${s}${s>=80?' ✓':' — bir kez daha dinleyip dene'}`})});
 $('#go',el).onclick=()=>nxt(n,3)};
R[4]=(el,l,n)=>{cards(el,shuffle(l.c.map((c,i)=>({k:n+'-'+i,en:c[0],tr:c[1]}))),()=>nxt(n,4))};
R[5]=(el,l,n)=>{
 el.innerHTML=l.p.map((p,i)=>{const k=n+'-'+i;return `<div class="card"><div class="q">${esc(p[0])}</div><textarea id="t${i}" placeholder="İngilizce yaz…">${esc(S.prod[k]||'')}</textarea><button class="ghost" data-sp="${i}">🔊 Yazdığımı dinle</button><button class="ghost" data-ex="${i}">Örnek cevabı göster</button><div id="x${i}"></div></div>`}).join('')+`<button class="btn" id="go">Üretim tamam, devam →</button>`;
 l.p.forEach((p,i)=>{$('#t'+i,el).oninput=e=>{S.prod[n+'-'+i]=e.target.value;save()}});
 el.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const v=$('#t'+b.dataset.sp,el).value.trim();if(v)say(v)});
 el.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ex;$('#x'+i,el).innerHTML=`<div class="ans"><small>Örnek</small>${hl(l.p[i][1],l.pat)}</div>`;say(l.p[i][1])});
 $('#go',el).onclick=()=>nxt(n,5)};
R[6]=(el,l,n)=>{
 const D=allD(l);let i=0;const log=[];
 const step=()=>{
  let last=null;while(i<D.length&&!D[i][0]){log.push(D[i]);last=D[i][1];i++}
  el.innerHTML=`<div class="chat">${log.map(m=>`<div class="msg ${m[0]?'me':''}">${hl(m[1],l.pat)}</div>`).join('')}</div><div id="act"></div>`;
  const act=$('#act',el);if(last)say(last);
  if(i>=D.length){act.innerHTML=`<p class="res">Diyalog bitti. Bir tur daha, bu kez kendi bilgilerinle cevap vererek dene.</p><button class="btn" id="nx">Devam →</button><button class="ghost" id="rp">Baştan oyna</button>`;$('#nx',act).onclick=()=>nxt(n,6);$('#rp',act).onclick=()=>{i=0;log.length=0;step()};return}
  const x=D[i];
  act.innerHTML=`<div class="cue">Sen şunu söylemek istiyorsun: <b>${esc(x[2]||'')}</b></div><textarea id="my" placeholder="İngilizcesini yaz ya da yüksek sesle söyle…"></textarea><button class="btn" id="sh">Örnek cevabı göster</button>${SR?'<button class="ghost" id="mc">🎤 Söyle</button>':''}`;
  if(SR)$('#mc',act).onclick=()=>{$('#mc',act).textContent='🎧 Dinliyorum…';listen(t=>{$('#mc',act).textContent='🎤 Söyle';if(t)$('#my',act).value=t})};
  $('#sh',act).onclick=()=>{act.innerHTML=`<div class="ans"><small>Örnek cevap</small>${hl(x[1],l.pat)}</div><button class="btn" id="ct">Devam →</button>`;say(x[1]);$('#ct',act).onclick=()=>{log.push([1,x[1]]);i++;step()}};
 };step()};
R[7]=(el,l,n)=>{
 let i=0;
 const show=()=>{
  if(i>=l.r.length){const k=n+'-sub';el.innerHTML=`<div class="card"><div class="q">Şimdi sıra sende: ilk kalıbı al, vurgulu parçayı kendi hayatına göre değiştir.</div><div class="ans"><small>Kalıp</small>${slot(l.r[0][0])}</div><textarea id="own" placeholder="Kendi cümlelerin…">${esc(S.prod[k]||'')}</textarea><button class="ghost" id="sp">🔊 Dinle</button><button class="btn" id="go">Devam →</button></div>`;
   $('#own',el).oninput=e=>{S.prod[k]=e.target.value;save()};$('#sp',el).onclick=()=>{const v=$('#own',el).value.trim();if(v)say(v)};$('#go',el).onclick=()=>nxt(n,7);return}
  const r=l.r[i];
  el.innerHTML=`<div class="card"><div class="prog">${i+1}/${l.r.length} · Kalıp aynı, parça değişiyor</div><div class="q">${esc(r[1])}</div><textarea id="try" placeholder="İngilizcesini söyle ya da yaz…"></textarea><button class="btn" id="sh">Göster</button><div id="sa"></div></div>`;
  $('#sh',el).onclick=()=>{$('#sa',el).innerHTML=`<div class="ans"><small>İngilizcesi · vurgulu kısım değişen parça</small><span style="font-size:20px">${slot(r[0])}</span></div><button class="btn" id="cn">Sonraki →</button>`;say(r[0]);$('#cn',el).onclick=()=>{i++;show()};$('#sh',el).disabled=true};
 };show()};
R[8]=(el,l,n)=>{
 const done=!!(S.mis[n]&&S.mis[n].ok);
 el.innerHTML=`<div class="sit"><b>Bugünün görevi</b><br>${esc(l.m)}</div>${l.can?`<div class="card"><div class="prog">Artık yapabilirim</div>${l.can.map(c=>`<div>☐ ${esc(c)}</div>`).join('')}</div>`:''}<div id="rec"></div><label class="check"><input type="checkbox" id="ck" ${done?'checked':''}> Görevi yaptım</label><textarea id="nt" placeholder="Not: ne söyledin, nerede takıldın, hangi kelime eksikti?">${esc((S.mis[n]||{}).t||'')}</textarea><button class="btn" id="go">Devam →</button><p class="qh">İpucu: Telefonunun ses kaydedicisiyle kendini kaydet. Aşama sonlarında eski kayıtlarınla karşılaştır.</p>`;
 recorder($('#rec',el));const sv=()=>{S.mis[n]={ok:$('#ck',el).checked,t:$('#nt',el).value};save()};
 $('#ck',el).onchange=sv;$('#nt',el).oninput=sv;
 $('#go',el).onclick=()=>{if(!$('#ck',el).checked){toast('Önce görevi yap ve kutuyu işaretle');return}sv();nxt(n,8)}};
R[9]=(el,l,n)=>{
 const prev=[];for(let k=1;k<n;k++)L[k-1].c.forEach((c,i)=>prev.push({en:c[0],tr:c[1]}));
 const pool=shuffle(l.c.map(c=>({en:c[0],tr:c[1]}))).concat(shuffle(prev).slice(0,6));
 let i=0,fast=0;
 const show=()=>{
  if(i>=pool.length){el.innerHTML=`<div class="card"><h3>${fast}/${pool.length} hızlı</h3><p class="res">${fast>=pool.length*.7?'Otomatikleşiyor. Bu kalıplar artık hazır.':'Takıldıkların normal; Tekrar bölümünde kartlar yeniden gelecek.'}</p><button class="btn" id="fn">${n<60?'Sonraki derse geç →':'Bitir'}</button></div>`;$('#fn',el).onclick=()=>nxt(n,9);return}
  const c=pool[i];
  el.innerHTML=`<div class="card"><div class="prog">${i+1}/${pool.length} · 6 saniyen var, yüksek sesle söyle</div><div class="q">${esc(c.tr)}</div><div class="timer"><b id="tb" style="transition:transform 6s linear"></b></div><div id="rv"></div><button class="ghost" id="sw">Göster</button></div>`;
  const rev=()=>{clearTimeout(TM);$('#tb',el).style.transform=getComputedStyle($('#tb',el)).transform;$('#rv',el).innerHTML=`<div class="ans"><b style="font-size:20px">${esc(c.en)}</b></div><button class="btn" id="y">Hızlıydı ✓</button><button class="ghost" id="no">Takıldım</button>`;say(c.en);$('#sw',el).hidden=true;
   $('#y',el).onclick=()=>{fast++;i++;show()};$('#no',el).onclick=()=>{i++;show()}};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$('#tb',el);if(b)b.style.transform='scaleX(0)'}));
  TM=setTimeout(()=>{if($('#sw',el)&&!$('#sw',el).hidden)rev()},6000);
  $('#sw',el).onclick=rev;
 };show()};

/* ---- review & journal ---- */
function review(){
 const d=due();
 app.innerHTML=`<div style="--c:var(--s2)"><div class="lh"><a href="#/">← Yol haritası</a><span class="num">Aralıklı tekrar</span><h1>Tekrar kartları</h1><p>Unutmak üzereyken geri gelen kalıplar</p></div><section class="phase"><div id="pb"></div></section></div>`;
 const el=$('#pb');
 if(!d.length){el.innerHTML=`<p class="res">Şu an vadesi gelen kart yok. Derslerde <b>HATIRLA</b> adımını tamamladıkça kartlar buraya eklenir ve zamanı geldiğinde burada görünür.</p><a class="btn" href="#/l/${nextUp()[0]}/${nextUp()[1]}">Derse devam et</a>`;return}
 cards(el,shuffle(d).slice(0,20),()=>{nav('#/')},'Yol haritasına dön');
}
function journal(){
 const items=[];
 for(const k in S.prod){if(!S.prod[k].trim())continue;const n=+k.split('-')[0];items.push({n,h:k.endsWith('sub')?'Değiştirdiğim cümleler':'Üretim',t:S.prod[k]})}
 for(const k in S.mis){if(S.mis[k]&&S.mis[k].t&&S.mis[k].t.trim())items.push({n:+k,h:'Gerçek hayat notu',t:S.mis[k].t})}
 items.sort((a,b)=>a.n-b.n);
 app.innerHTML=`<div style="--c:var(--s3)"><div class="lh"><a href="#/">← Yol haritası</a><span class="num">Kişisel defter</span><h1>Defterim</h1><p>Yazdığın cümleler ve görev notların</p></div><section class="phase">${items.length?items.map(x=>`<div class="jr"><small>Ders ${x.n} · ${L[x.n-1].t} · ${x.h}</small><p>${esc(x.t)}</p></div>`).join(''):'<p class="res">Henüz kayıt yok. ÜRET, DEĞİŞTİR ve GERÇEK HAYAT adımlarında yazdıkların burada birikir.</p>'}</section></div>`;
}

/* ---- stage checkpoint ---- */
const RUB={1:["Kendimi, ailemi ve günlük rutinimi 1 dakika anlatabiliyorum.","Soru sorup cevap verebiliyorum.","Geçmiş, şimdi ve gelecek hakkında basit cümleler kurabiliyorum."],2:["Düşüncemi bağlaçlarla bağlayıp neden-sonuç kurabiliyorum.","Bilmediğim kelimeyi tarif edebiliyorum.","2–3 dakika yapılandırılmış anlatı yapabiliyorum."],3:["Fikrimi savunup karşı argümanı yanıtlayabiliyorum.","Hazırlıksız sorulara akıcı cevap verebiliyorum.","Kendi alanımda sunum yapıp soruları yönetebiliyorum."]};
function stagePage(si){
 const st=ST[si-1],v=LV.filter(x=>x.st===si),a=v[0].a,b=v[v.length-1].b,pool=[];
 for(let k=a;k<=b;k++)L[k-1].c.forEach(c=>pool.push({en:c[0],tr:c[1]}));
 app.innerHTML=`<div style="--c:var(${st.col})"><div class="lh"><a href="#/">← Yol haritası</a><span class="num">Aşama ${st.n} · Kontrol noktası</span><h1>${st.name} — Final</h1><p>${st.range}: hız turu, test, kendini değerlendirme ve kayıt</p></div>
 <section class="phase"><div class="pi"><h2>1. Karışık hız turu</h2><p>Aşamadan rastgele 12 kalıp. Çevirmeden söyle.</p></div><div id="sp1"></div></section>
 <section class="phase"><div class="pi"><h2>2. Kalıp testi</h2><p>Durumu oku, doğru kalıbı seç.</p></div><div id="sp2"></div></section>
 <section class="phase"><div class="pi"><h2>3. Kendini değerlendir</h2><p>Dürüst işaretle; işaretleyemediğin dersi tekrar et.</p></div>${RUB[si].map((r,i)=>`<label class="check"><input type="checkbox" class="rb" data-k="${si}-${i}" ${S.mis['s'+si+'-'+i]?'checked':''}> ${esc(r)}</label>`).join('')}</section>
 <section class="phase"><div class="pi"><h2>4. Final konuşma kaydı</h2><p>${si===1?'60 saniyede kendini, günlüğünü ve planlarını anlat.':si===2?'2 dakikada bir deneyimini neden-sonuç ve dönüm noktasıyla anlat.':'3 dakikada kendi alanında kısa sunum yap, sonra bir soruya cevap ver.'}</p></div><div id="sp4"></div></section></div>`;
 cards($('#sp1'),shuffle(pool).slice(0,12).map((c,i)=>({k:'x'+si+'-'+i,en:c.en,tr:c.tr})),()=>toast('Hız turu bitti ✓'),'Bitir');
 const q=shuffle(pool).slice(0,10);let i=0,ok=0;const el=$('#sp2');
 const show=()=>{if(i>=q.length){el.innerHTML=`<p class="res"><b>${ok}/${q.length}</b> doğru.</p>`;return}
  const c=q[i],o=shuffle([c].concat(shuffle(pool.filter(x=>x!==c)).slice(0,2)));
  el.innerHTML=`<p class="qh">Soru ${i+1}/${q.length}</p><div class="q">${esc(c.tr)}</div><div class="opts">${o.map((x,k)=>`<button class="opt" data-k="${k}">${esc(x.en)}</button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach((bt,k)=>bt.onclick=()=>{if(el.querySelector('.good'))return;const g=o[k]===c;if(g)ok++;bt.classList.add(g?'good':'bad');el.querySelectorAll('.opt').forEach((x,j)=>{if(o[j]===c)x.classList.add('good')});say(c.en);setTimeout(()=>{i++;show()},1100)})};show();
 document.querySelectorAll('.rb').forEach(c=>c.onchange=()=>{S.mis['s'+c.dataset.k]=c.checked?{ok:true}:null;if(!c.checked)delete S.mis['s'+c.dataset.k];save()});
 recorder($('#sp4'));
}

/* ---- router ---- */
function route(){
 clearTimeout(TM);if('speechSynthesis' in window)speechSynthesis.cancel();
 const p=(CUR.slice(1)||'/').split('/');
 ['h','r','j'].forEach(k=>$('#n-'+k).classList.toggle('on',(k==='h'&&!p[1])||p[1]===k));
 if(p[1]==='l')lesson(+p[2],+p[3]||0);else if(p[1]==='s')stagePage(+p[2]||1);else if(p[1]==='r')review();else if(p[1]==='j')journal();else home();
 updBadge();window.scrollTo(0,0);
}
addEventListener('hashchange',()=>{CUR=location.hash||'#/';route()});addEventListener('popstate',()=>{CUR=location.hash||'#/';route()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a&&!e.defaultPrevented&&!e.metaKey&&!e.ctrlKey){e.preventDefault();nav(a.getAttribute('href'))}});
route();
})();
</script>
</body>
</html>
