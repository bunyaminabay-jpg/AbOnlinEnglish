<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Curriculum — AbOnlinEnglish</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
/* ===== SHARED NAV ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:2000;background:rgba(15,30,60,0.97);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.07);}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:68px;}
.logo-wrap{display:flex;align-items:center;gap:12px;text-decoration:none;}
.logo-svg{width:42px;height:42px;flex-shrink:0;}
.logo-text{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:900;color:#fff;letter-spacing:-0.5px;line-height:1;}
.logo-text span{color:#e8a020;}
.logo-sub{font-size:.65rem;font-weight:500;color:rgba(255,255,255,0.45);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.nav-links{display:flex;gap:2px;list-style:none;margin:0;padding:0;}
.nav-links a{color:rgba(255,255,255,0.80);text-decoration:none;font-size:.85rem;font-weight:500;padding:8px 13px;border-radius:8px;transition:all .2s;}
.nav-links a:hover,.nav-links a.active{background:rgba(232,160,32,0.18);color:#f0c060;}
.nav-cta-btn{background:#e8a020!important;color:#0f1e3c!important;font-weight:700!important;padding:9px 18px!important;border-radius:8px;}
.nav-cta-btn:hover{background:#f0c060!important;}
.hamburger{display:none;background:none;border:none;cursor:pointer;color:white;font-size:1.5rem;line-height:1;padding:4px;}
footer{background:#07111f;color:rgba(255,255,255,0.45);text-align:center;padding:32px 24px;font-size:.85rem;}
footer strong{color:#e8a020;}
.footer-socials{display:flex;justify-content:center;gap:16px;margin:16px 0;}
.footer-socials a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.6);text-decoration:none;transition:all .2s;}
.footer-socials a:hover{background:#e8a020;color:#0f1e3c;}
@media(max-width:700px){
  .nav-links{display:none;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:rgba(15,30,60,0.99);padding:16px;gap:4px;}
  .nav-links.open{display:flex;}
  .hamburger{display:block;}
}
/* ===== END SHARED NAV ===== */

        :root {
            --navy: #0a1628; --blue: #1a56db; --gold: #f59e0b; --emerald: #10b981;
            --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0; --radius: 12px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); margin: 0; color: var(--navy); }
        .app-container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 0.5rem; }
        
        /* Selection Flow */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 2rem; }
        .step-title { font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        .btn-card { 
            background: var(--white); border: 2px solid var(--border); padding: 20px; 
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s; text-align: center;
            font-weight: 600; font-size: 1rem;
        }
        .btn-card:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .btn-card.active { border-color: var(--blue); background: #eff6ff; color: var(--blue); }

        /* Game Overlay */
        .game-overlay { display:none; position:fixed; inset:0; background:var(--white); z-index:1000; padding: 40px; }
        .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .close-btn { font-size: 2rem; cursor: pointer; line-height: 1; }
        .game-content { max-width: 700px; margin: 50px auto; text-align: center; }

        /* Question Styles */
        .q-text { font-size: 1.8rem; font-family: 'Playfair Display'; margin-bottom: 30px; }
        .option-list { display: grid; gap: 12px; }
        .opt-btn { padding: 18px; border: 1.5px solid var(--border); border-radius: 10px; background: none; cursor: pointer; font-size: 1.1rem; text-align: left; }
        .opt-btn:hover { background: var(--bg); }
        
        /* Builder Styles */
        .word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; }
        .word-tile { padding: 10px 20px; background: var(--white); border: 2px solid var(--blue); border-radius: 8px; cursor: pointer; font-weight: 600; }
        .sentence-display { min-height: 60px; border-bottom: 2px solid var(--border); margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>AbOnlinEnglish</h1>
        <p>Complete CEFR-Aligned Interactive Curriculum</p>
    </header>

    <div class="step-title"><span>01.</span> Choose Your Level</div>
    <div class="card-grid" id="lvlGrid">
        <button class="btn-card" onclick="selectLvl('A1', this)">A1 - Beginner</button>
        <button class="btn-card" onclick="selectLvl('A2', this)">A2 - Elementary</button>
        <button class="btn-card" onclick="selectLvl('B1', this)">B1 - Intermediate</button>
        <button class="btn-card" onclick="selectLvl('B2', this)">B2 - Upper Inter</button>
        <button class="btn-card" onclick="selectLvl('C1', this)">C1 - Advanced</button>
    </div>

    <div id="topicSection" style="display:none">
        <div class="step-title"><span>02.</span> Select Grammar/Vocab Topic</div>
        <div class="card-grid" id="topicGrid"></div>
    </div>

    <div id="gameSection" style="display:none">
        <div class="step-title"><span>03.</span> Choose Activity</div>
        <div class="card-grid">
            <button class="btn-card" style="border-left: 5px solid var(--blue)" onclick="launch('quiz')">📝 Speed Quiz</button>
            <button class="btn-card" style="border-left: 5px solid var(--gold)" onclick="launch('builder')">🧩 Sentence Builder</button>
            <button class="btn-card" style="border-left: 5px solid var(--emerald)" onclick="launch('listen')">🎧 Ear Training</button>
        </div>
    </div>
</div>

<div class="game-overlay" id="gameOverlay">
    <div class="game-header">
        <h2 id="activeGameTitle">Game Mode</h2>
        <span class="close-btn" onclick="closeGame()">×</span>
    </div>
    <div class="game-content" id="gameContent"></div>
</div>

<script>
/* ==========================================
   RESEARCH-BASED CEFR MASTER DATA
   ========================================== */
const MASTER_DB = {
    "A1": {
        "Am/Is/Are": {
            quiz: [{q: "My cat ___ very small.", opts: ["am", "is", "are"], a: 1}],
            builder: [{words: ["They", "are", "not", "happy"], correct: "They are not happy"}],
            listen: "I am a doctor and I work in London."
        },
        "Family Vocab": {
            quiz: [{q: "Your mother's sister is your ___.", opts: ["aunt", "uncle", "cousin"], a: 0}],
            builder: [{words: ["My", "father", "is", "a", "teacher"], correct: "My father is a teacher"}],
            listen: "I have two sisters and one brother."
        },
        "Present Simple": {
            quiz: [{q: "She ___ tea every morning.", opts: ["drink", "drinks", "drinking"], a: 1}],
            builder: [{words: ["We", "play", "football", "on", "Sundays"], correct: "We play football on Sundays"}],
            listen: "Mark usually wakes up at seven o'clock."
        }
    },
    "A2": {
        "Past Simple": {
            quiz: [{q: "We ___ to Spain last summer.", opts: ["go", "goed", "went"], a: 2}],
            builder: [{words: ["I", "did", "not", "buy", "anything"], correct: "I did not buy anything"}],
            listen: "They traveled to Italy by train last month."
        },
        "Comparatives": {
            quiz: [{q: "Gold is ___ than silver.", opts: ["expensive", "more expensive", "most expensive"], a: 1}],
            builder: [{words: ["Health", "is", "more", "important", "than", "money"], correct: "Health is more important than money"}],
            listen: "This city is much noisier than my hometown."
        }
    },
    "B1": {
        "Present Perfect": {
            quiz: [{q: "I ___ that movie three times.", opts: ["saw", "have seen", "has seen"], a: 1}],
            builder: [{words: ["Have", "you", "ever", "seen", "a", "whale?"], correct: "Have you ever seen a whale?"}],
            listen: "She has already finished her project."
        },
        "Modal Verbs": {
            quiz: [{q: "You ___ park here; it's forbidden.", opts: ["mustn't", "shouldn't", "might not"], a: 0}],
            builder: [{words: ["You", "should", "see", "a", "doctor"], correct: "You should see a doctor"}],
            listen: "We might go to the beach if the weather is good."
        }
    },
    "B2": {
        "Passive Voice": {
            quiz: [{q: "The Mona Lisa ___ by Da Vinci.", opts: ["painted", "was painted", "is painting"], a: 1}],
            builder: [{words: ["A", "new", "bridge", "is", "being", "built"], correct: "A new bridge is being built"}],
            listen: "The decision was made by the board of directors."
        },
        "Conditionals": {
            quiz: [{q: "If I ___ you, I would tell the truth.", opts: ["am", "was", "were"], a: 2}],
            builder: [{words: ["I", "would", "go", "if", "I", "had", "time"], correct: "I would go if I had time"}],
            listen: "If it rains tomorrow, the match will be cancelled."
        }
    },
    "C1": {
        "Inversion": {
            quiz: [{q: "Hardly ___ started when it began to rain.", opts: ["I had", "had I", "I have"], a: 1}],
            builder: [{words: ["Never", "have", "I", "seen", "such", "beauty"], correct: "Never have I seen such beauty"}],
            listen: "Only then did I realize my mistake."
        },
        "Advanced Phrasals": {
            quiz: [{q: "We need to ___ the problem immediately.", opts: ["look into", "look for", "look after"], a: 0}],
            builder: [{words: ["I", "cannot", "put", "up", "with", "this"], correct: "I cannot put up with this"}],
            listen: "The company had to back out of the deal at the last minute."
        }
    }
};

let selectedLvl = null;
let selectedTopic = null;

/* FLOW CONTROL */
function selectLvl(lvl, btn) {
    selectedLvl = lvl;
    document.querySelectorAll('#lvlGrid .btn-card').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const topics = Object.keys(MASTER_DB[lvl]);
    const grid = document.getElementById('topicGrid');
    grid.innerHTML = topics.map(t => `<button class="btn-card" onclick="selectTopic('${t}', this)">${t}</button>`).join('');
    
    document.getElementById('topicSection').style.display = 'block';
    document.getElementById('gameSection').style.display = 'none';
}

function selectTopic(topic, btn) {
    selectedTopic = topic;
    document.querySelectorAll('#topicGrid .btn-card').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('gameSection').style.display = 'block';
}

function closeGame() { 
    document.getElementById('gameOverlay').style.display = 'none'; 
    window.speechSynthesis.cancel();
}

/* GAME ENGINES */
function launch(mode) {
    const data = MASTER_DB[selectedLvl][selectedTopic][mode];
    document.getElementById('gameOverlay').style.display = 'block';
    document.getElementById('activeGameTitle').innerText = `${selectedTopic} — ${mode.toUpperCase()}`;
    const ctx = document.getElementById('gameContent');

    if(mode === 'quiz') renderQuiz(ctx, data);
    if(mode === 'builder') renderBuilder(ctx, data);
    if(mode === 'listen') renderListen(ctx, data);
}

function renderQuiz(ctx, data) {
    let q = data[0];
    ctx.innerHTML = `
        <div class="q-text">${q.q}</div>
        <div class="option-list">
            ${q.opts.map((o, i) => `<button class="opt-btn" onclick="checkQuiz(${i}, ${q.a})">${o}</button>`).join('')}
        </div>
    `;
    window.checkQuiz = (i, a) => { if(i===a) { alert("Correct!"); closeGame(); } else alert("Try again!"); };
}

function renderBuilder(ctx, data) {
    let item = data[0];
    let current = [];
    let pool = [...item.words].sort(() => Math.random() - 0.5);

    const update = () => {
        ctx.innerHTML = `
            <div class="sentence-display">${current.map(w => `<span class="word-tile">${w}</span>`).join('')}</div>
            <div class="word-bank">${pool.map((w, i) => `<button class="word-tile" onclick="pick(${i})">${w}</button>`).join('')}</div>
            <button class="btn-card" style="margin-top:40px; background:var(--blue); color:white" onclick="checkB()">Verify Sentence</button>
        `;
    };
    window.pick = (i) => { current.push(pool[i]); pool.splice(i, 1); update(); };
    window.checkB = () => { if(current.join(' ') === item.correct) { alert("Perfect!"); closeGame(); } else alert("Check word order!"); };
    update();
}

function renderListen(ctx, data) {
    ctx.innerHTML = `
        <div class="q-text">Listen and identify the sentence</div>
        <button class="btn-card" onclick="speak('${data}')">🔊 Click to Listen</button>
        <input type="text" id="lInput" placeholder="Type what you hear..." style="width:100%; padding:15px; margin-top:20px; border-radius:8px; border:1px solid #ccc">
        <button class="btn-card" style="margin-top:20px; width:100%" onclick="checkL('${data.replace(/[.,]/g,'')}')">Submit Answer</button>
    `;
    window.checkL = (correct) => {
        const val = document.getElementById('lInput').value.toLowerCase().trim();
        if(val === correct.toLowerCase().trim()) { alert("Excellent Ear!"); closeGame(); }
        else alert("Almost! Listen again.");
    };
}

function speak(txt) {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'en-US'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
}
</script>
