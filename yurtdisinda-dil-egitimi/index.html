<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yurtdışında Dil Eğitimi — Yakında | AbOnlinEnglish</title>
<meta name="description" content="Yurtdışında dil eğitimi rehberi hazırlanıyor. Çok yakında AbOnlinEnglish'te.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://abonlinenglish.school/yurtdisinda-dil-egitimi">
<style>
:root{--navy:#102F5F;--blue:#1479E8;--bg-tint:#F3F7FC;--ink:#182A44;--muted:#59677C;--line:#E1E8F2}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg-tint);color:var(--ink)}
.wrap{min-height:100vh;display:flex;flex-direction:column}
header{padding:22px 24px}
header a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:700;font-size:18px}
header img{width:36px;height:36px;border-radius:8px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{max-width:560px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:48px 36px;box-shadow:0 14px 34px -14px rgba(16,47,95,.18)}
.badge{display:inline-block;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:600;font-size:13px;letter-spacing:.02em;padding:6px 14px;border-radius:999px;margin-bottom:18px}
h1{font-size:28px;margin:0 0 14px;color:var(--navy)}
p{color:var(--muted);line-height:1.6;font-size:16px;margin:0 0 28px}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:13px 26px;border-radius:999px}
.btn:hover{background:var(--navy)}
footer{padding:20px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="/"><img src="/assets/logo.jpg" alt="">AbOnlinEnglish</a></header>
  <main>
    <div class="card">
      <span class="badge">Yakında</span>
      <h1>Yurtdışında Dil Eğitimi</h1>
      <p>Yurtdışında dil eğitimi rehberimizi hazırlıyoruz — okul seçimi, süreç ve pratik ipuçlarıyla çok yakında burada olacak.</p>
      <a class="btn" href="/">Ana Sayfaya Dön</a>
    </div>
  </main>
  <footer>AbOnlinEnglish Dil Eğitimi</footer>
</div>
</body>
</html>
