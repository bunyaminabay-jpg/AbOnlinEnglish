<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Özel Ders & Öğretmen Bul | AbOnlinEnglish</title>
<meta name="description" content="Seviyenize, hedeflerinize ve ders tercihlerinize uygun İngilizce öğretmenlerini keşfedin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://ortqjhxoqydzhmimaily.supabase.co">
<link rel="dns-prefetch" href="https://ortqjhxoqydzhmimaily.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0F1E3D;
  --navy-800:#16294D;
  --navy-700:#1E3560;
  --orange:#E8720C;
  --orange-700:#C55E06;
  --orange-50:#FDF1E4;
  --green:#1E7D42;
  --green-50:#E9F6EE;
  --red:#C0342C;
  --red-50:#FBEAE9;
  --ink:#1B2230;
  --ink-soft:#667085;
  --ink-faint:#98A2B3;
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --border:#E4E7EB;
  --border-strong:#D0D5DD;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --r-sm:8px; --r-md:12px; --r-lg:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button:focus{outline:none;}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px;}
a:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg);
  line-height:1.55;
  font-size:15px;
}
h1,h2,h3,h4{
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--navy);
  margin:0 0 .5em;
  line-height:1.2;
  letter-spacing:-.01em;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px;}
.icon{width:16px;height:16px;flex-shrink:0;vertical-align:-3px;}
.icon-lg{width:20px;height:20px;}

/* -------- Header -------- */
header.site{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:1200px;margin:0 auto;gap:20px;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Manrope';font-weight:700;font-size:1.02rem;color:var(--navy);text-decoration:none;cursor:pointer;background:none;border:none;padding:4px 0;}
.brand .mark{width:38px;height:38px;border-radius:50%;flex-shrink:0;overflow:hidden;box-shadow:0 0 0 1px var(--border);}
.brand .mark img{width:100%;height:100%;object-fit:cover;}
.navlinks{display:flex;gap:2px;align-items:center;flex-wrap:wrap;}
.navlinks button,.navlinks a{background:none;border:none;color:var(--ink-soft);font-weight:600;font-size:.87rem;padding:9px 13px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;transition:background .16s ease,color .16s ease,transform .12s ease;}
.navlinks button:hover,.navlinks a:hover{background:var(--orange-50);color:var(--orange-700);transform:translateY(-1px);}
.navlinks button.active{color:var(--orange-700);background:var(--orange-50);font-weight:700;}
.nav-teacher-glow{background:linear-gradient(135deg,#22c55e,#15803d) !important;color:#fff !important;font-weight:700 !important;padding:9px 16px !important;box-shadow:0 2px 8px rgba(34,197,94,.35);animation:navTeacherPulse 2s ease-in-out infinite;}
.nav-teacher-glow:hover{color:#fff !important;background:linear-gradient(135deg,#16a34a,#166534) !important;transform:translateY(-1px);}
@keyframes navTeacherPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55),0 2px 8px rgba(34,197,94,.4);}
  50%{box-shadow:0 0 0 6px rgba(34,197,94,0),0 2px 16px rgba(34,197,94,.75);}
}
.btn-login-glow{animation:btnLoginPulse 2s ease-in-out infinite;}
.btn-login-glow:hover{animation:none;}
@keyframes btnLoginPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(232,114,12,.55),0 1px 2px rgba(0,0,0,.05);}
  50%{box-shadow:0 0 0 6px rgba(232,114,12,0),0 2px 16px rgba(232,114,12,.7);}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:9px 16px;font-weight:600;font-size:.87rem;border:1.5px solid transparent;text-decoration:none;transition:all .12s ease;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.btn-primary:hover{background:var(--orange-700);}
.btn-outline{background:var(--surface);border-color:var(--border-strong);color:var(--navy);}
.btn-outline:hover{border-color:var(--navy);background:var(--bg);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#166536;}
.btn-ghost{background:none;border:none;color:var(--ink-soft);font-weight:600;}
.btn-ghost:hover{color:var(--navy);}
.btn-sm{padding:6px 12px;font-size:.8rem;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{background:#9B241D;}
.btn-block{width:100%;}

/* -------- Hero -------- */
.hero{padding:60px 24px 48px;background:linear-gradient(180deg,#FCFBF8 0%,var(--bg) 100%);}
.hero-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--orange-700);background:var(--orange-50);padding:5px 12px;border-radius:20px;margin-bottom:16px;}
.hero h1{font-size:2.5rem;max-width:14ch;}
.hero p.lead{color:var(--ink-soft);font-size:1.02rem;max-width:44ch;margin-bottom:26px;}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px;}
.hero-trust{display:flex;gap:30px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:20px;}
.hero-trust div{display:flex;align-items:flex-start;gap:8px;}
.hero-trust div .icon{color:var(--green);margin-top:2px;}
.hero-trust div b{display:block;font-family:'Manrope';font-size:.86rem;color:var(--navy);}
.hero-trust div span{font-size:.78rem;color:var(--ink-soft);}
.hero-visual{position:relative;background:var(--navy);border-radius:20px;padding:28px;color:#fff;min-height:360px;box-shadow:var(--shadow-lg);}
.hero-visual::after{content:"";position:absolute;inset:0;border-radius:20px;background:radial-gradient(circle at 85% 8%,rgba(232,114,12,.28),transparent 55%);pointer-events:none;}
.hv-label{font-size:.72rem;text-transform:none;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:10px;}
.match-card{position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:16px;margin-bottom:14px;}
.match-card b{font-family:'Manrope';font-size:.95rem;}
.match-card .sub{color:rgba(255,255,255,.62);font-size:.82rem;margin-top:4px;}
.match-line{display:flex;align-items:center;gap:8px;margin:14px 0;color:rgba(255,255,255,.72);font-size:.84rem;padding-left:4px;}
.match-line .icon{color:var(--orange);}
.mini-avatars{display:flex;gap:-8px;margin-top:10px;}
.mini-avatars span{width:26px;height:26px;border-radius:50%;background:var(--orange);border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;margin-left:-8px;}
.mini-avatars span:first-child{margin-left:0;}

/* -------- Sections general -------- */
section.page{padding:44px 24px 72px;}
.page-head{max-width:640px;margin-bottom:8px;}
.page-head p{color:var(--ink-soft);margin-top:4px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-sm);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.form-section{margin-bottom:8px;}
.form-section + .form-section{margin-top:26px;padding-top:22px;border-top:1px solid var(--border);}
.form-section h4{font-size:.92rem;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.form-section h4 .icon{color:var(--orange);}
label{display:block;font-size:.8rem;font-weight:600;color:var(--navy);margin:12px 0 6px;}
input,select,textarea{
  width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);
  font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-50);}
textarea{resize:vertical;min-height:78px;}
.check-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.chip-check{display:flex;align-items:center;gap:6px;border:1.5px solid var(--border);padding:6px 11px;border-radius:20px;font-size:.8rem;cursor:pointer;background:#fff;font-weight:500;}
.chip-check:has(input:checked){border-color:var(--orange);background:var(--orange-50);color:var(--orange-700);}
.chip-check input{width:auto;margin:0;accent-color:var(--orange);}
.form-actions{margin-top:22px;display:flex;gap:12px;padding-top:18px;border-top:1px solid var(--border);}
.hint{font-size:.78rem;color:var(--ink-soft);margin-top:6px;}
.hint a{color:var(--orange-700);font-weight:600;text-decoration:none;}
.msg{padding:12px 14px;border-radius:10px;font-size:.86rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.msg-ok{background:var(--green-50);color:var(--green);border:1px solid #C6E8D3;}
.msg-err{background:var(--red-50);color:var(--red);border:1px solid #F0C9C6;}
.msg-info{background:var(--orange-50);color:var(--orange-700);border:1px solid #F5DAB6;}

/* -------- Teacher search: sidebar + list -------- */
.search-shell{display:grid;grid-template-columns:264px 1fr;gap:32px;align-items:start;}
.filter-panel{position:sticky;top:82px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-sm);}
.filter-panel h4{font-size:.82rem;text-transform:none;color:var(--navy);margin-bottom:16px;display:flex;align-items:center;gap:6px;}
.filter-group{margin-bottom:16px;}
.filter-group label{margin:0 0 6px;font-size:.76rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
.filter-group select{font-size:.85rem;padding:8px 10px;}
.results-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.results-count{font-size:.86rem;color:var(--ink-soft);}
.results-count b{color:var(--navy);}
.teacher-list{display:flex;flex-direction:column;gap:14px;}
.trow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;display:grid;grid-template-columns:64px 1fr auto;gap:18px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s;}
.trow:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--orange-50);border:2px solid #fff;box-shadow:0 0 0 1px var(--border);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:700;color:var(--orange-700);font-size:1.25rem;overflow:hidden;flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.trow-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.trow-name h3{font-size:1.02rem;margin:0;}
.verified{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--green);background:var(--green-50);padding:2px 8px;border-radius:10px;}
.trow-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);margin:5px 0 9px;}
.trow-meta span{display:flex;align-items:center;gap:5px;}
.trow-meta .icon{color:var(--ink-faint);}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
.tag{background:var(--bg);color:var(--navy);font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--border);}
.trow-bio{font-size:.85rem;color:var(--ink-soft);margin-top:6px;max-width:60ch;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.trow-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;text-align:right;gap:10px;min-width:130px;}
.rating{font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}
.rating .icon{color:#F5A623;}
.price{font-family:'Manrope';font-weight:700;color:var(--navy);font-size:1.05rem;}
.price span{display:block;font-family:'Inter';font-weight:400;font-size:.72rem;color:var(--ink-faint);}
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-md);}

/* -------- Modal -------- */
.overlay{position:fixed;inset:0;background:rgba(15,30,61,.55);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:40px 20px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:18px;max-width:600px;width:100%;overflow:hidden;position:relative;box-shadow:var(--shadow-lg);}
.modal .close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.9);border:1px solid var(--border);width:30px;height:30px;border-radius:50%;color:var(--ink-soft);z-index:2;display:flex;align-items:center;justify-content:center;}
.modal-banner{background:var(--navy);padding:28px;color:#fff;display:flex;gap:16px;align-items:center;}
.modal-banner .avatar{width:72px;height:72px;font-size:1.6rem;box-shadow:0 0 0 3px rgba(255,255,255,.2);}
.modal-body{padding:24px 28px 28px;}
.modal-section{margin-bottom:18px;}
.modal-section h5{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;margin-bottom:8px;}
.modal-footer{padding:18px 28px;border-top:1px solid var(--border);background:var(--bg);}

/* -------- App shell (dashboards) -------- */
.app-shell{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 200px);border-top:1px solid var(--border);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:28px 16px;}
.sidebar-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);padding:0 10px 12px;font-weight:700;}
.sidebar button{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:none;border:none;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--ink-soft);font-size:.87rem;margin-bottom:3px;}
.sidebar button .icon{flex-shrink:0;color:var(--ink-faint);}
.sidebar button:hover{background:var(--bg);color:var(--navy);}
.sidebar button.active{background:var(--orange-50);color:var(--orange-700);}
.sidebar button.active .icon{color:var(--orange-700);}
.dash-content{padding:36px 44px;}
.page-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;flex-wrap:wrap;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;}
.stat .stat-icon{width:40px;height:40px;border-radius:10px;background:var(--orange-50);color:var(--orange-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat b{display:block;font-family:'Manrope';font-size:1.5rem;color:var(--navy);line-height:1.1;}
.stat span{font-size:.76rem;color:var(--ink-soft);}
table{width:100%;border-collapse:collapse;font-size:.86rem;}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);}
th{color:var(--ink-faint);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;background:var(--bg);}
tbody tr:hover{background:var(--bg);}
.badge{padding:3px 10px;border-radius:6px;font-size:.72rem;font-weight:700;display:inline-block;}
.badge-pending{background:#FEF2DA;color:#95610C;}
.badge-approved{background:var(--green-50);color:var(--green);}
.badge-rejected{background:var(--red-50);color:var(--red);}
.badge-suspended{background:#EDE9DF;color:var(--ink-soft);}
.badge-new{background:#E4ECFB;color:#2354A6;}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}
.msg-thread{display:flex;flex-direction:column;gap:9px;height:360px;overflow-y:auto;padding:16px;background:var(--bg);border-radius:10px 10px 0 0;border:1px solid var(--border);border-bottom:none;}
.bubble{max-width:72%;padding:9px 13px;border-radius:14px;font-size:.86rem;line-height:1.4;}
.bubble.mine{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
.bubble.theirs{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-compose{display:flex;gap:8px;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:10px;background:#fff;}
.msg-compose input{border:none;padding:6px;}
.msg-compose input:focus{box-shadow:none;}
.thread-item{padding:12px;border-radius:10px;cursor:pointer;border:1px solid transparent;}
.thread-item:hover{background:var(--bg);}
.thread-item.active{background:var(--orange-50);border-color:#F5DAB6;}
.thread-item b{font-size:.87rem;}
.thread-item .meta{font-size:.72rem;color:var(--ink-faint);margin:2px 0 4px;}
.thread-item .snippet{font-size:.8rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

footer.site{background:var(--navy);color:rgba(255,255,255,.7);padding:32px 24px;margin-top:60px;}
footer.site .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:.8rem;}
footer.site a{color:rgba(255,255,255,.7);text-decoration:none;}
footer.site a:hover{color:#fff;}

.hidden{display:none !important;}

@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;}
  .grid-2,.grid-3,.stat-row{grid-template-columns:1fr;}
  .search-shell{grid-template-columns:1fr;}
  .filter-panel{position:static;}
  .trow{grid-template-columns:52px 1fr;}
  .trow-side{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .app-shell{grid-template-columns:1fr;border-top:none;}
  .sidebar{display:flex;overflow-x:auto;padding:12px;gap:4px;border-right:none;border-bottom:1px solid var(--border);}
  .sidebar-title{display:none;}
  .sidebar button{width:auto;white-space:nowrap;}
  .dash-content{padding:24px 18px;}
  .nav{flex-wrap:wrap;padding:10px 16px;}
  .nav > .brand{order:1;}
  .nav > #authArea{order:2;margin-left:auto;flex-wrap:nowrap;}
  .nav > #navlinks{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);-ms-overflow-style:none;scrollbar-width:none;}
  .nav > #navlinks::-webkit-scrollbar{display:none;}
  .nav > #navlinks button,.nav > #navlinks a{flex-shrink:0;padding:8px 12px;}
}
</style>
</head>
<body>

<header class="site">
  <div class="nav">
    <button class="brand" onclick="go('home')">
      <span class="mark"><img id="brandLogo" alt="AbOnlinEnglish logo"></span>
      AbOnlinEnglish
    </button>
    <nav class="navlinks" id="navlinks">
      <a href="https://abonlinenglish.school/" title="AbOnlinEnglish Ana Sayfa">Ana Sayfa</a>
      <a href="https://abonlinenglish.school/hakkimizda.html" title="Hakkımızda">Hakkımızda</a>
      <button onclick="go('search')" data-route="search">Öğretmen Bul</button>
      <button onclick="go('request')" data-route="request">Özel Ders Talebi</button>
      <button class="nav-teacher-glow" onclick="go('teacher-apply')" data-route="teacher-apply">Öğretmen Ol</button>
    </nav>
    <div id="authArea" class="navlinks"></div>
  </div>
</header>

<main id="app"></main>

<footer class="site">
  <div class="wrap">
    <span>© <span id="year"></span> AbOnlinEnglish — İçten bir eğitim, güçlü bir gelecek.</span>
    <span>
      <a href="#" onclick="go('privacy');return false;">Gizlilik Politikası</a> ·
      <a href="#" onclick="go('kvkk');return false;">KVKK Aydınlatma Metni</a> ·
      <a href="#" onclick="go('terms');return false;">Kullanım Koşulları</a>
    </span>
  </div>
</footer>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

function cityOptionsHTML(selectedCity){
  const opt = c => `<option ${selectedCity===c?'selected':''}>${esc(c)}</option>`;
  return `
    <option ${selectedCity==='Online / Şehir farketmez'?'selected':''}>Online / Şehir farketmez</option>
    <optgroup label="Türkiye">${CITIES_TR.map(opt).join('')}</optgroup>
    <optgroup label="Azerbaycan">${CITIES_AZ.map(opt).join('')}</optgroup>
    <option ${selectedCity==='Diğer'?'selected':''}>Diğer</option>
  `;
}

function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function checklistHTML(name, options, selected=[]){
  return `<div class="check-row">${options.map(o=>`
    <label class="chip-check"><input type="checkbox" name="${name}" value="${esc(o)}" ${selected.includes(o)?'checked':''}> ${esc(o)}</label>
  `).join('')}</div>`;
}
function getChecked(form, name){
  return Array.from(form.querySelectorAll(`input[name="${name}"]:checked`)).map(i=>i.value);

   ROUTER
   ============================================================ */
const routes = {};
function route(name, fn){ routes[name] = fn; }
async function go(name, params={}){
  window.location.hash = name;
  document.querySelectorAll('#navlinks button').forEach(b=>b.classList.toggle('active', b.dataset.route===name));
  const app = document.getElementById('app');
  const loader = document.getElementById('topLoader');
  loader.style.opacity = '1';
  loader.style.width = '30%';
  window.scrollTo({top:0,behavior:'instant'});
  try{
    if(routes[name]) await routes[name](params);
    else app.innerHTML = `<div class="wrap" style="padding:80px 24px;">Sayfa bulunamadı.</div>`;
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="wrap" style="padding:80px 24px;"><div class="msg msg-err">Bir hata oluştu: ${esc(err.message||err)}</div></div>`;
  }
  loader.style.width = '100%';
  setTimeout(()=>{ loader.style.opacity = '0'; setTimeout(()=>{ loader.style.width = '0%'; }, 300); }, 150);
}
window.addEventListener('hashchange', ()=>{
  const name = window.location.hash.replace('#','') || 'home';
  go(name);
});

async function refreshAuth(){
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  if(user){
    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    currentProfile = profile;
  } else {
    currentProfile = null;
  }
  renderAuthArea();
}
function renderAuthArea(){
  const el = document.getElementById('authArea');
  if(currentUser && currentProfile){
    const dashRoute = currentProfile.role === 'admin' ? 'admin' : (currentProfile.role === 'teacher' ? 'teacher-dash' : 'student-dash');
    el.innerHTML = `
      <button class="btn btn-outline btn-sm" onclick="go('${dashRoute}')">${ICN.user} Panelim</button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Çıkış</button>
    `;
  } else {
    el.innerHTML = `<button class="btn btn-primary btn-sm btn-login-glow" onclick="go('login')">Giriş / Kayıt</button>`;
  }
}
async function doLogout(){
  await sb.auth.signOut();
  await refreshAuth();
  go('home');
}
sb.auth.onAuthStateChange((_event, _session)=>{ refreshAuth(); });

function requireAuth(role=null){
  if(!currentUser){ go('login'); return false; }
  if(role && currentProfile?.role !== role){
    alert('Bu sayfaya erişim yetkiniz yok.');
    go('home');
    return false;
  }
  return true;
}

async function loadTeachers(){
  const resEl = document.getElementById('teacherResults');
  const countEl = document.getElementById('resultsCount');
  let q = sb.from('teacher_profiles_public').select('*');
  const level = document.getElementById('fLevel').value;
  const age = document.getElementById('fAge').value;
  const spec = document.getElementById('fSpec').value;
  const type = document.getElementById('fType').value;
  const city = document.getElementById('fCity').value;
  const sort = document.getElementById('fSort').value;
  if(level) q = q.contains('levels', [level]);
  if(age) q = q.contains('age_groups', [age]);
  if(spec) q = q.contains('specialties', [spec]);
  if(type) q = q.eq('lesson_type', type);
  if(city) q = q.eq('city', city);
  const { data, error } = await q;
  if(error){ resEl.innerHTML = `<div class="msg msg-err">${esc(error.message)}</div>`; countEl.textContent=''; return; }
  let list = data || [];
  if(sort==='rating') list.sort((a,b)=> (b.rating_avg||0)-(a.rating_avg||0));
  else if(sort==='exp') list.sort((a,b)=> (b.experience_years||0)-(a.experience_years||0));
  else if(sort==='price_asc') list.sort((a,b)=> (parseInt(a.price_range)||9999)-(parseInt(b.price_range)||9999));
  countEl.innerHTML = `<b>${list.length}</b> öğretmen bulundu`;
  if(list.length===0){ resEl.innerHTML = `<div class="empty">Bu kriterlere uygun öğretmen bulunamadı.<br>Bir <a href="#" onclick="go('request');return false;" style="color:var(--orange-700);font-weight:600;">özel ders talebi</a> oluşturabilirsiniz, sizin için arayalım.</div>`; return; }
  resEl.innerHTML = list.map(t=>`
    <div class="trow">
      <div class="avatar">${t.photo_url ? `<img src="${esc(t.photo_url)}">` : esc((t.display_name||'?')[0])}</div>
      <div>
        <div class="trow-name"><h3>${esc(t.display_name)}</h3>${t.rating_count>0?`<span class="verified">${ICN.check} Onaylı</span>`:''}</div>
        <div class="trow-meta">
          ${t.city?`<span>${ICN.pin} ${esc(t.city)}</span>`:''}
          ${t.experience_years?`<span>${ICN.award} ${t.experience_years} yıl deneyim</span>`:''}
          <span>${ICN.book} ${({online:'Online',yuz_yuze:'Yüz yüze',ikisi_de:'Online / Yüz yüze'})[t.lesson_type]||'Online'}</span>
        </div>
        <div class="tags">${(t.levels||[]).map(l=>`<span class="tag">${esc(l)}</span>`).join('')}${(t.specialties||[]).slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
        ${t.bio?`<div class="trow-bio">${esc(t.bio)}</div>`:''}
      </div>
      <div class="trow-side">
        <div>
          <div class="rating">${t.rating_count>0 ? `${ICN.star} ${t.rating_avg} <span style="color:var(--ink-faint);">(${t.rating_count})</span>` : `<span style="color:var(--ink-faint);">Yeni öğretmen</span>`}</div>
          <div class="price">${esc(t.price_range||'Sorunuz')}<span>${t.price_range?'ders başına':''}</span></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="goTeacherProfile('${t.id}')">Profili İncele</button>
      </div>
    </div>
  `).join('');
}

let viewingTeacherId = null;

function videoEmbedHTML(url){
  if(!url) return '';
  const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{6,})/);
  if(ytMatch){
    return `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin-top:8px;"><iframe src="https://www.youtube.com/embed/${ytMatch[1]}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
  }
  return `<a href="${esc(url)}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="margin-top:8px;">${ICN.check} Tanıtım Videosunu İzle</a>`;
}

          <div id="videoUploadStatus" class="hint"></div>
          <p class="hint">${ICN.award} Zorunlu değil ama profil fotoğrafı ve kısa bir ders anlatım videosu eklemeniz önerilir (video dosyası maks. ~50MB) — öğrenciler size çok daha kolay güvenir ve daha hızlı eşleşirsiniz.</p>

            <div><label>Branş</label><input name="branch" value="${esc(t.branch)}" placeholder="Örn: İngilizce Öğretmeni"></div>

  async function handleMediaUpload(e, urlInputId, statusId, kind){
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById(statusId);
    const maxMB = kind==='video' ? 50 : 8;
    if(file.size > maxMB*1024*1024){
      statusEl.innerHTML = `<span style="color:var(--red);">Dosya çok büyük (maks ${maxMB}MB). Bağlantı yapıştırmayı deneyin.</span>`;
      e.target.value = '';
      return;
    }
    statusEl.textContent = 'Yükleniyor…';
    const ext = (file.name.split('.').pop()||'dat').toLowerCase();
    const path = `${currentUser.id}/${kind}-${Date.now()}.${ext}`;
    const { error } = await sb.storage.from('teacher-media').upload(path, file, { upsert: true });
    if(error){ statusEl.innerHTML = `<span style="color:var(--red);">Yüklenemedi: ${esc(error.message)}</span>`; return; }
    const { data } = sb.storage.from('teacher-media').getPublicUrl(path);
    document.getElementById(urlInputId).value = data.publicUrl;
    statusEl.innerHTML = `<span style="color:var(--green);">${ICN.check} Yüklendi</span>`;
  }
  document.getElementById('photoFileInput').addEventListener('change', e=>handleMediaUpload(e,'photoUrlInput','photoUploadStatus','photo'));
  document.getElementById('videoFileInput').addEventListener('change', e=>handleMediaUpload(e,'videoUrlInput','videoUploadStatus','video'));

  document.getElementById('tForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = e.target;
    const profileData = {
      id: currentUser.id,
      display_name: f.display_name.value,
      photo_url: f.photo_url.value || null,
      intro_video_url: f.intro_video_url.value || null,
      city: f.city.value, branch: f.branch.value,
      experience_years: f.experience_years.value?parseInt(f.experience_years.value):null,
      education: f.education.value, certificates: f.certificates.value,
      specialties: getChecked(f,'specialties'), levels: getChecked(f,'levels'),
      age_groups: getChecked(f,'age_groups'), lesson_type: f.lesson_type.value,
      price_range: f.price_range.value, available_hours: f.available_hours.value,
      available_days: getChecked(f,'available_days'), bio: f.bio.value,
      updated_at: new Date().toISOString()
    };
    if(!t.id){ profileData.status = 'pending'; }
    const { error: e1 } = await sb.from('teacher_profiles').upsert(profileData);
    const { error: e2 } = await sb.from('teacher_private').upsert({
      teacher_id: currentUser.id, phone: f.phone.value, email: f.email.value, updated_at: new Date().toISOString()
    });
    const msgEl = document.getElementById('tMsg');
    if(e1 || e2){ msgEl.innerHTML = `<div class="msg msg-err">Kaydedilemedi: ${esc((e1||e2).message)}</div>`; return; }
    msgEl.innerHTML = `<div class="msg msg-ok">${ICN.check} Kaydedildi! ${!t.id?'Profiliniz admin onayına gönderildi.':''}</div>`;
    setTimeout(()=>go('teacher-apply'), 900);
  });
}

function googleButtonHTML(role){
  return `<button type="button" class="btn btn-outline btn-block" disabled style="gap:10px;opacity:.5;cursor:not-allowed;" title="Yakında aktif olacak">${GOOGLE_ICON} Google ile devam et (Yakında)</button>`;
}
function signInWithGoogle(role){
  if(role) localStorage.setItem('ao_pending_role', role);
  localStorage.setItem('ao_oauth_flow', '1');
  const base = window.location.origin + window.location.pathname;
  sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: base } });
}
async function resolvePendingGoogleRole(){
  const pending = localStorage.getItem('ao_pending_role');
  if(!pending || !currentUser || !currentProfile) return;
  localStorage.removeItem('ao_pending_role');
  if(pending==='teacher' && currentProfile.role==='student'){
    await sb.rpc('set_initial_role', { new_role: 'teacher' });
    await refreshAuth();
  }
}

async function postLoginRedirect(){
  if(currentProfile?.role==='admin'){ go('admin'); return; }
  if(currentProfile?.role==='teacher'){
    const { data: profile } = await sb.from('teacher_profiles').select('id').eq('id', currentUser.id).maybeSingle();
    go(profile ? 'teacher-dash' : 'teacher-apply');
    return;
  }
  go('student-dash');
}

function userMessagesHTML(){
  return `
    <div style="max-width:560px;">
      <div id="msgThread" class="msg-thread"></div>
      <form id="msgForm" class="msg-compose">
        <input id="msgInput" placeholder="Sayfa Yöneticisine mesajınızı yazın...">
        <button class="btn btn-primary btn-sm" type="submit">${ICN.send} Gönder</button>
      </form>
    </div>
  `;
}
function wireUserMessages(){
  const loadThread = async ()=>{
    const { data: msgs } = await sb.from('admin_messages').select('*').eq('user_id', currentUser.id).order('created_at',{ascending:true});
    const thread = document.getElementById('msgThread');
    thread.innerHTML = (msgs||[]).map(m=>`<div class="bubble ${m.sender_id===currentUser.id?'mine':'theirs'}">${esc(m.content)}</div>`).join('') || `<div class="hint">Henüz mesaj yok. Sayfa Yöneticisine sormak istediğiniz bir şey varsa buradan yazabilirsiniz.</div>`;
    thread.scrollTop = thread.scrollHeight;
  };
  document.getElementById('msgForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const input = document.getElementById('msgInput');
    if(!input.value.trim()) return;
    const { error } = await sb.from('admin_messages').insert({ user_id: currentUser.id, sender_id: currentUser.id, content: input.value.trim() });
    if(error){ alert('Gönderilemedi: '+error.message); return; }
    input.value = '';
    loadThread();
  });
  loadThread();
}

        <div class="stat"><div class="stat-icon">${ICN.link}</div><div><b>${matchedR||0}</b><span>Eşleştirilen Talepler</span></div></div>
        <div class="stat"><div class="stat-icon">${ICN.award}</div><div><b>${doneR||0}</b><span>Tamamlanan Eşleşmeler</span></div></div>

      <div class="card" style="padding:0;overflow-x:auto;">
      <table><thead><tr><th>İsim</th><th>Şehir</th><th>Durum</th><th>İşlemler</th></tr></thead><tbody>
      ${(teachers||[]).map(t=>`<tr>
        <td>${esc(t.display_name)}</td><td>${esc(t.city)}</td>
        <td><span class="badge badge-${t.status}">${statusLabel(t.status)}</span></td>
        <td class="row-actions">
          <button class="btn btn-outline btn-sm" onclick="adminViewTeacher('${t.id}')">İncele</button>
          ${t.status!=='approved'?`<button class="btn btn-green btn-sm" onclick="setTeacherStatus('${t.id}','approved')">Onayla</button>`:''}
          ${t.status!=='rejected'?`<button class="btn btn-danger btn-sm" onclick="setTeacherStatus('${t.id}','rejected')">Reddet</button>`:''}
          ${t.status==='approved'?`<button class="btn btn-ghost btn-sm" onclick="setTeacherStatus('${t.id}','suspended')">Askıya Al</button>`:''}
        </td>
      </tr>`).join('') || `<tr><td colspan="4">Kayıt yok.</td></tr>`}
      </tbody></table></div>`;
  }

  else if(tab==='requests'){
    const { data: reqs } = await sb.from('student_requests').select('*').order('created_at',{ascending:false});
    body.innerHTML = `
      <div class="page-title-row"><div><h2>Öğrenci Talepleri</h2><p style="color:var(--ink-soft);margin:0;">Gelen talepleri inceleyin ve öğretmen eşleştirin.</p></div></div>
      <div class="card" style="padding:0;overflow-x:auto;">
      <table><thead><tr><th>Ad</th><th>Hedef</th><th>Seviye</th><th>Şehir</th><th>Durum</th><th></th></tr></thead><tbody>
      ${(reqs||[]).map(r=>`<tr>
        <td>${esc(r.ad)}</td><td>${esc(r.hedef)}</td><td>${esc(r.seviye)}</td><td>${esc(r.sehir)}</td>
        <td><span class="badge badge-new">${esc(r.status)}</span></td>
        <td><button class="btn btn-outline btn-sm" onclick="adminViewRequest('${r.id}')">İncele / Eşleştir</button></td>
      </tr>`).join('') || `<tr><td colspan="6">Kayıt yok.</td></tr>`}
      </tbody></table></div>`;
  }

  else if(tab==='matches'){
    const { data: matches } = await sb.from('matches').select('*, student_requests(ad,hedef), teacher_profiles(display_name)').order('created_at',{ascending:false});
    body.innerHTML = `
      <div class="page-title-row"><div><h2>Eşleşmeler</h2><p style="color:var(--ink-soft);margin:0;">Yapılan tüm öğretmen-öğrenci eşleştirmeleri.</p></div></div>
      <div class="card" style="padding:0;overflow-x:auto;">
      <table><thead><tr><th>Öğrenci</th><th>Öğretmen</th><th>Hedef</th><th>Durum</th></tr></thead><tbody>

      </tbody></table></div>`;
  }

  else if(tab==='messages'){
    const { data: msgs } = await sb.from('admin_messages').select('*, profiles!admin_messages_user_id_fkey(full_name, role)').order('created_at',{ascending:false}).limit(500);
    const byUser = {};
    (msgs||[]).forEach(m=>{
      if(!byUser[m.user_id]) byUser[m.user_id] = { user_id:m.user_id, profile:m.profiles, last:m };
    });
    const threads = Object.values(byUser).sort((a,b)=> new Date(b.last.created_at) - new Date(a.last.created_at));
    body.innerHTML = `
      <div class="page-title-row"><div><h2>Mesajlar</h2><p style="color:var(--ink-soft);margin:0;">Öğretmen ve öğrencilerle olan tüm yazışmalar.</p></div></div>

        <div class="card" style="max-height:460px;overflow-y:auto;padding:10px;">

            <div class="thread-item" id="thread-${t.user_id}" onclick="adminOpenThread('${t.user_id}')">
              <b>${esc(t.profile?.full_name || 'Kullanıcı')}</b>
              <div class="meta">${t.profile?.role==='teacher'?'Öğretmen':'Öğrenci'}</div>
              <div class="snippet">${esc(t.last.content)}</div>
            </div>
          `).join('')}
        </div>
        <div>
          <div id="adminMsgThread" class="msg-thread"><div class="hint" style="padding:20px;">Soldan bir konuşma seçin.</div></div>

            <button class="btn btn-primary btn-sm" type="submit" disabled>${ICN.send} Gönder</button>
          </form>
        </div>
      </div>
    `;
    document.getElementById('adminMsgForm').addEventListener('submit', async e=>{
      e.preventDefault();
      if(!window.__adminThreadUser) return;
      const input = document.getElementById('adminMsgInput');
      if(!input.value.trim()) return;
      const { error } = await sb.from('admin_messages').insert({ user_id: window.__adminThreadUser, sender_id: currentUser.id, content: input.value.trim() });
      if(error){ alert('Gönderilemedi: '+error.message); return; }
      input.value = '';
      adminOpenThread(window.__adminThreadUser);
    });
  }

  else if(tab==='logs'){
    const { data: logs } = await sb.from('admin_logs').select('*').order('created_at',{ascending:false}).limit(100);

      <div class="page-title-row"><div><h2>Admin Logları</h2><p style="color:var(--ink-soft);margin:0;">Son 100 işlem.</p></div></div>

async function adminOpenThread(userId){
  window.__adminThreadUser = userId;
  document.querySelectorAll('.thread-item').forEach(el=>el.classList.toggle('active', el.id===`thread-${userId}`));
  const { data: msgs } = await sb.from('admin_messages').select('*').eq('user_id', userId).order('created_at',{ascending:true});
  const thread = document.getElementById('adminMsgThread');
  thread.innerHTML = (msgs||[]).map(m=>`<div class="bubble ${m.sender_id===currentUser.id?'mine':'theirs'}">${esc(m.content)}</div>`).join('') || `<div class="hint" style="padding:20px;">Henüz mesaj yok.</div>`;
  thread.scrollTop = thread.scrollHeight;
  document.getElementById('adminMsgInput').disabled = false;
  document.querySelector('#adminMsgForm button').disabled = false;
}

async function setTeacherStatus(id, status){
  const { error } = await sb.from('teacher_profiles').update({status}).eq('id', id);
  if(error){ alert('Güncellenemedi: '+error.message); return; }
  await logAdmin(`teacher_status_${status}`, 'teacher_profiles', id);
  adminTab('teachers');
}

async function adminViewTeacher(id){
  const [{ data: t }, { data: priv }] = await Promise.all([
    sb.from('teacher_profiles').select('*').eq('id', id).single(),
    sb.from('teacher_private').select('*').eq('teacher_id', id).maybeSingle()
  ]);
  openModal(`
    <div class="modal-body" style="padding-top:28px;">
      <div class="page-title-row" style="margin-bottom:14px;">
        <h2 style="margin:0;">${esc(t.display_name)}</h2>
        <span class="badge badge-${t.status}">${statusLabel(t.status)}</span>
      </div>
      <div class="modal-section"><h5>İletişim (gizli)</h5><p style="margin:0;">${esc(priv?.phone||'-')} · ${esc(priv?.email||'-')}</p></div>
      <div class="grid-2">
        <div class="modal-section"><h5>Şehir</h5><p style="margin:0;">${esc(t.city)||'-'}</p></div>
        <div class="modal-section"><h5>Deneyim</h5><p style="margin:0;">${t.experience_years||'-'} yıl</p></div>
      </div>
      <div class="modal-section"><h5>Eğitim</h5><p style="margin:0;">${esc(t.education)||'-'}</p></div>
      <div class="modal-section"><h5>Sertifikalar</h5><p style="margin:0;">${esc(t.certificates)||'-'}</p></div>
      <div class="modal-section"><h5>Bio</h5><p style="margin:0;">${esc(t.bio)||'-'}</p></div>
    </div>
    <div class="modal-footer row-actions">
      <button class="btn btn-green btn-sm" onclick="setTeacherStatus('${t.id}','approved');closeModal();">Onayla</button>
      <button class="btn btn-danger btn-sm" onclick="setTeacherStatus('${t.id}','rejected');closeModal();">Reddet</button>
      <button class="btn btn-ghost btn-sm" onclick="setTeacherStatus('${t.id}','suspended');closeModal();">Askıya Al</button>
    </div>
  `);
}

async function adminViewRequest(id){
  const [{ data: r }, { data: candidates }] = await Promise.all([
    sb.from('student_requests').select('*').eq('id', id).single(),
    sb.from('teacher_profiles').select('*').eq('status','approved')
  ]);
  const filtered = (candidates||[]).filter(t=>
    (!r.seviye || (t.levels||[]).includes(r.seviye)) &&
    (!r.lesson_type || t.lesson_type===r.lesson_type || t.lesson_type==='ikisi_de')
  );
  let pool = filtered.length ? filtered : (candidates||[]);
  if(r.preferred_teacher_id){
    pool = [...pool].sort((a,b)=> (a.id===r.preferred_teacher_id?-1:0) - (b.id===r.preferred_teacher_id?-1:0));
  }
  const preferred = (candidates||[]).find(t=>t.id===r.preferred_teacher_id);
  openModal(`
    <div class="modal-body" style="padding-top:28px;">
      <h2 style="margin-bottom:14px;">${esc(r.ad)} — Talep Detayı</h2>
      <div class="grid-2">
        <div class="modal-section"><h5>Telefon</h5><p style="margin:0;">${esc(r.telefon)}</p></div>
        <div class="modal-section"><h5>E-posta</h5><p style="margin:0;">${esc(r.email)}</p></div>
      </div>
      <div class="grid-2">
        <div class="modal-section"><h5>Hedef</h5><p style="margin:0;">${esc(r.hedef)||'-'}</p></div>
        <div class="modal-section"><h5>Seviye / Yaş</h5><p style="margin:0;">${esc(r.seviye)||'-'} · ${r.ogrenci_yasi||'-'}</p></div>
      </div>
      <div class="grid-2">
        <div class="modal-section"><h5>Şehir / Tür</h5><p style="margin:0;">${esc(r.sehir)||'-'} · ${esc(r.lesson_type)}</p></div>
        <div class="modal-section"><h5>Haftalık</h5><p style="margin:0;">${r.haftalik_ders_sayisi||'-'} ders · ${esc(r.ders_suresi)}</p></div>
      </div>
      <div class="modal-section"><h5>Bütçe</h5><p style="margin:0;">${esc(r.butce)||'-'}</p></div>
      <div class="modal-section"><h5>Tercih Günler/Saatler</h5><p style="margin:0;">${(r.tercih_gunler||[]).join(', ')||'-'} — ${esc(r.tercih_saatler)}</p></div>
      <div class="modal-section"><h5>Açıklama</h5><p style="margin:0;">${esc(r.aciklama)||'-'}</p></div>
      ${preferred ? `<div class="msg msg-info">${ICN.star} Öğrencinin tercih ettiği öğretmen: <b>${esc(preferred.display_name)}</b></div>` : ''}
      <label>Durum</label>
      <select id="reqStatusSel">
        ${['yeni','inceleniyor','ogretmen_araniyor','eslestirildi','iletisime_gecildi','tamamlandi','iptal'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="updateReqStatus('${r.id}')">Durumu Güncelle</button>
      <div class="modal-section" style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px;">
        <h5>Bu talebe uygun ${pool.length} öğretmen</h5>
        <div style="max-height:220px;overflow-y:auto;">
          ${pool.map(t=>`<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;${t.id===r.preferred_teacher_id?'border-color:var(--orange);':''}">
            <span>${t.id===r.preferred_teacher_id?`${ICN.star} `:''}${esc(t.display_name)} — ${esc(t.city)} ${t.price_range?`· ${esc(t.price_range)}`:''}</span>
            <button class="btn btn-primary btn-sm" onclick="createMatch('${r.id}','${t.id}')">Eşleştir</button>
          </div>`).join('') || '<div class="hint">Uygun onaylı öğretmen bulunamadı.</div>'}
        </div>
      </div>
    </div>
  `);
}
async function updateReqStatus(reqId){
  const status = document.getElementById('reqStatusSel').value;
  const { error } = await sb.from('student_requests').update({status}).eq('id', reqId);
  if(error){ alert('Güncellenemedi: '+error.message); return; }
  await logAdmin(`request_status_${status}`, 'student_requests', reqId);
  closeModal(); adminTab('requests');
}
async function createMatch(requestId, teacherId){
  const { error } = await sb.from('matches').insert({ request_id: requestId, teacher_id: teacherId, matched_by: currentUser.id, status:'onerildi' });
  if(error){ alert('Eşleştirilemedi: '+error.message); return; }
  await sb.from('student_requests').update({status:'ogretmen_araniyor'}).eq('id', requestId);
  await sb.from('notifications').insert({ user_id: teacherId, message: 'Size uygun yeni bir özel ders talebi var.' });
  await logAdmin('match_created', 'matches', requestId+'->'+teacherId);
  closeModal();
  alert('Eşleştirme oluşturuldu.');
  adminTab('requests');
}

(async function init(){
  await refreshAuth();
  const hash = window.location.hash;
  if(localStorage.getItem('ao_oauth_flow') || hash.includes('access_token')){
    localStorage.removeItem('ao_oauth_flow');
    await resolvePendingGoogleRole();
    if(currentUser){ await postLoginRedirect(); return; }
  }
  const initial = hash.replace('#','') || 'home';
  go(initial);
})();
</script>
