 got his nephew to fix his phone last week.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We had our old car sold to a family friend.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Did you ___ (have) your grandfather's watch ___ (repair)?", "section": "Dialogue · Complete with the correct causative form.", "reveal": "have / repaired", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I ___ (get) a jeweller ___ (fix) it last week — it works perfectly now.", "section": "Dialogue · Complete with the correct causative form.", "reveal": "got / to fix", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "her / painted / grandmother / portrait / had / my", "section": "Dialogue · Reorder the sentence.", "words": ["my", "grandmother", "had", "her", "portrait", "painted"], "end": ".", "reveal": "My grandmother had her portrait painted.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Asking for and Giving Advice: should, ought to, had better, if I were you, why don't you", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["If you want a closer relationship with your grandparents, you <mark>should<\/mark> call them more often, not just text.", "You <mark>ought to<\/mark> listen to your parents' experience before dismissing their advice completely.", "You <mark>had better<\/mark> ask your grandmother about the family recipe before it's forgotten forever.", "<mark>Why don't you<\/mark> ask your father to teach you how he learned to save money as a teenager?"], "ask": "Which expressions give general advice, and which one sounds like a stronger warning about something urgent?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["general advice", "a stronger warning, often with a negative consequence", "a friendly suggestion, as a question", "imagining yourself in someone's situation"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Should' and 'ought to' give ___.", "section": "Complete the rule", "reveal": "general advice", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Had better' gives ___.", "section": "Complete the rule", "reveal": "a stronger warning, often with a negative consequence", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Why don't you…?' offers ___.", "section": "Complete the rule", "reveal": "a friendly suggestion, as a question", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'If I were you, I would…' means ___.", "section": "Complete the rule", "reveal": "imagining yourself in someone's situation", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Should' and 'ought to' give general advice. 'Had better' gives a stronger warning, often implying a negative consequence if not followed. 'Why don't you…?' offers a friendly suggestion as a question. 'If I were you, I would…' gives advice by imagining yourself in someone else's situation.", "tr": "Genel tavsiye vermek için 'should' ve 'ought to' kullanılır. Daha güçlü, ciddi sonuçları olan bir uyarı için 'had better' kullanılır. Nazik bir öneriyi soru şeklinde sunmak için 'Why don't you…?' kullanılır. Kendimizi birinin yerine koyarak tavsiye vermek için 'If I were you, I would…' kullanılır.", "when_en": "We use these expressions when exchanging advice within a family or across generations, especially when a polite or respectful tone is needed.", "when": "Aile içinde ya da kuşaklar arasında tavsiye alışverişinde bulunurken, özellikle nazik ya da saygılı bir üslup gerektiğinde bu yapıları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["you", "should / spend more time", "with your grandparents"], "reveal": "You should spend more time with your grandparents.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "ought to / respect", "your elders' experience"], "reveal": "You ought to respect your elders' experience.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "had better / apologise", "before your grandmother gets upset"], "reveal": "You had better apologise before your grandmother gets upset.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["why / don't you", "ask your father", "for advice about the interview?"], "reveal": "Why don't you ask your father for advice about the interview?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["if I / were you", "I / would talk to", "my parents honestly"], "reveal": "If I were you, I would talk to my parents honestly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / what / should", "I do", "if my grandparents disagree with my choices?"], "reveal": "What should I do if my grandparents disagree with my choices?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences giving advice about handling a generational disagreement — use at least three different advice expressions.", "chips": ["If your grandparents don't understand…, you should…", "You ought to…", "Why don't you…", "If I were you, I would…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You should call your grandmother more often.", "You had better talk to your parents before deciding."], "negative": ["You shouldn't ignore your elders' advice completely.", "You'd better not argue with your grandfather at dinner."], "question": ["What should I do about this disagreement?", "Why don't you ask your mother for her opinion?"], "short": ["You should apologise. / You shouldn't wait any longer.", "Why don't you? / I already did."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You should to listen to your grandmother.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should listen to your grandmother.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You had better to apologise soon.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You had better apologise soon.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If I was you, I would talk to him honestly.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If I were you, I would talk to him honestly.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ you ask your grandmother about her childhood? It might be fascinating.", "section": "A · Choose the correct option.", "options": ["Why don't", "Should", "Had better"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You ___ apologise now, or your grandfather will be upset all evening.", "section": "A · Choose the correct option.", "options": ["should", "had better", "why don't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "If I ___ you, I would listen to my parents' concerns first.", "section": "A · Choose the correct option.", "options": ["was", "were", "am"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You ___ (ought) respect your elders, even when you disagree with them.", "section": "B · Complete with the correct form.", "reveal": "ought to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You'd ___ (better) call your grandmother back before it gets too late.", "section": "B · Complete with the correct form.", "reveal": "better", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Why ___ you ask your father for advice about the job interview?", "section": "B · Complete with the correct form.", "reveal": "don't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "You should to talk to your grandparents more often.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should talk to your grandparents more often.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "If I were you, I would ask my mother for advice.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "You had better to finish your homework before dinner.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You had better finish your homework before dinner.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: My grandmother keeps giving me advice I didn't ask for. What ___ I do?", "section": "Dialogue · Complete with the correct advice expression.", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: If I ___ you, I ___ (listen) politely, even if you don't follow every word.", "section": "Dialogue · Complete with the correct advice expression.", "reveal": "were / would listen", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "elders / respect / ought / your / you / to", "section": "Dialogue · Reorder the sentence.", "words": ["you", "ought", "to", "respect", "your", "elders"], "end": ".", "reveal": "You ought to respect your elders.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Same River, Different Banks", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think 'the same river, different banks' might mean about generations?", "What is one thing your grandparents' generation did differently from yours?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Same River, Different Banks", "num": 1, "total": 3, "text": "Every generation likes to believe it invented independence. Grandparents in Türkiye often describe childhoods spent playing football in the street until dark, with no phone to call home and no need for one — the whole neighbourhood, they say, looked after every child. Their grandchildren, meanwhile, grew up with smartphones in their pockets and a constant stream of messages from worried parents. Which generation was really freer is a question that rarely gets a simple answer.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Same River, Different Banks", "num": 2, "total": 3, "text": "Sociologists suggest that each generation's outlook is shaped less by personality than by the economic and technological conditions it grows up in. A generation that lived through hardship often values saving money and repairing things rather than replacing them; a generation raised with instant information often values speed, choice and self-expression instead. Neither outlook is wrong — they are simply sensible responses to very different worlds.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Same River, Different Banks", "num": 3, "total": 3, "text": "The real danger, researchers argue, isn't the generation gap itself but the assumption that it can't be bridged. Families who regularly talk about their different experiences — rather than judging each other by their own generation's standards — tend to pass down both practical skills and emotional closeness. A grandmother who gets her granddaughter to show her how video calls work, and a granddaughter who asks her grandmother how she once cooked for a family of ten on a tight budget, are both quietly closing the same gap.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Older generations were always freer than younger ones.", "Each generation's outlook is shaped by its own conditions, and the gap can be bridged through mutual sharing.", "Technology has made family relationships impossible."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "According to sociologists, each generation's outlook is shaped by ___ and technological conditions.", "section": "While you read", "reveal": "economic", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what is the 'real danger' regarding the generation gap?", "section": "While you read", "options": ["That grandparents don't understand smartphones", "The assumption that the gap can't be bridged", "That young people don't want to learn to cook"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, one generation's outlook is simply wrong compared to another's.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, neither outlook is wrong — both are sensible responses to different conditions.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The final paragraph gives an example of a grandmother who gets her granddaughter to show her how ___ work.", "section": "While you read", "reveal": "video calls", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you agree that neither generation's outlook is 'wrong'? Why or why not?", "Can you think of a skill an older relative could teach you, or one you could teach them?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Letters, Landlines and Loud Dinners", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you know about how people communicated before mobile phones?", "Does your family have any rules about phones at meals? What do you think of them?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Letters, Landlines and Loud Dinners", "num": 1, "total": 3, "text": "Merve's grandfather still keeps a box of handwritten letters from his years working abroad in the 1970s. 'We waited weeks for news,' he tells her, 'and every letter felt like an event.' Merve, who video-calls her cousins in Germany every weekend without a second thought, finds the story almost impossible to imagine — yet she notices that her grandfather remembers the exact words of letters he received fifty years ago, while she sometimes forgets a text message within minutes.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Letters, Landlines and Loud Dinners", "num": 2, "total": 3, "text": "The family's Sunday dinners are where these two worlds collide loudest. Merve's grandmother insists that everyone sit at the table with their phones switched off, a rule she enforces with surprising firmness for someone so soft-spoken otherwise. At first, Merve found the rule old-fashioned and slightly unfair. Over time, though, she noticed that these were the only two hours each week when her whole extended family actually looked at one another while talking.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Letters, Landlines and Loud Dinners", "num": 3, "total": 3, "text": "Merve's mother, caught between both generations, often acts as a translator of sorts — explaining to her own mother why a video call matters as much as a letter once did, and reminding Merve that patience, not just connection, was something her grandfather's generation had in abundance. Nobody in the family has fully convinced the others that their way is best. What they have managed, slowly, is to borrow a little from each generation and build something that works for all three.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What does Merve's grandfather still keep from his years working abroad?", "section": "While you read", "options": ["Old photographs", "A box of handwritten letters", "Recorded phone calls"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Merve's grandmother insists that everyone switch off their ___ at Sunday dinner.", "section": "While you read", "reveal": "phones", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Merve immediately loved her grandmother's no-phones rule at dinner.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "At first, Merve found the rule old-fashioned and slightly unfair.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What role does Merve's mother often play between the two generations?", "section": "While you read", "options": ["She ignores both sides completely.", "She acts as a kind of translator between them.", "She always agrees only with her own mother."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "By the end of the text, the family has managed to borrow a little from each generation and build something that works for all ___.", "section": "While you
