uralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the author", "grow up / in a village", "before he became famous"], "reveal": "The author grew up in a village before he became famous.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "write / her first novel", "at the age of nineteen"], "reveal": "She wrote her first novel at the age of nineteen.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["while the crew", "film / the final scene", "it started raining heavily"], "reveal": "While the crew was filming the final scene, it started raining heavily.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["as a teenager, he", "use to / read / one book a week"], "reveal": "As a teenager, he used to read one book a week.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the composer", "not use to / like / his own soundtrack", "at first"], "reveal": "The composer didn't use to like his own soundtrack at first.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "ever / watch", "a film that changed the way you thought"], "reveal": "Did you ever watch a film that changed the way you thought?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt er to it.", "section": "B · Complete with the correct form.", "reveal": "didn't use to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The novelist use to write every morning before breakfast.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The novelist used to write every morning before breakfast.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "While she was reading the final chapter, she started crying.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The director was direct his first film in 1998.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The director directed his first film in 1998.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ you ___ (do) when you first heard the news about the sequel?", "section": "Dialogue · Complete with the correct past form.", "reveal": "were / doing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (read) the first book, and I nearly ___ (drop) it from excitement!", "section": "Dialogue · Complete with the correct past form.", "reveal": "was reading / dropped", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "novels / used / she / romantic / read / to", "section": "Dialogue · Reorder the sentence.", "words": ["she", "used", "to", "read", "romantic", "novels"], "end": ".", "reveal": "She used to read romantic novels.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Expressing Preferences: prefer, would rather and comparatives", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I <mark>prefer<\/mark> reading the book before watching the film adaptation.", "\"Honestly, I<mark>'d rather<\/mark> watch a classic than a new blockbuster,\" she admitted.", "For me, the novel is <mark>far more moving<\/mark> than the film ever could be.", "Of all the director's works, most critics agree this one is <mark>the most thought-provoking<\/mark>."], "ask": "Which structures compare two specific things directly, and which one picks out the best or most extreme example from a whole group?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "'Prefer + noun/-ing' expresses a general preference (I prefer novels to films). 'Would rather + base verb' expresses a preference for a specific moment or situation (I'd rather read than watch TV). Use a comparative (more … than) to compare two specific things directly, and a superlative (the most …) to pick out the most extreme example in a whole group.", "tr": "'Prefer + isim/-ing' genel bir tercihi ifade eder (I prefer novels to films). 'Would rather + fiilin yalın hali' belirli bir anda ya da durumda yapılacak tercihi belirtir (I'd rather read than watch TV). İki şeyi doğrudan karşılaştırmak için karşılaştırma sıfatı (more … than), bir grubun en uç örneğini belirtmek için ise üstünlük sıfatı (the most …) kullanılır.", "when_en": "We use these structures when comparing a book with its film adaptation, choosing between two classic works, or describing a work as the best or most striking example within a group.", "when": "Bir kitap ile filmini karşılaştırırken, iki klasik eser arasında tercih yaparken ya da bir eseri bir grup içinde en iyi/en etkileyici olarak nitelendirirken bu yapıları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I", "prefer / classic novels", "modern thrillers"], "reveal": "I prefer classic novels to modern thrillers.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "would rather / read the book", "watch the adaptation"], "reveal": "She would rather read the book than watch the adaptation.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this novel", "be / far more gripping", "the sequel"], "reveal": "This novel is far more gripping than the sequel.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["for many critics", "this / be / the most moving", "film of the decade"], "reveal": "For many critics, this is the most moving film of the decade.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "not / prefer / remakes", "original films"], "reveal": "I don't prefer remakes to original films.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "would rather / read a poem or watch a film", "about the same story"], "reveal": "Would you rather read a poem or watch a film about the same story?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences comparing a book and its film adaptation, or two classic stories you know, using prefer, would rather and at least one comparative or superlative.", "chips": ["I prefer…", "I'd rather…", "In my opinion, … is more … than …", "Of all the classics I know, … is the most …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I prefer reading to watching TV.", "She'd rather finish the novel first."], "negative": ["He doesn't prefer remakes to originals.", "I wouldn't rather watch the sequel; I'd rather reread the book."], "question": ["Do you prefer books or films?", "Would you rather watch the classic or the remake?"], "short": ["I prefer books. / I prefer films.", "I'd rather watch the classic."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I prefer books than films.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I prefer books to films.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I'd rather to read than watch.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I'd rather read than watch.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This novel is more interesting than the film ever could.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This novel is more interesting than the film could ever be.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I ___ classic novels ___ modern thrillers.", "section": "A · Choose the correct option.", "options": ["prefer / to", "prefer / than", "would rather / to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Honestly, I ___ read the poem again before we discuss it.", "section": "A · Choose the correct option.", "options": ["prefer", "'d rather", "the most"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "For many readers, this is ___ ending in the whole series.", "section": "A · Choose the correct option.", "options": ["more moving", "the most moving", "moving than"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She ___ (prefer) the original story ___ any of the remakes.", "section": "B · Complete with the correct form.", "reveal": "prefers / to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I'd ___ (rather) reread an old favourite than start something new.", "section": "B · Complete with the correct form.", "reveal": "rather", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This character is far ___ (interesting) than the protagonist.", "section": "B · Complete with the correct form.", "reveal": "more interesting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I prefer novels than short stories.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I prefer novels to short stories.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I'd rather watch the film first.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This is the more gripping book I have ever read.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the most gripping book I have ever read.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Would you ___ read the book or watch the film first?", "section": "Dialogue · Complete with the correct preference form.", "reveal": "rather", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (prefer) the book, because it's usually ___ (detailed) than the film.", "section": "Dialogue · Complete with the correct preference form.", "reveal": "prefer / more detailed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "ending / most / moving / it / the / is / film's / the", "section": "Dialogue · Reorder the sentence.", "words": ["it", "is", "the", "film's", "most", "moving", "ending"], "end": ".", "reveal": "It is the film's most moving ending.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Life Behind the Camera", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of person do you think this text is about?", "Do you know any directors or authors who became famous later in life? What was their early life like?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Life Behind the Camera", "num": 1, "total": 3, "text": "Long before he became known for his dreamlike animated worlds, the director grew up in a quiet town far from any film studio. As a boy, he used to spend hours drawing his own comic strips instead of doing his homework, and his teachers often complained that he never paid attention in class. Nobody in his family had worked in film before, so when he announced that he wanted to make movies, his parents were quietly worried.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Life Behind the Camera", "num": 2, "total": 3, "text": "His first years in the industry were far from glamorous. While he was working as a junior animator, he spent long nights redrawing scenes that senior directors rejected, and he nearly gave up more than once. Everything changed when he was finally allowed to direct a short film of his own. It told a simple story about a lonely girl and a magical forest, but audiences who saw it were deeply moved, and critics praised its gentle, thoughtful pace.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Life Behind the Camera", "num": 3, "total": 3, "text": "Decades later, his films are studied in universities and loved by children and adults alike. He still insists that every frame should be drawn by hand whenever possible, even in an age of computer animation. When a journalist once asked why he never used more modern techniques, he simply replied that a story feels more honest when you can see the artist's hand behind it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What did the director use to do as a boy, according to the text?", "section": "While you read", "options": ["He worked in a film studio.", "He drew his own comic strips instead of doing homework.", "He wrote novels with his grandmother."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "As a junior animator, he spent long nights ___ scenes that senior directors rejected.", "section": "While you read", "reveal": "redrawing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What was his first short film about?", "section": "While you read", "options": ["A lonely girl and a magical forest", "A director's difficult childhood", "A famous novelist's life"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, the director's family were experienced filmmakers who supported him immediately.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, nobody in his family had worked in film before, and his parents were quietly worried.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "He believes a story feels more honest when you can see the ___ behind it.", "section": "While you read", "reveal": "artist's hand", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Why do you think the director still prefers hand-drawn animation, even today?", "Would you rather watch a hand-drawn film or a computer-animated one? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "What Makes a Story a Classic?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Before you read, think of a book or film you consider a 'classic'. Why do you think it has lasted so long?", "What do you think makes a fictional character memorable?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "What Makes a Story a Classic?", "num": 1, "total": 3, "text": "Every year, thousands of new novels and films are released, yet only a small number are still discussed decades later. So what separates a passing bestseller from a genuine classic? One answer lies in the characters themselves. A classic protagonist usually has flaws as well as strengths, which makes them feel believable rather than perfect. Readers remember characters who make difficult choices, not ones who always know exactly what to do.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What Makes a Story a Classic?", "num": 2, "total": 3, "text": "Setting plays an important role too. Many classic stories are set in a specific time and place, yet they explore ideas that go far beyond that setting — loyalty, ambition, loss, forgiveness. A short story about a fisherman on a remote island can still say something true about any reader's own life, wherever and whenever they happen to be reading it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What Makes a Story a Classic?", "num": 3, "total": 3, "text": "Finally, a classic often rewards a second reading or a second viewing. On the first read, we usually focus on the plot: what happens next? On the second, we start to notice smaller details — a narrator who isn't entirely honest, an antagonist who has understandable reasons for their actions, a piece of dialogue that means something different once we know how the story ends. It's this depth, more than fame or sales figures, that keeps a story alive.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what usually makes a classic protagonist feel believable?", "section": "While you read", "options": ["Being perfect and never making mistakes", "Having both flaws and strengths", "Always knowing exactly what to do"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The text says setting matters, but classic stories explore ideas that go far beyond that ___.", "section": "While you read", "reveal": "setting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, a classic story usually only rewards one reading or viewing.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, a classic often rewards a second reading or viewing, revealing new details.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What might a reader notice on a second reading, according to the text?", "section": "While you read", "options": ["A completely different plot", "Small details, such as an unreliable narrator", "The exact sales figures of the book"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The text concludes that it is depth, more than fame or ___, that keeps a story alive.", "section": "While you read", "reveal": "sales figures", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you agree that a story needs 'depth' to become a classic? Can you think of a counter-example?", "Think of a story you've read or watched more than once. Did you notice something new the second time?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "The Film We Used to Watch", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what kind of film do you think two old friends might remember fondly from their childhood?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "The Film We Used to Watch", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What did Kerem and Aslı use to do every winter?", "section": "While you listen", "options": ["Write stories together", "Watch an old black-and-white film", "Visit a cinema in another city"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Kerem used to cry every time at the ___.", "section": "While you listen", "reveal": "ending", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Kerem's little sister thought the film was faster than she expected.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kerem's little sister thought the film was slower than she expected.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Aslı prefer, according to the dialogue?", "section": "While you listen", "options": ["The remake, because it's more modern", "The original film, because it's more moving", "Neither the original nor the remake"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Analysing a Character", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What do you predict Mira will talk about — the plot, a character, or the setting?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Analysing a Character", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "How does the protagonist seem at the beginning of the story, accordin  Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "He didn't ___ (use to) enjoy poetry until his teacher introduced him to it.", "section": "Exit ticket", "reveal": "use to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word describes a character who opposes the main character?", "section": "Exit ticket", "options": ["protagonist", "antagonist", "narrator"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A film or TV version of a book is called an ___.", "section": "Exit ticket", "reveal": "adaptation", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "A work of art considered one of the best of its kind is called a ___.", "section": "Exit ticket", "options": ["masterpiece", "sequel", "remake"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order.", "section": "Exit ticket", "words": ["she", "used", "to", "read", "romantic", "novels"], "end": ".", "reveal": "She used to read romantic novels.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "judge", "q": "I prefer novels than short stories.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I prefer novels to short stories.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using the correct past form.", "section": "Exit ticket", "reveal": "She wrote her first novel at the age of nineteen.", "prompt": "She writes her first novel at the age of nineteen. (rewrite in the past)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The audience ___ (still / watch) the credits when the lights came on.", "section": "Exit ticket", "reveal": "was still watching", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
