ect"], "answer": 1, "fix": "She showed off to her friends with her new skateboard. / She showed off in front of her friends.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Wingsuit flying slowly caught on among young athletes.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Did you ever ___ (take up) an extreme sport?", "section": "Dialogue · Complete with the correct phrasal verb.", "reveal": "take up", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I ___ (take up) parkour two years ago, but I almost ___ (give up) it after my first injury.", "section": "Dialogue · Complete with the correct phrasal verb.", "reveal": "took up / gave up", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "along / new / the / teammates / get / well / really", "section": "Dialogue · Reorder the sentence.", "words": ["the", "new", "teammates", "get", "along", "really", "well"], "end": ".", "reveal": "The new teammates get along really well.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Simple Present & Present Progressive: Current Sports Trends and Events", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Extreme sports generally <mark>attract<\/mark> thrill-seekers who love a challenge.", "Right now, more and more teenagers <mark>are trying<\/mark> wingsuit flying for the first time.", "Every August, wrestlers from across the country <mark>compete<\/mark> at Kırkpınar in Edirne.", "Look at this footage — the rider <mark>is throwing<\/mark> the javelin just as his horse gallops past."], "ask": "Which sentences describe a general fact or habit about sport, and which describe something happening right now or as a current trend?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["base verb (+s/es)", "is/are + -ing", "a general fact or habit", "happening now or as a current trend"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "For ___, we use the Simple Present: ___.", "section": "Complete the rule", "reveal": "a general fact or habit / base verb (+s/es)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For something ___, we use the Present Progressive: ___.", "section": "Complete the rule", "reveal": "happening now or as a current trend / is/are + -ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Use the Simple Present for general facts, habits and regularly repeated sporting events. Use the Present Progressive (be + -ing) for something happening right now, or a current trend/news item.", "tr": "Genel gerçekler, alışkanlıklar ve düzenli olarak tekrarlanan spor etkinlikleri için Simple Present kullanılır. Şu anda olan bir eylem ya da güncel bir trend/haber için Present Progressive (be + -ing) kullanılır.", "when_en": "Use the Simple Present to describe a sport in general or when a traditional event takes place; use the Present Progressive for an action happening now or a current sports trend.", "when": "Bir sporu genel olarak tanımlarken ya da geleneksel bir etkinliğin ne zaman yapıldığını anlatırken Simple Present; şu anda olan bir hareketi ya da güncel bir spor trendini anlatırken Present Progressive kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["extreme sports", "generally / attract", "thrill-seekers"], "reveal": "Extreme sports generally attract thrill-seekers.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["more teenagers", "try", "wingsuit flying (this year)"], "reveal": "This year, more teenagers are trying wingsuit flying.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Kırkpınar wrestlers", "compete", "every August"], "reveal": "Kırkpınar wrestlers compete every August.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["look — the rider", "throw", "the javelin (right now)"], "reveal": "Look — the rider is throwing the javelin right now.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["oil wrestling", "usually / take place", "in Edirne"], "reveal": "Oil wrestling usually takes place in Edirne.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / interest in extreme sports", "grow", "among Turkish teenagers"], "reveal": "Is interest in extreme sports growing among Turkish teenagers?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about sports: one general fact, one current trend or news item, and two sentences about something you or your friends are doing this week related to sport.", "chips": ["Extreme sports generally…", "Right now, more people…", "This week, I am…", "At the moment, our class…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Oil wrestling takes place every summer.", "More people are trying extreme sports this year."], "negative": ["Javelin isn't a dangerous sport if the rules are followed.", "She isn't competing in this year's tournament."], "question": ["Does your city have a traditional sports festival?", "Is interest in extreme sports growing?"], "short": ["Yes, it does. / No, it doesn't.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Right now, more teenagers try wingsuit flying.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Right now, more teenagers are trying wingsuit flying.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Wrestlers are competing at Kırkpınar every August.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Wrestlers compete at Kırkpınar every August.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Oil wrestling ___ place in Edirne every summer.", "section": "A · Choose the correct option.", "options": ["takes", "is taking", "take"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Look! The wrestler ___ his opponent right now.", "section": "A · Choose the correct option.", "options": ["grips", "is gripping", "grip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This year, interest in extreme sports ___ among teenagers.", "section": "A · Choose the correct option.", "options": ["grows", "is growing", "grow"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Javelin riders ___ (throw) their sticks as the horses gallop past — that's the traditional rule.", "section": "B · Complete with the correct form.", "reveal": "throw", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Right now, thousands of spectators ___ (watch) the final match.", "section": "B · Complete with the correct form.", "reveal": "are watching", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ your school ___ (organise) any extreme-sport events this term?", "section": "B · Complete with the correct form.", "reveal": "Is / organising", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Right now, the champion is competing in the final round.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Kırkpınar wrestlers are competing every August.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kırkpınar wrestlers compete every August.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "More and more people take up extreme sports this year.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "More and more people are taking up extreme sports this year.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ that rider ___ (do) right now?", "section": "Dialogue · Complete with Simple Present or Present Progressive.", "reveal": "is / doing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: He ___ (perform) a traditional javelin throw — riders ___ (do) this every year at the festival.", "section": "Dialogue · Complete with Simple Present or Present Progressive.", "reveal": "is performing / do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "place / Edirne / every / takes / in / summer / Kırkpınar", "section": "Dialogue · Reorder the sentence.", "words": ["kırkpınar", "takes", "place", "in", "Edirne", "every", "summer"], "end": ".", "reveal": "Kırkpınar takes place in Edirne every summer.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Born for the Rush?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think 'born for the rush' means?", "Do you know anyone who loves risky or exciting activities? What are they like?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Born for the Rush?", "num": 1, "total": 3, "text": "Why do some people happily jump out of aeroplanes or ride down a mountain on a board, while others would never dream of it? Decades ago, a psychologist proposed that certain people are simply wired to seek out risk. He called them 'Type T' individuals — the 'T' standing for thrill. According to his theory, these people don't just tolerate danger; they actively look for it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Born for the Rush?", "num": 2, "total": 3, "text": "Scientists who study this idea point to biology as one possible explanation. Type T brains may release dopamine, the chemical linked to pleasure, more strongly during risky activities than an average person's brain does. This could explain why a thrill-seeker's heart races with excitement, not fear, the moment a parachute opens.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Born for the Rush?", "num": 3, "total": 3, "text": "Critics warn against judging every risk-taker as reckless, however. Many so-called Type T people take up creative or entrepreneurial paths instead of dangerous sports, channelling the same hunger for novelty into painting, invention or starting a business. Whether on a cliff edge or in a studio, it seems the same restless curiosity can drive very different kinds of lives.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Only dangerous sports attract Type T people.", "Some people may be biologically drawn to risk and novelty, which can show up in different ways.", "Dopamine makes all risky sports completely safe."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The psychologist called risk-seeking people ___ individuals.", "section": "While you read", "reveal": "Type T", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what chemical might explain a thrill-seeker's excitement?", "section": "While you read", "options": ["adrenaline only", "dopamine", "stamina"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, all Type T people become extreme athletes.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, many Type T people channel their curiosity into other things, like art or business.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The final paragraph suggests that the same restless curiosity can drive people toward risky sports or toward ___ paths.", "section": "While you read", "reveal": "creative or entrepreneurial", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think you have a 'Type T' personality? Why or why not?", "Can you think of another non-sporting way someone might channel a love of risk?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Oil, Honour and Forty Springs", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you already know about traditional Turkish sports?", "What do you think the name 'Kırkpınar' might mean?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Oil, Honour and Forty Springs", "num": 1, "total": 3, "text": "Every July, thousands of spectators travel to Edirne to watch one of the oldest sporting events in the world. Wrestlers, known as pehlivan, cover their bodies in olive oil and compete on open grass in leather trousers called a kispet. The tournament, known as Kırkpınar, has been held almost every year since 1924, making it a proud symbol of Turkish sporting heritage.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Oil, Honour and Forty Springs", "num": 2, "total": 3, "text": "The event's name comes from an old legend. Two brothers are said to have wrestled each other for so long, and so evenly matched, that neither could win — until, exhausted, they both collapsed and died on the spot. According to the story, forty springs later bubbled up from the ground where they fell, giving the region its name: Kırkpınar, or 'Forty Springs'.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Oil, Honour and Forty Springs", "num": 3, "total": 3, "text": "Beyond the oil and the crowds, Kırkpınar is built on respect. Wrestlers bow to their opponents before a match, and the strongest competitor, the başpehlivan, is expected to show humility, not arrogance. Similar values appear in other traditional Turkish sports, such as the horseback javelin game, where courage and fair play matter as much as winning.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Where does the Kırkpınar tournament take place?", "section": "While you read", "options": ["Istanbul", "Edirne", "Ankara"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Wrestlers in Kırkpınar are known as ___.", "section": "While you read", "reveal": "pehlivan", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the legend, the two brothers both won the wrestling match.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the legend, neither brother won — both collapsed and died.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What quality is the başpehlivan (strongest wrestler) expected to show?", "section": "While you read", "options": ["arrogance", "humility", "impatience"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The text says courage and ___ matter as much as winning in the traditional javelin game.", "section": "While you read", "reveal": "fair play", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Why do you think respect and humility are so important in this sport?", "Compare Kırkpınar with a modern sport you know — what values do they share or not share?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "My First Jump", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: how do you think Deniz felt before and after his jump?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "My First Jump", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What almost happened right before Deniz jumped?", "section": "While you listen", "options": ["He fell asleep.", "He nearly asked to go back down.", "He lost his equipment."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "After the fear passed, Deniz felt a wave of ___.", "section": "While you listen", "reveal": "adrenaline", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Deniz plans to take up skydiving every week from now on.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz isn't sure about skydiving regularly, but he wants to try paragliding.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Elif mean when she say
