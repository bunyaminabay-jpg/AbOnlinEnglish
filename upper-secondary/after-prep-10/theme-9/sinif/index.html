w.", "If he hadn't taken the risk, he wouldn't own this land today."], "negative": ["If they hadn't downsized, they wouldn't feel this free now.", "If we hadn't left the city, we wouldn't be growing our own food today."], "question": ["Would you be living differently now if you had made a different choice?", "If she hadn't inherited the land, would she be doing this today?"], "short": ["Yes, I would. / No, I wouldn't.", "Yes, she would. / No, she wouldn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If she didn't move to the mountains, she wouldn't be living this simply now.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If she hadn't moved to the mountains, she wouldn't be living this simply now.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If he hadn't left his job, he won't have this free time today.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If he hadn't left his job, he wouldn't have this free time today.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If they hadn't downsized, they wouldn't have felt this free now.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If they hadn't downsized, they wouldn't feel this free now.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "If he ___ his city job, he wouldn't be living off-grid now.", "section": "A · Choose the correct option.", "options": ["hadn't left", "didn't leave", "hasn't left"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "If she hadn't inherited the land, she ence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If she hadn't moved to the forest, she wouldn't be living this way now.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "If they hadn't sold their house, they wouldn't be travelling full-time today.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "If he hadn't left the city, he wouldn't have this much freedom now.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you ___ (choose) this life if you could go back and decide again?", "section": "Dialogue · Complete with the correct form.", "reveal": "Would / choose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: If I ___ (not try) it once, I ___ (never / know) how much I'd love it.", "section": "Dialogue · Complete with the correct form.", "reveal": "hadn't tried / would never have known", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "living / this / be / wouldn't / simply / she / now", "section": "Dialogue · Reorder the sentence.", "words": ["she", "wouldn't", "be", "living", "this", "simply", "now"], "end": ".", "reveal": "She wouldn't be living this simply now.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Relative Clauses: Describing Unusual People, Places and Lifestyles", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["A digital nomad is someone <mark>who<\/mark> works online while travelling the world.", "The valley, <mark>which<\/mark> has no roads or electricity, is home to just three families.", "This is the cabin <mark>where<\/mark> the family spent their first off-grid winter.", "Elena, <mark>whose<\/mark> entire house runs on solar power, hasn't paid an electricity bill in years."], "ask": "In which sentence does the relative clause give extra, non-essential information (with commas), and in which sentences is it essential to identify who or what we mean?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["defining (no commas, essential)", "non-defining (with commas, extra info)", "who/that", "which/that", "where", "whose"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "A relative clause that is essential to identify the person or thing is called ___.", "section": "Complete the rule", "reveal": "defining (no commas, essential)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A relative clause that adds extra, non-essential information, and can be removed, is called ___.", "section": "Complete the rule", "reveal": "non-defining (with commas, extra info)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use ___ for people, ___ for things, ___ for places, and ___ for possession.", "section": "Complete the rule", "reveal": "who/that / which/that / where / whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Defining relative clauses (who, which, where, whose, that) are essential to identify who or what we mean and are not separated by commas. Non-defining relative clauses add extra information, are separated by commas, can be removed without changing the core meaning, and never use 'that'.", "tr": "Defining relative clause'lar (who, which, where, whose, that), kimden ya da neyden bahsettiğimizi belirlemek için gereklidir ve virgülle ayrılmaz. Non-defining relative clause'lar ise ekstra bilgi verir, virgülle ayrılır ve cümleden çıkarılabilir; bu tür cümlelerde 'that' kullanılmaz.", "when_en": "We use relative clauses to identify or add extra information about people, places or lifestyles.", "when": "İnsanları, yerleri ya da yaşam tarzlarını tanımlarken ya da hakkında ek bilgi verirken relative clause kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["A hermit is a person.", "This person chooses to live alone."], "reveal": "A hermit is a person who chooses to live alone.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Mira built her own house from recycled materials.", "Mira now teaches other people to do the same."], "reveal": "Mira, who built her own house from recycled materials, now teaches other people to do the same.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The commune grows all of its own food.", "The commune has around forty members."], "reveal": "The commune, which grows all of its own food, has around forty members.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["This is the mountain hut.", "The family spent three winters there."], "reveal": "This is the mountain hut where the family spent three winters.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Tomas gave up his salary to become a shepherd.", "Tomas's flock now provides everything his family needs."], "reveal": "Tomas, whose flock now provides everything his family needs, gave up his salary to become a shepherd.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / Do you know anyone.", "This person has chosen an unconventional lifestyle."], "reveal": "Do you know anyone who has chosen an unconventional lifestyle?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences describing unusual people, places or lifestyles using relative clauses (who, which, where, whose).", "chips": ["A digital nomad is someone who…", "I'd love to visit a place where…", "I know someone whose…", "An off-grid home is a house which…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["A hermit is someone who lives alone, away from other people.", "The valley, which has no roads, can only be reached on foot."], "negative": ["This isn't a lifestyle which everyone could manage.", "He doesn't live in a place where phones even work."], "question": ["Do you know anyone whose life is completely off-grid?", "Is this the cabin where they spent the winter?"], "short": ["Yes, I do. / No, I don't.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "A digital nomad is someone which works online.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "A digital nomad is someone who works online.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The valley, that has no roads, is very isolated.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The valley, which has no roads, is very isolated.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the cabin which they spent their first winter.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the cabin where they spent their first winter.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "A hermit is a person ___ chooses to live completely alone.", "section": "A · Choose the correct option.", "options": ["who", "which", "where"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This is the forest ___ she has lived for the last decade.", "section": "A · Choose the correct option.", "options": ["who", "which", "where"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Elif, ___ house runs entirely on solar power, never pays an electricity bill.", "section": "A · Choose the correct option.", "options": ["who", "whose", "which"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A digital nomad is someone ___ can work from anywhere in the world.", "section": "B · Complete with the correct relative pronoun.", "reveal": "who", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Do you know anyone ___ lifestyle is completely off-grid?", "section": "B · Complete with the correct relative pronoun.", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This is the valley ___ they built their first cabin.", "section": "B · Complete with the correct relative pronoun.", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "A shepherd is someone which lives a simple, outdoor life.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "A shepherd is someone who lives a simple, outdoor life.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The island, which has no roads, is only reachable by boat.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This is the hut that they spent their first winter.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the hut where they spent their first winter.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Do you know anyone ___ has chosen to live completely off-grid?", "section": "Dialogue · Complete with who/which/where/whose.", "reveal": "who", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes — my aunt. She lives in a cabin ___ she built herself, in a forest ___ almost no tourists go.", "section": "Dialogue · Complete with who/which/where/whose.", "reveal": "which / where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "alone / lives / who / person / a / is / hermit / a", "section": "Dialogue · Reorder the sentence.", "words": ["a", "hermit", "is", "a", "person", "who", "lives", "alone"], "end": ".", "reveal": "A hermit is a person who lives alone.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Family Who Left the Grid", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think it means to 'leave the grid'?", "What do you imagine would be the hardest part of producing your own food and electricity?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Family Who Left the Grid", "num": 1, "total": 3, "text": "Six years ago, Aylin and her husband sold their flat in the city, bought four hectares of rocky hillside, and moved into a tent while they built a house with their own hands. If they hadn't made that decision, they would still be commuting two hours a day and paying rent they could barely afford. Today they grow almost all of their own vegetables, keep chickens and goats, and generate their own electricity from a small solar array on the roof.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Family Who Left the Grid", "num": 2, "total": 3, "text": "Life off-grid is not simply a romantic escape, however. Aylin describes the first winter as brutal: pipes froze, the solar panels produced almost no power on cloudy days, and there were weeks when the nearest working shop felt impossibly far away. 'We had to become resourceful fast,' she says. 'If we hadn't learned to fix things ourselves, we wouldn't have survived that winter.' Slowly, through trial and error, the family adapted.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Family Who Left the Grid", "num": 3, "total": 3, "text": "What surprises visitors most is not the hardship but how ordinary the family's days now feel. Aylin no longer misses her old commute, and her children, who grew up thinking every home has running water on tap, now understand exactly where their food and power come from. 'People ask if we regret it,' she says. 'Honestly, if we hadn't taken the risk, I don't think we'd be half as happy as we are now.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Off-grid living is easy and has no real difficulties.", "A family's decision to live off-grid was hard at times but has ultimately made them happier and more self-sufficient.", "The family regrets leaving the city and plans to move back."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The family bought four hectares of hillside and lived in a ___ while they built their house.", "section": "While you read", "reveal": "tent", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what was especially difficult during the first winter?", "section": "While you read", "options": ["The children refused to help with the animals.", "Pipes froze and the solar panels produced little power.", "The local council tried to stop them building."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, Aylin says the family regrets taking the risk of moving off-grid.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, Aylin says they would not be as happy now if they hadn't taken the risk.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Aylin's children now understand exactly where their food and ___ come from.", "section": "While you read", "reveal": "power", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think you could adapt to a life like Aylin's? Why or why not?", "What would you miss most if you moved somewhere completely off-grid?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Keeper of the Last Light", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you already know about the job of a lighthouse keeper?", "Do you think isolated jobs like this still exist today? Where?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Keeper of the Last Light", "num": 1, "total": 3, "text": "On a narrow rock eighteen kilometres from the nearest coastline stands a lighthouse where Meltem has spent every summer for the past nine years. She is one of the very few keepers left whose job hasn't been fully replaced by automatic lights and remote sensors. For four months at a time, her only regular company is the sound of the wind, the occasional passing ship, and a radio link to the mainland.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Keeper of the Last Light", "num": 2, "total": 3, "text": "The work itself is precise and demanding: checking the lamp mechanism, logging weather conditions, and keeping meticulous records that shipping companies still rely on. 'People imagine I just sit and read novels all day,' Meltem laughs, 'but a lighthouse that isn't properly maintained is a lighthouse that eventually fails — and ships depend on that light.' Supplies arrive by boat once a fortnight, weather permitting; when storms close in, they simply don't arrive.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Keeper of the Last Light", "num": 3, "total": 3, "text": "What keeps Meltem returning each year is not tradition alone. She describes a quality of attention that isolated life demands — noticing the smallest change in the sky, the tide, the sound of the generator — that she has never found anywhere else. 'In the city, I moved through my days without really seeing them,' she explains. 'Out here, on a rock where almost nothing changes quickly, I finally learned to pay attention.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is unusual about Meltem's job, according to the text?", "section": "While you read", "options": ["She is one of the few remaining lighthouse keepers whose job hasn't been fully automated.", "She only works one week a year.", "She shares the lighthouse with dozens of other keepers."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Meltem's lighthouse stands on a narrow rock ___ kilometres from the coastline.", "section": "While you read", "reveal": "eighteen", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, Meltem says her job mainly involves sitting and reading novels.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, Meltem says the job involves precise, demanding work such as checking the lamp and logging conditions.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How often do supplies normally arrive at the lighthouse?", "section": "While you read", "options": ["Every day", "Once a fortnight, weather permitting", "Only once a year"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Meltem says that on the rock, she finally learned to pay ___.", "section": "While you read", "reveal": "attention", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Why do you think Meltem keeps returning to such an isolated job every year?", "Would you be able to cope with four months of near-total isolation? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Three Years Without Wi-Fi", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what do you think Sena might say she misses most, and what she doesn't miss at all?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Three Years Without Wi-Fi", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "How does Sena get her water and electricity?", "section": "While you listen", "options": ["From the mains, like a normal house.", "From solar panels and a well.", "She doesn't use electricity or water at all."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Sena says she wouldn't appreciate hot showers as much if she ___ moved to the village.", "section": "While you listen", "reveal": "hadn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "S ked from Portugal, Georgia, and a converted ___ in the countryside.", "section": "While you listen", "reveal": "train carriage", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to Kaan, his cousin's clients insist that she works from one fixed office.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to Kaan, her clients don't care where she is, as long as the work is done on time.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Kaan say is one of the difficulties of his cousin's lifestyle?", "section": "While you listen", "options": ["Making real friends while constantly moving", "Finding clients who will pay her", "Getting permission from her old company"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Could You Live Off-Grid?", "text": "In pairs, discuss whether you could live an off-grid or nomadic lifestyle. Talk about at least two unconventional lifestyles from this theme, using mixed conditionals and relative clauses where natural.", "steps": [], "chips": [], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Presenting an Unusual Life", "text": "Prepare a two-minute talk about a real or invented person who liv ": "gap", "q": "Elena, ___ entire house runs on solar power, hasn't paid an electricity bill in years.", "section": "Exit ticket", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly links a past decision to a present situation?", "section": "Exit ticket", "options": ["If they didn't downsize, they wouldn't feel this free now.", "If they hadn't downsized, they wouldn't feel this free now.", "If they hadn't downsized, they wouldn't have felt this free now."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which word describes someone unusual in an interesting, harmless way?", "section": "Exit ticket", "options": ["eccentric", "sustainable", "nomadic"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Meltem works as a lighthouse keeper, one of the few jobs that still relies on human ___.", "section": "Exit ticket", "reveal": "attention", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order.", "section": "Exit ticket", "words": ["a", "hermit", "is", "a", "person", "who", "lives", "alone"], "end": ".", "reveal": "A hermit is a person who lives alone.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "judge", "q": "The valley, that has no roads, is very isolated.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The valley, which has no roads, is very isolated.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using a mixed conditional.", "section": "Exit ticket", "reveal": "If she hadn't moved off-grid ten years ago, she wouldn't be living this simply now.", "prompt": "She moved off-grid ten years ago. Because of that, she lives this simply now.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Do you know anyone ___ has chosen to live completely off-grid?", "section": "Exit ticket", "reveal": "who", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
