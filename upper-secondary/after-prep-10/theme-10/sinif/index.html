e workshop was so popular workshop that they added a second date.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The workshop was so popular that they added a second date.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you loved robotics, why didn't you choose that programme?", "section": "Dialogue · Complete with the correct connector.", "reveal": "Since / As / Because", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Mainly ___ it has a strong engineering programme, but also ___ my sister studied there.", "section": "Dialogue · Complete with the correct connector.", "reveal": "because / since", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "difficult / the / so / course / that / was / postponed / it / many / students", "section": "Dialogue · Reorder the sentence.", "words": ["the", "course", "was", "so", "difficult", "that", "many", "students", "postponed", "it"], "end": ".", "reveal": "The course was so difficult that many students postponed it.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Present Tense for General Truths + Modal Verbs of Deduction (Body Language)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Crossed arms often <mark>signal<\/mark> that a person feels defensive or uncomfortable.", "She's avoiding eye contact, so she <mark>might be<\/mark> nervous about the interview.", "He <mark>must be<\/mark> confident — look at that relaxed posture and steady eye contact.", "They <mark>can't be<\/mark> telling the truth; their facial expressions don't match their words at all."], "ask": "Which sentence states a general truth about body language, and which sentences make a GUESS about someone's feelings based on evidence?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a general truth", "a strong positive guess", "a weak/possible guess", "a strong negative guess (impossible)"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The Present Simple is used to state ___ about what body language usually means.", "section": "Complete the rule", "reveal": "a general truth", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Might/could be' expresses ___.", "section": "Complete the rule", "reveal": "a weak/possible guess", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Must be' expresses ___ based on strong evidence.", "section": "Complete the rule", "reveal": "a strong positive guess", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Can't be' expresses ___ — the evidence shows it's very unlikely.", "section": "Complete the rule", "reveal": "a strong negative guess (impossible)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Use the Present Simple to state the general meaning of body language (Crossed arms often signal discomfort). Use modal verbs to guess how someone feels based on evidence: 'might/could be' (weak possibility), 'must be' (strong positive guess), 'can't be' (strong negative guess/impossible).", "tr": "Beden dilinin genel anlamını açıklarken Present Simple kullanılır (Crossed arms often signal discomfort). Birinin ne hissettiğini KANITA dayanarak tahmin ederken modal fiiller kullanılır: 'might/could be' (zayıf ihtimal), 'must be' (güçlü olumlu tahmin), 'can't be' (güçlü olumsuz tahmin/imkânsız).", "when_en": "We use the Present Simple to state a general rule about body language, and modal verbs of deduction to guess how a specific person is feeling right now, based on evidence.", "when": "Beden dilinin genel kuralını anlatırken Present Simple; belirli bir kişinin o an ne hissettiğini kanıta dayanarak tahmin ederken modal fiilleri kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["crossed arms", "often / signal", "discomfort"], "reveal": "Crossed arms often signal discomfort.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "avoid / eye contact", "he / might be / shy"], "reveal": "He's avoiding eye contact, so he might be shy.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "smile / and / lean forward", "she / must be / interested"], "reveal": "She's smiling and leaning forward, so she must be interested.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["his voice / shake", "he", "can't be / as calm as he claims"], "reveal": "His voice is shaking, so he can't be as calm as he claims.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["a firm handshake", "usually / suggest", "confidence"], "reveal": "A firm handshake usually suggests confidence.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / that gesture", "mean", "agreement / or / confusion"], "reveal": "Could that gesture mean agreement or confusion?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Describe a person's body language in a situation you imagine (an interview, a presentation, a first date) and write four sentences interpreting what it might mean.", "chips": ["Her posture suggests…", "He might be… because…", "That must mean…", "They can't be… since…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Steady eye contact usually suggests honesty.", "She must be excited — she can't stop smiling."], "negative": ["Crossed arms don't always mean someone is angry.", "He can't be relaxed; his shoulders are so tense."], "question": ["What does a raised eyebrow usually mean?", "Could that gesture mean something different in another culture?"], "short": ["It usually means surprise or doubt.", "Yes, it could. / No, it can't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She must being nervous because she's biting her nails.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She must be nervous because she's biting her nails.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He can't be interested, he's smiling and leaning forward.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He can't be uninterested — he's smiling and leaning forward. / He must be interested, since he's smiling and leaning forward.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Crossed arms is signalling discomfort in general.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Crossed arms generally signal discomfort.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Look at his tense shoulders and shaking hands — he ___ be extremely nervous.", "section": "A · Choose the correct option.", "options": ["must", "can't", "signals"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "A relaxed posture generally ___ comfort and confidence.", "section": "A · Choose the correct option.", "options": ["is suggesting", "suggests", "must suggest"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She's laughing and making eye contact, so she ___ be bored.", "section": "A · Choose the correct option.", "options": ["must", "can't", "might"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A raised eyebrow often ___ (signal) surprise or doubt.", "section": "B · Complete with the correct form.", "reveal": "signals", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He avoided eye contact throughout the interview, so he ___ (might / be) uncomfortable with the question.", "section": "B · Complete with the correct form.", "reveal": "might be", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "They ___ (can't / be) telling the truth — their body language completely contradicts their words.", "section": "B · Complete with the correct form.", "reveal": "can't be", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Crossed arms is always meaning anger.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Crossed arms don't always mean anger.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "She's smiling and leaning in, so she must be enjoying the conversation.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "He can't nervous, his hands are shaking so much.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He can't be calm, his hands are shaking so much.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Look at her — she keeps checking her watch and avoiding eye contact. What ___ that mean?", "section": "Dialogue · Complete with the correct modal form.", "reveal": "could / might", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: She ___ (must / be) worried about being late for something else.", "section": "Dialogue · Complete with the correct modal form.", "reveal": "must be", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "confidence / firm / a / handshake / usually / suggests", "section": "Dialogue · Reorder the sentence.", "words": ["a", "firm", "handshake", "usually", "suggests", "confidence"], "end": ".", "reveal": "A firm handshake usually suggests confidence.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "One Size Doesn't Fit All", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think 'one size doesn't fit all' means about education?", "Which do you think you'd prefer as a student: a strict, exam-focused school or a flexible, student-centred one? Why?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "One Size Doesn't Fit All", "num": 1, "total": 3, "text": "Walk into a classroom in one country and you might see rows of silent students copying notes from a board. Walk into a classroom elsewhere, and you might find children sitting in a circle, designing their own project for the week. Neither approach is automatically wrong; each simply grew out of different beliefs about how learning works best.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "One Size Doesn't Fit All", "num": 2, "total": 3, "text": "Traditional, exam-focused systems often exist because they can be measured easily and applied to large numbers of students at once. Since a single national test can be marked quickly and compared fairly, many governments rely on it, even though critics argue it encourages rote learning rather than real understanding. Such systems can be so exam-driven that students learn to answer questions without ever asking their own.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "One Size Doesn't Fit All", "num": 3, "total": 3, "text": "Student-centred methods, on the other hand, grew popular due to research suggesting that motivation and self-discipline improve when learners have real choices. A student who picks their own topic is often so engaged that they keep researching long after the lesson ends. The challenge is that this approach demands well-trained teachers and smaller classes — resources not every school can afford.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Traditional education is always better than student-centred education.", "Different education systems grew out of different beliefs and goals, each with strengths and challenges.", "Exams should be removed from every education system."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Traditional, exam-focused systems are popular partly because they can be ___ easily.", "section": "While you read", "reveal": "measured", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, why do student-centred methods appeal to some educators?", "section": "While you read", "options": ["They are cheaper to run than traditional schools.", "Research suggests motivation and self-discipline improve when learners have real choices.", "They remove the need for teachers altogether."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, student-centred methods need no special resources.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, student-centred methods demand well-trained teachers and smaller classes.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Critics argue that heavily exam-driven systems encourage ___ learning rather than real understanding.", "section": "While you read", "reveal": "rote", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think your own school leans more toward the traditional or the student-centred approach?", "Can you think of a downside of student-centred learning that the text doesn't mention?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Conversation Nobody Speaks", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think the title 'The Conversation Nobody Speaks' refers to?", "Can you think of a gesture that means different things in different cultures?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Conversation Nobody Speaks", "num": 1, "total": 3, "text": "Long before a person finishes a sentence, their body has usually already said something. Researchers who study communication estimate that a large share of meaning in face-to-face conversation comes not from words, but from posture, gesture and facial expression. This silent layer of communication can support what someone says — or quietly contradict it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Conversation Nobody Speaks", "num": 2, "total": 3, "text": "Some signals appear to be almost universal. A genuine smile, for example, tends to involve the muscles around the eyes as well as the mouth, which is why a forced smile can look slightly 'off' even to a stranger. Other signals, however, change enormously between cultures. Direct eye contact might suggest confidence and honesty in one country, while in another it can be read as rude or challenging.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Conversation Nobody Speaks", "num": 3, "total": 3, "text": "This is exactly why body language must be interpreted carefully, never in isolation. A single crossed-arm gesture doesn't automatically mean someone is angry or closed off; they might simply be cold, or comfortable standing that way. Skilled observers look for clusters of signals and consider the context before drawing any conclusion about what a person really means.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Body language always means exactly the same thing everywhere.", "A large part of communication is non-verbal, but it must be interpreted carefully and in context.", "Facial expressions are less important than words."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A genuine smile usually involves the muscles around the eyes as well as the ___.", "section": "While you read", "reveal": "mouth", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, how does eye contact differ across cultures?", "section": "While you read", "options": ["It always means the same thing everywhere.", "It can suggest confidence in one culture and rudeness in another.", "It is never used outside Western countries."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, a single gesture is always enough to know exactly how someone feels.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, skilled observers look for clusters of signals and context, not a single gesture.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The text says crossed arms don't automatically mean anger — a person might simply be ___.", "section": "While you read", "reveal": "cold", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Why do you think a forced smile can look 'off' to other people?", "Do you agree that a single gesture is never enough to judge how someone feels? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Why That University?", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what reasons do you think Emre will give for his choice?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Why That University?", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the main reason Emre first gives for choosing the programme?", "section": "While you listen", "options": ["It is close to home.", "It has a strong reputation in robotics.", "It is the cheapest option."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Emre says the university is close to home, so he can ___ instead of paying for accommodation.", "section": "While you listen", "reveal": "commute", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the dialogue, Emre chose the university for only one reason.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the dialogue, Emre gives several reasons: reputation, location, and the scholarship.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does Emre feel about starting th
