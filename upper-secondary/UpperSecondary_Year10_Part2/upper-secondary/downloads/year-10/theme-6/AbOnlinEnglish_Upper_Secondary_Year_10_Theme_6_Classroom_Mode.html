d": "vegetarian", "pos": "noun/adjective", "ipa": "/ˌvedʒəˈteəriən/", "tr": "vejetaryen", "example": "My sister is vegetarian, so she doesn't eat meat.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "staple", "pos": "noun", "ipa": "/ˈsteɪpl/", "tr": "temel besin/madde", "example": "Bread is a staple food in many countries.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "leftover", "pos": "noun", "ipa": "/ˈleftəʊvə(r)/", "tr": "artık yemek", "example": "We had the leftovers for lunch the next day.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "abroad", "pos": "adverb", "ipa": "/əˈbrɔːd/", "tr": "yurt dışında", "example": "Have you ever lived abroad?", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "custom", "pos": "noun", "ipa": "/ˈkʌstəm/", "tr": "âdet, gelenek", "example": "It's a custom to take off your shoes before entering a home.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“temel besin/madde”", "options": ["staple", "flavour", "quantity"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, p <\/mark> Turkish coffee."], "ask": "What do you notice about the verb form after 'have/has', and about the words 'since', 'for', 'already' and 'just'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["have travelled", "has never eaten", "have lived", "has just finished", "have already visited"], "chips": true, "text": "Complete the sentences with the correct present perfect form of the verb in brackets.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "My uncle ___ (travel) to more than ten countries.", "section": "Complete the rule", "reveal": "has travelled", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I ___ (live) in this city for three years.", "section": "Complete the rule", "reveal": "have lived", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ (already / visit) the new food market.", "section": "Complete the rule", "reveal": "have already visited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She ___ (never / eat) spicy food before.", "section": "Complete the rule", "reveal": "has never eaten", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The chef ___ (just / finish) cooking dinner.", "section": "Complete the rule", "reveal": "has just finished", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We form the present perfect with have/has + past participle. We use it for life experiences (without saying exactly when), for actions that started in the past and continue now (with 'for' + a period of time or 'since' + a point in time), and for very recent actions ('just') or actions completed before now ('already').", "tr": "Present perfect, have/has + fiilin 3. hali ile yapılır. Ne zaman olduğunu söylemeden yaşam deneyimlerini anlatmak için, geçmişte başlayıp hâlâ devam eden durumlar için ('for' + süre veya 'since' + zaman noktası ile) ve çok yakın zamanda olmuş ('just') veya şu andan önce tamamlanmış ('already') eylemler için kullanılır.", "when_en": "Use it to talk about travel and life experiences ('Have you ever...?'), how long something has continued ('How long have you lived here?'), and recent completed actions ('I have just finished my homework.').", "when": "Seyahat ve yaşam deneyimlerinden bahsederken ('Hiç ... yaptın mı?'), bir şeyin ne kadar süredir devam ettiğini sorarken ('Burada ne kadar süredir yaşıyorsun?') ve yakın zamanda tamamlanmış eylemlerden bahsederken ('Ödevimi az önce bitirdim.') kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I", "visit", "three continents"], "reveal": "I have visited three continents.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "live", "abroad", "for two years"], "reveal": "She has lived abroad for two years.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "not try", "Turkish cuisine", "yet"], "reveal": "They have not tried Turkish cuisine yet.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["how long", "you", "know", "your best friend"], "reveal": "How long have you known your best friend?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "already / buy", "the ingredients"], "reveal": "We have already bought the ingredients.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "be married", "since 1998"], "reveal": "My parents have been married since 1998.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "just / arrive", "from the market"], "reveal": "He has just arrived from the market.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about your own life experiences using the present perfect with 'since', 'for', 'already' or 'just'.", "chips": ["I have never...", "I have already...", "I have lived here for/since..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form" ved here since ten years.", "I have lived here for ten years.", "I lived here for ten years already."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We ___ (just / finish) our shopping at the market.", "section": "", "reveal": "have just finished", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "He has already eaten his lunch.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": null, "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "They ___ (not / be) to Africa yet.", "section": "", "reveal": "have not been / haven't been", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: lived / she / since / Balıkesir / in / has / 2018", "section": "", "words": ["she", "has", "lived", "in", "Balıkesir", "since", "2018"], "end": ".", "reveal": "She has lived in Balıkesir since 2018.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using the present perfect with 'since': He started learning English in 2020. He still studies it now.", "section": "", "reveal": "He has studied English since 2020.", "prompt": "He has studied English...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "How long ___ your parents ___ (know) each other?", "section": "", "reveal": "have; known", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Countable / uncountable nouns (some, any, much, many)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["There are <mark>some<\/mark> apples on the table.", "Is there <mark>any<\/mark> rice left?", "How <mark>much<\/mark> cheese do we need?", "How <mark>many<\/mark> eggs are there in the fridge?", "We don't have <mark>any<\/mark> milk today."], "ask": "Which words go with countable nouns like 'eggs' and which go with uncountable nouns like 'rice'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["some", "any", "much", "many"], "chips": true, "text": "Complete the sentences with some, any, much or many.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "There are ___ oranges in the basket.", "section": "Complete the rule", "reveal": "some", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We don't have ___ sugar in the kitchen.", "section": "Complete the rule", "reveal": "any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. erdeki miktarlardan bahsederken veya buzdolabında/pazarda nelerin bulunduğunu sorarken bu kelimeler kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["there / be / some / potatoes"], "reveal": "There are some potatoes.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["how many / carrots / we / need"], "reveal": "How many carrots do we need?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["there / not be / any / cheese / in the fridge"], "reveal": "There isn't any cheese in the fridge.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["how much / rice / be / in the bag"], "reveal": "How much rice is in the bag?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["can I have / some / olives, please"], "reveal": "Can I have some olives, please?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we / not have / many / eggs / left"], "reveal": "We don't have many eggs left.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["is there / any / milk / in the fridge"], "reveal": "Is there any milk in the fridge?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about the food in your own kitchen using some, any, much or many.", "chips": ["There is/are some...", "We don't have much/many...", "How much/many...?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["There are some tomatoes.", "There is some cheese."], "negative": ["There aren't any tomatoes.", "There isn't much cheese."], "question": ["Are there any tomatoes? / How many tomatoes are there?", "Is there any cheese? / How much cheese is there?"], "short": ["Yes, there are some. / No, there aren't any.", "Yes, there is some. / No, there isn't any."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How much oranges do you want?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How many oranges do you want?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We don't have much apples.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We don't have many apples.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Is there some milk in the fridge?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Is there any milk in the fridge?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "There isn't ___ bread left in the kitchen.", "section": "", "reveal": "any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She isn't a big fan of spicy food, ___?", "section": "Complete the rule", "reveal": "is she", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This dish tastes amazing, ___?", "section": "Complete the rule", "reveal": "doesn't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We can find fresh bread here, ___?", "section": "Complete the rule", "reveal": "can't we", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A question tag is a short question added to the end of a statement to check information or keep a conversation going. If the main sentence is positive, the tag is usually negative; if the main sentence is negative, the tag is usually positive. The tag repeats the auxiliary/modal verb of the main sentence (or uses do/does/did for the present simple/past simple).", "tr": "Soru eki, bilgiyi kontrol etmek veya sohbeti sürdürmek için bir ifadenin sonuna eklenen kısa bir sorudur. Ana cümle olumluysa eki genellikle olumsuz, ana cümle olumsuzsa eki genellikle olumludur. Ek, ana cümledeki yardımcı/yapı fiili tekrarlar (ya da geniş/geçmiş zamanda do/does/did kullanılır).", "when_en": "Use question tags in everyday conversation to confirm something you think is true, or to invite the other person to agree or respond.", "when": "Günlük konuşmada doğru olduğunu düşündüğünüz bir şeyi teyit etmek veya karşınızdaki kişiyi hemfikir olmaya/cevap vermeye davet etmek için soru ekleri kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["you", "have never / try", "Chinese food"], "reveal": "You have never tried Chinese food, have you?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["your country", "have / a lot of continents nearby", "no"], "reveal": "Your country doesn't have a lot of continents nearby, does it?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this recipe", "need / a lot of ingredients", "yes"], "reveal": "This recipe needs a lot of ingredients, doesn't it?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "can / cook Turkish food", "yes"], "reveal": "You can cook Turkish food, can't you?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "be / from different countries", "yes"], "reveal": "They are from different countries, aren't they?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "not like / spicy food", "no"], "reveal": "She doesn't like spicy food, does she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "have already visit / this market", "yes"], "reveal": "We have already visited this market, haven't we?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about food or nationalities with correct question tags.", "chips": ["You've never..., have you?", "This is..., isn't it?", "They don't..., do they?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["This food is delicious, isn't it?", "You have visited Spain, haven't you?"], "negative": ["She isn't from Italy, is she?", "They haven't tried sushi, have they?"], "question": ["— (question tags are added to statements, not to other questions)"], "short": ["Yes, it is. / No, it isn't.", "Yes, she is. / No, she isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You like Turkish food, do you like?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You like Turkish food, don't you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This soup isn't hot, isn't it?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This soup isn't hot, is it?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "They can speak French, can't they speak?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They can speak French, can't they?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "This is a traditional Turkish dish, ___?", "section": "", "reveal": "isn't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You haven't been to South America, ___?", "section": "", "reveal": "have you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct tag: 'They live in a big city, ___?'", "section": "", "options": ["do they", "don't they", "are they", "aren't they"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She can't eat nuts, ___?", "section": "", "reveal": "can she", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "'We are from different countries, are we?' is a correct question tag.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We are from different countries, aren't we?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: it, isn't, hot, this, soup, is", "section": "", "words": ["this", "soup", "is", "hot,", "isn't", "it"], "end": "?", "reveal": "This soup is hot, isn't it?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Add the correct tag: Your family has never lived abroad.", "section": "", "reveal": "Your family has never lived abroad, have they?", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The market doesn't sell fresh fish on Mondays, ___?", "section": "", "reveal": "does it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A World of Continents and Cultures", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. Which continents and countries do you already know something about?", "Have you ever met someone from a different continent?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A World of Continents and Cultures", "num": 1, "total": 4, "text": "The world is divided into seven continents: Asia, Africa, North America, South America, Antarctica, Europe and Australia. Each continent is home to many countries, and each country has its own nationality, language and traditions. Turkey, for example, is located on two continents, Europe and Asia, which makes its culture a fascinating mix of East and West.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A World of Continents and Cultures", "num": 2, "total": 4, "text": "People from different countries often have very different daily habits. In some cultures, families eat their main meal together in the evening, while in others, lunch is the most important meal of the day. Greetings can also vary a lot: in some countries people shake hands, in others they bow, and in others they kiss on both cheeks. Learning about these customs helps travellers show respect when they visit a new place.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A World of Continents and Cultures", "num": 3, "total": 4, "text": "Nationality is not only about a passport; it is also about shared history, food and celebrations. Many young people today have friends from several different nationalities because of the internet and international schools. This is a wonderful opportunity to learn about other cultures without leaving home. By asking questions and listening carefully, students can discover how people in other parts of the world live, eat and celebrate special occasions.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A World of Continents and Cultures", "num": 4, "total": 4, "text": "Understanding other cultures also helps us understand our own culture better. When we compare our traditions with those of other countries, we notice what makes our own nationality and way of life special. This is why many schools now encourage students to learn about world cultures alongside their own history and language.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "How many continents does the text mention?", "section": "While you read", "options": ["Five", "Six", "Seven", "Eight"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, Turkey is located only in Asia.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Turkey is located on two continents, Europe and Asia.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the text say about greetings around the world?", "section": "While you read", "options": ["They are always the same everywhere.", "They can be very different, such as handshakes, bows or kisses.", "Nobody greets each other in some cultures.", "Greetings are not important."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "According to the text, nationality is not only about a passport; it is also about shared ___, food and celebrations.", "section": "While you read", "reveal": "history", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why does the text say comparing traditions is useful?", "section": "While you read", "options": ["It makes travelling cheaper.", "It helps us understand our own culture better.", "It stops people from learning languages.", "It is required at international schools."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What is one custom from another country that you find interesting?", "Do you think it is important to learn about other cultures? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Food Around the World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What is your favourite traditional dish? Where does it come from?", "Do you think food tells us something about a country's culture?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Food Around the World", "num": 1, "total": 4, "text": "Food is one of the best ways to learn about a country's culture. In Italy, families often gather for long meals that include pasta, fresh bread and vegetables grown nearby. In Japan, rice, fish and vegetables are the base of most meals, and food is usually presented in small, beautifully arranged portions. In Mexico, corn, beans and chilli peppers appear in almost every traditional dish, giving Mexican cuisine its famous spicy flavour.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Food Around the World", "num": 2, "total": 4, "text": "In Turkey, meals often start with a variety of small dishes called mezes, followed by grilled meat or fish and ending with sweet desserts like baklava. Bread is a staple food and is served with almost every meal. Many Turkish families still follow the tradition of eating together and sharing food from the same plates, which shows the importance of community and hospitality in Turkish culture.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Food Around the World", "num": 3, "total": 4, "text": "Shopping for food is also different from country to country. In some places, people buy fresh ingredients every day from local markets, while in others, they prefer to buy packaged food from large supermarkets once a week. Some people follow special diets for health or personal reasons, such as being vegetarian or avoiding certain ingredients, and shops around the world are increasingly offering more choices to meet these needs.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Food Around the World", "num": 4, "total": 4, "text": "Trying new food is a simple but powerful way to connect with another culture. Even if you cannot travel to a country, tasting its traditional dishes can teach you about its history, geography and values. This is one reason why food culture is such a popular topic when people talk about life in different parts of the world.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what gives Mexican cuisine its spicy flavour?", "section": "While you read", "options": ["Rice and fish", "Corn, beans and chilli peppers", "Pasta and bread", "Mezes and baklava"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In Turkey, meals often start with small dishes called ___.", "section": "While you read", "reveal": "mezes", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The text says that all people around the world shop for food in exactly the same way.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says shopping habits are different from country to country.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does sharing food from the same plates show about Turkish culture, according to the text?", "section": "While you read", "options": ["That food is expensive", "The importance of community and hospitality", "That people don't like cooking", "That meals are always short"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the last paragraph?", "section": "While you read", "options": ["Travelling is the only way to learn about a culture.", "Trying traditional food helps you connect with another culture even without travelling.", "Food culture is not an interesting topic.", "Every country eats the same dishes."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Would you like to try a traditional dish from a country you've never visited? Which one?", "How is shopping for food in your family similar to or different from the text?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "At the Local Market", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Where do you usually buy fresh food — a market or a supermarket?", "What questions do people usually ask when shopping for food?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "At the Local Market", "audio": null, "transcript": [{"speaker": "Seller", "line": "Good morning! How can I help you today?"}, {"speaker": "Customer", "line": "Morning! Do you have any fresh tomatoes?"}, {"speaker": "Seller", "line": "Yes, we do. They arrived this morning. How many would you like?"}, {"speaker": "Customer", "line": "I'll take a kilo, please. And how much cheese do you have left?"}, {"speaker": "Seller", "line": "We still have quite a lot. How much do you need?"}, {"speaker": "Customer", "line": "Just a small piece. I don't need much, actually — I already have some at home."}, {"speaker": "Seller", "line": "No problem. Is there anything else? We've just got some fresh olives too."}, {"speaker": "Customer", "line": "That's great, I love olives! I'll take some, please. That's all, thanks."}, {"speaker": "Seller", "line": "Perfect. That's twelve lira in total, please."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does the customer ask for first?", "section": "While you listen", "options": ["Cheese", "Olives", "Tomatoes", "Bread"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The customer buys ___ of tomatoes.", "section": "While you listen", "reveal": "a kilo", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The customer needs a large amount of cheese.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The customer only needs a small piece because she already has some at home.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How much does the customer pay in total?", "section": "While you listen", "options": ["Ten lira", "Twelve lira", "Twenty lira", "Two lira"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the seller offer that has just arrived?", "section": "While you listen", "options": ["Fresh olives", "Fresh bread", "Fresh fish", "Fresh fruit"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Have you ever had a similar conversation at a market? What did you buy?", "What would you like to buy if you visited this market?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "My Life in Different Countries", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Have you ever lived in or visited another country? What was different there?", "What do you think it is like to grow up in more than one country?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "My Life in Different Countries", "audio": null, "transcript": [{"speaker": "Interviewer", "line": "So, Elif, you've lived in several countries, haven't you?"}, {"speaker": "Elif", "line": "Yes, that's right. I was born in Turkey, but I've also lived in Germany and, more recently, in Canada."}, {"speaker": "Interviewer", "line": "How long have you lived in Canada?"}, {"speaker": "Elif", "line": "I've lived here for almost two years now. Before that, I lived in Germany for six years, since I was ten."}, {"speaker": "Interviewer", "line": "That's really interesting. Have you noticed big differences in food culture?"}, {"speaker": "Elif", "line": "Definitely! In Germany, people eat bread with almost every meal, but here in Canada, people often eat much bigger portions and lots of different cuisines because so many nationalities live here."}, {"speaker": "Interviewer", "line": "Have you tried food from many different countries, then?"}, {"speaker": "Elif", "line": "Yes, I've already tried Indian, Chinese, Mexican and Lebanese food, just in my neighbourhood! I've never eaten so many different cuisines in one place before."}, {"speaker": "Interviewer", "line": "That sounds amazing. Thanks so much for sharing, Elif."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Where was Elif born?", "section": "While you listen", "options": ["Germany", "Canada", "Turkey", "Mexico"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Elif has lived in Canada for ___.", "section": "While you listen", "reveal": "almost two years", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Elif says food portions in Canada are usually smaller than in Germany.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif says people in Canada often eat much bigger portions.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Which cuisines does Elif say she has already tried in her neighbourhood?", "section": "While you listen", "options": ["Italian, French, Greek and Spanish", "Indian, Chinese, Mexican and Lebanese", "Japanese, Korean, Thai and Brazilian", "Only Turkish and German"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Would you like to live in a country with people from many different nationalities? Why?", "What cuisines have you already tried in your own city?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Have You Ever...? A Continents Survey", "text": "In pairs, ask and answer questions about life experiences related to travel, nationalities and food, using the present perfect and question tags.", "steps": ["Prepare five present-perfect questions about travel, food or meeting people of different nationalities.", "Take turns asking and answering your questions with your partner.", "Add a question tag to at least two of your statements during the conversation, e.g. 'You've never eaten sushi, have you?'", "Report one interesting thing you learned about your partner to the class."], "chips": ["Have you ever been to...?", "I've never...", "I've already...", "You've tried..., haven't you?", "That's..., isn't it?"], "timer": 600, "levels": ["Give students a list of ready-made present perfect questions (e.g. Have you ever tried...? Have you ever visited...?) that they can choose from.", "Students write and ask their own five questions using t
