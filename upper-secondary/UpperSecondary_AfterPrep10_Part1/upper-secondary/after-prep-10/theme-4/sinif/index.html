 withdraw enough cash for the sale?", "Does your family put aside money each month?"], "short": ["Yes, I did. / No, I didn't.", "Yes, we do. / No, we don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He invested his salary a new business.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He invested his salary in a new business.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She blew her money the sale.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She blew her money on the sale.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He payed off his debt last week.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He paid off his debt last week.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "After months of watching adverts for it, Zeynep finally decided to ___ for the new laptop.", "section": "A · Choose the correct option.", "options": ["save up", "withdraw", "pay off"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The company decided to ___ heavily in a new advertising campaign.", "section": "A · Choose the correct option.", "options": ["invest", "withdraw", "save up"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "He walked into the bank to ___ some cash before the big sale.", "section": "A · Choose the correct option.", "options": ["withdraw", "blow", "put aside"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "After seeing the same advert ten times, she finally ___ (blow) her savings on the product.", "section": "B · Complete with the correct form.", "reveal": "blew", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It's smart to ___ (put aside) a small amount every month, even for small purchases.", "section": "B · Complete with the correct form.", "reveal": "put aside", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "They worked hard for two years to ___ (pay off) the loan for their shop.", "section": "B · Complete with the correct form.", "reveal": "pay off", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She invested her money a new online store.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She invested her money in a new online store.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "He put ten lira aside every week.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "They blew their entire budget on a single television commercial.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Did you ever ___ (blow) money on something just because of an advert?", "section": "Dialogue · Complete with the correct phrasal verb.", "reveal": "blow", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes! I ___ (blow) my whole allowance on trainers last month, but now I'm trying to ___ (save up) again.", "section": "Dialogue · Complete with the correct phrasal verb.", "reveal": "blew / save up", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "aside / little / a / week / every / puts / she", "section": "Dialogue · Reorder the sentence.", "words": ["she", "puts", "a", "little", "aside", "every", "week"], "end": ".", "reveal": "She puts a little aside every week.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Personal and Impersonal Passive: Reporting Opinions About Advertising", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["It <mark>is widely believed<\/mark> that catchy jingles make products easier to remember.", "Catchy jingles <mark>are widely believed to make<\/mark> products easier to remember.", "It <mark>is said<\/mark> that advertising influences even careful shoppers.", "Advertising <mark>is said to influence<\/mark> even careful shoppers."], "ask": "Compare sentences 1 & 2, and sentences 3 & 4. Which sentence in each pair begins with 'It', and which begins with the real subject of the opinion?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["It + is/are + past participle + that clause", "subject + is/are + past participle + to + infinitive", "the same opinion in two different structures"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The impersonal passive structure is: ___.", "section": "Complete the rule", "reveal": "It + is/are + past participle + that clause", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The personal passive structure is: ___.", "section": "Complete the rule", "reveal": "subject + is/are + past participle + to + infinitive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Both structures express ___, and are more formal and common in reports or news.", "section": "Complete the rule", "reveal": "the same opinion in two different structures", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "To report an opinion impersonally, use 'It is/are + past participle + that…' (It is said that advertising works). To report the same opinion personally, use subject + is/are + past participle + to + infinitive (Advertising is said to work). Both carry the same meaning, but the personal passive is often considered more fluent.", "tr": "Bir görüşü kişisiz olarak bildirmek için 'It is/are + past participle + that…' kullanılır (It is said that advertising works). Aynı görüşü kişisel olarak bildirmek için ise özne + is/are + past participle + to + infinitive kullanılır (Advertising is said to work). İkisi de aynı anlamı taşır, ancak personal passive genellikle daha akıcı kabul edilir.", "when_en": "We use these structures to report general opinions about advertising, consumers or society in a more objective, formal way, without naming a personal source.", "when": "Reklamlar, tüketiciler ya da toplum hakkındaki genel görüşleri kişisel bir kaynak belirtmeden, daha nesnel ve resmi bir şekilde aktarmak istediğimizde bu yapıları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["people / think", "advertising / shape", "children's choices"], "reveal": "It is thought that advertising shapes children's choices. / Advertising is thought to shape children's choices.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["people / say", "commercials / influence", "how much we spend"], "reveal": "It is said that commercials influence how much we spend. / Commercials are said to influence how much we spend.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["many / believe", "bright colours / attract", "more customers"], "reveal": "It is believed that bright colours attract more customers. / Bright colours are believed to attract more customers.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["experts / claim", "repeated adverts / increase", "brand recognition"], "reveal": "It is claimed that repeated adverts increase brand recognition. / Repeated adverts are claimed to increase brand recognition.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["some / argue", "online ads / target", "teenagers unfairly"], "reveal": "It is argued that online ads target teenagers unfairly. / Online ads are argued to target teenagers unfairly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / people / think", "celebrity endorsements / make", "products more trustworthy"], "reveal": "Is it thought that celebrity endorsements make products more trustworthy? / Are celebrity endorsements thought to make products more trustworthy?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences giving opinions about advertising, using both the impersonal (It is said that…) and the personal (Something is said to…) passive.", "chips": ["It is believed that…", "Advertising is believed to…", "It is often argued that…", "Commercials are often said to…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["It is believed that adverts shape our choices.", "Adverts are believed to shape our choices."], "negative": ["It isn't thought that this campaign will succeed.", "This campaign isn't thought to succeed."], "question": ["Is it claimed that the advert is misleading?", "Is the advert claimed to be misleading?"], "short": ["Yes, it is. / No, it isn't.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Advertising is said influence our choices.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Advertising is said to influence our choices.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "It is said advertising that works.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It is said that advertising works.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Commercials are said working well.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Commercials are said to work well.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ that advertising affects children's food choices.", "section": "A · Choose the correct option.", "options": ["It is said", "It says", "Is said"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Bright packaging ___ to attract shoppers' attention.", "section": "A · Choose the correct option.", "options": ["is believed", "believes", "is believing"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ argued that online ads collect too much personal data.", "section": "A · Choose the correct option.", "options": ["It is", "It's is", "Is"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "It ___ (think) that repeated jingles help people remember brands.", "section": "B · Complete with the correct form.", "reveal": "is thought", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Repeated adverts ___ (claim) ___ (increase) brand recognition.", "section": "B · Complete with the correct form.", "reveal": "are claimed / to increase", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It ___ (not / believe) that all adverts are honest.", "section": "B · Complete with the correct form.", "reveal": "is not believed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "It is said that advertising influence people's habits.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It is said that advertising influences people's habits.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Advertising is said to influence people's habits.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "It is believed advertising that shapes public opinion.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It is believed that advertising shapes public opinion.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ (say) about this new campaign?", "section": "Dialogue · Complete with the correct passive form.", "reveal": "is said", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: It ___ (claim) that it will double sales, and the product ___ (expect) to sell out by Friday.", "section": "Dialogue · Complete with the correct passive form.", "reveal": "is claimed / is expected", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "work / said / advertising / to / is / well", "section": "Dialogue · Reorder the sentence.", "words": ["advertising", "is", "said", "to", "work", "well"], "end": ".", "reveal": "Advertising is said to work well.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Anatomy of a Slogan", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think 'the anatomy of a slogan' means?", "Can you remember any advertising slogan or jingle by heart? Why do you think it stuck in your memory?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Anatomy of a Slogan", "num": 1, "total": 3, "text": "Open any magazine or scroll through any app, and within seconds an advertisement will try to catch your eye. Behind every slogan, though, lies a surprising amount of psychology. Copywriters choose each word with care, often building a campaign around adjectives that grow gradually stronger — good, then great, then unbeatable — so that a product always sounds just a little more exciting than its rivals. A soap might be described first as 'gentle', then, a line later, as 'incredibly gentle', while a competitor's soap is quietly dismissed as merely 'ordinary'.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Anatomy of a Slogan", "num": 2, "total": 3, "text": "Words are only half the story. Many successful campaigns also rely on a jingle — a short, catchy tune that sticks in a listener's memory long after the advert has finished. Researchers who study consumer behaviour say that a jingle heard often enough becomes almost impossible to forget, even years later. This is no accident: advertisers deliberately repeat both the tune and the slogan across television, radio and social media, hoping that familiarity will eventually turn into trust.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Anatomy of a Slogan", "num": 3, "total": 3, "text": "Not everyone is convinced that this approach is entirely honest. Critics argue that stacking one impressive adjective on top of another can mislead shoppers into expecting more than a product can actually deliver. For this reason, many schools now teach media literacy, encouraging young consumers to ask a simple question before they buy: is this slogan describing the product, or just describing a feeling the advertiser wants me to have?", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Slogans are chosen randomly by advertisers.", "Advertisers carefully choose increasingly strong words and repeat jingles to influence consumers.", "Jingles are no longer used in modern advertising."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Copywriters often build a campaign around adjectives that grow ___ across the text.", "section": "While you read", "reveal": "gradually stronger", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, why do advertisers repeat a jingle across many platforms?", "section": "While you read", "options": ["To make it illegal for rivals to copy", "To make it hard for actors to remember their lines", "To build familiarity that can turn into trust"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, all critics believe slogans are completely honest.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, critics argue that stacking exaggerated adjectives can mislead shoppers.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Many schools now teach ___ to help young consumers question adverts.", "section": "While you read", "reveal": "media literacy", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think exaggerated slogans are a harmless part of advertising, or a kind of dishonesty? Why?", "Think of a product. Write one 'plain' and one 'exaggerated' slogan for it."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Buy Now, Think Later?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think the title 'Buy Now, Think Later?' suggests about advertising?", "Do you think adverts affect your own spending decisions? Give an example."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Buy Now, Think Later?", "num": 1, "total": 3, "text": "It is widely believed that advertising simply informs consumers about new products, but psychologists argue that its real power lies elsewhere. Adverts are said to work by creating an emotional connection — with happiness, status or the fear of missing out — long before the shopper consciously considers whether they actually need the item. By the time reasoning takes over, an emotional decision may already have been made.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Buy Now, Think Later?", "num": 2, "total": 3, "text": "This idea troubles many economists, who point out that entire populations can be nudged toward spending patterns that don't always serve their own interests. Families are sometimes encouraged, through relentless advertising, to blow money on the latest gadget rather than put aside savings for less exciting but more important goals. It is claimed that low-income households are particularly vulnerable, since a single well-timed advertisement can outweigh weeks of careful budgeting.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Buy Now, Think Later?", "num": 3, "total": 3, "text": "Not all commentators are so pessimistic, however. Some argue that advertising, used responsibly, helps a population make informed comparisons between products, and that today's consumers are far less gullible than earlier generations assumed. Whichever view is correct, most agree on one thing: understanding how an advert is trying to persuade you is the first step toward deciding, calmly, whether to reach for your wallet.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Advertising only gives factual information about products.", "Advertising can influence emotions and spending before reasoning takes over, which raises concerns for some commentators but not all.", "All economists agree that advertising should be banned."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Adverts are said to work by creating an ___ connection before reasoning takes over.", "section": "While you read", "reveal": "emotional", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, all commentators believe advertising is harmful.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, some commentators believe advertising can help consumers make informed comparisons.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "According to the text, who is claimed to be particularly vulnerable to well-timed advertisements?", "section": "While you read", "options": ["Retired shoppers", "Low-income households", "Company shareholders"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The text suggests that families are sometimes encouraged to ___ money on gadgets rather than save it.", "section": "While you read", "reveal": "blow", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you agree that some groups of people are more vulnerable to advertising than others? Why or why not?", "What is one thing you could do before buying something you saw advertised?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "That Advert Again?!", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what kind of advert do you think annoys people the most, and why?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "That Advert Again?!", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Why is Mert irritated?", "section": "While you listen", "options": ["He lost his phone.", "The same advert keeps interrupting his show.", "Aslı changed the channel."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Mert says he would rather not buy the phone because he is ___ for something else.", "section": "While you listen", "reveal": "saving up", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Aslı is saving money to buy the advertised phone.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Aslı is putting money aside for a trip this summer.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Mert mean by 'I just wish adverts would let us watch one episode in peace'?", "section": "While you listen", "options": ["He wants fewer advert interruptions.", "He wants more adverts.", "He wants to watch a different show."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Our Favourite (and Least Favourite) Commercials", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What makes a TV commercial memorable — being funny, aggressive, confident, or something else?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Our Favourite (and Least Favourite) Commercials", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What kind of commercial does Kerem describe as his favourite?", "section": "While you listen", "options": ["A funny snack advert", "A confident sports-brand advert", "An aggressive insurance advert"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Defne describes the snack advert as loud and ___.", "section": "While you listen", "reveal": "aggressive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": umber for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "They put aside a little money aside every week.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They put a little money aside every week.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
