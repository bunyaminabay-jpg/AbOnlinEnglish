 about your own life or the world, using the Future Perfect and the Future Continuous.", "chips": ["By the time I'm thirty, I…", "This time next year, I…", "In fifty years, scientists…", "By 2100, the world…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["By 2040, we will have developed cheaper renewable energy.", "This time tomorrow, I will be flying to Izmir."], "negative": ["They won't have finished the new metro line by next year.", "I won't be working at six — I'll already be home."], "question": ["Will scientists have found a cure for this disease by 2050?", "Will you be living in the same city in ten years?"], "short": ["Yes, they will. / No, they won't.", "Yes, I will. / No, I won't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "By 2050, we will build flying cars for everyone.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "By 2050, we will have built flying cars for everyone.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This time next year, I will study at university.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This time next year, I will be studying at university.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "By the time she graduates, she will have living abroad for two years.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "By the time she graduates, she will have lived abroad for two years.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "By 2060, most cars ___ electric or self-driving.", "section": "A · Choose the correct option.", "options": ["will have become", "will e, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "By 2100, we will have solved every environmental problem.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This time next year, I will study at a different school.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This time next year, I will be studying at a different school.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "By the time I'm forty, I will have travel to every continent.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "By the time I'm forty, I will have travelled to every continent.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you ___ (finish) university by 2030?", "section": "Dialogue · Complete with the correct form.", "reveal": "Will / have finished", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I hope so! By then, I ___ (study) for four years and I ___ (probably / start) my first job.", "section": "Dialogue · Complete with the correct form.", "reveal": "will have studied / will probably be starting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "cities / have / floating / built / by / 2100 / will / engineers", "section": "Dialogue · Reorder the sentence.", "words": ["engineers", "will", "have", "built", "floating", "cities", "by", "2100"], "end": ".", "reveal": "Engineers will have built floating cities by 2100.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Future Expressions: be about to / be bound to / be likely to / be set to", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Look at those clouds — it <mark>is about to<\/mark> pour with rain any second.", "If nobody changes their habits, plastic waste <mark>is bound to<\/mark> keep piling up in the oceans.", "Experts say driverless taxis <mark>are likely to<\/mark> become common in big cities within ten years.", "The government's new recycling law <mark>is set to<\/mark> come into force next January."], "ask": "Which expression describes something about to happen in the next few moments, which describes something almost certain, which describes something probable, and which describes something officially planned?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["about to happen in the next few moments", "certain or almost certain to happen", "probable, but not certain", "officially planned or expected to happen"], "chips": true, "text": "Match each expression to its meaning by completing the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'be about to' = something ___.", "section": "Complete the rule", "reveal": "about to happen in the next few moments", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'be bound to' = something ___.", "section": "Complete the rule", "reveal": "certain or almost certain to happen", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'be likely to' = something ___.", "section": "Complete the rule", "reveal": "probable, but not certain", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'be set to' = something ___.", "section": "Complete the rule", "reveal": "officially planned or expected to happen", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'be about to' describes something that will happen in the very near future (in seconds or minutes); 'be bound to' describes something certain or almost certain; 'be likely to' describes something probable but not certain; 'be set to' describes something officially planned or expected.", "tr": "'be about to' çok yakın gelecekte olacak bir eylemi (birkaç saniye/dakika içinde); 'be bound to' kesin ya da neredeyse kesin olacak bir şeyi; 'be likely to' olası ama kesin olmayan bir şeyi; 'be set to' resmi olarak planlanmış/beklenen bir olayı anlatır.", "when_en": "We use these expressions to show how certain a prediction is: an immediate event, an inevitable result, a probable development, or a planned event.", "when": "Tahminlerimizin ne kadar kesin olduğunu belirtmek istediğimizde bu ifadeleri kullanırız: anlık bir olay, kaçınılmaz bir sonuç, olası bir gelişme ya da planlanmış bir olay.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the film", "be about to / start", "— hurry up!"], "reveal": "The film is about to start — hurry up!", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["prices", "be likely to / rise", "if fuel costs keep increasing"], "reveal": "Prices are likely to rise if fuel costs keep increasing.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the new bridge", "be set to / open", "in the spring"], "reveal": "The new bridge is set to open in the spring.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["if we don't act now", "the situation", "be bound to / get worse"], "reveal": "If we don't act now, the situation is bound to get worse.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["look", "the bus", "be about to / leave — run!"], "reveal": "Look, the bus is about to leave — run!", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / this new policy", "be likely to / change", "people's daily habits"], "reveal": "Is this new policy likely to change people's daily habits?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four predictions about the future of your city, your school or the world, using be about to, be bound to, be likely to and be set to.", "chips": ["Our city is set to…", "Sooner or later, our school is bound to…", "Technology is likely to…", "Look — it's about to…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The meeting is about to begin.", "This plan is set to change everything."], "negative": ["This isn't likely to happen before next year.", "Nothing here is about to change overnight."], "question": ["Is the economy likely to improve next year?", "Is the new law set to affect small businesses?"], "short": ["Yes, it is. / No, it isn't.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Sea levels are bound to rising if nothing changes.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Sea levels are bound to rise if nothing changes.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The train is likely arrive late today.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The train is likely to arrive late today.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The new mall is about opening next week.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The new mall is about to open next week.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Look at those dark clouds — it ___ rain.", "section": "A · Choose the correct option.", "options": ["is about to", "is bound to", "is set to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "If we keep ignoring the problem, it ___ get worse.", "section": "A · Choose the correct option.", "options": ["is likely to", "is bound to", "is about to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The new recycling law ___ come into force next January.", "section": "A · Choose the correct option.", "options": ["is set to", "is about to", "is bound to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Experts say driverless cars ___ (likely / become) common within a decade.", "section": "B · Complete with the correct form.", "reveal": "are likely to become", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Hurry! The train ___ (about / leave).", "section": "B · Complete with the correct form.", "reveal": "is about to leave", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The festival ___ (set / start) at seven o'clock sharp.", "section": "B · Complete with the correct form.", "reveal": "is set to start", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Nothing is bound to changing without real effort.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Nothing is bound to change without real effort.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The bridge is set to open next spring.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Prices are likely rise if fuel costs increase.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Prices are likely to rise if fuel costs increase.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Have you heard? The new stadium ___ (set / open) next month!", "section": "Dialogue · Complete with the correct form.", "reveal": "is set to open", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Really? Ticket prices ___ (bound / be) expensive, then.", "section": "Dialogue · Complete with the correct form.", "reveal": "are bound to be", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "rain / about / it / to / is", "section": "Dialogue · Reorder the sentence.", "words": ["it", "is", "about", "to", "rain"], "end": ".", "reveal": "It is about to rain.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Postcard from 2126", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you imagine life will be like in 100 years?", "What is one piece of technology you think will completely change in the future?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Postcard from 2126", "num": 1, "total": 3, "text": "Imagine a morning a hundred years from now. Your bedroom lights adjust themselves before you even open your eyes, and a gentle voice tells you the weather, your first meeting, and how well you slept. By the time you reach the kitchen, a small robot has already prepared your breakfast according to what your body needs that day. Outside, the streets are quieter than today's, filled with silent electric vehicles and bicycles rather than roaring engines. Most rooftops are covered with solar panels, and vertical gardens climb the sides of buildings, growing vegetables for the neighbourhood. It sounds like science fiction, yet many of these ideas are already being tested in cities around the world.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Postcard from 2126", "num": 2, "total": 3, "text": "Work will probably look very different too. Automation is bound to take over repetitive tasks, from packing boxes to answering simple customer questions, freeing people for more creative or caring jobs. Some researchers predict that by 2126 many adults will have changed careers several times, constantly learning new skills as technology develops. Others are less certain, warning that the transition could increase inequality if only some people gain access to good education and training. Either way, the classroom of the future is set to look nothing like the classroom of today, with lessons designed around each learner's pace rather than a fixed timetable for everyone.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Postcard from 2126", "num": 3, "total": 3, "text": "Not everything, however, is guaranteed to improve. Rising sea levels are likely to force some coastal communities to move inland, and overpopulation in certain regions could put pressure on food, water and housing. Scientists are on the verge of several breakthroughs in renewable energy and medicine, but whether societies use these discoveries wisely remains an open question. Perhaps the most honest postcard from 2126 wouldn't promise a perfect world — just one that is different, and, with the right choices, possibly fairer than our own.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Life in 2126 will be identical to life today.", "Future life is likely to bring both exciting improvements and serious challenges.", "Robots will completely replace human workers by 2126."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "According to the text, rooftops in the future are likely to be covered with ___ panels.", "section": "While you read", "reveal": "solar", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to paragraph 2, what could happen if only some people get access to good education?", "section": "While you read", "options": ["Everyone will benefit equally.", "Inequality could increase.", "Automation will stop completely."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, scientists are completely certain that societies will use future discoveries wisely.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, whether societies use future discoveries wisely remains an open question.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The text says rising sea levels are likely to force some coastal communities to move ___.", "section": "While you read", "reveal": "inland", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which prediction in the text do you find most believable? Why?", "What is one change you would add to this 'postcard from the future'?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Negotiating Tomorrow", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think a 'vertical farm' might be?", "Have you ever had to negotiate a compromise with someone? What happened?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Negotiating Tomorrow", "num": 1, "total": 3, "text": "Last month, the town council of a small coastal city held an unusual meeting. A group of young engineers had submitted a proposal to turn an old car park into a 'vertical farm' — a multi-storey building that would grow vegetables using solar power and recycled water. Some council members were immediately in favour, arguing that the project was bound to reduce the town's dependence on imported food. Others were more cautious, worried about the cost and whether local residents would actually support it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Negotiating Tomorrow", "num": 2, "total": 3, "text": "After two hours of discussion, neither side was ready to give in completely, so they began to negotiate a compromise. The engineers agreed to reduce the size of the project in its first year, while the council agreed to provide a small grant instead of covering the full cost. 'It isn't exactly what we proposed,' admitted one engineer afterwards, 'but it's a realistic first step, and we're likely to expand it later if it works.' The council also promised to review the results in due course, rather than committing to years of funding immediately.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Negotiating Tomorrow", "num": 3, "total": 3, "text": "For many residents watching the debate online, the meeting was a lesson in how future-focused decisions actually get made — not through grand, perfect plans, but through patient back-and-forth negotiation. As one council member put it, 'Nobody got everything they wanted, but nobody walked away empty-handed either. Sooner or later, that's how most good ideas about the future become real.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What did the engineers originally propose?", "section": "While you read", "options": ["Building a shopping centre", "Turning an old car park into a vertical farm", "Closing the town's only food market"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The engineers agreed to ___ the size of the project in its first year.", "section": "While you read", "reveal": "reduce", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, the council and the engineers immediately agreed on every detail of the plan.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, they reached a compromise after two hours of discussion.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What did the council agree to do instead of covering the full cost?", "section": "While you read", "options": ["Cancel the project", "Provide a small grant", "Ask a different company to pay"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "According to the final paragraph, most good ideas about the future become real through patient back-and-forth ___.", "section": "While you read", "reveal": "negotiation", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think compromise is usually a good way to make decisions about the future? Why or why not?", "What is one future-focused project you would like to see proposed in your own town or city?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Room for Negotiation", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what kinds of tasks do you think two students might disagree about in a group project?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Room for Negotiation", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does Berk want to do instead of just designing the poster?", "section": "While you listen", "options": ["Nothing at all", "Some of the research too", "Only the writing"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Asel agrees to do the ___ of the poster while Berk does the layout and colours.", "section": "While you listen", "reveal": "diagrams", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the dialogue, Asel and Berk expect to finish the first draft by Friday.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the dialogue, they expect to have finished it by Sunday evening.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What do Berk and Asel decide to do this weekend?", "section": "While you listen", "options": ["Cancel other plans to finish the project", "Postpone the project until next week", "Ask a third student to help"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Life in a Hundred Years", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What do you predict a scientist might say about food, homes or transport in 100 years?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Life in a Hundred Years", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show t
