pe": "gap", "q": "'Was/were able to' + verb often describes ___, especially when there was some difficulty.", "section": "Complete the rule", "reveal": "one specific achievement", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Be used to' + -ing describes being ___.", "section": "Complete the rule", "reveal": "already familiar (a state)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Get used to' + -ing describes ___.", "section": "Complete the rule", "reveal": "the process of becoming familiar", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Could' describes a general past ability. 'Was/were able to' describes one specific achievement, often despite difficulty. 'Be used to + -ing' describes an existing state of familiarity, while 'get used to + -ing' describes the process of becoming familiar with something.", "tr": "Geçmişteki genel bir yeteneği anlatmak için 'could' kullanılır. Belirli, tek bir başarıyı (özellikle zorluğa rağmen) anlatmak için 'was/were able to' kullanılır. 'Be used to + -ing' bir duruma zaten alışkın olmayı, 'get used to + -ing' ise o duruma alışma sürecini ifade eder.", "when_en": "Use 'could' for a general childhood or long-term ability; use 'was/were able to' for one difficult achievement; use 'be used to' for an existing state of familiarity; use 'get used to' for the process of becoming familiar with something new.", "when": "Genel bir çocukluk yeteneğini anlatırken 'could'; tek seferlik, zor bir başarıyı anlatırken 'was/were able ": ["? / the inventor", "ever / be able to / convince", "the investors on the first try"], "reveal": "Was the inventor ever able to convince the investors on the first try?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about yourself or someone you know: one about a general childhood ability, one about a single achievement, and two about getting or being used to something new.", "chips": ["As a child, I could…", "After a lot of practice, I was finally able to…", "I'm still not used to…", "It took me a while to get used to…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["She could speak three languages by the age of ten.", "He was able to finish the marathon despite the injury.", "They are used to working under pressure.", "I'm getting used to the new schedule."], "negative": ["He couldn't swim before he took up the sport.", "She wasn't able to convince them at first.", "We aren't used to such extreme weather.", "I still haven't got used to waking up so early."], "question": ["Could you read before you started school?", "Was she able to finish the project on time?", "Are you used to the new system yet?", "Did it take long to get used to the change?"], "short": ["Yes, I could. / No, I couldn't.", "Yes, she was. / No, she wasn't.", "Yes, I am. / No, not yet."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "After years of training, she could finally win the competition.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "After years of training, she was finally able to win the competition.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I am used to wake up early now.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I am used to waking up early now.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She used to living in a big city, so the small town felt strange.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She wasn't used to living in a big city, so the small town didn't feel strange. / She used to live in a big city.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "As a young girl, Elena ___ compose short pieces of music by ear.", "section": "A · Choose the correct option.", "options": ["could", "was able to", "is used to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Despite the broken equipment, the team ___ finish the experiment on time.", "section": "A · Choose the correct option.", "options": ["could", "was able to", "used to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "After ten years abroad, he ___ speaking a mix of three languages every day.", "section": "A · Choose the correct option.", "options": ["could", "is used to", "was able to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "It took her almost a year to ___ (get used to) living without electricity on the island.", "section": "B · Complete with the correct form.", "reveal": "get used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Against the odds, the young scientist ___ (be able to) publish her first paper at seventeen.", "section": "B · Complete with the correct form.", "reveal": "was able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "As a child, he ___ (can) recognise every bird in the forest by its call.", "section": "B · Complete with the correct form.", "reveal": "could", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "After months of practice, she could finally perform the piece perfectly at the concert.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "After months of practice, she was finally able to perform the piece perfectly at the concert.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "He still isn't used to work such long hours.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He still isn't used to working such long hours.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "As a teenager, she could already fix almost any bicycle.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ (can) you read music before you joined the orchestra?", "section": "Dialogue · Complete with the correct form.", "reveal": "Could", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: A little, yes. But it took me months to really ___ (get used to) sight-reading fast enough.", "section": "Dialogue · Complete with the correct form.", "reveal": "get used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "odds / the / against / finish / able / to / race / she / was / the", "section": "Dialogue · Reorder the sentence.", "words": ["against", "the", "odds,", "she", "was", "able", "to", "finish", "the", "race"], "end": ".", "reveal": "Against the odds, she was able to finish the race.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Degree Modifiers: Slightly, Fairly, Extremely, Absolutely", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The results were only <mark>slightly<\/mark> better than the team had expected.", "Her first attempt was <mark>fairly<\/mark> successful, but far from perfect.", "The whole project turned out to be <mark>extremely<\/mark> difficult in the end.", "Everyone agreed that his recovery was <mark>absolutely<\/mark> incredible."], "ask": "Which degree modifiers make an adjective a little stronger, which make it moderately strong, which make it very strong, and which are only used with 'extreme' adjectives that already mean 100%?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["gradable adjectives", "ungradable (extreme) adjectives", "a small degree", "a very high degree"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Slightly' and 'fairly' are typically used with ___ (e.g. good, difficult, successful), which can exist in degrees.", "section": "Complete the rule", "reveal": "gradable adjectives", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Extremely' also modifies gradable adjectives, showing ___.", "section": "Complete the rule", "reveal": "a very high degree", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Absolutely' is typically used with ___ (e.g. incredible, amazing, impossible), which already mean 100% and cannot be 'more' or 'less'.", "section": "Complete the rule", "reveal": "ungradable (extreme) adjectives", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Degree modifiers show how strong an adjective is. 'Slightly' (a little) and 'fairly' (moderately) are used with gradable adjectives (good, difficult); 'extremely' is also used with gradable adjectives but shows a very high degree. 'Absolutely' is used with ungradable/extreme adjectives that already mean 100% (incredible, impossible, amazing).", "tr": "Derece zarfları (degree modifiers) bir sıfatın gücünü belirtir. 'Slightly' (hafifçe) ve 'fairly' (oldukça) derecelendirilebilen sıfatlarla (good, difficult) kullanılır; 'extremely' (son derece) da aynı tür sıfatlarla ama çok güçlü bir derece belirtir. 'Absolutely' (kesinlikle) ise zaten %100 anlamı taşıyan, derecelendirilemeyen sıfatlarla (incredible, impossible, amazing) kullanılır.", "when_en": "We use degree modifiers when we want to be precise about how strong a quality is — for example, how surprising a story is, or how difficult an achievement was.", "when": "Bir durumun ne kadar 'derecede' olduğunu netleştirmek istediğimizde, örneğin bir hikayenin ne kadar şaşırtıcı ya da bir başarının ne kadar zor olduğunu anlatırken derece zarflarını kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the story", "absolutely / incredible", "everyone agreed"], "reveal": "Everyone agreed the story was absolutely incredible.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the first results", "slightly / disappointing", "compared to expectations"], "reveal": "The first results were slightly disappointing compared to expectations.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["his plan", "fairly / risky", "but not impossible"], "reveal": "His plan was fairly risky, but not impossible.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the journey across the desert", "extremely / dangerous", "according to the guide"], "reveal": "According to the guide, the journey across the desert was extremely dangerous.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the ending of the story", "absolutely / unbelievable", "when you hear it"], "reveal": "The ending of the story is absolutely unbelievable when you hear it.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / the challenge", "extremely / difficult", "for the first team"], "reveal": "Was the challenge extremely difficult for the first team?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about an amazing story you know or can imagine, using a different degree modifier (slightly, fairly, extremely, absolutely) in each one.", "chips": ["At first, the story seemed only slightly…", "Honestly, I found it fairly…", "By the end, the situation was extremely…", "In my opinion, the whole thing was absolutely…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The story was slightly exaggerated, but mostly true.", "Her achievement was absolutely remarkable."], "negative": ["The task wasn't extremely difficult, just fairly time-consuming.", "It isn't slightly unusual — it's absolutely astonishing."], "question": ["Was the journey extremely dangerous?", "Is the story absolutely true, or slightly exaggerated?"], "short": ["Yes, extremely. / No, only slightly.", "Yes, absolutely. / No, not really."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The ending was very absolutely amazing.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The ending was absolutely amazing.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The plan was absolutely risky.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The plan was extremely risky. / The plan was fairly risky.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "It was slightly incredible how she survived.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It was absolutely incredible how she survived.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Her first attempt at the language exam was ___ successful — she passed, but only just.", "section": "A · Choose the correct option.", "options": ["absolutely", "fairly", "utterly"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When the truth came out, everyone found the story ___ unbelievable.", "section": "A · Choose the correct option.", "options": ["slightly", "fairly", "absolutely"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The mountain path was ___ steeper than the map suggested — nothing dramatic, just a bit more effort.", "section": "A · Choose the correct option.", "options": ["absolutely", "slightly", "totally"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The final challenge turned out to be ___ (very high degree) difficult, far harder than anyone expected.", "section": "B · Complete with the correct modifier.", "reveal": "extremely", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I found the ending ___ (100%) astonishing — I still can't believe it happened.", "section": "B · Complete with the correct modifier.", "reveal": "absolutely", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The interview was ___ (moderate degree) interesting, though not the most exciting part of the documentary.", "section": "B · Complete with the correct modifier.", "reveal": "fairly", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The rescue mission was extremely impossible to complete in one day.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The rescue mission was absolutely impossible to complete in one day.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Her progress was slightly noticeable after just one week of practice.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The whole audience agreed the performance was absolutely brilliant.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Was the climb ___ (very) exhausting?", "section": "Dialogue · Complete with the correct modifier.", "reveal": "extremely", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Honestly, it was ___ (100%) unbearable near the top, but only ___ (a little) hard at the start.", "section": "Dialogue · Complete with the correct modifier.", "reveal": "absolutely / slightly", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "found / absolutely / the / everyone / astonishing / story", "section": "Dialogue · Reorder the sentence.", "words": ["everyone", "found", "the", "story", "absolutely", "astonishing"], "end": ".", "reveal": "Everyone found the story absolutely astonishing.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Shepherd Who Read the Sky", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think 'read the sky' might mean?", "Do you know any true stories about someone who taught themselves a skill?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Shepherd Who Read the Sky", "num": 1, "total": 3, "text": "By the age of twelve, Yusuf could already name every visible star from his family's hillside in eastern Anatolia. There was no telescope, no astronomy club, and, at first, barely any books — just long nights spent watching the sky while his family's sheep grazed nearby. What began as a way to pass the time slowly turned into something far more serious.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Shepherd Who Read the Sky", "num": 2, "total": 3, "text": "At sixteen, Yusuf was able to build his first basic telescope from spare lenses he found at a market by chance. It was fairly crude, and villagers were slightly amused by the strange contraption pointed at the night sky. Yet within two years, he had taught himself enough physics and mathematics, entirely self-taught from borrowed textbooks, to win a national science competition — a result that surprised everyone except, quietly, Yusuf himself.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Shepherd Who Read the Sky", "num": 3, "total": 3, "text": "Today, Yusuf works at an observatory, and he says he still isn't fully used to being called a scientist. 'At a glance, my story might sound like pure luck,' he explains, 'but really it was years of determination that nobody saw.' His journey shows that a breakthrough can begin anywhere — even on a quiet hillside, under a sky full of ordinary stars.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Yusuf became a scientist purely by luck.", "Persistent self-teaching turned a shepherd's hobby into a scientific achievement.", "Telescopes are only useful in villages."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Yusuf found the spare lenses for his first telescope ___.", "section": "While you read", "reveal": "by chance", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "How did Yusuf learn the physics and mathematics he needed?", "section": "While you read", "options": ["At a private science academy", "Entirely self-taught, from borrowed textbooks", "From a family member who was a scientist"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, Yusuf now feels completely comfortable being called a scientist.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, Yusuf says he still isn't fully used to being called a scientist.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Yusuf believes his story was really about years of ___ that nobody saw, not just luck.", "section": "While you read", "reveal": "determination", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["What degree modifiers can you find in the text? What do they tell you about how the villagers or Yusuf felt?", "Do you think persistence matters more than natural talent? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Letter That Found Its Way Home", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think 'the letter that found its way home' might refer to?", "Have you ever heard of a friendship that began completely by accident?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Letter That Found Its Way Home", "num": 1, "total": 3, "text": "In 1987, a woman named Sibel wrote a letter to a pen pal whose address she had copied down slightly incorrectly. The letter should have been lost forever. Instead, by an extraordinary coincidence, it was delivered to a stranger living at almost the exact same street number in a different city — and that stranger, fascinated rather than annoyed, decided to write back.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter That Found Its Way Home", "num": 2, "total": 3, "text": "What followed was an absolutely remarkable, decades-long friendship built entirely on letters, and later, emails. The two women were never able to meet in person for over thirty years; work, distance and, at times, simply bad timing kept getting in the way. Then, in the end, a chance business trip finally brought them to the same city at the same time.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter That Found Its Way Home", "num": 3, "total": 3, "text": "'At a glance, it seems like an ordinary mistake with an unlikely result,' Sibel says now. 'But by the time we finally met, we were used to knowing everything about each other's lives — we just hadn't seen each other's faces yet.' Their story has since been shared thousands of times online, proving that even a small accident can, by chance, turn into something extraordinary.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "How did Sibel's friendship with the stranger begin?", "section": "While you read", "options": ["They met at work.", "A letter was delivered to the wrong address by mistake.", "They were introduced by a mutual friend."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Sibel had copied down the pen pal's address ___.", "section": "While you read", "reveal": "slightly incorrectly", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, the two women met in person within the first year.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, they were not able to meet in person for over thirty years.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "By the time they finally met, how did the two women feel about each other's lives?", "section": "While you read", "options": ["They knew almost nothing about each other.", "They were used to knowing everything about each other's lives.", "They had completely lost touch."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The text says a small accident can, by chance, turn into something ___.", "section": "While you read", "reveal": "extraordinary", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Find two discourse markers (like 'in the end') in the text. What do they signal to the reader?", "Do you think stories like this are becoming more or less common because of the internet? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "The Marathon at Sixty", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what challenges might a sixty-year-old face when preparing for a marathon?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "The -sharing website, telling a short amazing true story (real or realistic) and persuading readers it's worth reading. Describe what happened and explain why it's so remarkable.", "steps": [], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "As a child, Elif ___ already play the violin without any lessons.", "section": "Exit ticket", "options": ["could", "was able to", "is used to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Despite the heavy rain, the rescue team ___ reach the missing hikers before dark.", "section": "Exit ticket", "options": ["could", "was able to", "used to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "It took him months to ___ (get used to) living in such a small flat.", "section": "Exit ticket", "reveal": "get used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After years at sea, she ___ (be used to) sleeping through the noise of the waves.", "section": "Exit ticket", "reveal": "was used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye s cidentally' means ___ ___.", "section": "Exit ticket", "reveal": "by chance", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order.", "section": "Exit ticket", "words": ["against", "the", "odds,", "she", "was", "able", "to", "finish", "the", "race"], "end": ".", "reveal": "Against the odds, she was able to finish the race.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "judge", "q": "He still isn't used to work such long hours.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He still isn't used to working such long hours.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using the correct structure.", "section": "Exit ticket", "reveal": "She was self-taught, and as a child she could already swim well.", "prompt": "She learned to swim by herself as a child. (self-taught / could)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The interview was ___ (moderate degree) interesting, but not the best part of the show.", "section": "Exit ticket", "reveal": "fairly", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
