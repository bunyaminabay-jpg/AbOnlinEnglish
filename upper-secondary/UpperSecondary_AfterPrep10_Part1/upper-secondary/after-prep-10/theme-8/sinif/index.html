"reveal": "Whoever", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Whoever is he, he shouldn't ask for your bank PIN.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Whoever he is, he shouldn't ask for your bank PIN.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "No matter what happens, always report suspicious messages to an adult or the authorities.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "You can use whatever device do you want to check your accounts safely.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You can use whatever device you want to check your accounts safely.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ (no matter who) contacts you, never share your one-time password by phone.", "section": "Dialogue · Complete with a free-choice expression.", "reveal": "No matter who", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Good advice — I'll report it to ___ (whichever) service sent the message.", "section": "Dialogue · Complete with a free-choice expression.", "reveal": "whichever", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "matter / what / says / no / he / don't / reply", "section": "Dialogue · Reorder the sentence.", "words": ["no", "matter", "what", "he", "says,", "don't", "reply"], "end": ".", "reveal": "No matter what he says, don't reply.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Expressions of Disapproval: Should(n't) Have, Ought to Have, It's Wrong To, I Don't Approve Of", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The company <mark>shouldn't have<\/mark> ignored so many warnings before the data breach happened.", "He <mark>ought to have<\/mark> reported the scam the moment he noticed it, not a week later.", "<mark>It's wrong to<\/mark> read someone else's private messages without their permission.", "<mark>I don't approve of<\/mark> people who share other students' photos online without asking first."], "ask": "Which expressions criticise a past action that already happened, and which express disapproval of behaviour in general?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a mistake in the past that can't be changed now", "in general, at any time", "a more formal alternative to shouldn't have"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Should have / shouldn't have + past participle criticises ___.", "section": "Complete the rule", "reveal": "a mistake in the past that can't be changed now", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Ought to have + past participle is ___.", "section": "Complete the rule", "reveal": "a more formal alternative to shouldn't have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It's wrong to / I don't approve of + verb criticise behaviour ___.", "section": "Complete the rule", "reveal": "in general, at any time", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Should have / shouldn't have + past participle criticises a past mistake that can't be undone. Ought to have + past participle is a more formal alternative with the same meaning. It's wrong to + verb and I don't approve of + verb-ing express general disapproval of behaviour.", "tr": "Should have / shouldn't have + V3 (geçmiş zaman ortacı), geçmişte yapılan ya da yapılmayan bir hatayı eleştirmek için kullanılır ve artık değiştirilemez. Ought to have + V3, 'shouldn't have' ile aynı anlamda ama daha resmi bir alternatiftir. It's wrong to + fiil ve I don't approve of + fiil-ing ise genel olarak bir davranışı onaylamadığımızı belirtmek için kullanılır.", "when_en": "Use should(n't) have / ought to have to criticise a specific past mistake; use it's wrong to / I don't approve of to criticise unethical behaviour in general — especially when discussing cybercrime and online ethics.", "when": "Geçmişte olan bir hatayı eleştirirken should(n't) have / ought to have; genel olarak etik olmayan bir davranışı eleştirirken it's wrong to / I don't approve of kullanırız — özellikle siber suç ve çevrimiçi etik konularında.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the school", "shouldn't have / ignore", "the cyberbullying reports"], "reveal": "The school shouldn't have ignored the cyberbullying reports.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the bank", "ought to have / warn", "customers about the phishing emails"], "reveal": "The bank ought to have warned customers about the phishing emails.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["it's wrong to / share", "someone's private photos without permission"], "reveal": "It's wrong to share someone's private photos without permission.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / don't approve of / people who / spread", "fake news online"], "reveal": "I don't approve of people who spread fake news online.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "shouldn't have / click", "on that suspicious link"], "reveal": "They shouldn't have clicked on that suspicious link.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / he / ought to have / report", "the hacker to the police"], "reveal": "Ought he to have reported the hacker to the police?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences disapproving of unethical online behaviour, using should(n't) have, ought to have, it's wrong to, and I don't approve of.", "chips": ["He shouldn't have…", "They ought to have…", "It's wrong to…", "I don't approve of…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["He should have changed his password sooner.", "It's wrong to hack into someone's account, even as a joke."], "negative": ["She shouldn't have opened that attachment.", "I don't approve of people who spy on their friends' accounts."], "question": ["Should the company have informed its customers earlier?", "Ought they to have reported the fraud immediately?"], "short": ["Yes, they should have. / No, they shouldn't have.", "Yes, they ought to. / No, they oughtn't to."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He should have go to the police.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He should have gone to the police.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "It's wrong to shared private information.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It's wrong to share private information.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I don't approve to people who bully others online.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I don't approve of people who bully others online.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "She ___ her card details with that website — it turned out to be a scam.", "section": "A · Choose the correct option.", "options": ["shouldn't have shared", "don't approve of sharing", "is wrong to share"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ read your classmate's private messages without asking.", "section": "A · Choose the correct option.", "options": ["It's wrong to", "You shouldn't approve", "Ought you"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I really ___ people who post other people's photos without permission.", "section": "A · Choose the correct option.", "options": ["don't approve of", "shouldn't have approved", "wrong to approve"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The company ___ (ought to / warn) users sooner about the data breach.", "section": "B · Complete with the correct form.", "reveal": "ought to have warned", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It's wrong ___ (to / read) someone's emails without permission.", "section": "B · Complete with the correct form.", "reveal": "to read", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He ___ (shouldn't / click) on that link — now his account is hacked.", "section": "B · Complete with the correct form.", "reveal": "shouldn't have clicked", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "He should have reported the hacker sooner.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "It's wrong to sharing someone's private photos.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It's wrong to share someone's private photos.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I don't approve to cyberbullying in any form.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I don't approve of cyberbullying in any form.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Did you hear? Someone ___ (shouldn't / open) that email — now the whole office computer is infected.", "section": "Dialogue · Complete with the correct form.", "reveal": "shouldn't have opened", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I agree. ___ (it's wrong to) open attachments from unknown senders.", "section": "Dialogue · Complete with the correct form.", "reveal": "It's wrong to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "of / cyberbullying / don't / any / form / I / in / approve", "section": "Dialogue · Reorder the sentence.", "words": ["I", "don't", "approve", "of", "cyberbullying", "in", "any", "form"], "end": ".", "reveal": "I don't approve of cyberbullying in any form.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Bandits Without Borders", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think the title 'Bandits Without Borders' might mean?", "Have you or someone you know ever received a suspicious message online? What happened?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Bandits Without Borders", "num": 1, "total": 3, "text": "A century ago, a bandit needed a horse, a weapon and a lonely mountain road. Today's most successful criminals need none of these things — only a laptop, a stable internet connection and a convincing lie. Cybercrime has turned the whole planet into a kind of open territory, where a thief in one country can empty a stranger's bank account on the other side of the world without ever leaving their chair. Because these crimes cross borders so easily, catching the people responsible is far harder than catching a bandit on a single road.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Bandits Without Borders", "num": 2, "total": 3, "text": "Many cybercriminals don't break into computers at all — they trick people into opening the door themselves. This is known as phishing: sending a message that looks like it comes from a bank, a delivery company or even a friend, designed to make the reader click a link or hand over a password. The most dangerous scams don't rely on clever code; they rely on urgency and fear, pushing victims to act before they stop to think.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Bandits Without Borders", "num": 3, "total": 3, "text": "Fighting back doesn't always require expensive software. Simple habits — using a different password for every account, thinking twice before clicking an unexpected link, and turning on two-factor authentication — stop the vast majority of attacks before they start. Cyberspace may feel like bandit territory, but every careful user makes it a little less lawless.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Cybercriminals always use highly advanced computer code.", "Modern cybercrime crosses borders easily and often relies on tricking people rather than complex hacking.", "Phishing emails are impossible to prevent."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Tricking someone into clicking a link or giving away a password by pretending to be a trusted sender is called ___.", "section": "While you read", "reveal": "phishing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what do the most dangerous scams rely on?", "section": "While you read", "options": ["expensive software", "urgency and fear", "weapons"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, cybercrime is harder to stop than traditional crime partly because it crosses borders so easily.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The text suggests that using a different password for every account and turning on ___ can prevent most attacks.", "section": "While you read", "reveal": "two-factor authentication", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which safety habit from the text do you already follow? Which one will you start?", "Why do you think cybercriminals often target people's emotions rather than their computers?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Justice in the Digital Age", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think 'poetic justice' means? Can you think of an example from a film or story?", "Do you think online crimes are punished as seriously as offline crimes? Why or why not?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Justice in the Digital Age", "num": 1, "total": 3, "text": "When a burglar breaks a window, the evidence is easy to see. When a hacker breaks into an account, the evidence is a string of invisible code, and that makes justice much harder to deliver. Courts around the world are now training specialist judges and detectives simply to keep up with crimes that didn't exist twenty years ago, from ransomware attacks on hospitals to the theft of millions of people's personal data in a single breach.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Justice in the Digital Age", "num": 2, "total": 3, "text": "Poetic justice — the idea that wrongdoers eventually get the punishment they deserve, often in a fitting or ironic way — has always fascinated storytellers. In the digital world, this sometimes happens by accident: a scammer's own device gets infected by the same malware they used on others, or a hacker is caught because they bragged about the crime online. Real justice, however, rarely arrives so neatly; most cybercriminals are never identified at all.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Justice in the Digital Age", "num": 3, "total": 3, "text": "That's why fairness in the digital age depends on more than punishment after the fact. Companies are expected to protect the data they collect, whistleblowers who expose wrongdoing deserve legal protection rather than punishment, and ordinary users need clear, simple laws they can actually understand. A just digital world isn't only about catching criminals — it's about building a system where trust is earned and protected in the first place.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Digital crime is always punished quickly and fairly.", "Delivering justice for digital crime is difficult, and fairness requires more than just catching criminals.", "Poetic justice always happens to cybercriminals."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The idea that wrongdoers eventually get a fitting or ironic punishment is called ___.", "section": "While you read", "reveal": "poetic justice", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, why is delivering justice for hacking often harder than for burglary?", "section": "While you read", "options": ["Hacking evidence is invisible code, unlike a broken window.", "Hacking is not actually against the law.", "Judges refuse to study new types of crime."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, most cybercriminals are eventually identified and punished.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, most cybercriminals are never identified at all.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The text says people who expose wrongdoing, known as ___, deserve legal protection.", "section": "While you read", "reveal": "whistleblowers", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Why might 'poetic justice' happen more often in stories than in real life?", "What responsibility do you think companies have to protect the data they collect from us?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "The Suspicious Email", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what kind of email do you think made Ece worried?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "The Suspicious Email", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What did the suspicious email claim?", "section": "While you listen", "options": ["That Ece won a prize", "That Ece's bank account was locked", "That Ece's phone was hacked"], "answer": 1, "note": "Give 1 rong to) and free-choice expressions (whoever, whatever, no matter what) where natural.", "steps": [], "chips": [], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Presenting an Online Safety Rule", "text": "Prepare a two-minute talk about one type of cybercrime (such as phishing, ransomware or cyberbullying) and one online-safety rule connected to it. Explain what the crime involves, why it matters, and what people should or shouldn't do to stay safe.", "steps": [], "chips": [], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Cybercrime Awareness Article", "text": "Write a short magazine article warning teenage readers about one type of cybercrime (phishing, cyberbullying, identity theft, etc.). Start with a clear topic sentence, add at least three supporting sentences with details and examples, and finish with a concluding sentence giving advice.", "steps": [], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Fair Verdict", "text": "Write a short opinion paragraph giving your view on how society should treat cybercriminals. Should punishments for cybercrime be as serious as for 'real-world' crime? Support your opinion with at least two reasons.", "steps": [], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "After clicking the link, she realised too late that it was a ___.", "section": "Exit ticket", "options": ["phishing scam", "password manager", "whistleblower"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ sent this message is hoping you'll panic and click without thinking.", "section": "Exit ticket", "options": ["Whoever", "Whatever", "Whichever"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You can use ___ (whichever) antivirus program you trust, as long as you keep it updated.", "section": "Exit ticket", "reveal": "whichever", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He ___ (shouldn't / share) his password with a stranger online.", "section": "Exit ticket", "reveal": "shouldn't have shared", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly expresses general disapproval?", "section": "Exit ticket", "options": ["It's wrong to hack into someone's account.", "It's wrong hacking into someone's account.", "It's wrong to hacked into someone's account."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "No matter what does a scammer say, never share your one-time password.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "No matter what a scammer says, never share your one-time password.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The company ___ (ought to / warn) customers sooner about the data breach.", "section": "Exit ticket", "reveal": "ought to have warned", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "A message pretending to be from your bank, designed to steal your password, is called ___.", "section": "Exit ticket", "options": ["a firewall", "phishing", "encryption"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Someone who exposes wrongdoing inside an organisation is called a ___.", "section": "Exit ticket", "reveal": "whistleblower", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order.", "section": "Exit ticket", "words": ["no", "matter", "what", "he", "promises,", "don't", "send", "him", "any", "money"], "end": ".", "reveal": "No matter what he promises, don't send him any money.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "judge", "q": "He should have report the scam immediately.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He should have reported the scam immediately.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using a free-choice expression.", "section": "Exit ticket", "reveal": "You can use whichever password manager you choose — just use one.", "prompt": "It doesn't matter which password manager you choose — just use one. (whichever)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It can take a long time for the police to identify ___ (whoever) is behind a large-scale data breach.", "section": "Exit ticket", "reveal": "whoever", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
