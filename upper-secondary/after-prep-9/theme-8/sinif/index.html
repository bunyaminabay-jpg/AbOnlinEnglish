 sorun."}, {"type": "rule", "title": "The rule", "en": "Wish + Simple Past describes a present situation we want to be different. Wish + Past Perfect describes a past situation we regret. Wish + could + base verb expresses a present wish for ability or possibility.", "tr": "Wish + Simple Past, şimdiki zamanda farklı olmasını istediğimiz bir durumu anlatır. Wish + Past Perfect, geçmişte pişmanlık duyduğumuz bir durumu anlatır. Wish + could + fiil, şu anki bir yetenek ya da imkan isteğini anlatır.", "when_en": "We use wish clauses when we are unhappy with a present situation, or when we regret something we did or didn't do in the past.", "when": "Şu anki durumdan memnun olmadığımızda ya da geçmişte farklı bir şey yapmış olmayı dilediğimizde wish cümlelerini kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we", "not have / cleaner energy (now)"], "reveal": "I wish we had cleaner energy.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["scientists", "not know / more about distant galaxies (now)"], "reveal": "Scientists wish they knew more about distant galaxies.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["humanity", "not discover / a habitable planet (years ago)"], "reveal": "I wish humanity had discovered a habitable planet years ago.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "not can travel / to space (now / ability)"], "reveal": "She wishes she could travel to space.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not start / protecting the environment earlier (in the past)"], "reveal": "I wish we had started protecting the environment earlier.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three wish sentences: one about the present (something you want to be different now), one about the past (something you regret), and one using 'wish...could'.", "chips": ["I wish...", "I wish I had/hadn't...", "I wish I could..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I wish we had cleaner energy.", "I wish humanity had discovered a habitable planet."], "negative": ["I wish we didn't waste so much water.", "She wishes she hadn't ignored the warnings."], "question": ["What do you wish scientists knew?", "Do you wish you could travel to space?"], "short": ["I wish I could. / I don't really wish that.", "Yes, I do. / No, not really."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I wish we have cleaner energy.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I wish we had cleaner energy.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I wish humanity discovered a planet years ago.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I wish humanity had discovered a planet years ago.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I wish scientists ___ more about distant galaxies right now.", "section": "A · Choose the correct option.", "options": ["know", "knew", "had known"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I wish we ___ started protecting the environment earlier.", "section": "A · Choose the correct option.", "options": ["have", "had", "would"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She wishes she ___ travel to space one day.", "section": "A · Choose the correct option.", "options": ["can", "could", "will"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I wish we ___ (have) cleaner air in our cities.", "section": "B · Complete with the correct form.", "reveal": "had", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I wish humanity ___ (discover) a habitable planet years ago.", "section": "B · Complete with the correct form.", "reveal": "had discovered", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I wish I could see the stars more clearly from the city.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I wish scientists will find a solution soon.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I wish scientists would find a solution soon.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Do you ever wish you ___ (be) an astronaut?\nB: Yes! I wish I ___ (start) studying physics earlier.", "section": "Dialogue · Complete with the correct form.", "reveal": "were / had started", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "wish / cleaner / had / I / we / energy", "section": "Dialogue · Reorder the sentence.", "words": ["I", "wish", "we", "had", "cleaner", "energy"], "end": ".", "reveal": "I wish we had cleaner energy.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Hunt for a Second Earth", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think 'a second Earth' means?", "What do you already know about how scientists search for planets outside our solar system?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Hunt for a Second Earth", "num": 1, "total": 3, "text": "For centuries, humans have looked up at the night sky and wondered whether we are alone in the universe. Today, that question is closer to being answered than ever before. Using powerful space telescopes, astronomers have identified thousands of exoplanets — planets that orbit stars outside our solar system — and a growing number of them lie in what scientists call the 'habitable zone', the narrow distance from a star where temperatures allow liquid water to exist.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Hunt for a Second Earth", "num": 2, "total": 3, "text": "Finding an exoplanet is only the first step. To know whether a planet could actually support life, researchers study its atmosphere, its size, and the type of star it orbits. If a planet is too close to its star, it will be far too hot; if it is too far away, any water on its surface will freeze. Even a planet in the habitable zone might lack a protective atmosphere, leaving it exposed to deadly radiation. Because of these strict conditions, scientists estimate that only a small fraction of the exoplanets discovered so far could realistically host life.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Hunt for a Second Earth", "num": 3, "total": 3, "text": "Even so, the search continues, and new missions are launched almost every year. Some researchers believe that if we keep improving our telescopes and analysis methods, we will find strong evidence of a genuinely habitable world within the next few decades. Others are more cautious, arguing that space is so vast that finding the right planet — let alone actual life on it — could still take much longer. Either way, the hunt for a second Earth has changed the way many people think about humanity's place in the universe.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Scientists have already found a second Earth.", "Astronomers are searching for exoplanets that could support life, but the conditions are very strict.", "Space telescopes are too weak to find any exoplanets."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The 'habitable zone' is the distance from a star where ___ can exist.", "section": "While you read", "reveal": "liquid water", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, a planet too close to its star will be:", "section": "While you read", "options": ["too cold", "too hot", "too small"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "All exoplanets found in the habitable zone are known to support life.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Only a small fraction of exoplanets discovered so far could realistically host life.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A planet without a protective atmosphere is exposed to deadly ___.", "section": "While you read", "reveal": "radiation", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think humanity will find clear evidence of a habitable exoplanet in your lifetime? Why or why not?", "Write one sentence using the first conditional about what might happen if scientists find a truly habitable planet."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Life in 2126: Three Predictions", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you imagine daily life will be like in 100 years?", "Which area do you think will change the most: energy, technology, or space exploration?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Life in 2126: Three Predictions", "num": 1, "total": 3, "text": "What will daily life look like a century from now? No one can predict the future with certainty, but many scientists, engineers and futurists agree on a few likely directions, based on trends that are already visible today.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life in 2126: Three Predictions", "num": 2, "total": 3, "text": "The first prediction concerns energy and the environment. If humanity continues to rely on fossil fuels, the climate crisis will almost certainly get worse, with more extreme weather and rising sea levels. Many experts believe, however, that renewable energy will become the main power source worldwide well before 2126, driven by both necessity and rapidly falling costs. Cities may be redesigned to be almost completely self-sufficient, generating their own energy and recycling nearly all their waste.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life in 2126: Three Predictions", "num": 3, "total": 3, "text": "The second prediction involves artificial intelligence and automation. Machines already perform many tasks once done only by humans, from analysing medical scans to writing simple reports. If this trend continues, entire industries could look completely different, and people may spend far more time on creative, social or scientific work rather than routine tasks. Finally, many researchers expect real progress in space technology: permanent research bases on the Moon, regular cargo flights to Mars, and perhaps even the first small human settlements beyond Earth. Whether these predictions come true exactly as described, one thing seems certain — the next century will bring changes as dramatic as anything in the last hundred years.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A history of space exploration", "Predictions about energy, technology and space in the next century", "A list of countries with the best universities"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Many experts believe ___ will become the main power source worldwide before 2126.", "section": "While you read", "reveal": "renewable energy", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, artificial intelligence has had no effect on jobs so far.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Machines already perform many tasks once done only by humans.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the text suggest about future cities?", "section": "While you read", "options": ["They may become almost completely self-sufficient.", "They will stop using any energy at all.", "They will be abandoned in favour of space colonies."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Researchers expect permanent research bases on the ___ and regular cargo flights to Mars.", "section": "While you read", "reveal": "Moon", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which of the three predictions in the text do you find most exciting or most worrying? Why?", "Write one sentence with 'I wish' about something you would like to be different in today's world."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Podcast About Habitable Planets", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what three things do you think the podcast host
