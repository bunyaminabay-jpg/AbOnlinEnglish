": "does / do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: We ___ (have) a flag ceremony every year, but this year we ___ also ___ (prepare) a short play.", "section": "Dialogue · Complete with Simple Present or Present Progressive.", "reveal": "have / are also preparing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "does / your school / national days / celebrate / how", "section": "Dialogue · Reorder the question.", "words": ["how", "does", "your", "school", "celebrate", "national", "days"], "end": "?", "reveal": "How does your school celebrate national days?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Polite Requests and Offers: may / might / can / could / shall", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>Could<\/mark> you tell me the school's start time, please?", "<mark>May<\/mark> I ask a question about the exchange programme?", "<mark>Shall<\/mark> I read the announcement to the class?", "<mark>Can<\/mark> you explain the new timetable to me?"], "ask": "Which modal verbs make a request sound very polite/formal, and which one offers to do something for someone?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["offer to do something", "may / cou ere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Question Tags (Simple Present & Present Progressive)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Your school starts at nine, <mark>doesn't it<\/mark>?", "You aren't in the exchange programme, <mark>are you<\/mark>?", "She teaches Geography, <mark>doesn't she<\/mark>?", "We're preparing for the ceremony, <mark>aren't we<\/mark>?"], "ask": "When the main sentence is positive, is the tag positive or negative? What happens after a negative sentence?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["negative", "positive", "same auxiliary/be verb"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "A positive sentence takes a ___ tag.", "section": "Complete the rule", "reveal": "negative", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A negative sentence takes a ___ tag.", "section": "Complete the rule", "reveal": "positive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The tag uses the ___ as the main sentence (does/doesn't, is/isn't…).", "section": "Complete the rule", "reveal": "same auxiliary/be verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A question tag confirms information: a positive statement takes a negative tag, and a negative statement takes a positive tag. The tag repeats the auxiliary or 'be' verb from the main sentence.", "tr": "Question tag, olumlu cümleye olumsuz, olumsuz cümleye olumlu bir 'kısa soru' eklenerek teyit istemek için kullanılır. Yardımcı fiil ya da be fiili ana cümledekiyle aynı olur.", "when_en": "We use question tags to check information or to keep a conversation going.", "when": "Bir bilgiyi teyit etmek ya da sohbeti sürdürmek istediğimizde question tag kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Your school has an assembly every Monday, ___?"], "reveal": "Your school has an assembly every Monday, doesn't it?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["She doesn't like exams, ___?"], "reveal": "She doesn't like exams, does she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["They are organising the ceremony, ___?"], "reveal": "They are organising the ceremony, aren't they?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["You don't wear a uniform at your school, ___?"], "reveal": "You don't wear a uniform at your school, do you?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, n."}, {"type": "question", "qtype": "gap", "q": "The students are preparing a project, ___?", "section": "B · Complete with the correct tag.", "reveal": "aren't they", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He doesn't enjoy assemblies, ___?", "section": "B · Complete with the correct tag.", "reveal": "does he", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "We're having a celebration today, isn't it?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We're having a celebration today, aren't we?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Your school celebrates Teachers' Day every year, ___?", "section": "Dialogue · Add the tag.", "reveal": "doesn't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Articles and Quantifiers", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Our school has <mark>a<\/mark> big library and <mark>an<\/mark> outdoor sports hall.", "<mark>Some<\/mark> schools give homework every day; <mark>few<\/mark> schools give none at all.", "There isn't <mark>much<\/mark> information about the exchange programme on the website yet.", "<mark>Many<\/mark> students take part in <mark>the<\/mark> annual sports day."], "ask": "When do we use 'a' and when do we use 'an'? Which quantifiers go with countable nouns, and which with uncountable nouns?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a vowel sound", "countable", "uncountable", "the"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use 'an' before a word that starts with ___.", "section": "Complete the rule", "reveal": "a vowel sound", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Many' and 'few' are used with ___ nouns (students, schools).", "section": "Complete the rule", "reveal": "countable", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Much' and 'little' are used with ___ nouns (information, homework).", "section": "Complete the rule", "reveal": "uncountable", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use ___ for something specific that both speakers know about.", "section": "Complete the rule", "reveal": "the", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'A' comes before a consonant sound, 'an' before a vowel sound. 'The' is used for something specific/known. Many/few go with countable nouns, much/little with uncountable nouns; some/a lot of work with both.", "tr": "'A' sessiz harfle, 'an' ise sesli harf sesiyle başlayan kelimelerden önce kullanılır. 'The' belirli/bilinen bir şey için kullanılır. Sayılabilir isimlerle many/few, sayılamayan isimlerle much/little; her ikisiyle de some/a lot of kullanılabilir.", "when_en": "We need the correct articles and quantifiers when we describe a school's facilities, rules and statistics.", "when": "Okulun imkanlarını, kurallarını ve istatistiklerini anlatırken doğru miktar belirteçlerini ve tanımlıkları kullanmamız gerekir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Our school has ___ excellent music room."], "reveal": "Our school has an excellent music room.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["___ students choose the vocational track after Grade 9."], "reveal": "Many students choose the vocational track after Grade 9.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["There is ___ information about school rules in the handbook."], "reveal": "There is some information about school rules in the handbook.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["We don't have ___ time before ___ assembly starts."], "reveal": "We don't have much time before the assembly starts.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Only ___ schools in our city have a full-size swimming pool."], "reveal": "Only a few schools in our city have a full-size swimming pool.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Describe your school's facilities using a/an/the and at least two quantifiers (some, many, much, few, a lot of).", "chips": ["Our school has a/an…", "There are many/few…", "We don't have much…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Our school has a large library.", "Many students join a club."], "negative": ["We don't have much free time.", "Few schools offer this subject."], "question": ["How much homework do you get?", "How many clubs does your school have?"], "short": ["A lot. / Not much.", "Many. / Only a few."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We have much clubs at school.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We have many clubs at school.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She goes to a university near here.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She goes to the university near here. / She goes to a university near here.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Our school has ___ excellent science lab.", "section": "A · Choose the correct option.", "options": ["a", "an", "the"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How ___ students are there in your class?", "section": "A · Choose the correct option.", "options": ["much", "many", "little"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "There isn't ___ information about the trip yet.", "section": "A · Choose the correct option.", "options": ["many", "much", "few"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ head teacher of our school gave ___ inspiring speech.", "section": "B · Complete with a/an/the.", "reveal": "The / an", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Few schools in our region offer this vocational course.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We don't have many time for extracurricular activities.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We don't have much time for extracurricular activities.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Our school is ___ old building with ___ large courtyard. ___ students walk to school, but not ___.", "section": "Text · Complete with a/an/the/some/many/much.", "reveal": "an / a / Many / many", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Two Very Different School Days", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What two schools do you think this text compares?", "What do you already know about school systems outside Türkiye?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Two Very Different School Days", "num": 1, "total": 3, "text": "In Helsinki, sixteen-year-old Aino's school day starts at 9 a.m. and finishes by 2 p.m. There are shorter lessons, more breaks, and almost no homework — but students are expected to manage their own study time responsibly. Teachers know their students well because class groups often stay together for years, and assessment relies more on projects and discussion than on final exams.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Two Very Different School Days", "num": 2, "total": 3, "text": "Halfway around the world, in Singapore, Wei-Lin's school day begins earlier and runs later, often followed by extra classes or club activities until early evening. The curriculum is demanding, and national exams play a major role in deciding which secondary school — and later, which university — a student can attend. Parents and teachers place a strong emphasis on discipline, hard work, and academic results.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Two Very Different School Days", "num": 3, "total": 3, "text": "Despite these differences, both systems share a clear goal: helping young people build the knowledge and skills they need for adult life. Finland focuses on independence, well-being, and creativity; Singapore focuses on rigour, structure, and achievement. Educators around the world often study both systems, borrowing ideas from each to design programmes that suit their own students best.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Finland's system is better than Singapore's.", "Finland and Singapore have very different school systems with the same overall goal.", "Both countries have exactly the same school day."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In Singapore, ___ often play a major role in deciding which school a student can attend.", "section": "While you read", "reveal": "national exams", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, Finnish schools focus more on:", "section": "While you read", "options": ["discipline and exam results", "independence, well-being and creativity", "longer school days"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Aino's school day is longer than Wei-Lin's.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Wei-Lin's school day is longer than Aino's.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Class groups in Finland often stay together for ___, which helps teachers know their students well.", "section": "While you read", "reveal": "years", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which system would you rather study in — Finland's or Singapore's? Why?", "Write one sentence comparing your own school day to Aino's or Wei-Lin's."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Guide to Our School Traditions", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What traditions or events does your own school have?", "Do you think school traditions are important? Why or why not?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Guide to Our School Traditions", "num": 1, "total": 3, "text": "Every school develops its own traditions over time, and ours is no different. Each September, new students take part in a Welcome Festival, where older students act as guides for a day, introducing them to the building, the clubs, and a few unwritten rules of school life. It's a simple event, but it helps everyone feel like part of the community from day one.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Guide to Our School Traditions", "num": 2, "total": 3, "text": "In October, the whole school gathers for the Republic Day assembly, where students present short readings, songs, and a display about national history. Preparation begins weeks in advance, with different classes responsible for different parts of the programme — a good chance to practise teamwork as well as public speaking.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Guide to Our School Traditions", "num": 3, "total": 3, "text": "Perhaps the most popular tradition is the end-of-year Talent Show, when students can perform music, dance, comedy, or short plays in front of the whole school. Anyone can take part, and the atmosphere is always supportive rather than competitive. For many students, it's their favourite memory of the whole school year, and a reminder that school is about more than lessons and exams.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the purpose of the Welcome Festival?", "section": "While you read", "options": ["To test new students' English", "To help new students feel part of the school community", "To choose the best students"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The Republic Day assembly includes short readings, songs, and a display about ___.", "section": "While you read", "reveal": "national history", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The Talent Show is a competition with prizes for the winners.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The Talent Show is supportive rather than competitive, with no mention of prizes.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does the writer say the Talent Show is many students' favourite memory?", "section": "While you read", "options": ["Because it's the easiest event", "Because it shows school is more than lessons and exams", "Because it happens every month"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Does your own school have a tradition similar to the Talent Show? Describe it.", "Do you think every school should have a Welcome Festival for new students? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Comparing Schools — A Video Call", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what three things do you think Elif and Marta will compare?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Comparing Schools — A Video Call", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What time does Marta's school start?", "section": "While you listen", "options": ["8:00", "8:15", "9:00"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Marta's school requires a uniform.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Marta's school does not require a uniform.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Elif offers to send Marta some ___ from last year's assembly.", "section": "While you listen", "reveal": "photos", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "In the question 'Do you wear a school uniform?', the intonation typically:", "section": "While you listen", "options": ["rises at the end", "falls at the end", "stays flat"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "School Traditions Around the World — A Short Talk", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What tradition would you choose to research if you did this project?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "School Traditions Around the World — A Short Talk", "audio": null, "transcript": [], "note": "Play twice: first for g
