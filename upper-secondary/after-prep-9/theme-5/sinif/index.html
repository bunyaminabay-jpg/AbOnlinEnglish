s up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I'm sure the city is going to become greener one day, though nothing is planned yet.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I'm sure the city will become greener one day, though nothing is planned yet.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ the city ___ (do) about traffic congestion?", "section": "Dialogue · Complete with will or be going to.", "reveal": "is / going to do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: They ___ already ___ (build) a new tram line, and I ___ (guess) it ___ (reduce) congestion a lot.", "section": "Dialogue · Complete with will or be going to.", "reveal": "are already going to build / will guess it will reduce", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "a new / build / going / bridge / the council / to / is", "section": "Dialogue · Reorder the sentence.", "words": ["the", "council", "is", "going", "to", "build", "a", "new", "bridge"], "end": ".", "reveal": "The council is going to build a new bridge.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Connecting Words: Cause and Effect", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Traffic congestion increased sharply, <mark>so<\/mark> the council introduced a new bus lane.", "The city built more cycle paths <mark>so that<\/mark> fewer people would need to drive to work.", "House prices rose quickly <mark>because of<\/mark> the new metro line nearby.", "<mark>As a result of<\/mark> the housing shortage, many young families have moved to the suburbs."], "ask": "Which connectors are followed directly by a clause (subject + verb), and which are followed by a noun phrase? What is the difference in meaning between 'so' and 'so that'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["so + clause (result)", "so that + clause (purpose)", "because of / due to + noun", "as a result (of) + noun / , as a result + clause"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "To show a simple result of something, we use ___.", "section": "Complete the rule", "reveal": "so + clause (result)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "To show the purpose or reason behind an action, we use ___.", "section": "Complete the rule", "reveal": "so that + clause (purpose)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "To connect a cause directly to a noun phrase, we use ___.", "section": "Complete the rule", "reveal": "because of / due to + noun", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "To introduce a formal consequence, often at the start of a new sentence, we use ___.", "section": "Complete the rule", "reveal": "as a result (of) + noun / , as a result + clause", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'So' links a clause showing a result, after a comma. 'So that' shows purpose/intention and is often followed by would/could/can. 'Because of' and 'due to' are followed by a noun phrase, not a clause. 'As a result (of)' can start a formal result sentence or be used with a noun.", "tr": "'So' bir sonucu bağlamak için virgülden sonra bir cümlecik alır. 'So that' bir amaç/niyet bildirir ve genellikle 'would/could/can' ile kullanılır. 'Because of' ve 'due to' bir isim tamlaması alır (cümlecik değil). 'As a result (of)' hem resmi bir sonuç cümlesi başlatabilir hem de isimle kullanılabilir.", "when_en": "We use these connectors when explaining why a city planning decision was made, or what its results were.", "when": "Bir şehir planlama kararının nedenini veya sonucunu açıklarken, ya da bir olayın neden gerçekleştiğini anlatırken bu bağlaçları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["The bridge was closed for repairs. / Traffic got worse. (so)"], "reveal": "The bridge was closed for repairs, so traffic got worse.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["The city planted more trees. / to make the air cleaner. (so that)"], "reveal": "The city planted more trees so that the air would be cleaner.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["heavy rain last week / the road flooded. (because of)"], "reveal": "Because of the heavy rain last week, the road flooded.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the new factory / hundreds of new jobs appeared in the area. (as a result of)"], "reveal": "As a result of the new factory, hundreds of new jobs appeared in the area.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["rents rose fast / many students had to share flats. (so)"], "reveal": "Rents rose fast, so many students had to share flats.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / the council widened the road / (why — so that)"], "reveal": "Why did the council widen the road? So that traffic would flow more smoothly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about causes and effects in your own city or neighbourhood, using 'so', 'so that' and 'because of'/'as a result of'.", "chips": ["…, so…", "…so that…", "Because of…/As a result of…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Congestion got worse, so the city built a new ring road.", "They widened the pavement so that pedestrians would feel safer."], "negative": ["The project didn't continue, so the area stayed undeveloped."], "question": ["Why did rents rise? Because of the new shopping centre nearby."], "short": ["Because of the flooding. / As a result of the new line."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "House prices rose because of the demand increased.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "House prices rose because of the increase in demand. / House prices rose because demand increased.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The council built more parks so residents have more green space.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The council built more parks so that residents would have more green space.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Rents increased sharply ___ the new business district.", "section": "A · Choose the correct option.", "options": ["so", "because of", "so that"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The city added more bus routes ___ commuters would spend less time travelling.", "section": "A · Choose the correct option.", "options": ["because of", "so", "so that"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Traffic congestion got worse, ___ the council introduced a congestion charge.", "section": "A · Choose the correct option.", "options": ["so", "because of", "due to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ the new metro line, house prices near the station rose quickly.", "section": "B · Complete with the correct connector.", "reveal": "Because of / Due to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The government invested in cycle paths ___ fewer people would drive to work.", "section": "B · Complete with the correct connector.", "reveal": "so that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Because of heavy traffic, so many people were late for work.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Because of heavy traffic, many people were late for work.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "As a result of the new park, the neighbourhood feels much greener.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The old factory closed, ___ hundreds of people lost their jobs. ___ this, the council built a new business park ___ new companies would move to the area.", "section": "Text · Complete with so / so that / because of / as a result of.", "reveal": "so / As a result of / so that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Connecting Words: Contrast, Time and Condition", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>While<\/mark> the city centre is noisy and crowded, the suburbs stay quiet even at rush hour.", "Rural areas offer more space, <mark>whereas<\/mark> cities offer more job opportunities.", "<mark>Even though<\/mark> the flat was small, they loved living close to everything.", "<mark>Despite<\/mark> the traffic, most residents say they wouldn't move to the countryside.", "The old bridge will stay closed <mark>until<\/mark> the repairs are finished.", "You can park here for free <mark>as long as<\/mark> you don't stay longer than two hours.", "<mark>By the time<\/mark> the new metro opens, the population will have grown even more."], "ask": "Which words introduce a contrast between two ideas? Which are followed directly by a noun/-ing form instead of a clause? Which two connectors are about time or condition rather than contrast?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["while / whereas + clause", "even though + clause", "despite / in spite of + noun/-ing", "until / as long as / by the time + clause (time or condition)"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "To show a direct contrast between two clauses (often facts), we use ___.", "section": "Complete the rule", "reveal": "while / whereas + clause", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "To show a surprising contrast (something unexpected happened anyway), we use ___.", "section": "Complete the rule", "reveal": "even though + clause", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "To show a surprising contrast followed by a noun or -ing form, we use ___.", "section": "Complete the rule", "reveal": "despite / in spite of + noun/-ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ introduce a point in time or a condition, not a contrast.", "section": "Complete the rule", "reveal": "until / as long as / by the time + clause (time or condition)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'While' and 'whereas' compare two facts and are followed by a clause. 'Even though' introduces an unexpected contrast and is followed by a clause; 'despite'/'in spite of' are followed by a noun or -ing form. 'Until' marks a point in time, 'as long as' a condition, and 'by the time' the point by which something will have happened.", "tr": "'While' ve 'whereas' iki farklı gerçeği karşılaştırır, ikisi de cümlecik alır. 'Even though' beklenmedik bir karşıtlık bildirir ve cümlecik alır; 'despite'/'in spite of' ise isim ya da -ing yapısı alır. 'Until' bir zaman noktasını, 'as long as' bir koşulu, 'by the time' ise bir olayın gerçekleşeceği ana kadar geçen süreci belirtir.", "when_en": "We use these connectors when comparing urban and rural life, or when stating when or under what condition a plan will happen.", "when": "Kırsal ve kentsel yaşamı karşılaştırırken, ya da bir planın ne zaman/hangi koşulla gerçekleşeceğini belirtirken bu bağlaçları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["The city is expensive. / Many people still want to live there. (despite)"], "reveal": "Despite the high cost of living, many people still want to live in the city.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Village life is quiet. / City life is fast and busy. (whereas)"], "reveal": "Village life is quiet, whereas city life is fast and busy.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The flat has no balcony. / They love the location. (even though)"], "reveal": "Even though the flat has no balcony, they love the location.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Rural areas have fewer amenities. / They offer cleaner air and more space. (while)"], "reveal": "While rural areas have fewer amenities, they offer cleaner air and more space.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Residents can't park here / they show a resident permit. (unless → rewrite with 'as long as')"], "reveal": "Residents can park here as long as they show a resident permit.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The road stays closed. / the repairs finish. (until)"], "reveal": "The road stays closed until the repairs finish.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences comparing city and countryside life: two with contrast connectors (while/whereas/even though/despite) and two with time/condition connectors (until/as long as/by the time).", "chips": ["While the city…", "…, whereas…", "Despite…", "By the time…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["While cities offer more jobs, villages offer more space.", "Despite the noise, I love living downtown."], "negative": ["The park won't open until the work is finished."], "question": ["Would you move to the countryside, even though it's far from your job?"], "short": ["Yes, despite the distance. / No, not until things change."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Despite the city is crowded, I enjoy living there.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Despite the city being crowded, I enjoy living there. / Even though the city is crowded, I enjoy living there.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "By the time the new road opens, traffic is getting worse.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "By the time the new road opens, traffic will have got worse.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ the city has more job opportunities, the countryside has cleaner air.", "section": "A · Choose the correct option.", "options": ["Despite", "While", "Until"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ the long commute, she prefers living outside the city.", "section": "A · Choose the correct option.", "options": ["Even though", "Despite", "As long as"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The new bridge won't be finished ___ next spring.", "section": "A · Choose the correct option.", "options": ["until", "despite", "whereas"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ the flat has no garden, the family loves its central location.", "section": "B · Complete with the correct connector.", "reveal": "Even though", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You can use the community garden ___ you sign up in advance.", "section": "B · Complete with the correct connector.", "reveal": "as long as", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Despite living in a small flat, they are very happy with the neighbourhood.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Even though the high cost of living, many people still move to the city.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Despite the high cost of living, many people still move to the city.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "___ the city centre is expensive, more people move there every year. ___ the heavy investment, traffic problems continue, and they probably won't disappear ___ the new metro line opens.", "section": "Text · Complete with while/whereas/even though/despite/until/as long as/by the time.", "reveal": "Even though / Despite / until", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Building the City of Tomorrow", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think this text is going to describe?", "What infrastructure do you think a new neighbourhood needs before people can live there comfortably?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Building the City of Tomorrow", "num": 1, "total": 3, "text": "Twenty years ago, the Riverside district of our city was a collection of empty warehouses and cracked pavements. Today, it is one of the most talked-about neighbourhoods in the country, and its transformation says a lot about how modern cities develop. Planners began by improving the basic infrastructure: they repaired the roads, buried the power lines underground, and built a light-rail line connecting Riverside directly to the city centre. Without reliable transport and utilities, they argued, no other improvement would matter.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Building the City of Tomorrow", "num": 2, "total": 3, "text": "Once the infrastructure was ready, new housing developments followed quickly, along with amenities that made the area genuinely liveable rather than just convenient: parks, a community centre, cycle paths, and a pedestrian-only high street lined with cafés and small shops. Local officials insist that the goal was never simply to attract wealthy new residents. \"We wanted a mixed neighbourhood,\" explains city planner Deniz Aksoy, \"so that teachers, nurses, and young families could still afford to live here, not only people working in the new tech offices nearby.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Building the City of Tomorrow", "num": 3, "total": 3, "text": "Not everyone is convinced the plan has fully worked. Rents have risen sharply since the light-rail line opened, and some long-term residents say they no longer recognise their own street. This pattern, sometimes called gentrification, has appeared in cities around the world whenever an area develops quickly. As a result, the council is now going to introduce rules requiring a percentage of affordable housing in every new development — a decision many hope will keep Riverside open to people from every background, not just those who can pay the highest rent.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What was the first step planners took in developing Riverside?", "section": "While you read", "options": ["Building parks and a community centre", "Improving basic infrastructure such as roads and power lines", "Opening cafés and small shops"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Deniz Aksoy says the goal was to create a ___ neighbourhood where different kinds of workers could afford to live.", "section": "While you read", "reveal": "mixed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What problem has appeared in Riverside since the light-rail line opened?", "section": "While you read", "options": ["Too much green space", "Sharply rising rents / gentrification", "A shortage of tech offices"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The council plans to require a percentage of affordable housing in future developments.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Riverside is now considered one of the most talked-about ___ in the country.", "section": "While you read", "reveal": "neighbourhoods", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think gentrification is always a bad thing? Why or why not?", "Write one sentence describing an infrastructure change you would like to see in your own neighbourhood."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "City Mouse, Country Mouse: Two Lives Compared", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Would you rather live in a city or a village? Why?", "What do you think are the biggest advantages of rural life compared to city life?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "City Mouse, Country Mouse: Two Lives Compared", "num": 1, "total": 3, "text": "Emre grew up in a small village of about six hundred people and moved to the capital for university five years ago. \"The first thing that struck me was the noise,\" he says. \"In my village, you could hear birds and almost nothing else. Here, there's always traffic, always people.\" Despite the constant noise and the long daily commute, Emre says he wouldn't go back permanently. \"There are simply more opportunities here — more jobs, more courses, more things happening every single evening.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "City Mouse, Country Mouse: Two Lives Compared", "num": 2, "total": 3, "text": "His sister Aylin made the opposite choice. After finishing her degree in the city, she returned to their home village to open a small café, even though most of her university friends thought she was making a mistake. \"People assume rural life is boring,\" she says, \"but I know almost everyone who walks through that door. My cost of living is much lower, and I'm not stuck in traffic for two hours a day.\" She admits, however, that some things are harder: the nearest hospital is forty minutes away, and there is only one bus a day to the nearest large town.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "City Mouse, Country Mouse: Two Lives Compared", "num": 3, "total": 3, "text": "Researchers who study urban and rural lifestyles say that stories like Emre and Aylin's are becoming more common as remote work grows. While cities will probably remain centres of innovation and opportunity, rural areas are attracting a new kind of resident: people who want more space and a stronger sense of community, as long as they can still stay connected to city jobs through the internet. Whether this trend continues will depend partly on whether rural infrastructure — from broadband to healthcare — keeps improving fast enough to support it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Why does Emre say he prefers living in the city, despite the noise?", "section": "While you read", "options": ["Because his village has no internet", "Because the city offers more opportunities", "Because public transport is free"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Aylin opened a small ___ in her home village after finishing her degree.", "section": "While you read", "reveal": "café", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Aylin regrets moving back to the village and wants to return to the city.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Aylin is happy with her choice, even though some things are harder in the village.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "According to researchers, what is helping some people choose rural life?", "section": "While you read", "options": ["The growth of remote work", "A shortage of city housing", "A new law about village life"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Aylin says the nearest hospital is about ___ minutes away from her village.", "section": "While you read", "reveal": "forty", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Whose choice do you find more convincing, Emre's or Aylin's? Why?", "Write one sentence comparing your own ideal lifestyle to Emre's or Aylin's."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning Our City of the Future — A Group Project Call", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what three features do you think their future city will include?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning Our City of the Future — A Group Project Call", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does Kaan suggest about the buses in their City of the Future?", "section": "While you listen", "options": ["They will be expensive", "They will be free and electric", "There will be no buses at all"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Selin says buildings will have gardens on every ___.", "section": "While you listen", "reveal": "roof", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Selin will finish the poster only if Kaan and Ege send their notes by tomorrow.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In the word 'design', the letter 'g' is:", "section": "While you listen", "options": ["pronounced /g/", "silent", "pronounced /dʒ/"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Village Life vs City Life — A Radio Interview", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What questions would you ask a town planner about the future of your area?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Village Life vs City Life — A Radio Interview", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "According to the guest, what is the biggest difference between city and village life?", "section": "While you listen", "options": ["Weather", "Infrastructure and access to services", "The number of shops"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "This year, the council is going to invest in rural broadband and a new ___.", "section": "While you listen", "reveal": "bus route", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The guest believes rural areas will never compete with cities.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The guest believes rural areas could compete with cities if digital connections keep improving.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "City Life or Country Life?", "text": "In pairs, compare living in a city with living in a village or small town. Talk about infrastructure, amenities, cost of living and community. Use at least two contrast connectors (while, whereas, even though, despite) and one cause-and-effect connector (so, because of, as a result of).", "steps": [], "chips": [], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Our City of the Future — A Group Presentation", "text": "In groups, design a 'City of the Future' and present it using a poster. Explain your ideas about transport, housing, energy and public spaces, and make predictions using 'will' and 'be going to'.", "steps": [], "chips": [], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Short Report: Our Neighbourhood's Infrastructure", "text": "Write a short report describing your own neighbourhood's infrastructure and amenities (transport, housing, green spaces, shops). Include at least one strength and one area that needs improvement, and one prediction about the future using 'will' or 'be going to'.", "steps": [], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "City of the Future: A Proposal", "text": "Write a proposal describing your vision of a 'City of the Future'. Explain your ideas for transport, housing, energy and community well-being, and give your own opinion about which change matters most.", "steps": [], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Look at those plans — the city ___ a new metro line next to the river.", "section": "Exit ticket", "options": ["will build", "is going to build", "builds"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I'm not sure, but house prices ___ probably rise near the new station.", "section": "Exit ticket", "options": ["are going to", "will", "build"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Traffic congestion increased sharply, ___ the council introduced a new bus lane.", "section": "Exit ticket", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Rents rose quickly ___ the new shopping centre nearby.", "section": "Exit ticket", "reveal": "because of", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "___ the city centre is crowded, the suburbs stay quiet.", "section": "Exit ticket", "options": ["Despite", "While", "Until"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Despite the high cost of living, many people still move to the city.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "You can park here for free ___ you don't stay longer than two hours.", "section": "Exit ticket", "reveal": "as long as", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly uses 'be going to' for a decided plan?", "section": "Exit ticket", "options": ["The council will already build a park next year.", "The council is already going to build a park next year.", "The council building a park next year."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
