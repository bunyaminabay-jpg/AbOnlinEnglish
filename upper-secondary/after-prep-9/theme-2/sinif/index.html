ation that causes the feeling"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Adjectives ending in ___ describe ___.", "section": "Complete the rule", "reveal": "-ed / the person who feels something", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Adjectives ending in ___ describe ___.", "section": "Complete the rule", "reveal": "-ing / the thing or situation that causes the feeling", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Adjectives ending in -ed describe how a person feels (I am interested). Adjectives ending in -ing describe the thing or situation that causes that feeling (The topic is interesting).", "tr": "-ed ile biten sıfatlar, bir kişinin hissettiği duyguyu anlatır (I am interested = ilgileniyorum). -ing ile biten sıfatlar ise o duyguya sebep olan şeyi ya da durumu anlatır (The topic is interesting = konu ilgi çekici).", "when_en": "Choosing correctly between -ed and -ing matters when you describe how a lesson, topic or tool affects you.", "when": "Bir dersten, konudan ya da araçtan nasıl etkilendiğini anlatırken -ed/-ing sıfatlarını doğru seçmek önemlidir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["This lesson is really ___. (interest)"], "reveal": "This lesson is really interesting.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["I feel ___ by this grammar rule. (confuse)"], "reveal": "I feel confused by this grammar rule.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The science experiment was ___. (amaze)"], "reveal": "The science experiment was amazing.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["She was ___ by the long lecture. (bore)"], "reveal": "She was bored by the long lecture.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Our new study app is ___ — everyone loves it. (excite)"], "reveal": "Our new study app is exciting — everyone loves it.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about your school subjects or study tools using -ed and -ing adjectives (e.g. interested/interesting, bored/boring, excited/exciting).", "chips": ["I'm interested in…", "…is really interesting.", "I feel confused when…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I'm interested in Biology.", "Biology is interesting."], "negative": ["I'm not bored in this class.", "This class isn't boring."], "question": ["Are you interested in coding?", "Is the topic confusing?"], "short": ["Yes, I am. / No, I'm not.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I am boring in long lessons.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I am bored in long lessons.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This topic is very interested.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This topic is very interesting.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I'm really ___ in learning to code.", "section": "A · Choose the correct option.", "options": ["interesting", "interested", "interest"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This grammar topic is quite ___ at first.", "section": "A · Choose the correct option.", "options": ["confused", "confusing", "confuse"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We were all ___ by the science fair projects.", "section": "A · Choose the correct option.", "options": ["amazing", "amazed", "amaze"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The new study app is really ___ (excite) — everyone wants to try it.", "section": "B · Complete with the correct form.", "reveal": "exciting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I felt ___ (bore) during the last ten minutes of the lecture.", "section": "B · Complete with the correct form.", "reveal": "bored", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "This lesson is really bored.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This lesson is really boring.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I'm interested in the new elective course.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Are you ___ (excite) about the new coding club?", "section": "Dialogue · Complete with the correct form.", "reveal": "excited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes! It sounds really ___ (interest), and I heard the projects are ___ (amaze).", "section": "Dialogue · Complete with the correct form.", "reveal": "interesting / amazing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-4", "title": "Gramer 5", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Correlative Conjunctions (either…or / neither…nor) and Elliptical Responses", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You can choose <mark>either<\/mark> Art <mark>or<\/mark> Music as your elective this term.", "<mark>Neither<\/mark> Ali <mark>nor<\/mark> his desk mate finished the group project on time.", "A: I really enjoy Biology. B: <mark>So do I.<\/mark>", "A: I don't like early morning lessons. B: <mark>Neither do I.<\/mark>"], "ask": "How do 'either…or' and 'neither…nor' connect two choices? Do the short replies 'So do I' and 'Neither do I' repeat the whole sentence, or just agree/disagree briefly?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["two positive choices", "two negative ideas", "agree with a positive statement", "agree with a negative statement"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Either… or…' connects ___ (you can pick one).", "section": "Complete the rule", "reveal": "two positive choices", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Neither… nor…' connects ___ (both are not true).", "section": "Complete the rule", "reveal": "two negative ideas", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'So + auxiliary + subject' (So do I) is used to ___.", "section": "Complete the rule", "reveal": "agree with a positive statement", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Neither + auxiliary + subject' (Neither do I) is used to ___.", "section": "Complete the rule", "reveal": "agree with a negative statement", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Either… or…' expresses a choice between two positive options. 'Neither… nor…' shows that two things are both not true (the verb stays positive because the negative idea is already in neither/nor). Elliptical short responses use 'So + auxiliary + subject' to agree with a positive statement, and 'Neither/Nor + auxiliary + subject' to agree with a negative one, instead of repeating the whole sentence.", "tr": "'Either… or…' iki olumlu seçenekten birini ifade eder. 'Neither… nor…' ise iki şeyin de doğru/mevcut olmadığını anlatır (fiil olumlu formda kalır çünkü olumsuzluk zaten neither/nor'da vardır). Elliptical (kısa) yanıtlar, bir cümleyi tekrar etmek yerine 'So + yardımcı fiil + özne' (olumlu katılım) ya da 'Neither/Nor + yardımcı fiil + özne' (olumsuz katılım) ile aynı fikirde olduğumuzu kısaca gösterir.", "when_en": "Use these structures to present two options (either…or), to say two things are both not true (neither…nor), or to briefly agree with what someone just said (So do I / Neither do I).", "when": "İki seçenek sunarken (either…or), iki şeyin de doğru/mevcut olmadığını belirtirken (neither…nor), ya da bir arkadaşının söylediğine kısaca katılırken (So do I / Neither do I) bu yapıları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["You can study Chemistry.", "You can study Physics. (choice)"], "reveal": "You can study either Chemistry or Physics.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Ali didn't finish the project.", "His partner didn't finish it either."], "reveal": "Neither Ali nor his partner finished the project.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Choose Art.", "Choose Music. (elective choice)"], "reveal": "You can choose either Art or Music.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["A: I love group projects.", "B: (agree, positive)"], "reveal": "So do I.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["A: I can't concentrate in noisy classrooms.", "B: (agree, negative)"], "reveal": "Neither can I.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences using either…or or neither…nor about your school subjects, and two short elliptical replies (So do I / Neither do I / So am I / Neither am I) agreeing with a partner's opinion.", "chips": ["I can study either…", "Neither… nor…", "So do I.", "Neither am I."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You can choose either Art or Music.", "So do I. / So am I."], "negative": ["Neither Ali nor his partner finished the project."], "question": ["Would you rather study either subject?"], "short": ["Either is fine. / So do I.", "Neither, thanks. / Neither am I."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Neither Ali or his partner finished it.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Neither Ali nor his partner finished it.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "A: I love group projects. B: So I do.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "B: So do I.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "A: I can't concentrate here. B: Neither I can.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "B: Neither can I.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You can revise ___ your notes ___ the online summary — both work well.", "section": "A · Choose the correct option.", "options": ["either / or", "neither / nor", "both / and"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ Elif ___ her lab partner remembered to bring the worksheet.", "section": "A · Choose the correct option.", "options": ["Either / or", "Neither / nor", "Both / and"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "A: I really enjoy Geography. B: ___", "section": "A · Choose the correct option.", "options": ["So do I.", "So I do.", "Neither do I."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A: I can't understand this equation. B: ___ (agree, negative, can).", "section": "B · Complete with the correct form.", "reveal": "Neither can I.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You can hand in your project ___ on paper ___ as a video.", "section": "B · Complete with the correct form.", "reveal": "either / or", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Neither Kaan or his friend passed the quiz.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Neither Kaan nor his friend passed the quiz.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "A: I love using flashcard apps. B: So do I.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: I'm not very interested in Chemistry. B: ___ (agree, negative, am).", "section": "Dialogue · Complete with the correct response.", "reveal": "Neither am I.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You can present your project ___ as a poster ___ as a short video — it's your choice.", "section": "Dialogue · Complete with either/or.", "reveal": "either / or", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Two Students, Two Favourite Subjects", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think Deniz's and Mira's favourite subjects will be, and why might they like them?", "What is your own favourite subject, and what kind of learning activities does it usually involve?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Two Students, Two Favourite Subjects", "num": 1, "total": 3, "text": "Deniz has always loved Biology. Every week, her class does at least one hands-on activity — dissecting a flower, growing bacteria in a petri dish, or building a model of a cell. 'I remember facts much better when I've actually done something with my hands,' she explains. 'If a teacher just talks for forty minutes, I switch off after ten.' Deniz also keeps a set of flashcards with labelled diagrams, which she reviews for ten minutes every evening rather than cramming before a test.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Two Students, Two Favourite Subjects", "num": 2, "total": 3, "text": "Mira, on the other hand, is far more excited by Coding, an elective course she chose in Year 9. She enjoys the logical, step-by-step nature of writing a programme, and she likes that mistakes are simply part of the process — a wrong line of code just produces an error message, not a bad grade. Mira mostly studies using online tutorials and a mind-mapping app, which helps her see how different commands connect to each other before she starts typing.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Two Students, Two Favourite Subjects", "num": 3, "total": 3, "text": "Although Deniz and Mira are interested in completely different subjects, their stories share an important lesson: a subject feels enjoyable when the learning activities match the way a person naturally thinks. Some students learn best by doing, others by connecting ideas visually, and others by listening and discussing. Recognising your own learning style — and choosing study tools that fit it — can turn even a difficult subject into one you look forward to.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Biology is more useful than Coding.", "A subject feels enjoyable when the learning activities match how a student thinks.", "Mira and Deniz study in exactly the same way."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Deniz's class does at least one ___ activity every week, such as dissecting a flower.", "section": "While you read", "reveal": "hands-on", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, Mira likes Coding partly because:", "section": "While you read", "options": ["mistakes are simply part of the process, not a bad grade", "it has no homework", "it doesn't require any study tools"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz prefers to cram all her revision the night before a test.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz reviews her flashcards for ten minutes every evening, rather than cramming.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Mira uses a ___ app to see how different commands connect before she starts typing.", "section": "While you read", "reveal": "mind-mapping", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Whose learning style is more similar to yours — Deniz's or Mira's? Why?", "Write one sentence about a study tool that helps you learn your favourite subject."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Guide to Smart Study Tools", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What study tools or apps do you already use to help you learn?", "Do you think old tools like paper notebooks are still useful, or have digital tools replaced them completely?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Guide to Smart Study Tools", "num": 1, "total": 3, "text": "Walk into almost any classroom today and you will find a mix of old and new study tools working side by side. Alongside the familiar exercise book and paper textbook, many students now use a digital textbook that highlights key vocabulary automatically, or a flashcard app that shows them a word again just before they are likely to forget it. Teachers, too, increasingly rely on an interactive whiteboard to display diagrams, videos and quizzes that the whole class can respond to together.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Guide to Smart Study Tools", "num": 2, "total": 3, "text": "One especially useful innovation is spaced repetition, the method behind many flashcard apps. Instead of reviewing everything the night before a test, students see each fact several times over a period of days or weeks, with longer gaps between each review. Research suggests that this approach helps information move from short-term to long-term memory far more effectively than last-minute cramming. Mind maps work on a similar principle: by connecting ideas visually, they make it easier to recall a whole topic rather than isolated facts.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Guide to Smart Study Tools", "num": 3, "total": 3, "text": "However, no tool can replace regular practice and genuine understanding. A flashcard app can help you memorise vocabulary, but it cannot teach you to write a full paragraph; an interactive whiteboard can make a lesson more engaging, but students still need to take notes and think for themselves. The most effective students are usually not the ones with the most expensive gadgets, but the ones who choose a small number of tools that suit their own learning style and use them consistently.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main purpose of this text?", "section": "While you read", "options": ["To argue that paper textbooks should disappear completely", "To explain different study tools and how to use them effectively", "To describe the history of the interactive whiteboard"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The method behind many flashcard apps, which shows facts again after longer gaps, is called ___.", "section": "While you read", "reveal": "spaced repetition", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, the most effective students always own the most expensive gadgets.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The most effective students choose a small number of tools that suit their learning style and use them consistently.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does the writer say 'no tool can replace regular practice'?", "section": "While you read", "options": ["Because study tools are not useful at all", "Because tools can help with some tasks, but students still need to practise and understand", "Because interactive whiteboards are too expensive for most schools"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which study tool from the text would you like to try? Why?", "Do you agree that 'no tool can replace regular practice'? Explain your opinion with an example."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Study Buddies — Comparing Favourite Subjects", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what subject do you think each speaker will say is their favourite, and why?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Study Buddies — Comparing Favourite Subjects", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is Aslı's favourite subject?", "section": "While you listen", "options": ["Chemistry", "Geography", "Coding"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Burak's favourite subject is Geography.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Burak's favourite subject is Chemistry.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Aslı uses a ___ app every evening.", "section": "While you listen", "reveal": "flashcard", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "When Burak says 'So do I!', what is he agreeing with?", "section": "While you listen", "options": ["That Aslı uses a flashcard app", "That the exam starts on Thursday", "That Chemistry is exciting"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Study Tools and Innovations — A Project Brief", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What study tool or app do you already use, and how does it help you?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Study Tools and Innovations — A Project Brief", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the main topic of the teacher's talk?", "section": "While you listen", "options": ["A test on grammar rules", "New tools to make revision more effective", "A school trip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Students will test one new study tool for ___ weeks.", "section": "While you listen", "reveal": "two", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Students must choose a digital tool for thei uestion", "qtype": "gap", "q": "You love group projects, ___?", "section": "Exit ticket", "reveal": "don't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "He answered every question very ___.", "section": "Exit ticket", "options": ["confident", "confidently", "confidence"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "This topic is really ___ (interest), so I want to learn more.", "section": "Exit ticket", "reveal": "interesting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Neither Ece or her partner finished the worksheet.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Neither Ece nor her partner finished the worksheet.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "A: I really enjoy using flashcard apps. B: ___", "section": "Exit ticket", "options": ["So do I.", "So I do.", "Neither do I."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
