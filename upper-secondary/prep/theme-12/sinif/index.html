fect Passive = will + have + ___ + past participle.", "section": "Complete the rule", "reveal": "been", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "The passive voice with perfect tenses focuses on the action or its result rather than who does it. Structure: have/has/had/will have + been + past participle.", "tr": "Edilgen çatı (passive voice), mükemmel zamanlarla (perfect tenses) birlikte kullanıldığında, eylemi yapan kişi yerine eylemin sonucuna odaklanılır. Yapı: have/has/had/will have + been + fiilin 3. hali (past participle).", "when_en": "We use it when it is not important or not known who did the action, or when the result itself is the focus (applications, decisions, plans).", "when": "Kim yaptığı önemli değilse ya da bilinmiyorsa, ya da sonucun kendisi önemliyse (başvurular, kararlar, planlar) kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the university", "accept", "her application", "present perfect"], "reveal": "Her application has been accepted by the university.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "achieve", "their goal", "present perfect"], "reveal": "Their goal has been achieved by my parents.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the company", "reject", "his plan", "past perfect, before he tried again"], "reveal": "His plan had been rejected before he tried again.", "note": "Students say the sentence aloud; pick a number, then r nts write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "My parents ___ not (sleep) well this month.", "section": "B · Complete with the correct form.", "reveal": "haven't been sleeping", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She has been practise the violin every day.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She has been practising the violin every day.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We have been saving money for our trip since June.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: How long ___ you ___ (work) on your project?", "section": "Dialogue · Complete with the present perfect progressive.", "reveal": "have / been working", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (work) on it since last month.", "section": "Dialogue · Complete with the present perfect progressive.", "reveal": "have been working", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": re, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Past ability: ___ + base verb.", "section": "Complete the rule", "reveal": "was/were able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Future ability: ___ + base verb.", "section": "Complete the rule", "reveal": "will be able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Present perfect ability (an achievement up to now): ___ + base verb.", "section": "Complete the rule", "reveal": "has/have been able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Able to' expresses ability and, unlike can/could, can be used in any tense: is/are able to (present), was/were able to (past — often preferred for a single specific achievement), will be able to (future), has/have been able to (an achievement up to now).", "tr": "'Able to' yetenek anlatır ve can/could'un aksine tüm zamanlarda kullanılabilir: is/are able to (şimdi), was/were able to (geçmiş, genellikle tek seferlik bir başarı için tercih edilir), will be able to (gelecek), has/have been able to (şimdiye kadar başarılmış bir şey).", "when_en": "We use it to talk about future or 'up to now' abilities (where can/could don't exist), or to emphasise a single specific achievement in the past.", "when": "Gelecekteki ya da şimdiye kadarki yetenek/başarıları anlatırken ya da geçmişte tek bir olayda başarılmış bir şeyi vurgularken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["my sister", "pass the exam", "past, single achievement"], "reveal": "My sister was able to pass the exam.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "speak fluent English", "future, with more practice"], "reveal": "He will be able to speak fluent English.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "achieve her dream job", "present perfect, thanks to hard work"], "reveal": "She has been able to achieve her dream job.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["not everyone", "follow their dreams easily", "present, general ability"], "reveal": "Not everyone is able to follow their dreams easily.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "save enough money", "past, for our house"], "reveal": "My parents were able to save enough money for our house.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "achieve your goals this year", "present perfect"], "reveal": "Have you been able to achieve your goals this year?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "tex  Complete with the correct form of 'able to'.", "reveal": "Have / been able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, thanks to my family's support, I ___ (be able) finish my project.", "section": "Dialogue · Complete with the correct form of 'able to'.", "reveal": "was able to / have been able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "My brother can play the guitar very well now.", "section": "Dialogue · Complete with the correct form of 'able to'.", "reveal": "My brother will be able to play the guitar very well next year too.", "prompt": "Rewrite about the future: he will still have this ability next year.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Verbs + gerund or infinitive: talking about goals", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["My sister <mark>hopes to become<\/mark> a doctor one day.", "My parents <mark>enjoy supporting<\/mark> our dreams.", "He <mark>decided to study<\/mark> engineering at university.", "She <mark>avoids giving up<\/mark> when things get difficult."], "ask": "Which verbs are followed by to + verb (infinitive)? Which are followed by verb+ing (gerund)?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["to + verb", "verb + -ing", "hope, decide, want", "enjoy, avoid, finish"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Hope', 'decide' and 'want' are usually followed by ___.", "section": "Complete the rule", "reveal": "to + verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Enjoy', 'avoid' and 'finish' are usually followed by ___.", "section": "Complete the rule", "reveal": "verb + -ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Verbs like ___ show a future plan or decision, so they take the infinitive.", "section": "Complete the rule", "reveal": "hope, decide, want", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Verbs like ___ describe an activity itself, so they take the gerund.", "section": "Complete the rule", "reveal": "enjoy, avoid, finish", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Some verbs are followed by to + verb (infinitive): hope to, want to, decide to, plan to. Other verbs are followed by verb + -ing (gerund): enjoy, avoid, finish, practise. You need to learn which verbs take which form.", "tr": "Bazı fiillerden sonra to + fiil (mastar/infinitive) gelir (hope to, want to, decide to, plan to); bazı fiillerden sonra ise fiil + -ing (gerund/ulaç) gelir (enjoy, avoid, finish, practise). Hangi fiilin hangi yapıyı aldığını ezberlemek gerekir.", "when_en": "We use these verb patterns to talk about family goals, plans and habits.", "when": "Aile hedeflerini, planlarını ve alışkanlıklarını anlatırken bu fiil kalıplarını kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["my sister", "hope", "become (a doctor)"], "reveal": "My sister hopes to become a doctor.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "enjoy", "support (our dreams)"], "reveal": "My parents enjoy supporting our dreams.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "decide", "study (engineering)"], "reveal": "He decided to study engineering.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "avoid", "give up (when things get hard)"], "reveal": "She avoids giving up when things get hard.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "plan", "travel (together next year)"], "reveal": "We plan to travel together next year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my brother", "finish", "write (his project plan)"], "reveal": "My brother finished writing his project plan.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about your family's plans and habits using verbs followed by the gerund or infinitive.", "chips": ["... hopes/wants to ...", "... enjoys/avoids ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["She hopes to become a doctor.", "They enjoy travelling together."], "negative": ["He doesn't want to give up.", "We avoid arguing about money."], "question": ["Does she plan to study abroad?", "Do you enjoy helping your family?"], "short": ["Yes, she does. / No, she doesn't.", "Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My sister hopes becoming a doctor.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My sister hopes to become a doctor.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My parents enjoy to support our dreams.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My parents enjoy supporting our dreams.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "My sister hopes ___ a doctor.", "section": "A · Choose the correct option.", "options": ["become", "to become", "becoming"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My parents enjoy ___ our dreams.", "section": "A · Choose the correct option.", "options": ["support", "to support", "supporting"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "He decided ___ engineering at university.", "section": "A · Choose the correct option.", "options": ["study", "to study", "studying"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She avoids ___ (give) up when things get difficult.", "section": "B · Complete with the correct form.", "reveal": "giving", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We plan ___ (travel) together next summer.", "section": "B · Complete with the correct form.", "reveal": "to travel", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "My brother finished to write his project plan.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My brother finished writing his project plan.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "She wants to become a successful engineer.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What does your brother want ___ (do) in the future?", "section": "Dialogue · Complete with the gerund or infinitive.", "reveal": "to do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: He hopes ___ (open) his own business one day.", "section": "Dialogue · Complete with the gerund or infinitive.", "reveal": "to open", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "My mum likes it when she helps other people.", "section": "Dialogue · Complete with the gerund or infinitive.", "reveal": "My mum enjoys helping other people.", "prompt": "Make one sentence using 'enjoy' + gerund.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-4", "title": "Gramer 5", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Prepositional phrases: talking about goals and support", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["My father is proud <mark>of<\/mark> my achievements.", "We are all working <mark>towards<\/mark> a better future.", "My sister is interested <mark>in<\/mark> studying medicine.", "My parents believe <mark>in<\/mark> my dreams."], "ask": "Which preposition usually follows 'proud', 'interested' and 'believe'? Which preposition shows direction towards a goal?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["of", "in", "towards", "for"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Be proud ___ somebody/something.", "section": "Complete the rule", "reveal": "of", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Be interested ___ something.", "section": "Complete the rule", "reveal": "in", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Work/move ___ a goal (direction, progress).", "section": "Complete the rule", "reveal": "towards", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Believe ___ somebody/something.", "section": "Complete the rule", "reveal": "in", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Certain adjectives and verbs are always followed by a fixed preposition: proud of, interested in, believe in, work towards, grateful for, good at. These combinations must be learned.", "tr": "Bazı sıfat ve fiillerden sonra belirli edatlar (prepositions) sabit olarak gelir: proud of, interested in, believe in, work towards, grateful for, good at. Bu kalıplar ezberlenmelidir.", "when_en": "We use these phrases to talk about family support, interests, and progress towards goals.", "when": "Aile içindeki destek, ilgi alanları ve hedeflere doğru ilerlemeyi anlatırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["my father", "be proud", "my achievements"], "reveal": "My father is proud of my achievements.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "work", "a better future"], "reveal": "We are working towards a better future.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my sister", "be interested", "medicine"], "reveal": "My sister is interested in medicine.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "believe", "my dreams"], "reveal": "My parents believe in my dreams.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "be grateful", "my family's support"], "reveal": "I am grateful for my family's support.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "be good", "solving problems"], "reveal": "She is good at solving problems.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about your family using prepositional phrases (e.g. proud of, interested in, work towards, believe in, grateful for).", "chips": ["My ... is proud of ...", "I am interested in ...", "We are working towards ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["My father is proud of me.", "We are working towards our goals."], "negative": ["He isn't interested in sports.", "They don't believe in giving up."], "question": ["Are you interested in studying abroad?", "Is she proud of her progress?"], "short": ["Yes, I am. / No, I'm not.", "Yes, she is. / No, she isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My father is proud with me.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My father is proud of me.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My sister is interested for medicine.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My sister is interested in medicine.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "My father is proud ___ my achievements.", "section": "A · Choose the correct option.", "options": ["of", "in", "for"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We are working ___ a better future.", "section": "A · Choose the correct option.", "options": ["for", "towards", "of"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My sister is interested ___ studying medicine.", "section": "A · Choose the correct option.", "options": ["in", "of", "at"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My parents believe ___ my dreams.", "section": "B · Complete with the correct preposition.", "reveal": "in", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I am grateful ___ my family's support.", "section": "B · Complete with the correct preposition.", "reveal": "for", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She is good in solving problems.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is good at solving problems.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We are all working towards a better future.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What is your sister interested ___?", "section": "Dialogue · Complete with the correct preposition.", "reveal": "in", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: She's really interested ___ becoming a doctor, and my parents believe ___ her.", "section": "Dialogue · Complete with the correct preposition.", "reveal": "in / in", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "I feel thankful because of my family's support.", "section": "Dialogue · Complete with the correct preposition.", "reveal": "I am grateful for my family's support.", "prompt": "Rewrite using 'grateful for'.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Family of Dreams", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think this text is about?", "Guess: what job or dream might each family member have?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Family of Dreams", "num": 1, "total": 5, "text": "My name is Elif and my family has many different dreams for the future. For our school project, we have been thinking about each person's aspirations and how we support each other.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Family of Dreams", "num": 2, "total": 5, "text": "My father has always wanted to open his own bakery. He has been saving money for years, and last month he was finally able to rent a small shop in our neighbourhood. My mother is proud of him and helps him plan the menu every evening.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Family of Dreams", "num": 3, "total": 5, "text": "My older brother, Kaan, hopes to become a software engineer. He is interested in computers and has been learning to code since he was twelve. My parents believe in his ability, so they bought him a new laptop for his birthday.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Family of Dreams", "num": 4, "total": 5, "text": "As for me, my ambition is to study medicine. I want to help people who are ill, just like the doctor who took care of my grandmother. My family encourages me to study hard, and I am determined to achieve my goal.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Family of Dreams", "num": 5, "total": 5, "text": "We all support each other's dreams. My father says that with persistence and a little help from your family, almost anything is possible.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A family's different future dreams and support for each other", "A family's holiday plans", "A school's new building"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What has Elif's father been doing for years?", "section": "While you read", "options": ["Learning to code", "Saving money for a bakery", "Studying medicine"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who has been learning to code since he was twelve?", "section": "While you read", "options": ["Elif's father", "Kaan", "Elif"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Elif's ambition?", "section": "While you read", "options": ["To open a bakery", "To become a software engineer", "To study medicine"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, Elif's family members don't support each other's dreams.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif's family members do support each other's dreams.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Elif's father say is needed to achieve almost anything?", "section": "While you read", "options": ["Money and luck", "Persistence and family support", "Perfect grades"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What is one aspiration in your own family? Write two sentences.", "Which family member's dream in the text is most similar to your own dream? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "My Sister's Changing Plans", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think 'changing your mind about the future' means?", "Guess: why might someone change their career plan?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My Sister's Changing Plans", "num": 1, "total": 5, "text": "For years, my sister Selin has been talking about becoming a lawyer. She has always been good at arguing and giving opinions, so it seemed like the perfect career for her.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Sister's Changing Plans", "num": 2, "total": 5, "text": "Last year, however, Selin started volunteering at an animal shelter near our house. She has been working there every weekend since March, and she quickly fell in love with the work.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Sister's Changing Plans", "num": 3, "total": 5, "text": "Now Selin has decided to study veterinary medicine instead of law. She has been able to talk to a real vet about the course, and she has been preparing for the entrance exam every evening.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Sister's Changing Plans", "num": 4, "total": 5, "text": "At first, our parents were surprised, but they have been very supportive. My mother says it's normal for people's ambitions to change as they discover new interests.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Sister's Changing Plans", "num": 5, "total": 5, "text": "Selin is now determined to work towards her new goal. She says the most important thing is to follow a path that makes you happy, not just a path that other people expect.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What did Selin originally want to become?", "section": "While you read", "options": ["A vet", "A lawyer", "A teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What has Selin been doing since March?", "section": "While you read", "options": ["Studying law", "Volunteering at an animal shelter", "Preparing for a lawyer exam"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Selin's new plan?", "section": "While you read", "options": ["To become a vet", "To become a lawyer", "To become a teacher"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How did the parents react at first?", "section": "While you read", "options": ["Angry", "Surprised", "Uninterested"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, Selin's parents refused to support her new plan.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Selin's parents have been very supportive of her new plan.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Selin believe is the most important thing about choosing a path?", "section": "While you read", "options": ["Following what makes you happy", "Earning a lot of money", "Following your parents' choice"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Have your own plans or ambitions ever changed? Write two sentences.", "Give one piece of advice for someone who is choosing a future career."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning the Family Project", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning their 'Family Members' Future Aspirations' project.", "Predict: what roles might they need for a class presentation about family dreams?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning the Family Project", "audio": null, "transcript": [{"speaker": "Deniz", "line": "So for our project, we have to describe our family members' aspirations and dreams, right?"}, {"speaker": "Elif", "line": "Yes, and we also have to show how each person supports the others. Who do you want to be in your script?"}, {"speaker": "Deniz", "line": "I want to play my father. He's been working towards opening his own shop for years."}, {"speaker": "Elif", "line": "That's a great role! I'll write the part about my sister — she's interested in becoming a vet."}, {"speaker": "Deniz", "line": "Has your teacher told us how long the presentation should be?"}, {"speaker": "Elif", "line": "Yes, about five minutes. We also have to explain the skills each person needs."}, {"speaker": "Deniz", "line": "OK, I'll be able to finish my script by Thursday. Are you able to practise with me on Friday?"}, {"speaker": "Elif", "line": "Definitely. Let's meet in the library after school."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the project mainly about?", "section": "While you listen", "options": ["Family members' future aspirations and support", "A school trip", "A sports competition"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who does Deniz want to play in the script?", "section": "While you listen", "options": ["His father", "His sister", "His teacher"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Elif's sister interested in becoming?", "section": "While you listen", "options": ["A lawyer", "A vet", "A teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long should the presentation be?", "section": "While you listen", "options": ["About five minutes", "About ten minutes", "About one hour"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz and Elif decide to practise together on Friday.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Where will they meet to practise?", "section": "While you listen", "options": ["In the library after school", "At Deniz's house", "On the phone"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What role would you choose for your own family project? Why?", "Write one sentence about a skill someone in your family needs for their dream job."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Interviewing Grandma About Her Dreams", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a student interviewing her grandmother about her dreams.", "Predict: were people's dreams different in the past? Think of one reason."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Interviewing Grandma About Her Dreams", "audio": null, "transcript": [{"speaker": "Öykü", "line": "Grandma, can I ask you some questions for my English project?"}, {"speaker": "Grandma", "line": "Of course, dear. What do you want to know?"}, {"speaker": "Öykü", "line": "Have you always wanted to be a teacher?"}, {"speaker": "Grandma", "line": "Actually, when I was young, I was able to study art at university, but my family needed help at home, so I became a teacher instead."}, {"speaker": "Öykü", "line": "Do you regret that decision?"}, {"speaker": "Grandma", "line": "Not really. I've been teaching for over thirty years, and I've helped hundreds of students. I'm proud of that."}, {"speaker": "Öykü", "line": "Is there anything you still hope to do?"}, {"speaker": "Grandma", "line": "Yes! I've been planning to paint again since I retired. I'm determined to finish a whole collection this year."}, {"speaker": "Öykü", "line": "That's wonderful. I believe in you, Grandma!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What did Grandma originally want to study?", "section": "While you listen", "options": ["Art", "Teaching", "Medicine"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why did Grandma become a teacher instead?", "section": "While you listen", "options": ["Her family needed help at home", "She didn't like art", "Art school was too expensive"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long has Grandma been teaching?", "section": "While you listen", "options": ["Ten years", "Twenty years", "Over thirty years"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What has Grandma been planning since she retired?", "section": "While you listen", "options": ["To travel the world", "To paint again", "To open a school"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Grandma regrets becoming a teacher.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Grandma doesn't really regret becoming a teacher.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What is Grandma determined to do this year?", "section": "While you listen", "options": ["Finish a whole art collection", "Retire from teaching", "Study medicine"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Ask an older family member about a dream they had when they were young. Write two sentences about their answer.", "Do you think people's dreams have changed over time? Give one reason."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Interview: My Family's Dreams", "text": "Interview your partner about one family member's future aspirations and dreams, then present what you learned to another pair, using the grammar from this theme.", "steps": ["Think of one family member and their dream or ambition.", "Take turns interviewing each other using at least three questions.", "Take notes on your partner's answers.", "Prepare a short summary using 'able to', 'hope to' or 'has been -ing'.", "Share your summary with another pair and compare family dreams."], "chips": ["What does your ... hope to do in the future?", "Has your ... been working towards ...?", "My ... is interested in ...", "My ... is determined to ..."], "timer": 600, "levels": ["Give a list of question starters for lower-level students.", "3 interview questions + short summary.", "Fast finishers add one more family member and compare two people's dreams."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Family Project Role-Play (Performance Prep)", "text": "In your project group, act out a short scene where each person plays a family member describing their future aspirations and how the others support them, as preparation for the theme's performance task.", "steps": ["Choose which family member each person will play.", "Decide on each character's dream and one skill they need.", "Write 2-3 lines for each character.", "Rehearse the scene together, using this theme's grammar points.", "Perform your scene for another group and give each other feedback."], "chips": ["I hope to become ...", "My family has been supporting me by ...", "I'm determined to ...", "We believe in you!"], "timer": 300, "levels": ["Provide sentence frames for each grammar point (able to, hope to, has been -ing).", "3-4 characters, 2-3 lines each.", "Fast finishers add a line where a family member gives advice."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Family's Aspirations", "text": "Write a paragraph describing the future aspirations and dreams of two people in your family. Explain what skills they need and how the family supports them.", "steps": ["Choose two family members and their dreams.", "Note down one skill each person needs.", "Note down how the family supports them.", "Check your grammar and punctuation."], "chips": ["aspiration", "ambition", "determined", "support", "skill", "achieve", "... hopes to ...", "... has been working towards ...", "... is able to ...", "My family supports ... by ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "Family Project Script (Performance Task Preparation)", "text": "Write the script for your class project 'Family Members' Future Aspirations, Dreams, and Ambitions'. Write 2-3 short lines for each family member's role, showing their dream, the skills they need, and how the family supports them.", "steps": ["List the family members (roles) in your project.", "Write one or two sentences about each person's dream.", "Add a line showing family support or encouragement.", "Read your script aloud and time it."], "chips": ["role model", "encourage", "proud", "career", "potential", "persistence", "I hope to ...", "I've been -ing ... since/for ...", "My family believes in me.", "We are proud of you!"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'aspiration'", "section": "Exit ticket", "options
