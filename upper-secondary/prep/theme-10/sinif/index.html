 then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a school rule for tablets.", "section": "Dialogue · Complete with the correct passive form.", "words": ["must", "all", "tablets", "be", "charged", "before", "the", "lesson"], "end": "?", "reveal": "Must all tablets be charged before the lesson?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Reflexive pronouns", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Students can teach <mark>themselves<\/mark> new topics with online videos.", "I fixed the connection problem <mark>myself<\/mark>.", "The robot can't repair <mark>itself<\/mark> — a technician has to help.", "We organised the whole technology project <mark>ourselves<\/mark>."], "ask": "What do these -self / -selves words show? Who do they refer back to?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["same person or thing", "myself/yourself/himself/herself/itself", "ourselves/yourselves/themselves", "alone or without help"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "A reflexive pronoun refers back to the ___ as the subject of the sentence.", "section": "Complete the rule", "reveal": "same person or thing", "note": "Students write the answer, then c lf.", "They didn't organise the project themselves — a teacher helped."], "question": ["Did you set up the software yourself?"], "short": ["Yes, I did it myself."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She teach herself English with an app.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She teaches herself English with an app.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We fixed the tablet ourself.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We fixed the tablet ourselves.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I built this presentation ___.", "section": "A · Choose the correct option.", "options": ["myself", "itself", "yourself"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The app updates ___ automatically.", "section": "A · Choose the correct option.", "options": ["himself", "itself", "ourselves"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We organised the technology fair ___.", "section": "A · Choose the correct option.", "options": ["ourself", "ourselves", "themselves"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She taught ___ how to code last summer.", "section": "B · Complete with the correct reflexive pronoun.", "reveal": "herself", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The students solved the problem ___, without any help.", "section": "B · Complete with the correct reflexive pronoun.", "reveal": "themselves", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The robot can't repair themself.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The robot can't repair itself.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I downloaded the app myself.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Did you set up the wireless connection ___?", "section": "Dialogue · Complete with the correct reflexive pronoun.", "reveal": "yourself / yourselves", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: No, the IT teacher helped us. We couldn't do it ___.", "section": "Dialogue · Complete with the correct reflexive pronoun.", "reveal": "ourselves", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "The tablet doesn't turn off automatically.", "section": "Dialogue · Complete with the correct reflexive pronoun.", "reveal": "The tablet doesn't turn itself off automatically.", "prompt": "Rewrite using a reflexive pronoun with the same meaning.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Connecting words (cause, effect, contrast, time)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>Because<\/mark> the Wi-Fi was down, we couldn't use the tablets.", "The projector broke, <mark>so<\/mark> we used the whiteboard instead.", "<mark>Although<\/mark> technology helps us learn, it can also distract us.", "<mark>After<\/mark> the teacher uploads the homework, students download it at home."], "ask": "Which words give a reason (cause)? Which show a result (effect)? Which show a contrast? Which show time order?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["because (cause)", "so (effect)", "although (contrast)", "after (time)"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Because the Wi-Fi was down...' gives a reason: this is ___.", "section": "Complete the rule", "reveal": "because (cause) / cause", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'...so we used the whiteboard instead' shows a result: this is ___.", "section": "Complete the rule", "reveal": "so (effect) / effect", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Although technology helps us learn...' shows an unexpected contrast: this is ___.", "section": "Complete the rule", "reveal": "although (contrast) / contrast", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'After the teacher uploads the homework...' shows the order of events: this is ___.", "section": "Complete the rule", "reveal": "after (time) / time", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Connecting words join two ideas: because/so (cause-effect), although/but (contrast), after/before/when (time order). They make our sentences clearer and our writing more fluent.", "tr": "Bağlaçlar iki fikri birbirine bağlar: because/so (sebep-sonuç), although/but (zıtlık), after/before/when (zaman sırası). Cümlenin anlamını netleştirmek ve daha akıcı yazmak için kullanılır.", "when_en": "We use them to explain the cause, effect, contrast or time order of events, especially in project presentations and written texts.", "when": "Bir olayın nedenini, sonucunu, bir zıtlığı veya olayların sırasını açıklarken, özellikle proje sunumları ve yazılı metinlerde kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the battery died", "because", "I couldn't charge my tablet"], "reveal": "I couldn't charge my tablet because the battery died.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the app crashed", "so", "we lost our project file"], "reveal": "The app crashed, so we lost our project file.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["technology is useful", "although", "it can be distracting"], "reveal": "Although technology is useful, it can be distracting.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you download the app", "before", "you can join the online lesson"], "reveal": "You must download the app before you can join the online lesson.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the robot finishes the task", "when", "it will send a message"], "reveal": "When the robot finishes the task, it will send a message.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences about technology in your classroom using two different connecting words (one for cause/effect, one for contrast/time).", "chips": ["Because…", "Although…", "…, so…", "After…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Because the Wi-Fi was slow, the video didn't load.", "The mit'.", "section": "A · Choose the correct option.", "options": ["Because", "So", "After"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The Wi-Fi was down. ___, we couldn't join the online lesson.", "section": "B · Join the sentences.", "reveal": "So", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ the classroom has a projector, our teacher still uses the board sometimes.", "section": "B · Join the sentences.", "reveal": "Although", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Because the robot is helpful. It can't answer every question.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Although the robot is helpful, it can't answer every question.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "After the teacher uploads the file, students can download it.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ the tablets were fully charged, the lesson still started late.", "section": "Dialogue · Complete with a suitable connecting word.", "reveal": "Although", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, ___ the projector needed an update, we lost ten minutes.", "section": "Dialogue · Complete with a suitable connecting word.", "reveal": "because", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Join the ideas: 'the internet was slow' / 'so' / 'the video kept stopping'.", "section": "Dialogue · Complete with a suitable connecting word.", "words": ["the", "internet", "was", "slow,", "so", "the", "video", "kept", "stopping"], "end": ".", "reveal": "The internet was slow, so the video kept stopping.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Tour of a Smart Classroom", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What technology do you expect to read about?", "Guess: name two devices you think a 'smart classroom' might have."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Tour of a Smart Classroom", "num": 1, "total": 5, "text": "Our school opened a new smart classroom this year, and I was one of the first students to try it. When you walk in, the first thing you notice is the huge interactive whiteboard at the front. It isn't just a screen — you can touch it, write on it, and even play educational games on it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Tour of a Smart Classroom", "num": 2, "total": 5, "text": "Every student has a small tablet connected to the classroom's wireless network. Worksheets are never printed on paper anymore; instead, they are downloaded from the school's online platform at the start of the lesson. If a device runs out of battery, there is a charger under every desk.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Tour of a Smart Classroom", "num": 3, "total": 5, "text": "During our science lesson, the teacher used the projector to show a 3D model of the solar system. It looked almost like a hologram floating above the desks! Although the equipment is expensive, our headteacher says it will be upgraded again next year with new, more innovative tools.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Tour of a Smart Classroom", "num": 4, "total": 5, "text": "Of course, technology sometimes causes problems. Last week, the Wi-Fi went down, so we couldn't upload our homework on time. Because of this, our teacher taught us to always keep a backup copy. Students must also charge their tablets themselves every night — nobody does it for us!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Tour of a Smart Classroom", "num": 5, "total": 5, "text": "I really enjoy learning in the smart classroom because lessons feel more interactive and modern. However, I still think a good teacher is more important than any device, no matter how advanced it is.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A student's experience of a smart classroom", "How to repair a broken projector", "The history of the interactive whiteboard"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is under every desk?", "section": "While you read", "options": ["A charger", "A router", "A printer"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What happened when the Wi-Fi went down?", "section": "While you read", "options": ["The lesson finished early", "Students couldn't upload their homework on time", "The whiteboard stopped working"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 3, what does 'it' in 'It looked almost like a hologram' refer to?", "section": "While you read", "options": ["The projector", "The 3D model of the solar system", "The interactive whiteboard"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, the writer thinks technology is more important than a good teacher.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The writer thinks a good teacher is more important than any device.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Whose job is it to charge the tablets every night?", "section": "While you read", "options": ["The caretaker's", "The students' own job", "The IT teacher's"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What technology would you like to have in your own classroom? Write two sentences.", "Compare the smart classroom in the text with your own classroom. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "My Two Weeks with a Learning App", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you use any apps to help you study? Which ones?", "Predict: what problems could someone have when they start using a new learning app?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My Two Weeks with a Learning App", "num": 1, "total": 5, "text": "Two weeks ago, my English teacher recommended a new vocabulary app for our class project. At first, I found it a little confusing, but I taught myself how to use it in about ten minutes by watching a short video.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Weeks with a Learning App", "num": 2, "total": 5, "text": "Every evening, I open the app on my phone and review ten new words. The app updates my progress automatically, so I can see exactly which words I need to practise again. Because the app tracks my mistakes, it gives me more practice with the words I find difficult.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Weeks with a Learning App", "num": 3, "total": 5, "text": "Although I enjoy the app, it isn't perfect. Sometimes it needs an internet connection, so I can't use it on the school bus where there is no Wi-Fi. When this happens, I use paper flashcards instead — an old method that still works well!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Weeks with a Learning App", "num": 4, "total": 5, "text": "For our technology project, our group decided to create a short guide for other students about using learning apps responsibly. We explained that apps are a great tool, but students shouldn't only rely on a screen; talking to real people is important too.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Weeks with a Learning App", "num": 5, "total": 5, "text": "After two weeks, I can say the app really helped me learn new words faster. I will keep using it, but I will also keep talking, reading and writing in English every day — technology should support learning, not replace it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A review of a school's technology equipment", "A student's diary about learning with an app", "Instructions for installing an app"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How did the writer learn to use the app?", "section": "While you read", "options": ["A teacher explained it in class", "They taught themselves by watching a video", "A friend showed them at home"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why does the writer sometimes use paper flashcards?", "section": "While you read", "options": ["The app is too easy", "There is no Wi-Fi on the school bus", "The teacher doesn't allow phones"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What was the group's technology project about?", "section": "While you read", "options": ["Building a robot", "A guide about using learning apps responsibly", "Designing a new classroom"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The writer believes technology should completely replace talking, reading and writing.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The writer believes technology should support learning, not replace it.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does the writer probably feel about the app after two weeks?", "section": "While you read", "options": ["Disappointed", "Positive, but realistic about its limits", "Bored"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Would you like to try a vocabulary app like this? Why or why not?", "Write one rule you would add to a 'using learning apps responsibly' guide."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning Our Technology Project", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning their 'ideal classroom' technology project.", "Predict: what jobs or roles might they need for the project? Think of two."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning Our Technology Project", "audio": null, "transcript": [{"speaker": "Kaan", "line": "So, for our project, we have to describe the ideal use of technology in the classroom. Where should we start?"}, {"speaker": "Sude", "line": "I think the script will be written by us together, and then it can be acted out in class."}, {"speaker": "Kaan", "line": "Good idea. I'll be the teacher role — I can explain how an interactive whiteboard is used."}, {"speaker": "Sude", "line": "OK, and I'll be the student who uses a tablet to research online. Should the classroom also have a robot assistant?"}, {"speaker": "Kaan", "line": "Yes! Robots will be used to help students who need extra support, I think. Although it sounds futuristic, some schools already use them."}, {"speaker": "Sude", "line": "Nice. Because our teacher wants clear roles, let's write down exactly who says what."}, {"speaker": "Kaan", "line": "Sure. I'll organise the notes myself tonight and send them to you."}, {"speaker": "Sude", "line": "Perfect. Let's rehearse together after school tomorrow, before the deadline on Friday."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Kaan and Sude planning?", "section": "While you listen", "options": ["A school trip", "Their technology project", "A test schedule"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What role does Kaan choose?", "section": "While you listen", "options": ["The teacher", "The student", "The robot"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Sude use in her role?", "section": "While you listen", "options": ["A tablet to research online", "A printed textbook", "A telephone"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kaan thinks classroom robots are completely impossible and unrealistic.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kaan thinks it sounds futuristic, but some schools already use robots.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What will Kaan do tonight?", "section": "While you listen", "options": ["Buy a robot", "Organise the notes himself", "Call the teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["If you did a similar project, which role would you choose? Why?", "Write one sentence using 'will be used' about future classroom technology."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "At the Future Classroom Exhibition", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a guide talking to students at a 'Future Classroom' technology exhibition.", "Guess: what kind of technology might be shown at an exhibition like this?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "At the Future Classroom Exhibition", "audio": null, "transcript": [{"speaker": "Guide", "line": "Welcome to the Future Classroom exhibition! Here you can see the tools that may be used in schools in the next ten years."}, {"speaker": "Elif", "line": "Wow, is that a hologram? It looks like a real 3D map floating in the air!"}, {"speaker": "Guide", "line": "Yes, holograms like this could be used to teach geography or science without any books at all."}, {"speaker": "Elif", "line": "That's amazing. And what about that small machine over there?"}, {"speaker": "Guide", "line": "That's a classroom robot. Although it can't replace a teacher, it can be used to help students who work at a different pace."}, {"speaker": "Elif", "line": "Because it uses artificial intelligence, can it check my writing itself?"}, {"speaker": "Guide", "line": "Exactly! It corrects simple mistakes itself and shows the student a clearer explanation."}, {"speaker": "Elif", "line": "This has given me so many ideas for our technology project. Thank you!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Where does this conversation happen?", "section": "While you listen", "options": ["At a technology exhibition", "In a normal classroom", "At a school meeting"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What could holograms be used for, according to the guide?", "section": "While you listen", "options": ["Teaching geography or science", "Charging devices", "Cleaning the classroom"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What can the classroom robot do?", "section": "While you listen", "options": ["Completely replace a teacher", "Help students who work at a different pace", "Teach only mathematics"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The guide says the robot can never check anyone's writing.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The guide says the robot can check simple mistakes itself.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": " ekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Presenting Our Future Classroom", "text": "With a partner, act out a short presentation for the performance project: one of you is a student and the other is a teacher in an ideal future classroom. Describe the tools you use and how technology helps you learn.", "steps": ["Decide on the tools your future classroom has (e.g. holograms, a classroom robot, an online platform).", "Decide who is the Teacher and who is the Student in the scene.", "Write 4-6 lines each, using at least two grammar points from this theme.", "Practise your roles together, then perform for another pair or the class.", "Give feedback: name one strong point in your classmates' performance."], "chips": ["In our classroom, homework will be uploaded automatically.", "Students can teach themselves new topics with this app.", "Although the robot helps us, our teacher is still the most important person here.", "Because we use these tools, lessons are more interesting."], "timer": 600, "levels": ["Provide sentence starters on cards for lower-level students.", "A 4-6 line role-play for each student, performed live.", "Groups add a short 'question time' at the end where the audience asks the roles one question."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Guide to Using Classroom Technology Responsibly", "text": "Write a short guide for new students titled 'Using Our Classroom Technology Responsibly'. Include at least two rules with the passive voice (will be / must be / can be + past participle) and one sentence with a connecting word.", "steps": ["Choose a title for your guide.", "List 3-4 rules using the passive voice with future tenses or modals.", "Add one sentence with a connecting word (because, so, although, after).", "Check your
