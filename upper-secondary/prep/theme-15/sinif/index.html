renci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: How long ___ the company ___ (pollute) the river before the fine?", "section": "Dialogue · Complete with the Past Perfect Progressive.", "reveal": "had / been polluting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: It ___ (pollute) it for almost ten years — nobody had stopped them.", "section": "Dialogue · Complete with the Past Perfect Progressive.", "reveal": "had been polluting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a conservation project.", "section": "Dialogue · Complete with the Past Perfect Progressive.", "words": ["how", "long", "had", "the", "rangers", "been", "protecting", "the", "reserve"], "end": "?", "reveal": "How long had the rangers been protecting the reserve?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Third Conditional: unreal past situations and their results", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["If people <mark>hadn't cut down<\/mark> so many trees, the animals <mark>wouldn't have lost<\/mark> their habitat.", "If we <mark>had protected<\/mark> the river earlier, the fish population <mark>wouldn't have disappeared<\/mark>.", "The tigers <mark>would have survived<\/mark> if hunters <mark>hadn't killed<\/mark> so many of them.", "If scientists <mark>hadn't warned<\/mark> us about climate change, more species <mark>would have become<\/mark> extinct."], "ask": "Are these real situations or imagined ones about the past? What tense follows 'if'? What comes in the result clause?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["if + Past Perfect", "would have + past participle", "unreal", "past"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Third Conditional sentences talk about ___ situations in the ___ that did not really happen.", "section": "Complete the rule", "reveal": "unreal / past / unreal / past", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The if-clause uses ___: If people hadn't cut down so many trees…", "section": "Complete the rule", "reveal": "if + Past Perfect", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The result clause uses ___: …the animals wouldn't have lost their habitat.", "section": "Complete the rule", "reveal": "would have + past participle", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the Third Conditional (If + Past Perfect, … would have + past participle) to talk about an unreal, imagined situation in the past and its imagined result — the opposite of what really happened.", "tr": "Third Conditional, geçmişte gerçekleşmemiş, hayalî bir durumu ve onun (yine geçmişte kalan) hayalî sonucunu anlatır: If + Past Perfect, … would have + V3.", "when_en": "We use it to discuss the consequences of environmental action that was, or wasn't, taken in the past.", "when": "Geçmişte alınmayan bir çevresel önlemin sonuçlarını, ya da alınan bir önlemin neyi engellediğini tartışırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["people / not cut down / so many trees", "the animals / not lose / their habitat"], "reveal": "If people hadn't cut down so many trees, the animals wouldn't have lost their habitat.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we / protect / the river earlier", "the fish population / not disappear"], "reveal": "If we had protected the river earlier, the fish population wouldn't have disappeared.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["hunters / not kill / so many tigers", "the tigers / survive"], "reveal": "If hunters hadn't killed so many tigers, the tigers would have survived.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["scientists / not warn / us about climate change", "more species / become extinct"], "reveal": "If scientists hadn't warned us about climate change, more species would have become extinct.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the factory / not release / chemicals into the lake", "the water / stay / clean"], "reveal": "If the factory hadn't released chemicals into the lake, the water would have stayed clean.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the government / ban / plastic bags earlier", "there / be / less pollution today"], "reveal": "If the government had banned plastic bags earlier, there would have been less pollution today.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two Third Conditional sentences about a real environmental problem: one about what would have happened if people hadn't acted, and one about what would have happened if they had acted sooner.", "chips": ["If people hadn't …, …", "If … had … earlier, …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["If we had protected the river earlier, the fish population would have survived.", "The forest would have recovered if people had stopped cutting trees."], "negative": ["If people hadn't cut down so many trees, the animals wouldn't have lost their habitat.", "The species wouldn't have become extinct if hunters hadn't hunted it."], "question": ["What would have happened if we hadn't protected the reserve?", "Would the river have stayed clean if the factory hadn't polluted it?"], "short": ["Yes, it would. / No, it wouldn't have.", "Yes, they would have. / No, they wouldn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If people didn't cut down so many trees, the animals wouldn't have lost their habitat.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If people hadn't cut down so many trees, the animals wouldn't have lost their habitat.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The tigers would survive if hunters hadn't killed so many of them.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The tigers would have survived if hunters hadn't killed so many of them.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "If people ___ so many trees, the animals wouldn't have lost their habitat.", "section": "A · Choose the correct option.", "options": ["didn't cut down", "hadn't cut down", "don't cut down"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The tigers ___ if hunters hadn't killed so many of them.", "section": "A · Choose the correct option.", "options": ["would survive", "would have survived", "survived"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "If we had protected the river earlier, the fish population ___.", "section": "A · Choose the correct option.", "options": ["wouldn't disappear", "wouldn't have disappeared", "didn't disappear"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If scientists ___ (not warn) us, more species would have become extinct.", "section": "B · Complete with the correct form.", "reveal": "hadn't warned", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The water ___ (stay) clean if the factory hadn't released chemicals into the lake.", "section": "B · Complete with the correct form.", "reveal": "would have stayed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If the government ___ (ban) plastic bags earlier, there would have been less pollution.", "section": "B · Complete with the correct form.", "reveal": "had banned", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "If we hadn't protected the reserve, more animals would disappear.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If we hadn't protected the reserve, more animals would have disappeared.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "If hunters hadn't killed so many tigers, the tigers would have survived.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ (happen) if nobody had protected this forest?", "section": "Dialogue · Complete with the Third Conditional.", "reveal": "would have happened", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: If nobody ___ (protect) it, it ___ (disappear) years ago.", "section": "Dialogue · Complete with the Third Conditional.", "reveal": "had protected / would have disappeared", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "People cut down the forest. The animals lost their habitat.", "section": "Dialogue · Complete with the Third Conditional.", "reveal": "If people hadn't cut down the forest, the animals wouldn't have lost their habitat.", "prompt": "Join the ideas with a Third Conditional sentence.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Forest That Had Been Disappearing", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think had been happening to the forest?", "Guess: what are two reasons a rainforest might disappear?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Forest That Had Been Disappearing", "num": 1, "total": 5, "text": "For hundreds of years, a huge rainforest had been growing quietly in South America, home to millions of species of plants and animals. But in the last fifty years, large areas had been cut down for farming and wood before governments and scientists finally took real action.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Forest That Had Been Disappearing", "num": 2, "total": 5, "text": "By the early 2000s, companies had been cutting down trees so quickly that scientists warned an area the size of a small country was disappearing every year. Local communities, who had been living in the forest for generations, lost their homes and their traditional way of life.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Forest That Had Been Disappearing", "num": 3, "total": 5, "text": "Then environmental groups started a new project. They had been working with local farmers for two years when a new law banned illegal logging in the most important areas. Farmers received support to grow crops without destroying more trees.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Forest That Had Been Disappearing", "num": 4, "total": 5, "text": "Today, the deforestation rate in that region is much lower than it was twenty years ago. Scientists say that if people hadn't acted when they did, thousands more species would have lost their habitat forever.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Forest That Had Been Disappearing", "num": 5, "total": 5, "text": "The story of this rainforest shows that natural resources can recover — but only if people protect them before it is too late.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A forest region that reduced its deforestation rate after action was taken", "A new law about farming machines", "A list of animal species in South America"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who lost their homes and traditional way of life?", "section": "While you read", "options": ["Scientists", "Local communities", "Environmental groups"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What had companies been doing by the early 2000s?", "section": "While you read", "options": ["Planting new trees", "Cutting down trees very quickly", "Studying local animals"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What did the new law do?", "section": "While you read", "options": ["It banned illegal logging in important areas", "It closed all farms in the region", "It stopped tourism in the forest"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The deforestation rate today is higher than it was twenty years ago.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The deforestation rate today is much lower than it was twenty years ago.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the text suggest about natural resources?", "section": "While you read", "options": ["They always disappear completely once damaged", "They can recover if people protect them in time", "They are not important for local communities"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What natural resources are important in your own country? Name two.", "Do you think laws are the best way to protect forests? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Saving the Sea Turtles", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title and think: why might sea turtles be in danger?", "Guess: what could ordinary people do to help protect them?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Saving the Sea Turtles", "num": 1, "total": 5, "text": "Selin is a marine biology student who spends her summers on a small research project on the coast. Before she joined, volunteers had been counting sea turtle nests for three years, and the numbers were falling fast.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Sea Turtles", "num": 2, "total": 5, "text": "Sea turtles are an endangered species because of pollution, fishing nets, and the loss of safe beaches for laying eggs. If people hadn't started protecting the nesting beaches, many more turtles would have died before reaching the sea.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Sea Turtles", "num": 3, "total": 5, "text": "Every night in the summer, Selin and the other volunteers had been walking along the beach, looking for new nests. When they find one, they mark it and protect it from dogs, birds, and careless visitors.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Sea Turtles", "num": 4, "total": 5, "text": "The project also works with local hotels. If a hotel hadn't agreed to turn off its beach lights at night, the baby turtles would have walked towards the lights instead of the sea, because they naturally follow the brightest light.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Sea Turtles", "num": 5, "total": 5, "text": "Thanks to this teamwork, the number of nests on the beach has almost doubled in five years. Selin says the project shows that ordinary people can protect wildlife if they take action together.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A student project that protects sea turtle nests on a beach", "A new law about fishing nets", "A holiday Selin took on the coast"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why are sea turtles an endangered species, according to the text?", "section": "While you read", "options": ["Because of pollution, fishing nets, and the loss of nesting beaches", "Because tourists like to watch them", "Because they migrate too far"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do the volunteers do at night in the summer?", "section": "While you read", "options": ["They walk along the beach looking for new nests", "They clean the hotel beach", "They study fish in the sea"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why do hotels turn off their beach lights at night?", "section": "While you read", "options": ["Because guests complain about the light", "Because baby turtles naturally follow the brightest light and could walk the wrong way", "Because it saves the hotel money"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The number of turtle nests on the beach has gone down in the last five years.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The number of nests has almost doubled in five years.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the text suggest about protecting wildlife?", "section": "While you read", "options": ["Only scientists can protect endangered animals", "Ordinary people can protect wildlife if they work together", "Hotels are usually against conservation projects"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Have you ever seen or read about an endangered animal in your country? Which one?", "Write two sentences about what you would do to help protect an endangered species."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Beach Clean-up Volunteers", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two volunteers talking during a beach clean-up.", "Guess: what kind of rubbish do you think they find on a beach?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Beach Clean-up Volunteers", "audio": null, "transcript": [{"speaker": "Emre", "line": "Wow, look at all this plastic! How long had people been throwing rubbish here before the clean-up started?"}, {"speaker": "Zara", "line": "I think local families had been coming here for picnics for years, and nobody had organised a clean-up before this one."}, {"speaker": "Emre", "line": "That explains it. If someone had started a project earlier, the beach wouldn't be in this state now."}, {"speaker": "Zara", "line": "True. Look, there's an old fishing net over there — animals could get trapped in it."}, {"speaker": "Emre", "line": "We should cut it up before we throw it away. If that net had stayed in the sea, it would have hurt more fish and turtles."}, {"speaker": "Zara", "line": "Exactly. Natural resources like clean beaches don't protect themselves — people have to take action."}, {"speaker": "Emre", "line": "How many bags have we filled so far?"}, {"speaker": "Zara", "line": "Six! And we've only been working for an hour. Let's keep going."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Emre and Zara doing?", "section": "While you listen", "options": ["Cleaning up rubbish on a beach", "Fishing on a beach", "Building a new beach path"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to Zara, what had local families been doing at the beach for years?", "section": "While you listen", "options": ["Cleaning the beach", "Having picnics", "Studying sea animals"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Emre find that could trap animals?", "section": "While you listen", "options": ["A plastic bottle", "An old fishing net", "A broken chair"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Emre thinks the fishing net was not dangerous for sea animals.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Emre thinks it would have hurt more fish and turtles if it had stayed in the sea.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How many bags have they filled so far?", "section": "While you listen", "options": ["Four", "Six", "Ten"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Have you ever taken part in a clean-up or a similar volunteer project? What happened?", "Write one sentence about something you would have done differently if you had been at the beach."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning an Endangered Species Project", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning a class project about an endangered animal.", "Predict: what information does a good project about an animal usually include?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning an Endangered Species Project", "audio": null, "transcript": [{"speaker": "Aslı", "line": "So for our project, I think we should choose the Anatolian leopard — it's an endangered species in Türkiye."}, {"speaker": "Kerem", "line": "Good idea. Scientists had been searching for proof that it still existed for a long time before they finally found evidence a few years ago."}, {"speaker": "Aslı", "line": "Really? If they hadn't found that evidence, people might have thought the species was already extinct."}, {"speaker": "Kerem", "line": "Exactly. We should explain its habitat, the threats it faces, and what conservation groups are doing now."}, {"speaker": "Aslı", "line": "I can research the habitat and the threats. Can you look at the conservation projects?"}, {"speaker": "Kerem", "line": "Sure. If we finish the research by Friday, we'll have enough time to make a good poster."}, {"speaker": "Aslı", "line": "We also have to think about a presentation — maybe we could role-play as environmentalists explaining the project."}, {"speaker": "Kerem", "line": "I like that. Let's meet in the library tomorrow to plan the poster together."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Which animal do Aslı and Kerem choose for their project?", "section": "While you listen", "options": ["The Anatolian leopard", "The mountain gorilla", "A sea turtle"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What had scientists been doing before they found evidence?", "section": "While you listen", "options": ["Feeding the animal in a zoo", "Searching for proof that it still existed", "Writing a book about forests"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What will Aslı research?", "section": "While you listen", "options": ["The habitat and the threats", "The conservation projects only", "The history of the school"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do they want to do in the presentation?", "section": "While you listen", "options": ["Show a film", "Role-play as environmentalists", "Sing a song"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kerem thinks they don't need a poster for their project.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kerem wants to make a good poster and plans to work on it with Aslı tomorrow.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Which endangered animal would you choose for a project? Why?", "Write one sentence about a threat facing an animal in your country."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "If We Hadn't Protected It…", "text": "With a partner, discuss what would have happened to different natural resources or animals if people had not taken action to protect them. Use the Third Conditional.", "steps": ["Look at four picture cards: a forest, a river, an endangered animal, a coral reef.", "With your partner, discuss what might have happened to each one without protection.", "Make at least four sentences with the Third Conditional (if + hadn't/had, would have).", "Listen to your partner's sentences and ask one follow-up question each.", "Share your favourite sentence with the class."], "chips": ["If people hadn't protected …, … would have …", "If we hadn't banned …, …", "What do you think would have happened if …?", "I think … would have disappeared / survived."], "timer": 600, "levels": ["Give sentence frames on cards for lower-level students.", "4 Third Conditional sentences about natural resources or animals.", "Fast finishers add a fifth picture of their own choice."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Conservationist Interview", "text": "Role-play an interview between a journalist and a conservationist about an environmental project. This helps you prepare for your performance task.", "steps": ["Decide who is the journalist and who is the conservationist.", "The conservationist chooses a project (protecting a forest, an animal, a river, etc.).", "The journalist prepares four questions using this theme's grammar and vocabulary.", "Act out the interview.", "Swap roles and interview about a different project."], "chips": ["What had you been doing before this project started?", "Why is this habitat / species important?", "What would have happened if you hadn't acted?", "In my opinion, …"], "timer": 600, "levels": ["Provide question starters for the journalist.", "A 4-question interview role-play.", "Record your interview, or present it to another pair."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "An Environmental Problem and Solutions", "text": "Write a short report about an environmental problem (for example deforestation, pollution, or an endangered species) and suggest two solutions. This will help you prepare for your performance task project.", "steps": ["Choose one environmental problem to focus on.", "Note 2-3 facts about the problem (use the Third Conditional or Past Perfect Progressive if useful).", "Write two clear solutions or actions people could take.", "Check your grammar and vocabulary before finishing."], "chips": ["natural resource", "pollution", "endangered species", "conservation", "sustainable", "raise awareness", "The main problem is…", "If people hadn't…, …", "One solution would be to…", "We should…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Proposal for a Conservation Project", "text": "Write a short proposal for a class project that protects natural resources or an endangered animal — this is a first draft for your performance task. Explain the problem, what your project will do, and why it matters.", "steps": ["Choose a natural resource or animal to focus your project on.", "Explain the threat it faces in 1-2 sentences.", "Describe what your project will do, step by step.", "Add one sentence about the result you hope for."], "chips": ["habitat", "wildlife reserve", "conservation", "ecosystem", "take action", "recycle", "Our project will focus on…", "If we don't act now, …", "We plan to…", "We hope that…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'endangered species'", "section": "Exit ticket", "options": ["an animal that migrates every year", "a type of animal or plant at risk of disappearing forever", "a place where animals live"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'deforestation' mean?", "section": "Exit ticket", "options": ["cutting down large areas of forest", "planting new trees", "protecting an ecosystem"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does it mean to 'raise awareness' about a problem?", "section": "Exit ticket", "options": ["to solve the problem completely", "to help more people understand and notice the problem", "to ignore the problem"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Scientists ___ the reef for a decade when they found the damage.", "section": "Exit ticket", "options": ["study", "had been studying", "have studied"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The elephants ___ (migrate) to that area every winter until their habitat disappeared.", "section": "Exit ticket", "reveal": "had been migrating", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "If people ___ so many trees, the animals wouldn't have lost their habitat.", "section": "Exit ticket", "options": ["didn't cut down", "hadn't cut down", "don't cut down"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The tigers ___ (survive) if hunters hadn't killed so many of them.", "section": "Exit ticket", "reveal": "would have survived", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "In 'The Forest That Had Been Disappearing', what did the new law do?", "section": "Exit ticket", "options": ["It banned illegal logging in the most important areas", "It closed all the local farms", "It stopped tourists visiting the forest"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In 'Saving the Sea Turtles', the number of nests on the beach has gone down in five years.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The number of nests has almost doubled in five years.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In 'Saving the Sea Turtles', why do hotels turn off their beach lights at night?", "section": "Exit ticket", "options": ["To save money", "Because baby turtles follow the brightest light", "Because guests are asleep"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
