h the Past Progressive.", "words": ["were", "you", "sleeping", "when", "the", "storm", "started"], "end": "?", "reveal": "Were you sleeping when the storm started?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Past Progressive vs Simple Past: interrupted actions", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["We <mark>were walking<\/mark> along the trail when we <mark>saw<\/mark> a deer.", "The rain <mark>started<\/mark> while we <mark>were setting up<\/mark> the tent.", "I <mark>was reading<\/mark> my compass when my friend <mark>called<\/mark> me.", "Lightning <mark>struck<\/mark> a tree while we <mark>were hiding<\/mark> under the rocks."], "ask": "Which action was already in progress (longer)? Which action interrupted it (shorter, sudden)?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["Past Progressive", "Simple Past", "when", "while"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The longer, background action is in the ___.", "section": "Complete the rule", "reveal": "Past Progressive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The shorter action that interrupts it is in the ___.", "section": "Complete the rule", "reveal": "Simple Past", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We often use ___ before the shorter, interrupting action.", "section": "Complete the rule", "reveal": "when", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We often use ___ before the longer, background action.", "section": "Complete the rule", "reveal": "while", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "When one action was in progress and a second, shorter action interrupted it, we use the Past Progressive for the longer action and the Simple Past for the shorter one. 'When' usually goes before the shorter action, and 'while' before the longer one.", "tr": "Bir eylem geçmişte devam ederken başka bir eylem onu kesintiye uğratırsa, uzun süren eylem için Past Progressive, kısa/ani eylem için Simple Past kullanılır. 'When' genellikle kısa eylemden önce, 'while' ise uzun eylemden önce gelir.", "when_en": "We use it to say that something suddenly happened while we were doing an outdoor activity, for example seeing a deer while we were hiking.", "when": "Doğada bir aktivite sürerken aniden başka bir şeyin olduğunu anlatırken (örneğin yürüyüş yaparken bir geyik gördük) kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we / walk along the trail", "we / see a deer"], "reveal": "We were walking along the trail when we saw a deer.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the rain / start", "we / set up the tent"], "reveal": "The rain started while we were setting up the tent.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / read my compass", "my friend / call me"], "reveal": "I was reading my compass when my friend called me.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["lightning / strike a tree", "we / hide under the rocks"], "reveal": "Lightning struck a tree while we were hiding under the rocks.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we / cross the river", "the storm / begin"], "reveal": "We were crossing the river when the storm began.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences about something that happened while you were doing an outdoor activity. Use when or while.", "chips": ["I was … when …", "While we were …, …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["We were walking when we saw a deer.", "The storm started while we were camping."], "negative": ["We weren't sleeping when the storm started.", "It wasn't raining when we left."], "question": ["What were you doing when the storm started?", "Were you hiking when it began to rain?"], "short": ["I was reading n", "during"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We ___ (cross) the river when the storm ___ (begin).", "section": "B · Complete with the correct form.", "reveal": "were crossing / began", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I ___ (not/watch) the wildlife when it ___ (start) to rain.", "section": "B · Complete with the correct form.", "reveal": "wasn't watching / started", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "We were walking along the cliff when we were seeing the waterfall.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We were walking along the cliff when we saw the waterfall.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "While we were camping, a storm began suddenly.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ you ___ (do) when the flood ___ (start)?", "section": "Dialogue · Complete with the correct form.", "reveal": "were / doing / started", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: We ___ (sleep) in our tent.", "section": "Dialogue · Complete with the correct form.", "reveal": "were sleeping", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a sentence: hiking / saw / we / a waterfall / were / when", "section": "Dialogue · Complete with the correct form.", "words": ["we", "were", "hiking", "when", "we", "saw", "a", "waterfall"], "end": ".", "reveal": "We were hiking when we saw a waterfall.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Could: past ability", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["My grandfather <mark>could climb<\/mark> mountains easily when he was young.", "We <mark>couldn't see<\/mark> the trail because of the heavy rain.", "<mark>Could you swim<\/mark> across the river when you were a child?", "Yes, I <mark>could<\/mark>. — No, I <mark>couldn't<\/mark>."], "ask": "How do we talk about a general ability in the past? How do we make it negative and ask questions?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["could", "couldn't", "Could", "base verb"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use ___ + base verb to talk about a general ability in the past.", "section": "Complete the rule", "reveal": "could", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative form is ___ + base verb.", "section": "Complete the rule", "reveal": "couldn't / could not", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a question, we start with ___ + subject + base verb.", "section": "Complete the rule", "reveal": "Could", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After could/couldn't, the verb is in its ___ form (no -s, no -ing).", "section": "Complete the rule", "reveal": "base verb / base form", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Could is used to talk about a general ability in the past (something we were able to do, for example as a child). The negative is couldn't, and the question is Could + subject + base verb.", "tr": "Could, geçmişte genel bir yeteneği anlatmak için kullanılır (örneğin çocukken yapabildiğimiz şeyler). Olumsuzu couldn't, sorusu ise Could + özne + yalın fiil şeklindedir.", "when_en": "We use it to talk about general abilities in nature in the past, like being able to climb, swim, or find the way.", "when": "Doğada geçmişte yapabildiğimiz ya da yapamadığımız genel şeyleri anlatırken kullanılır: tırmanabilmek, yüzebilmek, yön bulabilmek gibi.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["my grandfather", "climb mountains easily", "when he was young"], "reveal": "My grandfather could climb mountains easily when he was young.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not / see the trail", "because of the heavy rain"], "reveal": "We couldn't see the trail because of the heavy rain.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "swim across the river", "when you were a child"], "reveal": "Could you swim across the river when you were a child?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the guide", "find the cave", "in the dark"], "reveal": "The guide could find the cave in the dark.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not / start a campfire", "because everything was wet"], "reveal": "We couldn't start a campfire because everything was wet.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences about something you could or couldn't do outdoors when you were younger.", "chips": ["When I was younger, I could …", "I couldn't …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk y of wildlife, including deer and colourful birds. My little sister could name almost every bird we saw!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend Camping Trip", "num": 3, "total": 5, "text": "In the afternoon, we made a campfire and cooked simple food. While we were cooking, my dad told stories about his own camping trips when he was young. He said he could survive for days with just a small backpack and a compass.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend Camping Trip", "num": 4, "total": 5, "text": "At night, the sky was full of stars, and we couldn't hear any city noise at all — only the wind in the trees. We were sitting around the campfire when we suddenly heard an owl.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend Camping Trip", "num": 5, "total": 5, "text": "The next morning, before we left, we checked our tent for any damage and cleaned up the campsite. It was a simple weekend, but it taught me how much I love spending time in nature.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A dangerous adventure in the mountains", "A family's weekend camping trip", "How to build a tent"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where did the family go camping?", "section": "While you read", "options": ["Near Lake Abant", "On a beach", "In a city park"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What were they doing when they heard the owl?", "section": "While you read", "options": ["Hiking on the trail", "Sitting around the campfire", "Sleeping in the tent"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What did the writer's father say he could do when he was young?", "section": "While you read", "options": ["Climb any mountain", "Survive for days with a small backpack and a compass", "Find any wildlife"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The family heard a lot of city noise at night.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They couldn't hear any city noise — only the wind in the trees.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does the writer probably feel about the trip?", "section": "While you read", "options": ["Bored and tired", "Positive — it taught them to love nature", "Scared of the wildlife"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What daily activities would you like to do on a camping trip? List two.", "Compare this camping trip with a trip you have had or imagined. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Caught in a Storm on Uludağ", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What extreme weather conditions can be dangerous for hikers?", "Guess: what should hikers do if a storm starts suddenly?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Caught in a Storm on Uludağ", "num": 1, "total": 6, "text": "Two years ago, Kaan and his cousin Derin went on a hiking adventure on Uludağ. They were walking along a narrow trail near a cliff when the weather suddenly changed.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Caught in a Storm on Uludağ", "num": 2, "total": 6, "text": "Dark clouds appeared quickly, and soon they heard thunder in the distance. 'We should find shelter now,' said Kaan, looking at the sky nervously. They couldn't see the trail clearly because of the heavy rain.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Caught in a Storm on Uludağ", "num": 3, "total": 6, "text": "While they were looking for shelter, they found a small cave near a waterfall. They quickly went inside and waited for the storm to pass. Lightning struck a tree close to the cave, and they were both frightened.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Caught in a Storm on Uludağ", "num": 4, "total": 6, "text": "Kaan remembered his father's advice: 'You should always carry a compass and extra water on a hike, and you shouldn't panic in a storm.' He used his compass to check their direction while they waited.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Caught in a Storm on Uludağ", "num": 5, "total": 6, "text": "After almost an hour, the storm finally stopped. They were cold and wet, but they were safe. They walked back to the campsite carefully, using the compass to find the right path.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Caught in a Storm on Uludağ", "num": 6, "total": 6, "text": "Kaan says this adventure taught him an important lesson: nature can be beautiful, but you should always be prepared for extreme weather.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is this story mainly about?", "section": "While you read", "options": ["Two hikers finding wildlife", "Two hikers caught in a sudden storm", "A family camping trip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where did Kaan and Derin find shelter?", "section": ciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where do they find shelter?", "section": "While you listen", "options": ["In a small cave near a waterfall", "Under a tree", "In their tent"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What was Aslı's father's job?", "section": "While you listen", "options": ["A teacher", "A mountain guide", "A librarian"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What should they do at the end?", "section": "While you listen", "options": ["Keep hiking in the storm", "Wait until the thunder stops, then walk back carefully", "Call for a rescue team"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Ege thinks they should stay on the open trail during the storm.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ege thinks they shouldn't stay on the open trail during the storm.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Have you ever been outside during a storm? What did you do?", "Write one sentence with 'should' about what to do during a storm."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning an Adventure", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two friends planning a nature adventure for the weekend.", "Predict: what could they do — hiking, canoeing, or exploring a cave?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning an Adventure", "audio": null, "transcript": [{"speaker": "Deniz", "line": "So, for our weekend adventure, what should we do — hike to the waterfall or explore the cave?"}, {"speaker": "Mira", "line": "I think we should explore the cave. I could never go inside a cave before, so it would be exciting."}, {"speaker": "Deniz", "line": "Good idea! But we should take a compass and torches, just in case."}, {"speaker": "Mira", "line": "Definitely. My brother went caving last year, and he said you shouldn't go without a map."}, {"speaker": "Deniz", "line": "OK, I'll check the weather forecast tonight — we shouldn't go if there's a storm coming."}, {"speaker": "Mira", "line": "Good thinking. And we should set up camp near the cave the night before."}, {"speaker": "Deniz", "line": "Perfect. I could ask my cousin to join us too — he's really good with a compass."}, {"speaker": "Mira", "line": "Great! Let's meet at 8 a.m. on Saturday."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Deniz and Mira planning?", "section": "While you listen", "options": ["A camping trip only", "A weekend adventure to a cave", "A trip to the beach"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Mira say she could never do before?", "section": "While you listen", "options": ["Hike a long trail", "Go inside a cave", "Use a compass"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What did Mira's brother say about caving?", "section": "While you listen", "options": ["You shouldn't go without a map", "You should always go alone", "Caves are never dangerous"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz thinks they should go even if there's a storm coming.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz thinks they shouldn't go if there's a storm coming.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Who might join them on the adventure?", "section": "While you listen", "options": ["Mira's brother", "Deniz's cousin", "Their teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["If you planned a nature adventure, would you choose hiking, caving, or something else? Why?", "Write one sentence with 'should' about preparing for an adventure."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Find Someone Who… a Nature Story", "text": "Walk around the class and ask your classmates questions with Could you…?, Were you …ing…? and Should…? to find someone who matches each sentence about nature experiences. Write their name next to the sentence.", "steps": ["Loo s for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You ___ hike alone in extreme weather.", "section": "Exit ticket", "options": ["should", "shouldn't", "could"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In 'A Weekend Camping Trip', what were they doing when they heard the owl?", "section": "Exit ticket", "options": ["Hiking on the trail", "Sitting around the campfire", "Sleeping in the tent"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In 'Caught in a Storm', Kaan and Derin could see the trail clearly during the storm.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They couldn't see the trail clearly because of the heavy rain.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
