nci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "She had visit five capitals before she was eighteen.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She had visited five capitals before she was eighteen.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you ___ (visit) the landmark before your trip this year?", "section": "Dialogue · Complete with the Past Perfect.", "reveal": "Had / visited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: No, I ___ (not / see) it before, but my brother ___ (already / go) there twice.", "section": "Dialogue · Complete with the Past Perfect.", "reveal": "hadn't seen / had already gone", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a past trip.", "section": "Dialogue · Complete with the Past Perfect.", "words": ["had", "you", "booked", "the", "hotel", "before", "you", "left"], "end": "?", "reveal": "Had you booked the hotel before you left?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Reported speech (mixed tenses): reporting what people said about their travels", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Deniz said, \"I visited three capitals last year.\" → Deniz said (that) <mark>she had visited<\/mark> three capitals the year before.", "Elif said, \"I'm going to the pyramids next month.\" → Elif said (that) <mark>she was going<\/mark> to the pyramids the following month.", "Mert said, \"The landmark is amazing.\" → Mert said (that) the landmark <mark>was<\/mark> amazing.", "The guide said, \"I have worked here for ten years.\" → The guide said (that) <mark>he had worked<\/mark> there for ten years."], "ask": "How does the verb tense change when we report what someone said? What happens to words like 'next month' or 'here'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["one step back", "the following month", "there", "that"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "In reported speech, the verb usually moves ___ in time (present → past, past → past perfect).", "section": "Complete the rule", "reveal": "one step back", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'here' in direct speech often becomes ___ in reported speech.", "section": "Complete the rule", "reveal": "there", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'next month' in direct speech often becomes ___ in reported speech.", "section": "Complete the rule", "reveal": "the following month", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We can introduce reported speech with the word ___, which is often optional.", "section": "Complete the rule", "reveal": "that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "In reported speech, the verb usually moves one tense back: Present Simple → Past Simple, Past Simple → Past Perfect, be going to → was/were going to, Present Perfect → Past Perfect. Time and place words also change: now → then, here → there, tomorrow → the next day.", "tr": "Reported speech'te (dolaylı anlatım), söylenen cümleyi kendi cümlemizmiş gibi aktarırken fiil genellikle bir zaman geriye kayar: Present Simple → Past Simple, Past Simple → Past Perfect, be going to → was/were going to, Present Perfect → Past Perfect. Zaman/yer zarfları da değişir: now→then, here→there, tomorrow→the next day.", "when_en": "We use it when telling someone else what a person said about their travels, cultures or places, and it requires mixing different past tenses correctly.", "when": "Birinin seyahatler, kültürler veya yerler hakkında söylediklerini başka birine aktarırken kullanılır; farklı geçmiş zamanların doğru sırayla kullanılmasını gerektirir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Aylin", "\"I love this city.\""], "reveal": "Aylin said (that) she loved that city.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the tour guide", "\"This monument is 500 years old.\""], "reveal": "The tour guide said (that) that monument was 500 years old.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Can", "\"I visited the capital last summer.\""], "reveal": "Can said (that) he had visited the capital the previous summer.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Zeynep", "\"I'm going to travel to five countries next year.\""], "reveal": "Zeynep said (that) she was going to travel to five countries the following year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the local", "\"We don't shake hands here.\""], "reveal": "The local said (that) they didn't shake hands there.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Emre", "\"I have never seen such a breathtaking view.\""], "reveal": "Emre said (that) he had never seen such a breathtaking view.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Think of something a friend or family member once said about a trip or a place. Write three reported-speech sentences about it, changing the tense correctly.", "chips": ["… said (that) …", "… told me (that) …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["She said (that) she had visited the capital.", "He said (that) he was going to travel next year."], "negative": ["They said (that) they hadn't tried the local food.", "She said (that) she didn't like the crowded landmark."], "question": ["I asked her if/whether she had enjoyed the trip."], "short": ["She said she had. / He said he hadn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She said that she visits the capital every year.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She said that she visited the capital every year.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He said he is going to travel next year.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He said he was going to travel the following year.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Deniz said (that) she ___ three capitals the year before.", "section": "A · Choose the correct option.", "options": ["visits", "visited", "had visited"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The guide said (that) the monument ___ over 500 years old.", "section": "A · Choose the correct option.", "options": ["is", "was", "were"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Elif said (that) she ___ going to visit the pyramids the following month.", "section": "A · Choose the correct option.", "options": ["is", "was", "has been"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Mert said (that) he ___ never seen such a diverse city before.", "section": "A · Choose the correct option.", "options": ["has", "had", "have"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Direct: \"I love this landmark.\" (she said) → Reported: She said (that) she ___ that landmark.", "section": "B · Report the sentence.", "reveal": "loved", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Direct: \"We don't celebrate that custom here.\" (they said) → Reported: They said (that) they ___ that custom ___.", "section": "B · Report the sentence.", "reveal": "didn't celebrate there", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Zeynep said that she is going to travel to Japan next year.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Zeynep said that she was going to travel to Japan the following year.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The tour guide said that the monument had been built in the 15th century.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Direct: Can said, \"I'm visiting the capital tomorrow.\" → Reported: Can said (that) he ___ the capital ___.", "section": "Dialogue · Report the conversation.", "reveal": "was visiting the next day", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Direct: Aylin said, \"I've never tried this cuisine before.\" → Reported: Aylin said (that) she ___ tried that cuisine before.", "section": "Dialogue · Report the conversation.", "reveal": "had never", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "\"I'm going to visit five landmarks this year,\" said Zeynep.", "section": "Dialogue · Report the conversation.", "reveal": "Zeynep said (that) she was going to visit five landmarks that year.", "prompt": "Rewrite as reported speech.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Past modals: could / should / would / might have V3", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["We missed the flight — we <mark>should have checked<\/mark> the time more carefully.", "The tourist was lost; he <mark>could have asked<\/mark> someone for directions.", "It's a shame you weren't there — you <mark>would have loved<\/mark> the ancient ruins.", "She didn't answer her phone. She <mark>might have been<\/mark> visiting the museum."], "ask": "Do these sentences talk about the present or the past? What do they say about things that did or didn't happen?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["should have", "could have", "might have", "would have"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "___ + V3 is used to criticise a past action that didn't happen (regret/advice about the past).", "section": "Complete the rule", "reveal": "should have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ + V3 shows a past possibility that didn't actually happen.", "section": "Complete the rule", "reveal": "could have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ + V3 shows a guess about a past situation — we are not sure.", "section": "Complete the rule", "reveal": "might have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ + V3 imagines what would have happened in a different past situation.", "section": "Complete the rule", "reveal": "would have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Modal + have + V3 is used for things in the past that didn't happen, or that we are not sure about. Should have: something that didn't happen but should have (regret/criticism). Could have: a past possibility that didn't happen. Might/may have: an unsure guess about the past. Would have: imagining what would have happened in a different past situation.", "tr": "Modal + have + V3 yapısı, geçmişte gerçekleşmemiş ya da gerçekleşip gerçekleşmediğinden emin olmadığımız durumlar için kullanılır. Should have: geçmişte yapılmayan ama yapılması gereken bir şey (pişmanlık/eleştiri). Could have: geçmişte mümkün olan ama olmayan bir seçenek. Might/may have: geçmiş hakkında emin olmayan bir tahmin. Would have: farklı bir geçmiş durumda ne olacağını hayal etme.", "when_en": "We use these to criticise a travel mistake, talk about a missed opportunity, or guess about something that might have happened in the past.", "when": "Bir seyahat hatasını eleştirirken, kaçırılan bir fırsatı anlatırken ya da geçmişte olabilecek bir şeyi tahmin ederken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we / miss the flight", "should / check the time"], "reveal": "We should have checked the time.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["he / get lost", "could / ask for directions"], "reveal": "He could have asked for directions.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you / not go", "you / love the landmark"], "reveal": "You would have loved the landmark.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she / not answer", "might / be busy at the museum"], "reveal": "She might have been busy at the museum.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they / arrive late", "should / leave earlier"], "reveal": "They should have left earlier.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / not know the custom", "might / offend someone"], "reveal": "I might have offended someone.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Think of a travel mistake (real or imaginary). Write three sentences: one with should have (what you should have done), one with could have (another option), and one with might have (a guess about what happened).", "chips": ["I should have …", "I could have …", "Maybe I might have …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["We should have booked earlier.", "She might have taken the wrong train."], "negative": ["You shouldn't have missed the tour.", "He couldn't have known about the custom."], "question": ["Could they have arrived earlier?"], "short": ["Yes, they could have. / No, they couldn't have."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We should have go earlier.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We should have gone earlier.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She might visited the museum yesterday.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She might have visited the museum yesterday.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "We missed the flight. We ___ checked the time more carefully.", "section": "A · Choose the correct option.", "options": ["should have", "should", "should of"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "He didn't answer his phone. He ___ visiting the ancient ruins.", "section": "A · Choose the correct option.", "options": ["must have", "might have", "should have"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You didn't come with us — you ___ loved the landmark!", "section": "A · Choose the correct option.", "options": ["would have", "will have", "would"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She got lost, but she ___ asked a local for directions.", "section": "A · Choose the correct option.", "options": ["could have", "can have", "could"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I ___ (should / not eat) so much street food — now I feel unwell.", "section": "B · Complete with the correct form.", "reveal": "shouldn't have eaten", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "They ___ (might / miss) the last bus back to the hotel.", "section": "B · Complete with the correct form.", "reveal": "might have missed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "We should have book the tickets a week earlier.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We should have booked the tickets a week earlier.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "She could have offended the family by not following the local custom.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: We got lost in the old city. We ___ (should / bring) a map.", "section": "Dialogue · Complete with the correct past modal.", "reveal": "should have brought", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, or we ___ (could / ask) someone for directions.", "section": "Dialogue · Complete with the correct past modal.", "reveal": "could have asked", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Maybe they missed the flight because of traffic.", "section": "Dialogue · Complete with the correct past modal.", "reveal": "They might have missed the flight because of traffic.", "prompt": "Rewrite using might have.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Be going to: future plans for a world tour", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Next summer, we <mark>are going to visit<\/mark> three different capitals.", "She <mark>isn't going to travel<\/mark> alone — her sister is going with her.", "<mark>Are<\/mark> you <mark>going to see<\/mark> the famous landmark on your trip? — Yes, we <mark>are<\/mark>.", "Look at this itinerary — it <mark>is going to be<\/mark> an amazing tour!"], "ask": "Are these plans decided before now, or decisions made at the moment of speaking? How do we form be going to?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["am/is/are + going to + base verb", "already decided", "Are", "isn't going to"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Be going to is formed with ___.", "section": "Complete the rule", "reveal": "am/is/are + going to + base verb / am/is/are going to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use it for a future plan that is ___ before we speak.", "section": "Complete the rule", "reveal": "already decided", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative with 'she' is she ___ + base verb.", "section": "Complete the rule", "reveal": "isn't going to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a yes/no question, we start with ___ + subject + going to?", "section": "Complete the rule", "reveal": "Are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use be going to for future plans and intentions that were already decided before the moment of speaking. Form: am/is/are + going to + base verb. Negative: am not/isn't/aren't going to. Question: Am/Is/Are + subject + going to?", "tr": "Be going to, önceden karar verilmiş gelecekteki planları ve niyetleri anlatmak için kullanılır. Am/is/are + going to + yalın fiil şeklinde kurulur. Olumsuzda am not/isn't/aren't going to, soruda Am/Is/Are + özne + going to kullanılır.", "when_en": "We use it when planning a world tour, or talking about which capitals or landmarks we have already decided to visit.", "when": "Bir dünya turu planlarken ya da hangi başkentleri, simge yapıları ziyaret edeceğimizi anlatırken, önceden kararlaştırılmış planlar için kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we", "visit", "three capitals next summer"], "reveal": "We are going to visit three capitals next summer.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "not / travel", "alone"], "reveal": "She isn't going to travel alone.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "see", "the famous landmark on day two"], "reveal": "They are going to see the famous landmark on day two.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "try", "the local cuisine"], "reveal": "Are you going to try the local cuisine?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "not / take", "a plane, I'll take a train"], "reveal": "I'm not going to take a plane, I'll take a train.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the tour", "start", "at nine o'clock"], "reveal": "The tour is going to start at nine o'clock.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about your own future travel plans (real or your ideal world tour) using be going to.", "chips": ["I'm going to visit …", "I'm not going to …", "Are you going to …?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["We are going to visit the capital next month.", "She is going to see the pyramids."], "negative": ["I'm not going to travel alone.", "They aren't going to stay long."], "question": ["Are you going to try the local food?", "Is he going to visit the museum?"], "short": ["Yes, I am. / No, I'm not.", "Yes, she is. / No, she isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We going to visit the capital.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We are going to visit the capital.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She is going to visited the museum.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is going to visit the museum.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Next year, we ___ visit five different capitals.", "section": "A · Choose the correct option.", "options": ["going to", "are going to", "go to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She ___ going to travel with her family this summer.", "section": "A · Choose the correct option.", "options": ["not", "doesn't", "isn't"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you going to see the famous landmark on your trip?", "section": "A · Choose the correct option.", "options": ["Do", "Are", "Will"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Look at those clouds — it ___ rain!", "section": "A · Choose the correct option.", "options": ["is going to", "will", "going to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "They ___ (not / stay) in the capital for long — only two days.", "section": "B · Complete with the correct form.", "reveal": "aren't going to stay / are not going to stay", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I ___ (try) the local cuisine on the first night.", "section": "B · Complete with the correct form.", "reveal": "am going to try / 'm going to try", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "We is going to visit the ancient ruins tomorrow.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We are going to visit the ancient ruins tomorrow.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Are you going to write a project about your ideal world tour?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ you ___ (do) for your world tour project?", "section": "Dialogue · Complete with be going to.", "reveal": "are / going to do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (write) about three capitals and their landmarks.", "section": "Dialogue · Complete with be going to.", "reveal": "am going to write / 'm going to write", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about future travel plans.", "section": "Dialogue · Complete with be going to.", "words": ["are", "you", "going", "to", "visit", "the", "capital", "next", "year"], "end": "?", "reveal": "Are you going to visit the capital next year?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Capitals That Might Surprise You", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. Which capital cities do you already know? Name three.", "Guess: is the biggest city in a country always its capital?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Capitals That Might Surprise You", "num": 1, "total": 5, "text": "When people think of a capital city, they often imagine the biggest, busiest city in the country. But that isn't always true. In some countries, the capital is a smaller, quieter administrative city, built specially to be the seat of government.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Capitals That Might Surprise You", "num": 2, "total": 5, "text": "Brazil is a good example. Rio de Janeiro used to be the capital, but in 1960 the government had already decided to relocate the capital to a new city called Brasília. City planners had designed Brasília from nothing, in the shape of an aeroplane, in the middle of the country. Today, government buildings, embassies and diplomats fill the city, while Rio remains the more famous tourist destination.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Capitals That Might Surprise You", "num": 3, "total": 5, "text": "Another surprising example is Switzerland. Many people guess that Zürich, the biggest and richest city, is the capital. In fact, Bern, a much smaller city with a lower population, holds that role. Bern's old town, with its narrow streets and medieval towers, is now a UNESCO World Heritage Site.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Capitals That Might Surprise You", "num": 4, "total": 5, "text": "Turkey has a similar story. Istanbul is the largest city and the main cultural and economic centre, but Ankara has been the official capital since 1923, when the young republic had chosen it as a more central administrative city.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Capitals That Might Surprise You", "num": 5, "total": 5, "text": "So, before you travel, it's worth checking: is the capital the city everyone talks about, or is it a quieter place with a very different kind of importance?", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["Why capital cities are always the biggest city", "Capital cities that are not the biggest or most famous city in their country", "How to become a diplomat"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why did Brazil relocate its capital to Brasília?", "section": "While you read", "options": ["Rio de Janeiro was destroyed", "The government wanted a new, planned administrative city", "Brasília is the biggest city"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What shape was Brasília designed in?", "section": "While you read", "options": ["A circle", "An aeroplane", "A star"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 3, what is true about Bern?", "section": "While you read", "options": ["It is Switzerland's biggest city", "It is smaller than Zürich but is the capital", "It has no government buildings"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Istanbul has been the official capital of Turkey since 1923.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ankara has been the official capital of Turkey since 1923.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does the writer suggest checking before you travel?", "section": "While you read", "options": ["Because tickets are expensive", "Because the capital isn't always the city everyone knows about", "Because capitals change every year"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which country's capital surprised you most? Write two sentences.", "Choose a capital city you would like to visit and give one reason why."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Landmark and the Story Behind It", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. Which famous landmark do you think this text is about?", "Guess: was this landmark originally built for the reason people visit it today?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Landmark and the Story Behind It", "num": 1, "total": 5, "text": "Millions of tourists visit the Eiffel Tower every year, but most don't know it was almost destroyed. In 1889, the tower had been built as a temporary entrance for the World's Fair in Paris. Many people at the time thought it was ugly, and the plan was to take it down after twenty years.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Landmark and the Story Behind It", "num": 2, "total": 5, "text": "By the time the twenty years had passed, engineers had already found a new use for the tower: radio transmission. Because it was so tall, it was perfect for sending radio signals across the city. This breathtaking piece of engineering had earned itself a permanent place in Paris.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Landmark and the Story Behind It", "num": 3, "total": 5, "text": "Today, the tower attracts around seven million visitors a year, making it one of the most-visited paid landmarks in the world. Tourists climb it, take photographs from below, and watch it sparkle with lights every evening.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Landmark and the Story Behind It", "num": 4, "total": 5, "text": "This story shows something interesting about landmarks: sometimes they aren't built to become symbols. Their history, use, and the culture around them can change how people see a place over time.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Landmark and the Story Behind It", "num": 5, "total": 5, "text": "So next time you take a photo next to a famous monument, it might be worth asking: what was this place originally built for, and how did it become so important?", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["How to build a tower", "The surprising history behind a famous landmark", "The cost of visiting Paris"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why was the Eiffel Tower originally built?", "section": "While you read", "options": ["As a permanent monument", "As a temporary entrance for the World's Fair", "As a radio station"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What saved the tower from being destroyed?", "section": "While you read", "options": ["Tourists loved it", "It was useful for radio transmission", "It was too expensive to remove"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "About how many visitors does the tower attract each year?", "section": "While you read", "options": ["Around seven thousand", "Around seven hundred thousand", "Around seven million"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The Eiffel Tower was always planned as a permanent monument.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The Eiffel Tower was originally planned as a temporary structure for twenty years.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What point does the writer make at the end of the text?", "section": "While you read", "options": ["Landmarks never change their purpose", "A landmark's history and culture can change how people see it over time", "All landmarks are built for tourists"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Do you know the story behind a landmark in your own city or country? Write two sentences.", "Which capital city or landmark would you include in a project about your ideal world tour? Give one reason."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning Our Ideal World Tour", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two friends planning a world tour for a school project.", "Predict: which two or three capital cities do you think they might choose?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning Our Ideal World Tour", "audio": null, "transcript": [{"speaker": "Ada", "line": "So for our project, we're going to design our ideal world tour. Where should we start?"}, {"speaker": "Kerem", "line": "I've always wanted to visit Tokyo. I read that it had already become one of the biggest cities in the world by the 1960s."}, {"speaker": "Ada", "line": "Great choice. After Tokyo, we could visit Cairo — I'd love to see the pyramids. They're ancient, and the construction is amazing for that time."}, {"speaker": "Kerem", "line": "Good idea. And we should have added Rome from the start — I can't believe we almost forgot it!"}, {"speaker": "Ada", "line": "You're right, we should have. Let's add it as our third city. Rome has so many landmarks — the Colosseum, for example."}, {"speaker": "Kerem", "line": "Perfect. And for the cultural differences part, we could compare greetings — my cousin told me that in Japan people bow instead of shaking hands."}, {"speaker": "Ada", "line": "That's a really good example. We're going to write about three capitals, their landmarks, and their customs. This is going to be a fantastic project!"}, {"speaker": "Kerem", "line": "Definitely. Let's start writing the script for our characters tonight."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the school project about?", "section": "While you listen", "options": ["A history exam", "Designing an ideal world tour", "Learning Japanese"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which city does Kerem mention first?", "section": "While you listen", "options": ["Cairo", "Rome", "Tokyo"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What almost happened, according to Kerem?", "section": "While you listen", "options": ["They forgot to add Rome", "They forgot to add Cairo", "They lost their project notes"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What cultural difference do they plan to compare?", "section": "While you listen", "options": ["Food", "Clothes", "Greetings"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The friends decide to include only two capital cities in their project.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They decide to include three capital cities: Tokyo, Cairo and Rome.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["If you designed your own ideal world tour, which three cities would you choose? Why?", "Write one sentence with 'should have' about a plan you almost forgot."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Cultural Misunderstanding", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a conversation about a mix-up caused by cultural differences.", "Predict: what kind of misunderstanding might happen when someone visits a new country?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Cultural Misunderstanding", "audio": null, "transcript": [{"speaker": "Zeynep", "line": "You'll never guess what happened when I visited my friend's family in South Korea!"}, {"speaker": "Burak", "line": "What happened?"}, {"speaker": "Zeynep", "line": "Well, I hadn't researched the etiquette before I went, so I poured my own drink at dinner. My friend told me later that in Korea, you usually let someone else pour your drink for you."}, {"speaker": "Burak", "line": "Oh no! You should have asked her about the customs first."}, {"speaker": "Zeynep", "line": "I know, I should have! I might have offended her grandmother, but luckily she just laughed and explained the tradition."}, {"speaker": "Burak", "line": "That's a relief. Did anything else surprise you?"}, {"speaker": "Zeynep", "line": "Yes — I found out that people often remove their shoes before entering a house there, which is different from here."}, {"speaker": "Burak", "line": "Interesting. I think our project should have a section just about these small cultural differences — they're fascinating."}, {"speaker": "Zeynep", "line": "Agreed. I'm going to write about this experience for the writing task."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Where did Zeynep visit her friend's family?", "section": "While you listen", "options": ["Japan", "South Korea", "China"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What mistake did Zeynep make?", "section": "While you listen", "options": ["She poured her own drink at dinner", "She arrived late", "She wore shoes indoors"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How did the grandmother react?", "section": "While you listen", "options": ["She was very angry", "She laughed and explained the tradition", "She left the room"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In the story, people in South Korea usually keep their shoes on inside a house.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "People usually remove their shoes before entering a house.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Zeynep decide to do at the end?", "section": "While you listen", "options": ["Never visit Korea again", "Write about the experience for the writing task", "Teach Burak Korean"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Have you ever experienced or heard about a cultural misunderstanding? Describe it in two sentences.", "Write one sentence with 'should have' about researching customs before a trip."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Find Someone Who… Has Travel Dreams", "text": "Walk around the class and ask your classmates questions with Are you going to…?, Have you ever…? and Would you like to…? to find someone who matches each sentence about world travel. Write their name next to the sentence.", "steps": ["Look at your worksheet: 6 sentences about world travel dreams (e.g. '…wants to visit three capitals one day').", "Stand up and ask a classmate a question to check if the sentence is true for them.", "If it's true, write their name. If not, ask another classmate.", "Try to find a different name for each sentence.", "Sit down and share two interesting answers with the class."], "chips": ["Are you going to visit a capital city this year?", "Have you ever seen a famous landmark in real life?", "Would you like to try food from a different culture?", "Yes, I am. / No, I'm not. / Yes, I have. / No, I haven't."], "timer": 600, "levels": ["Give students the question forms in writing before they start.", "6 questions, mingling for about 10 minutes.", "Fast finishers add one more true sentence about their own travel dreams and ask it too."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Pitch Your Ideal World Tour", "text": "In your group, pitch your ideal world tour project idea to another group: which capitals you are going to include, one landmark for each, and one cultural difference you found interesting. Use reported speech to share something a classmate told you during research.", "steps": ["In your group, choose three capital cities for your ideal tour.", "Decide on one famous landmark to include for each city.", "Agree on one cultural difference between the cities that you find interesting.", "Practise your pitch, using at least two grammar points from this theme.", "Present your pitch to another group and answer their questions."], "chips": ["We are going to visit…", "One landmark we chose is…", "A classmate told me that…", "We should have researched… before we decided."], "timer": 300, "levels": ["Provide a simple pitch template with sentence starters for lower-level students.", "3 capitals, 3 landmarks, 1 cultural difference, full group pitch.", "Fast groups add a fourth city and explain why they chose it."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Two Capitals, Two Stories", "text": "Write a short guide comparing two capital cities you find interesting. Describe one landmark in each city and one cultural difference between them. Use at least two grammar points from this theme (Past Perfect, reported speech, past modals, be going to).", "steps": ["Choose two capital cities to compare.", "Note one famous landmark for each city.", "Note one cultural difference between the two places.", "Check your grammar and punctuation."], "chips": ["capital city", "landmark", "monument", "custom", "cuisine", "diverse", "By the time…, …had already…", "A friend told me that…", "You should have…", "I'm going to…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "My Ideal World Tour Project Plan", "text": "Write a first draft plan for the performance task: your ideal world tour project. Describe which capitals, landmarks and cultural differences you are going to focus on, and briefly introduce one character who represents a country in your project.", "steps": ["List the capitals and landmarks you are going to include.", "Note one cultural difference you want to show.", "Introduce one character (name, country, one thing they say or do).", "Read your plan aloud and check it makes sense as a starting draft."], "chips": ["landmark", "tradition", "etiquette", "diverse", "heritage", "attract", "We are going to…", "This character says that…", "By the time the tour starts, …", "Visitors should…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'landmark'", "section": "Exit ticket", "options": ["a famous place people recognise", "a type of food", "a kind of greeting"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'custom' mean?", "section": "Exit ticket", "options": ["a traditional way of doing something in a culture", "a type of government building", "a famous monument"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "By the time we arrived, the tour ___ already ___.", "section": "Exit ticket", "options": ["had / started", "has / started", "did / start"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Deniz said (that) she ___ three capitals the year before.", "section": "Exit ticket", "options": ["visits", "had visited", "visit"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We missed the flight — we ___ checked the time.", "section": "Exit ticket", "options": ["should have", "should", "must"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Next year, we ___ visit five different capitals.", "section": "Exit ticket", "options": ["going to", "are going to", "go to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In 'Capitals That Might Surprise You', why did Brazil relocate its capital?", "section": "Exit ticket", "options": ["The government wanted a new, planned administrative city", "Rio de Janeiro was destroyed", "It was the biggest city"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The Eiffel Tower was always planned as a permanent monument.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It was originally planned as a temporary structure for twenty years.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
