nci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Is your family going to celebrate grandpa's birthday?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ you ___ (do) for grandpa's birthday?", "section": "Dialogue · Complete with be going to.", "reveal": "are / going to do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: We ___ (bake) a cake and ___ (invite) all the relatives.", "section": "Dialogue · Complete with be going to.", "reveal": "are going to bake / are going to invite", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about weekend family plans.", "section": "Dialogue · Complete with be going to.", "words": ["are", "you", "going", "to", "visit", "your", "grandparents", "this", "weekend"], "end": "?", "reveal": "Are you going to visit your grandparents this weekend?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Present Progressive for future: arranged family plans", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["We <mark>are having<\/mark> a family lunch at my aunt's house on Sunday.", "My cousins <mark>are coming<\/mark> to stay with us next week.", "<mark>Is<\/mark> your grandma <mark>staying<\/mark> for the whole weekend?", "I<mark>'m not going<\/mark> fishing with dad tomorrow — I have homework."], "ask": "How is this similar to be going to? What makes these plans feel 'arranged' or fixed?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["am/is/are + -ing", "arranged", "fixed time", "already"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Present Progressive for future = ___.", "section": "Complete the rule", "reveal": "am/is/are + -ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use it for personal plans that are ___ with someone else, usually with a ___.", "section": "Complete the rule", "reveal": "arranged / fixed time", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The plan is ___ arranged before we speak about it.", "section": "Complete the rule", "reveal": "already", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the Present Progressive for personal future plans that are already arranged, usually with a fixed time. It is similar to be going to but often emphasises a definite arrangement with other people.", "tr": "Present Progressive, kişisel olarak önceden düzenlenmiş, genellikle belirli bir zamanı olan gelecek planları için kullanılır. Be going to'ya benzer ama daha çok başkalarıyla yapılan kesin ayarlamaları vurgular.", "when_en": "We use it to talk about family events that are already arranged for a definite time, like a lunch or a visit.", "when": "Ailece önceden planlanmış, kesin bir zamanı olan etkinlikleri (öğle yemeği, ziyaretler) anlatırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we", "have", "a family lunch", "on Sunday"], "reveal": "We are having a family lunch on Sunday.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["my cousins", "come", "to stay with us next week"], "reveal": "My cousins are coming to stay with us next week.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / your grandma", "stay", "for the whole weekend"], "reveal": "Is your grandma staying for the whole weekend?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "not / go", "fishing with dad tomorrow"], "reveal": "I'm not going fishing with dad tomorrow.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "meet", "the neighbours for dinner on Friday"], "reveal": "My parents are meeting the neighbours for dinner on Friday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not / visit", "our relatives this weekend"], "reveal": "We aren't visiting our relatives this weekend.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences about a family plan you have already arranged for next week, using the Present Progressive.", "chips": ["I am … with my family next week.", "My … is / are …ing on …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["We are having a family lunch on Sunday.", "My cousins are coming next week."], "negative": ["I'm not going fishing tomorrow.", "We aren't visiting our relatives this weekend."], "question": ["Is your grandma staying for the weekend?", "Are you meeting your cousins on Friday?"], "short": ["Yes, she is. / No, she isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We having a family lunch on Sunday.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We are having a family lunch on Sunday.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My cousins are come next week.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My cousins are coming next week.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "We ___ a family lunch on Sunday.", "section": "A · Choose the correct option.", "options": ["having", "are having", "have"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My cousins ___ to stay with us next week.", "section": "A · Choose the correct option.", "options": ["coming", "are coming", "come"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ your grandma staying for the weekend?", "section": "A · Choose the correct option.", "options": ["Is", "Do", "Are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I ___ fishing with dad tomorrow — I have homework.", "section": "A · Choose the correct option.", "options": ["'m not going", "don't going", "not go"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My parents ___ (meet) the neighbours on Friday.", "section": "B · Complete with the correct form.", "reveal": "are meeting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ (not / visit) our relatives this weekend.", "section": "B · Complete with the correct form.", "reveal": "aren't visiting / are not visiting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "My cousins are come next week.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My cousins are coming next week.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We are having a family lunch on Sunday.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ you ___ (do) with your family this weekend?", "section": "Dialogue · Complete with the Present Progressive.", "reveal": "are / doing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: We ___ (visit) my grandparents, and my cousins ___ (come) too.", "section": "Dialogue · Complete with the Present Progressive.", "reveal": "are visiting / are coming", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "We are having a picnic on Saturday.", "section": "Dialogue · Complete with the Present Progressive.", "reveal": "We aren't having a picnic on Saturday. / We are not having a picnic on Saturday.", "prompt": "Make it negative.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Weekend with My Family", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think a family usually does together at the weekend?", "Guess: what hobbies might a big family enjoy together?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Weekend with My Family", "num": 1, "total": 5, "text": "My name is Zeynep, and I live with my parents, my grandparents, and my twin brother, Kaan. We are a close-knit family, so we spend a lot of time together, especially at the weekend.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend with My Family", "num": 2, "total": 5, "text": "On Saturday mornings, we all do chores together. My dad and I clean the kitchen, while my mum and Kaan take turns walking the dog. My grandparents look after the garden — that's their favourite hobby.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend with My Family", "num": 3, "total": 5, "text": "After lunch, we usually play a board game or go fishing at the lake near our house. My brother collects fishing hooks from every trip, and he is going to show his collection to our cousins next weekend.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend with My Family", "num": 4, "total": 5, "text": "In the evening, we sometimes visit our relatives. My aunt and uncle are coming to dinner tonight, and I think we are going to talk for hours! We don't always agree about everything, and sometimes my brother and I argue about small things, but we always support each other.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend with My Family", "num": 5, "total": 5, "text": "This weekend, we are going to have a special family reunion because it's my grandma's birthday. The party starts at six o'clock, and I am sure everyone will have a wonderful time.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["Zeynep's opinion about pets", "How Zeynep's family spends time together", "How to plan a birthday party"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who looks after the garden?", "section": "While you read", "options": ["Zeynep's parents", "Zeynep's grandparents", "Zeynep and Kaan"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Kaan collect?", "section": "While you read", "options": ["Board games", "Fishing hooks", "Family photos"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 4, 'we' refers to…", "section": "While you read", "options": ["Zeynep and her aunt", "Zeynep's whole family", "Zeynep and Kaan only"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep's family never disagrees about anything.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Zeynep's family sometimes argues about small things, but they always support each other.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What time does the birthday party start?", "section": "While you read", "options": ["Six o'clock", "Seven o'clock", "Eight o'clock"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What chores does your family do together? Write two sentences.", "Compare Zeynep's weekend with your own family's weekend. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Planning Our Family Project", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think a project about 'family life' could include?", "Guess: what family roles might students write about in a project?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Planning Our Family Project", "num": 1, "total": 5, "text": "For our English project, my group is going to research and present 'Family Life'. We are going to describe the roles, routines, hobbies and relationships of different family members.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Family Project", "num": 2, "total": 5, "text": "First, we are going to interview our own families. I will ask my parents about their daily routines, and my partner Elif will ask her grandparents about their hobbies when they were young.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Family Project", "num": 3, "total": 5, "text": "Next, we are going to make a poster with photos and short texts. It will show who does which chores, who has which hobbies, and how family members support each other.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Family Project", "num": 4, "total": 5, "text": "We are also going to add a section about relationships: how brothers and sisters get along, how families spend time together, and how relatives help each other during busy weeks.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Family Project", "num": 5, "total": 5, "text": "Our teacher says the project is going to be ready in three weeks. We are going to practise our presentation on Monday, and I think our classmates are going to enjoy learning about different families!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the group's project about?", "section": "While you read", "options": ["A history project", "Family Life", "A cooking competition"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who is Elif going to interview?", "section": "While you read", "options": ["Her parents", "Her grandparents", "Her siblings"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What will the poster show?", "section": "While you read", "options": ["Only photos of pets", "Chores, hobbies and support in the family", "A map of the school"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When is the project going to be ready?", "section": "While you read", "options": ["In one week", "In three weeks", "Next year"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The group is going to work alone without interviewing anyone.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The group is going to interview their own families for the project.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What would you like to include in a project about your own family? List two ideas.", "Write one question you could ask a family member for a project like this."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning a Family Weekend", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two siblings planning what their family is going to do this weekend.", "Predict: what activities might a family plan for a weekend together?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning a Family Weekend", "audio": null, "transcript": [{"speaker": "Kaan", "line": "Hey, what are we doing this weekend? Is grandma coming to visit?"}, {"speaker": "Zeynep", "line": "Yes, she is! She's staying with us from Saturday morning."}, {"speaker": "Kaan", "line": "Great! I think we should go fishing on Saturday. Dad will love that."}, {"speaker": "Zeynep", "line": "Good idea. And on Sunday, we are having a big family lunch at Aunt Sevgi's house."}, {"speaker": "Kaan", "line": "Perfect. I'm going to bring my board games too — grandma loves playing them."}, {"speaker": "Zeynep", "line": "Don't forget, we are going to help mum do the chores before grandma arrives."}, {"speaker": "Kaan", "line": "OK, I will clean my room tonight, I promise!"}, {"speaker": "Zeynep", "line": "Great — this is going to be a really nice family weekend."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Who is coming to visit this weekend?", "section": "While you listen", "options": ["Aunt Sevgi", "Grandma", "A cousin"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What are they going to do on Saturday?", "section": "While you listen", "options": ["Go fishing", "Play board games only", "Clean the house all day"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where is the family lunch on Sunday?", "section": "While you listen", "options": ["At home", "At Aunt Sevgi's house", "At a restaurant"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kaan doesn't have to clean his room.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kaan is going to clean his room tonight — he promised.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Kaan bring for grandma?", "section": "While you listen", "options": ["Fishing hooks", "Board games", "Photos"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What does your family usually do when relatives visit? Write two sentences.", "Write one sentence with 'going to' about your own weekend plans."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Talking About Family Hobbies", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two friends talking about their family members' hobbies.", "Predict: what hobbies do grandparents, parents and s eal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep's family never disagrees about anything.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They sometimes argue about small things, but they always support each other.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
