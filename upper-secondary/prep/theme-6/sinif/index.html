ber for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about visiting Asia.", "section": "Dialogue · Complete with the Present Perfect.", "words": ["have", "you", "ever", "been", "to", "Asia"], "end": "?", "reveal": "Have you ever been to Asia?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Question tags with the Present Perfect", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You've been to Italy, <mark>haven't you<\/mark>?", "He hasn't tried Thai food, <mark>has he<\/mark>?", "We've visited the new food market, <mark>haven't we<\/mark>?", "They've never eaten octopus, <mark>have they<\/mark>?"], "ask": "When the main sentence is positive, is the tag positive or negative? What about when the main sentence is negative?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["negative", "positive", "have/has", "same"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "After a positive Present Perfect sentence, we add a ___ tag.", "section": "Complete the rule", "reveal": "negative", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After a negative Present Perfect sentence, we add a ___ tag.", "section": "Complete the rule", "reveal": "positive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The tag always uses ___, the same auxiliary as the main sentence.", "section": "Complete the rule", "reveal": "have/has", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The subject in the tag must match the subject of the ___ sentence (as a pronoun).", "section": "Complete the rule", "reveal": "same", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A question tag is a short question added to the end of a Present Perfect sentence, usually to check information. If the main sentence is positive, the tag is negative; if the main sentence is negative, the tag is positive. The tag always uses the same auxiliary verb, have/has.", "tr": "Question tag, Present Perfect ile kurulan cümlenin sonuna eklenen kısa bir sorudur ve genellikle onay almak için kullanılır. Ana cümle olumluysa etiket olumsuz, ana cümle olumsuzsa etiket olumlu olur. Etikette her zaman aynı yardımcı fiil (have/has) kullanılır.", "when_en": "We use question tags to check information or keep a conversation going, especially when talking about experiences.", "when": "Bir bilgiyi doğrulamak ya da sohbeti sürdürmek için, özellikle deneyimlerden bahsederken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences eveal": "the + adjective + -est", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For long adjectives (two or more syllables, like delicious), we use ___.", "section": "Complete the rule", "reveal": "the most + adjective", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For short adjectives ending in a single vowel + consonant (like big), we ___ before -est: biggest.", "section": "Complete the rule", "reveal": "double the consonant", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Good, bad and far have ___ superlative forms: best, worst, furthest.", "section": "Complete the rule", "reveal": "irregular", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Superlative adjectives show which thing is the most/least of a quality among three or more things, and always use 'the'. Short adjectives take -est (long → longest); a single vowel + consonant doubles the consonant (big → biggest); adjectives ending in -y change to -iest (easy → easiest). Long adjectives use 'the most' (delicious → the most delicious). Good, bad and far are irregular: best, worst, furthest.", "tr": "Superlative sıfatlar, üç veya daha fazla şey arasında en üstün olanı belirtmek için kullanılır ve başına 'the' gelir. Kısa sıfatlara -est eklenir (long → longest); tek ünlü + ünsüzle biten sıfatlarda son ünsüz ikilenir (big → biggest); y ile bitenlerde y, i olur (easy → easiest). Uzun sıfatlarda 'the most' kullanılır (delicious → the most delicious). good/bad/far düzensizdir: best/worst/furthest.", "when_en": "We use superlatives to compare countries, continents, cities and dishes, to say which one is the most/least of something.", "when": "Ülkeleri, kıtaları, şehirleri ve yemekleri karşılaştırırken, en üstün olanı belirtmek için kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Asia", "big", "continent"], "reveal": "Asia is the biggest continent.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the Nile", "long", "river in Africa"], "reveal": "The Nile is the longest river in Africa.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this dish", "delicious", "food I've ever tried"], "reveal": "This is the most delicious food I've ever tried.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Russia", "large", "country in the world"], "reveal": "Russia is the largest country in the world.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this market", "cheap", "in the city"], "reveal": "This market is the cheapest in the city.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["that spice", "hot", "ingredient in the recipe"], "reveal": "That spice is the hottest ingredient in the recipe.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three superlative sentences comparing countries, continents or dishes you know: the biggest, the most interesting and one more of your choice.", "chips": ["… is the biggest …", "… is the most interesting …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Asia is the biggest continent.", "This is the most popular dish in the region."], "negative": ["This isn't the spiciest dish on the menu."], "question": ["Which country has the largest population?", "What is the most delicious dish you've tried?"], "short": ["It's Türkiye. / The manti is."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Asia is the most big continent.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Asia is the biggest continent.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the deliciousest dish.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the most delicious dish.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Asia is ___ continent in the world.", "section": "A · Choose the correct superlative.", "options": ["the biggest", "the most big", "bigger"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This is ___ dish I have ever tasted.", "section": "A · Choose the correct superlative.", "options": ["the most delicious", "the deliciousest", "more delicious"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Russia is ___ country in the world.", "section": "A · Choose the correct superlative.", "options": ["the large", "the largest", "larger"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "That was ___ meal I've had all year!", "section": "A · Choose the correct superlative.", "options": ["the good", "the best", "gooder"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Which city has ___ (small) population in the country?", "section": "B · Complete with the superlative form.", "reveal": "the smallest", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This street food stall is ___ (popular) one in the market.", "section": "B · Complete with the superlative form.", "reveal": "the most popular", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "This is the most spicy dish on the menu.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the spiciest dish on the menu.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The Nile is the longest river in Africa.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What's ___ (interesting) country you've ever studied?", "section": "Dialogue · Complete with the correct superlative.", "reveal": "the most interesting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I think Japan is. It has ___ (unusual) food culture I know.", "section": "Dialogue · Complete with the correct superlative.", "reveal": "the most unusual", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "A: And what's ___ dish you've ever tried?", "section": "Dialogue · Complete with the correct superlative.", "options": ["spicier", "the spiciest", "spicy"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Countable and uncountable nouns", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I bought three <mark>apples<\/mark> and some <mark>rice<\/mark>.", "There isn't much <mark>bread<\/mark> left in the shop.", "How many <mark>oranges<\/mark> do we need for the recipe?", "We don't have any <mark>milk<\/mark> for the recipe."], "ask": "Which words can you count (one apple, two apples)? Which words can't you count (rice, milk)?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["countable", "uncountable", "a/an", "plural"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Nouns like apple and orange are ___ nouns; they have a singular and a ___ form.", "section": "Complete the rule", "reveal": "countable / plural", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Nouns like rice and milk are ___ nouns; they don't usually have a plural form.", "section": "Complete the rule", "reveal": "uncountable", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We can use ___ before a singular countable noun, but not before an uncountable noun.", "section": "Complete the rule", "reveal": "a/an", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Countable nouns can be counted one by one; they have singular and plural forms and use a/an in the singular (an apple, two apples). Uncountable nouns cannot be counted one by one; they usually have no plural form and don't use a/an (rice, milk, cheese).", "tr": "Sayılabilir isimler (countable) tek tek sayılabilir; tekil ve çoğul hâlleri vardır ve tekilken a/an ile kullanılırlar (an apple, two apples). Sayılamayan isimler (uncountable) tek tek sayılamaz; genellikle çoğul hâlleri yoktur ve a/an ile kullanılmazlar (rice, milk, cheese).", "when_en": "We need to know which food words are countable and which are uncountable when we talk about recipes, shopping or food in general.", "when": "Bir yemek tarifi, market alışverişi ya da yiyecek konuşurken hangi kelimenin sayılabilir hangisinin sayılamayan olduğunu bilmek gerekir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["apple", "C"], "reveal": "I need three apples for the recipe.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["rice", "U"], "reveal": "I need some rice for the recipe.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["tomato", "C"], "reveal": "I need two tomatoes for the recipe.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["cheese", "U"], "reveal": "I need a little cheese for the recipe.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["egg", "C"], "reveal": "I need four eggs for the recipe.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["water", "U"], "reveal": "I need a lot of water for the recipe.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write a short shopping list for a traditional dish from your country. Include at least two countable ingredients and two uncountable ingredients.", "chips": ["I need … (countable)", "I need some … (uncountable)"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I bought three apples.", "We need some rice."], "negative": ["There aren't any apples left.", "There isn't any rice left."], "question": ["How many apples do we need?", "How much rice do we need?"], "short": ["Three. / Not much."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I bought a rice for dinner.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I bought some rice for dinner.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How much apples do we need?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How many apples do we need?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I need ___ eggs for this recipe.", "section": "A · Choose the correct option.", "options": ["a", "some", "much"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "There isn't ___ rice left in the bag.", "section": "A · Choose the correct option.", "options": ["many", "much", "few"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How ___ tomatoes do we need for the salad?", "section": "A · Choose the correct option.", "options": ["much", "many", "little"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We don't have ___ milk for the recipe.", "section": "A · Choose the correct option.", "options": ["any", "a", "many"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "cheese = ___", "section": "B · Write C (countable) or U (uncountable).", "reveal": "U / uncountable", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "onion = ___", "section": "B · Write C (countable) or U (uncountable).", "reveal": "C / countable", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I bought two breads at the grocery store.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I bought two loaves of bread at the grocery store.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I bought three apples and some rice at the grocery store.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Do we have ___ onion for the soup?", "section": "Dialogue · Complete with a/an, some or the correct quantifier word.", "reveal": "an", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, but we don't have ___ garlic left.", "section": "Dialogue · Complete with a/an, some or the correct quantifier word.", "reveal": "any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A: OK, how ___ garlic do we need?", "section": "Dialogue · Complete with a/an, some or the correct quantifier word.", "reveal": "much", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-4", "title": "Gramer 5", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Quantifiers: some, any, much, many, a lot of, a little, a few", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["There's <mark>a lot of<\/mark> cheese in the fridge.", "We need <mark>a few<\/mark> more tomatoes for the recipe.", "I'd like <mark>a little<\/mark> sugar in my tea, please.", "Is there <mark>any<\/mark> spicy food on the menu?"], "ask": "Which quantifiers go with countable nouns like tomatoes? Which go with uncountable nouns like sugar?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a few", "a little", "some / any", "a lot of"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "___ is used with plural countable nouns to mean 'a small number'.", "section": "Complete the rule", "reveal": "a few", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ is used with uncountable nouns to mean 'a small amount'.", "section": "Complete the rule", "reveal": "a little", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ can be used with both countable and uncountable nouns, mainly in positive sentences.", "section": "Complete the rule", "reveal": "a lot of", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ can also be used with both, but ___ is mainly for questions and negatives.", "section": "Complete the rule", "reveal": "some / any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Some is used with countable and uncountable nouns in positive sentences and offers (Would you like some…?). Any is used in negative sentences and questions. Much is used with uncountable nouns, and many with plural countable nouns, mainly in negatives and questions. A lot of works with both, usually in positive sentences. A little (a small amount, uncountable) and a few (a small number, countable) show small quantities.", "tr": "Some, olumlu cümlelerde ve tekliflerde (Would you like some…?) hem sayılabilir hem sayılamayan isimlerle kullanılır. Any, olumsuz cümlelerde ve sorularda kullanılır. Much sayılamayan isimlerle, many sayılabilir çoğul isimlerle, özellikle olumsuz ve sorularda kullanılır. A lot of her ikisiyle de, genelde olumlu cümlelerde kullanılır. A little (az miktar, sayılamayan) ve a few (az sayı, sayılabilir) küçük miktarları belirtir.", "when_en": "We use quantifiers to talk about amounts, especially when shopping or describing the ingredients in a recipe.", "when": "Miktar hakkında konuşurken, özellikle alışveriş yaparken ya da bir tarifin malzemelerini anlatırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["cheese", "positive statement, offer"], "reveal": "There's some cheese in the fridge.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["tomatoes", "small number needed"], "reveal": "We need a few more tomatoes.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["sugar", "small amount, polite request"], "reveal": "I'd like a little sugar, please.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["spicy dishes", "question"], "reveal": "Are there any spicy dishes on the menu?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["ingredients", "large amount, positive"], "reveal": "We have a lot of ingredients ready.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["milk", "negative statement"], "reveal": "We don't have any milk left.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about the food in your kitchen at home, using some, any, a lot of, a little and a few.", "chips": ["We have some …", "We don't have any …", "There's a lot of …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["There's a lot of cheese in the fridge.", "We need a few more tomatoes."], "negative": ["We don't have any milk left.", "There isn't much bread left."], "question": ["Is there any spicy food on the menu?", "How many onions do we need?"], "short": ["Yes, there is. / No, there isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We don't have some milk.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We don't have any milk.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How much tomatoes do we need?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How many tomatoes do we need?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Would you like ___ tea?", "section": "A · Choose the correct quantifier.", "options": ["some", "any", "many"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We don't have ___ bread left.", "section": "A · Choose the correct quantifier.", "options": ["some", "any", "a few"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How ___ sugar do you need for the recipe?", "section": "A · Choose the correct quantifier.", "options": ["many", "much", "few"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "There are only ___ apples left in the bowl.", "section": "A · Choose the correct quantifier.", "options": ["a little", "a few", "much"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We have ___ ingredients for the dish, but we need more spices.", "section": "B · Complete with a quantifier.", "reveal": "a lot of / some", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I'd like ___ salt in my soup, please.", "section": "B · Complete with a quantifier.", "reveal": "a little", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Is there some milk in the fridge?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Is there any milk in the fridge?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We need a few more tomatoes for the recipe.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Do we have ___ chillies for the spicy dish?", "section": "Dialogue · Complete with some, any, much, many, a lot of, a little or a few.", "reveal": "any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, we have ___ — about six.", "section": "Dialogue · Complete with some, any, much, many, a lot of, a little or a few.", "reveal": "a few", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A: Great, and how ___ rice do we have?", "section": "Dialogue · Complete with some, any, much, many, a lot of, a little or a few.", "reveal": "much", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Seven Continents, One Small World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["How many continents can you name? Try to list all seven before you read.", "Guess: which continent has the largest population?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Seven Continents, One Small World", "num": 1, "total": 5, "text": "Our planet has seven continents: Africa, Antarctica, Asia, Australia, Europe, North America and South America. Each continent has its own countries, nationalities, languages and flags, and together they make our world an amazing, varied place.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Seven Continents, One Small World", "num": 2, "total": 5, "text": "Asia is the biggest continent, and it also has the largest population — more people live there than on any other continent. China and India alone have over a billion people each! Africa is the second biggest continent, with over fifty different countries and hundreds of official languages.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Seven Continents, One Small World", "num": 3, "total": 5, "text": "Some continents have a lot of countries close together, sharing borders and cultures. In Europe, for example, you can travel from one country to another and hear a different official language after just a few hours. Other continents, like Australia, are made up of just one country and a group of islands nearby.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Seven Continents, One Small World", "num": 4, "total": 5, "text": "Every country has a flag, a capital city and a nationality that people are proud of. If you have ever met someone from another continent, you have probably learned something new about their country's culture, food or traditions.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Seven Continents, One Small World", "num": 5, "total": 5, "text": "This theme is your chance to go continent-hopping without leaving the classroom — to learn about nationalities, borders and populations, and to discover how people from different parts of the world live, shop and eat.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["The history of flags", "The seven continents of the world", "How to become a geographer"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which continent has the largest population?", "section": "While you read", "options": ["Africa", "Asia", "Europe"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How many different countries does Africa have, according to the text?", "section": "While you read", "options": ["About seven", "About twenty", "Over fifty"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 3, what does the writer say about Europe?", "section": "While you read", "options": ["It has only one country", "You can hear a different official language after a short journey", "It has no borders"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, every continent has exactly the same number of countries.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Continents have different numbers of countries — Africa has over fifty, while Australia is made up of just one country and nearby islands.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What is the writer inviting the reader to do in this theme?", "section": "While you read", "options": ["Travel abroad this weekend", "Learn about nationalities, borders and food culture from the classroom", "Memorise every flag in the world"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Name one country from each continent you can think of. Try for at least four continents.", "Which continent would you most like to visit, and why? Write two sentences."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Taste of the World: Street Food and Traditions", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What is your favourite traditional dish from your own country?", "Guess: what is 'street food'? Think of an example you know."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Taste of the World: Street Food and Traditions", "num": 1, "total": 5, "text": "Have you ever tried street food in another country? In many cities around the world, small stalls and carts sell some of the most delicious and famous dishes — often cheaper and tastier than in a restaurant!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Taste of the World: Street Food and Traditions", "num": 2, "total": 5, "text": "In Thailand, street vendors sell spicy noodle dishes and fresh fruit. In Mexico, you can find tacos with many different fillings. In Türkiye, simit and köfte are popular street food, and every region has its own traditional dish that local people are proud of.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Taste of the World: Street Food and Traditions", "num": 3, "total": 5, "text": "Food culture isn't only about street food, though. It's also about how people shop for ingredients. In some countries, families go to a big grocery store once a week; in others, they visit a small local market every day for fresh vegetables, fruit and bread.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Taste of the World: Street Food and Traditions", "num": 4, "total": 5, "text": "More and more people today also have special food preferences. Some are vegetarian, some choose gluten-free or dairy-free products, and shops in most big cities now have a special section for these ingredients so that everyone can find something they enjoy.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Taste of the World: Street Food and Traditions", "num": 5, "total": 5, "text": "Trying a country's traditional dishes and street food is one of the best ways to understand its culture. That's why, in this theme's project, you and your classmates will create a booklet about a culinary adventure — exploring continents, countries and the wonderful food cultures of the world.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["How to open a restaurant", "Street food and food culture around the world", "The history of Thailand"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, why might street food be better than a restaurant meal?", "section": "While you read", "options": ["It is always healthier", "It can be cheaper and tastier", "It is only available at night"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What street food does the text mention from Türkiye?", "section": "While you read", "options": ["Tacos and noodles", "Simit and köfte", "Sushi and rice"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why do some shops now have a special section for gluten-free or dairy-free products?", "section": "While you read", "options": ["Because these products are cheaper", "Because more people today have special food preferences", "Because the government requires it"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, all families around the world shop for food in exactly the same way.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Food shopping is different around the world — some families use a big grocery store, others use small local markets.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What project does the text introduce at the end?", "section": "While you read", "options": ["A cooking competition", "A culinary adventure booklet about continents, countries and food cultures", "A trip abroad"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Have you ever tried street food or a dish from another country? Write two sentences about the experience.", "List two food preferences (e.g. vegetarian, gluten-free) you know about and one dish that fits each one."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Shopping for Food Preferences", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a conversation between a customer and a shop assistant in a grocery store.", "Predict: what two food preferences might the customer have? Think of two examples."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Shopping for Food Preferences", "audio": null, "transcript": [{"speaker": "Assistant", "line": "Good morning! Can I help you find anything?"}, {"speaker": "Customer", "line": "Yes, please. I'm vegetarian, so I'm looking for something without meat for dinner tonight."}, {"speaker": "Assistant", "line": "No problem — we have a lot of fresh vegetables, and this section here has organic tofu and beans."}, {"speaker": "Customer", "line": "Great, thank you. Do you also have gluten-free bread? My sister has never eaten gluten, so I always buy it for her too."}, {"speaker": "Assistant", "line": "Yes, we do. It's on the shelf next to the dairy-free milk."}, {"speaker": "Customer", "line": "Perfect. How much does this bread cost?"}, {"speaker": "Assistant", "line": "It's a little more expensive than normal bread, but it's very fresh — we bake it every morning."}, {"speaker": "Customer", "line": "That's fine. I'll take a few tomatoes, some rice and this bread, please."}, {"speaker": "Assistant", "line": "Of course. Have you ever tried our new recipe cards? They're free with every purchase."}, {"speaker": "Customer", "line": "No, I haven't! I'll take one, thank you."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the customer's food preference?", "section": "While you listen", "options": ["Gluten-free", "Vegetarian", "Dairy-free"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where is the gluten-free bread?", "section": "While you listen", "options": ["Next to the vegetables", "Next to the dairy-free milk", "Next to the recipe cards"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why does the customer buy gluten-free bread for her sister?", "section": "While you listen", "options": ["Her sister has never eaten gluten", "Her sister works at the shop", "Her sister is vegetarian too"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the customer buy, according to the text?", "section": "While you listen", "options": ["Tomatoes, rice and bread", "Meat, milk and tofu", "Fruit, cheese and pasta"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The customer has tried the shop's recipe cards before.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The customer hasn't tried the recipe cards before — she says 'No, I haven't!'", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Do you or someone in your family have a food preference (vegetarian, gluten-free, dairy-free)? Write one sentence about it.", "Write two things you would ask a shop assistant if you were shopping for a special diet."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning the Culinary Adventure Project", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two classmates planning their culinary adventure booklet project.", "Predict: which continents and countries might they choose to research? Think of two."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning the Culinary Adventure Project", "audio": null, "transcript": [{"speaker": "Mira", "line": "So for our booklet, we have to choose three countries from different continents. Have you decided yet?"}, {"speaker": "Kaan", "line": "I've already chosen Japan, from Asia — I've read that its cuisine is one of the most popular in the world."}, {"speaker": "Mira", "line": "Good choice! I'd like to research Mexico, from North America. Have you ever tried Mexican food?"}, {"speaker": "Kaan", "line": "No, I haven't, but I've heard it's quite spicy. What about the third country?"}, {"speaker": "Mira", "line": "Let's choose Morocco, from Africa — it's got the most interesting street food I've read about."}, {"speaker": "Kaan", "line": "Perfect. We also need a page about food preferences, haven't we?"}, {"speaker": "Mira", "line": "Yes, we have. Let's write about a vegetarian shopping trip for each country's traditional dish."}, {"speaker": "Kaan", "line": "Good idea. And for the role-play, I'll be the shop assistant and you can be the customer."}, {"speaker": "Mira", "line": "Sounds great. Let's find a few pictures of each country's flag and capital city before Friday."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Mira and Kaan planning?", "section": "While you listen", "options": ["A sports project", "A culinary adventure booklet", "A geography test"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which country has Kaan already chosen?", "section": "While you listen", "options": ["Mexico", "Morocco", "Japan"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which continent is Mexico from?", "section": "While you listen", "options": ["North America", "Asia", "Africa"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What kind of shopping trip will they write about?", "section": "While you listen", "options": ["A vegetarian shopping trip", "A gluten-free shopping trip", "An online shopping trip"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kaan has tried Mexican food before.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kaan hasn't tried Mexican food before — he says 'No, I haven't'.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["If you were doing this project, which three countries would you choose? Why?", "Write one sentence using the Present Perfect about food you have or haven't tried."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Guess My Country", "text": "Think of a country. Your partner asks yes/no questions with Present Perfect and comparative/superlative language to guess it, e.g. 'Have you ever been there?' or 'Is it the biggest country on its continent?'", "steps": ["Think of a country and write its name secretly on a small piece of paper.", "Your partner asks up to eight yes/no questions to guess the country.", "Answer only Yes/No — don't give the country away too early!", "Swap roles and play again with a new country.", "Share your two favourite questions with the class."], "chips": ["Have you ever visited this country?", "Is it in Europe / Asia / Africa…?", "Is it the biggest / smallest country in its continent?", "Yes, it is. / No, it isn't. / Yes, I have. / No, I haven't."], "timer": 600, "levels": ["Give students a list of ready-made question starters before they begin.", "Two rounds per pair, up to eight questions each.", "Fast finishers add one superlative fact about their country (e.g. 'It has the longest coastline in South America')."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Shopping for Traditional Food — Role-Play", "text": "With a partner, act out a shopping scene at a market or shop. One of you is a customer with a food preference (vegetarian, gluten-free or dairy-free) shopping for a traditional dish from another culture; the other is the shop assistant. This role-play is preparation for your culinary adventure booklet.", "steps": ["Choose a country and a traditional dish you want to shop for.", "Decide your character: Customer A (with a food preference) or Shop Assistant B.", "Act out the scene: greet, ask for ingredients, talk about quantities and preferences.", "Use at least two grammar points from this theme in your dialogue.", "Perform your scene for another pair and get feedback."], "chips": ["I'm vegetarian / gluten-free / dairy-free. Do you have…?", "We have some fresh…/ We don't have any… left.", "How much / how many… do you need?", "Have you ever tried…? It's the most popular dish here."], "timer": 300, "levels": ["Give lower-level pairs a shopping list template with ingredient names already on it.", "One full shopping scene per pair, performed for another pair.", "Fast pairs add a moment where the shop assistant recommends a traditional dish and describes it with a superlative."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "The World in Superlatives", "text": "Write a short text comparing three countries or continents you have researched. Use at least three superlative adjectives and one sentence with the Present Perfect about an experience.", "steps": ["Choose three countries or continents to compare.", "Note one superlative fact about each (biggest, most interesting, most popular food…).", "Add one sentence about something you have or haven't experienced.", "Check your grammar and punctuation."], "chips": ["continent", "nationality", "population", "capital city", "cuisine", "… is the biggest / smallest…", "… is the most interesting…", "I have never…", "Have you ever…?"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "My Culinary Adventure Booklet Page", "text": "Write one page of your culinary adventure booklet (performance task): describe a country, its traditional dish, and a shopping trip for that dish, including a food preference (vegetarian, gluten-free or dairy-free) and quantities of ingredients.", "steps": ["Choose the country and traditional dish for your page.", "List the ingredients (countable and uncountable) with quantifiers, e.g. 'a few onions', 'some rice'.", "Describe a short shopping trip or experience, using the Present Perfect where possible.", "Read your page aloud and check it makes sense and fits the word count."], "chips": ["traditional dish", "ingredient", "recipe", "grocery store", "gluten-free", "vegetarian", "I need some… / a few… / a little…", "This is the most popular dish in…", "I have tried… / I haven't tried… yet"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'continent'", "section": "Exit ticket", "options": ["a small village", "one of the seven large land areas of the world", "a type of food"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'gluten-free' mean?", "section": "Exit ticket", "options": ["food without gluten", "food without sugar", "food without salt"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you ever tried Thai food?", "section": "Exit tic
