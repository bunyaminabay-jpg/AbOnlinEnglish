stgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "If you stand on the Moon, you will weigh less.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If you stand on the Moon, you weigh less.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "If there is no atmosphere, sound doesn't travel.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What happens ___ a planet ___ (be) very far from the Sun?", "section": "Dialogue · Complete with the Zero Conditional.", "reveal": "if / is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: It ___ (be) extremely cold there.", "section": "Dialogue · Complete with the Zero Conditional.", "reveal": "is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a sentence about gravity and the Moon.", "section": "Dialogue · Complete with the Zero Conditional.", "words": ["if", "you", "jump", "on", "the", "Moon,", "you", "go", "higher", "because", "gravity", "is", "weaker"], "end": ".", "reveal": "If you jump on the Moon, you go higher because gravity is weaker.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "First conditional: real possibilities with if and unless", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["If astronauts <mark>travel<\/mark> to Mars, they <mark>will need<\/mark> special spacesuits.", "We <mark>won't survive<\/mark> on the Moon unless we <mark>bring<\/mark> oxygen.", "If scientists <mark>discover<\/mark> water on a planet, they <mark>will look<\/mark> for signs of life.", "Unless the spacecraft <mark>has<\/mark> enough fuel, it <mark>won't reach<\/mark> its destination."], "ask": "What tense is used after if/unless? What tense is used in the main clause? What does 'unless' mean?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["Present Simple", "will + base verb", "if...not", "future"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "In First Conditional sentences, the if-clause (or unless-clause) uses ___.", "section": "Complete the rule", "reveal": "Present Simple / the Present Simple", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The main clause uses ___ to talk about a ___ result.", "section": "Complete the rule", "reveal": "will + base verb / future", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Unless' means the same as ___.", "section": "Complete the rule", "reveal": "if...not / if not", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the First Conditional (If + Present Simple, will + base verb) to talk about real, possible situations in the future and their results. Unless means 'if...not' and introduces a condition that must not happen for the result to be true.", "tr": "First Conditional (Birinci Koşul Cümlesi), gelecekte gerçekleşmesi mümkün, gerçek durumları ve sonuçlarını anlatmak için kullanılır: If + Geniş Zaman, will + yalın fiil. Unless, 'eğer …olmazsa' anlamına gelir ve sonucun gerçekleşmesi için olmaması gereken bir koşulu tanıtır.", "when_en": "We use it to talk about real future possibilities in space exploration — what will happen if (or unless) certain conditions are met.", "when": "Uzay keşfiyle ilgili gelecekte gerçekleşmesi mümkün durumları anlatırken kullanılır — belirli koşullar gerçekleşirse (ya da gerçekleşmezse) ne olacağını anlatmak için.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["astronauts", "travel to Mars", "they / need special spacesuits"], "reveal": "If astronauts travel to Mars, they will need special spacesuits.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["astronauts", "land on Mars", "they / collect rock samples"], "reveal": "If astronauts land on Mars, they will collect rock samples.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not / wear a spacesuit", "we / not survive in space"], "reveal": "If we don't wear a spacesuit, we won't survive in space.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["unless / the crew", "have enough oxygen", "they / not / complete the mission"], "reveal": "Unless the crew has enough oxygen, they won't complete the mission.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the rocket", "launch on time", "it / reach orbit by Friday"], "reveal": "If the rocket launches on time, it will reach orbit by Friday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["unless / scientists", "find a habitable planet", "humans / not / live there"], "reveal": "Unless scientists find a habitable planet, humans won't live there.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two First Conditional sentences about a future space mission or exploring another planet: one with if, one with unless.", "chips": ["If astronauts …", "Unless we …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["If astronauts travel to Mars, they will need special spacesuits.", "We will explore new planets if technology improves."], "negative": ["If we don't protect Earth's atmosphere, the climate will change.", "Unless the crew has enough oxygen, they won't complete the mission."], "question": ["What will happen if scientists find water on Mars?"], "short": ["They will look for signs of life there."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If astronauts will travel to Mars, they will need special spacesuits.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If astronauts travel to Mars, they will need special spacesuits.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Unless we don't protect Earth's atmosphere, the climate will change.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Unless we protect Earth's atmosphere, the climate will change.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "If astronauts ___ to Mars, they will need special spacesuits.", "section": "A · Choose the correct option.", "options": ["travel", "will travel", "travelled"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ new planets if technology improves.", "section": "A · Choose the correct option.", "options": ["explore", "will explore", "explored"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ the crew has enough oxygen, they won't complete the mission.", "section": "A · Choose the correct option.", "options": ["If", "Unless", "When"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "If scientists find water on Mars, they ___ for signs of life.", "section": "A · Choose the correct option.", "options": ["look", "will look", "looked"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If the rocket ___ (launch) on time, it ___ (reach) orbit by Friday.", "section": "B · Complete with the correct form.", "reveal": "launches / will reach", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Unless we ___ (protect) Earth's atmosphere, the climate ___ (change).", "section": "B · Complete with the correct form.", "reveal": "protect / will change", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "If astronauts will land on Mars, they will collect rock samples.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If astronauts land on Mars, they will collect rock samples.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Unless the spacecraft has enough fuel, it won't reach its destination.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ (happen) if we ___ (find) life on another planet?", "section": "Dialogue · Complete with the First Conditional.", "reveal": "will happen / find", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Scientists ___ (study) it very carefully.", "section": "Dialogue · Complete with the First Conditional.", "reveal": "will study", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "If you don't wear a spacesuit, you won't survive in space.", "section": "Dialogue · Complete with the First Conditional.", "reveal": "Unless you wear a spacesuit, you won't survive in space.", "prompt": "Rewrite the sentence using 'unless'.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Our Solar System: A Family of Planets", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. How many planets do you think are in our solar system?", "Guess: which planet do you think is the hottest?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Our Solar System: A Family of Planets", "num": 1, "total": 5, "text": "Our solar system has one star, the Sun, and eight planets that revolve around it. The four planets closest to the Sun — Mercury, Venus, Earth and Mars — are small and rocky. The four planets farther away — Jupiter, Saturn, Uranus and Neptune — are much bigger gas giants.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Solar System: A Family of Planets", "num": 2, "total": 5, "text": "Every planet orbits the Sun, but each one takes a different amount of time. Mercury orbits the Sun in just 88 days because it is close to the Sun. Neptune, the farthest planet, takes about 165 years!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Solar System: A Family of Planets", "num": 3, "total": 5, "text": "Many planets also have satellites, or moons. Saturn has more than 80 moons, and its beautiful rings are made of ice and rock. Earth has only one moon, but it is very important — it affects our ocean tides.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Solar System: A Family of Planets", "num": 4, "total": 5, "text": "If a planet is close to the Sun, its temperature is usually high. Venus, for example, is the hottest planet because its thick atmosphere traps heat. If a planet is far from the Sun, like Neptune, it is extremely cold.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Solar System: A Family of Planets", "num": 5, "total": 5, "text": "Scientists use powerful telescopes and spacecraft to explore these planets. If we send astronauts to Mars one day, they will learn much more about the red planet and its surface.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["The history of astronauts", "The planets in our solar system", "How to build a spacecraft"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How many planets orbit the Sun?", "section": "While you read", "options": ["Four", "Eight", "Eighty"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why does Mercury orbit the Sun so quickly?", "section": "While you read", "options": ["It is very small", "It is close to the Sun", "It has no moons"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which planet is the hottest, according to the text?", "section": "While you read", "options": ["Mercury", "Venus", "Neptune"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Saturn has only one moon.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Saturn has more than 80 moons.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why do scientists send spacecraft to explore planets?", "section": "While you read", "options": ["To learn more about them", "To live there permanently", "To sell rocks"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What is one fact from the text that surprised you? Write one sentence.", "Which planet would you like to explore? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Earth: Our Special Planet", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What makes Earth different from other planets? Guess two things.", "Look at the title. What do you already know about Earth's atmosphere?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Earth: Our Special Planet", "num": 1, "total": 5, "text": "Earth is the third planet from the Sun, and as far as we know, it is the only habitable planet in our solar system. But what makes Earth so special?", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Earth: Our Special Planet", "num": 2, "total": 5, "text": "Earth has a thick atmosphere full of oxygen. If a planet doesn't have enough oxygen, humans and animals cannot breathe there. Earth's atmosphere also protects us from harmful rays from the Sun.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Earth: Our Special Planet", "num": 3, "total": 5, "text": "Unless a planet has liquid water, life cannot survive easily. Earth has huge oceans, rivers and lakes — about 70% of its surface is covered with water. Mars, in comparison, only has ice at its poles.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Earth: Our Special Planet", "num": 4, "total": 5, "text": "Earth's distance from the Sun is also important. It is not too close, like hot Venus, and not too far, like cold Neptune. Scientists call this the 'habitable zone'.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Earth: Our Special Planet", "num": 5, "total": 5, "text": "If astronauts explore other planets in the future, they will probably agree that Earth is still the best place for life. That's why it's so important to take care of our planet.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Earth is a boring planet", "Earth has special conditions that make life possible", "Mars is more habitable than Earth"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What percentage of Earth's surface is covered with water?", "section": "While you read", "options": ["About 30%", "About 50%", "About 70%"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Earth's atmosphere protect us from?", "section": "While you read", "options": ["Cold weather", "Harmful rays from the Sun", "Loud noises"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do scientists call the area where a planet's distance from the Sun is 'just right'?", "section": "While you read", "options": ["The rocky zone", "The gas zone", "The habitable zone"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mars has more water on its surface than Earth.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Earth has much more water than Mars — Mars only has ice at its poles.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does the writer probably feel about protecting Earth?", "section": "While you read", "options": ["It isn't important", "It is very important", "It is impossible"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Why do you think Earth is called a 'special' planet? Write two reasons.", "Design one poster idea for your solar system project comparing Earth to another planet."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Interview with a Space Scientist", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear an interview between a student reporter and a space scientist.", "Guess: what two questions would you ask a space scientist about planets?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Interview with a Space Scientist", "audio": null, "transcript": [{"speaker": "Reporter", "line": "Thank you for talking to us today! Can you tell us which planet is the biggest in our solar system?"}, {"speaker": "Scientist", "line": "Of course! Jupiter is the biggest planet. It's a huge gas giant — more than 300 Earths could fit inside it!"}, {"speaker": "Reporter", "line": "Wow! And which planet is closest to the Sun?"}, {"speaker": "Scientist", "line": "That's Mercury. If a planet is close to the Sun, like Mercury, its temperature changes a lot between day and night."}, {"speaker": "Reporter", "line": "Interesting! Does every planet have a moon?"}, {"speaker": "Scientist", "line": "No, it doesn't. Mercury and Venus don't have any moons, but Saturn has more than 80!"}, {"speaker": "Reporter", "line": "What happens if a spacecraft doesn't have enough fuel?"}, {"speaker": "Scientist", "line": "Unless a spacecraft has enough fuel, it won't reach its destination. That's why scientists plan missions very carefully."}, {"speaker": "Reporter", "line": "One last question — will humans live on another planet one day?"}, {"speaker": "Scientist", "line": "Maybe! If we find a habitable planet with water and oxygen, humans might live there in the future."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Which planet is the biggest in the solar system?", "section": "While you listen", "options": ["Mercury", "Jupiter", "Earth"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then "title", "kicker": "Listening", "title": "Planning Our Solar System Project", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning their solar system project.", "Predict: what jobs might they need for a project about planets? Think of two."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning Our Solar System Project", "audio": null, "transcript": [{"speaker": "Ege", "line": "So for our solar system project, we have to choose which planets to explore. Can you research Mars and Venus?"}, {"speaker": "Zeynep", "line": "Sure, I can do that. I'll write a short script for an astronomer who studies them."}, {"speaker": "Ege", "line": "Great. I'll write about Jupiter and Saturn — the gas giants. If we finish the research today, we can start writing the scripts tomorrow."}, {"speaker": "Zeynep", "line": "Good idea. Unless we practise our roles, the presentation won't be smooth. Let's rehearse on Thursday."}, {"speaker": "Ege", "line": "Agreed. We also need one scene about Earth — why it's the only habitable planet we know of."}, {"speaker": "Zeynep", "line": "I can write that scene. If I finish early, I'll help you with Jupiter's facts too."}, {"speaker": "Ege", "line": "Perfect. Let's meet in the library at 4 pm to compare our notes."}, {"speaker": "Zeynep", "line": "OK, see you there! Don't forget to bring your notes on gravity."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Ege and Zeynep planning?", "section": "While you listen", "options": ["A sports event", "Their solar system project", "A school trip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which planets will Zeynep research?", "section": "While you listen", "options": ["Mars and Venus", "Jupiter and Saturn", "Earth and Mercury"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Zeynep say will happen unless they practise?", "section": "While you listen", "options": ["The presentation won't be smooth", "They will get a bad grade", "They will forget the facts"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep will write the scene about Earth.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Where will they meet?", "section": "While you listen", "options": ["The canteen", "The library", "The classroom"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["If you did a project about a planet, which planet would you choose? Why?", "Write one First Conditional sentence about your own project plans."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Guess the Planet", "text": "With a partner, take turns giving clues about a planet (size, distance from the Sun, temperature, moons) while your partner guesses which planet it is.", "steps": ["Choose a planet and write 3 clues about it (without naming it).", "Give your first clue to your partner.", "Your partner guesses the planet; if they are wrong, give another clue.", "Swap roles and repeat with a different planet.", "Play again with 2 more planets each."], "chips": ["This planet is…", "It orbits the Sun in…", "If you visit this planet, you will…", "Is it … ?"], "timer": 600, "levels": ["Give students a fact card with key numbers (distance, moons, temperature) for each planet.", "3 planets guessed correctly per pair.", "Fast finishers add one Zero Conditional fact for each planet (e.g. 'If you stand here, you weigh less.')."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Mission to Mars: Astronaut Interview", "text": "One of you is a reporter and one is an astronaut who has just returned from a mission to Mars. Role-play a short interview about the mission, using the First Conditional to talk about future missions.", "steps": ["Decide who is the reporter and who is the astronaut.", "The astronaut thinks of 3 facts about the Mars mission (what they saw, found, or did).", "The reporter prepares 3 questions, including at least one with if/unless.", "Act out the interview.", "Swap roles and do it again for a different planet."], "chips": ["What will happen if…?", "Unless we…, we won't…", "If we go back to Mars, we will…", "It was…"], "timer": 600, "levels": ["Give reporters a list of question starters (What did you…? What will happen if…?).", "3 questions and answers per pair.", "Fast finishers record their interview idea as notes for their solar system project script."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Planet Fact File", "text": "Choose one planet and write a short fact file about it. Include its distance from the Sun, its size, its temperature, and one Zero Conditional fact about it.", "steps": ["Choose your planet and research 4 key facts.", "Organise your facts: distance, size, temperature, moons.", "Write one Zero Conditional sentence about your planet.", "Check your grammar and punctuation."], "chips": ["planet", "orbit", "surface", "atmosphere", "temperature", "distance", "… is the … planet from the Sun.", "It orbits the Sun in…", "If you visit this planet, …", "Its surface is…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "My Interplanetary Explorer Script", "text": "Write a short script (6-8 lines) for your solar system project. Create a character — an astronaut, astronomer or scientist — who describes a planet they are exploring. Use at least one First Conditional sentence with if or unless.", "steps": ["Choose your character and which planet they are exploring.", "Decide what they discover or explain about the planet.", "Write 6-8 lines of script, including a First Conditional sentence.", "Read it aloud with a partner and time it."], "chips": ["astronaut", "spacecraft", "explore", "habitable", "gravity", "universe", "If we…, we will…", "Unless we…, we won't…", "This planet is…", "I have discovered that…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'orbit'", "section": "Exit ticket", "options": ["to travel a r parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Saturn has only one moon.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Saturn has more than 80 moons.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What percentage of Earth's surface is covered with water?", "section": "Exit ticket", "options": ["About 30%", "About 50%", "About 70%"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
