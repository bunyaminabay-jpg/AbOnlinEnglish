e at the moment of speaking, promises, offers, and predictions without evidence. Use be going to for plans already decided before speaking and predictions based on present evidence.", "tr": "Konuşma anında verilen kararlar, sözler, teklifler ve kanıta dayanmayan tahminler için 'will' kullanılır. Konuşmadan önce zaten karar verilmiş planlar ve mevcut kanıta dayanan tahminler için 'be going to' kullanılır.", "when_en": "We use will for spontaneous decisions ('I'll answer that') and be going to for plans ('I'm going to study tonight').", "when": "Ani kararlar için 'will' ('Ben cevaplarım'), planlar için 'be going to' ('Bu akşam ders çalışacağım') kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I", "/", "help", "/", "you", "/", "with the assignment"], "reveal": "I will help you with the assignment.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "/", "already plan", "/", "use", "/", "a new app", "/", "next term"], "reveal": "We are going to use a new app next term.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "/", "promise", "/", "revise", "/", "more carefully"], "reveal": "I will revise more carefully.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the teacher", "/", "plan", "/", "give", "/", "a handout", "/", "tomorrow"], "reveal": "The teacher is going to give a handout tomorrow.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "/", "decide now", "/", "focus", "/", "on grammar tonight"], "reveal": "I will focus on grammar tonight.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "/", "plan", "/", "do", "/", "a project", "/", "on technology"], "reveal": "They are going to do a project on technology.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about your study plans for this week, using will for quick decisions and be going to for plans you have already made.", "chips": ["Tonight I will...", "This weekend I am going to..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I will (I'll) revise tonight.", "We are (we're) going to study together."], "negative": ["I will not (won't) forget my homework.", "She is not (isn't) going to use her phone in class."], "question": ["Will you help me with this exercise?", "Are you going to finish the project today?"], "short": ["Yes, I will. / No, I won't.", "Yes, I am. / No, I'm not."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I go to study tonight.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I am going to study tonight.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She wills finish the assignment.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She will finish the assignment.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "A: The room is a mess. B: I ___ clean it up right now.", "section": "", "options": ["will", "am going to", "went", "would"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We ___ (already decided) do a project about technology next month.", "section": "", "reveal": "are going to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She will studies every evening this week.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She will study every evening this week.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Look at those dark clouds — it ___ rain soon.", "section": "", "options": ["will", "is going to", "is", "was"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using be going to: 'It's decided — we present our project on Friday.'", "section": "", "reveal": "We are going to present our project on Friday.", "prompt": "We ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I promise I ___ (will) help you understand this grammar point.", "section": "", "reveal": "will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: going / we / project / to / a / are / do", "section": "", "words": ["we", "are", "going", "to", "do", "a", "project"], "end": ".", "reveal": "We are going to do a project.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Combine using will and be going to correctly: (plan already made) study with a group AND (decision now) also join an online quiz.", "section": "", "reveal": "I am going to study with a group and I will also join an online quiz.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence is a spontaneous offer?", "section": "", "options": ["I'll carry your books.", "I'm going to carry your books tomorrow.", "I carry your books.", "I carried your books."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Advice and obligation: should/ought to, must/have to, and question tags", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You <mark>should revise<\/mark> your notes every day, <mark>shouldn't you<\/mark>?", "Students <mark>must switch off<\/mark> their phones during the test.", "We <mark>have to hand in<\/mark> the assignment by Friday.", "You <mark>ought to ask<\/mark> the teacher if you don't understand."], "ask": "What do you notice about the difference between advice (should) and obligation (must/have to)? What is added at the end of the first sentence, and why?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["should", "must", "have to", "shouldn't", "don't you"], "chips": true, "text": "Complete the sentences with should, must, have to, or a correct question tag.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "You ___ revise your vocabulary before the quiz — it will really help.", "section": "Complete the rule", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In this school, students ___ wear a uniform — it's a strict rule.", "section": "Complete the rule", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I ___ finish my assignment tonight because the deadline is tomorrow.", "section": "Complete the rule", "reveal": "have to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You like online quizzes, ___?", "section": "Complete the rule", "reveal": "don't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Use should/ought to for advice and recommendations. Use must for strong personal obligation or rules from the speaker, and have to for obligation coming from outside (a rule, a teacher, a schedule). Add a question tag to a statement to check information: positive statement + negative tag, negative statement + positive tag.", "tr": "Tavsiye ve öneri için 'should/ought to' kullanılır. Konuşanın kendi koyduğu güçlü bir zorunluluk için 'must', dışarıdan gelen bir zorunluluk (kural, öğretmen, program) için 'have to' kullanılır. Bilgiyi teyit etmek için cümlenin sonuna bir soru eki eklenir: olumlu cümle + olumsuz soru eki, olumsuz cümle + olumlu soru eki.", "when_en": "We use should/ought to when giving advice, must for strong rules or feelings, have to for outside obligation, and question tags when checking or confirming information in conversation.", "when": "Tavsiye verirken 'should/ought to', güçlü kurallar veya kişisel görüşler için 'must', dışarıdan gelen zorunluluk için 'have to', konuşmada bilgi teyit ederken soru ekleri kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["you", "/", "advice", "/", "focus", "/", "on grammar"], "reveal": "You should focus on grammar.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["students", "/", "rule", "/", "not use", "/", "phones", "/", "in class"], "reveal": "Students must not use phones in class.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "/", "external obligation", "/", "submit", "/", "the homework", "/", "today"], "reveal": "I have to submit the homework today.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "/", "advice", "/", "ask", "/", "for feedback"], "reveal": "You ought to ask for feedback.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this app", "/", "is useful", "/", "tag"], "reveal": "This app is useful, isn't it?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "/", "don't", "/", "like", "/", "group work", "/", "tag"], "reveal": "You don't like group work, do you?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences giving study advice or describing a classroom rule, and add one sentence with a question tag.", "chips": ["You should...", "In our class, we have to..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You should revise more.", "We must follow the rules.", "I have to finish this today.", "It's an interesting app, isn't it?"], "negative": ["You shouldn't skip classes.", "Students must not copy answers.", "I don't have to attend on Saturdays.", "You aren't tired, are you?"], "question": ["Should I revise this chapter again?", "Do we have to submit it online?"], "short": ["Yes, you should. / No, you shouldn't.", "Yes, we do. / No, we don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You should to revise every day.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should revise every day.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You like this app, do you?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You like this app, don't you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "It's a school rule: students ___ wear a uniform.", "section": "", "options": ["should", "have to", "might", "would"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You look tired — you ___ (advice) go to bed earlier.", "section": "", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "You don't like this subject, do you?", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "This grammar point is easy, ___ it?", "section": "", "reveal": "isn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence shows prohibition?", "section": "", "options": ["You don't have to bring a dictionary.", "You must not use your phone during the test.", "You should bring a pen.", "You ought to revise."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Add a question tag: 'You finished the assignment.'", "section": "", "reveal": "You finished the assignment, didn't you?", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: to / homework / every / day / have / I / do / my", "section": "", "words": ["I", "have", "to", "do", "my", "homework", "every", "day"], "end": ".", "reveal": "I have to do my homework every day.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite to show no obligation (not a rule): 'We must bring our books tomorrow.'", "section": "", "reveal": "We don't have to bring our books tomorrow.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Complete with the correct tag: 'She isn't in your class, ___ she?'", "section": "", "reveal": "is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Reflexive & possessive pronouns, can, and might", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I did this exercise by <mark>myself<\/mark> without any help.", "Is this notebook <mark>yours<\/mark> or is it <mark>Ali's<\/mark>?", "<mark>Can<\/mark> I use your dictionary for a minute?", "We're not sure yet, but we <mark>might join<\/mark> the online club."], "ask": "What do you notice about the words ending in -self/-selves, the pronouns showing ownership, and the two modal verbs — how sure or certain is each speaker?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["myself", "herself", "yours", "Ayşe's", "Can", "might"], "chips": true, "text": "Complete the sentences with a reflexive pronoun, a possessive pronoun/'s form, can, or might.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "I checked my answers ___ before giving them to the teacher.", "section": "Complete the rule", "reveal": "myself", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This pen isn't mine — I think it's ___.", "section": "Complete the rule", "reveal": "yours", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ I borrow your notes for tonight?", "section": "Complete the rule", "reveal": "Can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I'm not certain, but I ___ use a new app for revision this term.", "section": "Complete the rule", "reveal": "might", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Reflexive pronouns (myself, yourself, himself, herself, itself, ourselves, yourselves, themselves) show that the subject and object of an action are the same. Possessive pronouns (mine, yours, his, hers, ours, theirs) and 's show ownership. Can is used for ability, permission, requests, or possibility. Might is used for a weaker, less certain possibility than may or can.", "tr": "Dönüşlü zamirler (myself, yourself, himself, herself, itself, ourselves, yourselves, themselves) eylemin öznesi ve nesnesinin aynı kişi olduğunu gösterir. İyelik zamirleri (mine, yours, his, hers, ours, theirs) ve 's eki sahiplik bildirir. 'Can' yetenek, izin, rica veya olasılık için kullanılır. 'Might', 'may' veya 'can'e göre daha zayıf, daha az kesin bir olasılık bildirir.", "when_en": "We use reflexive pronouns when the subject does the action to itself, possessives to avoid repeating a noun, can for everyday requests/permission, and might when we are not sure something will happen.", "when": "Özne eylemi kendine yaparken dönüşlü zamir, bir ismi tekrar etmemek için iyelik zamiri, günlük rica/izinlerde 'can', bir şeyin olup olmayacağından emin olunmadığında 'might' kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["she", "/", "did", "/", "the project", "/", "by herself"], "reveal": "She did the project by herself.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["can", "/", "I", "/", "borrow", "/", "your dictionary", "?"], "reveal": "Can I borrow your dictionary?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this laptop", "/", "not mine", "/", "it", "/", "be", "/", "Deniz's"], "reveal": "This laptop isn't mine — it might be Deniz's.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "/", "possibility", "/", "have", "/", "a quiz", "/", "next week"], "reveal": "We might have a quiz next week.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "/", "taught", "/", "himself", "/", "how to use the app"], "reveal": "He taught himself how to use the app.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["can", "/", "you", "/", "help", "/", "me", "/", "with this exercise", "?"], "reveal": "Can you help me with this exercise?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences: one about doing something by yourself, one asking for permission with can, and one about a possible plan using might.", "chips": ["I usually study by...", "Can I...?", "This weekend I might..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I did it myself.", "This book is hers.", "You can use the tablet.", "It might rain later."], "negative": ["He didn't do it himself.", "This isn't mine.", "You can't use your phone now.", "We might not finish today."], "question": ["Did you write it yourself?", "Is this pen yours?", "Can I ask a question?"], "short": ["Yes, you can. / No, you can't.", "It might. / It might not."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She hurt herself's arm.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She hurt her arm herself.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the book of Mert.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is Mert's book.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I fixed the settings on the tablet all by ___.", "section": "", "options": ["myself", "mine", "me", "my"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "These headphones are ___ (belonging to me), not yours.", "section": "", "reveal": "mine", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Can I to borrow your pen?", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Can I borrow your pen?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "I'm not sure about my plans, but I ___ join the study group tonight.", "section": "", "reveal": "might", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Whose notebook is this? It's ___.", "section": "", "options": ["Elif's", "Elif", "Elif is", "of Elif"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using a reflexive pronoun: 'He learned to use the app without any help.'", "section": "", "reveal": "He taught himself to use the app. / He learned to use the app by himself.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: I / your / borrow / laptop / can", "section": "", "words": ["can", "I", "borrow", "your", "laptop"], "end": "?", "reveal": "Can I borrow your laptop?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite to express a weaker possibility: 'We will have an online quiz tomorrow.' (not certain)", "section": "", "reveal": "We might have an online quiz tomorrow.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This is not our classroom; it's ___ (belonging to them).", "section": "", "reveal": "theirs", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Day in Our Classroom", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kinds of activities do you expect in a typical school day?", "Think about your own favourite classroom activity before you read."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Day in Our Classroom", "num": 1, "total": 4, "text": "Every morning, our classroom is full of different learning activities. In the first lesson, we usually work in pairs and check our homework together. Our teacher walks around the room, listens to our conversations, and gives quick feedback when we make a mistake. Some students prefer working alone, but most of us enjoy pair work because we can help each other understand new words.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day in Our Classroom", "num": 2, "total": 4, "text": "Later in the day, we often do a short presentation. Each group chooses a topic, prepares a few slides, and speaks in front of the class. At first, many students feel nervous, but after a few presentations, they become more confident. Presentations are also a great way to practise pronunciation and organise ideas clearly.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day in Our Classroom", "num": 3, "total": 4, "text": "In the afternoon, we sometimes use a tablet or a computer for an online quiz. This is going to be a normal part of every lesson soon, because our school is going to buy more digital devices next year. Some students are visual learners and remember new grammar better when they see a diagram on the screen, while others are auditory learners and prefer listening to a short recording.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day in Our Classroom", "num": 4, "total": 4, "text": "At the end of the day, the teacher gives us a handout with revision notes and says, 'You should read this at home tonight.' Not every student agrees on the best learning style, but everyone must complete the homework by the next lesson. For most of us, a mix of pair work, presentations, and technology makes learning more interesting than just reading from a book.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What happens during the first lesson, according to the text?", "section": "While you read", "options": ["Students watch a video alone.", "Students work in pairs and check homework.", "Students take a test.", "Students clean the classroom."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, all students feel confident the first time they give a presentation.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Many students feel nervous at first and become more confident after a few presentations.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does the school plan to buy more digital devices?", "section": "While you read", "options": ["Because students dislike technology.", "Because online quizzes will become a normal part of every lesson.", "Because the teacher wants a new phone.", "The text doesn't say."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "According to the text, visual learners remember grammar better when they see a ___ on the screen.", "section": "While you read", "reveal": "diagram", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What must every student do, according to the text?", "section": "While you read", "options": ["Buy a tablet.", "Complete the homework by the next lesson.", "Give a presentation every day.", "Choose only one learning style."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The text says a mix of pair work, presentations, and technology makes learning more interesting for most students.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Which activity from the text is most similar to something you do in your own classroom?", "Do you agree that a mix of activities makes learning more interesting? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Finding Your Own Learning Style", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think 'learning style' means?", "Guess one way you learn best before reading the text."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Finding Your Own Learning Style", "num": 1, "total": 4, "text": "Not every student learns in the same way, and understanding your own learning style can make studying easier. Some people are visual learners: they remember information better when they see it as a picture, colour, or diagram. Other people are auditory learners, who understand a new grammar point more easily after listening to an explanation or a recording rather than reading it silently.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Finding Your Own Learning Style", "num": 2, "total": 4, "text": "There is also a third common style, sometimes called hands-on or kinaesthetic learning. Students with this style often say that they learn best by doing something practical, such as acting out a dialogue, building a model, or moving around the classroom during an activity. If you often find yourself doodling in the margin of your notebook, you might actually be a hands-on learner who needs movement to concentrate.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Finding Your Own Learning Style", "num": 3, "total": 4, "text": "Of course, most students are not only one type. You might be mainly a visual learner but still enjoy listening to a short podcast, and you should try different methods before deciding what works best for you. A simple way to discover your style is to keep a short learning diary for two weeks and write down which activities helped you remember new vocabulary or grammar most easily.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Finding Your Own Learning Style", "num": 4, "total": 4, "text": "Teachers can support different learning styles by mixing activities: showing a diagram for visual learners, playing a short recording for auditory learners, and adding a hands-on task like a role-play for kinaesthetic learners. As a student, you don't have to wait for the teacher to do this — you can also adapt your own revision at home, for example by turning your notes into a mind map, a short recording, or flashcards you can hold and sort.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is true about auditory learners, according to the text?", "section": "While you read", "options": ["They prefer moving around the classroom.", "They remember information better through listening.", "They never use diagrams.", "They dislike podcasts."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A student who often doodles in the margin might actually be a ___ learner.", "section": "While you read", "reveal": "hands-on / kinaesthetic", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, most students belong to only one single learning style.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Most students are not only one type; they can combine different learning styles.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the text suggest as a way to discover your own learning style?", "section": "While you read", "options": ["Ask a friend to guess.", "Keep a short learning diary for two weeks.", "Only use flashcards.", "Avoid all technology."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the last paragraph, what can students do at home without waiting for the teacher?", "section": "While you read", "options": ["Nothing, they must wait for class.", "Adapt their own revision, e.g. mind maps or flashcards.", "Change the school timetable.", "Only listen to recordings."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The text suggests teachers should only use one type of activity to be fair to every learning style.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text suggests teachers should mix different activities to support different learning styles.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Which learning style described in the text sounds most like you?", "What is one new study method from the text that you might try this week?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning Our Class Project", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What do groups usually need to decide before starting a class project?", "Predict one thing the students might disagree about."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning Our Class Project", "audio": null, "transcript": [{"speaker": "Deniz", "line": "Okay, so for our project on learning styles, what are we going to do first?"}, {"speaker": "Elif", "line": "I think we should make a short survey and ask our classmates about their favourite way of studying."}, {"speaker": "Deniz", "line": "Good idea. I'll design the questions tonight, and you can ask people tomorrow, right?"}, {"speaker": "Elif", "line": "Sure. We also have to include some information about technology, don't we?"}, {"speaker": "Deniz", "line": "Yes, the teacher said we must add at least one section about using apps or devices for revision."}, {"speaker": "Elif", "line": "Okay. I might use my own tablet to make a simple presentation, if that's fine with you."}, {"speaker": "Deniz", "line": "That's a great idea. Can I help you choose the pictures for the slides?"}, {"speaker": "Elif", "line": "Of course! And we shouldn't forget the handout — the teacher wants a printed summary too."}, {"speaker": "Deniz", "line": "Right. I'll finish the survey questions by myself tonight, and we'll meet again on Thursday."}, {"speaker": "Elif", "line": "Perfect. This project is going to be really interesting, isn't it?"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Deniz and Elif's project about?", "section": "While you listen", "options": ["School rules", "Learning styles", "Sports activities", "School trips"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Deniz says he will design the ___ tonight.", "section": "While you listen", "reveal": "questions", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The teacher said the project doesn't need any information about technology.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The teacher said they must add a section about using apps or devices for revision.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Elif offer to use for the presentation?", "section": "While you listen", "options": ["A printed book", "Her own tablet", "The school computer", "A phone camera only"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When will Deniz and Elif meet again?", "section": "While you listen", "options": ["Monday", "Tuesday", "Thursday", "Friday"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Would you prefer to work on this project alone or in a pair? Why?", "What other section could this project include?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Study Tips from a Classmate", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What study tip do you already know and use?", "Listen and note down two new tips you hear."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Study Tips from a Classmate", "audio": null, "transcript": [{"speaker": "Narrator", "line": "Hi, I'm Kaan, and I want to share how I study for English lessons."}, {"speaker": "Narrator", "line": "First, you should always revise your notes on the same day, not just before a test."}, {"speaker": "Narrator", "line": "I usually make my own flashcards, and I test myself every evening for about ten minutes."}, {"speaker": "Narrator", "line": "You don't have to use expensive materials — a simple notebook is enough."}, {"speaker": "Narrator", "line": "I'm a visual learner, so I often turn new grammar rules into small diagrams or colour codes."}, {"speaker": "Narrator", "line": "If you're not sure about your own learning style, you might try a few different methods this month."}, {"speaker": "Narrator", "line": "I also use a vocabulary app on my phone, but I must remember to close social media apps first!"}, {"speaker": "Narrator", "line": "Finally, ask your teacher for feedback regularly — it really helps you see your progress."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "According to Kaan, when should you revise your notes?", "section": "While you listen", "options": ["Only before a test", "On the same day", "Once a month", "Never"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kaan says you have to buy expensive materials to study well.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kaan says you don't have to us
