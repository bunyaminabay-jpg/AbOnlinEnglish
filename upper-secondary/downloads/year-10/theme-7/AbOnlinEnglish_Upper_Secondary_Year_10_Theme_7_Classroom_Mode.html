elative clauses to give essential information that identifies exactly who or what we are talking about. Use 'who' for people, 'which' for things, and 'that' for both people and things. No comma is used before the clause.", "tr": "Tanımlayıcı ilgi cümlecikleri, kimden veya neden bahsettiğimizi tam olarak belirten gerekli bilgiyi verir. İnsanlar için 'who', nesneler için 'which', hem insanlar hem nesneler için 'that' kullanılır. Cümlecikten önce virgül kullanılmaz.", "when_en": "Use a defining relative clause when the information in the clause is necessary to understand which person or thing you mean.", "when": "Cümlecikteki bilgi, hangi kişi veya nesneden bahsettiğimizi anlamak için gerekliyse tanımlayıcı ilgi cümleciği kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["oil / non-renewable resource / comes from the ground"], "reveal": "Oil is a non-renewable resource that comes from the ground.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["farmers / people / grow our food"], "reveal": "Farmers are people who grow our food.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["plastic / material / takes hundreds of years to break down"], "reveal": "Plastic is a material that takes hundreds of years to break down.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the Amazon / forest / produces a lot of the world's oxygen"], "reveal": "The Amazon is a forest which produces a lot of the world's oxygen.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["a biologist / scientist / studies living things"], "reveal": "A biologist is a scientist who studies living things.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["recycling bins / containers / help us sort our waste"], "reveal": "Recycling bins are containers that help us sort our waste.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences of your own using defining relative clauses (that/which/who) about nature or the environment.", "chips": ["A natural resource that...", "People who...", "An animal which..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The resource that/which we use most is water.", "People who protect nature are important."], "negative": ["This isn't the kind of pollution that we can ignore.", "There aren't many rivers which are still clean."], "question": ["Is this the forest that was damaged by the fire?", "Who is the person who started this project?"], "short": ["Not applicable in short-answer form; the clause is part of a longer sentence."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The man which works in recycling is my neighbour.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The man who works in recycling is my neighbour.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Solar power, that is renewable, is getting cheaper.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Solar power, which is renewable, is getting cheaper.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "Coal is a fuel ___ comes from underground.", "section": "", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The volunteers ___ cleaned the beach worked all day.", "section": "", "reveal": "who / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct word: 'The scientist ___ discovered the problem published a report.'", "section": "", "options": ["which", "who", "what", "whose"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The river which flows near our town is very clean.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The man which works at the recycling plant is helpful.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The man who works at the recycling plant is helpful.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Combine: 'Wind is a resource. It never runs out.'", "section": "", "reveal": "Wind is a resource that/which never runs out.", "prompt": "Use a relative clause.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: is / clean / a / that / fuel / hydrogen", "section": "", "words": ["hydrogen", "is", "a", "fuel", "that", "is", "clean"], "end": ".", "reveal": "Hydrogen is a fuel that is clean.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Combine: 'Farmers grow our food. They need clean water.'", "section": "", "reveal": "Farmers who grow our food need clean water.", "prompt": "Use 'who' and combine the two ideas into one sentence.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The company ___ builds wind turbines is expanding fast.", "section": "", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Connecting words: so (cause and effect)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The lake dried up, <mark>so<\/mark> the farmers could not water their crops.", "We recycle our waste, <mark>so<\/mark> less rubbish goes to landfill.", "The city has strict pollution rules, <mark>so<\/mark> the air is cleaner now.", "There was a long drought, <mark>so<\/mark> water became very expensive."], "ask": "What does 'so' connect in each sentence? Which part is the cause and which part is the effect?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["so"], "chips": true, "text": "Complete the sentences with 'so' and choose the correct effect.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Factories released a lot of smoke, ___ the air quality got worse.", "section": "Complete the rule", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The forest was cut down, ___ many animals lost their homes.", "section": "Complete the rule", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "People started using solar panels, ___ electricity bills went down.", "section": "Complete the rule", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The river was very polluted, ___ the fish began to disappear.", "section": "Complete the rule", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use 'so' to connect a cause (the reason) with its effect (the result). The cause comes first, followed by a comma, then 'so' and the effect.", "tr": "'So' bir nedeni (sebebi) sonucuyla (etkisiyle) bağlamak için kullanılır. Önce neden gelir, sonra virgül, sonra 'so' ve etki gelir.", "when_en": "Use 'so' when you want to show that one event or situation directly causes another.", "when": "Bir olayın veya durumun doğrudan başka bir olaya neden olduğunu göstermek istediğinizde 'so' kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["it didn't rain for months / the crops died"], "reveal": "It didn't rain for months, so the crops died.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the city built a recycling centre / less waste goes to landfill"], "reveal": "The city built a recycling centre, so less waste goes to landfill.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the ice is melting / sea levels are rising"], "reveal": "The ice is melting, so sea levels are rising.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we turned off the lights / we saved energy"], "reveal": "We turned off the lights, so we saved energy.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["hunting increased / the species became endangered"], "reveal": "Hunting increased, so the species became endangered.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the government banned plastic bags / the beaches are cleaner"], "reveal": "The government banned plastic bags, so the beaches are cleaner.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences using 'so' to show a cause and its effect on the environment.", "chips": ["There was a lot of pollution, so...", "People started recycling more, so...", "The weather changed, so..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The river was polluted, so the government closed the beach.", "We saved water, so our bills were lower."], "negative": ["We didn't recycle enough, so waste kept increasing.", "They didn't protect the forest, so animals lost their habitat."], "question": ["Not typically used to form questions; 'so' links two statements.", "Why did they build solar farms, so that they could reduce emissions? (less common form)"], "short": ["Not applicable; 'so' joins two clauses rather than giving a short answer."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The air was dirty, because people stopped going outside.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The air was dirty, so people stopped going outside.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "It was raining so we brought umbrellas so we didn't get wet.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It was raining, so we brought umbrellas.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "The factory closed, ___ pollution in the area dropped.", "section": "", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct connector: 'The drought lasted six months, ___ the crops failed.'", "section": "", "options": ["because", "so", "although", "but"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "We recycled more paper, so fewer trees were cut down.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "So the ice melted, sea levels rose.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The ice melted, so sea levels rose.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Combine using 'so': 'The lake dried up. Farmers could not grow crops.'", "section": "", "reveal": "The lake dried up, so farmers could not grow crops.", "prompt": "Cause first, then 'so'.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: cleaner, is, so, less, we, waste, the, city, recycle,", "section": "", "words": ["we", "recycle", "less", "waste,", "so", "the", "city", "is", "cleaner"], "end": ".", "reveal": "We recycle less waste, so the city is cleaner.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Combine: 'The company used too much water. The river shortage got worse.'", "section": "", "reveal": "The company used too much water, so the river shortage got worse.", "prompt": "Use 'so' to link the two ideas.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Governments invested in wind turbines, ___ renewable energy use increased.", "section": "", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The World's Water Problem", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think the text will be about?", "How much water do you think a family uses in one day?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The World's Water Problem", "num": 1, "total": 4, "text": "Water is one of the most important natural resources on Earth, but it is not endless. Although almost seventy percent of the planet is covered with water, only a small part of it is fresh water that people, animals, and plants can use. Most fresh water is locked in ice or deep underground, so the amount that is easily available is actually quite limited.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The World's Water Problem", "num": 2, "total": 4, "text": "In many parts of the world, people are already facing serious water shortages. Long periods of drought, growing populations, and wasteful habits are putting pressure on rivers and lakes that used to provide plenty of clean water. In some regions, farmers cannot grow enough food because there simply isn't enough water for their fields, so families are forced to move to cities to find other work.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The World's Water Problem", "num": 3, "total": 4, "text": "Factories and farms are also responsible for a lot of water pollution. Chemicals and waste that are dumped into rivers make the water unsafe for drinking, swimming, or fishing. This pollution harms the ecosystems that depend on clean water, and it can take many years for a damaged river to recover.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The World's Water Problem", "num": 4, "total": 4, "text": "Fortunately, there are simple actions that can help. Fixing leaking pipes, taking shorter showers, and collecting rainwater are habits that reduce water waste at home. On a larger scale, governments and companies that invest in better water treatment and recycling systems can protect this resource for future generations. Every person who saves water, even a small amount, makes a difference.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What percentage of the Earth's surface is covered with water?", "section": "While you read", "options": ["About 30%", "About 50%", "About 70%", "About 90%"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, most of the Earth's water is easy for people to use.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Most fresh water is locked in ice or underground, so only a small part is easily available.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why do some farmers move to cities, according to the text?", "section": "While you read", "options": ["They prefer city life.", "There isn't enough water for their fields.", "Cities have better schools.", "Farming is no longer legal."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Chemicals and waste dumped into rivers make the water unsafe for drinking, swimming, ___ fishing.", "section": "While you read", "reveal": "or", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which of these is NOT mentioned as a way to reduce water waste at home?", "section": "While you read", "options": ["Fixing leaking pipes", "Taking shorter showers", "Collecting rainwater", "Buying bottled water"], "answer": 3, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite this sentence using a relative clause: 'Governments invest in water treatment systems. These systems can protect this resource.'", "section": "While you read", "reveal": "Governments invest in water treatment systems that/which can protect this resource.", "prompt": "Use 'that' or 'which'.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["What is one habit from the text that you could start doing at home?", "Do you think water shortages will become a bigger problem in the future? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Saving the Rainforest", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you already know about rainforests?", "Why do you think rainforests are important for the whole planet?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Saving the Rainforest", "num": 1, "total": 4, "text": "Rainforests, which cover only a small part of the Earth's land, are home to more than half of the world's plant and animal species. They also produce a large amount of the oxygen we breathe and absorb huge amounts of carbon dioxide, so they play a key role in controlling the planet's climate.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Rainforest", "num": 2, "total": 4, "text": "Despite their importance, rainforests are disappearing quickly. Every year, large areas of forest are cut down for wood, farmland, and mining. This process, which is called deforestation, destroys the habitats of countless animals and forces some species closer to extinction. When trees that store carbon are burned or removed, that carbon is released into the atmosphere, so deforestation also makes climate change worse.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Rainforest", "num": 3, "total": 4, "text": "People who live near rainforests often depend on them for food, medicine, and their way of life. When the forest disappears, these communities lose resources that they have used for generations. This shows that protecting rainforests is not only about saving animals and plants, but also about supporting the people who call these forests home.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Rainforest", "num": 4, "total": 4, "text": "There are hopeful signs, though. Organisations that plant new trees, governments that create protected forest areas, and companies that choose sustainable wood are all part of the solution. Consumers who check where their products come from can also help by choosing goods that do not contribute to deforestation. Small choices, repeated by millions of people, can add up to a big difference.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what percentage of the world's plant and animal species live in rainforests?", "section": "While you read", "options": ["Less than 10%", "About 25%", "More than half", "Exactly 100%"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deforestation has no effect on climate change.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deforestation makes climate change worse because it releases stored carbon into the atmosphere.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why do some local communities lose important resources when the forest disappears?", "section": "While you read", "options": ["They move to other forests.", "They depend on the forest for food, medicine, and their way of life.", "They no longer need natural resources.", "The government gives them new land."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Every year, large areas of forest are cut down for wood, farmland, ___ mining.", "section": "While you read", "reveal": "and", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which group is NOT mentioned as part of the solution?", "section": "While you read", "options": ["Organisations that plant trees", "Governments that create protected areas", "Companies that choose sustainable wood", "Airlines that offer cheaper flights"], "answer": 3, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine using 'so': 'Trees store carbon. Burning trees releases that carbon into the air.'", "section": "While you read", "reveal": "Trees store carbon, so burning trees releases that carbon into the air.", "prompt": "Cause first, then 'so'.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which solution from the text do you think is the most effective? Why?", "What could you personally do to help protect rainforests?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A School Project on Natural Resources", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What natural resources do you think your school uses every day?", "Have you ever done a project about the environment? What was it about?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A School Project on Natural Resources", "audio": null, "transcript": [{"speaker": "Teacher", "line": "Okay everyone, for this term's project, I want you to choose a natural resource that is important in our region and explain how we can protect it."}, {"speaker": "Ayşe", "line": "I'd like to research water, because our town had a shortage last summer, so people had to limit how much they used."}, {"speaker": "Teacher", "line": "That's a great choice. Who else has an idea?"}, {"speaker": "Emre", "line": "I want to look at forests. There's a forest near my village that is losing trees every year because of illegal cutting."}, {"speaker": "Teacher", "line": "Interesting. Remember, your project should explain the problem and suggest realistic solutions that people can actually use."}, {"speaker": "Ayşe", "line": "For water, I'm thinking about interviewing farmers who use irrigation, and asking them what changes they've made."}, {"speaker": "Emre", "line": "For forests, I want to visit the area that was damaged and take photos, so people can really see the problem."}, {"speaker": "Teacher", "line": "Both sound excellent. Don't forget to include at least three ways to protect the resource you choose, and present your project next Friday."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the class project about?", "section": "While you listen", "options": ["A history project", "A natural resource in their region", "A sports event", "A cooking competition"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Ayşe chose to research forests.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ayşe chose to research water; Emre chose forests.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why did Ayşe's town have problems last summer?", "section": "While you listen", "options": ["A flood", "A water shortage", "A forest fire", "A power cut"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Emre wants to visit the damaged forest area and take photos, ___ people can really see the problem.", "section": "While you listen", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What must each project include, according to the teacher?", "section": "While you listen", "options": ["A video", "At least three ways to protect the resource", "A poem", "An interview with a scientist"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Which project would you rather do, Ayşe's or Emre's? Why?", "What natural resource would you choose for a project like this?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Talking About Renewable Energy", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What forms of renewable energy do you know?", "Do you think your city uses much renewable energy?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Talking About Renewable Energy", "audio": null, "transcript": [{"speaker": "A", "line": "Have you seen the new solar panels on the community centre roof?"}, {"speaker": "B", "line": "Yes! I read that they produce enough electricity for the whole building, so the centre doesn't need to buy much power anymore."}, {"speaker": "A", "line": "That's amazing. I think wind turbines are also a good option for our region, because it's often windy here."}, {"speaker": "B", "line": "True, although wind turbines that are built near towns sometimes make noise, which some people don't like."}, {"speaker": "A", "line": "That's a fair point. What about people who live far from the coast, where there's less wind?"}, {"speaker": "B", "line": "Good question. I guess solar power works better for them, since most places get enough sunlight."}, {"speaker": "A", "line": "I read an article that said renewable energy could provide most of our electricity within twenty years."}, {"speaker": "B", "line": "I hope so. The sooner we reduce our use of fossil fuels, the better it will be for the planet."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What has been installed on the community centre roof?", "section": "While you listen", "options": ["Wind turbines", "Solar panels", "A water tank", "A garden"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Everyone agrees that wind turbines have no disadvantages.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Speaker B says wind turbines built near towns can make noise, which some people don't like.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "According to Speaker B, which energy source works well for people far from the coast?", "section": "While you listen", "options": ["Wind power", "Solar power", "Coal power", "Water power"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The solar panels produce enough electricity for the whole building, ___ the centre doesn't need to buy much power anymore.", "section": "While you listen", "reveal": "so", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you listen", "list": ["Do you think your area is better suited to solar or wind energy? Why?", "What renewable energy source would you like to see used more in your town?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Protecting Our Natural Resources", "text": "In your group, discuss three natural resources in your region and agree on the two most important actions your community could take to protect each one.", "steps": ["Choose three natural resources that are important in your region.", "Discuss why each resource is important and what problems it faces.", "Agree on two protection actions for each resource.", "Prepare a short summary to present to the class."], "chips": ["I think we should...", "One resource that is at risk is...", "In my opinion, the best solution is...", "I agree/disagree because...", "We could also consider..."], "timer": 600, "levels": ["Give students a list of resource and problem words (water, forest, soil, pollution, shortage) to use as prompts.", "Students discuss freely, using relative clauses and 'so' where natural.", "Ask stronger groups to rank all six actions from most to least urgent and justify the order."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Role-Play: Town Council Meeting", "text": "Role-play a town council meeting where members debate a new factory that could bring jobs but may harm a nearby river. Decide together whether to approve it.", "steps": ["Assign roles: council leader, factory representative, environmental expert, local resident.", "Each role prepares two or three points to support their position.", "Hold the meeting and let each member speak.", "Vote as a group and explain your final decision."], "chips": ["The factory that we are discussing...", "This decision will affect people who...", "If we approve this, so...", "I'm concerned about...", "A fair compromise would be..."], "timer": 600, "levels": ["Provide role cards with key phrases and vocabulary for each character.", "Students argue their assigned position and reach a group decision.", "Ask stronger students to include a compromise solution that considers both jobs and the environment."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Describing a Natural Resource", "text": "Write a paragraph describing a natural resource that is important in your region, explaining why it matters and what problems it faces.", "steps": ["Choose the resource and write one sentence introducing it.", "List 2-3 reasons why it is important.", "Note 1-2 problems it faces.", "Write a closing sentence about its future."], "chips": ["natural resource", "renewable/non-renewable", "shortage", "conserve", "ecosystem", "A defining relative clause (..., which is...)", "'so' to link a cause and its effect"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Proposal to Protect Nature", "text": "Write a short proposal to your school suggesting two or three ways to protect natural resources on campus (for example, water, paper, or energy).", "steps": ["Introduce the problem in one sentence.", "Suggest 2-3 clear actions.", "Explain the benefit of each action using 'so'.", "End with a short, encouraging conclusion."], "chips": ["sustainable", "recycle", "consumption", "conserve", "waste", "Cause and effect with 'so'", "Suggestion language (We should.../ I suggest that...)"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'a fuel that will eventually run out'?", "section": "Exit ticket", "options": ["renewable", "non-renewable", "sustainable", "recyclable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The scientist ___ discovered the problem works at our university.", "section": "Exit ticket", "reveal": "who / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "The rainforest produces a lot of oxygen, ___ it is important for the whole planet.", "section": "Exit ticket", "options": ["because", "so", "although", "but"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to reading passage 1, most of the Earth's water is easy for people to use.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Most fresh water is locked in ice or underground, so it is not easily available.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In listening 2, what did Speaker B say about wind turbines near towns?", "section": "Exit ticket", "options": ["They are silent.", "They can make noise.", "They are always broken.", "They are illegal."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine: 'Deforestation destroys habitats. Many animals lose their homes.'", "section": "Exit ticket", "reveal": "Deforestation destroys habitats, so many animals lose their homes.", "prompt": "Use 'so'.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Water is a resource ___ every living thing needs.", "section": "Exit ticket", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which is an example of a renewable energy source?", "section": "Exit ticket", "options": ["Coal", "Oil", "Solar power", "Natural gas"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: so, we, energy, panels, installed, save, solar,", "section": "Exit ticket", "words": ["we", "installed", "solar", "panels", "so", "we", "save", "energy"], "end": ".", "reveal": "We installed solar panels so we save energy.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "mcq", "q": "What does the word 'endangered' describe?", "section": "Exit ticket", "options": ["A very common animal", "An animal at risk of disappearing", "A pet animal", "A newly discovered animal"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}], "theme": "Year 10 · Theme 7 · Life in Nature & Global Problems", "key": "year-10-7"}</script><script src="../../../assets/us-present.js"></script></body></html>
