acak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The phone was ringing while we watched a film for a moment.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The phone rang while we were watching a film.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I ___ at the bus stop when it started to rain.", "section": "", "options": ["was waiting", "waited", "wait", "waits"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "While we ___ (queue) at the cinema, we ___ (meet) our classmates.", "section": "", "reveal": "were queuing, met", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She was cycling to the gym when she was falling off her bike.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She was cycling to the gym when she fell off her bike.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: were / when / we / a taxi / took / it / raining / started", "section": "", "words": ["we", "took", "a", "taxi", "when", "it", "started", "raining"], "end": ".", "reveal": "We took a taxi when it started raining.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Combine: I was shopping. + I saw my teacher.", "section": "", "reveal": "While I was shopping, I saw my teacher. / ag positive and when is it negative?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["isn't it", "weren't you", "does she", "were they", "wasn't it", "don't you"], "chips": true, "text": "Add the correct question tag to each sentence.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The new cafe is really nice, ___?", "section": "Complete the rule", "reveal": "isn't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You were queuing at the hospital yesterday, ___?", "section": "Complete the rule", "reveal": "weren't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She doesn't take the metro to work, ___?", "section": "Complete the rule", "reveal": "does she", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "They weren't at the sports club on Sunday, ___?", "section": "Complete the rule", "reveal": "were they", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The traffic jam was terrible this morning, ___?", "section": "Complete the rule", "reveal": "wasn't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A question tag is a short question added to the end of a statement to check information or start a conversation. A positive statement takes a negative tag, and a negative statement takes a positive tag.", "tr": "Question tag, bir bilgiyi doğrulamak veya sohbeti başlatmak için cümle sonuna eklenen kısa bir sorudur. Olumlu cümle olumsuz tag alır, olumsuz cümle olumlu tag alır.", "when_en": "We use question tags in everyday conversation to confirm facts, check opinions, or invite the listener to agree.", "when": "Günlük konuşmada bir bilgiyi doğrulamak, fikir sormak veya dinleyicinin katılımını istemek için kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["The bus fare", "went up", "positive statement"], "reveal": "The bus fare went up, didn't it?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "like the new cycle lane", "positive"], "reveal": "You like the new cycle lane, don't you?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the pharmacy", "isn't open on Sundays", "negative"], "reveal": "The pharmacy isn't open on Sundays, is it?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "were walking to the cinema", "positive"], "reveal": "They were walking to the cinema, weren't they?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "can't drive yet", "negative"], "reveal": "She can't drive yet, can she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the metro", "is faster than the bus", "positive"], "reveal": "The metro is faster than the bus, isn't it?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original question-tag questions for a short survey about transportation or local services in your neighbourhood.", "chips": ["The nearest pharmacy is..., isn't it?", "You usually take..., don't you?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Positive statement + negative tag (auxiliary + n't + pronoun)", "e.g. It's convenient, isn't it?"], "negative": ["Negative statement + positive tag (auxiliary + pronoun)", "e.g. It isn't convenient, is it?"], "question": ["The tag repeats the auxiliary/modal of the main sentence and matches its subject pronoun.", "e.g. You can walk there, can't you?"], "short": ["Yes, it is. / No, it isn't.", "Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The gym is new, is it?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The gym is new, isn't it?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She doesn't like the bus, doesn't she?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She doesn't like the bus, does she?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You were late, was you?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You were late, weren't you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "The new sports club is expensive, ___?", "section": "", "reveal": "isn't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You weren't at the pharmacy this morning, ___?", "section": "", "reveal": "were you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "He can take the metro from here, ___?", "section": "", "options": ["can't he", "can he", "does he", "doesn't he"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The bus was late, was it?", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The bus was late, wasn't it?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: cinema / to / the / isn't / far / it / , /?", "section": "", "words": ["the", "cinema", "isn't", "far,", "is", "it"], "end": "?", "reveal": "The cinema isn't far, is it?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Add a tag: They don't use the gym often.", "section": "", "reveal": "They don't use the gym often, do they?", "prompt": "...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Add a tag: The traffic wasn't too bad this morning.", "section": "", "reveal": "The traffic wasn't too bad this morning, was it?", "prompt": "...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which tag correctly completes: 'Let's take the metro, ___?'", "section": "", "options": ["shall we", "don't we", "are we", "won't we"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Saturday in Our Neighbourhood", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you usually do in your neighbourhood on a Saturday afternoon?", "Look at the title. What activities do you expect to read about?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Saturday in Our Neighbourhood", "num": 1, "total": 3, "text": "Saturday afternoons in our neighbourhood are always busy. Families walk along the main street, stopping at the small cafe on the corner for a coffee or a hot chocolate. A little further down, the cinema shows both new films and old favourites, and there is usually a small queue outside before the afternoon show starts. Many teenagers prefer to meet at the gym or the sports club instead, especially since the club opened a new indoor football pitch last spring.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Saturday in Our Neighbourhood", "num": 2, "total": 3, "text": "Last Saturday, something a little different happened. While most people were doing their usual shopping, a group of students was setting up a small stall outside the cafe. They were collecting old books and toys for a charity project organised by their school. A few customers were queuing for coffee when they noticed the stall, and many of them stopped to look at the books before continuing on their way.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Saturday in Our Neighbourhood", "num": 3, "total": 3, "text": "By four o'clock, the stall had collected more items than the students expected. Meanwhile, at the sports club nearby, a junior basketball match was taking place, and a small crowd was watching from outside the fence. The cafe owner, who was watching the stall from his window, decided to give the students free drinks for their hard work. It was a simple Saturday, but it showed how much people in the neighbourhood enjoy supporting each other.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What were the students doing outside the cafe?", "section": "While you read", "options": ["Selling coffee", "Collecting items for charity", "Watching a film", "Playing basketball"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The sports club has had an indoor football pitch since last spring.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": null, "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Many customers were ___ for coffee when they noticed the stall.", "section": "While you read", "reveal": "queuing / queueing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why did the cafe owner give the students free drinks?", "section": "While you read", "options": ["They were regular customers.", "It was his birthday.", "He appreciated their hard work.", "They paid for the drinks."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "A basketball match was taking place at the cinema.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "A basketball match was taking place at the sports club.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "By four o'clock, the stall had collected ___ items than expected.", "section": "While you read", "reveal": "more", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Would you stop to help at a charity stall like this one? Why or why not?", "What other activities could a neighbourhood organise on a Saturday?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Getting Help in the City", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Where do you usually go first when you feel unwell?", "What problems can make it difficult to reach a hospital or pharmacy?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Getting Help in the City", "num": 1, "total": 3, "text": "Getting help from local services is part of everyday life in any city. When people feel unwell, the pharmacy is often the first place they go. Pharmacists can suggest simple medicine for a cold or a headache, and they can explain how a prescription from a doctor should be used. Most pharmacies in the city centre stay open until late, which is convenient for people who finish work in the evening.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Getting Help in the City", "num": 2, "total": 3, "text": "For more serious problems, people usually go to the hospital. On a typical afternoon, the waiting room is often full, and patients take a number before seeing the receptionist. Emergency cases are seen first, while other patients wait for their appointment. A nurse explained that although the waiting room was crowded yesterday, the hospital tries to see every patient as quickly as possible.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Getting Help in the City", "num": 3, "total": 3, "text": "Getting to these services is not always easy, however. Some neighbourhoods are close to a metro station, so a hospital visit takes only a few minutes. Other areas depend more on buses, and a delay in the timetable can make people late for an appointment. Because of this, city planners are now discussing a new bus route that would connect more neighbourhoods directly to the main hospital, making it easier for everyone to get the help they need.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What can pharmacists do, according to the text?", "section": "While you read", "options": ["Perform surgery", "Suggest simple medicine and explain prescriptions", "Drive the ambulance", "Design bus routes"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Emergency cases wait the same amount of time as other patients.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Emergency cases are seen first.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A nurse explained that the waiting room was ___ yesterday.", "section": "While you read", "reveal": "crowded", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why are city planners discussing a new bus route?", "section": "While you read", "options": ["To reduce fares", "To connect more neighbourhoods to the hospital", "To close the metro station", "To build a new cinema"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "All neighbourhoods in the city are close to a metro station.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Some neighbourhoods depend more on buses instead.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A delay in the bus ___ can make people late for an appointment.", "section": "While you read", "reveal": "timetable", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think your neighbourhood has good access to a hospital or pharmacy? Why?", "What would you suggest to improve transportation to local services?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Meeting at the Pharmacy", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What might make someone late for a meeting in the neighbourhood?", "Listen and find out where speaker B was waiting."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Meeting at the Pharmacy", "audio": null, "transcript": [{"speaker": "A", "line": "Hi! Sorry I'm late. What were you doing when I called?"}, {"speaker": "B", "line": "I was waiting outside the pharmacy. My mum needed a prescription."}, {"speaker": "A", "line": "Oh no, was it busy?"}, {"speaker": "B", "line": "Yes, there was a long queue. While I was waiting, I saw Mr. Aydın from our sports club."}, {"speaker": "A", "line": "Really? What was he doing there?"}, {"speaker": "B", "line": "He was picking up medicine too. He asked if we were still coming to the gym tonight."}, {"speaker": "A", "line": "We are, aren't we? I thought we agreed on seven o'clock."}, {"speaker": "B", "line": "Yes, seven is fine. Should we take the metro or walk?"}, {"speaker": "A", "line": "Let's walk. The metro was really crowded this morning when I was commuting to school."}, {"speaker": "B", "line": "Good idea. See you at the gym at seven, then."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Where was speaker B waiting when A called?", "section": "While you listen", "options": ["At the cinema", "Outside the pharmacy", "At the gym", "At the bus stop"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mr. Aydın was also at the pharmacy picking up medicine.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": null, "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A and B agreed to meet at the gym at ___ o'clock.", "section": "While you listen", "reveal": "seven", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why do they decide to walk instead of taking the metro?", "section": "While you listen", "options": ["The metro was closed", "The metro was crowded this morning", "It's faster to walk", "They don't have money for the fare"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Do you prefer walking or taking public transport to meet friends? Why?", "Has something like this ever happened to you — meeting someone you know while waiting somewhere?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Getting Around the City", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What type of transportation do you use most often, and why?", "Listen and note two advantages of the metro mentioned in the interview."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Getting Around the City", "audio": null, "transcript": [{"speaker": "Presenter", "line": "Good afternoon, listeners! Today we're talking about getting around our city."}, {"speaker": "Presenter", "line": "Many people were complaining about traffic jams last week, weren't they?"}, {"speaker": "Guest", "line": "Yes, that's right. While the city was building the new cycle lane, traffic on the main road was really slow."}, {"speaker": "Presenter", "line": "Was the cycle lane worth the disruption?"}, {"speaker": "Guest", "line": "I think so. Now more people are cycling to work, and buses aren't stuck in traffic as much."}, {"speaker": "Presenter", "line": "What about the metro? Is it still the fastest option?"}, {"speaker": "Guest", "line": "For long distances, definitely. But it can get very crowded during rush hour."}, {"speaker": "Presenter", "line": "So, what's your advice for someone choosing transportation in the city?"}, {"speaker": "Guest", "line": "Think about distance and time. For short trips, walking or cycling is convenient. For longer trips, the metro is usually best."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What was happening while the city was building the new cycle lane?", "section": "While you listen", "options": ["The metro was closed", "Traffic on the main road was slow", "Bus fares increased", "The pharmacy moved location"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The guest thinks the cycle lane was not worth building.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The guest thinks it was worth the disruption.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The metro can get very ___ during rush hour.", "section": "While you listen", "reveal": "crowded", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the guest recommend for short trips?", "section": "While you listen", "options": ["The metro", "A taxi", "Walking or cycling", "The bus"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Do you agree with the guest's advice about choosing transportation? Why or why not?", "What transportation improvement would you suggest for your own city?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "What Were You Doing?", "text": "In pairs, take turns asking and answering what you were doing at three different times yesterday (e.g. 8am, 1pm, 7pm), using the past progressive.", "steps": ["Choose three times from yesterday to talk about.", "Ask your partner what they were doing at each time.", "Answer your partner's questions using the past progressive.", "Find one thing you were both doing at a similar time and share it with the class."], "chips": ["What were you doing at...?", "I was... / I wasn't...", "While I was..., I also...", "Really? I was doing something similar."], "timer": 600, "levels": ["Give students a list of common activities (studying, commuting, shopping, watching TV) to choose from.", "Students form their own sentences using at least three different times.", "Students add a follow-up sentence combining simple past and past progressive, e.g. 'I was studying when my phone rang.'"], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "City Transport Debate", "text": "In small groups, discuss the pros and cons of at least three types of transportation (bus, metro, bike, car, walking) and agree on the best option for students commuting to school.", "steps": ["In your group, list the transportation options available in your city.", "Discuss one advantage and one disadvantage of each option.", "Use question tags to check your group members' opinions, e.g. 'The bus is cheaper, isn't it?'", "Agree on the best option for students and prepare to explain your choice to the class."], "c
