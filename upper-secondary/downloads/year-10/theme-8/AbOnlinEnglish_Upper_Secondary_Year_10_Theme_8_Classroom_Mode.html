lan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["float", "orbit", "explode", "shine", "not survive"], "chips": true, "text": "Complete the sentences with the correct form of the verbs in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "If there is no gravity, objects ___ in the air.", "section": "Complete the rule", "reveal": "float", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If a planet ___ close to a star, it stays warm.", "section": "Complete the rule", "reveal": "orbits", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A star ___ if it runs out of fuel.", "section": "Complete the rule", "reveal": "explodes", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If astronauts ___ without oxygen, they ___.", "section": "Complete the rule", "reveal": "are, do not survive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The Moon ___ because it reflects sunlight.", "section": "Complete the rule", "reveal": "shines", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Zero conditional describes general truths, scientific facts, and things that are always true. Both clauses use the present simple: If + present simple, ... present simple.", "tr": "Sıfır koşul cümleleri genel gerçekleri, bilimsel olguları ve her zaman doğru olan durumları anlatmak için kullanılır. Her iki cümlecikte de geniş zaman (present simple) kullanılır: If + geniş zaman, ... geniş zaman.", "when_en": "We use zero conditional for facts, natural laws, and habitual results — not for imagined future situations.", "when": "Sıfır koşul; gerçekler, doğa kanunları ve alışılmış sonuçlar için kullanılır; hayali gelecek durumlar için kullanılmaz.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["if / rocket / not have / enough fuel / it / not reach / orbit"], "reveal": "If a rocket does not have enough fuel, it does not reach orbit.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / you / look / through a telescope / you / see / stars more clearly"], "reveal": "If you look through a telescope, you see stars more clearly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["water / freeze / if / temperature / drop / below zero"], "reveal": "Water freezes if the temperature drops below zero.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / a planet / be / too far from the Sun / it / be / very cold"], "reveal": "If a planet is too far from the Sun, it is very cold.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["astronauts / feel / weightless / if / they / be / in space"], "reveal": "Astronauts feel weightless if they are in space.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / a satellite / lose / power / it / stop / sending signals"], "reveal": "If a satellite loses power, it stops sending signals.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["a comet / glow / if / it / get / close to the Sun"], "reveal": "A comet glows if it gets close to the Sun.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original zero conditional sentences about facts related to space or the universe.", "chips": ["If a planet ...", "Stars ... if ...", "If there is no oxygen, ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["If + subject + present simple, subject + present simple.", "Example: If you heat ice, it melts."], "negative": ["If + subject + do/does not + verb, subject + do/does not + verb.", "Example: If a planet does not have water, it does not support life."], "question": ["Does it ... if ...? / What happens if ...?", "Example: What happens if a rocket runs out of fuel?"], "short": ["Yes, it does. / No, it does not."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If you will heat water, it boils.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If you heat water, it boils.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If a star runs out of fuel, it will explode.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If a star runs out of fuel, it explodes.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "If astronauts ___ (not wear) a spacesuit, they cannot breathe.", "section": "", "reveal": "do not wear", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["If a planet has no atmosphere, it will not support life.", "If a planet has no atmosphere, it does not support life.", "If a planet will have no atmosphere, it does not support life.", "If a planet has no atmosphere, it not supports life."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Water ___ (freeze) if the temperature drops below zero.", "section": "", "reveal": "freezes", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "If you look through a telescope, you will see the stars better.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If you look through a telescope, you see the stars better.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: gravity / there / float / objects / if / no / is", "section": "", "words": ["if", "there", "is", "no", "gravity,", "objects", "float"], "end": ".", "reveal": "If there is no gravity, objects float.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using zero conditional: A comet gets close to the Sun. It glows.", "section": "", "reveal": "If a comet gets close to the Sun, it glows.", "prompt": "If a comet ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The Sun ___ (rise) if the Earth turns towards it.", "section": "", "reveal": "rises", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Combine into one zero conditional sentence: A rocket does not have enough fuel. It cannot reach orbit.", "section": "", "reveal": "If a rocket does not have enough fuel, it cannot reach orbit.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If a satellite ___ (lose) power, it ___ (stop) sending signals.", "section": "", "reveal": "loses, stops", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "First conditional", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["If scientists <mark>discover<\/mark> water on Mars, they <mark>will look<\/mark> for life there.", "We <mark>will travel<\/mark> to other planets if technology <mark>improves<\/mark>.", "If the mission <mark>succeeds<\/mark>, astronauts <mark>will return<\/mark> home safely.", "If we <mark>do not protect<\/mark> the Earth, the future <mark>will be<\/mark> difficult."], "ask": "What do you notice about the tense in the if-clause compared to the result clause?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["build", "find", "not stop", "travel", "become"], "chips": true, "text": "Complete the sentences with the correct form of the verbs in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "If scientists find water on Mars, they ___ more research there.", "section": "Complete the rule", "reveal": "will do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If we ___ new spacecraft, we will explore further into space.", "section": "Complete the rule", "reveal": "build", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Astronauts ___ to the Moon again if the mission is approved.", "section": "Complete the rule", "reveal": "will travel", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If humans ___ life on another planet, it will change science forever.", "section": "Complete the rule", "reveal": "find", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If space exploration ___, we will learn more about the universe.", "section": "Complete the rule", "reveal": "does not stop", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "First conditional describes a real possibility in the future. It uses: If + present simple, ... will + base verb.", "tr": "Birinci koşul cümleleri gelecekte gerçekleşmesi mümkün olan durumları anlatır. Yapısı: If + geniş zaman, ... will + fiil.", "when_en": "We use first conditional to talk about likely future results of a possible condition, such as predictions about space travel.", "when": "Birinci koşul; olası bir durumun gelecekteki muhtemel sonucunu anlatmak için, örneğin uzay yolculuğuyla ilgili tahminlerde kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["if / scientists / discover / water on Mars / they / send / more missions"], "reveal": "If scientists discover water on Mars, they will send more missions.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / technology / improve / people / travel / to other planets"], "reveal": "If technology improves, people will travel to other planets.", "note": "Students say the sentence aloud; pick a number, then reveal. / f humans travel to Mars, ...", "If we do not ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["If + subject + present simple, subject + will + base verb.", "Example: If we build better rockets, we will reach Mars sooner."], "negative": ["If + subject + do/does not + verb, subject + will not + verb.", "Example: If we do not invest in research, we will not discover new planets."], "question": ["Will ... if ...? / What will happen if ...?", "Example: What will happen if the mission fails?"], "short": ["Yes, it will. / No, it will not."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If scientists will find water, they will send a mission.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If scientists find water, they will send a mission.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If we not protect the Earth, life will be harder.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If we do not protect the Earth, life will be harder.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "If humans ___ (travel) to Mars, they will need special suits.", "section": "", "reveal": "travel", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["If it rains, the launch will be delayed.", "If it will rain, the launch will be delayed.", "If it rains, the launch delayed.", "If it rain, the launch will be delayed."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If the crew ___ (not train) properly, the mission will fail.", "section": "", "reveal": "does not train", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "If scientists will discover a new planet, they will name it.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If scientists discover a new planet, they will name it.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: mission / will / succeed / astronauts / if / train / hard / the", "section": "", "words": ["if", "astronauts", "train", "hard,", "the", "mission", "will", "succeed"], "end": ".", "reveal": "If astronauts train hard, the mission will succeed.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using first conditional: The rocket launches successfully. The crew reaches orbit.", "section": "", "reveal": "If the rocket launches successfully, the crew will reach orbit.", "prompt": "If the rocket ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ (learn) more about the universe if we build better telescopes.", "section": "", "reveal": "will learn", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence is a first conditional?", "section": "", "options": ["If water boils, it turns to steam.", "If we find life on Mars, it will be a huge discovery.", "If you drop an object, it falls.", "If metal gets hot, it expands."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine into one first conditional sentence: Technology improves. Space travel becomes cheaper.", "section": "", "reveal": "If technology improves, space travel will become cheaper.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If we ___ (not stop) polluting, future space missions ___ (need) to find a new home for humans.", "section": "", "reveal": "do not stop, will need", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Our Neighbours in Space", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What planets do you think this text will mention?", "What do you already know about our solar system?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Our Neighbours in Space", "num": 1, "total": 4, "text": "Our solar system has eight planets that orbit the Sun. Some, like Mercury and Venus, are close to the Sun and extremely hot. Others, like Neptune and Uranus, are far away and freezing cold. Earth sits in a special zone where the temperature is just right for liquid water, and that is one reason life exists here.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Neighbours in Space", "num": 2, "total": 4, "text": "Mars is often called the 'Red Planet' because of the iron dust on its surface. Scientists are very interested in Mars because they believe it once had rivers and lakes. If future missions find clear signs of water underground, researchers will search even harder for signs of past or present life. Several robotic rovers have already explored the surface, sending back photos and data.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Neighbours in Space", "num": 3, "total": 4, "text": "Jupiter, the largest planet, is a giant ball of gas with a famous storm called the Great Red Spot. It does not have a solid surface, so astronauts could never land on it. Saturn is easy to recognise because of its beautiful rings, made of ice and rock. Both planets have many moons, and some of these moons, like Europa and Enceladus, may have oceans hidden under thick ice.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Neighbours in Space", "num": 4, "total": 4, "text": "Space agencies around the world continue to plan new missions. If governments and companies keep investing in space technology, humans will probably visit Mars within the next few decades. Until then, telescopes and robotic explorers remain our best way to learn about our fascinating neighbours in space.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Why is Earth in a special zone in the solar system?", "section": "While you read", "options": ["It is the closest planet to the Sun.", "It has a temperature right for liquid water.", "It has rings made of ice and rock.", "It is the largest planet."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why is Mars called the 'Red Planet'?", "section": "While you read", "options": ["Because of storms on its surface.", "Because it is close to the Sun.", "Because of iron dust on its surface.", "Because of its rings."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, astronauts could land on the surface of Jupiter.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Astronauts could never land on Jupiter because it does not have a solid surface.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Saturn is easy to recognise because of its ___.", "section": "While you read", "reveal": "rings", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the text say may happen if investment in space technology continues?", "section": "While you read", "options": ["Mars missions will stop.", "Humans will probably visit Mars within decades.", "Jupiter will get a solid surface.", "Saturn's rings will disappear."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which moons are mentioned as possibly having hidden oceans?", "section": "While you read", "options": ["Titan and Triton", "Europa and Enceladus", "Phobos and Deimos", "Io and Callisto"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which planet in the text do you find the most interesting, and why?", "Do you think humans will live on Mars one day? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Are We Alone in the Universe?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you think there is life on other planets? Why or why not?", "What would happen if scientists found alien life?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Are We Alone in the Universe?", "num": 1, "total": 4, "text": "For centuries, people have wondered whether life exists beyond Earth. Scientists now use powerful telescopes to search for planets outside our solar system, called exoplanets. If a planet is the right distance from its star and has water, scientists consider it a good place to look for life.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Are We Alone in the Universe?", "num": 2, "total": 4, "text": "So far, no one has found clear proof of alien life. However, researchers have discovered thousands of exoplanets, and some of them are similar in size to Earth. A project called SETI (Search for Extraterrestrial Intelligence) listens for radio signals from space, hoping to detect a message from another civilisation. If SETI ever receives a real signal, it will be one of the most important discoveries in human history.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Are We Alone in the Universe?", "num": 3, "total": 4, "text": "Some scientists focus closer to home. They study Mars, and the icy moons of Jupiter and Saturn, because simple forms of life, like bacteria, might survive there. If future missions bring back samples from these places, laboratories on Earth will test them carefully for any sign of life.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Are We Alone in the Universe?", "num": 4, "total": 4, "text": "Many people find the question exciting rather than frightening. Finding even simple microbial life beyond Earth would completely change how humans see their place in the universe. Until that day comes, scientists continue to search, explore, and imagine what — or who — might be out there.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is an exoplanet?", "section": "While you read", "options": ["A moon of Saturn", "A planet outside our solar system", "A type of telescope", "A radio signal"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "SETI stands for Search for ___ Intelligence.", "section": "While you read", "reveal": "Extraterrestrial", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Scientists have already found clear proof of alien life.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "So far, no one has found clear proof of alien life.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Where else, besides exoplanets, do scientists look for possible life?", "section": "While you read", "options": ["Only on the Moon", "Mars and the icy moons of Jupiter and Saturn", "Only on Venus", "Only inside our galaxy's stars"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What will happen if SETI receives a real signal, according to the text?", "section": "While you read", "options": ["It will be ignored.", "It will be one of the most important discoveries in history.", "Scientists will stop searching.", "It will prove aliens do not exist."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Do you think humans will ever find proof of alien life? Explain your answer.", "How do you think people would react if scientists found life on another planet?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Day in the Life of an Astronaut", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What do you imagine an astronaut's daily routine looks like?", "What questions would you ask an astronaut about life in space?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Day in the Life of an Astronaut", "audio": null, "transcript": [{"speaker": "Interviewer", "line": "Thanks for joining us today. Can you describe a normal day on the space station?"}, {"speaker": "Astronaut", "line": "Of course! We usually wake up around six o'clock. If the schedule allows it, we start with about two hours of exercise, because muscles get weaker without gravity."}, {"speaker": "Interviewer", "line": "That's interesting. What happens after exercise?"}, {"speaker": "Astronaut", "line": "We check the equipment and do experiments. If something breaks, we have to fix it ourselves, because there is no repair shop up here!"}, {"speaker": "Interviewer", "line": "How do you eat and sleep in space?"}, {"speaker": "Astronaut", "line": "Our food comes in special packets. If we do not close them properly, food floats around the cabin! We sleep in small sleeping bags attached to the wall."}, {"speaker": "Interviewer", "line": "What do you miss most from Earth?"}, {"speaker": "Astronaut", "line": "Honestly, fresh air and rain. If I go outside on Earth and feel the wind, I always appreciate it more after a mission."}, {"speaker": "Interviewer", "line": "One last question — what happens if there is an emergency?"}, {"speaker": "Astronaut", "line": "We train for years for that. If an emergency happens, we follow strict procedures and stay calm. Training makes a huge difference."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What time do the astronauts usually wake up?", "section": "While you listen", "options": ["Five o'clock", "Six o'clock", "Seven o'clock", "Eight o'clock"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why do astronauts exercise so much?", "section": "While you listen", "options": ["To pass the time", "Because muscles get weaker without gravity", "Because the interviewer asked them to", "To prepare for sleeping"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If food packets are not closed properly, food ___ around the cabin.", "section": "While you listen", "reveal": "floats", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The astronaut says they miss video games the most from Earth.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The astronaut says they miss fresh air and rain the most.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the astronaut say helps during an emergency?", "section": "While you listen", "options": ["Luck", "Years of training", "Calling home", "Extra food"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Would you like to live and work on a space station for six months? Why or why not?", "What part of the astronaut's routine surprised you the most?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Is There Life Out There?", "text": "Discuss with your partner whether you believe life exists on other planets, and give reasons for your opinion using conditional sentences.", "steps": ["Work with a partner. Decide who will speak first.", "Share your opinion about life on other planets and explain why.", "Use at least one zero conditional and one first conditional sentence in your discussion.", "Listen to your partner's opinion and ask a follow-up question.", "Together, agree on one prediction about the future of this topic."], "chips": ["In my opinion, ...", "I believe that if ..., then ...", "That's an interesting point, but ...", "I partly agree, however ...", "What makes you think that?"], "timer": 600, "levels": ["Give students a short list of sentence starters and allow them to use notes.", "Students discuss freely using both conditional forms with minimal support.", "Ask students to also discuss the ethical questions of contacting alien life, if found."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Plan a Space Mission", "text": "In your group, design an imaginary mission to explore a planet or moon of your choice, and present your plan to the class.", "steps": ["Choose a planet or moon to explore.", "Decide on the crew, the equipment, and the length of the mission.", "Predict what might happen using first conditional sentences.", "Prepare a short presentation (2-3 minutes) for the class.", "Present your mission and answer questions from classmates."], "chips": ["Our mission will explore ...", "If we find ..., we will ...", "The crew will need ...", "We predict that ..."], "timer": 600, "levels": ["Provide a simple template with prompts (planet, crew, equipment, prediction).", "Groups plan and present with guidance available if needed.", "Stronger groups add a risk and a solution for a possible problem during the mission."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Describe a Planet", "text": "Choose a planet from our solar system and write a short descriptive text about it, including at least one zero conditional sentence.", "steps": ["Choose your planet and note 3-4 key facts about it.", "Decide how to organise your paragraphs (introduction, facts, conclusion).", "Think of one zero conditional fact you can include."], "chips": ["orbit", "atmosphere", "surface", "gravity", "distance", "... is the ... planet from the Sun.", "If ..., it ...", "Unlike Earth, ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "The Future of Space Travel", "text": "Write a short essay giving your predictions about the future of space travel, using first conditional sentences.", "steps": ["Brainstorm 2-3 predictions about future space travel.", "Organise your ideas into an introduction, body, and conclusion.", "Plan at least two first conditional sentences to support your predictions."], "chips": ["technology", "explore", "mission", "colony", "research", "If technology improves, ...", "In the future, if ..., humans will ...", "I believe that if ..., then ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Which sentence is an example of zero conditional?", "section": "Exit ticket", "options": ["If it rains tomorrow, we will cancel the launch.", "If you heat water, it boils.", "If we find life on Mars, it will be amazing.", "If astronauts train hard, they will succeed."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If scientists ___ (discover) water on Mars, they will search for signs of life.", "section": "Exit ticket", "reveal": "discover", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What is the term for a planet outside our solar system?", "section": "Exit ticket", "options": ["Satellite", "Exoplanet", "Asteroid", "Comet"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to Reading 1, astronauts have landed on the surface of Jupiter.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Jupiter has no solid surface, so astronauts cannot land there.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In the listening, why do astronauts exercise every day?", "section": "Exit ticket", "options": ["To relax", "Because muscles get weaker without gravity", "Because it is required by law", "To prepare food"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The Earth ___ (orbit) the Sun once every year.", "section": "Exit ticket", "reveal": "orbits", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'a vehicle that travels in space'?", "section": "Exit ticket", "options": ["Satellite", "Spacecraft", "Telescope", "Rocket fuel"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: technology / improves / if / travel / to Mars / we / will", "section": "Exit ticket", "words": ["if", "technology", "improves,", "we", "will", "travel", "to", "Mars"], "end": ".", "reveal": "If technology improves, we will travel to Mars.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a first conditional sentence: SETI receives a signal. It will be historic.", "section": "Exit ticket", "reveal": "If SETI receives a signal, it will be historic.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to Reading 2, what does SETI search for?", "section": "Exit ticket", "options": ["New planets", "Radio signals from space", "Water on Mars", "Rocket fuel"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}], "theme": "Year 10 · Theme 8 · Life in the Universe & the Future", "key": "year-10-8"}</script><script src="../../../assets/us-present.js"></script></body></html>
