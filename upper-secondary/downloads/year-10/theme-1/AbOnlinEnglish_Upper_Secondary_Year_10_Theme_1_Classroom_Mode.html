how 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "She is always helping in the debate club after school.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "We ___ (not/usually/have) homework on Fridays.", "section": "", "reveal": "don't usually have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: now / preparing / for / are / they / the / parade", "section": "", "words": ["they", "are", "preparing", "for", "the", "parade", "now"], "end": ".", "reveal": "They are preparing for the parade now.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct question: ___ you often feel anxious before tests?", "section": "", "options": ["Are", "Do", "Does", "Is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using an adverb of frequency: I feel stressed before exams.", "section": "", "reveal": "I always feel stressed before exams. / I sometimes feel stressed before exams.", "prompt": "I ___ feel stressed before exams.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "At the moment, our school ___ (organise) a project about national celebrations.", "section": "", "reveal": "is organising", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Question Tags & Question Formation", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You go to a public school, <mark>don't you<\/mark>?", "She isn't stressed about the exam, <mark>is she<\/mark>?", "<mark>What kind of<\/mark> school do you attend, and <mark>why<\/mark> did you choose it?"], "ask": "What do you notice about the short questions added at the end of the sentences, and about the question words used?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["isn't it", "don't you", "aren't they", "does he"], "chips": true, "text": "Complete the question tags.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Your school has a debate club, ___?", "section": "Complete the rule", "reveal": "doesn't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The ceremony wasn't long, ___?", "section": "Complete the rule", "reveal": "was it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Question tags are short questions added to the end of a statement to check information or invite agreement: a positive statement takes a negative tag, and a negative statement takes a positive tag. Wh-questions (who, where, when, how, why, what kind of) ask for specific information and are formed with a question word + auxiliary + subject + verb.", "tr": "Soru etiketleri (question tags), bilgiyi doğrulamak veya onay almak için bir cümlenin sonuna eklenen kısa sorulardır: olumlu bir cümle olumsuz bir etiket alır, olumsuz bir cümle ise olumlu bir etiket alır. Wh- soruları (who, where, when, how, why, what kind of) belirli bir bilgi istemek için kullanılır ve soru kelimesi + yardımcı fiil + özne + fiil şeklinde kurulur.", "when_en": "Use question tags in spoken conversation to confirm information or start small talk; use wh-questions to ask for specific details.", "when": "Bilgiyi doğrulamak veya sohbete başlamak için konuşma dilinde soru etiketleri kullanılır; belirli ayrıntılar sormak için wh- soruları kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["You / like / your school", "positive"], "reveal": "You like your school, don't you?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["She / studies / at a vocational school", "positive"], "reveal": "She studies at a vocational school, doesn't she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["They / aren't / stressed about exams", "negative"], "reveal": "They aren't stressed about exams, are they?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The parade / starts / at 9 a.m.", "positive"], "reveal": "The parade starts at 9 a.m., doesn't it?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["He / can't / cope with the workload", "negative"], "reveal": "He can't cope with the workload, can he?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences with question tags about your own school life.", "chips": ["Our school..., ...?", "You..., ...?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You study here, don't you?", "What kind of school do you attend?"], "negative": ["You don't study here, do you?", "Why doesn't the club meet on Mondays?"], "question": ["Where do you go after school?", "How do you cope with stress?"], "short": ["Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You like your school, do you like?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You like your school, don't you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "What kind school do you go?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "What kind of school do you go to?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Your school celebrates National Youth Day, ___?", "section": "", "options": ["doesn't it", "does it", "isn't it", "is it"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "He can't cope with the workload, ___?", "section": "", "reveal": "can he", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: your / attend / do / school / kind / what / you", "section": "", "words": ["what", "kind", "of", "school", "do", "you", "attend"], "end": "?", "reveal": "What kind of school do you attend?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "mcq", "q": "___ did you feel anxious before the exam?", "section": "", "options": ["What kind of", "Why", "Who", "Which"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "They are joining the debate club, isn't they?", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They are joining the debate club, aren't they?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "___ do students usually feel stressed? Before exams.", "section": "", "reveal": "When", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Add a question tag: The flag-raising ceremony starts at 8.", "section": "", "reveal": "The flag-raising ceremony starts at 8, doesn't it?", "prompt": "The flag-raising ceremony starts at 8, ___?", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ kind of extracurricular activities does your school offer?", "section": "", "reveal": "What", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Nothing/Something/Anything, Object Pronouns & Must/Can't (Deduction)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["There is <mark>nothing<\/mark> to worry about before the exam.", "Is there <mark>anything<\/mark> we can do to help him?", "She <mark>must be<\/mark> nervous — she is shaking. He <mark>can't be<\/mark> the new student; I know <mark>him<\/mark> already."], "ask": "What do you notice about the indefinite pronouns, the object pronoun, and the logical guesses in these sentences?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["something", "anything", "nothing", "him", "her", "must", "can't"], "chips": true, "text": "Complete the sentences with something/anything/nothing, an object pronoun, or must/can't.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "He looks exhausted; he ___ have studied all night.", "section": "Complete the rule", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "There isn't ___ in my bag for the trip.", "section": "Complete the rule", "reveal": "anything", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Something/anything/nothing are indefinite pronouns: 'something' in positive statements, 'anything' in questions/negatives, 'nothing' as a negative subject/object. Object pronouns (me, you, him, her, it, us, them) replace a noun as the object of a verb or preposition. Must/can't express logical deduction: 'must' for a strong positive conclusion, 'can't' for a strong negative conclusion.", "tr": "Something/anything/nothing belirsiz zamirlerdir: olumlu cümlelerde 'something', soru ve olumsuz cümlelerde 'anything', olumsuz özne/nesne olarak 'nothing' kullanılır. Nesne zamirleri (me, you, him, her, it, us, them) bir fiilin veya edatın nesnesi olarak bir ismin yerini alır. Must/can't mantıksal çıkarım belirtir: güçlü olumlu sonuç için 'must', güçlü olumsuz sonuç için 'can't' kullanılır.", "when_en": "Use these pronouns to talk about unspecified things, object pronouns to avoid repeating a noun, and must/can't when you are almost sure about something based on evidence.", "when": "Bu zamirler belirsiz şeylerden bahsetmek için, nesne zamirleri bir ismi tekrar etmemek için, must/can't ise bir kanıta dayanarak bir şeyden neredeyse emin olunduğunda kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["she / must / be tired", "after the ceremony"], "reveal": "She must be tired after the ceremony.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["there / be / nothing / in the classroom"], "reveal": "There is nothing in the classroom.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he / can't / be stressed", "he looks so calm"], "reveal": "He can't be stressed; he looks so calm.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / help / them", "with the school project"], "reveal": "I help them with the school project.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["is there / anything / to eat", "before class"], "reveal": "Is there anything to eat before class?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences using something/anything/nothing, an object pronoun, or must/can't for deduction.", "chips": ["There is nothing...", "He must..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["There is something wrong.", "He must be tired.", "I saw her yesterday."], "negative": ["There is nothing wrong.", "He can't be tired; he just woke up."], "question": ["Is there anything wrong?", "Must he study every night?"], "short": ["Yes, there is. / No, there isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I don't have nothing to say.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I don't have anything to say.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She must not be at school; her bag is on her desk.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She can't be at school; her bag is on her desk. / Actually, she must be at school; her bag is on her desk.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "There is ___ interesting about the new curriculum.", "section": "", "options": ["nothing", "anything", "something", "everything"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I gave the homework to ___ (she) yesterday.", "section": "", "reveal": "her", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "He knows all the answers; he ___ have studied hard.", "section": "", "options": ["can't", "must", "mustn't", "isn't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "There isn't nothing in my locker.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There isn't anything in my locker.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "She can't ___ (be) stressed; she is smiling and relaxed.", "section": "", "reveal": "be", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: helped / with / homework / the / I / them", "section": "", "words": ["I", "helped", "them", "with", "the", "homework"], "end": ".", "reveal": "I helped them with the homework.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite with must or can't: I'm sure he is not at the ceremony (his car is not here).", "section": "", "reveal": "He can't be at the ceremony.", "prompt": "He ___ be at the ceremony.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Is there ___ you want to ask about extracurricular activities?", "section": "", "reveal": "anything", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Schools Around the World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What type of school do you attend?", "What other types of schools have you heard of?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Schools Around the World", "num": 1, "total": 3, "text": "Schools around the world look very different from one another. In many countries, most students attend public schools, which are usually free and open to everyone in the local area. Public schools often follow a national curriculum set by the government, so students in the same country study similar subjects at the same age.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Schools Around the World", "num": 2, "total": 3, "text": "Some families choose a different path. Boarding schools, for example, are places where students live during the school term instead of going home every day. Students at boarding schools eat, study, and often do extracurricular activities together, which can create a strong sense of community. Other students attend vocational schools, where the curriculum focuses on practical skills for a future job, such as mechanics, cooking, or design.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Schools Around the World", "num": 3, "total": 3, "text": "A smaller number of families choose homeschooling, in which children study at home instead of going to a school building. Parents or private tutors usually manage the curriculum, and the timetable can be more flexible than in a traditional school. Whatever the type of school, most students share similar experiences: friendships, exams, and unforgettable memories from their school years.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, public schools usually follow...", "section": "While you read", "options": ["a curriculum chosen by each student", "a national curriculum set by the government", "no curriculum at all", "a curriculum from another country"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Students at boarding schools go home every evening.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students at boarding schools live at the school during the term.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What is the main focus of a vocational school's curriculum?", "section": "While you read", "options": ["Academic theory only", "Practical skills for a future job", "Sports and games", "Foreign languages only"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In homeschooling, ___ or private tutors usually manage the curriculum.", "section": "While you read", "reveal": "parents", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What do most students share, according to the last paragraph?", "section": "While you read", "options": ["The same uniform", "Friendships, exams, and memories", "The same school building", "The same timetable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which type of school described in the text would you prefer to attend, and why?", "Do you think homeschooling has any disadvantages? Discuss."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Dealing with School Stress", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you ever feel stressed about school? When?", "What do you usually do to relax?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Dealing with School Stress", "num": 1, "total": 3, "text": "Feeling stressed about school is extremely common, especially before exams or big deadlines. Many students report feeling overwhelmed by their workload, worried about test results, or anxious about speaking in front of the class. This kind of stress is a normal part of student life, but it becomes a problem when it starts to affect sleep, appetite, or motivation.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Dealing with School Stress", "num": 2, "total": 3, "text": "Fortunately, there are simple strategies that can help students cope with school stress. Planning ahead and breaking large tasks into smaller steps can make a heavy workload feel more manageable. Regular exercise, even a short walk after school, can also reduce tension and improve concentration. Talking to a friend, family member, or teacher about how you feel is another effective way to cope, because it stops worries from building up inside.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Dealing with School Stress", "num": 3, "total": 3, "text": "Teachers and schools also have a role to play. Some schools now offer quiet rooms where students can relax between lessons, or organise workshops about time management. When students learn to recognise the signs of stress early and use these strategies, school can feel less like a source of anxiety and more like a place to learn and grow.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, when does stress become a problem?", "section": "While you read", "options": ["When it never happens", "When it affects sleep, appetite, or motivation", "When students study too little", "When exams are cancelled"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Breaking large tasks into ___ steps can reduce stress.", "section": "While you read", "reveal": "smaller", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The text suggests that talking about your feelings can help reduce stress.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What example of a school strategy is given in the text?", "section": "While you read", "options": ["Longer school days", "Quiet rooms for relaxing", "More homework", "Fewer exams"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the writer's main purpose in this text?", "section": "While you read", "options": ["To criticise schools", "To explain school stress and offer coping strategies", "To describe an exam", "To compare two countries"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which strategy from the text do you think would help you most? Why?", "Can you suggest another way to cope with school stress that isn't mentioned in the text?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A New Student Asks About School Life", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What questions would you ask a new student about your school?", "What extracurricular activities does your school offer?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A New Student Asks About School Life", "audio": null, "transcript": [{"speaker": "A", "line": "Hi! You're new here, aren't you? Welcome to the school!"}, {"speaker": "B", "line": "Thanks! Yes, I just moved from a vocational school in another city. What kind of clubs does this school have?"}, {"speaker": "A", "line": "We have a debate club, a chess club, and a sports team. I usually go to the chess club on Tuesdays."}, {"speaker": "B", "line": "That sounds great. Is the workload here heavy? I always feel stressed before exams."}, {"speaker": "A", "line": "It can be busy, but our teachers organise study sessions before big tests. That really helps with the anxiety."}, {"speaker": "B", "line": "That's good to know. Is there anything happening this month? I heard something about a celebration."}, {"speaker": "A", "line": "Yes! Next week is our national day ceremony. There's a flag-raising and a small parade in the schoolyard."}, {"speaker": "B", "line": "Sounds exciting. I can't wait to see it!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Where did Student B move from?", "section": "While you listen", "options": ["A boarding school", "A vocational school", "A public school", "Homeschooling"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Student A usually goes to the ___ club on Tuesdays.", "section": "While you listen", "reveal": "chess", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The school does nothing to help students before big tests.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The teachers organise study sessions before big tests.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What event is happening next week?", "section": "While you listen", "options": ["A sports match", "A national day ceremony", "A school trip", "An exam"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How does Student B feel about exams?", "section": "While you listen", "options": ["Relaxed", "Bored", "Always stressed", "Confident"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Do you think talking to a classmate like this would help a new student feel less anxious?", "What would you tell a new student about coping with school stress at your school?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Announcement: National Day Celebration", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What usually happens at a national day celebration at your school?", "Predict two things this announcement might mention."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Announcement: National Day Celebration", "audio": null, "transcript": [{"speaker": "Teacher", "line": "Good morning, everyone. I have an announcement about next Friday's national day celebration."}, {"speaker": "Teacher", "line": "The ceremony will start at 8:30 with the flag-raising in the main schoolyard."}, {"speaker": "Teacher", "line": "After that, the debate club will present a short speech about the importance of the day."}, {"speaker": "Teacher", "line": "There will also be a small parade organised by the sports team, so please wear comfortable shoes."}, {"speaker": "Teacher", "line": "Students who usually feel anxious about speaking in public don't need to worry — this year, no one has to speak individually."}, {"speaker": "Teacher", "line": "Finally, remember that classes will start thirty minutes later than usual that day. Any questions?"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What time does the ceremony start?", "section": "While you listen", "options": ["8:00", "8:30", "9:00", "9:30"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The ___ club will present a short speech about the day.", "section": "While you listen", "reveal": "debate", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Who organises the parade?", "section": "While you listen", "options": ["The debate club", "The sports team", "The teachers", "The new students"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Classes will start earlier than usual on the day of the celebration.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Classes will start thirty minutes later than usual.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["How is this celebration similar to or different from celebrations at your own school?", "Would you feel anxious about taking part in an event like this? Why or why not?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Comparing Types of Schools", "text": "In pairs, compare two different types of schools (for example, a public school and a boarding school) and decide which one you would prefer to attend and why.", "steps": ["Choose two types of schools from the vocabulary list.", "Take turns describing each type of school.", "Discuss the advantages and disadvantages of each.", "Agree together on which type you would prefer, giving reasons."], "chips": ["In a public school, students usually...", "Unlike a vocational school, a boarding school...", "I would prefer... because...", "One advantage/disadvantage of... is..."], "timer": 600, "levels": ["Give students a short list of comparison phrases and vocabulary cards to refer to.", "Students compare two school types using at least four pieces of vocabulary from this theme.", "Ask stronger students to also use a question tag to check their partner's opinion, e.g. 'You'd prefer a boarding school, wouldn't you?'"], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Advice for a Stressed Classmate", "text": "Roleplay a conversation in which one student explains they feel stressed and overwhelmed about school, and the others give advice using must/can't for deduction and suggestions for coping with stress.", "steps": ["One student explains a school-related worry (exams, workload, a presentation).", "The other students listen and make a deduction using must/can't.", "The group suggests at least two coping strategies.", "Swap roles so everyone practises giving advice."], "chips": ["You must be exhausted.", "That can't be easy.", "Have you tried...?", "It might help to...", "I usually cope by..."], "timer": 600, "levels": ["Provide a list of coping strategies and sentence starters for weaker students.", "Each student gives at least one piece of advice and one deduction sentence.", "Ask stronger students to extend the roleplay by asking follow-up wh-questions (why, how, what kind of)."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My School and My Routine", "text": "Write a paragraph describing your school (type of school, timetable) and your regular and extracurricular activities.", "steps": ["Note the type of school you attend and one or two facts about it.", "List your regular weekly activities and how often you do them.", "List one or two extracurricular activities you take part in.", "Order your ideas from general (school) to specific (activities)."], "chips": ["timetable", "extracurricular", "debate club", "chess club", "field trip", "I usually...", "Every week I...", "I am currently...", "One of my extracurricular activities is..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "An Email of Advice About School Stress", "text": "A friend has written to you saying they feel stressed and overwhelmed about their workload. Write an email giving them advice on how to cope.", "steps": ["Open with a friendly greeting and acknowledge how your friend feels.", "Give two or three pieces of practical advice.", "Use must/can't to show understanding of their situation.", "Close with an encouraging final sentence."], "chips": ["overwhelmed", "cope with", "deadline", "relax", "workload", "You must be feeling...", "It might help to...", "Have you tried...?", "I'm sure things will..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Which type of school focuses mainly on practical job skills?", "section": "Exit ticket", "options": ["Public school", "Vocational school", "Boarding school", "Homeschooling"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She ___ (always/be) calm before exams; that's unusual for her.", "section": "Exit ticket", "reveal": "is always", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct tag: They enjoy the debate club, ___?", "section": "Exit ticket", "options": ["do they", "don't they", "aren't they", "didn't they"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The reading text 'Schools Around the World' says all students go to boarding schools.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says students attend different types of schools, not only boarding schools.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "There is ___ we can do to help him relax before the test.", "section": "Exit ticket", "reveal": "something", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "In the listening 'National Day Celebration', what starts at 8:30?", "section": "Exit ticket", "options": ["Classes", "The flag-raising", "The parade", "The debate speech"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "He looks exhausted after the parade; he ___ have walked a long way.", "section": "Exit ticket", "options": ["can't", "must", "isn't", "doesn't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: does / school / kind / what / attend / you / of", "section": "Exit ticket", "words": ["what", "kind", "of", "school", "do", "you", "attend"], "end": "?", "reveal": "What kind of school do you attend?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "I gave my notes to ___ (they) before the exam.", "section": "Exit ticket", "reveal": "them", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'a very heavy amount of schoolwork'?", "section": "Exit ticket", "options": ["deadline", "workload", "ceremony", "curriculum"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}], "theme": "Year 10 · Theme 1 · School Life & Education", "key": "year-10-1"}</script><script src="../../../assets/us-present.js"></script></body></html>
