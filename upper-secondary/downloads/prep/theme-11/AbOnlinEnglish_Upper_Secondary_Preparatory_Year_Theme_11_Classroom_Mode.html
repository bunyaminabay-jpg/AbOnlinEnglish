a yazın."}, {"type": "list", "title": "By the end of this theme…", "list": ["I can describe common illnesses and symptoms.", "I can talk about ways to stay healthy.", "I can give advice for well-being.", "I can talk about healthy habits for the future."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["12 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "symptom", "pos": "noun", "ipa": "/ˈsɪmptəm/", "tr": "belirti", "example": "A high temperature is a common symptom of flu.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "headache", "pos": "noun", "ipa": "/ˈhedeɪk/", "tr": "baş ağrısı", "example": "I have a headache after studying all day.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "well-being", "pos": "noun", "ipa": "/wel ˈbiːɪŋ/", "tr": "iyi oluş hali", "example": "Sleep is important for mental well-being.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "balanced diet", "pos": "noun", "ipa": "/ˈbælənst ˈdaɪət/", "tr": "dengeli beslenme", "example": "A balanced diet keeps your body healthy.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "immune system", "pos": "noun", "ipa": "/ɪˈmjuːn ˈsɪstəm/", "tr": "bağışıklık sistemi", "example": "Fruit and vegetables strengthen your immune system.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "stress management", "pos": "noun", "ipa": "/stres ˈmænɪdʒmənt/", "tr": "stres yönetimi", "example": "Yoga is a popular stress management technique.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "recover", "pos": "verb", "ipa": "/rɪˈkʌvər/", "tr": "iyileşmek", "example": "It took him a week to recover from the flu.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "prescribe", "pos": "verb", "ipa": "/prɪˈskraɪb/", "tr": "reçete yazmak", "example": "The doctor prescribed some medicine for the pain.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "physical activity", "pos": "noun", "ipa": "/ˈfɪzɪkəl ækˈtɪvəti/", "tr": "fiziksel aktivite", "example": "Regular physical activity improves mood.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "sore throat", "pos": "noun", "ipa": "/sɔːr θroʊt/", "tr": "boğaz ağrısı", "example": "I have a sore throat and can't speak easily.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "mindfulness", "pos": "noun", "ipa": "/ˈmaɪndfəlnəs/", "tr": "bilinçli farkındalık", "example": "Mindfulness exercises can reduce anxiety.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "posture", "pos": "noun", "ipa": "/ˈpɒstʃər/", "tr": "duruş", "example": "Good posture prevents back pain.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“iyi oluş hali”", "options": ["prescribe", "well-being", "physical activity"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“stres yönetimi”", "options": ["prescribe", "stress management", "recover"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“belirti”", "options": ["symptom", "mindfulness", "prescribe"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“iyileşmek”", "options": ["recover", "mindfulness", "well-being"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“bilinçli farkındalık”", "options": ["recover", "mindfulness", "stress management"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“bağışıklık sistemi”", "options": ["sore throat", "posture", "immune system"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Should / Shouldn't — Giving Health Advice", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You <mark>should<\/mark> drink more water when you have a fever.", "You <mark>shouldn't<\/mark> skip breakfast.", "If you have a sore throat, you <mark>should<\/mark> rest your voice."], "ask": "What is the difference between 'should' and 'must'? Is 'should' stronger or softer advice?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'should'/'shouldn't' to give advice or recommendations, not strict obligations.", "tr": "'Should/shouldn't' tavsiye vermek için kullanılır; 'must' kadar katı bir zorunluluk bildirmez.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["You should rest more."], "negative": ["You shouldn't skip meals."], "question": ["Should I see a doctor?"], "short": ["Yes, you should. / No, you shouldn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You should to rest.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should rest.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "You ___ (should) drink plenty of water when you're ill.", "section": "", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You ___ (shouldn't) stay up too late before an exam.", "section": "", "reveal": "shouldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["You should to sleep more.", "You should sleep more.", "You should sleeping more.", "You shoulds sleep more."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as advice: it's a bad idea to skip breakfast.", "section": "", "reveal": "You shouldn't skip breakfast.", "prompt": "Use shouldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Taking Care of Your Well-Being", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you do to stay healthy?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Taking Care of Your Well-Being", "num": 1, "total": 3, "text": "Well-being is not just about avoiding illness — it also means taking care of your body and mind. Doctors recommend eating a balanced diet, getting enough sleep, and doing regular physical activity to strengthen your immune system.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Taking Care of Your Well-Being", "num": 2, "total": 3, "text": "When you do get sick, common symptoms like a headache or a sore throat usually mean your body needs rest. If symptoms don't improve, a doctor may prescribe medicine to help you recover faster. You should always follow the doctor's advice carefully.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Taking Care of Your Well-Being", "num": 3, "total": 3, "text": "For mental well-being, experts suggest stress management techniques such as mindfulness and good posture while studying. You shouldn't ignore stress — small habits like short breaks and deep breathing can make a big difference for your future health.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What do doctors recommend for physical health?", "section": "While you read", "options": ["Skipping meals", "A balanced diet, sleep, and activity", "Only medicine", "Avoiding exercise"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A doctor may ___ medicine if symptoms don't improve.", "section": "While you read", "reveal": "prescribe", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The text says you should ignore stress.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says you shouldn't ignore stress.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What is one stress management technique you use?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "At the School Nurse's Office", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What do you say to a school nurse when you feel unwell?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "At the School Nurse's Office", "audio": null, "transcript": [{"speaker": "Student", "line": "I have a really sore throat today."}, {"speaker": "Nurse", "line": "I'm sorry to hear that. You should drink some warm water and rest your voice."}, {"speaker": "Student", "line": "Should I go home?"}, {"speaker": "Nurse", "line": "Not necessarily, but you shouldn't shout or sing today. Let's see how you feel after lunch."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What symptom does the student have?", "section": "While you listen", "options": ["A headache", "A sore throat", "A broken arm", "A cold"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The nurse advises the student to ___ their voice.", "section": "While you listen", "reveal": "rest", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Giving Health Advice", "text": "Take turns describing a symptom and giving your partner advice using should/shouldn't.", "steps": ["Student A describes a symptom.", "Student B gives two pieces of advice.", "Swap roles and repeat."], "chips": ["I have a...", "You should...", "You shouldn't...", "Maybe you should see a doctor."], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Well-Being Guide", "text": "Write a short guide giving advice on how students can look after their physical and mental well-being.", "steps": ["Give two pieces of advice about physical health using should.", "Give one piece of advice about mental well-being.", "Mention one thing students shouldn't do."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "'Belirti' means ___.", "section": "Exit ticket", "options": ["symptom", "recover", "posture", "immune system"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "
