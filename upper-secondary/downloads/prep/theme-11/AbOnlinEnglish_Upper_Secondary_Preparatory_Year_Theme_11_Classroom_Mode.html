ng, human nature", "Well-being for the future"], "note": "Welcome the class. Read the topics aloud. / Sınıfı karşılayın, konuları sesli okuyun."}, {"type": "prompt", "title": "Warm-up", "text": "Look at the title: Personal Life and Well-Being. What do you think we will talk about in this theme? Tell your partner two ideas.", "timer": 60, "note": "Pair talk, 1 minute. Collect 3–4 ideas on the board. No Turkish, no translation. / 1 dk ikili konuşma; 3–4 fikri tahtaya yazın."}, {"type": "list", "title": "By the end of this theme…", "list": ["I can talk about symptoms, illnesses and how to stay healthy", "I can talk about your own well-being and habits, real and imaginary", "I can express wishes and regrets about your health and habits", "I can perform a short scene about a doctor's visit or health topic"], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["30 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "symptom", "pos": "noun", "ipa": "/ˈsɪmptəm/", "tr": "belirti", "example": "A headache and a sore throat are common symptoms of a cold.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "treatment", "pos": "noun", "ipa": "/ˈtriːtmənt/", "tr": "tedavi", "example": "The doctor explained the best treatment for the infection.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "recover", "pos": "verb", "ipa": "/rɪˈkʌvə(r)/", "tr": "iyileşmek", "example": "If you rested more, you would recover faster.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "chronic", "pos": "adjective", "ipa": "/ˈkrɒnɪk/", "tr": "kronik", "example": "A chronic illness lasts for a long time and needs regular care.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "prevent", "pos": "verb", "ipa": "/prɪˈvent/", "tr": "önlemek", "example": "Washing your hands can prevent many infections.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "infection", "pos": "noun", "ipa": "/ɪnˈfekʃn/", "tr": "enfeksiyon", "example": "The doctor said it was a small infection, not the flu.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "well-being", "pos": "noun", "ipa": "/ˌwel ˈbiːɪŋ/", "tr": "iyi olma hâli, esenlik", "example": "Sleep and exercise are both important for your well-being.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "cope with", "pos": "phrasal verb", "ipa": "/kəʊp wɪð/", "tr": "başa çıkmak", "example": "Mindfulness can help you cope with stress before exams.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word" efore revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "temperature", "pos": "noun", "ipa": "/ˈtemprətʃə(r)/", "tr": "vücut sıcaklığı, ateş", "example": "The nurse checked my temperature before letting me rest in the health room.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "sore throat", "pos": "noun", "ipa": "/sɔː(r) θrəʊt/", "tr": "boğaz ağrısı", "example": "I woke up with a headache and a sore throat, so I told my mum I felt terrible.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "stomachache", "pos": "noun", "ipa": "/ˈstʌməkeɪk/", "tr": "mide ağrısı, karın ağrısı", "example": "Ege went to the health room because he had a stomachache and felt worn out.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "balanced diet", "pos": "noun", "ipa": "/ˌbælənst ˈdaɪət/", "tr": "dengeli beslenme", "example": "If I ate a balanced diet, I would feel healthier and have more energy.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "junk food", "pos": "noun", "ipa": "/dʒʌŋk fuːd/", "tr": "abur cubur, sağlıksız yiyecek", "example": "If only I hadn't eaten so much junk food before the match.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "exhausted", "pos": "adjective", "ipa": "/ɪɡˈzɔːstɪd/", "tr": "bitkin, çok yorgun", "example": "After four days of rest, I still felt exhausted from the flu.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "worrying", "pos": "adjective", "ipa": "/ˈwʌriɪŋ/", "tr": "endişe verici", "example": "The results of the health survey were worrying, so the school started a well-being project.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "fascinating", "pos": "adjective", "ipa": "/ˈfæsɪneɪtɪŋ/", "tr": "büyüleyici, çok ilginç", "example": "The documentary about healthy habits was fascinating, so everyone watched it carefully.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "patient", "pos": "noun", "ipa": "/ˈpeɪʃnt/", "tr": "hasta (kişi)", "example": "In the waiting room, I saw a nurse checking another patient's blood pressure.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "regret", "pos": "verb", "ipa": "/rɪˈɡret/", "tr": "pişman olmak", "example": "I regret staying up so late last week, because that's probably why I caught a cold.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "calm", "pos": "adjective", "ipa": "/kɑːm/", "tr": "sakin", "example": "Mert should play the nurse because he is very calm and responsible.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“vücut sıcaklığı, ateş”", "options": ["temperature", "regret", "infection"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“özgüven, öz saygı”", "options": ["stressed out", "self-esteem", "stomachache"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“yaşam tarzı”", "options": ["fascinating", "fever", "lifestyle"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sürdürülebilir”", "options": ["patient", "sustainable", "worn out"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“dengeli beslenme”", "options": ["balanced diet", "chronic", "mindfulness"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“bitkin, yorgun”", "options": ["fascinating", "worn out", "temperature"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Second Conditional: Imaginary Present and Future Situations", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["If I <mark>ate<\/mark> a balanced diet, I <mark>would feel<\/mark> healthier.", "She <mark>would sleep<\/mark> better if she <mark>didn't drink<\/mark> coffee at night.", "If you <mark>had<\/mark> a headache, what <mark>would<\/mark> you <mark>do<\/mark>?", "We <mark>wouldn't feel<\/mark> so stressed if we <mark>had<\/mark> more free time."], "ask": "Which verb form comes after 'if' in these imaginary situations? What form comes in the other part of the sentence?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["past simple", "would + base verb", "wouldn't", "If"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "In the 'if' clause, we use the ___ (even though we are talking about now/the future).", "section": "Complete the rule", "reveal": "past simple", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In the main clause, we use ___.", "section": "Complete the rule", "reveal": "would + base verb / would", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative of 'would' is ___.", "section": "Complete the rule", "reveal": "wouldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the second conditional to talk about imaginary or unlikely situations in the present or future. The if-clause uses the past simple, and the main clause uses would + base verb.", "tr": "İkinci koşul cümlesi (second conditional), şimdiki zamanda ya da gelecekte gerçek olmayan ya da olası olmayan hayalî durumları anlatmak için kullanılır. If cümleciğinde geçmiş zaman (past simple), ana cümlede would + yalın fiil kullanılır.", "when_en": "We use it to talk about situations that are not true now or are unlikely to happen, such as imagining healthier habits or different choices.", "when": "Şu anki gerçekliğe uymayan ya da gerçekleşme ihtimali düşük durumlar hakkında konuşurken (örn. sağlıklı alışkanlıklar, hayaller) kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I", "eat healthier food", "feel better"], "reveal": "If I ate healthier food, I would feel better.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "drink more water", "not feel so tired"], "reveal": "If she drank more water, she wouldn't feel so tired.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "have more free time", "relax more"], "reveal": "If we had more free time, we would relax more." uld have more time, I would relax.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If I had more time, I would relax.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If she was tired, she will rest.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If she was tired, she would rest.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "If I ___ (eat) more vegetables, I would feel healthier.", "section": "A · Choose the correct option.", "options": ["eat", "ate", "eats"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She would feel better if she ___ (sleep) more.", "section": "A · Choose the correct option.", "options": ["sleep", "slept", "sleeps"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "If you ___ a headache, what would you do?", "section": "A · Choose the correct option.", "options": ["have", "had", "has"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ so stressed if we had more free time.", "section": "A · Choose the correct option.", "options": ["wouldn't feel", "don't feel", "won't feel"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If I ___ (not / be) so busy, I would sleep more.", "se ara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about an imaginary situation.", "section": "Dialogue · Complete with the second conditional.", "words": ["if", "you", "had", "more", "free", "time,", "what", "would", "you", "do"], "end": "?", "reveal": "If you had more free time, what would you do?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "If Only: Regret and Strong Wishes", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>If only<\/mark> I <mark>didn't have<\/mark> a headache — I want to go out tonight!", "<mark>If only<\/mark> I <mark>had eaten<\/mark> breakfast this morning — now I feel weak.", "<mark>If only<\/mark> we <mark>had more<\/mark> time to relax after school.", "<mark>If only<\/mark> he <mark>would stop<\/mark> staying up so late."], "ask": "Do these sentences talk about the present, the past, or both? What feeling do they express?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["present", "past", "regret"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "If only + past simple talks about a ___ situation we wish were different.", "section": "Complete the rule", "reveal": "present", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye s tence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["We don't have enough free time. (now)"], "reveal": "If only we had more free time!", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I ate junk food before the match. (past)"], "reveal": "If only I hadn't eaten junk food before the match!", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["He is always so stressed. (now)"], "reveal": "If only he weren't so stressed!", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two If only sentences: one about something you wish were different now, and one about something you regret from the past.", "chips": ["If only I …", "If only I had …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["If only I had more energy today.", "If only I had gone to bed earlier last night."], "negative": ["If only I didn't feel so tired.", "If only I hadn't eaten so much junk food."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If only I have more time.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If only I had more time.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If only I ate breakfast this morning. (dün sabah pişmanlık)", "options": ["Correct", c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "He wishes he ___ (be) better at managing his time.", "section": "B · Complete with the correct form.", "reveal": "were / was", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I wish I ___ (sleep) eight hours a night.", "section": "B · Complete with the correct form.", "reveal": "slept", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I wish I am less stressed.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I wish I were less stressed.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "She wishes she had more free time.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Do you ever ___ you ___ (be) less busy?", "section": "Dialogue · Complete with wish.", "reveal": "wish / were", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I ___ I ___ (have) more time for myself.", "section": "Dialogue · Complete with wish.", "reveal": "wish / had", "note": "Students write the answer, then then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ adjectives describe how a person feels (I am exhausted).", "section": "Complete the rule", "reveal": "-ed / ed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Adjectives ending in -ing (interesting, exhausting, relaxing) describe what a thing or situation is like; adjectives ending in -ed (interested, exhausted, relaxed) describe how a person feels.", "tr": "-ing ile biten sıfatlar (interesting, exhausting, relaxing) bir şeyin ya da durumun nasıl olduğunu anlatır; -ed ile biten sıfatlar (interested, exhausted, relaxed) bir kişinin nasıl hissettiğini anlatır.", "when_en": "We use these when talking about health, stress and well-being, to describe both situations and feelings.", "when": "Sağlık, stres ve iyi olma hâli hakkında konuşurken, hem durumları hem de hisleri anlatmak için kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the topic", "(interest)"], "reveal": "The topic was interesting.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "(exhaust)", "after the run"], "reveal": "I was exhausted after the run.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the results", "(worry)"], "reveal": "The results were worrying.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "(relax)", "after yoga"], "reveal": "She felt relaxed after yoga.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the documentary about well-being", "(fascinate)"], "reveal": "The documentary about well-being was fascinating.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about your own well-being using -ing and -ed adjectives (e.g. tired/tiring, stressed/stressing, relaxed/relaxing).", "chips": ["I feel … when …", "… is/was really …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The lesson was interesting.", "I felt exhausted after the match."], "negative": ["The results weren't worrying.", "I wasn't interested in the topic."], "question": ["Was the yoga class relaxing?", "Are you interested in mindfulness?"], "short": ["Yes, it was. / No, it wasn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I am boring in this class.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I am bored in this class.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The topic was very interested.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The topic was very interesting.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "The lesson about well-being was really ___.", "section": "A · Choose the correct option.", "options": ["interested", "interesting", "interest"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I felt very ___ after the long school day.", "section": "A · Choose the correct option.", "options": ["tiring", "tired", "tire"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The results of the survey were ___.", "section": "A · Choose the correct option.", "options": ["worrying", "worried", "worry"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Are you ___ in learning about mindfulness?", "section": "A · Choose the correct option.", "options": ["interesting", "interested", "interest"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She felt ___ (relax) after the yoga class.", "section": "B · Complete with the correct form.", "reveal": "relaxed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The documentary about healthy habits was ___ (fascinate).", "section": "B · Complete with the correct form.", "reveal": "fascinating", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I am boring when I have nothing to do.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I am bored when I have nothing to do.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The lesson was really exhausting.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: How was the well-being workshop? B: It was really ___ (interest) — I felt very ___ (interest) the whole time.", "section": "Dialogue · Complete with -ing/-ed adjectives.", "reveal": "interesting / interested", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "After the run, everyone looked ___.", "section": "Dialogue · Complete with -ing/-ed adjectives.", "options": ["exhausting", "exhausted"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Day I Caught the Flu", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think happens in this text?", "Guess: what are two common symptoms of the flu?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Day I Caught the Flu", "num": 1, "total": 5, "text": "Last Monday, I woke up with a headache and a sore throat. I knew something wasn't right, so I told my mum I felt terrible. \"If only I hadn't stayed up so late last week,\" I thought — maybe I wouldn't have caught a cold so easily.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Day I Caught the Flu", "num": 2, "total": 5, "text": "My mum took my temperature and said I had a fever. She called the school and then took me to see Dr. Kaya, our family doctor. In the waiting room, I saw a nurse checking another patient's blood pressure.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Day I Caught the Flu", "num": 3, "total": 5, "text": "Dr. Kaya listened to my symptoms and said, \"You have the flu. If you rested and drank plenty of water, you would recover faster.\" She gave me some treatment and told me to stay in bed for a few days.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Day I Caught the Flu", "num": 4, "total": 5, "text": "I wish I had taken better care of myself before I got sick — eating more vegetables and sleeping enough hours. Now I understand why it is so important to prevent illness, not just treat it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Day I Caught the Flu", "num": 5, "total": 5, "text": "After four days of rest, I finally felt better. The whole experience was exhausting, but it also taught me a useful lesson about listening to my body and looking after my well-being.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A visit to the dentist", "A student's experience of getting the flu and recovering", "A school health lesson"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What symptoms did the writer have first?", "section": "While you read", "options": ["A headache and a sore throat", "A broken arm", "A skin rash"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who did the writer's mum take them to see?", "section": "While you read", "options": ["A nurse at school", "Dr. Kaya, the family doctor", "A pharmacist"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 3, 'She' refers to…", "section": "While you read", "options": ["the nurse", "Dr. Kaya", "the writer's mum"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the writer wish they had done differently?", "section": "While you read", "options": ["Taken better care of themselves before getting sick", "Gone to school anyway", "Never seen a doctor"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the doctor, resting and drinking water would help the writer recover faster.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What do you do when you feel sick? Write two sentences.", "Compare this experience with a time you or someone you know felt ill. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Small Habits, Big Changes", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What does 'well-being' mean to you? Think of one example.", "Guess: what are two small habits that can improve well-being?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Small Habits, Big Changes", "num": 1, "total": 5, "text": "For our end-of-theme project, our class decided to create a Well-Being Challenge for the whole school. We wanted to show that small habits can make a big difference to how people feel.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Small Habits, Big Changes", "num": 2, "total": 5, "text": "First, we researched simple changes: drinking more water, walking for ten minutes after lessons, and going to bed at the same time every night. If more students tried these habits, they would probably feel less tired and stressed.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Small Habits, Big Changes", "num": 3, "total": 5, "text": "We also learned about mindfulness — taking a few quiet minutes to breathe and relax. One student said, \"I wish I had discovered mindfulness earlier — it really helps me cope with stress before exams.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Small Habits, Big Changes", "num": 4, "total": 5, "text": "For the future, our group decided to set a goal: to build one new healthy habit every month. We know it takes time, but a sustainable lifestyle doesn't happen overnight.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Small Habits, Big Changes", "num": 5, "total": 5, "text": "In the end, we designed a short show about health and well-being, with characters like a doctor, a nurse and a patient, to present our ideas to the school in a fun and memorable way.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A class project about well-being habits", "A history lesson", "A sports competition"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers ut a healthy habit you would like to build."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning the Health Show", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning a performance about health and well-being.", "Predict: what characters might they need for a show about a doctor's visit?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning the Health Show", "audio": null, "transcript": [{"speaker": "Deniz", "line": "So for our Well-Being Show, we have to choose our characters. Can you be the doctor?"}, {"speaker": "Elif", "line": "Sure, I can do that. If I were the doctor, I'd wear a white coat and use a stethoscope!"}, {"speaker": "Deniz", "line": "Great idea. And I think Mert should be the nurse — he's very calm and responsible."}, {"speaker": "Elif", "line": "Good choice. We also need a patient who feels stressed and exhausted at the beginning of the scene."}, {"speaker": "Deniz", "line": "I wish we had more time to write the whole script today, but let's start with the doctor's advice part."}, {"speaker": "Elif", "line": "OK — I'll write the part where the doctor says, 'If you rested more, you would feel much better.'"}, {"speaker": "Deniz", "line": "Perfect. We have to hand in our plan to Ms. Kaya by Friday, so let's finish the outline today."}, {"speaker": "Elif", "line": "Sounds good — let's meet in the library at 4 pm to continue."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Deniz and Elif planning?", "section": "While you listen", "options": ["A sports match", "A Well-Being Show", "A school trip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, bits)", "text": "Walk around the class and ask your classmates questions with the second conditional, wish and if only to find someone who matches each sentence. Write their name next to the sentence.", "steps": ["Look at your worksheet: 6 sentences about well-being (e.g. '…wishes they exercised more').", "Stand up and ask a classmate a question to check if the sentence is true for them.", "If it's true, write their name. If not, ask another classmate.", "Try to find a different name for each sentence.", "Sit down and share two interesting answers with the class."], "chips": ["If you had more free time, what would you do?", "Do you ever wish you slept more?", "If only I had…", "I would feel better if I…"], "timer": 600, "levels": ["Destek Give students the question forms in writing before they start.", "Hedef 6 questions, mingling for about 10 minutes.", "İleri Fast finishers add one more true sentence about their own well-being and ask it too."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Doctor and Patient Role-Play", "text": "With a partner, act out three short situations at a health room: one of you is a patient describing symptoms, and the other is a doctor or nurse giving advice.", "steps": ["Read the three situation cards (a headache, a stomachache, feeling exhausted).", "Decide who is the Patient and who is the Doctor/Nurse.", "Act out each situation: describe the symptom and give advice using the second conditional or wish.", "Swap roles and do it again with new situations.", "Perform your favourite situation for another pair."], "chips": ["I have a…", "If you rested more, you would feel better.", "I wish I hadn't…", "You should…"], "timer": 600, "levels": ["Destek Provide sentence starters on cards for lower-level students.", "Hedef 3 role-play situations per pair.", "İleri Students
