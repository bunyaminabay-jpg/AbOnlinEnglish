 numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Can I to visit the old town today?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Can I visit the old town today?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "It might rain later, so take a jacket.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you show me the way to the historical square, please?", "section": "Dialogue · Complete with Can or might.", "reveal": "Can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Of course. It ___ (probability) be a bit far, though.", "section": "Dialogue · Complete with Can or might.", "reveal": "might", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "The festival starts at 7 pm.", "section": "Dialogue · Rewrite the sentence.", "reveal": "The festival might start at 7 pm.", "prompt": "Rewrite to show it is not certain, using might.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Walk Through the Old Town", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of places do you think 'the old town' has?", "Guess: what two historical things might you see on a walk through an old town?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Walk Through the Old Town", "num": 1, "total": 5, "text": "Last weekend, my cousin Deren visited our city for the first time, so I took her on a walking tour of the old town. We started at the main square, where a tall stone monument stands. It was built over a hundred years ago, and it must be protected carefully because it is part of our cultural heritage.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Walk Through the Old Town", "num": 2, "total": 5, "text": "From there, we walked to the old bazaar, a busy street full of small shops and cafés. Deren loved the atmosphere. 'Shall we buy something here?' she asked, and we bought some handmade souvenirs from a local craftsman.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Walk Through the Old Town", "num": 3, "total": 5, "text": "Next, we visited the history museum, which has a new exhibition about the city's past. Photos can be taken in most rooms, but Deren asked, 'Can I take a photo of this old map, please?' The guide said yes, but explained that flash photography mustn't be used near the oldest documents.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Walk Through the Old Town", "num": 4, "total": 5, "text": "After the museum, we climbed up to the old castle. The view from the top was amazing, and we could see the whole neighbourhood below. Some parts of the castle are closed because they should be restored before visitors can walk there safely.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Walk Through the Old Town", "num": 5, "total": 5, "text": "By the end of the day, Deren said the old town was definitely worth visiting. 'This landmark might become my favourite place in the city,' she laughed. I was happy she loved a place I see every day.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A shopping trip in a new city", "A walking tour of the old town", "A history lesson at school"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why must the monument in the square be protected carefully?", "section": "While you read", "options": ["Because it is very tall", "Because it is part of the cultural heritage", "Because it is in the bazaar"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Deren ask permission for in the museum?", "section": "While you read", "options": ["To touch the old map", "To take a photo of the old map", "To buy the old map"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why are some parts of the castle closed?", "section": "While you read", "options": ["They are too small", "They should be restored before visitors can go there safely", "They are used as an office"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Flash photography can be used everywhere in the museum.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Flash photography mustn't be used near the oldest documents.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does Deren feel about the old town at the end of the day?", "section": "While you read", "options": ["Bored", "Impressed — she thinks it's worth visiting", "Confused"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What is one cultural or historical place in your own neighbourhood or city? Write two sentences about it.", "Would you like to visit the old town in the text? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Spring Street Festival", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What festivals or events happen in your neighbourhood every year?", "Guess: what two things usually happen at a street festival?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Spring Street Festival", "num": 1, "total": 5, "text": "Every spring, our neighbourhood holds a street festival to celebrate the end of winter. It's an old tradition that takes place on the first Saturday of April, and almost every family gets involved.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Spring Street Festival", "num": 2, "total": 5, "text": "In the morning, a colourful procession moves down the main street. Local schools and dance groups perform traditional dances, and children carry flags and flowers. 'Shall we join the procession this year?' my neighbour asked me, and I said yes.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Spring Street Festival", "num": 3, "total": 5, "text": "By midday, the street is full of small stalls selling food, crafts and music. The council always asks residents to help keep the street clean, because litter mustn't be dropped during the festival — there are extra bins everywhere.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Spring Street Festival", "num": 4, "total": 5, "text": "In the evening, there is live music in the square, and the festival usually ends with fireworks over the river. The weather forecast said it might rain last year, so many people brought umbrellas just in case, but the sky stayed clear.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Spring Street Festival", "num": 5, "total": 5, "text": "For me, the Spring Street Festival is the best event of the year. It brings the whole community together and shows how our traditions can be enjoyed by everyone, old and young.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the Spring Street Festival?", "section": "While you read", "options": ["A sports competition", "An old neighbourhood tradition celebrating the end of winter", "A monthly market"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When does the festival take place?", "section": "While you read", "options": ["The first Saturday of April", "The last Sunday of March", "Every weekend in spring"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who performs in the procession?", "section": "While you read", "options": ["Only the council", "Local schools and dance groups", "Only local shop owners"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why does the council ask residents to help keep the street clean?", "section": "While you read", "options": ["Because litter mustn't be dropped during the festival", "Because the shops complain", "Because it rains a lot"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "It rained heavily during the festival last year.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The forecast said it might rain, but the sky stayed clear.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does the writer feel about the festival?", "section": "While you read", "options": ["Negative — too crowded", "Positive — it brings the community together", "Neutral — doesn't care"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Describe one tradition or festival in your neighbourhood. What happens there?", "Design one new activity that could be added to a neighbourhood festival."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning a Trip to the Old Town", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two friends planning a weekend visit to the old town.", "Predict: what two places might they decide to visit?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning a Trip to the Old Town", "audio": null, "transcript": [{"speaker": "Selin", "line": "Shall we do something different this weekend? I'm tired of staying at home."}, {"speaker": "Kerem", "line": "Good idea! Shall we visit the old town? I've never been to the history museum."}, {"speaker": "Selin", "line": "Perfect. Can you check the opening times online, please?"}, {"speaker": "Kerem", "line": "Sure. It says the museum is open from nine to five, but it might close early on Sundays."}, {"speaker": "Selin", "line": "OK, let's go on Saturday then. Shall I bring my camera?"}, {"speaker": "Kerem", "line": "Yes, please — some parts of the castle should look really beautiful in the photos."}, {"speaker": "Selin", "line": "Great. Can we also visit the old bazaar afterwards? I want to buy a small souvenir."}, {"speaker": "Kerem", "line": "Of course we can. Shall we meet at the bus stop at ten?"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Selin and Kerem planning?", "section": "While you listen", "options": ["A weekend visit to the old town", "A trip to another city", "A school project"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What time does the museum open?", "section": "While you listen", "options": ["Nine", "Ten", "Five"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Kerem say about Sundays?", "section": "While you listen", "options": ["The museum might close early.", "The museum is always closed.", "The museum is free."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Selin offer to bring?", "section": "While you listen", "options": ["Food", "Her camera", "A map"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kerem says they can't visit the old bazaar.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kerem says of course they can visit the old bazaar.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Would you like to visit an old town or a museum this weekend? Why?", "Write one sentence with Shall we…? about a place you could visit together."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Problem in Our Street", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two neighbours talking about a problem in their street.", "Predict: what problem could two neighbours in a city complain about?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Problem in Our Street", "audio": null, "transcript": [{"speaker": "Mrs Aksoy", "line": "Have you noticed how overcrowded our street gets on Saturdays? There's always a traffic jam near the market."}, {"speaker": "Mr Yıldız", "line": "Yes, I have. And people complain about the noise too. Shall we talk to the council about it?"}, {"speaker": "Mrs Aksoy", "line": "That's a good idea. I think a new car park should be built near the market."}, {"speaker": "Mr Yıldız", "line": "I agree. And the litter problem — it mustn't be left on the pavement like this every week."}, {"speaker": "Mrs Aksoy", "line": "Exactly. Shall I write a letter to the council this week?"}, {"speaker": "Mr Yıldız", "line": "Yes, please. Can you also mention the broken streetlight near the corner?"}, {"speaker": "Mrs Aksoy", "line": "Of course. It might take a few weeks, but I think things can be improved if we ask together."}, {"speaker": "Mr Yıldız", "line": "I hope so. A cleaner, safer street would be much better for everyone."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the main problem near the market?", "section": "While you listen", "options": ["Traffic jams and litter", "Not enough shops", "Too much rain"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Mr Yıldız suggest?", "section": "While you listen", "options": ["Moving house", "Talking to the council", "Closing the market"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Mrs Aksoy think should be built?", "section": "While you listen", "options": ["A new school", "A new car park", "A new museum"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mrs Aksoy refuses to write a letter to the council.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Mrs Aksoy offers to write a letter to the council.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What else does Mr Yıldız want to mention in the letter?", "section": "While you listen", "options": ["A broken streetlight", "A missing bus stop", "A closed shop"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What is one problem in your own neighbourhood? How could it be improved?", "Write one sentence with should be + past participle about your street."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Shall We…? Weekend Plans", "text": "With a partner, plan a weekend visit to a cultural or historical place in your city. Use Shall we…?/Shall I…? to make suggestions and offers, and Can I/you…? for polite requests.", "steps": ["Choose a cultural or historical place to visit together (museum, castle, old town, etc.).", "Take turns making suggestions with Shall we…? and offers with Shall I…?", "Agree on a day, time and meeting point.", "Add one polite request with Can I/you…? about the visit.", "Perform your short planning dialogue for another pair."], "chips": ["Shall we visit …?", "Shall I check the opening times?", "Can you tell me the way, please?", "That's a good idea. / I'd prefer …"], "timer": 600, "levels": ["Destek Give students a list of place names and time expressions before they start.", "Hedef A short planning dialogue of 6-8 lines using Shall we/I and Can.", "İleri Fast pairs add a sentence with might about the weather or opening times."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Discussing Neighbourhood Problems", "text": "In small groups, discuss two or three problems in your own neighbourhood or city. Suggest what should/must be done, using passive voice with modals.", "steps": ["Brainstorm 3-4 problems in your neighbourhood (traffic, litter, noise, etc.).", "Choose the two most important problems as a group.", "For each problem, agree on one solution using passive with modals (e.g. 'A new bin should be put here.').", "Prepare to present your two problems and solutions to the class.", "Present your ideas and listen to another group's ideas."], "chips": ["I think … should be improved.", "… mustn't be allowed.", "A new … could be built.", "Shall we suggest this to the council?"], "timer": 600, "levels": ["Destek Provide a problem-vocabulary list (traffic jam, litter, pollution, overcrowded) on the board.", "Hedef Two problems and two solutions per group, presented in 1-2 minutes.", "İleri Groups vote on which solution from another group they liked best and explain why."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Neighbourhood: Places and Problems", "text": "Write a short text for a class poster about your neighbourhood. Describe one cultural/historical place OR festival, and one problem that should be improved. Use at least two grammar points from this theme.", "steps": ["Choose a place, festival or event and one problem to write about.", "List 3-4 key details or facts for each.", "Decide how to use passive with modals, shall, or can/might in your sentences.", "Check your grammar and punctuation."], "chips": ["landmark", "heritage", "festival", "tradition", "pollution", "improve", "This … should be …", "Shall we visit …?", "It might …", "A new … can be …"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bir
