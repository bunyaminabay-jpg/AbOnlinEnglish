ranslation. / 1 dk ikili konuşma; 3–4 fikri tahtaya yazın."}, {"type": "list", "title": "By the end of this theme…", "list": ["I can talk about cultural and historical places.", "I can describe a festival or event.", "I can talk about problems in a city.", "I can talk about past experiences using present perfect."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["12 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "historical site", "pos": "noun", "ipa": "/hɪˈstɒrɪkəl saɪt/", "tr": "tarihi mekan", "example": "The old castle is a popular historical site.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "festival", "pos": "noun", "ipa": "/ˈfestɪvəl/", "tr": "festival", "example": "The music festival attracts thousands of visitors.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "pollution", "pos": "noun", "ipa": "/pəˈluːʃən/", "tr": "kirlilik", "example": "Air pollution is a serious problem in big cities.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "traffic jam", "pos": "noun", "ipa": "/ˈtræfɪk dʒæm/", "tr": "trafik sıkışıklığı", "example": "We were stuck in a traffic jam for an hour.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "overcrowded", "pos": "adjective", "ipa": "/ˌoʊvərˈkraʊdɪd/", "tr": "aşırı kalabalık", "example": "The city centre gets overcrowded at weekends.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "heritage", "pos": "noun", "ipa": "/ˈherɪtɪdʒ/", "tr": "miras (kültürel)", "example": "The old town is part of our cultural heritage.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "celebration", "pos": "noun", "ipa": "/ˌseləˈbreɪʃən/", "tr": "kutlama", "example": "The whole neighbourhood joins the spring celebration.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "monument", "pos": "noun", "ipa": "/ˈmɒnjəmənt/", "tr": "anıt", "example": "Tourists take photos next to the monument.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "renovate", "pos": "verb", "ipa": "/ˈrenəveɪt/", "tr": "restore etmek/yenilemek", "example": "The old theatre was recently renovated.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "community", "pos": "noun", "ipa": "/kəˈmjuːnəti/", "tr": "topluluk", "example": "Our community organises a clean-up day every year.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "noise", "pos": "noun", "ipa": "/nɔɪz/", "tr": "gürültü", "example": "Noise from traffic can be a problem at night.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "recycling", "pos": "noun", "ipa": "/riːˈsaɪklɪŋ/", "tr": "geri dönüşüm", "example": "The city introduced a new recycling programme.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“restore etmek/yenilemek”", "options": ["traffic jam", "monument", "renovate"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“anıt”", "options": ["monument", "heritage", "historical site"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“tarihi mekan”", "options": ["festival", "historical site", "traffic jam"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“gürültü”", "options": ["festival", "noise", "historical site"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“miras (kültürel)”", "options": ["heritage", "recycling", "monument"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“festival”", "options": ["celebration", "renovate", "festival"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Present Perfect — Talking About Experiences", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I <mark>have visited<\/mark> the old castle three times.", "She <mark>has never been<\/mark> to the festival.", "Have you <mark>ever seen<\/mark> the fireworks downtown?"], "ask": "What do you notice about the verb form? Is the exact time mentioned?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use the present perfect (have/has + past participle) to talk about life experiences when the exact time isn't important.", "tr": "Kesin zamanın önemli olmadığı yaşam deneyimlerinden bahsederken şimdiki zaman-geçmiş birleşik zamanı (have/has + geçmiş ortaç) kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["I have visited many historical sites."], "negative": ["She hasn't been to the festival yet."], "question": ["Have you ever seen a traditional festival?"], "short": ["Yes, I have. / No, I haven't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I have visit the museum.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I have visited the museum.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "I ___ (visit) that historical site twice.", "section": "", "reveal": "have visited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She ___ (never/be) to a big city festival.", "section": "", "reveal": "has never been", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct question.", "section": "", "options": ["Did you ever visit the monument?", "Have you ever visited the monument?", "Do you ever visit the monument?", "Are you ever visit the monument?"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite: it is my experience that I saw this monument before.", "section": "", "reveal": "I have seen this monument before.", "prompt": "Use present perfect", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A City of Contrasts", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Have you ever visited a historical site in your city?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A City of Contrasts", "num": 1, "total": 3, "text": "Our city is full of contrasts. On one hand, it has a rich cultural heritage — I have visited the old town's historical sites many times, and every spring there is a colourful festival with music, food, and traditional dance.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A City of Contrasts", "num": 2, "total": 3, "text": "On the other hand, the city faces real problems. Traffic jams are common during rush hour, and some neighbourhoods have become overcrowded. Air pollution and noise are also growing concerns for many families.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A City of Contrasts", "num": 3, "total": 3, "text": "Fortunately, the local community hasn't stayed silent. Volunteers have organised recycling programmes, and the old theatre near the main square has recently been renovated. Many residents have taken part in clean-up days to protect the city's future.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What problem is mentioned besides traffic?", "section": "While you read", "options": ["Too many festivals", "Air pollution and noise", "Too much recycling", "Empty streets"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The old theatre has recently been ___.", "section": "While you read", "reveal": "renovated", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The community has done nothing to solve the problems.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Volunteers have organised recycling and clean-up days.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What problems does your own city or town have?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning a Weekend in the City", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What would you like to do on a city weekend trip?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning a Weekend in the City", "audio": null, "transcript": [{"speaker": "A", "line": "Have you ever been to the spring festival downtown?"}, {"speaker": "B", "line": "No, I haven't! I've heard it's near the old monument."}, {"speaker": "A", "line": "Yes, exactly. Let's go this weekend — there's music, food, and dancing."}, {"speaker": "B", "line": "Sounds great, as long as the traffic jams aren't too bad!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What have the speakers never done?", "section": "While you listen", "options": ["Visited the museum", "Been to the festival", "Eaten at a café", "Taken a bus"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The festival takes place near the old ___.", "section": "While you listen", "reveal": "monument", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Life Experiences Survey", "text": "Ask your group members whether they have ever done three city-related activities (e.g. visited a monument, attended a festival).", "steps": ["Prepare three questions using present perfect.", "Ask each group member.", "Report one interesting answer to the class."], "chips": ["Have you ever...?", "Yes, I have. / No, I haven't.", "I have never..."], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My City: Good and Bad", "text": "Write a paragraph about the good and bad sides of your city, using present perfect to describe experiences.", "steps": ["Describe one positive experience using present perfect.", "Describe one city problem.", "Suggest one solution the community could try."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "'Kirlilik' means ___.", "section": "Exit ticket", "options": ["pollution", "heritage", "celebration", "monument"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I ___ (visit) that museum three times.", "section": "Exit ticket", "reveal": "have visited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What has the community organised, according to the text?", "section": "Exit ticket", "options": ["More traffic jams", "Recycling programmes", "Fewer festivals", "Noise pollution"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'Overcrowded' means having too many people.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "She ___ (never/see) the fireworks before.", "section": "Exit ticket", "reveal": "has never seen", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Where does the festival take place, according to the listening?", "section": "Exit ticket", "options": ["Near the school", "Near the old monument", "At the beach", "In the stadium"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Topluluk' means ___.", "section": "Exit ticket", "options": ["community", "celebration", "monument", "heritage"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The theatre was recently ___ (renovate).", "section": "Exit ticket", "reveal": "renovated", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Lise Hazırlık · Theme 13 · Life in the Neighbourhood, City and Social Life", "key": "prep-13"}</script></body></html>
