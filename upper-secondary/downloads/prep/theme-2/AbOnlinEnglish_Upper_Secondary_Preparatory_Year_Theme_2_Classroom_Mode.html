s": ["Correct", "Incorrect"], "answer": 1, "fix": "You mustn't use your phone.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I can't to see the board.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I can't see the board.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You ___ ask a question if you don't understand.", "section": "A · Choose the correct option.", "options": ["can", "must", "mustn't"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ listen when the teacher is speaking.", "section": "A · Choose the correct option.", "options": ["can", "must", "can't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You ___ use your phone during the lesson.", "section": "A · Choose the correct option.", "options": ["can", "must", "mustn't"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I ___ (not / see) the whiteboard from the back row.", "section": "B · Complete with the correct form.", "reveal": "can't see", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Students ___ (not / talk) loudly during a test.", "section": "B · Complete with the correct form.", "reveal": "mustn't talk", "note": "Students write the answer r for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Shall: making suggestions", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>Shall we<\/mark> work in pairs for this task?", "<mark>Shall I<\/mark> read the instructions aloud?", "Yes, let's — that's a good idea.", "<mark>Shall we<\/mark> ask the teacher for help?"], "ask": "Who do we usually use Shall with? What is it used for — a fact, an order, or a suggestion?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["Shall we", "Shall I", "suggestion", "let's"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use ___ to suggest doing something together.", "section": "Complete the rule", "reveal": "Shall we", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use ___ to offer to do something for someone else.", "section": "Complete the rule", "reveal": "Shall I", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Shall I/we…? is used to make a ___, not to ask about ability.", "section": "Complete the rule", "reveal": "suggestion", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A common short answer to a Shall we…? suggestion is 'Yes, ___.'", "section": "Complete the rule", "reveal": "let's", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use Shall I/we…? to make a suggestion or offer to do something. Shall we…? suggests doing something together; Shall I…? offers to do something for someone.", "tr": "Shall I/we…? bir öneri yapmak ya da bir şey yapmayı teklif etmek için kullanılır. Shall we…? birlikte bir şey yapmayı önerirken, Shall I…? ise başkası için bir şey yapmayı teklif ederken kullanılır.", "when_en": "We use it in the classroom to suggest a group activity or to offer help to the teacher or a classmate.", "when": "Sınıf içinde birlikte bir etkinlik önerirken ya da öğretmene/arkadaşa yardım teklif ederken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we", "work", "in pairs for this task"], "reveal": "Shall we work in pairs for this task?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "read", "the instructions aloud"], "reveal": "Shall I read the instructions aloud?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "ask", "the teacher for help"], "reveal": "Shall we ask the teacher for help?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "open", "the window? It's hot in here"], "reveal": "Shall I open the window? It's hot in here.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "start", "the group project today"], "reveal": "Shall we start the group project today?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two suggestions for your classmates using Shall we…? and one offer using Shall I…?", "chips": ["Shall we …?", "Shall I …?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Shall we work in pairs?", "Shall I read the instructions aloud?"], "short": ["Yes, let's. / No, let's not.", "Yes, please do. / No, thank you."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Shall we to work in pairs?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Shall we work in pairs?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Shall you help me with this?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Shall I help you with this?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ we work in pairs for this task?", "section": "A · Choose the correct option.", "options": ["Shall", "Do", "Are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cev nt to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ start the presentation now?", "section": "Dialogue · Complete with Shall I or Shall we.", "reveal": "Shall we", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, let's. ___ help you with the slides?", "section": "Dialogue · Complete with Shall I or Shall we.", "reveal": "Shall I", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Offer to read the instructions for your group.", "section": "Dialogue · Complete with Shall I or Shall we.", "words": ["shall", "I", "read", "the", "instructions", "for", "our", "group"], "end": "?", "reveal": "Shall I read the instructions for our group?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Our Classroom Rules", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What classroom rules do you think this text will mention?", "Guess: who usually gives instructions in the classroom?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Our Classroom Rules", "num": 1, "total": 5, "text": "My name is Elif and I'm in Year 10. Every morning, our teacher checks the timetable and tells us what we're going to study. There is a big whiteboard at the front of our classroom, and our teacher writes the plan for the lesson on it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Classroom Rules", "num": 2, "total": 5, "text": "In our classroom, we must listen carefully to the teacher's instructions. If we don't understand something, we can ask a question — we just have to raise our hand first. We mustn't interrupt when someone else is speaking.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Classroom Rules", "num": 3, "total": 5, "text": "There are five rows of desks in our classroom, and there is a classroom monitor who helps the teacher every week. This week, it's my turn to be the monitor, so I hand out the worksheets and collect the homework.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Classroom Rules", "num": 4, "total": 5, "text": "For most activities, we work with a partner or in small groups. We have to cooperate and take turns, because everyone must share ideas and materials. Sometimes the teacher says 'Shall we work in pairs today?' and everyone gets excited.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Classroom Rules", "num": 5, "total": 5, "text": "I like our classroom because the rules are clear and fair. Don't run, don't shout, and always listen — these are simple instructions, but they help everyone learn together.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["Elif's opinion about her teacher", "The rules and routines in Elif's classroom", "How to become a classroom monitor"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the teacher write on the whiteboard?", "section": "While you read", "options": ["The homework answers", "The plan for the lesson", "The class timetable for the whole year"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What must students do before they ask a question?", "section": "While you read", "options": ["Wait for break time", "Raise their hand", "Talk to a partner first"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 3, 'it's my turn' refers to Elif's turn to be…", "section": "While you read", "options": ["the teacher", "the classroom monitor", "the partner"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Students in Elif's classroom always work alone.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students often work with a partner or in small groups.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does Elif like her classroom?", "section": "While you read", "options": ["Because there are no rules", "Because the rules are clear and fair, and everyone learns together", "Because she is always the monitor"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What classroom jobs (like classroom monitor) does your own class have? Write two sentences.", "Compare Elif's classroom rules with your own class rules. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Planning Our Ideal Classroom", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think makes a classroom a good place to study?", "Guess: what jobs or roles could students have in an ideal classroom?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Planning Our Ideal Classroom", "num": 1, "total": 5, "text": "For our project this term, our class had to design an ideal classroom with ideal activities. First, we had a class discussion: 'Shall we choose our own roles, or shall the teacher choose them?' In the end, we voted, and everyone chose a role.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Ideal Classroom", "num": 2, "total": 5, "text": "In our ideal classroom, there is a clear timetable on the wall, and there are enough chairs and books for every student. There isn't a lot of noise, because everyone respects the classroom rules.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Ideal Classroom", "num": 3, "total": 5, "text": "Every student has a responsibility. There is a classroom monitor who checks the whiteboard is clean, a materials manager who gives out worksheets, and a timekeeper who watches the clock during group activities.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Ideal Classroom", "num": 4, "total": 5, "text": "We must cooperate and take turns in every activity. Students mustn't interrupt each other, and everyone can ask for help without feeling embarrassed. We also revise new vocabulary together at the end of each lesson.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Planning Our Ideal Classroom", "num": 5, "total": 5, "text": "For the writing task, each group wrote a short script about their ideal roles and routines. Next, we're going to act out these roles in class and present our ideal classroom to the other students.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A test students take at school", "Planning roles and rules for an ideal classroom", "A new whiteboard for the classroom"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How did the class choose their roles?", "section": "While you read", "options": ["The teacher chose for them", "They voted after a discussion", "They didn't choose roles at all"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the materials manager do?", "section": "While you read", "options": ["Checks the whiteboard is clean", "Gives out worksheets", "Watches the clock"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do students do at the end of each lesson?", "section": "While you read", "options": ["Clean the classroom", "Revise new vocabulary together", "Write a test"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In this ideal classroom, students can interrupt each other freely.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students mustn't interrupt each other in this ideal classroom.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What will the class do after writing their scripts?", "section": "While you read", "options": ["Start a new project", "Act out their roles and present them", "Forget about the project"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["List two roles you would like to have in your own ideal classroom.", "Design one classroom rule you think would make your class better. Write it as a sentence."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Understanding the Teacher's Instructions", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a teacher giving instructions on the first day of term.", "Predict: what classroom rules might the teacher explain?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Understanding the Teacher's Instructions", "audio": null, "transcript": [{"speaker": "Teacher", "line": "Good morning, everyone! Before we start, let's go over our classroom rules together."}, {"speaker": "Aslı", "line": "OK. Do we have to raise our hand before we speak?"}, {"speaker": "Teacher", "line": "Yes, you do. You mustn't interrupt when someone else is talking."}, {"speaker": "Aslı", "line": "And shall we sit with the same partner every day?"}, {"speaker": "Teacher", "line": "No, we'll change partners every week, so everyone can cooperate with different classmates."}, {"speaker": "Aslı", "line": "Is there a classroom monitor this term?"}, {"speaker": "Teacher", "line": "Yes, there is. The classroom monitor changes every week and hands out the worksheets."}, {"speaker": "Aslı", "line": "Thank you! One more thing — can we use dictionaries during tests?"}, {"speaker": "Teacher", "line": "You can use a dictionary in normal lessons, but you mustn't use one during a test."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are the teacher and Aslı talking about?", "section": "While you listen", "options": ["A school trip", "The classroom rules for the term", "A new timetable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What must students do before they speak?", "section": "While you listen", "options": ["Stand up", "Raise their hand", "Ask a partner first"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How often do students change partners?", "section": "While you listen", "options": ["Every day", "Every week", "Every term"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who hands out the worksheets?", "section": "While you listen", "options": ["The teacher", "The classroom monitor", "Aslı"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Students can use a dictionary during a test.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students mustn't use a dictionary during a test.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Which of these classroom rules do you already follow in your own class?", "Write one question you would ask a teacher about classroom rules on the first day."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning Roles for the Ideal Classroom", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning roles for their 'ideal classroom' project.", "Predict: what two classroom roles might they choose?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning Roles for the Ideal Classroom", "audio": null, "transcript": [{"speaker": "Mert", "line": "So, for our ideal classroom project, shall we choose our roles now?"}, {"speaker": "Zeynep", "line": "Good idea. There must be a classroom monitor — shall I do that job?"}, {"speaker": "Mert", "line": "Sure, you can be the monitor. I'll be the timekeeper, if that's OK."}, {"speaker": "Zeynep", "line": "Perfect. We also need someone to check the worksheets — can Ela do that?"}, {"speaker": "Mert", "line": "Yes, she can. She's very organised. What about the daily routine?"}, {"speaker": "Zeynep", "line": "There should be a timetable on the wall, and everyone must cooperate and take turns."}, {"speaker": "Mert", "line": "Don't forget — we mustn't forget the writing task! We have to write the script by Friday."}, {"speaker": "Zeynep", "line": "You're right. Shall we start writing our roles' lines together after school?"}, {"speaker": "Mert", "line": "Yes, let's. Let's meet in the library at four."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Mert and Zeynep planning?", "section": "While you listen", "options": ["A school trip", "Roles for their ideal classroom project", "A sports competition"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who will be the classroom monitor?", "section": "While you listen", "options": ["Mert", "Zeynep", "Ela"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Ela's role?", "section": "While you listen", "options": ["Timekeeper", "Checking the worksheets", "Classroom monitor"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do they have to finish by Friday?", "section": "While you listen", "options": ["The presentation", "The script", "The timetable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mert and Zeynep decide to write the script alone, separately.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They decide to write the script together, after school.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["If you planned your ideal classroom, which role would you choose? Why?", "Write one sentence with 'must' about a rule for your ideal classroom."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Find Someone Who… (Classroom Roles)", "text": "Walk around the class and ask your classmates questions with Can you…?, Do you have to…? and Must you…? to find someone who matches each sentence about classroom roles and rules. Write their name next to the sentence.", "steps": ["Look at your worksheet: 6 sentences about classroom roles and rules (e.g. '…has been a classroom monitor').", "Stand up and ask a classmate a question to check if the sentence is true for them.", "If it's true, write their name. If not, ask another classmate.", "Try to find a different name for each sentence.", "Sit down and share two interesting answers with the class."], "chips": ["Do you have to raise your hand before you speak?", "Can you work well with a partner?", "Must you always take turns in group work?", "Yes, I do. / No, I don't. / Yes, I can. / No, I can't."], "timer": 600, "levels": ["Destek Give students the question forms in writing before they start.", "Hedef 6 questions, mingling for about 10 minutes.", "İleri Fast finishers add one more true sentence about their own classroom role and ask it too."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Our Ideal Classroom — Role-Play", "text": "In your group, act out a short scene from your 'ideal classroom' project. Each student plays a role (e.g. classroom monitor, timekeeper, teacher) and gives at least one instruction or suggestion.", "steps": ["Decide on your roles and where the scene happens.", "Decide what activity your ideal classroom is doing (e.g. a group project, a discussion).", "Write 1-2 lines for each role using this theme's grammar.", "Rehearse your scene once as a group.", "Perform your scene for another group."], "chips": ["Shall we start the activity now?", "You must …/You mustn't …", "Can I…, please?", "Let's take turns."], "timer": 600, "levels": ["Destek Provide sentence starters on cards for lower-level students.", "Hedef One short scene with 3-4 roles per group.", "İleri Groups add one extra classroom rule to their scene."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Ideal Classroom Rules", "text": "Write a short list of rules for your ideal classroom. Include at least two rules with must/mustn't and one sentence with There is/are describing your classroom.", "steps": ["Choose a title for your rules list.", "List 4-5 rules using must, mustn't, can and can't.", "Add one sentence with There is/are describing your ideal classroom.", "Check your grammar and punctuation."], "chips": ["instruction", "permission", "silence", "cooperate", "share", "timetable", "Students must…", "You mustn't…", "There is/are…", "We can…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "My Ideal Classroom — Project Script", "text": "Write a short script (6-8 lines) for the 'My Ideal Classroom' project. Include at least two characters with different roles (e.g. classroom monitor and teacher) and describe your ideal roles, relationships, and routines. Use at least two of this theme's grammar points.", "steps": ["Choose your characters and their roles in the ideal classroom.", "Decide what activity or routine the scene shows (e.g. starting group work, giving an instruction).", "Write 6-8 lines of dialogue.", "Read it aloud with your group and time it — it should take about 30 seconds."], "chips": ["classroom monitor", "partner", "teammate", "cooperate", "worksheet", "presentation", "Shall we…?", "You must…", "There is/are…", "Don't …, please."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'cooperate'", "section": "Exit ticket", "options": ["to work alone", "to work together with others", "to be late"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'submit' mean?", "section": "Exit ticket", "options": ["to hand in or send your work", "to lose your work", "to copy your work"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "There ___ twenty desks in our classroom.", "section": "Exit ticket", "options": ["is", "are", "be"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ your books, please.", "section": "Exit ticket", "options": ["Open", "You open", "Opens"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You ___ use your phone during the lesson.", "section": "Exit ticket", "options": ["can", "must", "mustn't"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ we work in pairs for this task?", "section": "Exit ticket", "options": ["Shall", "Do", "Are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In 'Our Classroom Rules', what does the classroom monitor do this week?", "section": "Exit ticket", "options": ["Writes the timetable", "Hands out worksheets and collects homework", "Reads instructions aloud"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In 'Our Classroom Rules', students always work alone in Elif's class.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students often work with a partner or in small groups.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}], "theme": "Lise Hazırlık · Theme 2 · Classroom Life", "key": "prep-2"}</script></body></html>
