reysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "monitor", "pos": "noun", "ipa": "/ˈmɒnɪtər/", "tr": "sınıf başkanı", "example": "The class monitor collects the notebooks.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "whiteboard", "pos": "noun", "ipa": "/ˈwaɪtbɔːrd/", "tr": "beyaz tahta", "example": "The teacher writes new words on the whiteboard.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "quiz", "pos": "noun", "ipa": "/kwɪz/", "tr": "kısa sınav", "example": "We have a short quiz every Friday.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“ders programı”", "options": ["timetable", "concentrate", "raise your hand"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“grup çalışması”", "options": ["participate", "group work", "hand in"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“tekrar etmek”", "options": ["revise", "raise your hand", "instruction"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": " en your book.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Open your book.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "___ (open) your notebooks, please.", "section": "", "reveal": "Open", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ (not/talk) while others are speaking. (negative instruction)", "section": "", "reveal": "Don't talk", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which is a correct instruction?", "section": "", "options": ["You raise your hand.", "Raise your hand.", "Raising your hand.", "To raise your hand."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Turn this into an instruction: students should hand in homework now.", "section": "", "reveal": "Hand in your homework now.", "prompt": "Use imperative", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "How We Study in Room 12", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you prefer pair work or group work?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "How We Study in Room 12", "num": 1, "total": 3, "text": "In Room 12, every lesson follows the same simple routine. First, the teacher writes the day's instructions on the whiteboard. Students take out their notebooks and check the timetable to see which subject comes next.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "How We Study in Room 12", "num": 2, "total": 3, "text": "During the lesson, students often work in pairs or in small groups. \"Take turns speaking,\" the teacher often reminds them, \"and don't interrupt your partner.\" The class monitor helps by handing out worksheets and collecting notebooks at the end.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "How We Study in Room 12", "num": 3, "total": 3, "text": "At the end of each week, there is a short quiz to check what students remember. \"Revise your notes every evening,\" the teacher advises, \"and you won't need to worry about the quiz.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What does the teacher write on the whiteboard?", "section": "While you read", "options": ["Homework grades", "The day's instructions", "Student names", "The timetable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The class monitor hands out ___ and collects notebooks.", "section": "While you read", "reveal": "worksheets", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce defter
