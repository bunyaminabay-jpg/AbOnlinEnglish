": "list", "title": "By the end of this theme…", "list": ["I can talk about life on a space station.", "I can describe space explorations.", "I can make predictions about future space travel.", "I can talk about future life on Earth and beyond."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["12 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "space station", "pos": "noun", "ipa": "/speɪs ˈsteɪʃən/", "tr": "uzay istasyonu", "example": "Astronauts live on the International Space Station for months.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "astronaut", "pos": "noun", "ipa": "/ˈæstrənɔːt/", "tr": "astronot", "example": "The astronaut spent six months in orbit.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "spacecraft", "pos": "noun", "ipa": "/ˈspeɪskræft/", "tr": "uzay aracı", "example": "The spacecraft landed safely on the Moon.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "weightlessness", "pos": "noun", "ipa": "/ˈweɪtləsnəs/", "tr": "ağırlıksızlık", "example": "Astronauts float because of weightlessness.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "exploration", "pos": "noun", "ipa": "/ˌekspləˈreɪʃən/", "tr": "keşif", "example": "Space exploration has advanced quickly in recent years.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "launch", "pos": "verb/noun", "ipa": "/lɔːntʃ/", "tr": "fırlatmak", "example": "The rocket will launch tomorrow morning.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "colonise", "pos": "verb", "ipa": "/ˈkɒlənaɪz/", "tr": "koloni kurmak", "example": "Scientists hope to colonise Mars one day.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "mission", "pos": "noun", "ipa": "/ˈmɪʃən/", "tr": "görev", "example": "The mission to Mars will take several years.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "prediction", "pos": "noun", "ipa": "/prɪˈdɪkʃən/", "tr": "tahmin", "example": "Scientists made a prediction about future space travel.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "advanced technology", "pos": "noun", "ipa": "/ədˈvænst tekˈnɒlədʒi/", "tr": "gelişmiş teknoloji", "example": "Advanced technology allows longer space missions.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "sustain", "pos": "verb", "ipa": "/səˈsteɪn/", "tr": "sürdürmek", "example": "The station must sustain life for months.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "probe", "pos": "noun", "ipa": "/proʊb/", "tr": "uzay sondası", "example": "The space probe sent photos of Jupiter back to Earth.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“tahmin”", "options": ["prediction", "mission", "sustain"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“gelişmiş teknoloji”", "options": ["advanced technology", "launch", "prediction"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“uzay aracı”", "options": ["space station", "spacecraft", "advanced technology"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“uzay sondası”", "options": ["colonise", "probe", "sustain"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“uzay istasyonu”", "options": ["launch", "space station", "spacecraft"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“ağırlıksızlık”", "options": ["weightlessness", "mission", "astronaut"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Will / Won't — Predictions About the Future", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["In fifty years, humans <mark>will live<\/mark> on Mars.", "Robots <mark>won't replace<\/mark> all astronauts.", "Space travel <mark>will become<\/mark> cheaper and more common."], "ask": "What do you notice about these predictions? Are they certain or possible?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'will'/'won't' to make predictions about the future, often with words like 'probably' or 'I think'.", "tr": "Gelecekle ilgili tahminlerde 'will/won't' kullanılır; genellikle 'probably' veya 'I think' ile birlikte kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["Humans will visit Mars."], "negative": ["We won't colonise other galaxies soon."], "question": ["Will people live in space one day?"], "short": ["Yes, they will. / No, they won't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Humans will to live on Mars.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Humans will live on Mars.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "I think humans ___ (will) colonise Mars within a century.", "section": "", "reveal": "will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Robots ___ (not/replace) all astronauts completely.", "section": "", "reveal": "won't replace", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["Space travel will probably cheaper.", "Space travel will probably be cheaper.", "Space travel probably will cheaper.", "Space travel will be probably cheaper."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a prediction: it's likely that scientists find water on Mars.", "section": "", "reveal": "Scientists will probably find water on Mars.", "prompt": "Use will probably", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Life on a Space Station", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think daily life is like for an astronaut?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Life on a Space Station", "num": 1, "total": 3, "text": "Living on a space station is very different from life on Earth. Astronauts experience weightlessness, so everyday tasks like eating and sleeping require special equipment and training. A mission on the International Space Station usually lasts about six months.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life on a Space Station", "num": 2, "total": 3, "text": "Space exploration is developing fast. Scientists send probes and spacecraft to study distant planets, and many experts believe humans will land on Mars within the next few decades. Some scientists even think we will try to colonise Mars one day, using advanced technology to sustain human life there.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life on a Space Station", "num": 3, "total": 3, "text": "Of course, nobody knows the future for certain. Space travel probably won't become as easy as taking a plane any time soon, but each new mission brings us closer to answering big questions about our universe.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "How long does a typical ISS mission last?", "section": "While you read", "options": ["One month", "Six months", "One year", "Ten years"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Astronauts experience ___ on the space station.", "section": "While you read", "reveal": "weightlessness", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The text says space travel will definitely become as easy as flying by plane soon.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says it probably won't become that easy soon.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Would you like to become an astronaut? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "An Interview With a Space Scientist", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What questions would you ask a space scientist?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "An Interview With a Space Scientist", "audio": null, "transcript": [{"speaker": "Interviewer", "line": "Do you think humans will visit Mars in our lifetime?"}, {"speaker": "Scientist", "line": "I believe we will probably visit Mars within the next few decades."}, {"speaker": "Interviewer", "line": "Will robots replace astronauts completely?"}, {"speaker": "Scientist", "line": "No, I don't think so — robots won't replace astronauts completely, but they will help with dangerous tasks."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does the scientist predict about Mars?", "section": "While you listen", "options": ["Humans will never visit it", "Humans will probably visit it within decades", "It will be colonised next year", "Nothing is known"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The scientist says robots ___ (won't) replace astronauts completely.", "section": "While you listen", "reveal": "won't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Predictions About Space", "text": "Discuss three predictions about the future of space travel using will/won't.", "steps": ["Brainstorm three predictions about space travel.", "Discuss how likely each one is.", "Share your group's most interesting prediction with the class."], "chips": ["I think... will...", "...probably won't...", "In the future, humans will..."], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Life in the Future", "text": "Write a paragraph with your predictions about space exploration and life in the future, using will/won't.", "steps": ["Make two predictions about space exploration using will.", "Make one prediction about what won't happen soon.", "Explain why you think this."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type" eveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Görev' means ___.", "section": "Exit ticket", "options": ["mission", "launch", "probe", "prediction"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The rocket will ___ tomorrow morning.", "section": "Exit ticket", "reveal": "launch", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Lise Hazırlık · Theme 16 · Life in the Universe and Future", "key": "prep-16"}</script></body></html>
