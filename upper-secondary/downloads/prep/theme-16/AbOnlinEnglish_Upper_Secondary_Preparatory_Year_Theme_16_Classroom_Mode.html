aling the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "spacesuit", "pos": "noun", "ipa": "/ˈspeɪssuːt/", "tr": "uzay kıyafeti", "example": "You must check your spacesuit carefully before you go outside the station.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "mission control", "pos": "noun", "ipa": "/ˈmɪʃn kənˈtrəʊl/", "tr": "uçuş kontrol merkezi", "example": "Mission control will have received the final safety report before the launch.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "orbit", "pos": "verb", "ipa": "/ˈɔːbɪt/", "tr": "yörüngede dönmek", "example": "The station will have orbited the Earth thousands of times by the end of the year.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "launch", "pos": "verb", "ipa": "/lɔːntʃ/", "tr": "fırlatmak, uzaya göndermek", "example": "Engineers will have tested the rocket many times before they launch it.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "spacecraft", "pos": "noun", "ipa": "/ˈspeɪskrɑːft/", "tr": "uzay aracı", "example": "The spacecraft will have travelled millions of kilometres by the time it reaches Mars.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sı able", "pos": "adjective", "ipa": "/səˈsteɪnəbl/", "tr": "sürdürülebilir", "example": "Future space colonies will need a sustainable way to grow food and produce energy.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "artificial intelligence", "pos": "noun", "ipa": "/ˌɑːtɪˈfɪʃl ɪnˈtelɪdʒəns/", "tr": "yapay zekâ", "example": "By 2045, artificial intelligence will have changed the way we live and work.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "breakthrough", "pos": "noun", "ipa": "/ˈbreɪkθruː/", "tr": "çığır açan buluş", "example": "Scientists are hoping for a breakthrough that will make interplanetary travel safer.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "predict", "pos": "verb", "ipa": "/prɪˈdɪkt/", "tr": "tahmin etmek, öngörmek", "example": "Many scientists predict that robots will have taken over dangerous space jobs by 2050.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "advanced technology", "pos": "noun", "ipa": "/ədˈvɑːnst tekˈnɒlədʒi/", "tr": "ileri teknoloji", "example": "Advanced technology will have made long space journeys much more comfortable by then.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": ftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The question form starts with ___ + subject + … + past participle?", "section": "Complete the rule", "reveal": "Will … have / Will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "The Future Perfect (will have + past participle) describes an action that will be completed before a specific point in the future. It is often used with expressions like 'by 2035' or 'by the end of the mission'.", "tr": "Future Perfect (will have + fiilin 3. hâli), gelecekteki belirli bir zamandan ÖNCE tamamlanmış olacak bir eylemi anlatır. 'By 2035' (2035'e kadar), 'by the end of the mission' (görevin sonuna kadar) gibi ifadelerle sık kullanılır.", "when_en": "We use it to talk about achievements, missions or changes that will be complete by a future date or event — very common when we predict the future of space exploration.", "when": "Gelecekteki bir tarihe ya da olaya kadar tamamlanmış olacak başarıları, görevleri veya değişiklikleri anlatırken kullanılır — özellikle uzay araştırmaları ve gelecek tahminlerinde.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["scientists", "build", "a Moon base", "by 2035"], "reveal": "Scientists will have built a Moon base by 2035.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the crew", "spend", "six months on the station", "by June"], "reveal": "The crew will have spent six months on the station by June.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgel ü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The astronauts will have landed by then, won't they?"], "negative": ["This telescope won't have finished its survey by 2030, will it?"], "question": ["You will have joined mission control by the time we launch, won't you?"], "short": ["Yes, they will. / No, they won't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The astronauts will have landed by then, don't they?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The astronauts will have landed by then, won't they?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We won't have solved every problem by 2050, won't we?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We won't have solved every problem by 2050, will we?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "The astronauts will have landed by then, ___?", "section": "A · Choose the correct tag.", "options": ["won't they", "will they", "don't they"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This telescope won't have finished its survey by 2030, ___?", "section": "A · Choose the correct tag.", "options": ["won't it", "will it", "isn't it"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You will have joined mission control by the time we launch, ___?", "section": "A · Choose the correct tag.", "options": ["don't you", "won't you", "aren't you"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We won't have solved every problem of space travel by 2050, ___?", "section": "B · Complete with the correct tag.", "reveal": "will we", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The rover will have been exploring the surface for a year by June, ___?", "section": "B · Complete with the correct tag.", "reveal": "won't it", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "This telescope won't have finished its survey by 2030, will it?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "You will have joined mission control by the time we launch, don't you?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You will have joined mission control by the time we launch, won't you?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: By 2100, engineers will have built the first Mars colony, ___?", "section": "Dialogue · Add the correct question tag.", "reveal": "won't they", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I hope so! But scientists won't have solved every problem, ___?", "section": "Dialogue · Add the correct question tag.", "reveal": "will they", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a tag question about a rover exploring a planet.", "section": "Dialogue · Add the correct question tag.", "words": ["the", "rover", "will", "have", "been", "exploring", "the", "planet", "for", "a", "year", "by", "then,", "won't", "it"], "end": "?", "reveal": "The rover will have been exploring the planet for a year by then, won't it?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Life Aboard the Space Station", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think an astronaut's daily routine looks like?", "Guess: how many hours a day do you think astronauts spend exercising?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Life Aboard the Space Station", "num": 1, "total": 6, "text": "My name is Commander Lena Voss, and I have been living on the International Research Station for four months. By the end of this mission, I will have spent almost a year of my life in zero gravity.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life Aboard the Space Station", "num": 2, "total": 6, "text": "Every morning starts the same way. I check my spacesuit, talk to mission control, and review the day's tasks. Without gravity, even simple things like eating breakfast or brushing your teeth become a small adventure — food floats if you're not careful!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life Aboard the Space Station", "num": 3, "total": 6, "text": "In the afternoon, we usually run experiments. Right now, we are growing plants to see if a colony on the Moon could one day grow its own food. By the time I return to Earth, our team will have completed over two hundred experiments.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life Aboard the Space Station", "num": 4, "total": 6, "text": "Exercise is extremely important here. Without it, our muscles and bones become weak in zero gravity, so we exercise for two hours every day. By the end of my mission, I will have been exercising on this station for almost a thousand hours.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life Aboard the Space Station", "num": 5, "total": 6, "text": "In the evening, I like to look out of the window at Earth. It's easy to forget how small our planet looks from up here. I always remind the younger astronauts: by the time your first mission ends, you will have seen more sunrises than most people see in a lifetime — the station orbits the Earth every ninety minutes!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Life Aboard the Space Station", "num": 6, "total": 6, "text": "Life here isn't always easy, but I wouldn't change it. When people ask if it's worth it, I always say the same thing: humans will have learned enough about long space missions by the 2030s to finally send astronauts to Mars — and I want to be part of that story.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["The history of space stations", "An astronaut's daily life and future plans", "How rockets are built"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long has Lena already been on the station?", "section": "While you read", "options": ["Four months", "A year", "Two hundred days"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why does Lena exercise every day?", "section": "While you read", "options": ["To feel less bored", "Because her muscles and bones become weak in zero gravity", "Because mission control tells her to compete"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What are the astronauts growing plants for?", "section": "While you read", "options": ["To decorate the station", "To test food for a possible Moon colony", "To sell them on Earth"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The space station orbits the Earth once a day.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The space station orbits the Earth every ninety minutes.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does Lena probably feel about her life on the station?", "section": "While you read", "options": ["Regretful", "Proud and hopeful about the future of space travel", "Bored"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["By the end of Lena's mission, what will she have done? Write two sentences with the Future Perfect.", "Would you like to live on a space station for a year? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Our Mars Colony Project", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think people would need to survive on Mars?", "Guess: what jobs might people have in a colony on another planet?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Our Mars Colony Project", "num": 1, "total": 5, "text": "For our class project this term, we designed a hypothetical colony on Mars. First, we had to decide who would live there: scientists, engineers, doctors, and farmers who could grow food in a sustainable way.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Mars Colony Project", "num": 2, "total": 5, "text": "We predicted that by 2100, the first colony will have grown from just a few hundred people to a small, functioning town. Our group decided the colony would need its own sustainable energy system, because sending fuel from Earth would be far too expensive.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Mars Colony Project", "num": 3, "total": 5, "text": "One of the biggest challenges was breathing. Mars doesn't have enough oxygen, so every building needs a special system. We imagined that by the time the colony celebrates its fiftieth anniversary, engineers will have developed advanced technology to make the air completely safe, even outside the main buildings.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Mars Colony Project", "num": 4, "total": 5, "text": "We also wrote short scripts for our presentation. In one scene, a scientist explains a new breakthrough in growing food on Mars; in another, two astronauts argue about whether humans should build more colonies or focus on protecting Earth instead.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Mars Colony Project", "num": 5, "total": 5, "text": "Working on this project taught us that interplanetary travel isn't just about rockets and spacesuits — it's also about people, teamwork, and difficult decisions. We will have learned a lot more about ourselves than about Mars by the time we finish presenting our project to the class!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What was the class project about?", "section": "While you read", "options": ["Building a real spacecraft", "Designing a hypothetical colony on Mars", "Writing a report about the Moon"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why does the colony need its own sustainable energy system?", "section": "While you read", "options": ["Because sending fuel from Earth would be too expensive", "Because Mars is too cold", "Because the colony has no engineers"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is one of the biggest challenges for the colony, according to the text?", "section": "While you read", "options": ["Finding water", "Breathing, because Mars doesn't have enough oxygen", "Building roads"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do the two astronauts argue about in the script?", "section": "While you read", "options": ["Who should be the leader", "Whether to build more colonies or protect Earth instead", "What to eat for dinner"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The students think their project was only about rockets and spacesuits.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The students learned the project was also about people, teamwork, and difficult decisions.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What can we infer about the writer's opinion of the project?", "section": "While you read", "options": ["It was a waste of time", "It was a valuable and interesting learning experience", "It was too easy"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What job would you choose in a Mars colony? Explain why in two sentences.", "Write one prediction about Mars colonies using the Future Perfect, e.g. 'By 2100, …'"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning the Next Mission", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two astronauts, Kaan and Zara, planning their next mission to the space station.", "Predict: what do you think astronauts have to prepare before a mission?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning the Next Mission", "audio": null, "transcript": [{"speaker": "Kaan", "line": "So, by the time we launch next month, we have to finish all our training. How is yours going?"}, {"speaker": "Zara", "line": "Good. By Friday, I will have completed the last zero-gravity simulation. What about the spacesuit checks?"}, {"speaker": "Kaan", "line": "Mission control says they will have finished testing our suits by next week."}, {"speaker": "Zara", "line": "Perfect. And by the end of the mission, we will have been living on the station for eight months."}, {"speaker": "Kaan", "line": "Eight months! We won't have seen our families for a very long time, will we?"}, {"speaker": "Zara", "line": "No, we won't. But we'll have video calls. Will you have finished your research proposal before we go?"}, {"speaker": "Kaan", "line": "Yes, I will have sent it to mission control by Monday. I'm studying how plants grow without gravity."}, {"speaker": "Zara", "line": "That's a great project. By 2035, that research could help build the first sustainable colony!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Kaan and Zara preparing for?", "section": "While you listen", "options": ["A conference", "Their next mission to the space station", "A job interview"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What will Zara have completed by Friday?", "section": "While you listen", "options": ["Her spacesuit", "The last zero-gravity simulation", "Her research proposal"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long will they have been living on the station by the end of the mission?", "section": "While you listen", "options": ["Four months", "Six months", "Eight months"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Kaan's research about?", "section": "While you listen", "options": ["Building spacesuits", "How plants grow without gravity", "Repairing telescopes"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kaan and Zara will not be able to talk to their families at all during the mission.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They won't see their families, but they will have video calls.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Would you like to be away from your family for eight months for a mission like this? Why or why not?", "Write one sentence using the Future Perfect about something you will have done by next Friday."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "An Interview with a Futurist", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a radio interview with Dr Aylin Baran, a scientist who studies future technology.", "Predict: what changes do you think a futurist might talk about?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "An Interview with a Futurist", "audio": null, "transcript": [{"speaker": "Host", "line": "Dr Baran, thank you for joining us. What will everyday life look like in fifty years?"}, {"speaker": "Dr Baran", "line": "Well, by 2075, artificial intelligence will have changed almost every part of our lives — from transport to medicine."}, {"speaker": "Host", "line": "That sounds exciting, but also a little frightening. Won't people have lost their jobs?"}, {"speaker": "Dr Baran", "line": "Some jobs will have disappeared, yes, but new ones will have appeared too — especially in space exploration and sustainable technology."}, {"speaker": "Host", "line": "Do you think we will have built a colony on Mars by then?"}, {"speaker": "Dr Baran", "line": "I do. Scientists will have been researching sustainable colonies for decades by 2075, so I'm optimistic."}, {"speaker": "Host", "line": "What breakthrough are you personally most excited about?"}, {"speaker": "Dr Baran", "line": "Clean, sustainable energy for spacecraft. Once we solve that, interplanetary travel will finally become realistic for ordinary people, not just astronauts."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Who is Dr Aylin Baran?", "section": "While you listen", "options": ["An astronaut", "A scientist who studies future technology", "A radio host"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to Dr Baran, what will have changed almost every part of our lives by 2075?", "section": "While you listen", "options": ["Sustainable colonies", "Artificial intelligence", "Telescopes"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Dr Baran say about jobs in the future?", "section": "While you listen", "options": ["All jobs will disappear", "Some jobs will disappear, but new ones will appear", "Nothing will change"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What breakthrough is Dr Baran most excited about?", "section": "While you listen", "options": ["Faster telescopes", "Clean, sustainable energy for spacecraft", "New spacesuits"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Dr Baran believes scientists will only start researching sustainable colonies after 2075.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She believes scientists will have been researching sustainable colonies for decades by 2075.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Do you agree with Dr Baran's predictions? Why or why not?", "Write one prediction of your own about life in fifty years, using the Future Perfect."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Mission Control: Design a Space Mission", "text": "In groups, design a hypothetical space mission (destination, crew, and goals). Present your plan to the class using the Future Perfect to describe what your mission will have achieved by a certain date.", "steps": ["In your group, choose a destination (Moon, Mars, an asteroid, or somewhere else).", "Decide on the crew and their jobs (pilot, scientist, doctor, engineer).", "Write three goals your mission will
