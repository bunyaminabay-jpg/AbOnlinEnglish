", "Does"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "With he, she or it, we add ___ to the verb: starts, teaches.", "section": "Complete the rule", "reveal": "-s / -es / -s / s / es", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative with I / you / we / they is ___ + base verb.", "section": "Complete the rule", "reveal": "don't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative with he / she / it is ___ + base verb.", "section": "Complete the rule", "reveal": "doesn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a yes/no question with he / she / it, we start with ___.", "section": "Complete the rule", "reveal": "Does", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the Simple Present for facts, timetables, and things that happen regularly at school. Add -s/-es with he/she/it. Negative: don't/doesn't + base verb. Question: Do/Does + subject + base verb?", "tr": "Simple Present; okulda düzenli olarak olan şeyleri, ders programını ve gerçekleri anlatmak için kullanılır. He/she/it ile fiile -s/-es eklenir. Olumsuzda don't/doesn't + yalın fiil; soruda Do/Does ın."}, {"type": "prompt", "title": "Your turn", "text": "Write about your own school day. Say what time it starts, one lesson you have, and one thing you don't do at school.", "chips": ["My school day starts at …", "I have … on …", "I don't …", "The canteen …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The school day starts at 8:30.", "She teaches English."], "negative": ["We don't wear trainers.", "He doesn't arrive late."], "question": ["Does the canteen open at break time?", "Do you have Maths on Monday?"], "short": ["Yes, it does. / No, it doesn't.", "Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She teach English.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She teaches English.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He don't like the canteen food.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He doesn't like the canteen food.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Our school day ___ at 8:30.", "section": "A · Choose the correct option.", "options": ["start", "starts", "starting"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Ms Aydın ___ English.", "section": "A · Choose the correct option.", "options": ["teach", "teaches", "teachs"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": e correct modal.", "reveal": "Do we have to / Must we", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: No, we ___. We can wear sports clothes.", "section": "Dialogue · Complete with the correct modal.", "reveal": "don't have to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "You must be quiet in the library.", "section": "Dialogue · Complete with the correct modal.", "reveal": "You mustn't talk loudly in the library.", "prompt": "Make it negative with mustn't-style meaning about talking loudly.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Must vs have to", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Teacher: <mark>You must<\/mark> hand in your project by Friday — it's a class rule.", "Student: I know, I <mark>have to<\/mark> finish it tonight because my parents want me to.", "The school rules say students <mark>must<\/mark> be punctual.", "I <mark>have to<\/mark> leave early today for a doctor's appointment."], "ask": "Which one comes from a rule (the school/a law)? Which one comes from the speaker's own decision?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["must", "have to", "rule", "personal"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "___ often comes from an outside rule, like a school rule or a law.", "section": "Complete the rule", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ often comes from a ___ obligation, or something someone else told you to do.", "section": "Complete the rule", "reveal": "have to / personal", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Must and have to both mean 'it is necessary', but must usually comes from the speaker, an official rule, or a law; have to usually comes from an outside obligation, like someone else's instruction. In everyday speech, they are often used the same way.", "tr": "Must ve have to ikisi de 'zorunlu' anlamına gelir, ama must genellikle konuşan kişiden, resmî bir kuraldan ya da kanundan gelir; have to ise genellikle dışarıdan gelen bir zorunluluğu (başka birinin isteğini) anlatır. Günlük konuşmada çoğu zaman aynı şekilde kullanılırlar.", "when_en": "We choose must for official school rules and strong personal opinions; we choose have to for obligations that come from someone or something else.", "when": "Resmî okul kuralları ve güçlü kişisel görüşler için must seçilir; başkasından ya da bir durumdan gelen zorunluluklar için have to seçilir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["school rule", "students", "wear a uniform"], "reveal": "Students must wear a uniform. (school rule)", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["mum says", "I", "tidy my room tonight"], "reveal": "I have to tidy my room tonight. (mum's request)", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["exam rule", "you", "switch off your phone"], "reveal": "You must switch off your phone. (exam rule)", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the doctor says", "I", "rest for two days"], "reveal": "I have to rest for two days. (doctor's advice)", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["library rule", "everyone", "be quiet"], "reveal": "Everyone must be quiet. (library rule)", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences about your own life: one about a rule at your school (use must) and one about something you personally need to do (use have to).", "chips": ["At my school, students must …", "This week, I have to …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Students must be punctual. (school rule)", "I have to leave at 3 pm. (my train)"], "negative": ["You mustn't copy in exams.", "I don't have to work on Sunday."], "question": ["Do I have to bring my own pen?"], "short": ["Yes, you do."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The school rule says students has to wear a uniform.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The school rule says students must wear a uniform.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I must go to the dentist tomorrow because my mum said so.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I have to go to the dentist tomorrow because my mum said so.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "School rule: Students ___ arrive before 8:30.", "section": "A · Choose must or have to.", "options": ["must", "has to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My dad says I ___ help him this weekend.", "section": "A · Choose must or have to.", "options": ["must", "have to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The library rule says: You ___ be quiet.", "section": "B · Complete the sentence.", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I ___ finish my project tonight because the deadline is tomorrow.", "section": "B · Complete the sentence.", "reveal": "have to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Must and have to always mean exactly the same thing in every situation.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Must usually comes from a rule or the speaker; have to usually comes from an outside obligation.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Teacher: According to our school rules, all students ___ be respectful.", "section": "Dialogue · Choose the best modal.", "options": ["must", "has to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Student: I understand. I also ___ set a good example for my little brother — he's in Year 5 now.", "section": "Dialogue · Choose the best modal.", "options": ["must", "have to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Can: permission and polite requests", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Student: <mark>Can I<\/mark> go to the library, please?", "Teacher: Yes, of course you <mark>can<\/mark>.", "<mark>Can you<\/mark> help me with this exercise, please?", "You <mark>can't<\/mark> leave the classroom during the test."], "ask": "How do we ask for permission politely? How do we say permission is not given?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["Can I", "Can you", "can't", "please"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "To ask for permission for yourself, we say ___ …?", "section": "Complete the rule", "reveal": "Can I", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "To politely ask someone else to do something, we say ___ …?", "section": "Complete the rule", "reveal": "Can you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We often add ___ to make a request more polite.", "section": "Complete the rule", "reveal": "please", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative, when permission is not given, is ___.", "section": "Complete the rule", "reveal": "can't / cannot", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use Can I…? to politely ask for permission for ourselves, and Can you…? to politely ask someone to do something for us. The short answers are Yes, you can / No, you can't.", "tr": "Can I…? kendimiz için nazikçe izin isterken kullanılır; Can you…? ise birinden bir şey yapmasını nazikçe rica ederken kullanılır. Kısa cevaplar Yes, you can / No, you can't şeklindedir.", "when_en": "We use this at school to ask a teacher for permission, or to ask a classmate for help politely.", "when": "Okulda öğretmenden izin isterken ya da bir sınıf arkadaşından nazikçe yardım rica ederken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["you want to go to the toilet"], "reveal": "Can I go to the toilet, please?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["you want a classmate to lend you a pen"], "reveal": "Can you lend me a pen, please?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you want to open the window"], "reveal": "Can I open the window, please?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["your teacher gives permission"], "reveal": "Yes, of course you can.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["permission is not given, phones in class"], "reveal": "You can't use your phone in class.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you want your friend to explain the homework"], "reveal": "Can you explain the homework to me, please?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write a short mini-dialogue (3-4 lines) where a student asks for permission at school and the teacher answers.", "chips": ["Student: Can I …", "Teacher: Yes, you can. / No, you can't because …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Can I go to the library, please?", "Can you help me, please?"], "negative": ["You can't leave the classroom during the test."], "question": ["Can I ask a question?", "Can you repeat that, please?"], "short": ["Yes, you can. / No, you can't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Can I to go to the library?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Can I go to the library?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Can I goes to the toilet?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Can I go to the toilet?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ I ask a question, please?", "section": "A · Choose the correct option.", "options": ["Can", "Do", "Am"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you help me with this exercise, please?", "section": "A · Choose the correct option.", "options": ["Do", "Can", "Are"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You ___ leave the classroom during the test.", "section": "A · Choose the correct option.", "options": ["can", "can't", "cans"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Ask permission to open the window.", "section": "B · Write the question.", "words": ["can", "I", "open", "the", "window,", "please"], "end": "?", "reveal": "Can I open the window, please?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "order", "q": "Politely ask a friend to lend you a pen.", "section": "B · Write the question.", "words": ["can", "you", "lend", "me", "a", "pen,", "please"], "end": "?", "reveal": "Can you lend me a pen, please?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "judge", "q": "Can I to go to the library, please?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Can I go to the library, please?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Student: ___ go to the counsellor's office, please?", "section": "Dialogue · Complete with can, can't, Can I or Can you.", "reveal": "Can I", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Teacher: Yes, of course you ___.", "section": "Dialogue · Complete with can, can't, Can I or Can you.", "reveal": "can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Student: ___ tell the headteacher I'm here?", "section": "Dialogue · Complete with can, can't, Can I or Can you.", "reveal": "Can you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Day at Our International School", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title and the photo. What do you think happens first at this school?", "Guess: what time do you think the school day starts?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Day at Our International School", "num": 1, "total": 5, "text": "My name is Mert and I'm a Year 10 student at an international school in İzmir. Our school day starts at 8:30, so I have to be punctual every morning. The caretaker, Mr Demir, opens the gate at 7:30, and by 8:25 the corridor is full of students.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day at Our International School", "num": 2, "total": 5, "text": "At 8:30, we go to the assembly. The headteacher, Ms Whitfield, talks about the news of the week and important events, like sports day or a national day celebration. After assembly, we go to our classrooms.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day at Our International School", "num": 3, "total": 5, "text": "We must wear a uniform, and we mustn't use our phones during lessons. If we have a problem, we can talk to the school counsellor, Mrs Aydoğan. She is very kind and always has time for students.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day at Our International School", "num": 4, "total": 5, "text": "At break time, we go to the canteen or the library. The librarian, Mr Costa, helps us find books for our projects. We have to hand in our homework before 4 pm, so I usually work in the library after lessons.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day at Our International School", "num": 5, "total": 5, "text": "I like my school because everyone is respectful, and there is always something interesting happening — a drama club, a football match, or a celebration for a national day!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["Mert's opinion about his teachers", "A typical school day at Mert's school", "How to become a headteacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What time does the caretaker open the gate?", "section": "While you read", "options": ["7:30", "8:25", "8:30"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 3, 'She' refers to…", "section": "While you read", "options": ["Ms Whitfield", "Mrs Aydoğan", "the librarian"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do students have to do before 4 pm?", "section": "While you read", "options": ["Go to assembly", "Hand in their homework", "Wear a uniform"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Students can use their phones during lessons at Mert's school.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students mustn't use their phones during lessons.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does Mert like his school?", "section": "While you read", "options": ["Because there are no rules", "Because it is close to his house", "Because people are respectful and there is always something interesting happening"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What do you have to do every morning before school? Write two sentences.", "Compare Mert's school with your own school. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Republic Day at School", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What date is Republic Day (Cumhuriyet Bayramı) in Türkiye?", "What do schools usually do to celebrate a national day? Guess two activities."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Republic Day at School", "num": 1, "total": 5, "text": "Every year on the 29th of October, our school celebrates Republic Day. It is one of the most important national days in Türkiye, so we must prepare for it carefully.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Republic Day at School", "num": 2, "total": 5, "text": "In the morning, all students and teachers join a special assembly. We sing the national anthem, and the headteacher gives a short speech about the history of the day.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Republic Day at School", "num": 3, "total": 5, "text": "After the assembly, there is a school parade in the yard. Some students carry flags, and the drama club performs a short play about the celebration. Everyone claps for the performers!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Republic Day at School", "num": 4, "total": 5, "text": "In the afternoon, we don't have normal lessons. Instead, classes prepare posters and presentations about the day. My class made a poster with photos and facts, and we have to present it to the other students.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Republic Day at School", "num": 5, "total": 5, "text": "At the end of the day, there is a small prize-giving ceremony for the best posters. It's a busy day, but it's also one of my favourite days at school.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is Republic Day?", "section": "While you read", "options": ["A school sports event", "An important national day in Türkiye", "A weekly assembly"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What happens first in the morning?", "section": "While you read", "options": ["A prize-giving ceremony", "A special assembly with the national anthem", "A poster presentation"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who performs a short play?", "section": "While you read", "options": ["The headteacher", "The drama club", "The caretaker"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In the afternoon, what do classes do instead of normal lessons?", "section": "While you read", "options": ["Go home early", "Prepare posters and presentations", "Have a football match"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "There is a prize-giving ceremony for the best posters at the end of the day.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does the writer probably feel about Republic Day at school?", "section": "While you read", "options": ["Bored", "Positive — it's one of their favourite days", "Nervous"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which national days or celebrations does your school celebrate? Make a short list.", "Design one activity your class could do for a national day celebration."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A New Student Learns the Rules", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a conversation between a new student and a school counsellor.", "Guess: what three questions might a new student ask about school rules?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A New Student Learns the Rules", "audio": null, "transcript": [{"speaker": "Counsellor", "line": "Welcome to our school, Aylin! I'm Mrs Aydoğan, the school counsellor. Do you have any questions about the rules?"}, {"speaker": "Aylin", "line": "Yes! Do we have to wear a uniform every day?"}, {"speaker": "Counsellor", "line": "Yes, you do. Students must wear the school uniform from Monday to Friday."}, {"speaker": "Aylin", "line": "OK. And can I use my phone during break time?"}, {"speaker": "Counsellor", "line": "You can, but you mustn't use it during lessons. And you must switch it off during exams."}, {"speaker": "Aylin", "line": "I understand. One more question — what time does the school day start?"}, {"speaker": "Counsellor", "line": "It starts at 8:30, so you have to be punctual. The caretaker opens the gate at 7:30."}, {"speaker": "Aylin", "line": "Thank you very much! Can I ask you questions again if I need to?"}, {"speaker": "Counsellor", "line": "Of course you can. My office is next to the library."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Who is Mrs Aydoğan?", "section": "While you listen", "options": ["The headteacher", "The school counsellor", "The librarian"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When do students have to wear the uniform?", "section": "While you listen", "options": ["Only on Mondays", "From Monday to Friday", "Only for assemblies"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Can students use their phones during break time?", "section": "While you listen", "options": ["Yes", "No", "Only on Fridays"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, n ask her today. We also have to write a short script for the play."}, {"speaker": "Elif", "line": "I can write the first part. You don't have to write it alone — let's do it together after school."}, {"speaker": "Deniz", "line": "Perfect. Let's meet in the library at 4 pm — we have to hand in our plan to the headteacher by Friday."}, {"speaker": "Elif", "line": "OK, see you there!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What event are Deniz and Elif planning for?", "section": "While you listen", "options": ["A sports day", "The Republic Day show", "A prize-giving ceremony"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who will carry the flag?", "section": "While you listen", "options": ["Deniz", "Elif", "Mert"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do they have to do by Friday?", "section": "While you listen", "options": ["Perform the play", "Hand in their plan to the headteacher", "Buy uniforms"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Elif has to write the whole script alone.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif doesn't have to write it alone — they will do it together.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Where will they meet?", "section": "While you listen", "options": ["The canteen", "The library", "The headteacher's office"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["If you planned a class performance, which job would you choose? Why?", "Write one sentence with 'have to' about preparing a school event."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Find Someone Who…", "text": "Walk around the class and ask your classmates questions with Can I…?, Do you have to…? and Must you…? to find someone who matches each sentence. Write their name next to the sentence.", "steps": ["Look at your worksheet: 6 sentences about school rules (e.g. '…wears a uniform every day').", "Stand up and ask a classmate a question to check if the sentence is true for them.", "If it's true, write their name. If not, ask another classmate.", "Try to find a different name for each sentence.", "Sit down and share two interesting answers with the class."], "chips": ["Do you have to wear a uniform?", "Can you use your phone at break time?", "Must you be punctual every day?", "Yes, I do. / No, I don't. / Yes, I can. / No, I can't."], "timer": 600, "levels": ["Destek Give students the question forms in writing before they start.", "Hedef 6 questions, mingling for about 10 minutes.", "İleri Fast finishers add one more true sentence about their own school rules and ask it too."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "May I Ask? — Permission Role-Play", "text": "With a partner, act out three short situations at school where one of you is a student asking for permission and the other is a teacher answering.", "steps": ["Read the three situation cards (going to the library, borrowing a pen, leaving the classroom).", "Decide who is Student A (asks for permission) and who is Teacher B (answers).", "Act out each situation using Can I…? or Can you…? and a polite answer.", "Swap roles and do it again with new situations.", "Perform your favourite situation for another pair."], "chips": ["Can I …, please?", "Yes, of course you can.", "I'm sorry, you can't … because …", "Can you help me with …, please?"], "timer": 600, "levels": ["Destek Provide sentence starters on cards for lower-level students.", "Hedef 3 role-play situations per pair.", "İleri Students invent one extra situation of their own to role-play."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My School Rules Poster", "text": "Write the text for a poster titled 'Our Class Rules' for new students at your school. Include at least two rules with must/have to and two with mustn't/don't have to.", "steps": ["Choose a title for your poster.", "List 4-5 rules using must, have to, mustn't and don't have to.", "Add one sentence explaining why the rules are important.", "Check your grammar and punctuation."], "chips": ["punctual", "respectful", "corridor", "uniform", "hand in", "responsibility", "Students must…", "You mustn't…", "We have to…", "You don't have to…"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Scene for Our School Life Play", "text": "Write a short scene (a dialogue with 6-8 lines) for the class performance assignment: 'School Life' drama play. Include two characters (for example, a new student and a headteacher, or a student and a counsellor) and use at least two of this theme's grammar points.", "steps": ["Choose your two characters and where the scene happens (e.g. the headteacher's office, the corridor).", "Decide what the problem or question in the scene is (e.g. asking for permission, explaining a rule).", "Write 6-8 lines of dialogue.", "Read it aloud with a partner and time it — it should take about 30 seconds."], "chips": ["headteacher", "counsellor", "caretaker", "assembly", "responsibility", "Can I…, please?", "You must…", "You mustn't…", "Do I have to…?"], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'punctual'", "section": "Exit ticket", "options": ["late", "arriving on time", "friendly"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'hand in' mean?", "section": "Exit ticket", "options": ["to give something to a teacher, e.g. homework", "to raise your hand", "to shake hands"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Our school day ___ at 8:30.", "section": "Exit ticket", "options": ["start", "starts", "starting"], "answer": 1, "note": "Give 10 seconds to think. Students show 1,
