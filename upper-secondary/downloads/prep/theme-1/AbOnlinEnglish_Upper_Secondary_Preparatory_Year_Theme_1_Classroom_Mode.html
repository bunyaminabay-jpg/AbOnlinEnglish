<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sınıf Modu · Theme 1 School Life</title><meta name="robots" content="noindex"></head><body><div class="pres" data-present><div class="pbar"><a class="pbrand" href="#"><span class="b1">Ab</span><span class="b2">Onlin</span><span class="b3">English</span></a><div class="pdecks"><button type="button" class="pdeck" style="--c:#7447D1" aria-current="false">Açılış</button><button type="button" class="pdeck" style="--c:#D9602A" aria-current="false">Kelimeler</button><button type="button" class="pdeck" style="--c:#2766D6" aria-current="false">Gramer</button><button type="button" class="pdeck" style="--c:#0B8A80" aria-current="false">Okuma</button><button type="button" class="pdeck" style="--c:#C23676" aria-current="false">Dinleme</button><button type="button" class="pdeck" style="--c:#23835A" aria-current="false">Konuşma &amp; Yazma</button><button type="button" class="pdeck" style="--c:#B57A0C" aria-current="false">Çıkış kartı</button></div><div class="ptools"><button type="button" class="ptool" data-tool="timer"><span class="tl">Süre</span> <kbd>T</kbd></button><button type="button" class="ptool" data-tool="pick"><span class="tl">Öğrenci seç</span> <kbd>P</kbd></button><button type="button" class="ptool" data-tool="score"><span class="tl">Puan</span> <kbd>S</kbd></button><button type="button" class="ptool" data-tool="notes"><span class="tl">Not</span> <kbd>N</kbd></button><button type="button" class="ptool" data-tool="full"><span class="tl">Tam ekran</span> <kbd>F</kbd></button></div></div><div class="pstage"></div><div class="pfoot"><button type="button" class="pnav pprev" aria-label="Önceki">‹</button><div class="pmid"><div class="pprog"><span></span></div><span class="pcount"></span></div><button type="button" class="preveal" hidden>Cevabı göster (R)</button><button type="button" class="pnav pnext" aria-label="Sonraki">Sonraki ›</button></div><div class="ptimer" hidden><div class="row1"><button type="button" class="ptgo">▶</button><span class="ptime">0:00</span><button type="button" class="ptclose">✕</button></div><div class="presets"><button type="button" data-t="30">30s</button><button type="button" data-t="60">60s</button><button type="button" data-t="120">120s</button><button type="button" data-t="300">300s</button></div></div><div class="ppick" hidden><div class="card"><div class="pnum">–</div><label>Sınıf mevcudu <input id="p-size" type="number" min="2" max="60" value="30"></label><div class="row2"><button type="button" class="pgo">Seç</button><button type="button" class="ppclose">Kapat</button></div><span class="pused"></span></div></div><div class="pscore" hidden><div class="team"><b>Takım A</b><button type="button" data-sc="0,-1">−</button><span class="pts">0</span><button type="button" data-sc="0,1">+</button></div><div class="team"><b>Takım B</b><button type="button" data-sc="1,-1">−</button><span class="pts">0</span><button type="button" data-sc="1,1">+</button></div><button type="button" class="psreset">Sıfırla</button></div><div class="pnotes" hidden><b>Öğretmen notu</b><div class="pnotes-body"></div></div></div><script type="application/json" id="present-data">{"decks": [{"id": "open", "title": "Açılış", "color": "#7447D1", "screens": [{"type": "title", "kicker": "Theme 1 · A2", "title": "School Life", "list": ["School rules, events, and activities at school", "People, roles and responsibilities at school", "National days and celebrations"], "note": "Welcome the class. Read the topics aloud. / Sınıfı karşılayın, konuları sesli okuyun."}, {"type": "prompt", "title": "Warm-up", "text": "Look at the title: School Life. What do you think we will talk about in this theme? Tell your partner two ideas.", "timer": 60, "note": "Pair talk, 1 minute. Collect 3–4 ideas on the board. No Turkish, no translation. / 1 dk ikili konuşma; 3–4 fikri tahtaya yazın."}, {"type": "list", "title": "By the end of this theme…", "list": ["I can talk about the rules of my school.", "I can describe the people who work at my school and what they do.", "I can talk about school events and national days.", "I can ask and answer simple questions about school life."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["14 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "rule", "pos": "noun", "ipa": "/ruːl/", "tr": "kural", "example": "Every school has rules that students must follow.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "uniform", "pos": "noun", "ipa": "/ˈjuːnɪfɔːm/", "tr": "okul kıyafeti", "example": "Students wear a uniform on weekdays.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "principal", "pos": "noun", "ipa": "/ˈprɪnsəpəl/", "tr": "okul müdürü", "example": "The principal welcomes new students every September.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "janitor", "pos": "noun", "ipa": "/ˈdʒænɪtər/", "tr": "hizmetli", "example": "The janitor cleans the classrooms every evening.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "counsellor", "pos": "noun", "ipa": "/ˈkaʊnsələr/", "tr": "rehber öğretmen", "example": "Students can talk to the counsellor about their problems.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "responsibility", "pos": "noun", "ipa": "/rɪˌspɒnsəˈbɪləti/", "tr": "sorumluluk", "example": "Cleaning the board is my responsibility this week.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "behave", "pos": "verb", "ipa": "/bɪˈheɪv/", "tr": "davranmak", "example": "Students must behave well during the ceremony.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "punishment", "pos": "noun", "ipa": "/ˈpʌnɪʃmənt/", "tr": "ceza", "example": "Being late three times can lead to punishment.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "permission", "pos": "noun", "ipa": "/pərˈmɪʃən/", "tr": "izin", "example": "You need permission to leave the classroom.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "ceremony", "pos": "noun", "ipa": "/ˈserəmoʊni/", "tr": "tören", "example": "Our school holds a ceremony every 23rd of April.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "flag", "pos": "noun", "ipa": "/flæg/", "tr": "bayrak", "example": "Students raise the flag every Monday morning.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "national day", "pos": "noun", "ipa": "/ˈnæʃənəl deɪ/", "tr": "milli bayram", "example": "23rd of April is an important national day in Türkiye.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "attend", "pos": "verb", "ipa": "/əˈtend/", "tr": "katılmak/devam etmek", "example": "All students must attend the ceremony.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "canteen", "pos": "noun", "ipa": "/kænˈtiːn/", "tr": "kantin", "example": "We buy snacks from the canteen at break time.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kantin”", "options": ["flag", "janitor", "canteen"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“bayrak”", "options": ["punishment", "flag", "principal"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kural”", "options": ["principal", "janitor", "rule"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“katılmak/devam etmek”", "options": ["rule", "attend", "uniform"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“davranmak”", "options": ["attend", "flag", "behave"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sorumluluk”", "options": ["uniform", "ceremony", "responsibility"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Must / Mustn't — School Rules", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Students <mark>must wear<\/mark> a uniform.", "You <mark>mustn't run<\/mark> in the corridors.", "We <mark>must be<\/mark> quiet in the library."], "ask": "Which sentences show something is necessary? Which show something is forbidden?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'must' for rules that are necessary, and 'mustn't' for things that are forbidden.", "tr": "'Must' zorunluluk, 'mustn't' ise yasak bildirmek için kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["Students must wear a uniform."], "negative": ["Students mustn't use phones in class."], "question": ["Must we bring a pen?"], "short": ["Yes, you must. / No, you mustn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Students must to wear a uniform.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students must wear a uniform.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "You ___ (must/mustn't) run in the corridors.", "section": "", "reveal": "mustn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ (must/mustn't) be on time for class.", "section": "", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence is correct?", "section": "", "options": ["You must to listen.", "You must listen.", "You musts listen.", "You musting listen."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a rule: it is forbidden to shout in the library.", "section": "", "reveal": "You mustn't shout in the library.", "prompt": "Use mustn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Day at Balıkesir Lisesi", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What time does your school start?", "What rules does your school have about uniforms?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Day at Balıkesir Lisesi", "num": 1, "total": 3, "text": "Balıkesir Lisesi opens its gates at half past seven every morning. Students must arrive before eight o'clock, because the first lesson starts exactly at eight. At the gate, a teacher checks that everyone is wearing the correct uniform.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day at Balıkesir Lisesi", "num": 2, "total": 3, "text": "The principal, Mrs. Aydın, welcomes new students on their first day and explains the most important rules: students mustn't use their phones during lessons, and they must ask for permission before leaving the classroom.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day at Balıkesir Lisesi", "num": 3, "total": 3, "text": "Every Monday, the whole school gathers in the yard for a short ceremony. Students raise the flag and listen to the national anthem. On special national days, like the 23rd of April, the ceremony is longer and every class prepares a small performance.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What time does the first lesson start?", "section": "While you read", "options": ["Half past seven", "Eight o'clock", "Half past eight", "Nine o'clock"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Students can use their phones during lessons.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students mustn't use their phones during lessons.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Students must ___ permission before leaving the classroom.", "section": "While you read", "reveal": "ask for", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "When is the ceremony longer?", "section": "While you read", "options": ["Every morning", "On Fridays", "On special national days", "At lunchtime"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Compare the rules in the text with your own school's rules."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "The New Counsellor Introduces Herself", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What does a school counsellor do?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "The New Counsellor Introduces Herself", "audio": null, "transcript": [{"speaker": "Counsellor", "line": "Good morning, everyone! My name is Ms. Kaya, and I'm the new school counsellor."}, {"speaker": "Counsellor", "line": "My office is next to the canteen, on the ground floor."}, {"speaker": "Counsellor", "line": "If you have a problem, you can come and talk to me. You must knock on the door and wait for permission to come in."}, {"speaker": "Student", "line": "Can we come during lessons?"}, {"speaker": "Counsellor", "line": "No, you mustn't come during lessons. Please come at break time or after school."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Who is speaking?", "section": "While you listen", "options": ["A student", "The counsellor", "The janitor", "The principal"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Students must knock and wait for ___.", "section": "While you listen", "reveal": "permission", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The counsellor's office is next to the canteen.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Our School Rules", "text": "In pairs, list three rules from your own school and explain why each rule is important.", "steps": ["Write down three real rules from your school.", "Take turns explaining each rule to your partner.", "Say whether you agree with the rule and why."], "chips": ["In our school, students must...", "Students mustn't...", "This rule is important because...", "I think this rule is fair/unfair because..."], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My School", "text": "Write a short paragraph about your school: its rules, the people who work there, and one national day celebration you remember.", "steps": ["Name your school and say what time it starts.", "Describe two rules using must/mustn't.", "Describe one person who works at your school and their role.", "Describe one national day ceremony at your school."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'okul müdürü'?", "section": "Exit ticket", "options": ["janitor", "principal", "counsellor", "canteen"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You ___ (mustn't) shout in the library.", "section": "Exit ticket", "reveal": "mustn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Who cleans the classrooms?", "section": "Exit ticket", "options": ["The principal", "The janitor", "The counsellor", "The teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'Ceremony' means a formal event, like raising the flag.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Every Monday students ___ (raise) the flag.", "section": "Exit ticket", "reveal": "raise", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Where can students buy snacks?", "section": "Exit ticket", "options": ["The library", "The canteen", "The office", "The gym"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which is correct?", "section": "Exit ticket", "options": ["You must to wear a uniform.", "You must wear a uniform.", "You musts wear a uniform.", "You must wearing a uniform."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You need ___ before you leave the classroom.", "section": "Exit ticket", "reveal": "permission", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Lise Hazırlık · Theme 1 · School Life", "key": "prep-1"}</script></body></html>
