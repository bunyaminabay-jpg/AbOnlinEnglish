onraki">Sonraki ›</button></div><div class="ptimer" hidden><div class="row1"><button type="button" class="ptgo">▶</button><span class="ptime">0:00</span><button type="button" class="ptclose">✕</button></div><div class="presets"><button type="button" data-t="30">30s</button><button type="button" data-t="60">60s</button><button type="button" data-t="120">120s</button><button type="button" data-t="300">300s</button></div></div><div class="ppick" hidden><div class="card"><div class="pnum">–</div><label>Sınıf mevcudu <input id="p-size" type="number" min="2" max="60" value="30"></label><div class="row2"><button type="button" class="pgo">Seç</button><button type="button" class="ppclose">Kapat</button></div><span class="pused"></span></div></div><div class="pscore" hidden><div class="team"><b>Takım A</b><button type="button" data-sc="0,-1">−</button><span class="pts">0</span><button type="button" data-sc="0,1">+</button></div><div class="team"><b>Takım B</b><button type="button" data-sc="1,-1">−</button><span class="pts">0</span><button type="button" data-sc="1,1">+</button></div><button type="button" class="psreset">Sıfırla</button></div><div class="pnotes" hidden><b>Öğretmen notu</b><div class="pnotes-body"></div></div></div><script type="application/json" id="present-data">{"decks": [{"id": "open", "title": "Açılış", "color": "#7447D1", "screens": [{"type": "title", "kicker": "Theme 6 · A2", "title": "Life in the World", "list": ["Continents, countries and nationalities", "Shopping for personal food preference", "Food and food culture from different parts of the world"], "note": "Welcome the class. Read the topics aloud. / Sınıfı karşılayın, konuları sesli okuyun."}, {"type": "prompt", "title": "Warm-up", "text": "Look at the title: Life in the World. What do you think we will talk about in this theme? Tell your partner two ideas.", "timer": 60, "note": "Pair talk, 1 minute. Collect 3–4 ideas on the board. No Turkish, no translation. / 1 dk ikili konuşma; 3–4 fikri tahtaya yazın."}, {"type": "list", "title": "By the end of this theme…", "list": ["I can talk about countries and nationalities.", "I can describe food from different cultures.", "I can talk about shopping for food.", "I can compare food habits in different countries."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["12 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "continent", "pos": "noun", "ipa": "/ˈkɒntɪnənt/", "tr": "kıta", "example": "Africa is the second largest continent.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "nationality", "pos": "noun", "ipa": "/ˌnæʃəˈnæləti/", "tr": "milliyet", "example": "What is your nationality?", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "cuisine", "pos": "noun", "ipa": "/kwɪˈziːn/", "tr": "mutfak (yemek kültürü)", "example": "Italian cuisine is famous for pasta.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "ingredient", "pos": "noun", "ipa": "/ɪnˈgriːdiənt/", "tr": "malzeme", "example": "Olive oil is a key ingredient in Turkish cooking.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "spicy", "pos": "adjective", "ipa": "/ˈspaɪsi/", "tr": "baharatlı", "example": "This curry is very spicy.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "grocery store", "pos": "noun", "ipa": "/ˈgroʊsəri stɔːr/", "tr": "market", "example": "I buy vegetables at the grocery store.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "market stall", "pos": "noun", "ipa": "/ˈmɑːrkɪt stɔːl/", "tr": "pazar tezgahı", "example": "We bought fresh fruit from a market stall.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "portion", "pos": "noun", "ipa": "/ˈpɔːrʃən/", "tr": "porsiyon", "example": "The portion size was quite large.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "staple food", "pos": "noun", "ipa": "/ˈsteɪpəl fuːd/", "tr": "temel besin", "example": "Rice is a staple food in many Asian countries.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "traditional", "pos": "adjective", "ipa": "/trəˈdɪʃənəl/", "tr": "geleneksel", "example": "Baklava is a traditional Turkish dessert.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "fusion", "pos": "adjective", "ipa": "/ˈfjuːʒən/", "tr": "karma (mutfak)", "example": "The restaurant serves fusion food.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "leftovers", "pos": "noun", "ipa": "/ˈleftoʊvərz/", "tr": "artık yemek", "example": "We had leftovers for lunch the next day.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“pazar tezgahı”", "options": ["cuisine", "market stall", "leftovers"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“market”", "options": ["continent", "traditional", "grocery store"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“mutfak (yemek kültürü)”", "options": ["staple food", "portion", "cuisine"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“malzeme”", "options": ["spicy", "ingredient", "cuisine"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“temel besin”", "options": ["fusion", "grocery store", "staple food"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“karma (mutfak)”", "options": ["portion", "nationality", "fusion"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Countable/Uncountable Nouns & Some/Any", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I bought <mark>some<\/mark> rice and <mark>some<\/mark> apples.", "We don't have <mark>any<\/mark> spicy sauce.", "Is there <mark>any<\/mark> bread left?"], "ask": "When do we use 'some' and when do we use 'any'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'some' in positive sentences and 'any' in negative sentences and questions, with both countable and uncountable nouns.", "tr": "'Some' olumlu cümlelerde, 'any' ise olumsuz cümlelerde ve sorularda kullanılır; hem sayılabilir hem sayılamayan isimlerle kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["There is some rice in the cupboard."], "negative": ["There isn't any milk left."], "question": ["Is there any cheese?"], "short": ["Yes, there is some. / No, there isn't any."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We don't have some bread.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We don't have any bread.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "We have ___ (some/any) fresh vegetables today.", "section": "", "reveal": "some", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Is there ___ (some/any) spicy food on the menu?", "section": "", "reveal": "any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["I don't have some money.", "I don't have any money.", "I have any money.", "I not have any money."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite: there is no rice in the kitchen.", "section": "", "reveal": "There isn't any rice in the kitchen.", "prompt": "Use isn't any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Food Around the World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What is your favourite traditional dish?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Food Around the World", "num": 1, "total": 3, "text": "Every continent has its own delicious cuisine. In Asia, rice is a staple food, and many dishes use spicy ingredients like chilli and ginger. In Europe, bread and cheese are common on the table.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Food Around the World", "num": 2, "total": 3, "text": "In Türkiye, traditional cuisine includes dishes with olive oil, yoghurt, and fresh vegetables from market stalls. Many families shop at a local grocery store or an open-air market for fresh ingredients rather than buying everything at a supermarket.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Food Around the World", "num": 3, "total": 3, "text": "Nowadays, there isn't always a clear line between cuisines — many restaurants serve fusion food, mixing ingredients and cooking styles from different nationalities and continents.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is a staple food in Asia?", "section": "While you read", "options": ["Bread", "Cheese", "Rice", "Olive oil"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Turkish cuisine uses a lot of ___ oil.", "section": "While you read", "reveal": "olive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Fusion food mixes ingredients from different cuisines.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What ingredients are common in your family's cooking?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Shopping at the Market", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Do you prefer shopping at a market or a supermarket?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Shopping at the Market", "audio": null, "transcript": [{"speaker": "Customer", "line": "Good morning! Do you have any fresh vegetables today?"}, {"speaker": "Seller", "line": "Yes, we have some lovely peppers and cucumbers. But I'm sorry, there isn't any tomatoes left today."}, {"speaker": "Customer", "line": "That's fine, I'll take some peppers then."}, {"speaker": "Seller", "line": "Great choice — they're perfect for a traditional salad."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does the customer want to buy?", "section": "While you listen", "options": ["Meat", "Fresh vegetables", "Bread", "Spices"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The seller says there isn't ___ tomatoes left today.", "section": "While you listen", "reveal": "any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "A Food Quiz", "text": "Ask your partner about a traditional dish from another country: its ingredients, whether it is spicy, and which continent it is from.", "steps": ["Choose a traditional dish from another country.", "Ask your partner three questions about it.", "Compare the dish to a Turkish dish."], "chips": ["What ingredients are in...?", "Is it spicy?", "It's from the continent of...", "The main ingredient is..."], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Traditional Dish", "text": "Write a paragraph describing a traditional dish from Türkiye or another country, its ingredients, and where you can buy them.", "steps": ["Name the dish and where it is from.", "List some of its main ingredients using some/any.", "Say where you can buy the ingredients."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "'Baharatlı' means ___.", "section": "Exit ticket", "options": ["spicy", "traditional", "staple", "fresh"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We have ___ (some) fresh bread today.", "section": "Exit ticket", "reveal": "some", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Where do many Turkish families buy fresh ingredients?", "section": "Exit ticket", "options": ["Only supermarkets", "Market stalls", "Restaurants", "Online only"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'Cuisine' means a style of cooking.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "There isn't ___ (any) milk left in the fridge.", "section": "Exit ticket", "reveal": "any", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What did the seller not have in the listening?", "section": "Exit ticket", "options": ["Peppers", "Cucumbers", "Tomatoes", "Onions"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Malzeme' means ___.", "section": "Exit ticket", "options": ["ingredient", "portion", "cuisine", "leftovers"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Rice is a ___ food in many Asian countries.", "section": "Exit ticket", "reveal": "staple", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Lise Hazırlık · Theme 6 · Life in the World", "key": "prep-6"}</script></body></html>
