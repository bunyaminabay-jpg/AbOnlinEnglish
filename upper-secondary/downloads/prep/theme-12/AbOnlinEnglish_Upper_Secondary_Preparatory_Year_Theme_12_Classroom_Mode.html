": "By the end of this theme…", "list": ["I can talk about my family's hopes for the future.", "I can talk about my own dreams and ambitions.", "I can ask about someone's future plans.", "I can give reasons for a career or life goal."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["12 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "aspiration", "pos": "noun", "ipa": "/ˌæspəˈreɪʃən/", "tr": "özlem/hedef", "example": "Her aspiration is to become a doctor.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "ambition", "pos": "noun", "ipa": "/æmˈbɪʃən/", "tr": "hırs/tutku", "example": "His ambition is to open his own business.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "determined", "pos": "adjective", "ipa": "/dɪˈtɜːrmɪnd/", "tr": "kararlı", "example": "She is determined to become an engineer.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "goal", "pos": "noun", "ipa": "/goʊl/", "tr": "hedef", "example": "My goal is to study abroad one day.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "inherit", "pos": "verb", "ipa": "/ɪnˈherɪt/", "tr": "miras kalmak/devralmak", "example": "He will inherit the family business one day.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "career path", "pos": "noun", "ipa": "/kəˈrɪər pæθ/", "tr": "kariyer yolu", "example": "She chose a career path in medicine.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "role model", "pos": "noun", "ipa": "/roʊl ˈmɒdəl/", "tr": "rol model", "example": "My older sister is my role model.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "encourage", "pos": "verb", "ipa": "/ɪnˈkɜːrɪdʒ/", "tr": "cesaretlendirmek", "example": "My parents encourage me to follow my dreams.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "independent", "pos": "adjective", "ipa": "/ˌɪndɪˈpendənt/", "tr": "bağımsız", "example": "She wants to be financially independent.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "generation", "pos": "noun", "ipa": "/ˌdʒenəˈreɪʃən/", "tr": "nesil", "example": "Every generation has different dreams.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "legacy", "pos": "noun", "ipa": "/ˈlegəsi/", "tr": "miras (soyut)", "example": "He wants to leave a positive legacy for his children.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "would like to", "pos": "phrase", "ipa": "/wʊd laɪk tuː/", "tr": "isterdim", "example": "I would like to become a scientist.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“nesil”", "options": ["encourage", "generation", "determined"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“miras (soyut)”", "options": ["encourage", "role model", "legacy"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“hırs/tutku”", "options": ["career path", "ambition", "aspiration"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“rol model”", "options": ["aspiration", "role model", "legacy"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“isterdim”", "options": ["generation", "encourage", "would like to"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“özlem/hedef”", "options": ["career path", "determined", "aspiration"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Would like to / Going to — Future Hopes and Plans", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I <mark>would like to<\/mark> become a doctor.", "My sister <mark>is going to<\/mark> study medicine next year.", "My parents <mark>would like<\/mark> me to be independent."], "ask": "What is the difference between 'would like to' and 'going to'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'would like to' for wishes and hopes, and 'going to' for decided future plans.", "tr": "Dilek ve umutlar için 'would like to', kesinleşmiş gelecek planları için 'going to' kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["I would like to travel the world."], "negative": ["She wouldn't like to leave her hometown."], "question": ["What would you like to become?"], "short": []}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I would like become a teacher.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I would like to become a teacher.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "My brother ___ (would like) to become an engineer.", "section": "", "reveal": "would like", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She ___ (going to) start university next year. (plan)", "section": "", "reveal": "is going to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["I would like become a pilot.", "I would like to become a pilot.", "I like would to become a pilot.", "I would to like become a pilot."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite: my parents hope I become independent.", "section": "", "reveal": "My parents would like me to become independent.", "prompt": "Use would like", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Different Dreams, One Family", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What does your family hope you will become in the future?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Different Dreams, One Family", "num": 1, "total": 3, "text": "In the Yıldız family, every member has a different dream for the future. The father, a shopkeeper, would like his son to inherit the family business one day, but his son has other plans.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Different Dreams, One Family", "num": 2, "total": 3, "text": "\"I'm going to study computer engineering,\" says Emre, the son. \"My father is a great role model, but my career path is different from his. My parents encourage me to follow my own ambition, even if it's not the family business.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Different Dreams, One Family", "num": 3, "total": 3, "text": "Emre's younger sister, Ela, would like to become a doctor. She is determined to help people in her community. Their parents say that whatever path their children choose, they simply hope the next generation will be happy and independent.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What does Emre plan to study?", "section": "While you read", "options": ["Medicine", "Computer engineering", "Business", "Law"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Ela is determined to become a ___.", "section": "While you read", "reveal": "doctor", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The father insists his son must inherit the business.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Emre has other plans, and the family supports him.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What career path would you like to follow, and why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Talking About Future Plans", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What would you like to become in the future?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Talking About Future Plans", "audio": null, "transcript": [{"speaker": "A", "line": "What would you like to become in the future?"}, {"speaker": "B", "line": "I would like to become a journalist. My sister wants to be a pilot, actually."}, {"speaker": "A", "line": "That's exciting! Do your parents support your ambitions?"}, {"speaker": "B", "line": "Yes, they always encourage me to follow my dreams, even though it's a difficult career path."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does the speaker's sister want to become?", "section": "While you listen", "options": ["A doctor", "A teacher", "A pilot", "An engineer"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The speaker's parents ___ (encourage) her to follow her dreams.", "section": "While you listen", "reveal": "encourage", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Family Dreams Interview", "text": "Interview your partner about their family's hopes and their own ambitions for the future.", "steps": ["Ask your partner about their own ambition.", "Ask what their family hopes for them.", "Ask if the two are the same or different."], "chips": ["What would you like to become?", "My family would like me to...", "I'm determined to...", "My role model is..."], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Family's Hopes and My Dreams", "text": "Write a paragraph about your own ambitions and what your family hopes for your future, using would like to and going to.", "steps": ["Describe your own ambition using would like to.", "Describe a plan you have already decided using going to.", "Mention your family's hopes and whether they match yours."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "'Hırs/tutku' means ___.", "section": "Exit ticket", "options": ["ambition", "legacy", "generation", "role model"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I ___ (would like) to become a scientist.", "section": "Exit ticket", "reveal": "would like", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does Emre want to study?", "section": "Exit ticket", "options": ["Business", "Computer engineering", "Medicine", "Law"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'Determined' means having a strong intention to do something.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "She ___ (going to) start medical school next year.", "section": "Exit ticket", "reveal": "is going to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the speaker's sister want to become in the listening?", "section": "Exit ticket", "options": ["A doctor", "A pilot", "A teacher", "A journalist"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Rol model' means ___.", "section": "Exit ticket", "options": ["role model", "legacy", "generation", "aspiration"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My parents always ___ me to follow my dreams.", "section": "Exit ticket", "reveal": "encourage", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Lise Hazırlık · Theme 12 · Family Life and the Future", "key": "prep-12"}</script></body></html>
