3–4 fikri tahtaya yazın."}, {"type": "list", "title": "By the end of this theme…", "list": ["I can talk about natural resources.", "I can describe animal habitats and threats to them.", "I can talk about ways to protect the environment.", "I can make conditional sentences about environmental problems."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["12 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "natural resource", "pos": "noun", "ipa": "/ˈnætʃərəl rɪˈsɔːrs/", "tr": "doğal kaynak", "example": "Water is one of our most important natural resources.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "habitat", "pos": "noun", "ipa": "/ˈhæbɪtæt/", "tr": "yaşam alanı/habitat", "example": "Deforestation destroys animal habitats.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "endangered", "pos": "adjective", "ipa": "/ɪnˈdeɪndʒərd/", "tr": "tehlike altında", "example": "The tiger is an endangered species.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "deforestation", "pos": "noun", "ipa": "/diːˌfɒrɪˈsteɪʃən/", "tr": "ormansızlaşma", "example": "Deforestation is a major cause of climate change.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "extinct", "pos": "adjective", "ipa": "/ɪkˈstɪŋkt/", "tr": "nesli tükenmiş", "example": "Dinosaurs have been extinct for millions of years.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "conservation", "pos": "noun", "ipa": "/ˌkɒnsərˈveɪʃən/", "tr": "koruma", "example": "The organisation works on wildlife conservation.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "pollution", "pos": "noun", "ipa": "/pəˈluːʃən/", "tr": "kirlilik", "example": "Ocean pollution harms marine animals.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "climate change", "pos": "noun", "ipa": "/ˈklaɪmət tʃeɪndʒ/", "tr": "iklim değişikliği", "example": "Climate change is affecting animal migration.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "sustainable", "pos": "adjective", "ipa": "/səˈsteɪnəbəl/", "tr": "sürdürülebilir", "example": "We need more sustainable energy sources.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "reduce", "pos": "verb", "ipa": "/rɪˈdjuːs/", "tr": "azaltmak", "example": "We should reduce plastic waste.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "wildlife", "pos": "noun", "ipa": "/ˈwaɪldlaɪf/", "tr": "yaban hayatı", "example": "The national park protects local wildlife.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "renewable", "pos": "adjective", "ipa": "/rɪˈnjuːəbəl/", "tr": "yenilenebilir", "example": "Solar power is a renewable energy source.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“nesli tükenmiş”", "options": ["natural resource", "conservation", "extinct"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“yenilenebilir”", "options": ["renewable", "pollution", "natural resource"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“iklim değişikliği”", "options": ["reduce", "renewable", "climate change"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kirlilik”", "options": ["climate change", "pollution", "conservation"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“koruma”", "options": ["natural resource", "climate change", "conservation"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“azaltmak”", "options": ["habitat", "reduce", "wildlife"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "First Conditional — Environmental Consequences", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["If we <mark>don't protect<\/mark> the forests, animals <mark>will lose<\/mark> their habitats.", "If people <mark>recycle<\/mark> more, we <mark>will reduce<\/mark> pollution.", "The species <mark>will become<\/mark> extinct if we don't act now."], "ask": "What pattern do you notice in the if-clause and the result clause?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use the first conditional (if + present simple, will + base verb) to talk about likely future results of an action.", "tr": "Bir eylemin olası gelecekteki sonucunu anlatmak için birinci koşul cümlesi (if + geniş zaman, will + fiil) kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["If we recycle, we will reduce waste."], "negative": ["If we don't act, species will disappear."], "question": ["What will happen if pollution increases?"], "short": []}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If we will recycle, we reduce waste.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If we recycle, we will reduce waste.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "If we don't stop deforestation, animals ___ (lose) their habitats.", "section": "", "reveal": "will lose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If people ___ (use) renewable energy, pollution will decrease.", "section": "", "reveal": "use", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["If it rains, we will cancel the trip.", "If it will rain, we cancel the trip.", "If it rains, we cancelling the trip.", "If it will rains, we will cancel."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite: people don't recycle, so pollution will increase (as a conditional).", "section": "", "reveal": "If people don't recycle, pollution will increase.", "prompt": "Use first conditional", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Protecting Our Planet's Animals", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you know any endangered animals?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Protecting Our Planet's Animals", "num": 1, "total": 3, "text": "Many animals around the world are now endangered because of deforestation, pollution, and climate change. If we don't protect natural habitats, more species will become extinct in the coming decades.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Protecting Our Planet's Animals", "num": 2, "total": 3, "text": "Conservation organisations are working hard to help. They plant trees to restore forests, clean up polluted rivers, and protect wildlife reserves. If more countries switch to renewable and sustainable energy, scientists believe we will slow down climate change significantly.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Protecting Our Planet's Animals", "num": 3, "total": 3, "text": "Small actions matter too. If every family reduces plastic waste and recycles more, together we will make a real difference for future generations of both people and animals.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What three causes of endangerment are mentioned?", "section": "While you read", "options": ["War, farming, tourism", "Deforestation, pollution, climate change", "Hunting, fishing, mining", "Noise, traffic, construction"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Conservation organisations plant trees to restore ___.", "section": "While you read", "reveal": "forests", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The text says small actions don't matter.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says small actions matter too.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What is one action you could take to help protect wildlife?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A School Eco-Club Meeting", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What could a school eco-club do to help the environment?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A School Eco-Club Meeting", "audio": null, "transcript": [{"speaker": "Leader", "line": "This month, our eco-club will plant fifty trees near the river."}, {"speaker": "Student", "line": "Will that really help the environment?"}, {"speaker": "Leader", "line": "Yes! If we plant enough trees, the local habitat will improve for birds and insects."}, {"speaker": "Student", "line": "That's great — I'll bring my friends to help too."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What will the eco-club do this month?", "section": "While you listen", "options": ["Plant trees", "Clean the river", "Visit a zoo", "Write a report"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If they plant enough trees, the local habitat ___ (improve).", "section": "While you listen", "reveal": "will improve", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "If We Don't Act...", "text": "Discuss three environmental problems using first conditional sentences (cause and consequence).", "steps": ["Choose three environmental problems.", "Make a first conditional sentence for each.", "Suggest one solution for each problem."], "chips": ["If we don't..., ...will...", "If people..., we will...", "One solution is..."], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Protecting Wildlife", "text": "Write a paragraph about an endangered animal and what will happen if we don't protect it, using first conditional sentences.", "steps": ["Name an endangered animal and its habitat.", "Explain the threat using if + present simple.", "Describe the consequence using will.", "Suggest one solution."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."
