ype": "question", "qtype": "judge", "section": "Error detective", "q": "We going to try VR next week.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We are going to try VR next week.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "I think classrooms ___ (will) use more robots in ten years.", "section": "", "reveal": "will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ (going to) upload our projects tomorrow. (plan)", "section": "", "reveal": "are going to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["I will to study tonight.", "I will study tonight.", "I going study tonight.", "I am will study tonight."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a prediction: robots probably teach some lessons in the future.", "section": "", "reveal": "Robots will probably teach some lessons in the future.", "prompt": "Use will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Classroom of Tomorrow", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What technology would you like to have in your classroom?"], "timer": 90, "note": "Pairs predict; wri
