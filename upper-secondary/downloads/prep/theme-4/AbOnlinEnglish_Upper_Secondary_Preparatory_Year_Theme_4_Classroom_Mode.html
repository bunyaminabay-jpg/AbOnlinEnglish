res.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "household chore", "pos": "noun", "ipa": "/ˈhaʊshoʊld tʃɔːr/", "tr": "ev işi", "example": "Everyone shares the household chores at home.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "get along with", "pos": "phrasal verb", "ipa": "/get əˈlɒŋ wɪð/", "tr": "iyi geçinmek", "example": "I get along well with my older sister.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "argue", "pos": "verb", "ipa": "/ˈɑːrgjuː/", "tr": "tartışmak", "example": "My brothers sometimes argue about the TV remote.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "support", "pos": "verb", "ipa": "/səˈpɔːrt/", "tr": "desteklemek", "example": "My parents always support my decisions.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "spend time", "pos": "phrase", "ipa": "/spend taɪm/", "tr": "vakit geçirmek", "example": "We spend time together every Sunday.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "close-knit", "pos": "adjective", "ipa": "/kloʊs nɪt/", "tr": "sıkı bağlı (aile)", "example": "We are a close-knit family who help each other.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "extended family", "pos": "noun", "ipa": "/ɪkˈstendɪd ˈfæməli/", "tr": "geniş aile", "example": "Our extended family meets every Eid.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“geniş aile”", "options": ["extended family", "argue", "spend time"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“büyükanne/büyükbaba”", "options": ["grandparent", "close-knit", "sibling"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“desteklemek”", "options": ["support", "get along with", "sibling"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sıkı bağlı (aile)”", "options": ["close-knit", "household chore", "sibling"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“ev işi”", "options": ["spend time", "close-knit", "household chore"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“akraba”", "options": ["sibling", "relative", "get along with"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Possessive 's & Present Simple — Family Routines", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["My <mark>sister's<\/mark> hobby is painting.", "My parents <mark>get up<\/mark> at seven every day.", "My grandfather <mark>doesn't drive<\/mark> anymore."], "ask": "What do you notice about 's in 'sister's hobby'? What about the verbs in bold?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 's after a person's name or noun to show possession. Use the present simple for regular family routines.", "tr": "Bir kişiye ait olan şeyi belirtmek için 's kullanılır. Ailedeki düzenli rutinler için geniş zaman kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["My mother's job is a teacher."], "negative": ["My father doesn't cook."], "question": ["Does your sister help at home?"], "short": ["Yes, she does. / No, she doesn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My sister hobby is painting.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My sister's hobby is painting.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "My ___ (grandfather) house is in the countryside. (possessive)", "section": "", "reveal": "grandfather's", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "My mother ___ (not/work) on Sundays.", "section": "", "reveal": "doesn't work", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which is correct?", "section": "", "options": ["My brothers room is messy.", "My brother's room is messy.", "My brothers's room is messy.", "My brother room's is messy."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite: the hobby of my sister is reading.", "section": "", "reveal": "My sister's hobby is reading.", "prompt": "Use possessive 's", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Close-Knit Family", "note": ""}, {"type": "list", "title": "Before you read", "list": ["How many people are there in your family?", "What do you usually do together as a family?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Close-Knit Family", "num": 1, "total": 3, "text": "The Demir family is a close-knit extended family of eight people: parents, three children, and both grandparents, who live in the same house.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Close-Knit Family", "num": 2, "total": 3, "text": "Every family member has a household chore. The children's job is to set the table, while their grandmother's favourite task is watering the garden. On weekends, the whole family spends time together — they usually visit their aunt and uncle, and the cousins play with their nephew and niece.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Close-Knit Family", "num": 3, "total": 3, "text": "Of course, siblings sometimes argue about small things, like whose turn it is to choose a TV programme. But when someone has a problem, the family always supports each other.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "How many people live in the Demir family's house?", "section": "While you read", "options": ["Five", "Six", "Seven", "Eight"], "answer": 3, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The grandmother's favourite chore is ___ the garden.", "section": "While you read", "reveal": "watering", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The siblings never argue.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They sometimes argue about small things.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What household chore do you do at home?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Talking About Grandparents", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Do you visit your grandparents often?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Talking About Grandparents", "audio": null, "transcript": [{"speaker": "A", "line": "Do you get along well with your grandparents?"}, {"speaker": "B", "line": "Yes, very well! They live in a village, and we visit them every summer."}, {"speaker": "A", "line": "What do they like doing?"}, {"speaker": "B", "line": "My grandfather's hobby is fishing, and my grandmother loves gardening. We always spend time together in the garden."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Where do the speaker's grandparents live?", "section": "While you listen", "options": ["In the city", "In a village", "Abroad", "Next door"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The speaker's grandfather's hobby is ___.", "section": "While you listen", "reveal": "fishing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "My Family Tree", "text": "Describe three members of your family (relationship, one routine, one hobby) to your partner.", "steps": ["Choose three family members.", "Describe each one's relationship to you.", "Add one routine and one hobby for each."], "chips": ["My... is called...", "My...'s hobby is...", "We get along well because...", "Every day, my... "], "timer": 300, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Family", "text": "Write a paragraph about your family: how many people, one household chore each person does, and one thing you enjoy doing together.", "steps": ["State how many people are in your family.", "Describe one chore for two family members using possessive 's.", "Describe an activity you do together."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "'Kardeş' in English is ___.", "section": "Exit ticket", "options": ["relative", "sibling", "nephew", "niece"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My ___ (mother) job is very busy. (possessive)", "section": "Exit ticket", "reveal": "mother's", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "How many people are in the Demir family?", "section": "Exit ticket", "options": ["6", "7", "8", "9"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'Get along with' means to have a good relationship with someone.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "My father ___ (not/cook) on weekdays.", "section": "Exit ticket", "reveal": "doesn't cook", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What is the grandfather's hobby in the listening?", "section": "Exit ticket", "options": ["Gardening", "Fishing", "Painting", "Reading"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Ev işi' means ___.", "section": "Exit ticket", "options": ["extended family", "household chore", "relative", "sibling"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My sister ___ (help) at home every weekend.", "section": "Exit ticket", "reveal": "helps", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir
