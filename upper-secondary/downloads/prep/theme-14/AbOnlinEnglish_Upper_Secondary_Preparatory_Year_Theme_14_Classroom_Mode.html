ing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "cuisine", "pos": "noun", "ipa": "/kwɪˈziːn/", "tr": "mutfak (yemek kültürü)", "example": "Every country has a unique cuisine.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "stereotype", "pos": "noun", "ipa": "/ˈsteriətaɪp/", "tr": "kalıp yargı", "example": "It's unfair to judge a country by a stereotype.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“mutfak (yemek kültürü)”", "options": ["cuisine", "stereotype", "respect"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kalıp yargı”", "options": ["greeting", "etiquette", "stereotype"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kültürel değişim”", "options": ["cuisine", "cultural exchange", "stereotype"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“başkent”", "options": ["architecture", "capital city", "population"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“selamlaşma”", "options": ["etiquette", "stereotype", "greeting"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“gelenek/örf”", "options": ["custom", "etiquette", "capital city"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Comparatives, Superlatives & Should for Cultural Advice", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Tokyo is <mark>more crowded than<\/mark> my hometown.", "This is <mark>the most famous<\/mark> landmark in the country.", "You <mark>should<\/mark> learn a few local customs before you travel."], "ask": "What do you notice about the comparisons, and the advice given with 'should'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use comparatives/superlatives to compare places and cultures, and 'should' to give cultural advice.", "tr": "Yerleri ve kültürleri karşılaştırmak için karşılaştırma/üstünlük, kültürel tavsiye vermek için 'should' kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["This city is busier than mine."], "negative": ["You shouldn't ignore local customs."], "question": ["Which capital is the most famous?"], "short": []}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the most big landmark.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the biggest landmark.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "Istanbul is ___ (crowded) than most other Turkish cities.", "section": "", "reveal": "more crowded", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This is ___ (famous) landmark in the whole country.", "section": "", "reveal": "the most famous", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct advice.", "section": "", "options": ["You should to learn local customs.", "You should learn local customs.", "You should learning local customs.", "You shoulds learn local customs."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite: it's a good idea to try the local cuisine.", "section": "", "reveal": "You should try the local cuisine.", "prompt": "Use should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Visiting a New Culture", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Have you ever visited a country with different customs from yours?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Visiting a New Culture", "num": 1, "total": 3, "text": "When you travel to a new country, you quickly notice that customs and etiquette can be very different from your own. In Japan, for example, a bow is a common greeting, while in many European countries, people shake hands.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Visiting a New Culture", "num": 2, "total": 3, "text": "Capital cities are often the most diverse places in a country, home to famous landmarks and a mix of different cultures. Tokyo, for instance, is more crowded and modern than most other Japanese cities, but it also has some of the oldest temples and traditional architecture in the country.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Visiting a New Culture", "num": 3, "total": 3, "text": "Before travelling, you should learn a few basic customs to show respect. You shouldn't assume that everyone follows the same rules as your own culture — and remember that a stereotype is rarely the full picture of a country's people.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What greeting is common in Japan, according to the text?", "section": "While you read", "options": ["A handshake", "A bow", "A hug", "A wave"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You should learn a few basic customs to show ___.", "section": "While you read", "reveal": "respect", "note": "Students write the answer, then check with ": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "This city is ___ (busy) than my hometown.", "section": "Exit ticket", "reveal": "busier", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What is Tokyo described as, compared to other Japanese cities?", "section": "Exit ticket", "options": ["Quieter", "More crowded and modern", "Smaller", "Less diverse"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'Diverse' means having a lot of variety.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "You ___ (should) try the local cuisine when travelling.", "section": "Exit ticket", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What should students research before the trip, according to the listening?", "section": "Exit ticket", "options": ["Only landmarks", "Local customs and etiquette", "Only the weather", "Nothing"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Kalı
