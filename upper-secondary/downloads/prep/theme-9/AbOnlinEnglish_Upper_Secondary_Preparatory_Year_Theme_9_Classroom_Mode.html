 suits you best?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Choosing the Right School", "num": 1, "total": 3, "text": "Around the world, students can choose from many types of schools. Public schools are usually the cheapest option and follow a national curriculum, while private schools often offer smaller classes and more extracurricular activities, such as debate clubs and sports teams.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Choosing the Right School", "num": 2, "total": 3, "text": "Vocational schools are more practical than academic ones, focusing on skills for a specific career. Boarding schools, where students live during term time, can be the most challenging option because students must adapt to being away from their families.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Choosing the Right School", "num": 3, "total": 3, "text": "Whichever school they attend, many students feel anxiety before big exams or deadlines. Learning to cope with this pressure — through relaxation techniques, good time management, and support from teachers — helps students build self-esteem and achieve their goals.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Which type of school usually offers the most extracurricular activities?", "section": "While you read", "options": ["Public schools", "Private schools", "Vocational schools", "None of them"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Vocational schools are more ___ than academic schools.", "section": "While you read", "reveal": "practical", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Boarding schools are described as the easiest option.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They are described as the most challenging option.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["What extracurricular activities does your school offer?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Talking to the School Counsellor About Stress", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What can students do when they feel overwhelmed by school?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Talking to the School Counsellor About Stress", "audio": null, "transcript": [{"speaker": "Student", "line": "I feel really overwhelmed. My project deadline is tomorrow and I haven't finished."}, {"speaker": "Counsellor", "line": "That sounds stressful. Have you tried a relaxation technique, like deep breathing?"}, {"speaker": "Student", "line": "Not really, no."}, {"speaker": "Counsellor", "line": "Let's also make a simple plan so you can cope with the deadline step by step."}], "note": "Play twice: first for gist, then for detail. Show the tra
