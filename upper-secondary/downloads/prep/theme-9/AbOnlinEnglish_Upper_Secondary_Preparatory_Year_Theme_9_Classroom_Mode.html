ermeyin."}, {"type": "notice", "title": "Notice", "items": ["English <mark>is taught<\/mark> in almost every school around the world.", "New subjects <mark>are being added<\/mark> to the curriculum this year.", "Students' progress <mark>is checked<\/mark> every term.", "A new drama club <mark>is being organised<\/mark> by Year 10 students."], "ask": "In each sentence, who or what does the action, and who or what receives it? What form of 'be' is used before the main verb?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["is/are + past participle", "is/are being + past participle", "by", "the object"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The present simple passive is formed with ___.", "section": "Complete the rule", "reveal": "is/are + past participle", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The present continuous passive is formed with ___.", "section": "Complete the rule", "reveal": "is/are being + past participle", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We often use ___ to say who does the action, if it's important.", "section": "Complete the rule", "reveal": "by", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a passive sentence, the subject is usually ___ of the active sentence.", "section": "Complete the rule", "reveal": "the object", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Present Simple Passive is formed with is/are + past participle and is used for routines, rules and general facts, especially when who does the action is not important. Present Continuous Passive is formed with is/are being + past participle and describes an action happening now or around now.", "tr": "Present Simple Passive: is/are + fiilin 3. hali (past participle) ile yapılır; düzenli olarak yapılan işler, kurallar ve genel gerçekler için kullanılır, özellikle işi kimin yaptığı önemli değilse. Present Continuous Passive: is/are being + past participle ile yapılır; şu an ya da bu günlerde devam eden bir işlem anlatılır.", "when_en": "We use the present passive when what is done matters more than who does it — for example, school rules, timetables and ongoing school projects.", "when": "Kim yaptığından çok neyin yapıldığı önemliyse (örneğin okul kuralları, ders programları, devam eden projeler) present passive kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Teachers", "teach", "English", "(present simple)"], "reveal": "English is taught by teachers.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["The school", "organises", "a talent show", "(present simple)"], "reveal": "A talent show is organised by the school.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Students", "check", "their results online", "(present simple)"], "reveal": "Results are checked online.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The council", "is building", "a new sports hall", "(present continuous)"], "reveal": "A new sports hall is being built by the council.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The teachers", "are marking", "the exams", "(present continuous)"], "reveal": "The exams are being marked by the teachers.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Nobody", "uses", "the old gym", "(present simple, negative)"], "reveal": "The old gym isn't used by anybody.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three passive sentences about your own school in the present tense: one about something that is done every day, one about something that is being organised this term, and one about a rule.", "chips": ["At my school, ... is/are ... every day.", "This term, ... is/are being organised.", "... is/are required at my school."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["English is taught in almost every school.", "A new club is being organised this term."], "negative": ["Phones aren't allowed in the exam hall.", "The results aren't being announced yet."], "question": ["Is homework checked every week?", "Is the new hall being built this year?"], "short": ["Yes, it is. / No, it isn't.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "English is teach in our school.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "English is taught in our school.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "A new club is organise this term.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "A new club is being organised this term.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "In most countries, primary education ___ free.", "section": "A · Choose the correct option.", "options": ["provides", "is provided", "provide"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "A new science lab ___ at our school right now.", "section": "A · Choose the correct option.", "options": ["is building", "is being built", "builds"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Homework ___ every Friday.", "section": "A · Choose the correct option.", "options": ["is checked", "checks", "is checking"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The uniform rules ___ by the head teacher.", "section": "A · Choose the correct option.", "options": ["decide", "are decided", "deciding"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The timetable ___ (change) every September.", "section": "B · Complete with the correct passive form.", "reveal": "is changed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A talent show ___ (organise) by Year 11 this term.", "section": "B · Complete with the correct passive form.", "reveal": "is being organised", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The exams is marked by the teachers every June.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The exams are marked by the teachers every June.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "A new sports hall is being built this year.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: How ___ new students ___ (choose) for the debate team?", "section": "Dialogue · Complete with the correct passive form.", "reveal": "are / chosen", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: They ___ (interview) by the team captain every September.", "section": "Dialogue · Complete with the correct passive form.", "reveal": "are interviewed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Ask if the gym is being renovated this term.", "section": "Dialogue · Complete with the correct passive form.", "words": ["is", "the", "gym", "being", "renovated", "this", "term"], "end": "?", "reveal": "Is the gym being renovated this term?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Passive Voice: Past Tenses", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The old school building <mark>was built<\/mark> in 1950.", "The new drama club <mark>was started<\/mark> by two Year 12 students last year.", "When we arrived, the stage <mark>was being decorated<\/mark> for the show.", "All the roles in the play <mark>were given<\/mark> out before the summer holiday."], "ask": "Which sentences describe a finished action in the past? Which one describes an action that was in progress at a certain past moment?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["was/were + past participle", "was/were being + past participle", "at that moment", "a finished action"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The past simple passive is formed with ___.", "section": "Complete the rule", "reveal": "was/were + past participle", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The past continuous passive is formed with ___.", "section": "Complete the rule", "reveal": "was/were being + past participle", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use the past simple passive for ___ in the past.", "section": "Complete the rule", "reveal": "a finished action", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use the past continuous passive for something that was happening ___ in the past.", "section": "Complete the rule", "reveal": "at that moment", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Past Simple Passive is formed with was/were + past participle and describes a completed action in the past. Past Continuous Passive is formed with was/were being + past participle and describes an action in progress at a specific past moment.", "tr": "Past Simple Passive: was/were + fiilin 3. hali ile yapılır ve geçmişte tamamlanmış bir eylemi anlatır. Past Continuous Passive: was/were being + past participle ile yapılır ve geçmişte belirli bir anda devam eden bir eylemi anlatır.", "when_en": "We use these to talk about a school's history, a past event, or something that was happening at a certain moment in the past.", "when": "Okulun tarihini, geçmişte olan bir etkinliği ya da bir olayın belirli bir anında devam eden bir işi anlatırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Builders", "built", "the school", "in 1950", "(past simple)"], "reveal": "The school was built in 1950.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Two students", "started", "the debate team", "last year", "(past simple)"], "reveal": "The debate team was started by two students last year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The teachers", "were decorating", "the hall", "when we arrived", "(past continuous)"], "reveal": "The hall was being decorated when we arrived.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The head teacher", "gave out", "the roles", "before the holiday", "(past simple)"], "reveal": "The roles were given out before the holiday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Somebody", "was filming", "the rehearsal", "at 4 pm", "(past continuous)"], "reveal": "The rehearsal was being filmed at 4 pm.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two passive sentences about the history of your school or a school event: one with the past simple passive and one with the past continuous passive.", "chips": ["Our school ... was/were ... in ...", "When I arrived, ... was/were being ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The school was built in 1950.", "The hall was being decorated when we arrived."], "negative": ["The play wasn't finished on time.", "The costumes weren't being made yet."], "question": ["Was the debate team started last year?", "Were the roles being given out on Monday?"], "short": ["Yes, it was. / No, it wasn't.", "Yes, they were. / No, they weren't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The school was build in 1950.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The school was built in 1950.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The hall decorated when we arrived.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The hall was being decorated when we arrived.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Our school ___ in 1998.", "section": "A · Choose the correct option.", "options": ["was built", "was building", "built"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The debate team ___ by two students last year.", "section": "A · Choose the correct option.", "options": ["started", "was started", "were started"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When the head teacher arrived, the stage ___.", "section": "A · Choose the correct option.", "options": ["was decorating", "was being decorated", "decorated"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "All the roles ___ before the summer holiday.", "section": "A · Choose the correct option.", "options": ["gave out", "were given out", "was given out"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The old gym ___ (not use) for many years.", "section": "B · Complete with the correct passive form.", "reveal": "wasn't used", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The rehearsal ___ (film) when the fire alarm rang.", "section": "B · Complete with the correct passive form.", "reveal": "was being filmed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The school were built in 1950.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The school was built in 1950.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The costumes were being made when we visited the drama room.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: When ___ this school ___ (found)?", "section": "Dialogue · Complete with the correct passive form.", "reveal": "was / founded", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: It ___ (build) in 1950, and the new hall ___ (add) in 2010.", "section": "Dialogue · Complete with the correct passive form.", "reveal": "was built / was added", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "They were rehearsing the play when the teacher walked in.", "section": "Dialogue · Complete with the correct passive form.", "reveal": "The play was being rehearsed when the teacher walked in.", "prompt": "Rewrite in the passive.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Schools Around the World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What different types of schools can you think of?", "Guess: which type of school do you think most children in the world attend?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Schools Around the World", "num": 1, "total": 5, "text": "All over the world, children go to many different types of schools. In most countries, primary and secondary education is provided by the state, so state schools are attended by the majority of students. Tuition fees aren't usually charged, because state education is paid for by the government.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Schools Around the World", "num": 2, "total": 5, "text": "In some countries, private schools are also popular. Higher fees are paid by families for smaller classes, extra subjects, or special facilities like a swimming pool or a theatre. A different curriculum is sometimes followed by private schools, although the basic subjects are similar to those in state schools.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Schools Around the World", "num": 3, "total": 5, "text": "Boarding schools are another option. Students live at a boarding school during the term, and their daily routine — meals, homework and free time — is organised by the school itself. Boarding schools are chosen by some families because they are far from a good local school, or because they want their child to become more independent.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Schools Around the World", "num": 4, "total": 5, "text": "Not every student studies in a traditional classroom. Practical skills for a future job, like cooking, mechanics or nursing, are taught at vocational schools. A small number of families choose homeschooling instead, where children are taught at home, often by a parent, and lessons are planned around the family's own timetable.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Schools Around the World", "num": 5, "total": 5, "text": "Whichever type of school is chosen, the goal is the same everywhere: to help young people learn, grow and prepare for their future.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["Why school uniforms are important", "Different types of schools around the world", "How to become a teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who usually pays for state education?", "section": "While you read", "options": ["Families", "The government", "Private companies"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, why do some families choose a boarding school?", "section": "While you read", "options": ["Because it is free", "Because it is close to home", "Because it is far from a good school, or to build independence"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What kind of skills are taught at vocational schools?", "section": "While you read", "options": ["Practical skills for a future job", "Only academic theory", "Foreign languages only"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In homeschooling, who often teaches the children?", "section": "While you read", "options": ["A professional tutor only", "Often a parent", "Nobody"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, private schools always follow a completely different curriculum from state schools.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Private schools sometimes follow a different curriculum, but the basic subjects are similar.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Which type of school would you choose for yourself? Why?", "Compare your own school with one type of school from the text. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Clubs, Competitions and Confidence", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What extracurricular activities does your school offer?", "Guess: how can joining a club help a student who feels anxious?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Clubs, Competitions and Confidence", "num": 1, "total": 5, "text": "Extracurricular activities are offered by almost every school, from sports teams to the debate team, drama club and music groups. These activities aren't just for fun — they help students develop new skills and make friends outside the classroom.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Clubs, Competitions and Confidence", "num": 2, "total": 5, "text": "Last year, our school's drama club decided to compete in a regional festival. Auditions were held in October, and roles were given to students with different levels of experience. Even students who had never acted before were encouraged to join.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Clubs, Competitions and Confidence", "num": 3, "total": 5, "text": "For many students, joining a new club can feel a little scary. Deniz, a Year 11 student, admits that she felt anxious before her first rehearsal. 'I was worried I wasn't talented enough,' she says. 'But the other students were really supportive, and I was reassured by our drama teacher.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Clubs, Competitions and Confidence", "num": 4, "total": 5, "text": "Feeling overwhelmed before a performance is completely normal. Experts say that a strong support system — friends, teachers and family — helps students cope with this kind of stress. Talking about your feelings, instead of hiding them, usually makes the nerves easier to manage.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Clubs, Competitions and Confidence", "num": 5, "total": 5, "text": "By the night of the show, Deniz's nerves were forgotten. 'Once the curtain went up,' she laughs, 'I just enjoyed every minute.' Her story shows that a little courage — and the right support — can turn an anxious beginner into a confident performer.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A new school building", "A student's experience of joining the drama club", "A list of school rules"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When were the auditions held?", "section": "While you read", "options": ["In October", "In December", "At the end of the school year"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How did Deniz feel before her first rehearsal?", "section": "While you read", "options": ["Bored", "Anxious", "Confident"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What helped Deniz cope with her nerves, according to the text?", "section": "While you read", "options": ["Working alone", "Support from other students and her teacher", "Quitting the club"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what usually makes nerves easier to manage?", "section": "While you read", "options": ["Ignoring your feelings", "Talking about your feelings", "Avoiding the activity"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz felt nervous during the whole performance, from beginning to end.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz's nerves were forgotten once the show started, and she enjoyed the performance.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Have you ever felt nervous before trying something new at school? What helped you?", "Write two sentences of advice for a classmate who feels anxious about performing."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Choosing the Right School", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a conversation between two friends about school options.", "Predict: what questions might someone ask when choosing between two schools?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Choosing the Right School", "audio": null, "transcript": [{"speaker": "Ege", "line": "Hey, I heard your family is thinking about a different school for you next year."}, {"speaker": "Mina", "line": "Yeah, we're deciding between our local state school and a private school in the city."}, {"speaker": "Ege", "line": "What's the difference, really?"}, {"speaker": "Mina", "line": "Well, at the private school, smaller classes are offered, and more extracurricular activities are organised — like a debate team and a drama club."}, {"speaker": "Ege", "line": "That sounds great, but isn't a high tuition fee charged every term?"}, {"speaker": "Mina", "line": "Yes, it is. My parents are still checking if it's worth it."}, {"speaker": "Ege", "line": "What about the curriculum? Is it very different?"}, {"speaker": "Mina", "line": "Not really — the basic subjects are similar, but more languages are taught there."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Mina's family deciding between?", "section": "While you listen", "options": ["Two state schools", "A state school and a private school", "A boarding school and a vocational school"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is offered at the private school, according to Mina?", "section": "While you listen", "options": ["Free tuition", "Smaller classes and more extracurricular activities", "No homework"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Ege ask about the private school?", "section": "While you listen", "options": ["Its location", "Its tuition fee", "Its uniform"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to Mina, how is the curriculum different?", "section": "While you listen", "options": ["It's completely different", "More languages are taught", "There is no curriculum"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mina's parents have already decided to send her to the private school.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Mina's parents are still checking if the private school is worth it.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Would you prefer a state school or a private school? Why?", "Write one sentence about what is offered at your own school."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Nerves Before the Show", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students talking backstage before a school performance.", "Predict: what might a nervous performer say before going on stage?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Nerves Before the Show", "audio": null, "transcript": [{"speaker": "Aslı", "line": "My hands are shaking. What if I forget my lines?"}, {"speaker": "Kerem", "line": "Don't worry, the script was rehearsed by all of us so many times this week — you know it!"}, {"speaker": "Aslı", "line": "I know, but I still feel really anxious."}, {"speak inutes.", "İleri Fast finishers add one more true sentence about their own school and ask it too."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Before the Show — Reassuring a Nervous Friend", "text": "With a partner, act out a short scene backstage before a school show. One of you is nervous about performing; the other tries to reassure them.", "steps": ["Read the situation card: one student feels overwhelmed before going on stage.", "Decide who is Student A (nervous) and who is Student B (reassuring).", "Act out the scene using at least two passive voice sentences and reassuring language.", "Swap roles and try a new situation (e.g. before an exam, before a match).", "Perform your favourite scene for another pair."], "chips": ["Don't worry, you know it!", "Everyone feels a bit anxious before a show.", "The set was designed by…", "You've got this!"], "timer": 600, "levels": ["Destek Provide sentence starters on cards for lower-level students.", "Hedef One role-play scene per pair, with a role swap.", "İleri Students invent one extra reassuring sentence of their own."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Comparing Two Types of Schools", "text": "Write a short paragraph comparing two types of schools from this theme (for example, a state school and a boarding school). Use at least two passive voice sentences.", "steps": ["Choose the two types of schools you will compare.", "List 2-3 differences for each (fees, curriculum, daily life).", "Use at least two passive sentences (e.g. 'Tuition fees are charged…').", "Check your grammar and punctuation."], "chips": ["state school", "private school", "boarding school", "tui
