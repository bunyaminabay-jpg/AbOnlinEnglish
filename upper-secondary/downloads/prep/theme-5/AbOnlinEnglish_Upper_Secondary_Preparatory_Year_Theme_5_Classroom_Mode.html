 ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["-ing", "to + verb", "enjoy / love", "want / decide"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Verbs like enjoy and love are usually followed by a verb + ___.", "section": "Complete the rule", "reveal": "-ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Verbs like want and decide are usually followed by ___.", "section": "Complete the rule", "reveal": "to + verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Give one example verb followed by the gerund form: ___.", "section": "Complete the rule", "reveal": "enjoy / love / enjoy / love", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Give one example verb followed by the infinitive form: ___.", "section": "Complete the rule", "reveal": "want / decide / want / decide", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Some verbs are followed by the -ing form (gerund): enjoy, love, like, mind, finish. Other verbs are followed by to + verb (infinitive): want, decide, plan, hope, need.", "tr": "Bazı fiillerden sonra -ing (gerund) hâli gelir: enjoy, love, like, mind, finish. Bazı fiillerden sonra ise 'to' + fiil (infinitive) hâli gelir: want, decide, plan, hope, need.", "when_en": "We use this to talk about activities we enjoy doing, or things we plan or want to do in our city.", "when": "Şehrimizde yapmaktan hoşlandığımız etkinlikleri ya da yapmayı planladığımız şeyleri anlatırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I / enjoy / visit", "museums"], "reveal": "I enjoy visiting museums.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we / decide / take", "the bus"], "reveal": "We decided to take the bus.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she / love / shop", "at the new mall"], "reveal": "She loves shopping at the new mall.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they / want / explore", "the old town"], "reveal": "They want to explore the old town.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / not mind / wait", "for the bus"], "reveal": "I don't mind waiting for the bus.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences about activities you enjoy doing or plan to do in your neighbourhood or city, using a gerund and an infinitive.", "chips": ["I enjoy...", "I want / plan / decide to..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I enjoy visiting museums.", "We decided to take the bus."], "negative": ["I don't enjoy waiting for the bus.", "We didn't want to walk in the rain."], "question": ["Do you enjoy shopping at the new mall?", "Did they decide to take the underground?"], "short": ["Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I enjoy to visit new parks.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I enjoy visiting new parks.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We decided taking the underground.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We decided to take the underground.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I really enjoy ___ (visit) new places.", "section": "A · Choose the correct option.", "options": ["visit", "visiting", "to visit"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We decided ___ (take) the underground.", "section": "A · Choose the correct option.", "options": ["take", "taking", "to take"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She loves ___ (shop) at the market.", "section": "A · Choose the correct option.", "options": ["shopping", "to shop", "shop"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "They want ___ (explore) the old town.", "section": "B · Complete with the gerund or infinitive.", "reveal": "to explore", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I don't mind ___ (wait) for the bus.", "section": "B · Complete with the gerund or infinitive.", "reveal": "waiting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "'I enjoy to visit museums' is a correct sentence.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The correct form is 'I enjoy visiting museums.'", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "'We decided to take the underground' is a correct sentence.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Do you enjoy ___ (walk) around the city centre?", "section": "Dialogue · Complete with the gerund or infinitive.", "reveal": "walking", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, but today I decided ___ (take) the bus because it was raining.", "section": "Dialogue · Complete with the gerund or infinitive.", "reveal": "to take", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "I like / visit the park on weekends.", "section": "Dialogue · Complete with the gerund or infinitive.", "reveal": "I like visiting the park on weekends.", "prompt": "Make a full sentence using the gerund.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-5", "title": "Gramer 6", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Prepositions of place and time: describing where and when", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The library is <mark>between<\/mark> the bank and the post office.", "We met <mark>at<\/mark> the bus stop <mark>at<\/mark> 9 o'clock.", "The community centre is <mark>opposite<\/mark> the park, <mark>on<\/mark> Elm Street.", "There is a pharmacy <mark>next to<\/mark> the supermarket, <mark>near<\/mark> the hospital."], "ask": "Which prepositions tell us WHERE a place is? Which prepositions tell us WHEN something happens?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["between", "at", "opposite", "on"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use ___ for an exact point in time or a specific place like a bus stop: at 9 o'clock, at the bus stop.", "section": "Complete the rule", "reveal": "at", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use ___ for a street name: on Elm Street.", "section": "Complete the rule", "reveal": "on", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "When something is in the middle of two things, we use ___: between the bank and the post office.", "section": "Complete the rule", "reveal": "between", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "When something faces another place, we use ___: opposite the park.", "section": "Complete the rule", "reveal": "opposite", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Prepositions of place describe where something is: between, opposite, next to, near. Prepositions of time describe when something happens: at (a specific time), on (a day or street name), in (a month, season, or city).", "tr": "Yer belirten edatlar bir yerin nerede olduğunu anlatır: between (arasında), opposite (karşısında), next to (yanında), near (yakınında). Zaman belirten edatlar ise bir şeyin ne zaman olduğunu anlatır: at (belirli saat), on (gün/cadde adı), in (ay/mevsim/şehir).", "when_en": "We use these to describe the location of places in our city and to say when a meeting or event happens.", "when": "Şehrimizdeki yerlerin konumunu tarif ederken ve bir buluşma ya da olayın zamanını söylerken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the museum", "between", "the library and the park"], "reveal": "The museum is between the library and the park.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "meet", "the bus stop", "8:30"], "reveal": "We met at the bus stop at 8:30.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the pharmacy", "next to", "the supermarket"], "reveal": "The pharmacy is next to the supermarket.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the fire station", "opposite", "the community centre"], "reveal": "The fire station is opposite the community centre.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the new mall", "on", "River Street"], "reveal": "The new mall is on River Street.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Describe where three places are in your own neighbourhood, using at least three different prepositions of place.", "chips": ["The ... is between ... and ...", "The ... is next to / opposite / near ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The museum is between the library and the park.", "We met at the bus stop at 8:30."], "negative": ["The pharmacy isn't near the hospital.", "We didn't meet at the bus stop."], "question": ["Is the fire station opposite the community centre?", "What time did you meet at the bus stop?"], "short": ["Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The library is in Elm Street.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The library is on Elm Street.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We met in the bus stop at 9 o'clock.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We met at the bus stop at 9 o'clock.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "The museum is ___ the library and the park.", "section": "A · Choose the correct option.", "options": ["between", "opposite", "on"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We met ___ the bus stop at 9 o'clock.", "section": "A · Choose the correct option.", "options": ["in", "at", "on"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The new mall is ___ River Street.", "section": "A · Choose the correct option.", "options": ["at", "in", "on"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The pharmacy is ___ the supermarket. (next to)", "section": "B · Complete with the correct preposition.", "reveal": "next to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The fire station is ___ the community centre. (opposite)", "section": "B · Complete with the correct preposition.", "reveal": "opposite", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "'The library is in Elm Street' is correct.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The correct sentence is 'The library is on Elm Street.'", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "'We met at the bus stop at 8:30' is correct.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: The post office is ___ the bank and the bakery.", "section": "Dialogue · Complete with the correct preposition.", "reveal": "between", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: And it's ___ Main Street, right ___ the bus stop.", "section": "Dialogue · Complete with the correct preposition.", "reveal": "on / near", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Describe where the hospital is using 'opposite'.", "section": "Dialogue · Complete with the correct preposition.", "words": ["the", "hospital", "is", "opposite", "the", "park"], "end": ".", "reveal": "The hospital is opposite the park.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Great Day in the City Centre", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What attractions do you think the writer visited?", "Guess: which place do you think the writer liked best — a park, a museum, or a mall?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Great Day in the City Centre", "num": 1, "total": 5, "text": "My name is Aslı, and last Saturday I visited the city centre with my family. We wanted to see some of the most popular attractions and recreational places in our city.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Great Day in the City Centre", "num": 2, "total": 5, "text": "First, we went to Riverside Park, a large green area next to the river. It was much quieter than the busy streets near our house, and there was a lovely playground for my little brother. We sat on the grass and had a picnic before we walked around the lake.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Great Day in the City Centre", "num": 3, "total": 5, "text": "After the park, we visited the City History Museum. It was more interesting than I expected! There were old photos of our city from a hundred years ago, and a friendly guide explained how the neighbourhood changed over time. My favourite part was the model of the old market square.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Great Day in the City Centre", "num": 4, "total": 5, "text": "In the afternoon, we went to Central Mall, the biggest shopping centre in our city. It was more crowded than the museum, but it had a cinema, a food court, and dozens of shops. We watched a film and ate dinner there before we went home.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Great Day in the City Centre", "num": 5, "total": 5, "text": "It was a great day. The park was more relaxing than the mall, but the museum taught me the most about my own city. Next time, I want to visit the old castle on the hill — I've heard it's even more beautiful than the museum.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["Aslı's opinion about shopping malls", "Aslı's day visiting attractions in the city centre", "How to build a museum"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where did the family have a picnic?", "section": "While you read", "options": ["Central Mall", "Riverside Park", "The City History Museum"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What did the guide explain at the museum?", "section": "While you read", "options": ["How to get to the city centre", "How the neighbourhood changed over time", "How to buy tickets"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to Aslı, which place was more relaxing?", "section": "While you read", "options": ["The park", "The museum", "The mall"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The mall was quieter than the museum.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The mall was more crowded than the museum.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Aslı want to visit next time?", "section": "While you read", "options": ["The old castle on the hill", "A new shopping mall", "A different park"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which attraction in the text would you most like to visit? Why?", "Write two sentences comparing two places in your own neighbourhood."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Morning of Errands", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Which services do you think people need most in a neighbourhood? Name two.", "Look at the title 'A Morning of Errands'. What errands do you think Mr Kaya needs to do?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Morning of Errands", "num": 1, "total": 5, "text": "On Saturday morning, Mr Kaya had a lot of errands to do in his neighbourhood. His daughter, Elif, decided to go with him and help.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Morning of Errands", "num": 2, "total": 5, "text": "Their first stop was the post office. Elif enjoyed posting a parcel to her cousin, and the clerk was very helpful. Next, they walked to the pharmacy to buy some medicine for Elif's grandmother. The pharmacy was smaller than the supermarket next door, but the pharmacist knew Elif's family well.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Morning of Errands", "num": 3, "total": 5, "text": "After that, Mr Kaya remembered that the library book was due back that day. They hurried to the library, which was busier than usual because of a children's story time. Elif loved choosing three new books before they left.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Morning of Errands", "num": 4, "total": 5, "text": "Their last stop was the community centre, where Elif's mother works as a volunteer. The centre offers free English classes, a food bank, and after-school clubs for children. Mr Kaya and Elif helped set up chairs for an evening meeting before they walked home.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Morning of Errands", "num": 5, "total": 5, "text": "By midday, Elif understood why her father always says that good services make a neighbourhood a better place to live. She started thinking about which services she wanted to include in her class project about their city.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A morning of visiting local services with father and daughter", "A trip to a shopping mall", "A history lesson about the city"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why did they go to the pharmacy?", "section": "While you read", "options": ["To buy medicine for grandmother", "To post a parcel", "To borrow a book"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why was the library busier than usual?", "section": "While you read", "options": ["A children's story time", "A book sale", "A school holiday"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where does Elif's mother volunteer?", "section": "While you read", "options": ["The post office", "The pharmacy", "The community centre"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The community centre only offers English classes.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The community centre offers English classes, a food bank, and after-school clubs.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the last paragraph suggest about Elif?", "section": "While you read", "options": ["She started planning her own class project about services", "She decided not to help her father again", "She forgot about the community centre"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Make a list of three services in your own neighbourhood.", "Which service in the text is most useful for families? Explain why."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Finding the Museum", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a tourist asking a local person for directions to a museum.", "Predict: which prepositions might you hear for giving directions (e.g. next to, between)?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Finding the Museum", "audio": null, "transcript": [{"speaker": "Tourist", "line": "Excuse me, could you tell me how to get to the City History Museum?"}, {"speaker": "Local", "line": "Sure! It's not far. Go straight along this street, past the bakery, and turn left at the traffic lights."}, {"speaker": "Tourist", "line": "Turn left at the traffic lights. And then?"}, {"speaker": "Local", "line": "Then walk for about five minutes. The museum is between the library and the park, on the right."}, {"speaker": "Tourist", "line": "Between the library and the park — got it. Is it far from the bus stop?"}, {"speaker": "Local", "line": "No, it's just opposite the bus stop, actually. You can't miss it."}, {"speaker": "Tourist", "line": "Great, thank you so much for your help!"}, {"speaker": "Local", "line": "You're welcome. Enjoy your visit!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the tourist looking for?", "section": "While you listen", "options": ["A bus stop", "The City History Museum", "A bakery"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where should the tourist turn left?", "section": "While you listen", "options": ["At the bakery", "At the traffic lights", "At the bus stop"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where exactly is the museum?", "section": "While you listen", "options": ["Next to the bakery", "Between the library and the park", "Opposite the library"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where is the museum in relation to the bus stop?", "section": "While you listen", "options": ["Opposite the bus stop", "Next to the bus stop", "Far from the bus stop"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The museum is right next to the bakery.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The museum is between the library and the park, opposite the bus stop.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does the tourist feel at the end of the conversation?", "section": "While you listen", "options": ["Confused", "Grateful", "Annoyed"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Have you ever asked someone for directions in your own city? What did you say?", "Write two sentences giving directions to a place near your home, using a preposition."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Which Way Is Faster?", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students talking about how they travelled to the city centre.", "Predict: which is usually faster in a city — the bus or the underground? Why?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Which Way Is Faster?", "audio": null, "transcript": [{"speaker": "Zeynep", "line": "How did you get to the city centre yesterday?"}, {"speaker": "Deniz", "line": "I took the underground. It was much faster than the bus, wasn't it?"}, {"speaker": "Zeynep", "line": "Yes, it was! I got on the bus near my house, but it was really slow because of the traffic."}, {"speaker": "Deniz", "line": "The underground station is closer to my flat, so it's more convenient for me."}, {"speaker": "Zeynep", "line": "Did you have to pay a lot for the fare?"}, {"speaker": "Deniz", "line": "No, it wasn't expensive at all. Student fares are cheaper than adult fares, aren't they?"}, {"speaker": "Zeynep", "line": "Yes, they are. Next time I'll try the underground too — it sounds better than the bus."}, {"speaker": "Deniz", "line": "Good idea! You won't be late for class again, will you?"}, {"speaker": "Zeynep", "line": "No, I won't! I promise."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "How did Deniz get to the city centre?", "section": "While you listen", "options": ["By bus", "By underground", "On foot"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why was the bus slow for Zeynep?", "section": "While you listen", "options": ["Traffic", "It was too full", "It broke down"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why is the underground more convenient for Deniz?", "section": "While you listen", "options": ["It's cheaper", "The station is closer to his flat", "It's more comfortable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Deniz say about student fares?", "section": "While you listen", "options": ["They are cheaper than adult fares", "They are the same as adult fares", "They don't exist"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep decides she will keep taking the bus every day.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Zeynep decides to try the underground next time.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does Zeynep feel about trying the underground?", "section": "While you listen", "options": ["Interested", "Worried", "Bored"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Which type of transport do you prefer in your city? Why?", "Write one sentence with a question tag about transport (e.g. 'The underground is faster, isn't it?')."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Find Someone Who Visited These Places", "text": "Walk around the class and ask your classmates questions with the Simple Past (Did you ever go to...? / Did you visit...?) to find someone who matches each sentence. Write their name next to the sentence.", "steps": ["Look at your worksheet: 6 sentences about places and services in a city (e.g. '...visited a museum last year').", "Stand up and ask a classmate a question to check if the sentence is true for them.", "If it's true, write their name. If not, ask another classmate.", "Try to find a different name for each sentence.", "Sit down and share two interesting answers with the class."], "chips": ["Did you ever go to the new shopping mall?", "Did you visit a museum last year?", "Was it more interesting than you expected?", "Yes, I did. / No, I didn't."], "timer": 600, "levels": ["Destek Give students the question forms in writing before they start.", "Hedef 6 questions, mingling for about 10 minutes.", "İleri Fast finishers add one more true sentence about a place they visited and ask it too."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Excuse Me — Asking for Directions", "text": "With a partner, act out three short situations in the city where one of you is a visitor asking for directions and the other gives directions using prepositions of place.", "steps": ["Read the three situation cards (finding the post office, the hospital, the bus stop).", "Decide who is Visitor A (asks for directions) and who is Local B (gives directions).", "Act out each situation using prepositions of place and clear directions.", "Swap roles and do it again with new situations.", "Perform your favourite situation for another pair."], "chips": ["Excuse me, how do I get to...?", "Go straight / turn left / turn right.", "It's between... and.../ opposite.../ next to...", "Thank you so much for your help!"], "timer": 600, "levels": ["Destek Provide a simple neighbourhood map with the places marked for lower-level students.", "Hedef 3 role-play situations per pair.", "İleri Students invent one extra situation of their own to role-play."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Neighbourhood Guide", "text": "Write the text for a short guide titled 'My Neighbourhood' for someone new to your area. Recommend at least one attraction, one service, and one way to travel around, using at least one comparative adjective and one preposition of place.", "steps": ["Choose a title for your guide.", "List one attraction, one service, and one type of transport to recommend.", "Add one comparative sentence (e.g. 'The park is quieter than the mall.').", "Check your grammar and punctuation."], "chips": ["attraction", "park", "library", "community centre", "bus stop", "underground", "... is bigger / more interesting than...", "The ... is between ... and ...", "You can take the... to get to..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "Planning My City Project", "text": "Write the first draft of your class project about the attractions, recreational places, services, and transport in your neighbourhood and city, describing how they help the people who live there.", "steps": ["Choose two attractions or recreational places to describe.", "Choose two services and explain why they are important for residents.", "Describe one way people travel around your neighbourhood.", "Use the Simple Past for anything you visited, and a comparative adjective at least once."], "chips": ["attraction", "historical site", "hospital", "post office", "traffic", "fare", "Last month, I visited...", "... is more useful than...", "When I went to..., I..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'attraction'", "section": "Exit ticket", "options": ["a popular place people visit", "a type of bus ticket", "a kind of medicine"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'get on / get off' mean?", "section": "Exit ticket", "options": ["to enter/leave a bus, train, etc.", "to open/close a shop", "to buy/sell something"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Last weekend, we ___ the new shopping mall.", "section": "Exit ticket", "options": ["visit", "visited", "visiting"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The underground is ___ than the bus. (fast)", "section": "Exit ticket", "options": ["faster", "more fast", "fastest"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ we arrived at the park, it started to rain.", "section": "Exit ticket", "options": ["When", "Then", "So"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You visited the museum, ___?", "section": "Exit ticket", "options": ["didn't you", "did you", "weren't you"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I really enjoy ___ new places. (visit)", "section": "Exit ticket", "options": ["visit", "visiting", "to visit"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The museum is ___ the library and the park.", "section": "Exit ticket", "options": ["between", "opposite", "on"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In 'A Great Day in the City Centre', why does Aslı like the park more than the mall?", "section": "Exit ticket", "options": ["It was more relaxing", "It was cheaper", "It was closer to her house"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In 'A Morning of Errands', the community centre only offers English classes.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It offers English classes, a food bank, and after-school clubs.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}], "theme": "Lise Hazırlık · Theme 5 · Life in the Neighbourhood and City", "key": "prep-5"}</script></body></html>
