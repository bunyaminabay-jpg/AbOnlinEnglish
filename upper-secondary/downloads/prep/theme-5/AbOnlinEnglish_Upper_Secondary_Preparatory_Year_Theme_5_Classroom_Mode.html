tahmin ettirin."}, {"type": "word", "word": "convenient", "pos": "adjective", "ipa": "/kənˈviːniənt/", "tr": "uygun, elverişli", "example": "The underground station is more convenient for Deniz than the bus.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "directions", "pos": "noun", "ipa": "/dəˈrekʃnz/", "tr": "yön tarifi", "example": "The tourist asked a local person for directions to the museum.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "castle", "pos": "noun", "ipa": "/ˈkɑːsl/", "tr": "kale", "example": "Next time, Aslı wants to visit the old castle on the hill.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "explore", "pos": "verb", "ipa": "/ɪkˈsplɔː(r)/", "tr": "keşfetmek", "example": "They want to explore the old part of the city at the weekend.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "traffic lights", "pos": "noun", "ipa": "/ˈtræfɪk laɪts/", "tr": "trafik ışıkları", "example": "Turn left at the traffic lights and walk for five minutes.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“alışveriş merkezi”", "options": ["shopping mall", "get on / get off", "bus stop"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“yön tarifi”", "options": ["hospital", "directions", "historical site"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“metro”", "options": ["convenient", "underground", "post office"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“müze”", "options": ["museum", "traffic", "errand"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“itfaiye”", "options": ["crowded", "fire station", "library"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“postane”", "options": ["neighbourhood", "post office", "park"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Simple Past: talking about places you visited", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Last weekend, we <mark>visited<\/mark> the new shopping mall in the city centre.", "The museum <mark>was<\/mark> very crowded on Saturday.", "We <mark>went<\/mark> to the park and <mark>had<\/mark> a picnic by the lake.", "There <mark>weren't<\/mark> many buses running after 10 pm."], "ask": "Which verbs are regular (add -ed)? Which verbs are irregular? What form of 'be' do we use with 'we' and 'there'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["was", "were", "-ed", "irregular"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We add ___ to regular verbs in the Simple Past: visited, walked.", "section": "Complete the rule", "reveal": "-ed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Verbs like went and had are ___ — they don't follow the -ed rule.", "section": "Complete the rule", "reveal": "irregular", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "With I / he / she / it, we use ___: The museum ___ crowded.", "section": "Complete the rule", "reveal": "was", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "With we / you / they / there, we use ___: There ___ many buses.", "section": "Complete the rule", "reveal": "were", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the Simple Past for completed actions and states in the past. Regular verbs add -ed (visited, walked); irregular verbs have their own past form (go→went, have→had). The past of 'be' is was/were.", "tr": "Simple Past; geçmişte tamamlanmış olayları ve durumları anlatmak için kullanılır. Düzenli fiillere -ed eklenir (visited, walked); düzensiz fiillerin ise kendine özgü bir geçmiş zaman biçimi vardır (go→went, have→had). Be fiilinin geçmiş hâli was/were'dir.", "when_en": "We use it to talk about places we visited in the past, what we did there, and what the situation was like (weather, crowds, etc.).", "when": "Geçmişte ziyaret ettiğimiz yerleri, yaptığımız şeyleri ve o anki durumu (hava, kalabalık vb.) anlatırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we", "visit", "the city museum", "last month"], "reveal": "We visited the city museum last month.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the park", "not / be", "crowded", "yesterday"], "reveal": "The park wasn't crowded yesterday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "go", "to the new library", "on Saturday"], "reveal": "I went to the new library on Saturday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["there", "be", "a lot of traffic", "this morning"], "reveal": "There was a lot of traffic this morning.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "take", "the bus", "to the shopping mall"], "reveal": "My parents took the bus to the shopping mall.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "enjoy", "the museum tour"], "reveal": "Did you enjoy the museum tour?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write about a real or imagined visit to an attraction or service in your neighbourhood. Say where you went, what it was like, and one thing you did there.", "chips": ["Last weekend, I went to...", "It was...", "I ... (irregular verb) ...", "There was / were..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["We visited the city museum last month.", "The park was quiet yesterday."], "negative": ["The park wasn't crowded yesterday.", "We didn't take the bus."], "question": ["Did you enjoy the museum tour?", "Was the mall busy on Saturday?"], "short": ["Yes, I did. / No, I didn't.", "Yes, it was. / No, it wasn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We visited the museum and have a great time.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We visited the museum and had a great time.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "There was many people at the market.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There were many people at the market.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Last Saturday, we ___ the new park.", "section": "A · Choose the correct option.", "options": ["visit", "visited", "visits"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The bus ___ very late this morning.", "section": "A · Choose the correct option.", "options": ["was", "were", "is"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ have enough time to see the museum.", "section": "A · Choose the correct option.", "options": ["didn't", "wasn't", "don't"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "They ___ (go) to the community centre after school.", "section": "B · Complete with the correct form.", "reveal": "went", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "There ___ (not / be) any seats on the bus.", "section": "B · Complete with the correct form.", "reveal": "weren't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "We goed to the shopping mall last weekend.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We went to the shopping mall last weekend.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The museum was closed on Monday.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Where ___ you ___ (go) last weekend?", "section": "Dialogue · Complete with the Simple Past.", "reveal": "did / go", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (go) to the community centre. It ___ (be) really useful.", "section": "Dialogue · Complete with the Simple Past.", "reveal": "went / was", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a past visit to the park.", "section": "Dialogue · Complete with the Simple Past.", "words": ["did", "you", "go", "to", "the", "park", "yesterday"], "end": "?", "reveal": "Did you go to the park yesterday?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Comparative adjectives: comparing places in the city", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The new library is <mark>bigger<\/mark> than the old one.", "Riverside Park is <mark>more relaxing<\/mark> than the shopping mall.", "The underground is <mark>faster<\/mark> than the bus in heavy traffic.", "Is the community centre <mark>busier<\/mark> than the library?"], "ask": "How do short adjectives change (big→bigger)? How do longer adjectives change (relaxing→more relaxing)?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["-er", "more", "than", "-ier"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "For short adjectives (one syllable), we usually add ___: big→bigger, fast→faster.", "section": "Complete the rule", "reveal": "-er", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For adjectives ending in -y, we change y to i and add ___: busy→busier.", "section": "Complete the rule", "reveal": "-ier", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For longer adjectives, we use ___ + adjective: relaxing → more relaxing.", "section": "Complete the rule", "reveal": "more", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use the word ___ to compare two things: bigger ___ the old one.", "section": "Complete the rule", "reveal": "than", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "For short (one-syllable) adjectives, we usually add -er (big→bigger). For adjectives ending in -y, we change y to i and add -er (busy→busier). For longer adjectives, we use more + adjective (relaxing→more relaxing). We use 'than' between the two things being compared.", "tr": "Sıfatları karşılaştırırken kısa sıfatlara (tek heceli) genellikle -er eklenir (big→bigger); -y ile bitenlerde y, i'ye döner ve -er eklenir (busy→busier). İki heceden uzun sıfatlarda more + sıfat kullanılır (relaxing→more relaxing). Karşılaştırılan iki şey arasında 'than' kullanılır.", "when_en": "We use this to compare two places, services, or types of transport in our city — which is bigger, faster, more relaxing, etc.", "when": "Şehrimizdeki iki yeri, hizmeti ya da ulaşım şeklini karşılaştırırken kullanılır: hangisi daha büyük, daha hızlı, daha rahat vb.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the new mall", "big", "the old shops"], "reveal": "The new mall is bigger than the old shops.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the underground", "fast", "the bus"], "reveal": "The underground is faster than the bus.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the park", "relaxing", "the city centre"], "reveal": "The park is more relaxing than the city centre.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the library", "quiet", "the shopping mall"], "reveal": "The library is quieter than the shopping mall.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the museum", "interesting", "the old market"], "reveal": "The museum is more interesting than the old market.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / the new hospital", "modern", "the old one"], "reveal": "Is the new hospital more modern than the old one?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Compare two places in your own neighbourhood or city (for example, two parks, two shops, or two ways of travelling).", "chips": ["... is bigger than ...", "... is more ... than ...", "Is ... busier than ...?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The underground is faster than the bus.", "The park is more relaxing than the mall."], "negative": ["The bus isn't faster than the underground.", "The old museum wasn't more interesting than the new one."], "question": ["Is the new library bigger than the old one?", "Is the community centre busier than the library?"], "short": ["Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The museum is more bigger than the library.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The museum is bigger than the library.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This park is relaxinger than that one.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This park is more relaxing than that one.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "The new mall is ___ than the old shops. (big)", "section": "A · Choose the correct option.", "options": ["bigger", "more big", "biggest"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The park is ___ than the city centre. (relaxing)", "section": "A · Choose the correct option.", "options": ["relaxinger", "more relaxing", "relaxing"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The library is ___ than the mall. (quiet)", "section": "A · Choose the correct option.", "options": ["quieter", "more quiet", "quietest"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The underground is ___ (fast) than the bus.", "section": "B · Complete with the comparative form.", "reveal": "faster", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Is the new hospital ___ (modern) than the old one?", "section": "B · Complete with the comparative form.", "reveal": "more modern", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The museum is more interesting than the market.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This bus is more faster than the underground.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This bus is faster than the underground.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Which is ___ (busy), the library or the community centre?", "section": "Dialogue · Complete with the comparative form.", "reveal": "busier", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I think the community centre is ___ (busy) ___ the library.", "section": "Dialogue · Complete with the comparative form.", "reveal": "busier / than", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a comparative sentence about two parks in your city.", "section": "Dialogue · Complete with the comparative form.", "words": ["this", "park", "is", "bigger", "than", "that", "one"], "end": ".", "reveal": "This park is bigger than that one.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Conjunction 'when': linking two past events", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>When<\/mark> I visited the museum, it was raining outside.", "The bus was full <mark>when<\/mark> we arrived at the stop.", "<mark>When<\/mark> we got to the park, all the benches were taken.", "I saw my neighbour <mark>when<\/mark> I was waiting at the bus stop."], "ask": "What does 'when' connect — two nouns or two actions/events? Can 'when' come at the start or in the middle of the sentence?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["when", "comma", "two", "either"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'When' connects ___ actions or events, often in the past.", "section": "Complete the rule", "reveal": "two", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'When' can come at the start or in the middle of the sentence — it can go in ___ position.", "section": "Complete the rule", "reveal": "either", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If the 'when' clause comes first, we usually put a ___ before the main clause.", "section": "Complete the rule", "reveal": "comma", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'When' links two past events, usually showing that one happened while or as the other did. 'When' can start the sentence or come in the middle; if it starts the sentence, we use a comma before the main clause.", "tr": "'When' iki geçmiş olayı birbirine bağlar; genellikle biri diğeri olurken gerçekleşir. 'When' cümlenin başında ya da ortasında yer alabilir; başta ise, ana cümleden önce virgül kullanılır.", "when_en": "We use it to say that something else was happening or happened at the same time as a visit to a place or use of a service.", "when": "Geçmişte bir yeri ziyaret ederken ya da bir hizmetten yararlanırken aynı anda başka bir şeyin olduğunu anlatırken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I / visit the museum", "it / rain outside"], "reveal": "When I visited the museum, it was raining outside.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we / arrive at the bus stop", "the bus / be full"], "reveal": "The bus was full when we arrived at the bus stop.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / walk past the library", "I / see my teacher"], "reveal": "When I walked past the library, I saw my teacher.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, he middle of a sentence.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "When I got to the community centre, the volunteers were already there.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What happened ___ you got to the park?", "section": "Dialogue · Complete with 'when'.", "reveal": "when", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: ___ I arrived, all my friends were already there waiting for me.", "section": "Dialogue · Complete with 'when'.", "reveal": "When", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "I visited the museum. It was raining.", "section": "Dialogue · Complete with 'when'.", "reveal": "When I visited the museum, it was raining.", "prompt": "Join the two sentences with 'when'.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Question tags: checking information about the past", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You went to the new library, <mark>didn't you<\/mark>?", "The bus was late again, <mark>wasn't it<\/mark>?", "They didn't visit the museum, <mark>did they<\/mark>?", "There weren't many people at the park, <mark>were there<\/mark>?"], "ask": "When the main sentence is positive, is the tag positive or negative? What happens when the main sentence is negative?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["negative", "positive", "didn't", "wasn't"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "If the main sentence is positive, the tag is ___.", "section": "Complete the rule", "reveal": "negative", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If the main sentence is negative, the tag is ___.", "section": "Complete the rule", "reveal": "positive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After 'You went...', the tag is '___ you?'", "section": "Complete the rule", "reveal": "didn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After 'The bus was late...', the tag is '___ it?'", "section": "Complete the rule", "reveal": "wasn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastge ces", "cue": ["she / go", "to the community centre"], "reveal": "She went to the community centre, didn't she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences with question tags to check information about a place you and a partner both know.", "chips": ["You went to..., didn't you?", "It was..., wasn't it?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You went to the new library, didn't you?", "The bus was late again, wasn't it?"], "negative": ["They didn't visit the museum, did they?", "There weren't many people at the park, were there?"], "question": ["Didn't you go to the mall last week?"], "short": ["Yes, I did. / No, I didn't.", "Yes, it was. / No, it wasn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You went to the park, did you?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You went to the park, didn't you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The shop wasn't open, was it wasn't?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The shop wasn't open, was it?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You visited the museum, ___?", "section": "A · Choose the correct tag.", "options": ["didn't you", "did you", "weren't you"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The library wasn't open, ___?", "section": "A · Choose the correct tag.", "options": ["was it", "wasn't it", "did it"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "They took the bus, ___?", "section": "A · Choose the correct tag.", "options": ["did they", "didn't they", "weren't they"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "There were a lot of people at the park, ___?", "section": "B · Complete with the correct tag.", "reveal": "weren't there", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She didn't go to the community centre, ___?", "section": "B · Complete with the correct tag.", "reveal": "did she", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "'You went home, went you?' is a correct question tag.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The correct tag is 'You went home, didn't you?'", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "'The bus was late, wasn't it?' is a correct question tag.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; ya
