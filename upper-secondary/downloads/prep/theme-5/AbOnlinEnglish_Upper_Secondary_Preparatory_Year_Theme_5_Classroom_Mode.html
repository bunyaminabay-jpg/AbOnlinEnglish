wer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kavşak/göbek”", "options": ["landmark", "roundabout", "post office"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "There is / There are & Prepositions of Place", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>There is<\/mark> a pharmacy next to the bakery.", "<mark>There are<\/mark> two parks in my neighbourhood.", "The bank is <mark>opposite<\/mark> the post office."], "ask": "When do we use 'There is' and when do we use 'There are'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'There is' with singular/uncountable nouns and 'There are' with plural nouns to say what exists in a place.", "tr": "Tekil isimlerle 'There is', çoğul isimlerle 'There are' kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["There is a bank near here."], "negative": ["There isn't a subway station nearby."], "question": ["Is there a pharmacy nearby?"], "short": ["Yes, there is. / No, there isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "There is two parks.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There are two parks.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "___ (there is/are) a post office on this street.", "section": "", "reveal": "There is", "note": "St
