alf 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Solar System", "num": 2, "total": 3, "text": "Earth is special because it has an atmosphere that we can breathe and a perfect distance from the Sun, which keeps the temperature comfortable for life. Astronauts who travel to other planets have to wear special suits, because those planets don't have a breathable atmosphere.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Solar System", "num": 3, "total": 3, "text": "The Moon is Earth's only natural satellite. It doesn't have its own light — it simply reflects light from the Sun. Many other planets in our solar system, like Jupiter and Saturn, have several moons.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Which planet is closest to the Sun?", "section": "While you read", "options": ["Earth", "Mercury", "Neptune", "Mars"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The Moon is Earth's only natural ___.", "section": "While you read", "reveal": "satellite", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Astronauts don't have to wear special suits on other planets.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They have to wear special suits.", "note": "Thumbs up = correct, thum
