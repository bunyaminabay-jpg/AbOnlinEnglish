They survived the storm in a small cabin.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "breathtaking", "pos": "adjective", "ipa": "/ˈbreθteɪkɪŋ/", "tr": "nefes kesici", "example": "The view from the top was breathtaking.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“tipi/kar fırtınası”", "options": ["waterfall", "storm", "blizzard"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“nefes kesici”", "options": ["flood", "waterfall", "breathtaking"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kuraklık”", "options": ["trail", "drought", "blizzard"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“hayatta kalmak”", "options": ["survive", "heatwave", "breathtaking"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“patika/yol”", "options": ["storm", "trail", "hiking"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sel”", "options": ["heatwave", "flood", "hiking"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Present Continuous — Activities Happening Now", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Look! It <mark>is raining<\/mark> heavily.", "We <mark>are hiking<\/mark> along the river right now.", "The wind <mark>is getting<\/mark> stronger."], "ask": "What do you notice about the verb forms? Are these actions happening now or generally?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use the present continuous (am/is/are + verb-ing) for actions happening right now.", "tr": "Şu anda gerçekleşen eylemler için şimdiki zaman (am/is/are + fiil-ing) kullanılır.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["It is raining now."], "negative": ["We aren't camping this weekend."], "question": ["Is it snowing outside?"], "short": ["Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "It rains right now.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It is raining right now.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "Look! It ___ (rain) heavily outside.", "section": "", "reveal": "is raining", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ (not/hike) today because of the storm.", "section": "", "reveal": "aren't hiking", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct question.", "section": "", "options": ["Does it snowing?", "Is it snowing?", "It is snowing?", "Is snowing it?"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite: the wind gets stronger now.", "section": "", "reveal": "The wind is getting stronger now.", "prompt": "Use present continuous", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Camping Near the Waterfall", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Have you ever been camping? Where?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Camping Near the Waterfall", "num": 1, "total": 3, "text": "Last weekend, Kerem and his friends went camping near a beautiful waterfall in the mountains. They packed good equipment: a strong tent, warm sleeping bags, and plenty of water.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Camping Near the Waterfall", "num": 2, "total": 3, "text": "On the first night, dark clouds appeared and a sudden storm began. \"Look, it's raining hard!\" shouted Kerem, as they quickly tied down the tent. Luckily, their equipment helped them survive the night safely.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Camping Near the Waterfall", "num": 3, "total": 3, "text": "The next morning, the sky was clear again, and the view of the waterfall was breathtaking. The group followed a long trail through the forest before heading home, tired but happy.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What happened on the first night?", "section": "While you read", "options": ["A heatwave", "A storm", "A drought", "A blizzard"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The group followed a long ___ through the forest.", "section": "While you read", "reveal": "trail", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The view of the waterfall the next morning was disappointing.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The view was breathtaking.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Describe an outdoor adventure you have had or would like to have."], "timer": 180, "note": "Group discussion, then share. / Grup udge", "q": "'Breathtaking' describes something very impressive.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "We ___ (not/camp) this weekend because of the storm.", "section": "Exit ticket", "reveal": "aren't camping", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What weather warning was given in the listening?", "section": "Exit ticket", "options": ["Heatwave", "Blizzard", "Drought", "Flood"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Ekipman' means ___.", "section": "Exit ticket", "options": ["equipment", "trail", "waterfall", "storm"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "They went ___ near a beautiful waterfall.", "section": "Exit ticket", "reveal": "camping", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Lise Hazırlık · Theme 7 · Life in Nature", "key": "prep-7"}</script></body></html>
