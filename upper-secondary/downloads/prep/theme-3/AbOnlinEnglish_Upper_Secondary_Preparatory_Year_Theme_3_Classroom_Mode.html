e end of this theme…", "list": ["I can describe someone's appearance.", "I can talk about clothes and fashion preferences.", "I can describe personality traits.", "I can compare my personality with a friend's."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["13 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "appearance", "pos": "noun", "ipa": "/əˈpɪərəns/", "tr": "görünüş", "example": "Her appearance is neat and simple.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "curly", "pos": "adjective", "ipa": "/ˈkɜːrli/", "tr": "kıvırcık", "example": "He has short curly hair.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "slim", "pos": "adjective", "ipa": "/slɪm/", "tr": "ince/zayıf", "example": "She is tall and slim.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "freckles", "pos": "noun", "ipa": "/ˈfrekəlz/", "tr": "çil", "example": "My little sister has freckles on her nose.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "outfit", "pos": "noun", "ipa": "/ˈaʊtfɪt/", "tr": "kıyafet", "example": "I chose a comfortable outfit for the trip.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "fashionable", "pos": "adjective", "ipa": "/ˈfæʃənəbəl/", "tr": "modaya uygun", "example": "She always wears fashionable clothes.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "casual", "pos": "adjective", "ipa": "/ˈkæʒuəl/", "tr": "günlük/rahat", "example": "I prefer casual clothes at the weekend.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "outgoing", "pos": "adjective", "ipa": "/ˈaʊtgoʊɪŋ/", "tr": "girişken/sosyal", "example": "My best friend is very outgoing and friendly.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "shy", "pos": "adjective", "ipa": "/ʃaɪ/", "tr": "utangaç", "example": "He is shy with people he doesn't know.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "generous", "pos": "adjective", "ipa": "/ˈdʒenərəs/", "tr": "cömert", "example": "My grandfather is very generous with his time.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "stubborn", "pos": "adjective", "ipa": "/ˈstʌbərn/", "tr": "inatçı", "example": "My brother is stubborn; he never changes his mind.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "reliable", "pos": "adjective", "ipa": "/rɪˈlaɪəbəl/", "tr": "güvenilir", "example": "She is a reliable friend who always helps.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "personality", "pos": "noun", "ipa": "/ˌpɜːrsəˈnæləti/", "tr": "kişilik", "example": "He has a strong, confident personality.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kişilik”", "options": ["personality", "casual", "appearance"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“güvenilir”", "options": ["reliable", "fashionable", "generous"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kıvırcık”", "options": ["curly", "generous", "fashionable"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“günlük/rahat”", "options": ["appearance", "casual", "curly"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“görünüş”", "options": ["curly", "outfit", "appearance"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kıyafet”", "options": ["fashionable", "outgoing", "outfit"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Have got & Adjective Order — Describing People", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["She <mark>has got<\/mark> long curly hair.", "He's got a small, round face.", "I've got two brown eyes and freckles."], "ask": "What do you notice about the order of the adjectives (small, round)?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'have got' to describe physical features. Adjectives usually go in this order: opinion/size, then colour/shape, then noun.", "tr": "Fiziksel özellikleri anlatmak için 'have got' kullanılır. Sıfatlar genelde boyut, sonra renk/şekil, sonra isim sırasıyla dizilir.", "note": ""}, {"type": "form", "title": "Form", "form": {"positive": ["She has got blue eyes."], "negative": ["He hasn't got a beard."], "question": ["Has she got curly hair?"], "short": ["Yes, she has. / No, she hasn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She have got long hair.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She has got long hair.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "She ___ (have got) curly brown hair.", "section": "", "reveal": "has got", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct adjective order.", "section": "", "options": ["a round small face", "a small round face", "a face small round", "round a small face"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ he got a beard? (question)", "section": "", "reveal": "Has", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Order the words: hair / has / long / curly / she", "section": "", "words": ["she", "has", "curly", "long", "hair"], "end": ".", "reveal": "She has curly long hair.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Twins, But Very Different", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you know any twins? Are they similar or different?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Twins, But Very Different", "num": 1, "total": 3, "text": "Selin and Sena are twin sisters, but they look and act very differently. Selin has got short curly hair and freckles across her nose. She usually wears casual, comfortable clothes and loves trainers.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Twins, But Very Different", "num": 2, "total": 3, "text": "Sena, on the other hand, has got long straight hair and always chooses fashionable outfits. She is outgoing and loves meeting new people, while Selin is quieter and a little shy in big groups.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Twins, But Very Different", "num": 3, "total": 3, "text": "Even though they look different, both sisters are known for being reliable. If they promise to help a friend, they always keep their word.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What kind of hair does Selin have?", "section": "While you read", "options": ["Long straight", "Short curly", "Long curly", "Short straight"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Sena is ___ and loves meeting new people.", "section": "While you read", "reveal": "outgoing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Both sisters are described as reliable.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Describe a friend or family member's appearance and personality."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Describing a Classmate", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["How would you describe your best friend's appearance?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Describing a Classmate", "audio": null, "transcript": [{"speaker": "A", "line": "Can you describe the new student for me?"}, {"speaker": "B", "line": "Sure. She's tall and slim. She's got brown hair and brown eyes."}, {"speaker": "A", "line": "What is she like?"}, {"speaker": "B", "line": "She's very outgoing — she already has a lot of friends. And she's really generous too."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What colour is the classmate's hair?", "section": "While you listen", "options": ["Black", "Brown", "Blonde", "Red"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The classmate is described as shy.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is described as outgoing.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Guess Who", "text": "Describe a classmate's appearance and personality without saying their name. The group guesses who it is.", "steps": ["Choose a classmate secretly.", "Describe their appearance in two sentences.", "Describe their personality in one sentence.", "Group members guess the name."], "chips": ["He/She has got...", "He/She is...", "He/She usually wears..."], "timer": 600, "levels": ["", "", ""], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Describe Yourself", "text": "Write a paragraph describing your own appearance, the clothes you usually wear, and two personality traits.", "steps": ["Describe your hair and general appearance using have got.", "Describe the clothes you usually wear.", "Name two personality traits and give an example."], "chips": [], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "'Cömert' means ___.", "section": "Exit ticket", "options": ["stubborn", "generous", "shy", "reliable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She ___ (have got) long curly hair.", "section": "Exit ticket", "reveal": "has got", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What colour hair does the classmate in the listening have?", "section": "Exit ticket", "options": ["Black", "Brown", "Blonde", "Grey"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Sena wears casual clothes and loves trainers.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "That is Selin, not Sena.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "He is ___; he never changes his mind.", "section": "Exit ticket", "reveal": "stubborn", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct adjective order.", "section": "Exit ticket", "options": ["a curly short hair", "a short curly hair style", "hair short curly", "curly a short hair"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "'Utangaç' means ___.", "section": "Exit ticket", "options": ["outgoing", "shy", "slim", "fashionable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ she got freckles? (question)", "section": "Exit ticket", "reveal": "Has", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Lise Hazırlık · Theme 3 · Personal Life", "key": "prep-3"}</script></body></html>
