 diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["Simple Present", "Present Progressive", "habits", "now"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use the ___ for habits, routines and general facts (usually, always, every day).", "section": "Complete the rule", "reveal": "Simple Present", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use the ___ for actions happening right now, at the moment of speaking (now, at the moment, look!).", "section": "Complete the rule", "reveal": "Present Progressive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Elif usually wears jeans' describes her ___.", "section": "Complete the rule", "reveal": "habits / habit", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'She is wearing a dress today' describes what is happening ___.", "section": "Complete the rule", "reveal": "now", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "The Simple Present describes habits, general facts and things that happen regularly (with usually, always, every day). The Present Progressive describes actions happening right now, at the moment of speaking (with now, at the moment, right now, look!).", "tr": "Simple Present alışkanlıkları, genel gerçekleri ve düzenli olan şeyleri anlatır (usually, always, every day gibi zaman zarflarıyla). Present Progressive ise şu anda, konuşma anında olan eylemleri anlatır (now, at the moment, right now, look!).", "when_en": "We use this contrast to separate someone's usual style or habits (Simple Present) from what they are wearing or doing right now (Present Progressive).", "when": "Bir kişinin genel giyim tarzını/alışkanlığını (Simple Present) ile o anda ne giydiğini/yaptığını (Present Progressive) ayırt etmek için kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Deniz", "usually / wear", "trainers"], "reveal": "Deniz usually wears trainers.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["right now / Deniz", "wear", "smart shoes for the interview"], "reveal": "Right now, Deniz is wearing smart shoes for the interview.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my mum", "usually / not like", "stripy clothes"], "reveal": "My mum usually doesn't like stripy clothes.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["at the moment / my mum", "try on", "a spotted dress"], "reveal": "At the moment, my mum is trying on a spotted dress.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you / usually", "get dressed", "quickly"], "reveal": "Do you usually get dressed quickly?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences about yourself: one with the Simple Present about your usual style, and one with the Present Progressive about what you are wearing today.", "chips": ["I usually wear …", "Today, I am wearing …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Deniz usually wears trainers. (habit)", "Deniz is wearing smart shoes today. (now)"], "negative": ["My mum doesn't usually wear stripy clothes.", "She isn't wearing a coat right now."], "question": ["Do you usually get dressed quickly?", "Is she trying on that dress now?"], "short": ["Yes, I do.", "Yes, she is."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Look! She wears a lovely dress.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Look! She is wearing a lovely dress.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I am liking spotted clothes.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I like spotted clothes.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Elif usually ___ jeans, but today she ___ a dress.", "section": "A · Choose the correct option.", "options": ["wears / is wearing", "is wearing / wears", "wear / wearing"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Look! My brother ___ a beard this month.", "section": "A · Choose the correct option.", "options": ["grows", "is growing", "grow"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ uniform on Fridays usually.", "section": "A · Choose the correct option.", "options": ["don't wear", "aren't wearing", "not wear"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I ___ new shoes right now.", "section": "A · Choose the correct option.", "options": ["try on", "am trying on", "tries on"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My mum ___ (not like) stripy clothes usually.", "section": "B · Complete with the correct form.", "reveal": "doesn't like", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "At the moment, my mum ___ (try on) a spotted dress.", "section": "B · Complete with the correct form.", "reveal": "is trying on", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I am liking your new outfit.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I like your new outfit.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Deniz usually wears trainers, but today he is wearing smart shoes.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: You ___ (wear) something new today — what is it?", "section": "Dialogue · Complete with the correct tense.", "reveal": "are wearing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I ___ (usually / not wear) dresses, but today is special.", "section": "Dialogue · Complete with the correct tense.", "reveal": "don't usually wear / usually don't wear", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "She wears jeans every day.", "section": "Dialogue · Complete with the correct tense.", "reveal": "She is wearing a skirt right now.", "prompt": "Change it to describe what she is wearing right now (a skirt).", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Possessive 's, possessive pronouns and Whose…?", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["That is <mark>Zeynep's<\/mark> jacket — it's <mark>hers<\/mark>, not mine.", "<mark>Whose<\/mark> trainers are these? They're <mark>Kerem's<\/mark>.", "This is <mark>my<\/mark> scarf, and that blue one is <mark>yours<\/mark>.", "Our teacher's office is next to the <mark>boys'<\/mark> changing room."], "ask": "How do we show that something belongs to someone? What question do we ask to find out?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["'s", "Whose", "possessive pronouns", "s'"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "To show something belongs to a singular person, we add ___ to the name: Zeynep's jacket.", "section": "Complete the rule", "reveal": "'s", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "To show something belongs to a plural noun ending in -s, we usually just add ___: the boys' changing room.", "section": "Complete the rule", "reveal": "s' / '", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ask ___ …? to find out who something belongs to.", "section": "Complete the rule", "reveal": "Whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "mine, yours, his, hers, ours, theirs are called ___.", "section": "Complete the rule", "reveal": "possessive pronouns", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We add 's to a singular noun to show possession, and just ' to a plural noun ending in -s (the boys'). Possessive pronouns (mine, yours, his, hers, ours, theirs) replace a noun so we don't repeat it. We use Whose…? to ask who something belongs to.", "tr": "Bir şeyin kime ait olduğunu göstermek için tekil isimlere 's, çoğul -s ile biten isimlere ise sadece ' eklenir (the boys'). Possessive pronouns (mine, yours, his, hers, ours, theirs) isim tekrarını önler. Whose…? sorusu 'kimin' anlamına gelir ve sahiplik sorar.", "when_en": "We use this to say or ask who an item of clothing or a belonging belongs to.", "when": "Bir eşyanın (kıyafet, çanta vb.) kime ait olduğunu söylerken ya da sorarken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Zeynep", "jacket"], "reveal": "That's Zeynep's jacket.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / whose", "trainers", "these"], "reveal": "Whose trainers are these?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Kerem", "they"], "reveal": "They're Kerem's.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this scarf / mine", "that one / yours"], "reveal": "This scarf is mine, and that one is yours.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the boys", "changing room"], "reveal": "That's the boys' changing room.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / whose is", "this stripy jumper"], "reveal": "Whose is this stripy jumper?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences using 's, a possessive pronoun, and Whose…? about clothes or things in your classroom.", "chips": ["That's ___'s …", "This … is mine / yours / …", "Whose … is this?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["That is Zeynep's jacket.", "This scarf is mine."], "negative": ["This isn't my scarf — it's hers.", "These aren't the boys' trainers."], "question": ["Whose trainers are these?", "Is this jumper yours?"], "short": ["They're Kerem's.", "Yes, it's mine."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the Kerem's bag.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is Kerem's bag.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Whose is these trainers?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Whose trainers are these?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "That jacket is ___ — it belongs to Zeynep.", "section": "A · Choose the correct option.", "options": ["Zeynep", "Zeynep's", "Zeynep s"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ trainers are these?", "section": "A · Choose the correct option.", "options": ["Who", "Whose", "Which"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This scarf is mine, and that one is ___.", "section": "A · Choose the correct option.", "options": ["your", "yours", "you"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "That's the ___ changing room.", "section": "A · Choose the correct option.", "options": ["boys", "boy's", "boys'"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ (kimin) is this spotted scarf?", "section": "B · Complete with the correct word.", "reveal": "Whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This jumper isn't mine, it's ___ (his).", "section": "B · Complete with the correct word.", "reveal": "his", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "This is the Elif's bag.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is Elif's bag.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Whose trainers are these? They're Kerem's.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ jacket is this on the chair?", "section": "Dialogue · Complete with 's, a possessive pronoun or Whose.", "reveal": "Whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Oh, it's ___ (mine) — thank you!", "section": "Dialogue · Complete with 's, a possessive pronoun or Whose.", "reveal": "mine", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question.", "section": "Dialogue · Complete with 's, a possessive pronoun or Whose.", "words": ["whose", "trainers", "are", "these"], "end": "?", "reveal": "Whose trainers are these?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-4", "title": "Gramer 5", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Question tags (Simple Present, Present Progressive)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You like this outfit, <mark>don't you<\/mark>?", "Zeynep doesn't wear glasses, <mark>does she<\/mark>?", "You're wearing your new trainers today, <mark>aren't you<\/mark>?", "He isn't trying on the jacket, <mark>is he<\/mark>?"], "ask": "How does the question tag change after a positive sentence? And after a negative sentence?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["opposite", "don't you", "aren't you", "positive"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "After a ___ sentence, the question tag is usually negative: You like it, don't you?", "section": "Complete the rule", "reveal": "positive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After a negative sentence, the question tag is ___.", "section": "Complete the rule", "reveal": "opposite / positive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'You like this outfit,' + tag = ___?", "section": "Complete the rule", "reveal": "don't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'You're wearing your trainers,' + tag = ___?", "section": "Complete the rule", "reveal": "aren't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A question tag is a short question added to the end of a sentence, usually to check information. A positive sentence takes a negative tag, and a negative sentence takes a positive tag. The tag matches the auxiliary verb (do/does, am/is/are) and the subject.", "tr": "Question tag, cümlenin sonuna eklenen ve genellikle bir şeyi doğrulamak için sorulan kısa bir sorudur. Olumlu cümleden sonra olumsuz tag, olumsuz cümleden sonra olumlu tag gelir. Tag, cümledeki yardımcı fiile (do/does, am/is/are) ve özneye göre değişir.", "when_en": "We use question tags to check information or keep a conversation going, especially when talking about appearance, clothes and personality.", "when": "Bir bilgiyi doğrulamak ya da sohbeti sürdürmek için, özellikle görünüş, kıyafet ve kişilik hakkında konuşurken kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["You like this outfit"], "reveal": "You like this outfit, don't you?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Zeynep doesn't wear glasses"], "reveal": "Zeynep doesn't wear glasses, does she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["You're wearing your new trainers today"], "reveal": "You're wearing your new trainers today, aren't you?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["He isn't trying on the jacket"], "reveal": "He isn't trying on the jacket, is he?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Your sister has curly hair"], "reveal": "Your sister has curly hair, doesn't she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about a classmate with a question tag (about their appearance, clothes or personality), and check with a partner.", "chips": ["You have …, don't you?", "You're wearing …, aren't you?", "She doesn't …, does she?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You like this outfit, don't you? (positive statement + negative tag)"], "negative": ["Zeynep doesn't wear glasses, does she? (negative statement + positive tag)"], "question": ["You're wearing your new trainers, aren't you?"], "short": ["Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You like this outfit, do you?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You like this outfit, don't you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She isn't wearing a coat, isn't she?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She isn't wearing a coat, is she?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You like this outfit, ___?", "section": "A · Choose the correct tag.", "options": ["don't you", "do you", "aren't you"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Zeynep doesn't wear glasses, ___?", "section": "A · Choose the correct tag.", "options": ["doesn't she", "does she", "isn't she"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You're wearing your new trainers, ___?", "section": "A · Choose the correct tag.", "options": ["are you", "aren't you", "don't you"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "He isn't trying on the jacket, ___?", "section": "A · Choose the correct tag.", "options": ["is he", "isn't he", "does he"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Your sister has curly hair, ___ (değil mi)?", "section": "B · Complete with the correct tag.", "reveal": "doesn't she", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You aren't wearing your uniform today, ___?", "section": "B · Complete with the correct tag.", "reveal": "are you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She likes fashion, doesn't she?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "They aren't trying on shoes, aren't they?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They aren't trying on shoes, are they?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: You get on well with your classmates, ___?", "section": "Dialogue · Complete with the correct tag.", "reveal": "don't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I do! We aren't in the same class this year, ___?", "section": "Dialogue · Complete with the correct tag.", "reveal": "are we", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a tag question.", "section": "Dialogue · Complete with the correct tag.", "words": ["your", "brother", "has", "a", "beard,", "doesn't", "he"], "end": "?", "reveal": "Your brother has a beard, doesn't he?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "My Best Friend, Zeynep", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What information do you think the text will include about Zeynep?", "Guess: what three adjectives might describe a good friend?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My Best Friend, Zeynep", "num": 1, "total": 5, "text": "My name is Aslı and I want to tell you about my best friend, Zeynep. We are in the same class, and we get on well with each other. Zeynep is fourteen years old, and she has long curly brown hair and big brown eyes.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Best Friend, Zeynep", "num": 2, "total": 5, "text": "Zeynep isn't very tall, but she is quite slim and always looks stylish. She usually wears comfortable clothes, like jeans and a stripy jumper, but today she is wearing a spotted dress for a school photo.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Best Friend, Zeynep", "num": 3, "total": 5, "text": "As for her personality, Zeynep is very cheerful and generous. She always shares her lunch with me, and she never gets angry, even when things go wrong. She's also hard-working — she studies every evening after school.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Best Friend, Zeynep", "num": 4, "total": 5, "text": "Zeynep isn't shy at all. She loves talking to new people, and she gets on well with everyone in our class. The only thing is, she can be a little stubborn — when she decides something, she doesn't change her mind easily!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Best Friend, Zeynep", "num": 5, "total": 5, "text": "I'm really lucky to have a friend like Zeynep. She always makes me laugh, and I know I can trust her with anything.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A description of Aslı's best friend", "A description of a school trip", "How to make new friends"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What colour is Zeynep's hair?", "section": "While you read", "options": ["Straight and black", "Curly and brown", "Short and blonde"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Zeynep wearing today?", "section": "While you read", "options": ["Jeans and a stripy jumper", "A spotted dress", "A school uniform"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In paragraph 3, what does 'her' refer to?", "section": "While you read", "options": ["Aslı's", "Zeynep's", "the teacher's"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep gets angry very often.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Zeynep never gets angry, even when things go wrong.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What is one thing that makes Zeynep stubborn?", "section": "While you read", "options": ["She never changes her mind once she decides something", "She doesn't like new people", "She doesn't do her homework"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Write two sentences describing your own best friend's appearance.", "Compare Zeynep with your best friend. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "How to Write a Great Fact File", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think a 'fact file' about a person includes? Guess two things.", "Have you ever interviewed someone? What questions did you ask?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "How to Write a Great Fact File", "num": 1, "total": 5, "text": "A fact file is a short text that gives information about a person. At the end of Theme 3, you are going to interview a classmate and write a fact file about them, so let's look at a good example first.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "How to Write a Great Fact File", "num": 2, "total": 5, "text": "This is Deniz's fact file, written by his classmate Mert: 'Deniz is fifteen years old. He is tall and has short straight hair and dark brown eyes. He usually wears casual clothes, like a hoodie and trainers, because he thinks they are comfortable.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "How to Write a Great Fact File", "num": 3, "total": 5, "text": "Mert continues: 'Deniz's personality is easy to describe — he is friendly, cheerful and very generous. He always helps his classmates with their homework, and he gets on well with everyone in our year. He isn't shy at all!'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "How to Write a Great Fact File", "num": 4, "total": 5, "text": "Notice how Mert uses the Simple Present for facts (he is, he wears) and clear vocabulary for appearance and personality. He also organises the fact file into two parts: appearance first, then personality.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "How to Write a Great Fact File", "num": 5, "total": 5, "text": "When you write your own fact file, remember to interview your classmate carefully, take notes, and use a mix of appearance and personality words. Don't forget to check your grammar before you present it to the class!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["How to plan a school trip", "How to write a good fact file about a person", "The history of interviews"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who wrote the example fact file?", "section": "While you read", "options": ["Deniz", "Mert", "The teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Deniz usually wear?", "section": "While you read", "options": ["A suit and smart shoes", "A hoodie and trainers", "A stripy shirt"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which tense does Mert mainly use in the fact file?", "section": "While you read", "options": ["Present Progressive", "Past Simple", "Simple Present"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The fact file only describes Deniz's appearance, not his personality.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The fact file describes both Deniz's appearance and his personality.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what should you do before presenting your fact file?", "section": "While you read", "options": ["Translate it into Turkish", "Check your grammar", "Make it as long as possible"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["List three questions you could ask a classmate for your own fact file interview.", "Which two personality adjectives would you like someone to use about you? Why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "What's She Wearing Today?", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students talking about what a classmate is wearing today.", "Predict: what two clothing items might they mention?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "What's She Wearing Today?", "audio": null, "transcript": [{"speaker": "Deniz", "line": "Look at Elif today — she's wearing a really nice outfit!"}, {"speaker": "Kerem", "line": "Yes, I can see. Is that a new jacket?"}, {"speaker": "Deniz", "line": "I think so. She's wearing a stripy jumper under it, and spotted trousers."}, {"speaker": "Kerem", "line": "Wow, spotted trousers? That's a bold combination!"}, {"speaker": "Deniz", "line": "She always tries on interesting clothes. She doesn't usually wear plain colours."}, {"speaker": "Kerem", "line": "I like it. Are those new trainers, too?"}, {"speaker": "Deniz", "line": "Yes, they look really comfortable. She got dressed quickly this morning, I think — the bus was early!"}, {"speaker": "Kerem", "line": "Ha! Well, she still looks great."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are Deniz and Kerem talking about?", "section": "While you listen", "options": ["Elif's homework", "What Elif is wearing today", "A new student"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Elif wearing under her jacket?", "section": "While you listen", "options": ["A spotted jumper", "A stripy jumper", "A plain T-shirt"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Elif usually wear, according to Deniz?", "section": "While you listen", "options": ["Plain colours", "Bold, interesting clothes", "A school uniform"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Kerem ask about at the end?", "section": "While you listen", "options": ["Elif's bag", "Elif's trainers", "Elif's hair"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Elif got dressed slowly this morning.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif got dressed quickly this morning because the bus was early.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Do you usually wear bold colours and patterns, or plain colours? Why?", "Write one sentence with the Present
