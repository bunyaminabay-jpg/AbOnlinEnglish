.pres{--c:#2766D6;--ink:#131F3A;--muted:#5B6680;--line:#D9DEE8;--paper:#FFFFFF;--soft:#F2F4F8;
  position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--paper);color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pres *{box-sizing:border-box}
.pres button{font-family:inherit}
.pbar{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,2vw,24px);border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.pbrand{font:700 1rem/1 var(--sans,"Outfit");text-decoration:none;color:var(--ink);white-space:nowrap}
.pbrand .b1{color:#D9602A}.pbrand .b3{color:#23835A}
.pdecks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.pdeck{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.pdeck[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ptools{display:flex;gap:6px}
.ptool{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.ptool:hover{border-color:var(--c)}
.ptool kbd{font:600 .7rem/1 monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
@media (max-width:900px){.ptool kbd,.ptool .tl{display:none}}
.pstage{overflow:auto;display:grid;place-items:center;padding:clamp(16px,3vw,48px);border-top:6px solid var(--c)}
.pscreen{width:min(1200px,100%)}

.p-title h1{font:700 clamp(2.6rem,7vw,6rem)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 .4em}

.ptrl{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--muted);margin:0 0 1em}
.ptrl b{font:700 .7em/1 monospace;background:var(--soft);padding:3px 6px;border-radius:4px;margin-right:6px}
.pchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:.8em}

.pchips.alt span{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff);font-weight:600}
.pchips.big span{font-size:clamp(1.3rem,2.6vw,2.2rem)}
.plist{font-size:clamp(1.3rem,2.8vw,2.4rem);line-height:1.4;padding-left:1.2em;margin:0}

.plist.small{font-size:clamp(1.1rem,2vw,1.7rem)}
.p-word{text-align:center}
.pw{font:700 clamp(3rem,10vw,8rem)/1 "Outfit",sans-serif;color:var(--c);letter-spacing:-.01em}
.pwm{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--muted);margin:.4em 0 1em;display:flex;gap:10px;justify-content:center;align-items:center}
.psay{border:0;background:var(--soft);border-radius:50%;width:56px;height:56px;font-size:1.5rem;cursor:pointer}
.phide{opacity:.08;filter:blur(8px);cursor:pointer;transition:all .25s}

.ptr{font:700 clamp(1.6rem,4vw,3.2rem)/1.2 "Outfit",sans-serif;margin:0 0 .4em}
.pex{font-size:clamp(1.2rem,2.5vw,2.1rem);font-style:italic;color:var(--ink);margin:0}
.pnotice{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:.5em}
.pnotice li{font-size:clamp(1.3rem,3vw,2.5rem);padding:.35em .6em;border-radius:12px;background:var(--soft);opacity:.08}
.pnotice li.on{opacity:1}
.pnotice mark{background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--ink);padding:0 .15em;border-radius:6px;font-weight:700}
.pask{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;opacity:0}
.pask.on{opacity:1}
.p-rule .pbig{font-weight:600}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pform div{background:var(--soft);border-radius:14px;padding:18px}
.pform h3{font:700 .95rem/1 "Outfit",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.pform p{font-size:clamp(1.1rem,2vw,1.7rem);margin:0 0 .3em}
.pq{font:600 clamp(1.6rem,4vw,3.4rem)/1.3 "Outfit",sans-serif;margin:0 0 .6em}
.pblank{display:inline-block;width:3.2em;border-bottom:4px solid var(--c);margin:0 .15em;vertical-align:-.1em}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.popt{display:flex;gap:14px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:.6em .9em;font-size:clamp(1.2rem,2.6vw,2.2rem);cursor:pointer;color:var(--ink)}
.popt b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);font-size:.7em;flex:none}

.popt.right{border-color:#23835A;background:#E1F3EA}

.popt.dim{opacity:.4}
.pans{font:700 clamp(1.4rem,3.2vw,2.8rem)/1.3 "Outfit",sans-serif;color:#23835A;margin:.6em 0 0;opacity:0}

.pans.big{font-size:clamp(1.6rem,3.8vw,3.2rem)}
.pcues{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pcues span{font:600 clamp(1.3rem,3vw,2.6rem)/1.2 "Outfit",sans-serif;padding:.3em .7em;border-radius:14px;border:3px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pcues i{font-style:normal;font-size:2rem;color:var(--muted)}
.porder-line{min-height:3.4em;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}

.pchipw{font:600 clamp(1.2rem,2.6vw,2.2rem)/1 "Outfit",sans-serif;padding:.4em .7em;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}

.ptrans.on{opacity:1}

.muted{color:var(--muted)}

.pres.printing{position:static;display:block}

ote": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“fikrini değiştirmek, ikna olmak”", "options": ["conflict", "back down", "come round"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“aralarını düzeltmek”", "options": ["work out", "common ground", "patch up"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“empati”", "options": ["tension", "come round", "empathy"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“gerginlik”", "options": ["perspective", "common ground", "tension"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Reported Speech: Statements and Questions", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The new intern told her supervisor that she <mark>had already sent<\/mark> the email twice.", "My brother said he <mark>was going to<\/mark> sort things out with our neighbour that evening.", "The counsellor asked the students <mark>if they wanted<\/mark> to talk about the disagreement.", "She asked her colleague <mark>why he hadn't mentioned<\/mark> the problem earlier."], "ask": "Which sentences report something someone said (a statement), and which report a question someone asked? What happens to the verb tense and the word order?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["backshifts one tense back", "if/whether", "statement word order (subject + verb)"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "In reported speech, the verb generally ___.", "section": "Complete the rule", "reveal": "backshifts one tense back", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Reported yes/no questions use ___ before the subject and verb, with no auxiliary at the front.", "section": "Complete the rule", "reveal": "if/whether", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Both reported statements and reported questions use ___, and lose the question mark.", "section": "Complete the rule", "reveal": "statement word order (subject + verb)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "In reported speech, the reporting verb (said, told, asked) is usually in the Simple Past, and the tense of the original words backshifts one step: 'I am' → 'was'; 'I did' → 'had done'. In reported questions, we use the question word or if/whether, but keep statement word order (no auxiliary before the subject) and no question mark.", "tr": "Reported speech (aktarılan konuşma) kullanırken, konuşma fiili (said, told, asked) genellikle Simple Past'te olur ve alıntılanan cümledeki fiil bir zaman geriye kayar (backshift): 'I am' → 'was'; 'I did' → 'had done'. Soru cümlelerinde soru sözcüğü ya da if/whether kullanılır, ancak kelime sırası düz bir cümle gibi olur (yardımcı fiil özneden önce gelmez) ve soru işareti kullanılmaz.", "when_en": "We use reported speech to tell someone else what a person said or asked — especially useful for explaining exactly who said what during a disagreement.", "when": "Birinin ne söylediğini ya da sorduğunu — özellikle bir anlaşmazlık ya da tartışma sırasında kimin ne dediğini — başka birine aktarırken reported speech kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Ayşe / say", "'I / feel / left out'"], "reveal": "Ayşe said (that) she felt left out.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["the manager / tell / the team", "'we / need / to talk about / this / openly'"], "reveal": "The manager told the team (that) they needed to talk about it openly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Deniz / say", "'I / didn't mean / to upset / anyone'"], "reveal": "Deniz said (that) he hadn't meant to upset anyone.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the teacher / ask / the boys", "'why / are / you / arguing?'"], "reveal": "The teacher asked the boys why they were arguing.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Elif / ask / her friend", "'do / you / want / to talk / about it?'"], "reveal": "Elif asked her friend if she wanted to talk about it.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / the mediator / ask / both sides", "'what / would / help / you / most?'"], "reveal": "The mediator asked both sides what would help them most.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Think of a real or imagined disagreement. Write four sentences reporting what each person said or asked, using reported statements and reported questions.", "chips": ["She told me that…", "He said he…", "I asked him why…", "They asked us if…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["She said (that) she was sorry.", "He told me he had already apologised."], "negative": ["He said he hadn't meant to shout.", "She told us she didn't agree with the decision."], "question": ["She asked if I was free to talk.", "He asked why they hadn't sorted it out sooner."], "short": ["He said he was. / He said he wasn't.", "Reported questions have no short answers — restate the full clause instead."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She said that she is sorry.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She said that she was sorry.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He asked did I agree with him.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He asked if I agreed with him.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She asked me what did I want.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She asked me what I wanted.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Kaan said that he ___ the message before the meeting.", "section": "A · Choose the correct option.", "options": ["hadn't seen", "doesn't see", "isn't seeing"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The manager asked the team ___ they could meet on Friday instead.", "section": "A · Choose the correct option.", "options": ["if", "what", "because"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She asked me why ___ upset the day before.", "section": "A · Choose the correct option.", "options": ["I was", "was I", "I am"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "He said (that) he ___ (not / mean) to interrupt her.", "section": "B · Complete with the correct form.", "reveal": "hadn't meant", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "They asked us ___ we wanted to join the discussion.", "section": "B · Complete with the correct form.", "reveal": "if", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The teacher asked why the students ___ (argue) again.", "section": "B · Complete with the correct form.", "reveal": "were arguing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She said that she is sorry for the misunderstanding.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She said that she was sorry for the misunderstanding.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "He asked me if I agreed with the plan.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The coach asked why did the players stop talking to each other.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The coach asked why the players had stopped talking to each other.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What did Elif say about the argument? B: She said (that) she ___ (not / want) to fight anymore.", "section": "Dialogue · Complete with the correct reported form.", "reveal": "didn't want", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A: Did the teacher ask any questions? B: Yes — she asked us why we ___ (not / sort out) it ourselves.", "section": "Dialogue · Complete with the correct reported form.", "reveal": "hadn't sorted out", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "sorry / said / that / he / truly / he / was", "section": "Dialogue · Reorder the sentence.", "words": ["he", "said", "that", "he", "was", "truly", "sorry"], "end": ".", "reveal": "He said that he was truly sorry.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "First & Second Conditional: Offering Solutions and Advice", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["If we <mark>talk<\/mark> about it honestly, we'll probably find a solution.", "If I <mark>were<\/mark> you, I would apologise before things get worse.", "If both sides <mark>listen<\/mark> to each other, the tension will ease.", "If we <mark>had<\/mark> a mediator, the discussion would be much fairer."], "ask": "Which sentences describe a realistic condition and its likely result, and which describe a less likely, imagined or advice-giving situation? What verb form follows 'if' in each type?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["Simple Present", "will + base verb", "Past Simple (or 'were')", "would + base verb"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "First conditional (a realistic future possibility): If + ___, ___.", "section": "Complete the rule", "reveal": "Simple Present / will + base verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Second conditional (an unlikely, imagined situation, or advice with 'If I were you'): If + ___, ___.", "section": "Complete the rule", "reveal": "Past Simple (or 'were') / would + base verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Use the First Conditional for a realistic condition and its likely future result: If + Simple Present, ... will + verb. Use the Second Conditional for a less likely, hypothetical or advice-giving situation: If + Past Simple (usually 'were' for 'be'), ... would + verb. 'If I were you, I would…' is a very common way to give advice.", "tr": "Gerçekleşmesi olası bir durumu ve sonucunu anlatırken First Conditional kullanılır: If + Simple Present, ... will + fiil. Daha az olası, hayali ya da tavsiye niteliğindeki durumlar için Second Conditional kullanılır: If + Past Simple (be fiili için genellikle 'were'), ... would + fiil. 'If I were you, I would...' kalıbı, tavsiye vermenin çok yaygın bir yoludur.", "when_en": "We use the First Conditional to offer a realistic solution to a conflict, and the Second Conditional to discuss a hypothetical situation or to give someone advice.", "when": "Bir anlaşmazlığa gerçekçi bir çözüm önerirken First Conditional; hayali bir durumu tartışırken ya da birine tavsiye verirken Second Conditional kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["if / they / talk / calmly", "they / find / a solution"], "reveal": "If they talk calmly, they'll find a solution.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / you / apologise / first", "she / probably / forgive / you"], "reveal": "If you apologise first, she'll probably forgive you.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / I / be / you", "I / not ignore / the problem"], "reveal": "If I were you, I wouldn't ignore the problem.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / both sides / listen / to each other", "the conflict / calm down"], "reveal": "If both sides listen to each other, the conflict will calm down.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["if / we / have / a mediator", "the discussion / be / much fairer"], "reveal": "If we had a mediator, the discussion would be much fairer.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / what / you / do", "if / your / best friend / stop / talking to you"], "reveal": "What would you do if your best friend stopped talking to you?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Think of a disagreement (real or invented). Write four conditional sentences offering solutions or advice — use both the first and second conditional.", "chips": ["If they talk about it, …", "If I were them, I would…", "If we don't sort this out, …", "What would you do if…?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["If we talk about it, we'll sort it out.", "If I were you, I would apologise."], "negative": ["If we don't compromise, the tension won't go away.", "If she weren't so proud, she wouldn't refuse to talk."], "question": ["Will they make up if we explain the misunderstanding?", "What would you do if you were in this situation?"], "short": ["Yes, they probably will. / No, they probably won't.", "I would talk to them. / I wouldn't say anything."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If we will talk about it, we'll find a solution.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If we talk about it, we'll find a solution.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If I was you, I would apologise.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If I were you, I would apologise.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "If they listened to each other, they will solve it.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If they listened to each other, they would solve it.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "If both sides ___ calmly, they will probably reach a compromise.", "section": "A · Choose the correct option.", "options": ["talk", "talked", "will talk"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "If I ___ you, I would apologise straight away.", "section": "A · Choose the correct option.", "options": ["am", "was", "were"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The tension ___ ease if they stop avoiding each other.", "section": "A · Choose the correct option.", "options": ["will", "would", "won't"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If we ___ (not / sort out) this soon, it will get worse.", "section": "B · Complete with the correct form.", "reveal": "don't sort out", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If she ___ (have) more patience, she would listen instead of arguing.", "section": "B · Complete with the correct form.", "reveal": "had", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "What ___ you ___ (do) if a friend fell out with you over nothing?", "section": "B · Complete with the correct form.", "reveal": "would / do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "If we will apologise first, they might forgive us.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If we apologise first, they might forgive us.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "If I were you, I would try to see her side of the story.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "If they listened to each other, they will find common ground.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If they listened to each other, they would find common ground.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What would you do ___ (be) in my position?", "section": "Dialogue · Complete with the correct conditional form.", "reveal": "if you were", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: If I ___ (be) you, I ___ (not / ignore) the message — I'd reply and explain.", "section": "Dialogue · Complete with the correct conditional form.", "reveal": "were / wouldn't ignore", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "solution / talk / calmly / find / if / a / we / we'll", "section": "Dialogue · Reorder the sentence.", "words": ["if", "we", "talk", "calmly,", "we'll", "find", "a", "solution"], "end": ".", "reveal": "If we talk calmly, we'll find a solution.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Fence Between Us", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of conflict do you think this story is about?", "Have you ever disagreed with a neighbour or classmate about something small that grew into a bigger problem?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Fence Between Us", "num": 1, "total": 3, "text": "When the Aydemirs planted a tall hedge along their garden fence, their neighbours, the Karas, were furious. The hedge blocked the afternoon sun from the Karas' vegetable patch, and within a week the two families were barely speaking. Mr Kara left an angry note; Mrs Aydemir replied with an even angrier one. What had started as a small disagreement over a few metres of greenery was quickly turning into a serious conflict between two families who had once shared coffee every weekend.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Fence Between Us", "num": 2, "total": 3, "text": "Eventually, a mutual friend suggested they invite a local mediator, someone trained to help neighbours sort out exactly this kind of dispute. In their first meeting, the mediator asked each side one simple question: 'What do you actually need, not just what do you want?' It turned out the Karas needed more light for their vegetables, while the Aydemirs needed privacy from a busy street. Once both families understood the other's real reason, the argument suddenly felt much smaller.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Fence Between Us", "num": 3, "total": 3, "text": "The solution wasn't complicated. The Aydemirs agreed to trim the hedge to waist height, keeping their privacy lower down while letting sunlight reach the vegetable patch. Neither family got exactly what they had first demanded, but both got what they truly needed. Six months later, the Karas and Aydemirs were sharing coffee again — and jokes about the infamous hedge.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What was the real cause of tension between the two families?", "section": "While you read", "options": ["A disagreement over money", "A hedge that affected light and privacy", "A disagreement about a shared car"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The families invited a local ___ to help them talk things through.", "section": "While you read", "reveal": "mediator", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What question did the mediator ask each side?", "section": "While you read", "options": ["Who is right and who is wrong?", "What do you actually need, not just what do you want?", "Who planted the hedge first?"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, the Aydemirs completely removed the hedge.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "According to the text, they trimmed the hedge to waist height instead of removing it.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Neither family got exactly what they had first demanded, but both got what they truly ___.", "section": "While you read", "reveal": "needed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Why do you think understanding someone's real 'need' (not just their demand) can help resolve a conflict?", "Can you think of a compromise that could solve a disagreement you know about?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Two Sides of the Story", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think can cause conflict in a group project at school?", "Do you think it's fair to judge someone before hearing their side of the story?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Two Sides of the Story", "num": 1, "total": 3, "text": "When their teacher put Aslı, Burak and two classmates into a group project on renewable energy, nobody expected it to end in an argument. By the second week, Aslı had written most of the report herself, while Burak had missed two planning meetings without much explanation. 'He clearly doesn't care about the grade,' Aslı complained to her friends, refusing to speak to him directly.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Two Sides of the Story", "num": 2, "total": 3, "text": "When their teacher noticed the tension, she asked both students to explain their side privately before deciding anything. Burak admitted he had been working extra shifts at his family's shop after school and had simply lost track of the group's messages. Aslı, meanwhile, admitted she had never actually told him how much extra work she was doing — she had just assumed he knew.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Two Sides of the Story", "num": 3, "total": 3, "text": "With their teacher's help, the group redrew the task list, giving Burak a smaller, clearly defined part he could finish around his shifts, and giving Aslı credit for the sections she had already written. Their final presentation on solar energy went smoothly, and afterwards Burak thanked Aslı for not simply reporting him — while Aslı admitted she should have asked, instead of assumed, from the start.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Why was Aslı frustrated with Burak at first?", "section": "While you read", "options": ["He had copied her work", "He had missed meetings without much explanation", "He had left the group completely"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Burak had been working extra ___ at his family's shop after school.", "section": "While you read", "reveal": "shifts", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Aslı had clearly told Burak how much extra work she was doing.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Aslı admitted she had never actually told him — she had just assumed he knew.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What did the teacher do when she noticed the tension?", "section": "While you read", "options": ["She gave the group a lower grade immediately", "She asked both students to explain their side privately", "She removed Burak from the group"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In the end, the group redrew the ___ so that everyone had a fair, clearly defined part.", "section":   }

  function bindStage(sc) {

  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b && "speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(b.getAttribute("data-say")); u.lang = "en-GB"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  });

  /* ---------- araçlar: sayaç ---------- */
  var T = { left: 0, total: 0, id: null };
  var tbox = $(".ptimer");
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function drawT() { $(".ptime", tbox).textContent = fmt(T.left); tbox.classList.toggle("ending", T.left > 0 && T.left <= 10); tbox.classList.toggle("done", T.left === 0 && T.total > 0); }
  function setTimer(sec, start) { stopT(); T.left = T.total = sec; tbox.hidden = false; drawT(); if (start) startT(); }
  function startT() { if (T.id || !T.left) return; T.id = setInterval(function () { T.left--; drawT(); if (T.left <= 0) { stopT(); beep(); } }, 1000); $(".ptgo", tbox).textContent = "❚❚"; }
  function stopT() { clearInterval(T.id); T.id = null; if (tbox) $(".ptgo", tbox).textContent = "▶"; }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime + t); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {} }
  $(".ptgo", tbox).addEventListener("click", function () { T.id ? stopT() : startT(); });
  $$("[data-t]", tbox).forEach(function (b) { b.addEventListener("click", function () { setTimer(+b.getAttribute("data-t"), true); }); });
  $(".ptclose", tbox).addEventListener("click", function () { stopT(); tbox.hidden = true; });

  /* ---------- araçlar: rastgele öğrenci ---------- */
  var pick = $(".ppick"), used = [];
  $("#p-size").value = store.get("us:classsize", 30);
  function pickOne() {
    var n = Math.max(2, Math.min(60, +$("#p-size").value || 30)); store.set("us:classsize", n);
    if (used.length >= n) used = [];
    var r; do { r = 1 + Math.floor(Math.random() * n); } while (used.indexOf(r) >= 0);
    used.push(r);
    var big = $(".pnum", pick); var k = 0;
    var spin = setInterval(function () { big.textContent = 1 + Math.floor(Math.random() * n); if (++k > 10) { clearInterval(spin); big.textContent = r; } }, 60);
    $(".pused", pick).textContent = "Seçilenler: " + used.join(", ");
  }
  $(".pgo", pick).addEventListener("click", pickOne);
  $(".ppclose", pick).addEventListener("click", function () { pick.hidden = true; });

  /* ---------- araçlar: puan tablosu ---------- */
  var score = $(".pscore"), S = store.get("us:score:" + P.key, [0, 0]);
  function drawS() { $$(".pts", score).forEach(function (x, i) { x.textContent = S[i]; }); store.set("us:score:" + P.key, S); }
  $$("[data-sc]", score).forEach(function (b) { b.addEventListener("click", function () { var a = b.getAttribute("data-sc").split(","); S[+a[0]] = Math.max(0, S[+a[0]] + (+a[1])); drawS(); }); });
  $(".psreset", score).addEventListener("click", function () { S = [0, 0]; drawS(); });
  drawS();

  /* ---------- düğmeler & klavye ---------- */
  function tool(name) {
    if (name === "timer") { tbox.hidden = !tbox.hidden; }
    if (name === "pick") { pick.hidden = !pick.hidden; if (!pick.hidden) pickOne(); }
    if (name === "score") { score.hidden = !score.hidden; }
    if (name === "notes") { var n = $(".pnotes"); n.hidden = !n.hidden; }
    if (name === "full") { var d = document.documentElement; if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(function () {}); } else document.exitFullscreen(); }
  }
  $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { tool(b.getAttribute("data-tool")); }); });
  $(".pnext").addEventListener("click", next);
  $(".pprev").addEventListener("click", prev);
  $(".preveal").addEventListener("click", reveal);
  $$(".pdeck").forEach(function (b, i) { b.addEventListener("click", function () { go(i, 0); }); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,textarea,select")) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); next(); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); prev(); }
    else if (k === "r" || k === "enter") { e.preventDefault(); reveal(); }
    else if (k === "t") tool("timer"); else if (k === "p") tool("pick"); else if (k === "s") tool("score"); else if (k === "n") tool("notes"); else if (k === "f") tool("full");
  });
  // dokunmatik kaydırma
  var sx = null;
  stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) (dx < 0 ? next : prev)(); sx = null; });

  // başlangıç: hash ya da kayıtlı konum
  var m = (location.hash || "").match(/^#([a-z0-9-]+)-(\d+)$/), start = store.get("us:present:" + P.key, { d: 0, s: 0 });
  if (m) { DECKS.forEach(function (d, i) { if (d.id === m[1]) { start = { d: i, s: Math.min(+m[2] - 1, d.screens.length - 1) }; } }); }
  if (!DECKS[start.d] || !DECKS[start.d].screens[start.s]) start = { d: 0, s: 0 };
  go(start.d, start.s);
})();
</script></body></html>
