urar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about a real Turkish landmark using different passive tenses (past, present, and one with a modal or future form).", "chips": ["The site was ...", "Today, it is ...", "It must / should be ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The castle is built on a hill. (present simple)", "The temple was built in ancient times. (past simple)", "The road is being repaired this week. (present continuous)", "The site was being excavated when the war began. (past continuous)", "A new sign will be placed at the entrance. (future simple)", "This monument must be respected by all visitors. (modal)"], "negative": ["The museum is not opened on Mondays.", "The gate was not damaged during the storm.", "The hall is not being used at the moment.", "The statue will not be moved to another city.", "Photographs must not be taken inside the tomb."], "question": ["Is the palace visited by many tourists?", "Was the bridge built by local engineers?", "Is the site currently being restored?", "Will the exhibition be opened next month?", "Should this area be protected?"], "short": ["Yes, it is. / No, it isn't.", "Yes, it was. / No, it wasn't.", "Yes, it is. / No, it isn't.", "Yes, it will. / No, it won't.", "Yes, it should. / No, it shouldn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The castle built in the 14th century.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The castle was built in the 14th century.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The museum is visit by many people.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The museum is visited by many people.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The ruins were discover last year.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The ruins were discovered last year.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This area must protected.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This area must be protected.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "The Trojan Horse story ___ (know) all over the world.", "section": "", "reveal": "is known", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This ancient theatre ___ (build) more than two thousand years ago.", "section": "", "reveal": "was built", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct passive form: 'The old walls ___ right now.'", "section": "", "options": ["are repairing", "are being repaired", "were repaired", "repair"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'The site was discover by a shepherd.' is correct.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The site was discovered by a shepherd.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly uses a modal in the passive?", "section": "", "options": ["This area should protect.", "This area should be protect.", "This area should be protected.", "This area should protected be."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in the passive: 'They will open a new museum next year.'", "section": "", "reveal": "A new museum will be opened next year.", "prompt": "A new museum ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Look, the entrance ___ (paint) at the moment, so we can't go in.", "section": "", "reveal": "is being painted", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: was / famous / the / restored / mosque / last year", "section": "", "words": ["the", "famous", "mosque", "was", "restored", "last", "year"], "end": ".", "reveal": "The famous mosque was restored last year.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in the passive: 'Archaeologists are excavating the ruins this summer.'", "section": "", "reveal": "The ruins are being excavated by archaeologists this summer.", "prompt": "The ruins ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the best passive sentence for: 'They should not remove the old inscriptions.'", "section": "", "options": ["The old inscriptions should not be removed.", "The old inscriptions should not removed.", "The old inscriptions not should be removed.", "The old inscriptions should be not removed."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "When the earthquake struck, the temple ___ (rebuild) by local workers.", "section": "", "reveal": "was being rebuilt", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "An Underground City", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Have you ever heard of a city built entirely underground?", "What do you think life might have been like living below the surface?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "An Underground City", "num": 1, "total": 4, "text": "In the region of Cappadocia, in central Türkiye, several underground cities can be found carved into the soft volcanic rock. One of the largest of these was discovered almost by accident in 1963, when a local resident knocked down a wall in his house and found a hidden tunnel behind it. Since then, many chambers, corridors and rooms have been uncovered by archaeologists.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "An Underground City", "num": 2, "total": 4, "text": "It is believed that the underground city was first used thousands of years ago as a place of shelter. Over time, rooms were carved deeper and deeper into the rock, and the settlement was gradually expanded until it could hold thousands of people along with their animals and food supplies. Stables, kitchens, storage rooms and even small churches were built several levels below the ground.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "An Underground City", "num": 3, "total": 4, "text": "Large round stones were used as doors, and these could be rolled across the entrances from the inside to block invaders. Fresh air was supplied through a clever system of ventilation shafts that also reached the surface, and wells were dug to provide clean water even during long periods underground.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "An Underground City", "num": 4, "total": 4, "text": "Today, only a small part of the underground city is open to visitors, since new tunnels and rooms are still being explored. It has become one of the most popular attractions in the region, and it is visited by travellers from all over the world who want to see how people once lived beneath the earth.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "When was the underground city discovered?", "section": "While you read", "options": ["In ancient times", "In 1963", "Last year", "It has never been discovered"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The underground city was used only for one day at a time.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The underground city could hold thousands of people for long periods.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Large round stones were used as ___ that could be rolled across entrances.", "section": "While you read", "reveal": "doors", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "How was fresh air supplied to the underground city?", "section": "While you read", "options": ["Through open windows", "Through ventilation shafts", "It was not supplied", "Through the main entrance only"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite this sentence in the passive: 'People are still exploring new tunnels and rooms.'", "section": "While you read", "reveal": "New tunnels and rooms are still being explored.", "prompt": "New tunnels and rooms ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why is only a small part of the underground city open to visitors?", "section": "While you read", "options": ["It is too dangerous", "New tunnels and rooms are still being explored", "It is closed for repairs", "Tourists are not allowed inside"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Would you like to visit an underground city like this? Why or why not?", "What other reasons might people have had for building homes underground?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A City Built on Water", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you know of any famous cities built on water or beside a strait?", "What difficulties do you think a city built between two seas might have?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A City Built on Water", "num": 1, "total": 4, "text": "Istanbul is one of the few cities in the world that is built on two continents, with the Bosphorus strait dividing its European and Asian sides. For thousands of years, the city has been ruled by different empires, and each civilisation has left behind its own buildings, walls and monuments.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A City Built on Water", "num": 2, "total": 4, "text": "The old city walls, parts of which can still be seen today, were originally constructed to protect the city from land and sea attacks. Massive gates were built into the walls, and guards were once stationed at each one to check everyone entering the city. Although much of the wall has been damaged over the centuries, sections of it have been carefully restored so that visitors can imagine how strong the defences once were.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A City Built on Water", "num": 3, "total": 4, "text": "One of the city's most famous buildings began its life as a church, was later converted into a mosque, and for many years was used as a museum before being reopened as a mosque again. Its enormous dome, which amazed visitors when it was completed, is still considered an outstanding achievement of engineering.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A City Built on Water", "num": 4, "total": 4, "text": "Today, bridges and tunnels connect the two sides of the city, and thousands of commuters cross the strait every single day. Ferries are still used by many people, partly because they are convenient and partly because the crossing offers wonderful views of the city's skyline. New museums and cultural centres are being opened all the time, which shows that this ancient city continues to change while its history is carefully preserved.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What divides the European and Asian sides of the city described?", "section": "While you read", "options": ["A mountain range", "The Bosphorus strait", "A desert", "A large lake"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The old city walls were originally built to ___ the city from attacks.", "section": "While you read", "reveal": "protect", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The famous domed building described has always been used only as a mosque.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It was first a church, later a mosque, then a museum, and then a mosque again.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How do most commuters cross between the two sides of the city today?", "section": "While you read", "options": ["Only by ferry", "By bridges, tunnels, and ferries", "By walking across the strait", "The crossing is not possible"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in the passive: 'People are opening new museums all the time.'", "section": "While you read", "reveal": "New museums are being opened all the time.", "prompt": "New museums ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["What do you think makes a city special when it is built between two continents?", "Which parts of a city's history do you think are most important to preserve?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Guided Tour of a Historic Site", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What questions would you ask a guide during a tour of a historic site?", "What kind of information do tour guides usually give visitors?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Guided Tour of a Historic Site", "audio": null, "transcript": [{"speaker": "Guide", "line": "Welcome, everyone! This fortress was originally built in the fifteenth century to protect the harbour below."}, {"speaker": "Visitor", "line": "That's amazing. Was it ever attacked?"}, {"speaker": "Guide", "line": "Yes, it was attacked several times, but it was never fully captured because of its strong walls."}, {"speaker": "Visitor", "line": "How many towers does it have?"}, {"speaker": "Guide", "line": "There are twelve towers in total, and three of them have recently been restored."}, {"speaker": "Visitor", "line": "Can we go up to the top tower?"}, {"speaker": "Guide", "line": "Unfortunately not today — the top tower is currently being repaired, so it's closed to visitors."}, {"speaker": "Visitor", "line": "That's a shame. Is anything else being done to improve the site?"}, {"speaker": "Guide", "line": "Yes, a new visitor centre will be opened here next year, with more information about the fortress's history."}, {"speaker": "Visitor", "line": "Sounds great. One more question — is photography allowed inside?"}, {"speaker": "Guide", "line": "Photography is allowed everywhere except inside the old chapel, where it's not permitted."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "When was the fortress originally built?", "section": "While you listen", "options": ["In the fifteenth century", "Last year", "In the twentieth century", "It is not mentioned"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The fortress has ___ towers in total.", "section": "While you listen", "reveal": "twelve", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Visitors can go up to the top tower today.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The top tower is closed because it is currently being repaired.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What will happen at the site next year?", "section": "While you listen", "options": ["The fortress will be closed permanently", "A new visitor centre will be opened", "All the towers will be removed", "It will become a private house"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where is photography not permitted?", "section": "While you listen", "options": ["In the towers", "In the old chapel", "Outside the fortress", "Everywhere"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What other questions would you like to ask the guide?", "Which detail about the fortress did you find most interesting?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "The Story of a Natural Wonder", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Can you think of a place where unusual rock or land shapes were formed naturally?", "How do you think such shapes might be created over time?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "The Story of a Natural Wonder", "audio": null, "transcript": [{"speaker": "Narrator", "line": "This valley is famous for its unusual, cone-shaped rock formations, which are often called 'fairy chimneys' by visitors."}, {"speaker": "Narrator", "line": "The formations were created over millions of years by volcanic eruptions, which covered the whole area in soft ash and rock."}, {"speaker": "Narrator", "line": "Later, this soft rock was shaped by wind and rain, and a harder layer of stone on top protected the columns underneath from being worn away completely."}, {"speaker": "Narrator", "line": "As a result, tall, cone-shaped towers were left standing, some of them more than thirty metres high."}, {"speaker": "Narrator", "line": "Today, the valley is visited by thousands of tourists every year, and hot air balloon rides are offered so that visitors can see the strange landscape from above."}, {"speaker": "Narrator", "line": "New paths and viewing points have been added recently, but the natural formations themselves are strictly protected and must not be damaged."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are the cone-shaped rock formations often called?", "section": "While you listen", "options": ["Stone giants", "Fairy chimneys", "Rock towers", "Sky pillars"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The formations were created by ___ eruptions millions of years ago.", "section": "While you listen", "reveal": "volcanic", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The rock formations are not protected and visitors may damage them freely.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The natural formations are strictly protected and must not be damaged.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What can visitors do to see the landscape from above?", "section": "While you listen", "options": ["Climb a tower", "Take a hot air balloon ride", "Use a telescope", "Visit a museum"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Would you like to see a landscape like this in person? Why or why not?", "What rules do you think are important for protecting natural wonders?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Describe a Landmark", "text": "Choose a real or imaginary Turkish landmark. Describe it to your partner using at least four passive voice sentences (when it was built, what it is used for, how it is protected, and any future plans).", "steps": ["Choose a landmark and note down four to five key facts.", "Turn each fact into a passive voice sentence.", "Take turns describing your landmark to your partner.", "Your partner listens and asks one follow-up question for more detail."], "chips": ["It was built in...", "It is visited by...", "It is currently being...", "It will be...", "It must be protected because..."], "timer": 600, "levels": ["Give weaker students a short list of facts already written out so they only need to change them into the passive voice.", "Students describe their landmark from memory using their notes as a guide.", "Stronger students add a comparison to another landmark and use at least one modal passive form."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Ask for More Detailed Information", "text": "One student plays a tour guide describing a historic site; the others ask follow-up questions to get more detailed information, such as dates, numbers, or future plans.", "steps": ["The 'guide' prepares three or four basic facts about a site.", "The guide gives a short introduction to the group.", "The other students ask at least three follow-up questions.", "The guide answers using the passive voice where possible.", "Switch roles so everyone has a turn as the guide."], "chips": ["Could you tell me more about...?", "What exactly is being done to...?", "When was it...?", "How many...are there?", "Is anything planned for...?"], "timer": 600, "levels": ["Provide a list of question starters for students who need help forming follow-up questions.", "Groups complete the full role-play with each member taking a turn as guide.", "Stronger students ask about hypothetical future plans and challenge the guide with an unexpected question."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Describe a Historic Site", "text": "Writ
