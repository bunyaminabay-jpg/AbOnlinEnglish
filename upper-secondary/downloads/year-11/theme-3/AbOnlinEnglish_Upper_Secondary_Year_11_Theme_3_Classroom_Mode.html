o' + base verb to talk about repeated past habits or past states that are no longer true.", "tr": "'Used to' + fiilin yalın hali, artık doğru olmayan tekrarlanan geçmiş alışkanlıkları veya geçmiş durumları anlatmak için kullanılır.", "when_en": "Use it to contrast a past habit/state with the present situation. Do not use it for a single, one-time action.", "when": "Geçmişteki bir alışkanlığı/durumu şimdiki durumla karşılaştırmak için kullanılır. Tek seferlik bir eylem için kullanılmaz.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["she", "not have", "her own room"], "reveal": "She didn't use to have her own room.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "work", "after school"], "reveal": "He used to work after school.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "not have", "hot water at home"], "reveal": "They didn't use to have hot water at home.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "share", "a bed with her sisters"], "reveal": "She used to share a bed with her sisters.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["did", "you", "walk", "to school"], "reveal": "Did you use to walk to school?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not eat", "out very often"], "reveal": "We didn't use to eat out very often.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences with 'used to' about habits or a way of life someone had in the past that is different now.", "chips": ["When I was younger, I used to ...", "My grandparents used to ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Subject + used to + base verb", "He used to walk to school.", "They used to live in a village."], "negative": ["Subject + didn't use to + base verb", "She didn't use to eat meat.", "We didn't use to have a car."], "question": ["Did + subject + use to + base verb...?", "Did he use to walk to school?", "Did they use to live in a village?"], "short": ["Yes, he did. / No, he didn't.", "Yes, they did. / No, they didn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He use to walk to school.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He used to walk to school.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She didn't used to eat meat.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She didn't use to eat meat.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I used to go to the cinema yesterday.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I went to the cinema yesterday.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "They ___ (live) in a small village before they moved to the city.", "section": "", "reveal": "used to live", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which is correct?", "section": "", "options": ["She didn't used to smile much.", "She didn't use to smile much.", "She not used to smile much.", "She use to not smile much."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ you ___ (play) outside all day when you were a child?", "section": "", "reveal": "Did / use to play", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "He use to work in a shoe factory.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He used to work in a shoe factory.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using 'used to': In the past, she had very little money.", "section": "", "reveal": "She used to have very little money.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: school / walk / to / used / he / to", "section": "", "words": ["he", "used", "to", "walk", "to", "school"], "end": ".", "reveal": "He used to walk to school.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "We ___ (not have) enough food during the hardest years, but things are better now.", "section": "", "reveal": "didn't use to have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Explain the difference: 'I used to go to that school' vs 'I went to that school yesterday'.", "section": "", "reveal": "'Used to' describes a repeated past habit or state with no specific time; the past simple with 'yesterday' describes one finished action at a specific time.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Girl Who Didn't Stop", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think 'didn't stop' might mean here?", "Have you ever heard a true story about someone who overcame a difficult childhood?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Girl Who Didn't Stop", "num": 1, "total": 4, "text": "Elif grew up in a small town where her family didn't have much money. Her father worked long hours at a local workshop, and her mother sold vegetables at the market. When Elif was ten years old, her father lost his job, and things became even harder. The family moved into a smaller house, and Elif started helping her mother at the market every morning before school.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Girl Who Didn't Stop", "num": 2, "total": 4, "text": "While her classmates were playing after school, Elif was usually working or studying by candlelight, because the electricity at home was often cut off. She used to dream about becoming a teacher one day, but nobody in her family had ever finished university. Many people told her it wasn't realistic for a girl from her background.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Girl Who Didn't Stop", "num": 3, "total": 4, "text": "Elif didn't listen to them. She studied every night, even when she was exhausted, and she never missed a day of school. One teacher noticed how determined she was and began giving her extra books to read. Slowly, Elif's grades improved, and after years of hard work, she won a scholarship to study education at a university in another city.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Girl Who Didn't Stop", "num": 4, "total": 4, "text": "Today, Elif is a teacher at a school not far from the town where she grew up. She often tells her students that hard times don't have to decide who you become. 'I used to think poverty would stop me,' she says, 'but it actually taught me how to keep going.' Her story has since inspired several of her own students to keep studying, no matter how difficult their situation is.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What was the main obstacle in Elif's early life?", "section": "While you read", "options": ["She was ill for many years.", "Her family had very little money.", "She didn't like school.", "She lived far from her family."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Elif used to help her mother at the ___ every morning.", "section": "While you read", "reveal": "market", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Elif's family had electricity all the time.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif's family often had the electricity cut off.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What helped Elif improve her grades?", "section": "While you read", "options": ["Moving to a bigger house", "Her father's new job", "A teacher who gave her extra books", "Stopping work at the market"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Elif won a ___ to study education at university.", "section": "While you read", "reveal": "scholarship", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to Elif, what did poverty actually teach her?", "section": "While you read", "options": ["To give up early", "How to keep going", "To avoid school", "To depend on others"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Do you agree that hard times can teach us something useful? Why or why not?", "What would you say to a friend who feels like giving up during a difficult time?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "From the Repair Shop to the Stage", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What jobs do you know that require working with your hands?", "Do you think it's possible to follow a dream while working a difficult job?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "From the Repair Shop to the Stage", "num": 1, "total": 4, "text": "Kerem's father used to run a small bicycle repair shop, and Kerem started helping him there when he was only eleven. While other children in the neighbourhood were going to after-school clubs, Kerem was fixing tyres and cleaning chains. The family needed the extra income, so there wasn't much time left for hobbies.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "From the Repair Shop to the Stage", "num": 2, "total": 4, "text": "One rainy afternoon, while Kerem was repairing an old guitar that a customer had left behind, he started playing a few notes just to test the strings. He had never had lessons, but something about the sound stayed with him. From that day, whenever the shop was quiet, he practised on that same guitar, teaching himself simple songs from an old book his uncle had given him.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "From the Repair Shop to the Stage", "num": 3, "total": 4, "text": "Life didn't get easier quickly. Kerem still worked at the shop every afternoon, and money was often tight at home. But he used to save a little money from small jobs to buy guitar strings, and he never stopped practising, even during the hardest months when the shop had almost no customers.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "From the Repair Shop to the Stage", "num": 4, "total": 4, "text": "Years later, a local café owner heard Kerem playing outside the repair shop and asked him to perform one evening. That first small concert led to others, and slowly Kerem built a name for himself as a musician in his city. He still visits the repair shop sometimes, not to fix bicycles, but to remind himself where his journey began.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What was Kerem's family business?", "section": "While you read", "options": ["A music shop", "A bicycle repair shop", "A café", "A bookshop"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Kerem first started playing an old ___ that a customer had left.", "section": "While you read", "reveal": "guitar", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Kerem had professional guitar lessons from the start.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kerem taught himself to play using an old book.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How did Kerem get his first chance to perform?", "section": "While you read", "options": ["He entered a competition.", "A café owner heard him playing outside the shop.", "His uncle organised a concert.", "He advertised online."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Kerem used to save money from small jobs to buy guitar ___.", "section": "While you read", "reveal": "strings", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["What does this story suggest about combining work and following a passion?", "Do you know someone who kept a hobby going during a difficult time? Tell your partner about it."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Conversation About Hard Times", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What kinds of hard times might a family go through?", "Predict: what do you think these two speakers will talk about?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Conversation About Hard Times", "audio": null, "transcript": [{"speaker": "A", "line": "You know, when I was a kid, we used to move house almost every year."}, {"speaker": "B", "line": "Really? Why was that?"}, {"speaker": "A", "line": "My dad kept losing his job, so we were always looking for cheaper places to live."}, {"speaker": "B", "line": "That must have been really hard, especially for school."}, {"speaker": "A", "line": "It was. I remember one year I was studying for exams while we were packing boxes to move again."}, {"speaker": "B", "line": "How did you manage to keep up with school?"}, {"speaker": "A", "line": "Honestly, a couple of teachers helped me a lot. While the other students were going home, I used to stay late to get extra help."}, {"speaker": "B", "line": "That's amazing. Do you think that time made you stronger?"}, {"speaker": "A", "line": "Definitely. I used to hate how unstable everything was, but now I think it taught me to adapt quickly to new situations."}, {"speaker": "B", "line": "That's a really positive way to look at it."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Why did speaker A's family move house so often?", "section": "While you listen", "options": ["They liked new places.", "Their house was too small.", "The father kept losing his job.", "They wanted to be near school."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Speaker A was studying for exams while the family was ___ boxes.", "section": "While you listen", "reveal": "packing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "No one helped speaker A with school.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "A couple of teachers helped speaker A a lot.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What did speaker A used to do while other students went home?", "section": "While you listen", "options": ["Go home early too", "Stay late for extra help", "Play sports", "Work part-time"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How does speaker A feel about that period now?", "section": "While you listen", "options": ["Still angry about it", "Thinks it taught them to adapt quickly", "Doesn't want to talk about it", "Wishes it never happened"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Have you ever had to adapt quickly to a new or difficult situation? What happened?", "Do you agree that difficult experiences can make people stronger? Discuss with a partner."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "My Family's Story", "text": "Interview your partner about a difficult time someone in their family (or an invented family, if they prefer) went through, using past simple and past continuous questions.", "steps": ["Think of a hard time (real or invented) that a family member went through.", "Prepare 4-5 questions to ask your partner about their story, using past simple and past continuous.", "Take turns interviewing each other and taking short notes.", "Report your partner's story back to the class in 3-4 sentences."], "chips": ["What was happening when...?", "How did your family deal with...?", "While this was happening, what were you/they doing?", "In the end, they managed to..."], "timer": 600, "levels": ["Give students a list of ready-made question starters to choose from and allow them to talk about an invented family if they prefer not to share personal details.", "Students ask and answer freely, using at least one past continuous with 'while'.", "Students add a follow-up question asking how the experience changed the person, using 'used to' to contrast past and present."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Then and Now", "text": "Discuss habits and routines that used to be common in the past (in general, or in your own family/town) but have changed today.", "steps": ["In groups, brainstorm 5 things people used to do in the past that are different now.", "Discuss why you think these habits changed.", "Choose the most interesting example and prepare to share it with the class.", "Present your example, using 'used to' at least twice."], "chips": ["People used to...", "We didn't use to...", "Nowadays, people...", "Things have changed because..."], "timer": 600, "levels": ["Provide picture prompts (old phones, old shops, transport) to help generate ideas.", "Students discuss freely in groups and use 'used to' correctly for at least two examples.", "Students compare their example with a difficulty someone might have faced adapting to the change."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Short Biography: Overcoming a Hard Time", "text": "Write a short biographical paragraph about a person (real or invented) who faced a hardship and overcame it. Use past simple, past continuous, and 'used to' at least once each.", "steps": ["Decide who your subject is and what hardship they faced.", "List 2-3 key events in the order they happened.", "Note one thing the person 'used to' do or have that later changed.", "Think of a sentence describing two things happening at the same time (with 'while')."], "chips": ["hardship", "overcome", "determined", "struggle", "achievement", "background", "When ... was young, ...", "While ... was ..., ... was ...", "... used to ..., but now ...", "In the end, ... managed to ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "Diary Entry: A Hard Day", "text": "Write a diary entry from the point of view of a person living through a difficult period, describing what was happening and what you used to do differently before.", "steps": ["Choose a specific day and situation to write about.", "Decide what was happening around the writer at that time.", "Think of one thing the writer used to do before life became difficult.", "Add a short reflection at the end about how the writer feels."], "chips": ["exhausted", "support", "resilient", "sacrifice", "reflect", "obstacle", "Today was ... While I was ..., ...", "I used to ..., but these days ...", "It hasn't been easy, but ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title",
