xample": "Good teamwork depends on cooperation between all members.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "custom", "pos": "noun", "ipa": "/ˈkʌstəm/", "tr": "gelenek, adet", "example": "Removing your shoes before entering a home is a common custom in many countries.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "etiquette", "pos": "noun", "ipa": "/ˈetɪket/", "tr": "görgü kuralları", "example": "Table etiquette differs from one culture to another.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "upbringing", "pos": "noun", "ipa": "/ˈʌpbrɪŋɪŋ/", "tr": "yetiştirme tarzı", "example": "Her strong sense of honesty comes from her upbringing.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“çeşitlilik”", "options": ["custom", "norm", "diversity"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“saygı”", "options": ["compassion", "respect", "kindness"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“adalet, tarafsızlık”", "options": ["fairness", "integrity", "empathy"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sabır”", "options": ["patience", "loyalty", "norm"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“nezaket, incelik”", "options": ["cooperation", "value", "courtesy"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“görgü kuralları”", "options": ["etiquette", "custom", "compassion"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Correlative Conjunctions — both...and, either...or, neither...nor, not only...but also", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["She is <mark>both<\/mark> honest <mark>and<\/mark> kind to everyone she meets.", "You can <mark>either<\/mark> agree with his opinion <mark>or<\/mark> explain why you disagree.", "He is <mark>neither<\/mark> rude <mark>nor<\/mark> selfish; he always thinks of others.", "Good manners are <mark>not only<\/mark> about words <mark>but also<\/mark> about actions."], "ask": "What do you notice about the words in bold pairs — how many parts do they have, and what kind of ideas do they connect?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["both...and", "either...or", "neither...nor", "not only...but also"], "chips": true, "text": "Complete the sentences with the correct correlative conjunction pair from the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Respect is ___ important at home ___ at school.", "section": "Complete the rule", "reveal": "both...and", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You can ___ share your opinion politely ___ stay quiet during the discussion.", "section": "Complete the rule", "reveal": "either...or", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He is ___ dishonest ___ unkind; everyone trusts him.", "section": "Complete the rule", "reveal": "neither...nor", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Good citizens are ___ responsible for their own actions ___ helpful to their community.", "section": "Complete the rule", "reveal": "not only...but also", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In this class, we value ___ honesty ___ kindness equally.", "section": "Complete the rule", "reveal": "both...and", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Correlative conjunctions are pairs of words (both...and, either...or, neither...nor, not only...but also) that connect two equal grammatical elements — words, phrases, or clauses — within a sentence. The two connected elements should have the same grammatical form (parallel structure).", "tr": "Correlative conjunctions (both...and, either...or, neither...nor, not only...but also), bir cümle içinde iki eş değerli unsuru (kelime, öbek ya da cümlecik) birbirine bağlayan çift bağlaçlardır. Bağlanan iki unsur aynı dilbilgisel yapıda olmalıdır (paralel yapı).", "when_en": "We use both...and to add two positive ideas equally; either...or to show a choice between two options; neither...nor to negate two ideas together; and not only...but also to emphasise an additional, often stronger, point.", "when": "İki olumlu fikri eşit şekilde eklemek için both...and; iki seçenek arasında tercih belirtmek için either...or; iki fikri birlikte olumsuz yapmak için neither...nor; ek ve genellikle daha güçlü bir noktayı vurgulamak için not only...but also kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["honest", "kind (both...and)"], "reveal": "She is both honest and kind.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["fair", "patient (both...and)"], "reveal": "The teacher is both fair and patient with her students.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["apologise", "explain your mistake (either...or)"], "reveal": "You can either apologise or explain your mistake.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["rude", "disrespectful (neither...nor)"], "reveal": "A good friend is neither rude nor disrespectful.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["polite", "genuinely caring (not only...but also)"], "reveal": "He is not only polite but also genuinely caring.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["listen carefully", "respond thoughtfully (both...and)"], "reveal": "Good listeners both listen carefully and respond thoughtfully.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about values you consider important, using both...and, either...or, neither...nor, or not only...but also.", "chips": ["A good friend is both...", "In my opinion, we should either... or...", "I believe people should not only... but also..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Both + A + and + B", "Not only + A + but also + B"], "negative": ["Neither + A + nor + B"], "question": ["Is/Are + subject + both + A + and + B?", "Does/Do + subject + either + A + or + B?"], "short": ["Neither do I.", "So does she. (in response to a both...and statement)"]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She is both honest and she is kind.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is both honest and kind.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He neither likes tea or coffee.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He likes neither tea nor coffee.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Not only she is kind but also generous.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is not only kind but also generous.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Either you apologise either you leave.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Either you apologise or you leave.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Choose the correct pair: 'The speech was ___ interesting ___ well delivered.'", "section": "", "options": ["either...or", "both...and", "neither...nor", "not...nor"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You can ___ call me tonight ___ send a message tomorrow.", "section": "", "reveal": "either...or", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "'He is ___ rude ___ unfriendly; he's actually very polite.' Choose the best pair.", "section": "", "options": ["both...and", "either...or", "neither...nor", "not only...but also"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'She is both talented and she works hard' is grammatically correct.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It should be 'She is both talented and hardworking' (two parallel adjectives).", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Good manners are ___ about words ___ about actions.", "section": "", "reveal": "not only...but also", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: is / neither / lazy / nor / dishonest / he", "section": "", "words": ["he", "is", "neither", "lazy", "nor", "dishonest"], "end": ".", "reveal": "He is neither lazy nor dishonest.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using both...and: My brother is honest. My brother is kind.", "section": "", "reveal": "My brother is both honest and kind.", "prompt": "My brother is...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly uses 'not only...but also' with subject-verb inversion?", "section": "", "options": ["Not only she is kind, but also generous.", "Not only is she kind, but she is also generous.", "Not only kind she is, but also generous.", "She not only is kind but also is generous is."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine using neither...nor: The restaurant wasn't cheap. The restaurant wasn't very good.", "section": "", "reveal": "The restaurant was neither cheap nor very good.", "prompt": "The restaurant was...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Good Manners Around the World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Think about a time you visited a new place or met people from a different background. What customs surprised you?", "What does the word 'etiquette' mean to you?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Good Manners Around the World", "num": 1, "total": 5, "text": "Every culture in the world has its own set of unwritten rules about polite behaviour. These rules, often called social norms or etiquette, guide how people greet each other, eat together, and show respect. Although the details are different, most cultures share the same basic values: honesty, kindness, and respect for others.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Good Manners Around the World", "num": 2, "total": 5, "text": "In many Western countries, a firm handshake and direct eye contact are seen as signs of confidence and respect. In parts of East Asia, a slight bow is more common, and it is considered impolite to shake hands too firmly. In some Middle Eastern and South Asian cultures, taking off your shoes before entering someone's home is both a custom and a sign of courtesy toward the host.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Good Manners Around the World", "num": 3, "total": 5, "text": "Table manners also vary widely. In some countries, finishing every bite on your plate shows gratitude to the cook. In others, leaving a little food behind is a polite way of showing that you have had enough. Neither habit is right or wrong on its own — both are simply different expressions of the same value: respect.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Good Manners Around the World", "num": 4, "total": 5, "text": "Learning about another culture's customs is not just useful for travellers. It also teaches tolerance and open-mindedness. When we understand why people behave the way they do, we are less likely to judge them unfairly. A truly polite person is not only someone who follows their own culture's rules but also someone who respects other people's norms, even when those norms are unfamiliar.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Good Manners Around the World", "num": 5, "total": 5, "text": "So the next time you meet someone from a different background, try to notice — and appreciate — both the differences and the shared values underneath them.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what do most cultures share, despite different customs?", "section": "While you read", "options": ["The same table manners", "The same greeting style", "Basic values like honesty, kindness and respect", "The same rules about shoes"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In the text, what is considered impolite in parts of East Asia?", "section": "While you read", "options": ["Bowing slightly", "Shaking hands too firmly", "Removing your shoes", "Finishing your food"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In some Middle Eastern and South Asian cultures, taking off your ___ before entering a home shows courtesy.", "section": "While you read", "reveal": "shoes", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The text says finishing all the food on your plate is always the polite thing to do everywhere.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says the polite habit differs between countries — sometimes finishing food, sometimes leaving a little.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does understanding other cultures' customs help us do, according to the text?", "section": "While you read", "options": ["Judge people more quickly", "Avoid unfair judgement of others", "Avoid all travel", "Follow only our own norms"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which sentence best describes a 'truly polite person' according to the text?", "section": "While you read", "options": ["Someone who never leaves their own country", "Someone who respects both their own and others' norms", "Someone who always shakes hands", "Someone who never eats at other people's homes"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which custom described in the text was new information for you?", "Do you think it's important to learn local customs before travelling? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "What Makes a Good Person?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What three words would you use to describe a person with good values?", "Do you think values like honesty and kindness are the same everywhere, or do they change from place to place?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "What Makes a Good Person?", "num": 1, "total": 5, "text": "If you ask ten different people what makes a good person, you will probably get ten different answers. Still, certain values appear again and again in these answers: honesty, kindness, respect, and responsibility. Many people believe that a good person is not only kind to their friends but also fair to strangers.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What Makes a Good Person?", "num": 2, "total": 5, "text": "Honesty is often mentioned first. Telling the truth, even when it is uncomfortable, builds trust between people. A student who admits a mistake honestly, instead of blaming someone else, earns more respect in the long run than one who hides the truth. Integrity — doing the right thing even when no one is watching — is closely connected to honesty.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What Makes a Good Person?", "num": 3, "total": 5, "text": "Kindness and empathy are also seen as essential. A kind person notices when someone is struggling and offers help without expecting anything in return. Empathy allows us to imagine how another person feels, which makes it easier to be patient and understanding, especially with people whose experiences are very different from our own.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What Makes a Good Person?", "num": 4, "total": 5, "text": "Responsibility matters too. Good citizens take responsibility for their actions, both at home and in their community. They understand that their choices — whether it's keeping a promise or recycling their waste — affect other people. Being responsible is not always exciting, but it is one of the clearest signs of maturity.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What Makes a Good Person?", "num": 5, "total": 5, "text": "In the end, there is probably no single answer to what makes a good person. It depends on either the culture you grew up in or the personal experiences that shaped you. What most people can agree on, however, is that values like honesty, kindness, and responsibility make communities stronger — wherever you happen to live.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, which value is mentioned as being closely connected to honesty?", "section": "While you read", "options": ["Patience", "Integrity", "Diversity", "Loyalty"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ allows us to imagine how another person feels.", "section": "While you read", "reveal": "Empathy", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What example does the text give of a responsible action?", "section": "While you read", "options": ["Winning a competition", "Keeping a promise or recycling waste", "Getting good grades", "Travelling to a new country"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The text says there is one single, universal answer to what makes a good person.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says there is probably no single answer; it depends on culture and personal experience.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does a student who honestly admits a mistake earn, according to the text?", "section": "While you read", "options": ["Less trust", "More respect in the long run", "A better grade", "No consequences"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the last paragraph?", "section": "While you read", "options": ["Only one culture has good values", "Values like honesty and kindness make communities stronger everywhere", "Responsibility is not important", "People never agree on values"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which value discussed in the text do you think is the most important? Why?", "Can you think of an example from your own life that shows honesty, kindness, or responsibility?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Which Value Matters Most?", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What would you say if someone asked you to name the most important value in life?", "Listen and find out which values the two speakers mention."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Which Value Matters Most?", "audio": null, "transcript": [{"speaker": "A", "line": "Okay, for our debate club topic this week — which is more important, honesty or kindness?"}, {"speaker": "B", "line": "That's a tough one. I'd say honesty, actually. Without honesty, you can't really trust anyone, even a kind person."}, {"speaker": "A", "line": "I see your point, but I think kindness matters more. You can be both honest and quite harsh at the same time, and that can really hurt people."}, {"speaker": "B", "line": "True, but a kind lie is still a lie. If a friend asks for your honest opinion about their project and you just say something nice to avoid hurting them, are you really helping them?"}, {"speaker": "A", "line": "Good question. Maybe the real answer is that we need both — honesty delivered with kindness."}, {"speaker": "B", "line": "Exactly. Neither value on its own is enough. It's not only what you say but also how you say it."}, {"speaker": "A", "line": "So for our presentation, let's argue that a good friend is neither purely honest nor purely kind — they combine both."}, {"speaker": "B", "line": "Perfect. Let's write that down before we forget it."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the debate club's topic in this conversation?", "section": "While you listen", "options": ["Whether honesty or kindness is more important", "Whether to join a new club", "Which subject is hardest", "Whether to write an essay"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Speaker B's first opinion?", "section": "While you listen", "options": ["Kindness matters most", "Honesty matters most", "Neither matters", "Both are unimportant"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Speaker A says a good friend is ___ purely honest ___ purely kind.", "section": "While you listen", "reveal": "neither...nor", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "By the end of the conversation, the speakers agree that only one value is important.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They agree that honesty and kindness need to work together, not that only one matters.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What do the speakers decide to argue in their presentation?", "section": "While you listen", "options": ["Honesty is the only value that matters", "Kindness is the only value that matters", "A good friend combines both honesty and kindness", "Values don't matter in friendship"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Do you agree with the speakers' final conclusion? Why or why not?", "Can you think of a time when being honest and being kind seemed to conflict?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Customs from My Grandmother's Village", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What is one custom or tradition your family follows?", "Listen and note down which value the speaker's family custom teaches."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Customs from My Grandmother's Village", "audio": null, "transcript": [{"speaker": "Student", "line": "Hi everyone. For my presentation today, I want to talk about a small custom from my grandmother's village. Every Sunday, the whole family sits down together for a big meal, and before anyone starts eating, the youngest person at the table has to say one thing they are grateful for that week."}, {"speaker": "Student", "line": "At first, I thought it was a little strange — I mean, either you're hungry and want to eat, or you're standing there talking, right? But over time, I realised the custom isn't really about the food. It's about gratitude and respect for the people around you."}, {"speaker": "Student", "line": "My grandmother says this tradition is not only about saying 'thank you' but also about noticing the good things in your life, even during a difficult week. Neither rich nor poor families in her village skip this small ritual — everyone does it, from children to grandparents."}, {"speaker": "Student", "line": "Now, whenever my family gets together, we try to keep the custom going, even though we live in the city. It reminds us that some values, like gratitude, don't change, even when everything else around us does."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does the youngest person at the table have to do, according to the custom?", "section": "While you listen", "options": ["Cook the meal", "Say one thing they are grateful for", "Wash the dishes", "Choose the menu"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The speaker says the custom is not only about saying thank you ___ also about noticing good things.", "section": "While you listen", "reveal": "but", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the speaker, only rich families in the village follow this custom.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The speaker says neither rich nor poor families skip the custom — everyone follows it.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What value does this custom mainly teach, according to the speaker?", "section": "While you listen", "options": ["Honesty", "Gratitude", "Punctuality", "Competition"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What is a value that your own family custom teaches?", "Do you think old customs like this one are still useful in modern city life?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Which Value Matters Most?", "text": "In pairs, look at a list of values (honesty, kindness, respect, responsibility, tolerance) and discuss which one matters most in friendship, and which matters most in society, giving reasons.", "steps": ["Look at the list of five values together.", "Individually, rank the values from most to least important for a good friend.", "Compare your rankings with your partner and explain your reasons.", "Discuss whether your ranking would change for 'a good citizen' instead of 'a good friend'.", "Agree on one shared opinion to share with the class."], "chips": ["In my opinion, ... matters most because...", "I both agree and disagree with that...", "Either ... or ... is more important, in my view...", "That's an interesting point, but have you considered...?"], "timer": 600, "levels": ["Give students a simplified list of just three values and sentence starters on the board.", "Students give at least two supported reasons for their ranking.", "Students challenge their partner's ranking with a counter-example."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Comparing Customs", "text": "In groups, each student describes one custom or tradition from their own family or community that reflects an important value. The group then compares the customs and discusses the shared values behind them.", "steps": ["Individually, think of one custom from your own family or community.", "Take turns describing your custom and the value behind it to the group.", "Ask each speaker at least one follow-up question.", "As a group, identify two values that appear in more than one custom.", "Prepare a short summary to share with the class."], "chips": ["In my family, we both... and...", "This custom shows respect because...", "Neither of our customs is more correct than the other...", "That reminds me of..."], "timer": 600, "levels": ["Provide example customs (e.g. a birthday tradition, a holiday meal) students can choose from if they prefer not to share personal details.", "Students describe their custom clearly and identify the value behind it.", "Groups compare how similar values are expressed differently across their customs."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Most Important Value", "text": "Write a paragraph giving your opinion on the value you think is most important for a good friend, using correlative conjunctions to support your opinion.", "steps": ["Choose one value (e.g. honesty, kindness, respect, loyalty).", "State your opinion clearly in the first sentence.", "Give two reasons, using both...and or not only...but also.", "End with one sentence about why this value matters to you personally."], "chips": ["value", "honesty", "kindness", "respect", "loyalty", "trust", "In my opinion, ... is the most important value because...", "A good friend is both ... and ...", "Not only does this value help ..., but it also ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "Comparing Two Customs", "text": "Write a short paragraph comparing two customs or norms (from your own experience, family, or general knowledge) and explain what value each one shows.", "steps": ["Choose two customs to compare.", "Briefly describe each custom in one or two sentences.", "Explain the value behind each custom.", "Use either...or or neither...nor to compare or contrast them.", "End with a sentence about what the two customs have in common."], "chips": ["custom", "norm", "etiquette", "tolerance", "courtesy", "One custom is..., while the other is...", "Neither custom is better than the other; they simply...", "You can either... or..., depending on the culture."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "She is ___ honest ___ generous; everyone admires her.", "section": "Exit ticket", "options": ["either...or", "both...and", "neither...nor", "not...but"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A good citizen is ___ responsible ___ helpful to the community.", "section": "Exit ticket", "reveal": "not only...but also", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word best completes: 'Removing your shoes before entering a home is a common ___ in many countries.'", "section": "Exit ticket", "options": ["value", "custom", "achievement", "risk"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to Reading 1, all cultures follow exactly the same table manners.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Table manners vary between cultures, according to the text.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In the listening dialogue, what do the speakers finally agree matters in friendship?", "section": "Exit ticket", "options": ["Only honesty", "Only kindness", "Both honesty and kindness together", "Neither value matters"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "He is ___ dishonest ___ unkind.", "section": "Exit ticket", "reveal": "neither...nor", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: is / neither / lazy / nor / dishonest / he", "section": "Exit ticket", "words": ["he", "is", "neither", "lazy", "nor", "dishonest"], "end": ".", "reveal": "He is neither lazy nor dishonest.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using either...or: You can apologise. You can explain your reasons.", "section": "Exit ticket", "reveal": "You can either apologise or explain your reasons.", "prompt": "You can either...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to Reading 2, what value is closely connected to honesty?", "section": "Exit ticket", "options": ["Patience", "Integrity", "Diversity", "Tolerance"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which sentence uses correlative conjunctions correctly?", "section": "Exit ticket", "options": ["She is both kind and she is honest.", "She is both kind and honest.", "She is both kind or honest.", "She is neither kind or honest."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}], "theme": "Year 11 · Theme 10 · Values and Norms", "key": "year-11-10"}</script><script src="../../../assets/us-present.js"></script></body></html>
