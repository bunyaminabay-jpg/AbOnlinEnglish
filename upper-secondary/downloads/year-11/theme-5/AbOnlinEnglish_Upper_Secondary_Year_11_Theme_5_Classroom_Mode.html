heck with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Combine into one third conditional sentence: He didn't apologise. She stayed angry.", "section": "", "reveal": "If he had apologised, she wouldn't have stayed angry.", "prompt": "If he had apologised, ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If the weather ___ (not be) so bad, we could have gone hiking instead of staying home.", "section": "", "reveal": "hadn't been", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Wish + Past Perfect (regrets)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I <mark>wish I had listened<\/mark> to my parents' advice.", "She <mark>wishes she hadn't sold<\/mark> her old guitar.", "We <mark>wish we had visited<\/mark> that museum when we had the chance.", "He <mark>wishes he had asked<\/mark> for help sooner."], "ask": "What do you notice about the verb form after 'wish', and what feeling does this structure express about the past?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["had taken", "hadn't missed", "had told", "hadn't lost"], "chips": true, "text": "Complete the sentences with wish + past perfect.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "I wish I ___ (take) more photos on that trip.", "section": "Complete the rule", "reveal": "had taken", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He wishes he ___ (not miss) the concert last night.", "section": "Complete the rule", "reveal": "hadn't missed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use wish + subject + had + past participle to express regret about something in the past that we cannot change.", "tr": "Wish + özne + had + past participle yapısını, değiştiremeyeceğimiz geçmişteki bir durum için pişmanlık ifade etmek amacıyla kullanırız.", "when_en": "We use it when we want to say that we would like something in the past to have been different, unlike how it really was.", "when": "Geçmişte gerçekte olandan farklı bir şeyin olmasını istediğimizi ifade etmek için kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I / not save / my money"], "reveal": "I wish I hadn't spent all my money.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she / not argue / with her best friend"], "reveal": "She wishes she hadn't argued with her best friend.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we / visit / grandma more often"], "reveal": "We wish we had visited grandma more often.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he / not quit / the team"], "reveal": "He wishes he hadn't quit the team.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they / ask / for directions"], "reveal": "They wish they had asked for directions.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about your own regrets using wish + past perfect.", "chips": ["I wish I had ...", "I wish I hadn't ...", "My friend wishes ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Subject + wish(es) + subject + had + past participle."], "negative": ["Subject + wish(es) + subject + hadn't + past participle."], "question": ["Do/Does + subject + wish + subject + had + past participle?"], "short": ["Yes, I do. / No, she doesn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I wish I would have gone to the party.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I wish I had gone to the party.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She wish she had known earlier.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She wishes she had known earlier.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I wish I ___ harder for the test.", "section": "", "options": ["study", "studied", "had studied", "have studied"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "They wish they ___ (not sell) their old house.", "section": "", "reveal": "hadn't sold", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "He wish he had called his brother.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He wishes he had called his brother.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a regret: She didn't apply for the job, and now she is sorry.", "section": "", "reveal": "She wishes she had applied for the job.", "prompt": "She wishes ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We wish we ___ (visit) Istanbul when we were near Turkey.", "section": "", "reveal": "had visited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly expresses a past regret?", "section": "", "options": ["I wish I go home earlier.", "I wish I went home earlier.", "I wish I had gone home earlier.", "I wish I have gone home earlier."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine into one sentence with wish: He didn't practise. Now he plays badly.", "section": "", "reveal": "He wishes he had practised.", "prompt": "He wishes ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I wish I ___ (not lose) touch with my old classmates.", "section": "", "reveal": "hadn't lost", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Letter I Never Sent", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What is something you wish you had done differently at school?", "Look at the title. What do you think the writer regrets?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 1, "total": 4, "text": "When I was seventeen, my best friend Deniz moved to another city with her family. We promised to write letters every week, but somehow life got busy and I never kept my promise. If I had written to her just once a month, our friendship would have survived the distance. Instead, the letters stopped after only a few weeks, and slowly we lost touch completely.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 2, "total": 4, "text": "Last year, I found an old, unfinished letter to Deniz in a box under my bed. I had started it years ago but never finished it, and I never sent it. Reading it again, I realised how much I regretted losing such an important friendship. If I hadn't been so lazy about writing back then, we might still be close friends today. I wish I had understood, at seventeen, how rare a good friendship really is.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 3, "total": 4, "text": "This year, I finally decided to do something about it. I found Deniz on social media and sent her a message, admitting that I wished I had kept in touch all those years ago. To my surprise, she replied within a day. She told me that she had often wondered what would have happened if either of us had made more effort. We are now planning to meet for coffee next month, twenty years after we last saw each other.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 4, "total": 4, "text": "Looking back, I don't think either of us was a bad friend — we were just young and didn't understand how quickly people can drift apart. If we had known then what we know now, we would have made more time for each other. But I've also learned that it's never too late to fix a mistake from the past, even if it takes twenty years to do it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Why did the writer and Deniz lose touch?", "section": "While you read", "options": ["They had an argument.", "They stopped writing letters regularly.", "Deniz didn't want to be friends anymore.", "The writer moved away first."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The writer sent the unfinished letter to Deniz years ago.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The writer never sent the unfinished letter; she found it later, unsent.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The writer says: 'I wish I ___ how rare a good friendship really is.'", "section": "While you read", "reveal": "had understood", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "How did Deniz react when the writer contacted her again?", "section": "While you read", "options": ["She ignored the message.", "She was angry.", "She replied quickly and was open to reconnecting.", "She said it was too late."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "According to the text, what does the writer believe about fixing past mistakes? Write one sentence using your own words.", "section": "While you read", "reveal": "The writer believes it is never too late to fix a mistake from the past.", "prompt": "The writer believes ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the last paragraph?", "section": "While you read", "options": ["Friendships never last.", "People should blame themselves for losing friends.", "It's never too late to repair a lost friendship.", "Social media is the best way to make new friends."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Do you agree that it's never too late to fix a friendship? Why or why not?", "Have you ever reconnected with someone from your past? What happened?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "What If the Bridge Hadn't Been Built?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Think of one famous building or structure in your city or country. Why is it important?", "What do you think would be different if a famous bridge in your country had never been built?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "What If the Bridge Hadn't Been Built?", "num": 1, "total": 4, "text": "Every town has a story about a decision that changed everything. In one small coastal town, local leaders had to decide whether to build a bridge connecting it to the mainland. Many people were against the idea; they worried that a bridge would destroy the town's quiet, traditional way of life. If the town council had listened to these voices, the bridge would never have been built.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What If the Bridge Hadn't Been Built?", "num": 2, "total": 4, "text": "However, the council decided to go ahead with the project. The bridge opened fifteen years ago, and the town changed completely. Tourists began arriving by car instead of by the old, slow ferry. New hotels, cafés, and shops appeared along the coast. If the bridge hadn't been built, none of this growth would have happened, and the town might still look exactly as it did decades ago.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What If the Bridge Hadn't Been Built?", "num": 3, "total": 4, "text": "Not everyone is happy with the changes. Some older residents say that if the town had stayed isolated, it would have kept its peaceful character. They believe the fishing community that once defined the town has been replaced by a tourist economy that cares more about profit than tradition. They often wonder what would have happened if the bridge project had been rejected all those years ago.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "What If the Bridge Hadn't Been Built?", "num": 4, "total": 4, "text": "Younger residents, on the other hand, tend to see the bridge differently. Many of them would have had to leave the town to find work if the bridge — and the tourism it brought — hadn't been built. For them, the bridge didn't destroy the town; it saved it from slowly disappearing as young people moved away. Both sides agree on one thing: that single decision changed the town's future forever.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Why were some people originally against building the bridge?", "section": "While you read", "options": ["It was too expensive.", "They thought it would destroy the town's traditional way of life.", "They didn't trust the council.", "There was no need for tourists."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If the bridge ___ (not/build), the town might still look exactly as it did decades ago.", "section": "While you read", "reveal": "hadn't been built", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "All residents agree that the bridge was a bad decision.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Older and younger residents disagree; younger residents generally see the bridge more positively.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "According to younger residents, what would have happened without the bridge?", "section": "While you read", "options": ["The town would have grown faster.", "Many young people would have had to leave to find work.", "Tourism would have increased anyway.", "Nothing would have changed."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Summarise in one sentence how the bridge changed the town's economy.", "section": "While you read", "reveal": "The bridge turned the town from a fishing community into a tourist economy.", "prompt": "The bridge changed the town's economy by ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think the council made the right decision? Why or why not?", "Can you think of a real decision in your own country that changed a place forever?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Conversation About Regrets", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What is one small decision that can change a person's whole future?", "Listen for what each speaker wishes had been different."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Conversation About Regrets", "audio": null, "transcript": [{"speaker": "A", "line": "You look thoughtful. What are you thinking about?"}, {"speaker": "B", "line": "Honestly, I was just remembering my old football coach. I wish I had listened to him more carefully back then."}, {"speaker": "A", "line": "Why? What did he tell you?"}, {"speaker": "B", "line": "He said if I had trained every single day instead of just three times a week, I could have played for a much better team. I didn't believe him at the time."}, {"speaker": "A", "line": "Do you regret not training more?"}, {"speaker": "B", "line": "A little, yes. If I had trained harder, my whole career in sports might have been completely different. But I don't blame myself too much — I was only sixteen."}, {"speaker": "A", "line": "That's true. I have a similar regret, actually. I wish I hadn't dropped my art classes in school."}, {"speaker": "B", "line": "Really? Why did you drop them?"}, {"speaker": "A", "line": "I thought art wasn't a 'serious' subject. If I had continued, I might have studied design at university instead of business."}, {"speaker": "B", "line": "Well, it's not too late to pick it up again, you know."}, {"speaker": "A", "line": "You're right. Maybe I should have thought of that sooner!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does Speaker B regret?", "section": "While you listen", "options": ["Choosing the wrong sport", "Not training harder with his coach", "Losing contact with his coach", "Playing for the wrong team"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Speaker B says: 'If I ___ every single day, I could have played for a much better team.'", "section": "While you listen", "reveal": "had trained", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Speaker A regrets studying business at university.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Speaker A regrets dropping art classes, not studying business.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Speaker B suggest at the end of the conversation?", "section": "While you listen", "options": ["Speaker A should quit their job.", "Speaker A should take art classes again.", "Speaker A should apologise to their teacher.", "Speaker A should study business more."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Do you agree with Speaker B that it's 'not too late' to return to an old interest?", "What is a hobby or subject you wish you hadn't given up?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "What If...? History Discussion", "text": "In pairs, discuss two 'what if' scenarios about important moments in history or in your country, using the third conditional to imagine different results.", "steps": ["Choose one historical or well-known event you both know.", "Individually, think of one way the event could have gone differently.", "Take turns sharing your 'what if' idea using the third conditional.", "Ask your partner at least two follow-up questions about their idea.", "Together, agree on the most interesting 'what if' scenario and prepare to share it with the class."], "chips": ["If ... hadn't happened, ... would have ...", "I think things could have been very different because ...", "That's an interesting point, but what about ...?", "I wonder what would have happened if ..."], "timer": 600, "levels": ["Give students a short list of well-known historical events to choose from, plus sentence starters on the board.", "Students create at least two original third conditional sentences per event without prompts.", "Students extend the discussion to a chain of consequences (e.g. 'If X hadn't happened, then Y wouldn't have happened, and then Z...')."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "My Biggest 'What If'", "text": "Take turns sharing a personal regret or a 'what if' moment from your own life, using wish + past perfect and the third conditional, while the group listens and reacts.", "steps": ["Think privately of one small regret you feel comfortable sharing (school, sports, friendships, hobbies).", "In your group, take turns sharing your regret using at least one target structure.", "After each person speaks, the group asks one follow-up question.", "As a group, decide whose 'what if' story was the most surprising.", "Share your group's most surprising story with the whole class."], "chips": ["I wish I had/hadn't ...", "If I had ..., my life would have been ...", "That sounds like a tough decision.", "Do you think you'll ever get another chance?"], "timer": 600, "levels": ["Provide a model regret sentence and allow students to talk about a general topic rather than a deeply personal one.", "Students share one full regret with a follow-up explanation using both target grammar points.", "Students give their group members spoken advice using 'You should have...' in response to each regret."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Turning Point: What If It Had Been Different?", "text": "Write a short reflective paragraph about a real turning point in your life (or in the life of someone you know) and imagine how things could have been different, using the third conditional.", "steps": ["Choose one real turning point (a decision, an event, a meeting).", "Briefly describe what actually happened.", "Write 2-3 third conditional sentences imagining a different result.", "End with one sentence about how you feel about the real outcome now."], "chips": ["turning point", "decision", "outcome", "opportunity", "look back on", "If ... hadn't happened, ... would/could/might have ...", "Looking back, I think ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Letter of Regret", "text": "Write a short informal letter or message to an old friend or family member, expressing one or two regrets using wish + past perfect and explaining what you would do differently now.", "steps": ["Start with a friendly greeting.", "Explain one thing you wish had been different, using wish + past perfect.", "Explain briefly why you feel this way.", "End with a positive or hopeful closing line."], "chips": ["regret", "reflect on", "chance", "wonder", "regretfully", "I wish I had/hadn't ...", "If I had ..., things might have been ...", "I hope we can ... now."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "If she ___ earlier, she wouldn't have missed the flight.", "section": "Exit ticket", "options": ["leaves", "left", "had left", "would leave"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I wish I ___ (not lose) my grandfather's old watch.", "section": "Exit ticket", "reveal": "hadn't lost", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word best completes: 'Choosing to study abroad was a real ___ in her life.'", "section": "Exit ticket", "options": ["outcome", "turning point", "circumstance", "consequence"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "If I would have known, I wouldn't have said that.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "If I had known, I wouldn't have said that.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In the reading 'The Letter I Never Sent', why did the writer and Deniz lose touch?", "section": "Exit ticket", "options": ["They argued.", "They stopped writing letters regularly.", "Deniz didn't like her anymore.", "They lived in the same city."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "He ___ (might/pass) the exam if he had studied a little more.", "section": "Exit ticket", "reveal": "might have passed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "In the listening dialogue, what does Speaker A regret?", "section": "Exit ticket", "options": ["Studying business", "Dropping art classes", "Playing football", "Missing a competition"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: hadn't / she / if / studied / harder / passed / wouldn't have / she", "section": "Exit ticket", "words": ["if", "she", "hadn't", "studied", "harder,", "she", "wouldn't", "have", "passed"], "end": ".", "reveal": "If she hadn't studied harder, she wouldn't have passed.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using wish: He didn't call his friend back, and now he regrets it.", "section": "Exit ticket", "reveal": "He wishes he had called his friend back.", "prompt": "He wishes ...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly uses the third conditional?", "section": "Exit ticket", "options": ["If I have more time, I would have travelled.", "If I had more time, I would travel more.", "If I had had more time, I would have travelled more.", "If I had had more time, I travel more."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}], "theme": "Year 11 · Theme 5 · Back to the Past", "key": "year-11-5"}</script><script src="../../../assets/us-present.js"></script></body></html>
