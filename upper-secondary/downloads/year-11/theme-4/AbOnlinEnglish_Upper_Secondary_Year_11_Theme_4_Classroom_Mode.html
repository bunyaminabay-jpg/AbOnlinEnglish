 "kicker": "Grammar", "title": "Past Perfect (had + past participle)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["When we arrived at the cinema, the film <mark>had already started<\/mark>.", "She <mark>had never visited<\/mark> Istanbul before she moved there last year.", "By the time he was twenty, he <mark>had lived<\/mark> in three different countries.", "I couldn't call you because I <mark>had lost<\/mark> my phone earlier that day."], "ask": "What do you notice about the verb form 'had + past participle', and which action happened first in each sentence?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["finish", "leave", "never see", "already eat", "not visit", "close"], "chips": true, "text": "Complete each sentence with the Past Perfect form of the verb in brackets.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "By the time we got to the station, the train ___ (leave).", "section": "Complete the rule", "reveal": "had left", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She ___ (never see) snow before she travelled to the mountains that winter.", "section": "Complete the rule", "reveal": "had never seen", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "When I arrived at the party, most guests ___ (already eat) dinner.", "section": "Complete the rule", "reveal": "had already eaten", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "They ___ (not visit) the museum before they moved to that city.", "section": "Complete the rule", "reveal": "had not visited / hadn't visited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The shop ___ (close) by the time we got there at 8 pm.", "section": "Complete the rule", "reveal": "had closed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We form the Past Perfect with had + the past participle of the verb. We use it for an action that happened before a specific past time, or before another past action.", "tr": "Past Perfect, had + fiilin üçüncü hali (past participle) ile oluşturulur. Belirli bir geçmiş zamandan önce ya da geçmişteki başka bir olaydan önce gerçekleşen bir eylemi anlatmak için kullanılır.", "when_en": "We use the Past Perfect to show the earlier of two past actions, often with time markers like 'before', 'after', 'already', 'by the time', 'when' and 'never...before'.", "when": "İki geçmiş eylemden daha önce gerçekleşeni belirtmek için Past Perfect kullanılır; genellikle 'before', 'after', 'already', 'by the time', 'when' ve 'never...before' gibi zaman ifadeleriyle birlikte kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["she", "finish", "homework", "before dinner"], "reveal": "She had finished her homework before dinner.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "already leave", "when I called"], "reveal": "He had already left when I called.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "never try", "that food", "before the trip"], "reveal": "We had never tried that food before the trip.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the teacher", "explain", "the topic", "before the test"], "reveal": "The teacher had explained the topic before the test.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "not finish", "the project", "by Friday"], "reveal": "They had not finished the project by Friday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "read", "the book", "before watching the film"], "reveal": "I had read the book before watching the film.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "live", "abroad", "before she returned home"], "reveal": "She had lived abroad before she returned home.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about your own life using the Past Perfect to show which past action happened first.", "chips": ["By the time I started high school, I had already...", "Before I met my best friend, I had...", "When I was ten, I had never..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["She had finished the report before the meeting started.", "They had already left when we arrived."], "negative": ["He had not seen the message before he replied.", "We hadn't visited that city before last summer."], "question": ["Had you finished your homework before dinner?", "Had she ever travelled abroad before that trip?"], "short": ["Yes, I had. / No, I hadn't.", "Yes, she had. / No, she hadn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "When I arrived, the film already started.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "When I arrived, the film had already started.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She had went to Paris before she moved to London.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She had gone to Paris before she moved to London.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "By the time he was twenty, he lived in three countries.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "By the time he was twenty, he had lived in three countries.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "By the time she was eighteen, she ___ (travel) to five different countries.", "section": "", "reveal": "had travelled / had traveled", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["When we got home, it started to rain.", "When we got home, it had started to rain.", "When we got home, it has started to rain.", "When we got home, it starts to rain."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "She had never met him before that party.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "He ___ his keys, so he couldn't get into the house.", "section": "", "options": ["lost", "had lost", "loses", "has lost"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: (already / the / had / bus / left / when / I arrived)", "section": "", "words": ["the", "bus", "had", "already", "left", "when", "I", "arrived"], "end": ".", "reveal": "The bus had already left when I arrived.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "___ you ever ___ (be) to that museum before last week's trip?", "section": "", "reveal": "Had, been", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Combine using the Past Perfect: The train left. I got to the station five minutes later.", "section": "", "reveal": "The train had left by the time I got to the station. / When I got to the station, the train had already left.", "prompt": "By the time...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence uses the Past Perfect correctly?", "section": "", "options": ["I hadn't eaten anything before the show start.", "I hadn't eaten anything before the show started.", "I don't eaten anything before the show started.", "I not ate anything before the show started."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as one sentence using the Past Perfect: She finished her project. Then she went to bed.", "section": "", "reveal": "She had finished her project before she went to bed. / After she had finished her project, she went to bed.", "prompt": "After...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The city ___ completely (change) by the time she returned after twenty years abroad.", "section": "", "reveal": "had changed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the best continuation: 'By the time the film finished, most of the audience...'", "section": "", "options": ["fell asleep.", "had fallen asleep.", "falls asleep.", "has fallen asleep."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Past Perfect with time expressions (before, after, already, by the time, never...before)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>Before<\/mark> she moved to the city, she had lived in a small village all her life.", "He felt proud because he <mark>had already<\/mark> finished the marathon once before.", "<mark>By the time<\/mark> the guests arrived, we had prepared everything.", "It was the first time she <mark>had ever<\/mark> seen the ocean."], "ask": "Which time expressions help you decide when to use the Past Perfect instead of the Simple Past?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["before", "by the time", "already", "never...before", "after"], "chips": true, "text": "Complete each sentence with the correct time expression from the bank.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "___ we left the house, we had checked all the windows.", "section": "Complete the rule", "reveal": "Before", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ the concert started, all the seats had been taken.", "section": "Complete the rule", "reveal": "By the time", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She had ___ heard that song before it became popular.", "section": "Complete the rule", "reveal": "already", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It was the first trip he had ___ taken abroad.", "section": "Complete the rule", "reveal": "never...before", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ they had signed the contract, they started the new project.", "section": "Complete the rule", "reveal": "After", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Time expressions such as 'before', 'after', 'already', 'by the time' and 'never...before' are often used with the Past Perfect to make the sequence of past events clear.", "tr": "'Before', 'after', 'already', 'by the time' ve 'never...before' gibi zaman ifadeleri, geçmişteki olayların sırasını netleştirmek için genellikle Past Perfect ile birlikte kullanılır.", "when_en": "We choose the time expression depending on which action we want to highlight as earlier, and we combine it with the Past Perfect for that earlier action.", "when": "Hangi eylemin daha önce gerçekleştiğini vurgulamak istediğimize göre zaman ifadesini seçeriz ve bu daha önceki eylemi Past Perfect ile birleştiririz.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["before", "she", "arrive", "we / finish / dinner"], "reveal": "Before she arrived, we had finished dinner.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["by the time", "the bell ring", "students / leave"], "reveal": "By the time the bell rang, the students had left.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["already", "he / read / the letter", "before I told him"], "reveal": "He had already read the letter before I told him.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["never...before", "she / feel", "so nervous"], "reveal": "She had never felt so nervous before.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["after", "they / finish / the exam", "they / celebrate"], "reveal": "After they had finished the exam, they celebrated.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 sentences about a memorable event in your life using at least two of these time expressions: before, after, already, by the time, never...before.", "chips": ["By the time I finished school, I had...", "I had never... before the day I..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["By the time we got there, the show had already begun.", "After she had finished her studies, she started working."], "negative": ["Before the interview, he hadn't prepared any questions.", "By the time I called, they hadn't left yet."], "question": ["Had you ever visited that country before your trip last year?", "By the time you got home, had your family already eaten?"], "short": ["Yes, I had. / No, I hadn't.", "Yes, they had. / No, they hadn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "By the time she arrived, we finish the cake.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "By the time she arrived, we had finished the cake.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "It was the first time I have seen snow.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It was the first time I had seen snow.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "After she had arrived home, she was calling her mother.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "After she had arrived home, she called her mother.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "___ the time she called, I ___ (already leave) the office.", "section": "", "reveal": "By, had already left", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "It was the first time he ___ a live concert.", "section": "", "options": ["saw", "had seen", "has seen", "sees"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "After they had eaten dinner, they went for a walk.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Join using 'before': She locked the door. Then she left the house.", "section": "", "reveal": "She had locked the door before she left the house. / Before she left the house, she had locked the door.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["Never before I had travelled so far.", "I had never travelled so far before.", "I have never travelled so far before that.", "I never had travelled so far before."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine with 'by the time': The guests left. We hadn't cleaned the kitchen yet.", "section": "", "reveal": "By the time the guests left, we hadn't cleaned the kitchen. / We hadn't cleaned the kitchen by the time the guests left.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It was the first time she ___ (be) responsible for organising an event on her own.", "section": "", "reveal": "had been", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Teacher Who Never Gave Up", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of life story do you expect to read?", "Have you ever heard of someone who overcame great hardship to succeed?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Teacher Who Never Gave Up", "num": 1, "total": 5, "text": "By the time Elif turned forty, she had already achieved something that few people from her small village had ever managed: she had become the headteacher of the region's largest school. But her path there had not been easy.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Teacher Who Never Gave Up", "num": 2, "total": 5, "text": "Elif had grown up in a mountain village where, at the time, few girls had continued their education beyond primary school. Her parents had never gone to secondary school themselves, but they had always believed that education could change their daughter's future. By the time she was twelve, Elif had already decided that she wanted to become a teacher, even though nobody in her family had ever worked in education before.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Teacher Who Never Gave Up", "num": 3, "total": 5, "text": "After she had finished secondary school in the nearest town, she had to travel two hours by bus every day to attend university. She later said that by the time she graduated, she had missed countless family events and had faced financial hardship that had tested her more than once. Still, she had never given up on her goal.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Teacher Who Never Gave Up", "num": 4, "total": 5, "text": "Her first teaching post had been in a small rural school that had not had enough books or equipment. Elif had spent her own savings buying materials for her students. Within a few years, word of her dedication had spread, and by the time a position opened at the regional school, she had already built a reputation as one of the most resilient teachers in the area.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Teacher Who Never Gave Up", "num": 5, "total": 5, "text": "Today, when Elif looks back, she says that everything she had gone through had shaped the teacher she eventually became. Her story has become an inspiration for many young people in her village who now believe that, like her, they too can overcome hardship and reach their own milestones.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What had Elif achieved by the time she turned forty?", "section": "While you read", "options": ["She had opened her own school.", "She had become the headteacher of the region's largest school.", "She had written a book about education.", "She had moved to a different country."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Elif's parents had studied at secondary school themselves.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif's parents had never gone to secondary school themselves.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "By the time she was twelve, Elif had already ___ that she wanted to become a teacher.", "section": "While you read", "reveal": "decided", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What had Elif done with her own savings?", "section": "While you read", "options": ["She had bought a house.", "She had paid for her university fees.", "She had bought materials for her students.", "She had donated them to her village."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Explain in your own words why Elif's journey to becoming a teacher had not been easy.", "section": "While you read", "reveal": "She had to travel long distances, missed family events, and faced financial hardship before finishing university.", "prompt": "Elif's journey had not been easy because...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you know anyone whose life story resembles Elif's? What made them resilient?", "What milestone would you like to have achieved by the time you are forty?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Return to the Abandoned House", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Predict: why might someone want to return to a place they lived in as a child?", "What feelings do old, abandoned places often create?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Return to the Abandoned House", "num": 1, "total": 5, "text": "When Kerem parked his car in front of the old house, he felt a wave of nostalgia. He had not visited the place since his family had relocated to the city twenty years earlier, and by the time he got out of the car, memories he had almost forgotten had already begun to return.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Return to the Abandoned House", "num": 2, "total": 5, "text": "The house looked very different from how he remembered it. The garden his grandfather had once carefully looked after had become overgrown, and the walls, which had been painted a bright blue when he was a child, were now faded and cracked. Someone had clearly abandoned the property years before, and nature had slowly taken it back.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Return to the Abandoned House", "num": 3, "total": 5, "text": "Kerem walked through what had once been the kitchen. He recalled that his grandmother had always been cooking something there, and the smell of fresh bread had filled the whole house every morning. He remembered that, before he had even woken up, she had usually already prepared breakfast for the whole family.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Return to the Abandoned House", "num": 4, "total": 5, "text": "In the corner of the main room, Kerem found an old wooden chest that his family had left behind when they had moved. Inside, he discovered photographs that had faded over the decades, along with a notebook his grandfather had written in. As he read the pages, he realised how much of his family's history he had never known before that moment.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Return to the Abandoned House", "num": 5, "total": 5, "text": "Kerem left the house that afternoon feeling that, although the building had changed completely, the memories it held had not faded at all. He decided that he would come back again soon, this time bringing his own children so they could learn about the place their family had once called home.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "How long had it been since Kerem had visited the house?", "section": "While you read", "options": ["Ten years", "Fifteen years", "Twenty years", "Thirty years"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The garden had been well cared for by the time Kerem returned.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The garden had become overgrown by the time Kerem returned.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Before Kerem had even woken up, his grandmother had usually already ___ breakfast.", "section": "While you read", "reveal": "prepared", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What did Kerem find in the old wooden chest?", "section": "While you read", "options": ["Old clothes and toys", "Photographs and a notebook", "Money and jewellery", "Letters and a map"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "In your own words, explain what Kerem decided to do at the end of the story and why.", "section": "While you read", "reveal": "He decided to bring his own children to the house so they could learn about their family's past.", "prompt": "At the end, Kerem decided...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Have you ever returned to a place from your childhood? What had changed?", "Why do you think old family objects, like photographs or notebooks, matter to people?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Catching Up After Many Years", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What do old friends usually talk about when they meet after a long time?", "Predict two things the speakers might mention that had happened before they met again."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Catching Up After Many Years", "audio": null, "transcript": [{"speaker": "A", "line": "I can't believe it's really you! We hadn't seen each other since we had finished university."}, {"speaker": "B", "line": "I know! By the time I moved back to this city, I had already lost your number, so I couldn't even message you."}, {"speaker": "A", "line": "So much has happened. Before I got this job, I had worked abroad for three years."}, {"speaker": "B", "line": "Really? I hadn't heard that. What had you been doing there?"}, {"speaker": "A", "line": "I had been teaching English in a small school. By the time I left, I had actually learned a new language too."}, {"speaker": "B", "line": "That's amazing. I had never expected you to travel that far from home."}, {"speaker": "A", "line": "Neither had I, honestly! What about you? Had anything changed for you?"}, {"speaker": "B", "line": "Well, by the time I turned thirty, I had already started my own small business, which had always been my dream."}, {"speaker": "A", "line": "That's wonderful. It seems like we had both been busy building our own paths before we finally reunited today."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Why hadn't A and B seen each other?", "section": "While you listen", "options": ["They had had an argument.", "They had lost contact since finishing university.", "They had moved to different countries permanently.", "They had never actually met before."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Before getting her current job, A had worked abroad for three years.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "By the time she left, A had actually ___ a new language too.", "section": "While you listen", "reveal": "learned", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What had B already started by the time he turned thirty?", "section": "While you listen", "options": ["A new job", "A family", "His own small business", "A university course"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What had each speaker achieved before meeting again?", "If you met an old friend after many years, what would you want to tell them had happened to you?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Grandmother's Story", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What kinds of stories do grandparents often tell about their own past?", "Listen for the order of events in the grandmother's life."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Grandmother's Story", "audio": null, "transcript": [{"speaker": "Narrator", "line": "By the time my grandmother was eighteen, she had already left her home town to study in a bigger city."}, {"speaker": "Narrator", "line": "Before she had even finished her studies, she had met my grandfather, who had been working there as an engineer."}, {"speaker": "Narrator", "line": "They had known each other for only a few months when they decided to get married."}, {"speaker": "Narrator", "line": "By the time they celebrated their first anniversary, they had already relocated three times because of my grandfather's work."}, {"speaker": "Narrator", "line": "My grandmother once told me that, before she had turned twenty-five, she had lived in more cities than most people visit in a lifetime."}, {"speaker": "Narrator", "line": "She said that all those experiences had made her a more resilient and open-minded person by the time she finally settled down."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What had the grandmother already done by the age of eighteen?", "section": "While you listen", "options": ["Got married", "Left her home town to study", "Started working as an engineer", "Had children"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The grandmother had known the grandfather for many years before they married.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They had known each other for only a few months before they decided to get married.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "By the time they celebrated their first anniversary, they had already ___ three times.", "section": "While you listen", "reveal": "relocated", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the story, what had shaped the grandmother into a resilient person?", "section": "While you listen", "options": ["Her university studies", "All her different experiences moving to new cities", "Her career as an engineer", "Her time as a teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Which event in the grandmother's story surprised you most?", "Do you know a similar story about a family member's past?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "My Life Before This Moment", "text": "Tell your partner about three things that had already happened in your life before you started this school year, using the Past Perfect.", "steps": ["Think of three events or achievements from your life before this school year began.", "Prepare one or two sentences about each event using the Past Perfect.", "Take turns telling your partner your three events; your partner listens and asks one follow-up question about each.", "Swap roles so both partners get a turn to speak and to ask questions."], "chips": ["By the time I started this year, I had already...", "Before that, I had never...", "I had just... when...", "It was the first time I had ever..."], "timer": 600, "levels": ["Give students a simple sentence frame: 'By the time I started this year, I had already ___.' and let them fill in one event only.", "Students should produce three full sentences using the Past Perfect and answer at least one follow-up question naturally.", "Ask stronger students to link their three events with time expressions (before, after, by the time) into a short connected mini-narrative."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "The Place I Remember", "text": "Describe a memorable place from your past to your group, explaining what it had looked like and what had happened there before it changed or before you left it.", "steps": ["Think of a place from your past (a house, a school, a neighbourhood) that has changed or that you no longer visit.", "Note down two or three details about what the place had been like and what had happened there.", "Describe the place to your group, using the Past Perfect where appropriate to show earlier events.", "Group members ask one question each about the place after the description."], "chips": ["The place I remember most is...", "Before it changed, it had been...", "I had spent a lot of time there because...", "By the time I last saw it, it had already..."], "timer": 600, "levels": ["Provide a picture prompt or a short list of adjectives (quiet, crowded, colourful, old) to help weaker students describe the place.", "Students describe the place clearly with at least two Past Perfect sentences and respond to group questions.", "Ask stronger students to compare how the place looked before and how it might look now, using contrastive language."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Memorable Day", "text": "Write a short narrative about a memorable day in your past, making it clear what had already happened before the main event of the day.", "steps": ["Choose the memorable day you will write about.", "List two or three things that had already happened before the main event of that day.", "Decide on the order of events and which time expressions to use.", "Write a short paragraph, then check your verb forms."], "chips": ["memorable", "eventually", "unexpectedly", "vivid", "encounter", "By the time..., I had already...", "Before..., I had never...", "After I had..., I..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Short Biography", "text": "Write a short biography paragraph about a real or imaginary person, describing what they had achieved or experienced earlier in their life before a key turning point.", "steps": ["Choose the person and the turning point in their life you will focus on.", "Note down two or three things that had happened in their life before that turning point.", "Organise the events in a logical time order.", "Write the paragraph and then proofread it for correct tense use."], "chips": ["achievement", "background", "milestone", "overcome", "resilient", "By the time [person] was [age], he/she had already...", "Before [event], [person] had...", "[Person]'s life changed after he/she had..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "By the time the movie started, we ___ our snacks.", "section": "Exit ticket", "options": ["buy", "bought", "had bought", "have bought"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "It was the first time she ___ (visit) a big city on her own.", "section": "Exit ticket", "reveal": "had visited", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Before he called me, he had already sent an email.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What is the correct meaning of 'milestone' in this theme's context?", "section": "Exit ticket", "options": ["A type of road sign", "An important achievement or point in life", "A kind of old building", "A short holiday"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The house looked ___ because no one had lived in it for years. (use 'abandoned')", "section": "Exit ticket", "reveal": "abandoned", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to 'The Teacher Who Never Gave Up', what had Elif done before a position opened at the regional school?", "section": "Exit ticket", "options": ["She had studied abroad.", "She had already built a reputation as a dedicated teacher.", "She had written a textbook.", "She had retired from teaching."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In the listening 'Catching Up After Many Years', B had already started his own business by the time he turned thirty.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Combine using the Past Perfect: She finished her degree. Then she found a job.", "section": "Exit ticket", "reveal": "She had finished her degree before she found a job. / After she had finished her degree, she found a job.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly describes an earlier past action?", "section": "Exit ticket", "options": ["When I got there, the train already left.", "When I got there, the train had already left.", "When I got there, the train leaves already.", "When I got there, the train has already left."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: (never / before / that / had / I / tried / food)", "section": "Exit ticket", "words": ["I", "had", "never", "tried", "that", "food", "before"], "end": ".", "reveal": "I had never tried that food before.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}], "theme": "Year 11 · Theme 4 · What a Life", "key": "year-11-4"}</script><script src="../../../assets/us-present.js"></script></body></html>
