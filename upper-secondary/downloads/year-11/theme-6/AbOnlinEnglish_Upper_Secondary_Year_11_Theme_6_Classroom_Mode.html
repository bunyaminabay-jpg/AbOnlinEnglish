pe": "rule", "title": "The rule", "en": "We use should have + past participle to criticise a past action that did not happen but would have been the right thing to do. We use shouldn't have + past participle to criticise something that did happen but was the wrong thing to do. We use could have + past participle to talk about a possible action in the past that was not taken.", "tr": "Geçmişte yapılmayan ama yapılması gereken bir davranışı eleştirmek için should have + fiil3 kullanılır. Geçmişte yapılan ama yapılmaması gereken bir davranışı eleştirmek için shouldn't have + fiil3 kullanılır. Geçmişte mümkün olduğu hâlde yapılmayan bir eylemden bahsetmek için ise could have + fiil3 kullanılır.", "when_en": "Use this structure when giving advice about the past, expressing regret, or criticising a decision that cannot be changed anymore.", "when": "Geçmişle ilgili tavsiye verirken, pişmanlık ifade ederken veya artık değiştirilemeyecek bir kararı eleştirirken bu yapı kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["you", "not / shout", "at your brother"], "reveal": "You shouldn't have shouted at your brother.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "tell", "her the truth earlier"], "reveal": "I should have told her the truth earlier.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "not / cancel", "the plan at the last minute"], "reveal": "They shouldn't have cancelled the plan at the last minute.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "call", "and explain what happened"], "reveal": "He could have called and explained what happened.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not / assume", "the worst about him"], "reveal": "We shouldn't have assumed the worst about him.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "ask", "before borrowing my jacket"], "reveal": "She should have asked before borrowing my jacket.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about a real or imaginary situation where you or someone else should have, shouldn't have, or could have done something differently.", "chips": ["Looking back, I should have...", "My friend shouldn't have...", "We could have..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Subject + should/could + have + past participle", "You should have listened to her."], "negative": ["Subject + shouldn't/couldn't + have + past participle", "You shouldn't have said that."], "question": ["Should/Could + subject + have + past participle?", "Should I have called him first?"], "short": ["Yes, you should have. / No, you shouldn't have."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You should have went to the doctor.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should have gone to the doctor.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I should to have called her.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I should have called her.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You ___ so rude to your classmate yesterday.", "section": "", "options": ["shouldn't have been", "shouldn't be", "don't have to be", "can't be"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She ___ (apologise) right away, but she waited two days.", "section": "", "reveal": "could have apologised", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "'I should studied harder for the exam.' is a correct sentence.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I should have studied harder for the exam.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Which sentence expresses regret about something NOT done?", "section": "", "options": ["You shouldn't have shouted.", "I should have called her.", "He shouldn't have left early.", "They shouldn't have lied."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using could have: It was possible for him to ask for help, but he didn't.", "section": "", "reveal": "He could have asked for help.", "prompt": "He ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: have / you / shouldn't / that / said", "section": "", "words": ["you", "shouldn't", "have", "said", "that"], "end": ".", "reveal": "You shouldn't have said that.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "We ___ (not / assume) she was angry; we never asked her.", "section": "", "reveal": "shouldn't have assumed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the sentence with the correct meaning: 'You could have texted me.'", "section": "", "options": ["It was necessary for you to text me.", "It was possible for you to text me, but you didn't.", "You definitely texted me.", "You are texting me now."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as criticism using shouldn't have: It was wrong of them to hold a grudge for so long.", "section": "", "reveal": "They shouldn't have held a grudge for so long.", "prompt": "They ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Might have / Must have / Couldn't have (degrees of certainty about the past)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["She <mark>might have forgotten<\/mark> about the meeting — I'm not sure.", "He <mark>must have been<\/mark> really upset if he left without saying goodbye.", "They <mark>couldn't have seen<\/mark> the message; their phone was off all day.", "You <mark>must have misunderstood<\/mark> what she meant."], "ask": "Which sentence expresses a strong belief, which expresses an impossible conclusion, and which expresses a weak guess?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["might have", "must have", "couldn't have"], "chips": true, "text": "Complete with might have, must have or couldn't have and the verb in brackets.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The lights are off — they ___ (leave) already.", "section": "Complete the rule", "reveal": "must have left", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He ___ (miss) the bus, or maybe he's just late.", "section": "Complete the rule", "reveal": "might have missed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She ___ (break) the vase — she wasn't even in the room.", "section": "Complete the rule", "reveal": "couldn't have broken", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "It ___ (rain) last night; the ground is still wet.", "section": "Complete the rule", "reveal": "must have rained", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use must have + past participle when we are almost certain about a past event based on evidence. We use might have + past participle when we are not sure and are only guessing at a possibility. We use couldn't have + past participle when we are certain something was impossible in the past.", "tr": "Geçmişte olan bir olay hakkında kanıtlara dayanarak neredeyse emin olduğumuzda must have + fiil3 kullanılır. Emin olmadığımız, sadece bir olasılığı tahmin ettiğimiz durumlarda might have + fiil3 kullanılır. Geçmişte bir şeyin imkânsız olduğundan emin olduğumuzda ise couldn't have + fiil3 kullanılır.", "when_en": "Use this structure when speculating about a past event, explaining evidence, or ruling out an impossible explanation.", "when": "Geçmişteki bir olay hakkında tahminde bulunurken, kanıtları açıklarken veya imkânsız bir açıklamayı elerken bu yapı kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["he", "must / forget", "his keys"], "reveal": "He must have forgotten his keys.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "might / hear", "the news already"], "reveal": "She might have heard the news already.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they", "couldn't / know", "about the surprise"], "reveal": "They couldn't have known about the surprise.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["it", "must / be", "a difficult decision for him"], "reveal": "It must have been a difficult decision for him.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "might / lose", "his phone somewhere"], "reveal": "He might have lost his phone somewhere.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "couldn't / say", "that; it's not like her"], "reveal": "She couldn't have said that; it's not like her.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences guessing what might have, must have, or couldn't have happened in a mysterious or emotional situation.", "chips": ["He must have...", "She might have...", "They couldn't have..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Subject + must/might + have + past participle", "He must have left early."], "negative": ["Subject + might not/couldn't + have + past participle", "She couldn't have known that."], "question": ["Rarely used in questions; guesses are usually expressed as statements: 'Do you think she might have forgotten?'"], "short": ["She might have. / No, she couldn't have."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He must have went home.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He must have gone home.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She can't have knew about it.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She couldn't have known about it.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "The door is locked and no lights are on. They ___ home yet.", "section": "", "options": ["mustn't have gone", "can't have gone", "must have gone", "might have gone"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I'm not sure, but she ___ (forget) our plans.", "section": "", "reveal": "might have forgotten", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "'He couldn't have seen us; he was on the other side of the city.' expresses certainty that something was impossible.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Which modal expresses the strongest certainty about a past event?", "section": "", "options": ["might have", "could have (possibility)", "must have", "may have"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite to express impossibility: It's impossible that she said that.", "section": "", "reveal": "She couldn't have said that.", "prompt": "She ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: have / must / been / it / difficult", "section": "", "words": ["it", "must", "have", "been", "difficult"], "end": ".", "reveal": "It must have been difficult.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "mcq", "q": "Choose the sentence that best expresses an uncertain guess about the past.", "section": "", "options": ["He must have left already.", "He couldn't have left already.", "He might have left already.", "He has left already."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "They ___ (not / hear) us; the music was too loud.", "section": "", "reveal": "couldn't have heard", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Letter I Never Sent", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Have you ever wanted to say sorry to someone but didn't know how to start?", "What makes it hard for people to open up about their feelings?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 1, "total": 4, "text": "For almost a year, Deniz and her best friend Ela hadn't spoken. It all started with a small misunderstanding that neither of them had bothered to clear up. Deniz often thought about what she should have done differently. She should have called Ela the same evening instead of waiting for an apology that never came. Looking back, she realised she could have simply asked what had happened instead of assuming the worst.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 2, "total": 4, "text": "One evening, Deniz decided to write a letter. She wrote about how she had bottled up her feelings for months, afraid that opening up would make her seem weak. She admitted that she shouldn't have ignored Ela's messages at the beginning, even though she was hurt. She also wrote that Ela must have felt confused when the replies suddenly stopped; there was no other explanation that made sense.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 3, "total": 4, "text": "As she wrote, Deniz thought about all the small clues she had missed. Ela had seemed distant at school, and her friends said she looked tired and quiet. Deniz guessed that Ela might have been dealing with something difficult at home, something she couldn't have known about at the time. She felt a wave of guilt. She should have asked instead of staying silent.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Letter I Never Sent", "num": 4, "total": 4, "text": "In the end, Deniz never sent the letter by post. Instead, she read it aloud to Ela in person, her voice shaking. Ela listened quietly and then said she, too, wished she could have handled things differently. Neither of them had been a bad friend; they had simply been too proud to be vulnerable. By the end of their conversation, the heavy burden both girls had carried for months finally felt lighter.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "Why hadn't Deniz and Ela spoken for almost a year?", "section": "While you read", "options": ["They had a small misunderstanding they never cleared up.", "They moved to different schools.", "Ela was angry about a birthday present.", "Deniz forgot Ela's phone number."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz sent the letter to Ela by post.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz read the letter aloud to Ela in person instead of sending it.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Deniz guessed that Ela ___ (deal) with something difficult at home.", "section": "While you read", "reveal": "might have been dealing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what does Deniz criticise herself for?", "section": "While you read", "options": ["Not calling Ela the same evening", "Telling other people about the argument", "Writing too many letters", "Being too talkative at school"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using couldn't have: It was impossible for Deniz to know about Ela's problems at home.", "section": "While you read", "reveal": "Deniz couldn't have known about Ela's problems at home.", "prompt": "Deniz ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the phrase 'a heavy burden' most likely refer to in the text?", "section": "While you read", "options": ["A physical object Deniz carried", "The emotional weight of their unresolved conflict", "A school assignment", "A family responsibility"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What could Deniz have done earlier to avoid a whole year of silence?", "Do you think writing a letter is a good way to open up? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Who Forgot the Cake?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Think of a time when something went wrong and people started guessing who was responsible.", "What clues do we usually use to guess what happened?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Who Forgot the Cake?", "num": 1, "total": 4, "text": "When the Aydın family arrived at their grandmother's 70th birthday party, everyone realised the cake was missing. Panic spread quickly through the kitchen. Someone must have forgotten to pick it up from the bakery, but nobody wanted to admit it. Uncle Kemal insisted he couldn't have forgotten, since he had written the reminder himself on a sticky note stuck to the fridge.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Who Forgot the Cake?", "num": 2, "total": 4, "text": "Cousin Aslı suggested that their younger cousin Mert might have taken the sticky note down while cleaning the kitchen that morning. Mert denied it firmly, saying he hadn't touched anything near the fridge. Still, his sister remembered seeing him near the fridge earlier, so he might have moved the note without even noticing.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Who Forgot the Cake?", "num": 3, "total": 4, "text": "Meanwhile, Grandma sat calmly in her armchair, smiling. She said it didn't really matter who should have picked up the cake. What mattered more, she explained, was that everyone had come together, worried and a little chaotic, just to make her day special. She reminded them that a missing cake couldn't have ruined a celebration built on love and family.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Who Forgot the Cake?", "num": 4, "total": 4, "text": "In the end, they discovered that the bakery itself must have made the mistake — they had accidentally given the cake to another family with a similar name. Everyone laughed with relief. Uncle Kemal joked that he should have called to confirm the order the night before, just to be safe next time. They ordered pizza instead and turned the missing cake into the best story of the year.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What was Uncle Kemal's argument for why he couldn't have forgotten the cake?", "section": "While you read", "options": ["He never uses sticky notes.", "He wrote the reminder himself and stuck it to the fridge.", "He doesn't like cake.", "He was not at home that morning."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Mert ___ (move) the note without noticing, according to his sister.", "section": "While you read", "reveal": "might have moved", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The bakery gave the cake to the wrong family.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What did Grandma say mattered more than the missing cake?", "section": "While you read", "options": ["Finding out who was guilty", "Everyone coming together for her", "Buying a new cake quickly", "Getting a refund from the bakery"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using should have: It would have been wise for Kemal to call and confirm the order.", "section": "While you read", "reveal": "Kemal should have called to confirm the order.", "prompt": "Kemal ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Why do you think the family jumped to conclusions before knowing the real reason?", "How does the story show the difference between guessing (might have) and being certain (must have)?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Difficult Conversation", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What would you say to a friend who hurt your feelings without realising it?", "Listen for how each speaker expresses regret or criticism."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Difficult Conversation", "audio": null, "transcript": [{"speaker": "Kaan", "line": "Can we talk for a minute? I've been thinking about what happened at the party."}, {"speaker": "Buse", "line": "Sure. Honestly, I've been thinking about it too. I feel like I should have told you I was upset instead of just leaving early."}, {"speaker": "Kaan", "line": "I noticed you left, but I didn't understand why. I thought maybe you just weren't feeling well."}, {"speaker": "Buse", "line": "No, it wasn't that. You made a joke about my presentation in front of everyone, and it really hurt. You shouldn't have said that in front of the whole class."}, {"speaker": "Kaan", "line": "You're right, I shouldn't have. I honestly didn't think it would upset you that much — I must have misread the situation completely."}, {"speaker": "Buse", "line": "I think you might have been trying to be funny, but it didn't come across that way."}, {"speaker": "Kaan", "line": "That's exactly it. I could have just complimented your work instead, but I chose a joke, and that was thoughtless of me."}, {"speaker": "Buse", "line": "I appreciate you saying that. I probably should have told you right away instead of staying quiet and getting more upset."}, {"speaker": "Kaan", "line": "Let's agree on something — next time, we talk about it immediately, even if it feels uncomfortable."}, {"speaker": "Buse", "line": "Deal. Bottling things up never really helps anyone."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Why was Buse upset with Kaan?", "section": "While you listen", "options": ["He forgot her birthday.", "He made a joke about her presentation in front of the class.", "He didn't invite her to the party.", "He lost her notes."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Kaan says he ___ (misread) the situation completely.", "section": "While you listen", "reveal": "must have misread", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Buse told Kaan she was upset immediately after the joke.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Buse stayed quiet at first and only told Kaan later.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Kaan say he could have done instead of making a joke?", "section": "While you listen", "options": ["Stayed silent", "Complimented her work", "Left the party early", "Asked someone else to speak"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Do you think Kaan's apology sounds genuine? Why?", "What would you have said if you were Buse?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "The Empty Classroom", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: why might a classroom be left in a mess after school?", "Listen for guesses (might have/must have) and impossible explanations (couldn't have)."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "The Empty Classroom", "audio": null, "transcript": [{"speaker": "Teacher", "line": "The classroom was a complete mess this morning — chairs everywhere, papers on the floor. Does anyone know what happened?"}, {"speaker": "Student A", "line": "It couldn't have been our class; we left everything tidy yesterday afternoon."}, {"speaker": "Student B", "line": "Maybe the cleaning staff moved things around. They might have rearranged the desks for cleaning and just not put them back."}, {"speaker": "Student A", "line": "That's possible, but the cleaning staff usually leave a note. Someone must have used the room after school without permission."}, {"speaker": "Teacher", "line": "Actually, I found out the drama club used the room for rehearsal yesterday evening."}, {"speaker": "Student B", "line": "That explains it! They must have moved the furniture to make space and forgotten to put it back."}, {"speaker": "Student A", "line": "They really shouldn't have left it like that without telling anyone."}, {"speaker": "Teacher", "line": "I agree. I'll speak to them, but I'm glad it wasn't anyone in this class — you couldn't have caused it since you weren't even here."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What was the classroom like in the morning?", "section": "While you listen", "options": ["Clean and tidy", "A complete mess with chairs and papers everywhere", "Locked and empty", "Full of new furniture"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Student A says the mess ___ (be) their class because they left it tidy.", "section": "While you listen", "reveal": "couldn't have been", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The cleaning staff were responsible for the mess.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The drama club used the room for rehearsal and left the furniture moved.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Student A say the drama club shouldn't have done?", "section": "While you listen", "options": ["Used the room for rehearsal", "Left the room like that without telling anyone", "Cancelled the rehearsal", "Locked the door"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What clues helped the students figure out what really happened?", "Have you ever been blamed for something you couldn't have done? What happened?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Detectives of the Past", "text": "In groups, look at a short mystery situation (e.g. a broken window, a missing notebook, a surprise party ruined) and discuss what might have, must have, or couldn't have happened, giving reasons for your guesses.", "steps": ["In groups, choose one mystery situation from the teacher's list.", "Brainstorm at least three possible explanations using might have.", "Agree on the explanation you think is most likely (must have) and one you can rule out (couldn't have).", "Present your group's reasoning to the class in two minutes."], "chips": ["It must have been...", "It might have been...", "It couldn't have been... because...", "That would explain why...", "I'm not so sure about that because..."], "timer": 600, "levels": ["Give weaker students a simple sentence frame: 'I think ___ must have happened because ___.'", "Students produce at least three modal perfect sentences with clear reasoning.", "Ask stronger groups to challenge another group's explanation with a counter-argument using couldn't have."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "I Wish I Had Said Something", "text": "In pairs, take turns describing a real or invented situation where you feel you should have or could have acted differently, while your partner gives gentle advice or agrees with your reflection.", "steps": ["Think of a small past situation (a missed chance, a small conflict, an unfinished task).", "Share it with your partner using should have / could have to express what you would do differently now.", "Your partner listens and responds with a supportive comment or their own similar experience.", "Swap roles and repeat."], "chips": ["I should have...", "I could have...", "Looking back, I shouldn't have...", "In your place, I might have...", "It's understandable that you..."], "timer": 300, "levels": ["Provide a bank of situations (forgetting a friend's message, not helping with something, avoiding a conversation) for students who need ideas.", "Both partners use at least two modal perfect structures accurately.", "Ask stronger students to give their partner specific advice for the future using different structures, e.g. 'Next time, you could try...'"], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Letter I Never Sent", "text": "Write a short letter to someone (a friend, family member, or classmate) explaining a past situation you regret and what you should have or could have done differently.", "steps": ["Decide who the letter is to and what the situation was.", "List 2-3 things you regret or should have done.", "Think about how the situation made you feel and what you learned.", "Plan a closing line that shows how you feel now."], "chips": ["regret", "should have", "could have", "open up", "bottle up", "make amends", "I should have...", "I shouldn't have...", "Looking back, I could have...", "I realise now that..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "The Mystery of the Missing Gift", "text": "Write a short paragraph speculating about what happened to a missing item (e.g. a birthday gift, a phone, a set of keys), using might have, must have, and couldn't have to explain different theories.", "steps": ["Decide what item is missing and where it was last seen.", "Brainstorm at least three possible explanations.", "Order your ideas from least to most likely.", "End with the explanation you believe is most probable."], "chips": ["assumption", "misunderstanding", "consequence", "genuine", "excuse", "It might have...", "Someone must have...", "It couldn't have... because...", "The most likely explanation is..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "You look tired. You ___ late last night.", "section": "Exit ticket", "options": ["must have stayed up", "should stay up", "can stay up", "stay up"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I ___ (apologise) sooner; I feel bad about waiting so long.", "section": "Exit ticket", "reveal": "should have apologised", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "'Bottle up' means to talk openly about your feelings.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "'Bottle up' means to hide or not express your feelings.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'to share private feelings or secrets with someone'?", "section": "Exit ticket", "options": ["criticise", "confide", "reassure", "overreact"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using couldn't have: It's impossible that he lied to us.", "section": "Exit ticket", "reveal": "He couldn't have lied to us.", "prompt": "He ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "In 'The Letter I Never Sent', what does Deniz eventually do?", "section": "Exit ticket", "options": ["She sends the letter by post.", "She reads the letter aloud to Ela in person.", "She never speaks to Ela again.", "She gives the letter to a teacher."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: shouldn't / it / like / have / that / left / they", "section": "Exit ticket", "words": ["they", "shouldn't", "have", "left", "it", "like", "that"], "end": ".", "reveal": "They shouldn't have left it like that.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "mcq", "q": "In the listening 'A Difficult Conversation', what does Kaan realise he could have done instead of the joke?", "section": "Exit ticket", "options": ["Stayed silent", "Complimented Buse's work", "Left the party", "Told a different joke"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "She ___ (not / know) about the surprise; she was out of town all week.", "section": "Exit ticket", "reveal": "couldn't have known", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Year 11 · Theme 6 · Open Your Heart", "key": "year-11-6"}</script><script src="../../../assets/us-present.js"></script></body></html>
