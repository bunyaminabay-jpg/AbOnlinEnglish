 advisor tomorrow"], "reveal": "I am seeing the careers advisor tomorrow.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "leave", "for the conference on Friday"], "reveal": "He is leaving for the conference on Friday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about arrangements already fixed in your diary using present continuous.", "chips": ["On Saturday I am...", "Next week I'm..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Subject + am/is/are + verb-ing", "I am starting my new job on Monday."], "negative": ["Subject + am/is/are + not + verb-ing", "We aren't meeting until next week."], "question": ["Am/Is/Are + subject + verb-ing?", "Are you seeing the manager today?"], "short": ["Yes, I am. / No, I'm not."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I meeting the manager tomorrow.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I am meeting the manager tomorrow.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She is meeting the manager usually on Fridays.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She usually meets the manager on Fridays.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Which sentence describes a fixed arrangement?", "section": "", "options": ["I'm going to find a job someday.", "I'm meeting the recruiter at 4 pm today.", "I will probably get a job.", "I usually work on weekdays."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We ___ (have) a school careers day next Tuesday.", "section": "", "reveal": "are having", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I ___ (not start) my new job until next month.", "section": "", "reveal": "am not starting / 'm not starting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She meeting the interviewer at nine tomorrow.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is meeting the interviewer at nine tomorrow.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: at / are / ten / meeting / we / the / boss", "section": "", "words": ["we", "are", "meeting", "the", "boss", "at", "ten"], "end": ".", "reveal": "We are meeting the boss at ten.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct question about an arrangement.", "section": "", "options": ["Are you seeing the doctor tomorrow?", "Do you seeing the doctor tomorrow?", "You are seeing the doctor tomorrow?", "Will you seeing the doctor tomorrow?"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a fixed arrangement: I have an appointment with the dentist on Friday at 3.", "section": "", "reveal": "I'm having an appointment with the dentist on Friday at 3. / I am seeing the dentist on Friday at 3.", "prompt": "I ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "By the time you arrive, I ___ already ___ (meet) the manager (use present continuous idea contrasted).", "section": "", "reveal": "am already meeting", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which best explains why we say 'I'm meeting her at six' and not 'I meet her at six' for a one-time future plan?", "section": "", "options": ["Present simple is for arranged future events.", "Present continuous describes a specific, already-fixed future arrangement, unlike the habitual present simple.", "Both forms mean the same thing.", "Present continuous is only for actions happening right now."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Jobs That Didn't Exist Ten Years Ago", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of jobs do you think this text will mention?", "Can you name a job that didn't exist when your parents were your age?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Jobs That Didn't Exist Ten Years Ago", "num": 1, "total": 4, "text": "Ten years ago, nobody had heard of a 'drone pilot' or a 'social media manager.' Today these are real careers that thousands of people do every day. Technology is changing so fast that schools cannot always prepare students for jobs that don't exist yet.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Jobs That Didn't Exist Ten Years Ago", "num": 2, "total": 4, "text": "Experts say that in the next ten years, we are going to see even more new careers. For example, some companies are already training 'AI trainers,' people who teach computer programs to understand human language better. Other new roles include 'sustainability consultants,' who help businesses reduce waste, and 'virtual event planners,' who organise online conferences and parties.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Jobs That Didn't Exist Ten Years Ago", "num": 3, "total": 4, "text": "Not every new job needs a university degree. Many require practical skills, creativity, and the ability to learn quickly. A student who is going to succeed in this changing job market will probably need to update their skills again and again throughout their career.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Jobs That Didn't Exist Ten Years Ago", "num": 4, "total": 4, "text": "So what does this mean for students today? It means staying curious, being open to unfamiliar careers, and not worrying too much if a job doesn't have a name yet. The most important skill of all might be the willingness to keep learning.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what is one example of a new job?", "section": "While you read", "options": ["Drone pilot", "Bus driver", "Shop assistant", "Postman"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do 'sustainability consultants' help businesses do?", "section": "While you read", "options": ["Reduce waste", "Sell more products", "Hire new staff", "Build websites"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, every new job requires a university degree.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Not every new job needs a university degree; many require practical skills instead.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The most important skill of all might be the ___ to keep learning.", "section": "While you read", "reveal": "willingness", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What is the writer's main message?", "section": "While you read", "options": ["Students should worry about the future.", "Staying curious and willing to learn is important for future careers.", "Only technology jobs will exist in the future.", "University degrees are no longer useful."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in your own words: 'A student who is going to succeed... will probably need to update their skills again and again.'", "section": "While you read", "reveal": "Successful students will need to keep learning new skills throughout their career.", "prompt": "Successful students...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which new job mentioned in the text sounds most interesting to you and why?", "What skill do you think will be the most important for future jobs?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Preparing for a Job Interview", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Have you ever been in an interview, for a job, a school project, or a club? What was it like?", "What do you think makes someone feel confident in an interview?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Preparing for a Job Interview", "num": 1, "total": 4, "text": "Getting ready for a job interview can feel stressful, but a little preparation makes a big difference. Career coaches say the biggest mistake candidates make is not researching the company beforehand. Before any interview, it's a good idea to learn about what the company does and why you want to work there.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Preparing for a Job Interview", "num": 2, "total": 4, "text": "On the day of the interview, arriving early is essential. Being even five minutes late can create a bad impression before you say a single word. Most experts suggest arriving at least ten minutes before the appointment, then using that time to relax and review your notes.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Preparing for a Job Interview", "num": 3, "total": 4, "text": "During the interview, employers often ask questions like 'Where do you see yourself in five years?' This question isn't about giving a perfect answer; it's about showing that you have thought about your future and that you are going to work hard to reach your goals.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Preparing for a Job Interview", "num": 4, "total": 4, "text": "Finally, at the end of the interview, it's polite to thank the interviewer for their time and ask when you will hear back about the decision. A short follow-up message the next day, thanking them again, can leave a positive final impression.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the biggest mistake candidates make, according to the text?", "section": "While you read", "options": ["Arriving too early", "Not researching the company", "Asking too many questions", "Wearing formal clothes"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How early do experts suggest arriving?", "section": "While you read", "options": ["Exactly on time", "Five minutes late", "At least ten minutes early", "One hour early"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The question 'Where do you see yourself in five years?' is mainly about giving a perfect memorised answer.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It's about showing you have thought about your future and are willing to work hard.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "It's polite to thank the interviewer and ask when you will ___ back about the decision.", "section": "While you read", "reveal": "hear", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the text suggest doing after the interview?", "section": "While you read", "options": ["Nothing at all", "Sending a short follow-up message the next day", "Calling immediately", "Asking for another interview"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What is one tip from this text that you would use before your own interview?", "Why do you think first impressions matter so much in an interview?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Booking a Careers Appointment", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What information do you usually need to give when you book an appointment?", "Predict two things the caller might ask for."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Booking a Careers Appointment", "audio": null, "transcript": [{"speaker": "Receptionist", "line": "Good morning, Career Services, how can I help you?"}, {"speaker": "Caller", "line": "Hi, I'd like to make an appointment with a careers advisor, please."}, {"speaker": "Receptionist", "line": "Of course. Are you available this week or next?"}, {"speaker": "Caller", "line": "This week would be great, if possible."}, {"speaker": "Receptionist", "line": "Let me check the diary... We have a slot on Thursday at 2 pm or Friday at 10 am."}, {"speaker": "Caller", "line": "Friday at 10 works better for me."}, {"speaker": "Receptionist", "line": "Perfect. Can I take your name and student number, please?"}, {"speaker": "Caller", "line": "Sure, it's Elif Kaya, student number 4521."}, {"speaker": "Receptionist", "line": "Great, Elif. I'm going to confirm your appointment for Friday at 10 am. We'll send a reminder message the day before."}, {"speaker": "Caller", "line": "Thank you so much. Actually, could we reschedule if something comes up?"}, {"speaker": "Receptionist", "line": "Of course, just call us at least a day in advance and we'll find another time."}, {"speaker": "Caller", "line": "Great, thanks again. Goodbye."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does the caller want to do?", "section": "While you listen", "options": ["Cancel an appointment", "Make an appointment with a careers advisor", "Apply for a job", "Complain about a service"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which time does the caller choose?", "section": "While you listen", "options": ["Thursday at 2 pm", "Friday at 10 am", "Thursday at 10 am", "Friday at 2 pm"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The receptionist asks for the caller's name and ___ number.", "section": "While you listen", "reveal": "student", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The caller cannot change the appointment once it is booked.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The caller can reschedule by calling at least a day in advance.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What will the office send before the appointment?", "section": "While you listen", "options": ["A confirmation email only", "A reminder message the day before", "A phone call an hour before", "Nothing"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What phrases did the receptionist use to sound polite and helpful?", "How would you politely ask to reschedule an appointment?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Future Job Predictions", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What job do you think will be the most important in 2050?", "Listen and check if your prediction is mentioned."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Future Job Predictions", "audio": null, "transcript": [{"speaker": "Host", "line": "Welcome back to Future Talk. Today we're discussing jobs of tomorrow. Ayşe, what do you think will change the most?"}, {"speaker": "Ayşe", "line": "I think healthcare jobs will change a lot. Robots will probably assist doctors during operations, but I don't think they will replace human doctors completely."}, {"speaker": "Host", "line": "Interesting. And what about you, Kaan?"}, {"speaker": "Kaan", "line": "I believe green energy jobs are going to grow fast. More companies are going to need engineers who understand solar and wind power."}, {"speaker": "Host", "line": "Do you think traditional jobs like teaching will disappear?"}, {"speaker": "Ayşe", "line": "No, I don't think so. Teachers won't disappear, but I think they'll use more technology in their classrooms."}, {"speaker": "Kaan", "line": "I agree. Some routine jobs will probably be automated, but jobs that need empathy and creativity will still need real people."}, {"speaker": "Host", "line": "Great predictions. Thanks for joining us today."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does Ayşe think will happen in healthcare?", "section": "While you listen", "options": ["Robots will fully replace doctors.", "Robots will assist doctors but not replace them completely.", "Hospitals will close.", "Nothing will change."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to Kaan, which industry is going to grow fast?", "section": "While you listen", "options": ["Green energy", "Fashion", "Publishing", "Farming"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Both speakers believe teachers will disappear completely.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ayşe says teachers won't disappear, but will use more technology.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Kaan says jobs that need empathy and ___ will still need real people.", "section": "While you listen", "reveal": "creativity", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you listen", "list": ["Do you agree with Ayşe and Kaan's predictions? Why or why not?", "What is one job you think will definitely still exist in fifty years?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "My Future Career Plan", "text": "Tell your partner about your future job plans, including what you are going to do, why, and what qualifications you will need.", "steps": ["Think about a job you are going to try to get in the future and note 3-4 reasons why.", "Take turns describing your plan to your partner using be going to.", "Ask your partner at least two follow-up questions about their plan.", "Report one interesting thing about your partner's plan to the class."], "chips": ["I'm going to...", "My plan is to...", "I think I will need...", "One day I hope to..."], "timer": 600, "levels": ["Give students a simple sentence frame: 'I am going to become a ___ because ___.'", "Students describe their plan with reasons and answer follow-up questions.", "Students compare their plan with a possible alternative career and explain which one they prefer and why."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Phone Role-Play: Making an Appointment", "text": "One student calls a company to make a job interview appointment; the other plays the receptionist, offering times and confirming details.", "steps": ["Sit back to back or hide your faces so it feels like a real phone call.", "Student A calls to book an appointment; Student B checks a made-up diary and offers two times.", "Agree on a time and Student B confirms the details out loud.", "Switch roles and repeat with a new scenario, such as rescheduling an appointment."], "chips": ["I'd like to make an appointment...", "Are you available on...?", "Could we reschedule?", "I'll confirm that for you."], "timer": 600, "levels": ["Provide a phone-call phrase bank on the board for students to refer to.", "Students complete a natural phone call including greeting, request, and confirmation.", "Add a complication, such as needing to reschedule or a fully booked diary, and have students
