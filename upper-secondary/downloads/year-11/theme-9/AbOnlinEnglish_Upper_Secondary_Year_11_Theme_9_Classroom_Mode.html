e clauses (who/which/that/whose).", "I can describe a place where something happened, using 'where'.", "I can describe the reason for an event, using 'why'.", "I can ask someone to clarify or explain something they said.", "I can give clarification when someone doesn't understand me.", "I can talk about a memorable event with my friends.", "I can compare two friends or two places using relative clauses.", "I can describe qualities I value in a friend."], "note": "Share the learning goals. / Hedefleri paylaşın."}]}, {"id": "vocabulary", "title": "Kelimeler", "color": "#D9602A", "screens": [{"type": "title", "kicker": "Vocabulary", "title": "New words", "list": ["25 target words"], "note": "Students close their books. / Kitaplar kapalı."}, {"type": "word", "word": "acquaintance", "pos": "noun", "ipa": "/əˈkweɪntəns/", "tr": "tanıdık", "example": "He's just an acquaintance, not a close friend, whom I met at a school event.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "loyal", "pos": "adj", "ipa": "/ˈlɔɪəl/", "tr": "sadık", "example": "A loyal friend is someone who stays by your side even in difficult times.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "reliable", "pos": "adj", "ipa": "/rɪˈlaɪəbl/", "tr": "güvenilir", "example": "Ayşe is the kind of friend who is always reliable when you need help.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "trustworthy", "pos": "adj", "ipa": "/ˈtrʌstwɜːrði/", "tr": "güvenilir", "example": "I only share secrets wi ": ["generous", "supportive", "drift apart"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Relative Clauses — who/which/that/whose (defining) and where/when/why", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["This is the friend <mark>who<\/mark> helped me move to my new house.", "The café <mark>which<\/mark> we visited last weekend has closed down.", "I still remember the day <mark>when<\/mark> we first met.", "That's the boy <mark>whose<\/mark> sister is in my English class."], "ask": "What do you notice about the words who, which, when and whose, and what kind of word do they follow?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["who", "which", "whose", "where", "why"], "chips": true, "text": "Complete each sentence with the correct relative pronoun or adverb from the bank.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "That's the café ___ we always meet after school.", "section": "Complete the rule", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Kerem is the friend ___ always makes me laugh.", "section": "Complete the rule", "reveal": "who", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I don't know the reason ___ she cancelled the plan.", "section": "Complete the rule", "reveal": "why", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "That's the boy ___ bag was left on the bus.", "section": "Complete the rule", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The photo ___ you took at the party is beautiful.", "section": "Complete the rule", "reveal": "which / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use defining relative clauses to give essential information that identifies exactly which person, thing, place, time or reason we are talking about, without which the sentence would not make full sense. We use who/that for people, which/that for things, whose to show possession, where for places, when for times, and why for reasons. Defining relative clauses are not separated by commas.", "tr": "Belirten (defining) sıfat cümleciklerini, hakkında konuşulan kişi, şey, yer, zaman ya da sebebi tam olarak belirlemek için gereken, cümlenin anlamı için gerekli bilgiyi vermek amacıyla kullanırız; bu bilgi olmadan cümle eksik kalır. İnsanlar için who/that, nesneler için which/that, sahiplik için whose, yerler için where, zamanlar için when, sebepler için why kullanılır. Belirten sıfat cümlecikleri virgülle ayrılmaz.", "when_en": "Use a defining relative clause whenever the listener needs the extra information to know exactly who or what you mean; if you removed the clause, the sentence would become unclear or too general.", "when": "Dinleyicinin tam olarak kimi ya da neyi kastettiğinizi anlaması için ek bilgiye ihtiyacı olduğunda belirten sıfat cümleciği kullanılır; bu cümlecik çıkarılırsa cümle belirsiz ya da çok genel hale gelir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["girl / sits next to me / is friendly"], "reveal": "The girl who sits next to me is friendly.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["boy / lives next door / plays football with me"], "reveal": "The boy who lives next door plays football with me.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["park / we play basketball / is near my house"], "reveal": "The park where we play basketball is near my house.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["day / we became friends / I will never forget"], "reveal": "I will never forget the day when we became friends.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["girl / brother studies abroad / sits behind me"], "reveal": "The girl whose brother studies abroad sits behind me.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["reason / she was upset / was a misunderstanding"], "reveal": "The reason why she was upset was a misunderstanding.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["book / I borrowed from Elif / is very interesting"], "reveal": "The book which I borrowed from Elif is very interesting.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences describing a friend, a place, or an event using who, which, that, whose, where, when or why.", "chips": ["My best friend is someone who...", "The place where we usually meet is...", "I'll never forget the day when..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The person who/that helps me is my friend.", "The place where we meet is a café.", "The reason why she left is unclear."], "negative": ["The person who doesn't help me isn't a real friend.", "The place where we don't usually go is quiet."], "question": ["Is he the friend who called you yesterday?", "Is this the café where you met your friend?"], "short": ["Yes, he's the one who called.", "Yes, that's the place where we met."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the girl which is my best friend.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the girl who is my best friend.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "That's the café, where we always meet.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "That's the café where we always meet.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He is the boy who's bag is red.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He is the boy whose bag is red.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I remember the day which we met.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I remember the day when we met.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "The teacher ___ taught us last year has moved to another school.", "section": "", "reveal": "who / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Balıkesir is the city ___ I was born.", "section": "", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "", "options": ["This is the friend which helped me.", "This is the friend who helped me.", "This is the friend where helped me.", "This is the friend whose helped me."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "That's the boy, who's brother plays football with me.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "That's the boy whose brother plays football with me.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: the / I / trust / most / is / person / who / Elif", "section": "", "words": ["the", "person", "who", "I", "trust", "most", "is", "Elif"], "end": ".", "reveal": "The person who I trust most is Elif.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Combine: I have a friend. My friend's sister is a doctor.", "section": "", "reveal": "I have a friend whose sister is a doctor.", "prompt": "I have a friend...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "The reason ___ we became friends was our shared love of music.", "section": "", "options": ["where", "when", "why", "whose"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "That's the gathering ___ all my classmates met last summer.", "section": "", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Combine: I remember a day. We laughed together all day.", "section": "", "reveal": "I remember the day when we laughed together all day.", "prompt": "I remember the day...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly uses a defining relative clause without a comma?", "section": "", "options": ["The café, where we meet is nice.", "The café where we meet is nice.", "The café, where we meet, is nice.", "The café who we meet is nice."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Do you know the reason ___ she moved to another city?", "section": "", "reveal": "why", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Defining vs. Non-defining Relative Clauses", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The friend <mark>who lives next door<\/mark> lent me her notes. (no comma — essential)", "My sister, <mark>who lives in Ankara<\/mark>, is visiting us this weekend. (comma — extra info)", "The book <mark>that I borrowed<\/mark> was about friendship. (no comma — essential)", "Kerem, <mark>whose father is a teacher<\/mark>, helped me with my homework. (comma — extra info)"], "ask": "What do you notice about the commas in the second and fourth sentences, and what happens to the meaning if you remove the clause?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["who", "which", "whose", ",", "no comma"], "chips": true, "text": "Decide if each sentence needs commas (non-defining) or not (defining), then complete it correctly.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "My best friend ___ name is Deniz plays the guitar. (essential info, no extra name given elsewhere)", "section": "Complete the rule", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Ayşe___ is my classmate___ moved to İzmir last year. (Ayşe already identified by name)", "section": "Complete the rule", "reveal": ", / ,", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The event ___ we organised raised money for the school. (essential info)", "section": "Complete the rule", "reveal": "which / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A defining relative clause gives essential information without which the sentence loses its meaning, and it is not separated by commas. A non-defining relative clause adds extra, non-essential information about someone or something already identified (often a name or a unique place), and it is separated by commas. 'That' can replace who/which in defining clauses but not in non-defining clauses.", "tr": "Belirten (defining) sıfat cümleciği, çıkarıldığında cümlenin anlamını kaybettiği temel bilgiyi verir ve virgülle ayrılmaz. Belirtmeyen (non-defining) sıfat cümleciği ise zaten tanımlanmış bir kişi ya da şey (genellikle bir isim ya da tek bir yer) hakkında ek, gereksiz olmayan ama zorunlu da olmayan bilgi verir ve virgülle ayrılır. 'That', belirten cümleciklerde who/which yerine kullanılabilir ama belirtmeyen cümleciklerde kullanılamaz.", "when_en": "Choose non-defining when the person or place is already clearly identified (a name, 'my mother', a capital city) and you are only adding extra detail; choose defining when the clause is needed to say exactly who or what you mean.", "when": "Kişi ya da yer zaten açıkça belirlenmişse (bir isim, 'annem', bir başkent gibi) ve sadece ek bir bilgi ekleniyorsa belirtmeyen cümlecik; tam olarak kimi ya da neyi kastettiğinizi belirtmek gerekiyorsa belirten cümlecik seçilir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["My friend Cem / lives in Bursa (already named)"], "reveal": "My friend Cem, who lives in Bursa, called me yesterday.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["The girl / sits next to me in class (not named)"], "reveal": "The girl who sits next to me in class is very friendly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["My teacher, Mr. Aydın / organised the trip (already named)"], "reveal": "My teacher, Mr. Aydın, who organised the trip, is very kind.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The restaurant / we celebrated at (not named)"], "reveal": "The restaurant where we celebrated was full of our friends.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["İstanbul / has many old friends of mine (already named)"], "reveal": "İstanbul, where many of my old friends live, is a huge city.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 sentences about people or places you know, using both a defining and a non-defining relative clause correctly.", "chips": ["My friend ___, who ..., ...", "The place where ... is ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The boy who called me is my cousin. (defining)", "Emre, who called me, is my cousin. (non-defining)"], "negative": ["The boy who didn't call me is my cousin.", "Emre, who didn't call me, is my cousin."], "question": ["Is the boy who called you your cousin?", "Is Emre, who called you, your cousin?"], "short": ["Yes, he is.", "Yes, he is."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My mother who lives in Balıkesir called me.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My mother, who lives in Balıkesir, called me.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The friend, that helped me, is very kind.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The friend that helped me is very kind.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My best friend Deniz who I trust most.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My best friend Deniz, whom I trust most, always helps me.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "q": "My father, who works at the hospital, is very supportive.", "section": "", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Choose the correctly punctuated sentence.", "section": "", "options": ["My sister who lives in İzmir, is a doctor.", "My sister, who lives in İzmir, is a doctor.", "My sister, who lives in İzmir is a doctor.", "My sister who lives in İzmir is a doctor, is a doctor."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The book ___ I'm reading now is about a group of childhood friends. (defining, can use 'that')", "section": "", "reveal": "which / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Combine, making it non-defining: My teacher helped me a lot. My teacher's name is Ms. Kaya.", "section": "", "reveal": "My teacher, Ms. Kaya, who helped me a lot, ... / Ms. Kaya, my teacher, who helped me a lot, is kind.", "prompt": "Ms. Kaya, my teacher,...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put in order: is / my / cousin / Deniz / who / lives / in / Bursa", "section": "", "words": ["deniz,", "who", "lives", "in", "Bursa,", "is", "my", "cousin"], "end": ".", "reveal": "Deniz, who lives in Bursa, is my cousin.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "mcq", "q": "'That' can be used instead of 'who/which' in ___.", "section": "", "options": ["non-defining clauses only", "defining clauses only", "both types equally", "neither type"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine as a non-defining clause: Ankara is the capital of Turkey. Ankara has many good universities.", "section": "", "reveal": "Ankara, which is the capital of Turkey, has many good universities.", "prompt": "Ankara, which...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The girl that is my cousin, lives in İstanbul.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The girl who is my cousin lives in İstanbul.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "My best friend, ___ I have known since childhood, always makes me laugh.", "section": "", "reveal": "who / whom", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Friend Who Never Gave Up on Me", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of friend do you think the writer is describing?", "Think of a friend who has supported you during a difficult time."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Friend Who Never Gave Up on Me", "num": 1, "total": 5, "text": "Everyone has a friend who they will never forget, and for me, that friend is Ceren. We met in the seventh grade, on the first day when our new class was formed, and we have been close ever since. Ceren is the kind of person who notices when something is wrong, even before you say a word.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Friend Who Never Gave Up on Me", "num": 2, "total": 5, "text": "Two years ago, I was going through a difficult period at school, which affected my grades and my confidence. Ceren, who could see that I was struggling, started walking home with me every day just to talk. She never told me what to do; instead, she asked questions that helped me understand my own feelings better.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Friend Who Never Gave Up on Me", "num": 3, "total": 5, "text": "The place where we had our longest conversations was a small park near our school, which has a bench under an old tree. That bench is where we solved most of our problems, from small arguments with classmates to bigger worries about the future. It became a kind of second home for us.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Friend Who Never Gave Up on Me", "num": 4, "total": 5, "text": "What I admire most about Ceren is her loyalty. She is a friend whose honesty I can always trust, even when the truth is uncomfortable. Last year, when I made a decision that most people disagreed with, Ceren was the only one who asked me to explain my reasons before judging me.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Friend Who Never Gave Up on Me", "num": 5, "total": 5, "text": "Now that we are in different classes, we don't see each other every day, but the bond we built has not weakened. Whenever I need someone to talk to, Ceren is still the first person I call. She taught me that a real friend is someone who stays, not just when things are easy, but especially when they are not.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "When did the writer and Ceren first meet?", "section": "While you read", "options": ["In primary school", "On the first day of seventh grade", "At a birthday party", "During a school trip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Ceren told the writer exactly what to do to solve the problem.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ceren asked questions instead of telling the writer what to do.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The bench under the old tree is the place ___ they had their longest conversations.", "section": "While you read", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the writer admire most about Ceren?", "section": "While you read", "options": ["Her sense of humour", "Her loyalty and honesty", "Her intelligence", "Her generosity with money"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as one sentence using a relative pronoun: The writer made a decision. Most people disagreed with the decision.", "section": "While you read", "reveal": "The writer made a decision which most people disagreed with. / The writer made a decision that most people disagreed with.", "prompt": "The writer made a decision...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, Ceren and the writer are now in the same class.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They are now in different classes.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Do you agree that a real friend is someone who stays during difficult times? Why or why not?", "Describe a place that is special to you and a friend, using 'where'."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Our Ten-Year Reunion", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think happens at a class reunion?", "Have you ever met a childhood friend again after a long time?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Our Ten-Year Reunion", "num": 1, "total": 5, "text": "Last month, my old classmates and I organised a reunion, which took place exactly ten years after we finished middle school. The event, which was held in a restaurant near our old school, brought together almost thirty former students, some of whom I hadn't seen since graduation.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Ten-Year Reunion", "num": 2, "total": 5, "text": "The person who worked hardest to organise everything was Burak, a classmate whose energy for planning events never seems to disappear. He created a group chat where everyone could share memories, photos and, eventually, their availability for the big day.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Ten-Year Reunion", "num": 3, "total": 5, "text": "When the evening finally arrived, it was strange to see faces that I remembered as children now belonging to adults with jobs, families and completely different lives. The first person I recognised was Selin, whose laugh had not changed at all in ten years. We talked for almost an hour about the summer when our whole class went camping together.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Ten-Year Reunion", "num": 4, "total": 5, "text": "One moment that made everyone emotional was when we watched an old video, which someone had saved from our final week of school. In the video, our teacher, who had since retired, gave a short speech about friendship that none of us had fully understood at the age of fourteen.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Our Ten-Year Reunion", "num": 5, "total": 5, "text": "By the end of the night, we had exchanged numbers, made plans for a smaller gathering, and remembered why some of these friendships, despite the years when we drifted apart, still mattered. As Burak said in his closing toast, a good friend is someone who, no matter how much time passes, can still make you feel like you're fifteen again.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "How long after graduation did the reunion take place?", "section": "While you read", "options": ["Five years", "Eight years", "Ten years", "Fifteen years"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Burak created a group chat ___ everyone could share memories and photos.", "section": "While you read", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Selin's laugh had changed a lot in ten years.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Selin's laugh had not changed at all in ten years.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What made everyone emotional during the reunion?", "section": "While you read", "options": ["A speech by Burak", "An old video from their final week of school", "A photo slideshow", "A gift from the teacher"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine: Our teacher gave a speech about friendship. Our teacher had since retired.", "section": "While you read", "reveal": "Our teacher, who had since retired, gave a speech about friendship.", "prompt": "Our teacher, who...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to Burak's toast, what makes someone a good friend?", "section": "While you read", "options": ["Living nearby", "Being able to make you feel young again despite time passing", "Remembering everyone's name", "Organising events well"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Would you enjoy attending a reunion with old classmates ten years from now? Why or why not?", "Describe a childhood friend whose personality you remember clearly."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Who Is That in the Photo?", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Look at the title. What do you think the speakers are talking about?", "Predict two questions one speaker might ask the other for clarification."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Who Is That in the Photo?", "audio": null, "transcript": [{"speaker": "A", "line": "Hey, is this the photo from your cousin's wedding? Who's the girl standing next to you?"}, {"speaker": "B", "line": "Oh, that's Naz. She's a friend whose family lives near mine in the summer."}, {"speaker": "A", "line": "Sorry, could you clarify that? Do you mean she's a neighbour, or a family friend?"}, {"speaker": "B", "line": "In other words, our families have known each other for years because our summer houses are next to each other."}, {"speaker": "A", "line": "Ah, that makes sense now. And who's the boy who's laughing in the background?"}, {"speaker": "B", "line": "That's Emir, the guy who organised most of the wedding games."}, {"speaker": "A", "line": "Wait, I'm a bit confused. Is he your cousin's friend, or is he related to your family?"}, {"speaker": "B", "line": "Let me explain further — he's actually my cousin's university roommate, and they've been close ever since they met."}, {"speaker": "A", "line": "Got it, thanks for clarifying. And where was this photo taken exactly?"}, {"speaker": "B", "line": "It was taken at the garden where the whole reception was held, right after the ceremony."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Why does Speaker A ask Speaker B to clarify who Naz is?", "section": "While you listen", "options": ["A doesn't believe B", "A isn't sure if Naz is a neighbour or a family friend", "A thinks Naz looks familiar", "A wants to meet Naz"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Emir is Speaker B's cousin.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Emir is B's cousin's university roommate.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The photo was taken at the garden ___ the reception was held.", "section": "While you listen", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which expression does Speaker B use to give more explanation?", "section": "While you listen", "options": ["\"I'm confused\"", "\"Let me explain further\"", "\"Could you clarify?\"", "\"That makes sense\""], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Emir's role connected to the wedding?", "section": "While you listen", "options": ["He is the groom", "He organised most of the wedding games", "He took the photos", "He is Naz's brother"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Which phrases did the speakers use to ask for or give clarification? List two.", "Practise a similar mini-dialogue about a photo of your own friends."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Describe Your Friend", "text": "Describe a close friend to your partner using at least three relative clauses (who/which/that/whose/where/when/why), while your partner listens and asks for clarification when needed.", "steps": ["Think of one close friend and note down three facts about them (personality, a shared place, a shared memory).", "Take turns describing your friend to your partner using relative clauses.", "The listener must ask at least one clarification question during the description.", "The speaker answers by rephrasing or explaining further.", "Switch roles and repeat."], "chips": ["This is a friend who...", "We met at a place where...", "Could you clarify what you mean by...?", "In other words,...", "Sorry, could you explain that a bit more?"], "timer": 600, "levels": ["Give students a short list of sentence starters and relative pronouns to choose from before they speak.", "Students describe their friend using at least three different relative pronouns/adverbs correctly.", "Students add a non-defining relative clause and compare their friend to another person they know."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "A Memorable Event with Friends", "text": "Take turns telling your group about a memorable event you shared with friends, explaining where it happened, when it happened, and why it was memorable, while the group asks clarifying questions.", "steps": ["Think individually of one memorable event with friends for one minute.", "In your group, take turns telling your story, using relative clauses to add detail.", "After each story, at least two group members must ask a clarification question.", "The speaker responds by giving clarification, rephrasing where necessary.", "As a group, decide whose story was the most memorable and why."], "chips": ["It happened at a place where...", "It was the year when...", "The reason why it was special was...", "Sorry, what do you mean by...?", "So, in other words, you're saying..."], "timer": 600, "levels": ["Provide a simple story outline (what/where/when/why) for students who need extra structure.", "Students tell a clear story using at least two relative clauses and respond appropriately to clarification questions.", "Students are asked follow-up questions requiring them to use both defining and non-defining relative clauses in their answers."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Portrait of My Best Friend", "text": "Write a descriptive paragraph about your best friend, using at least four relative clauses to describe their personality, a place you share, and a memorable event together.", "steps": ["Note down your friend's name and three personality traits.", "Think of a place that is special to your friendship and why.", "Think of one memorable event you experienced together.", "Organise your ideas: introduction, personality, shared place/event, conclusion."], "chips": ["loyal", "reliable", "outgoing", "sincere", "get along with", "have in common", "childhood friend", "bond", "... is a friend who/that...", "The place where we... is...", "I'll never forget the day when...", "..., whose..., ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "Clarifying a Misunderstanding", "text": "Write a short message to a friend clarifying something you said earlier that caused a misunderstanding, explaining what you really meant.", "steps": ["Note down what the misunderstanding was about.", "Decide what you actually meant to say.", "Choose polite clarifying expressions to use.", "Write a friendly, clear message."], "chips": ["misunderstanding", "clarify", "rephrase", "in other words", "get confused", "make sense", "I think there was a misunderstanding about...", "What I actually meant was...", "In other words,...", "I hope that makes it clearer now."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct relative pronoun: This is the friend ___ helped me move house.", "section": "Exit ticket", "options": ["which", "who", "where", "whose"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "That's the park ___ we used to play as children.", "section": "Exit ticket", "reveal": "where", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "My mother who works at a hospital called me this morning.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My mother, who works at a hospital, called me this morning.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'someone you can trust completely'?", "section": "Exit ticket", "options": ["acquaintance", "trustworthy", "outgoing", "confused"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Combine: I have a neighbour. My neighbour's daughter is my classmate.", "section": "Exit ticket", "reveal": "I have a neighbour whose daughter is my classmate.", "prompt": "I have a neighbour...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which phrase is used to ask for clarification?", "section": "Exit ticket", "options": ["In other words...", "Could you clarify that?", "I got confused.", "That makes sense."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: is / friend / a / me / who / always / supports / she", "section": "Exit ticket", "words": ["she", "is", "a", "friend", "who", "always", "supports", "me"], "end": ".", "reveal": "She is a friend who always supports me.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "I still remember the summer ___ we became best friends.", "section": "Exit ticket", "reveal": "when", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "In the reading 'The Friend Who Never Gave Up on Me', where did the writer and Ceren usually talk?", "section": "Exit ticket", "options": ["At school", "On a bench in a park", "At Ceren's house", "On the phone"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In the listening, Emir organised the wedding ceremony itself.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Emir organised most of the wedding games.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}], "theme": "Year 11 · Theme 9 · My Friends", "key": "year-11-9"}</script><script src="../../../assets/us-present.js"></script></body></html>
