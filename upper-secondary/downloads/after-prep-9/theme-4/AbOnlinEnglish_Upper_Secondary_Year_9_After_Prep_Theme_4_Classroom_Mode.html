ehold", "pos": "n. phrase", "ipa": "", "tr": "çok kuşaklı hane", "example": "In a multi-generational household, grandparents, parents and children all share the same roof.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "chores", "pos": "n. (pl.)", "ipa": "", "tr": "ev işleri", "example": "We divide the chores fairly between everyone in the house.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "sibling", "pos": "n.", "ipa": "", "tr": "kardeş", "example": "I get on well with my siblings, even when we disagree.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "compromise", "pos": "v./n.", "ipa": "", "tr": "uzlaşmak, uzlaşma", "example": "After a long discussion, we finally reached a compromise about bedtime.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "privacy", "pos": "n.", "ipa": "", "tr": "mahremiyet, özel alan", "example": "It's hard to find privacy in a small house with five people.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "curfew", "pos": "n.", "ipa": "", "tr": "eve giriş saati, sokağa çıkma sınırı", "example": "My parents set a ten o'clock curfew on school nights.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "hospitality", "pos": "n.", "ipa": "", "tr": "misafirperverlik", "example": "Turkish families are famous for their warm hospitality.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "neighbourhood", "pos": "n.", "ipa": "", "tr": "mahalle", "example": "Everyone in our neighbourhood knows each other by name.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "volunteer", "pos": "v./n.", "ipa": "", "tr": "gönüllü olmak, gönüllü", "example": "My family volunteers at the local food bank once a month.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "elderly", "pos": "adj.", "ipa": "", "tr": "yaşlı", "example": "Many elderly relatives prefer to stay close to their family.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "harmony", "pos": "n.", "ipa": "", "tr": "uyum", "example": "It takes effort from everyone to keep harmony in a busy household.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“gönüllü olmak, gönüllü”", "options": ["volunteer", "multi-generational household", "extended family"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“uyum”", "options": ["harmony", "nuclear family", "multi-generational household"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“ev işleri”", "options": ["generation gap", "terraced house", "chores"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“eve giriş saati, sokağa çıkma sınırı”", "options": ["hospitality", "detached house", "curfew"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“bitişik nizam (ikiz) ev”", "options": ["multi-generational household", "semi-detached house", "sibling"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“yaşlı”", "options": ["apartment block", "elderly", "harmony"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Present Perfect vs Present Perfect Progressive", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I <mark>have lived<\/mark> in this flat since 2019.", "My grandmother <mark>has been living<\/mark> with us for six months now, and she loves it.", "We <mark>have already tidied<\/mark> the living room, so we can relax now.", "My brother <mark>has been cleaning<\/mark> his room all morning, but it still looks messy."], "ask": "Which sentences focus on the result or completion of an action, and which focus on the duration of an ongoing activity? Which time expressions (since, for, already, all morning) go with each form?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["have/has + past participle", "have/has been + -ing", "a finished action or result", "how long an action has been in progress"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "For a completed action, especially with just/already/yet/ever/never, we use the Present Perfect: ___.", "section": "Complete the rule", "reveal": "have/has + past participle", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For an activity that started in the past and is still continuing, or continued until recently (often with 'for' or 'since'), we use the Present Perfect Progressive: ___.", "section": "Complete the rule", "reveal": "have/has been + -ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The Present Perfect often highlights ___, while the Present Perfect Progressive often highlights ___.", "section": "Complete the rule", "reveal": "a finished action or result / how long an action has been in progress", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "The Present Perfect (have/has + past participle) describes a completed action or its result, connected to now (used with just, already, yet, ever, never, recently). The Present Perfect Progressive (have/has been + -ing) emphasises the DURATION of an action that started in the past and continues now, or continued until recently (often with for/since).", "tr": "Present Perfect (have/has + fiilin 3. hali), geçmişte olmuş ve şu anla bağlantısı olan tamamlanmış bir eylemi ya da onun sonucunu anlatır (just, already, yet, ever, never, recently ile kullanılır). Present Perfect Progressive (have/has been + -ing) ise geçmişte başlayıp devam eden ya da yakın zamana kadar süren bir eylemin SÜRESİNE vurgu yapar (genellikle for/since ile).", "when_en": "Use the Present Perfect for a completed action or an experience (e.g. household chores); use the Present Perfect Progressive to emphasise how long a family has lived somewhere or how long an activity has continued.", "when": "Ev işleri gibi tamamlanmış bir eylemden veya deneyimden bahsederken Present Perfect; bir ailenin ne kadar süredir bir yerde yaşadığını ya da bir eylemin ne kadar sürdüğünü vurgularken Present Perfect Progressive kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I", "live / since 2019", "in this flat"], "reveal": "I have lived in this flat since 2019.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["my grandmother", "live with us / for six months"], "reveal": "My grandmother has been living with us for six months.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "already / tidy", "the living room"], "reveal": "We have already tidied the living room.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my brother", "clean his room / all morning"], "reveal": "My brother has been cleaning his room all morning.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "ever / share", "a bedroom with a sibling"], "reveal": "Have you ever shared a bedroom with a sibling?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["how long / your family", "live", "in this neighbourhood"], "reveal": "How long has your family lived in this neighbourhood?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about your own family or home: one thing you have already done today, one thing you have never done, and one activity you have been doing for a while (use 'for' or 'since').", "chips": ["I have already…", "I have never…", "I have been … for/since…", "My family has lived here for/since…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["We have tidied the kitchen.", "She has been cooking dinner for an hour."], "negative": ["He hasn't done his chores yet.", "They haven't been getting on well recently."], "question": ["Have you ever lived in an apartment block?", "How long has your grandmother been staying with you?"], "short": ["Yes, I have. / No, I haven't.", "For two months. / Since June."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I am living here since 2015.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I have lived here since 2015.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She has cooked dinner for two hours.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She has been cooking dinner for two hours.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Have you ever been shared a room?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Have you ever shared a room?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "My parents ___ in this house for over twenty years.", "section": "A · Choose the correct option.", "options": ["have lived", "live", "are living"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My sister ___ her homework all afternoon — she's exhausted.", "section": "A · Choose the correct option.", "options": ["has done", "has been doing", "does"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you ever had a curfew at home?", "section": "A · Choose the correct option.", "options": ["Have", "Did", "Are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We have already ___ the table for dinner.", "section": "A · Choose the correct option.", "options": ["set", "setting", "sets"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My grandparents ___ (live) with us since last spring.", "section": "B · Complete with the correct form.", "reveal": "have lived / have been living", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "How long ___ your family ___ (have) this house?", "section": "B · Complete with the correct form.", "reveal": "has / had", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "She ___ (not / finish) tidying her room yet.", "section": "B · Complete with the correct form.", "reveal": "hasn't finished", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I have been knowing my neighbours for ten years.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I have known my neighbours for ten years.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We have been arguing about chores all week.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you ever ___ (share) a bedroom with a sibling?", "section": "Dialogue · Complete with the correct form.", "reveal": "Have / shared", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I ___ (share) one with my brother for five years now.", "section": "Dialogue · Complete with the correct form.", "reveal": "have been sharing / 've been sharing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "how / has / your grandmother / long / lived here", "section": "Dialogue · Reorder the question.", "words": ["how", "long", "has", "your", "grandmother", "lived", "here"], "end": "?", "reveal": "How long has your grandmother lived here?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Comparative and Superlative of Irregular Adjectives", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Life in a shared flat can be <mark>worse<\/mark> than life alone when you have no privacy.", "Grandma says the biggest house isn't always the <mark>best<\/mark> home for a happy family.", "Our new neighbourhood is <mark>farther<\/mark> from the city centre than our old one.", "Of all my cousins, Elif has the <mark>least<\/mark> patience for noisy family dinners."], "ask": "Which words are comparative (comparing two things) and which are superlative (comparing three or more)? Do these adjectives follow the normal -er/-est or more/most pattern?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["good – better – best", "bad – worse – worst", "far – farther/further – farthest/furthest", "little – less – least", "many/much – more – most"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "The comparative and superlative forms of 'good' are ___.", "section": "Complete the rule", "reveal": "good – better – best", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The comparative and superlative forms of 'bad' are ___.", "section": "Complete the rule", "reveal": "bad – worse – worst", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Far' has two possible pairs of forms: ___.", "section": "Complete the rule", "reveal": "far – farther/further – farthest/furthest", "note": "Students write the answer, then  then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Of all the rooms in the house, the attic is the (bad) ___ in winter — it's freezing."], "reveal": "Of all the rooms in the house, the attic is the worst in winter — it's freezing.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["My new school is (far) ___ from home than my old one."], "reveal": "My new school is farther from home than my old one.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["She has (little) ___ free time than her brother because she helps around the house more."], "reveal": "She has less free time than her brother because she helps around the house more.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Of all my relatives, my uncle gives the (many) ___ advice about family problems!"], "reveal": "Of all my relatives, my uncle gives the most advice about family problems!", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences comparing your home or family life using irregular comparatives/superlatives (better/worse, farther/further, less, most).", "chips": ["My home is better/worse than…", "…has the least/most…", "…lives farther/further than…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["This house is better than one in the family.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This is the worst argument we've ever had about chores.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Which house is (good) ___ for a big family — the flat or the cottage?", "section": "Dialogue · Complete with the correct form.", "reveal": "better", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: The cottage, definitely — it has (many) ___ space and (little) ___ noise.", "section": "Dialogue · Complete with the correct form.", "reveal": "more / less", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "family / the / most / patient / in / is / grandmother / our", "section": "Dialogue · Reorder the sentence.", "words": ["our", "grandmother", "is", "the", "most", "patient", "in", "our", "family"], "end": ".", "reveal": "Our grandmother is the most patient in our family.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Reflexive Pronouns", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["After the argument, my sister locked <mark>herself<\/mark> in her room.", "We really enjoyed <mark>ourselves<\/mark> at my cousin's housewarming party.", "My little brother is learning to get dressed by <mark>himself<\/mark> now.", "Grandad often talks to <mark>himself<\/mark> while he's gardening."], "ask": "Which word in each sentence refers back to the subject of the sentence? What do you notice about the pattern 'by + reflexive pronoun'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["myself/yourself/himself/herself/itself", "ourselves/yourselves/themselves", "the subject and the object are the same person/thing", "alone, without help"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use a reflexive pronoun when ___.", "section": "Complete the rule", "reveal": "the subject and the object are the same person/thing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Singular reflexive pronouns are ___.", "section": "Complete the rule", "reveal": "myself/yourself/himself/herself/itself", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Plural reflexive pronouns are ___.", "section": "Complete the rule", "reveal": "ourselves/yourselves/themselves", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'By + reflexive pronoun' means ___.", "section": "Complete the rule", "reveal": "alone, without help", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Reflexive pronouns (myself, yourself, himself, herself, itself, ourselves, yourselves, themselves) are used when the subject and the object of a sentence are the same person or thing. 'By + reflexive pronoun' means 'alone, without help'.", "tr": "Dönüşlü zamirler (myself, yourself, himself, herself, itself, ourselves, yourselves, themselves), cümlenin öznesi ile nesnesi aynı kişi/şey olduğunda kullanılır. 'By + dönüşlü zamir' kalıbı 'yardımsız, tek başına' anlamına gelir.", "when_en": "We use reflexive pronouns to describe an action someone does to themselves, or to say that someone does something alone/without help.", "when": "Bir kişinin kendine yaptığı bir eylemi, ya da bir şeyi tek başına/yardımsız yaptığını anlatırken dönüşlü zamir kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["My grandmother looks after ___ very well for her age."], "reveal": "My grandmother looks after herself very well for her age.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["The twins made breakfast by ___ this morning."], "reveal": "The twins made breakfast by themselves this morning.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I sometimes talk to ___ when I'm doing chores alone."], "reveal": "I sometimes talk to myself when I'm doing chores alone.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Did you and your cousins enjoy ___ at the family reunion?"], "reveal": "Did you and your cousins enjoy yourselves at the family reunion?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["My father taught ___ how to cook after my grandmother moved out."], "reveal": "My father taught himself how to cook after my grandmother moved out.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The cat cleaned ___ in the sun all afternoon."], "reveal": "The cat cleaned itself in the sun all afternoon.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three true sentences about you or your family using reflexive pronouns (myself, yourself, himself/herself, ourselves, themselves).", "chips": ["I sometimes … myself.", "My … taught … himself/herself …", "We enjoyed ourselves when …"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["He introduced himself to our new neighbours.", "We look after ourselves when Mum works late."], "negative": ["She didn't hurt herself in the kitchen.", "They don't blame themselves for the argument."], "question": ["Did you enjoy yourself at your aunt's house?", "Can the children get ready by themselves?"], "short": ["Yes, I did. / No, I didn't.", "Ye tence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Can your little brother get ready for school by ___?", "section": "Dialogue · Complete with the correct pronoun.", "reveal": "himself", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "party / enjoyed / we / the / ourselves / at", "section": "Dialogue · Reorder the sentence.", "words": ["we", "enjoyed", "ourselves", "at", "the", "party"], "end": ".", "reveal": "We enjoyed ourselves at the party.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Wh- Questions: How Long", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>How long<\/mark> have you lived in this house?", "<mark>How long<\/mark> has your family been renting this flat?", "<mark>How long<\/mark> did the family argument last night last?", "<mark>How long<\/mark> will you be staying with your grandparents this summer?"], "ask": "What tenses follow 'How long' in these questions? What kind of answer does 'How long' ask for?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a period of time or duration", "Present Perfect (Simple/Progressive)", "Past Simple", "will/going to for the future"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'How long' asks for ___ as an answer (e.g. two years, since June, an hour).", "section": "Complete the rule", "reveal": "a period of time or duration", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'How long' is most often followed by the ___ to ask about something continuing up to now.", "section": "Complete the rule", "reveal": "Present Perfect (Simple/Progressive)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For a completed period in the past, 'How long' can be followed by the ___.", "section": "Complete the rule", "reveal": "Past Simple", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For a future duration, 'How long' can be followed by ___.", "section": "Complete the rule", "reveal": "will/going to for the future", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'How long' asks about duration. It is followed by the Present Perfect (Simple/Progressive) for something continuing up to now, the Past Simple for a completed period in the past, and will/going to for a future duration.", "tr": "'How long' süre sormak için kullanılır. Şu ana kadar devam eden bir durum için Present Perfect (Simple/Progressive), tamamlanmış bir geçmiş süre için Past Simple, gelecekteki bir süre için will/going to ile kullanılır.", "when_en": "We use 'How long' to ask how long a family has lived somewhere, how long an argument lasted, or how long a visit will continue.", "when": "Ailenin bir evde ne kadar süredir yaşadığını, bir tartışmanın ne kadar sürdüğünü ya da bir ziyaretin ne kadar süreceğini sorarken 'How long' kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Ask your friend how long her family has lived in their house."], "reveal": "How long has your family lived in your house?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Ask how long your neighbour has been renovating her kitchen."], "reveal": "How long has your neighbour been renovating her kitchen?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Ask how long the family argument lasted yesterday."], "reveal": "How long did the family argument last yesterday?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Ask how long your cousins are going to stay with you this summer."], "reveal": "How long are your cousins going to stay with you this summer?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Ask how long your grandparents have been married."], "reveal": "How long have your grandparents been married?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Ask how long it usually takes your family to agree on household chores."], "reveal": "How long does it usually take your family to agree on household chores?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three 'How long' questions about your own home or family, and answer them (e.g. how long you've lived somewhere, how long a family tradition has continued).", "chips": ["How long have you…?", "How long has your family…?", "How long did…?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["How long have you known your neighbours?", "How long has your grandmother been staying with you?"], "negative": ["We don't know how long the renovation will take.", "I'm not sure how long they lived there."], "question": ["How long have you lived in this neighbourhood?", "How long did the family gathering last?"], "short": ["For five years. / Since 2018.", "About three hours."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How long you have lived here?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How long have you lived here?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How long time have you lived here?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How long have you lived here?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How long is the family argument lasted?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How long did the family argument last?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "How long ___ your grandparents been married?", "section": "A · Choose the correct option.", "options": ["have", "has", "did"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long ___ the family dinner last night?", "section": "A · Choose the correct option.", "options": ["did...last", "has...lasted", "lasts"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long ___ you be staying with your aunt this summer?", "section": "A · Choose the correct option.", "options": ["will", "have", "did"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long ___ your parents lived in that apartment block?", "section": "A · Choose the correct option.", "options": ["have", "has", "did"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "How long ___ (you / live) in this neighbourhood?", "section": "B · Complete with the correct form.", "reveal": "have you lived / have you been living", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "How long ___ the housewarming party ___ (last) on Saturday?", "section": "B · Complete with the correct form.", "reveal": "did / last", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "How long ___ your brother ___ (share) a room with you?", "section": "B · Complete with the correct form.", "reveal": "has / been sharing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "How long time have you lived in this house?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How long have you lived in this house?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "How long has your family owned this house?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: How long ___ you ___ (know) your best friend's family?", "section": "Dialogue · Complete with the correct form.", "reveal": "have / known", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "long / your / how / grandparents / married / have / been", "section": "Dialogue · Reorder the question.", "words": ["how", "long", "have", "your", "grandparents", "been", "married"], "end": "?", "reveal": "How long have your grandparents been married?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Homes Around the World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What different types of homes do you expect to read about?", "What kind of home do you live in? How is it similar to or different from your neighbours' homes?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Homes Around the World", "num": 1, "total": 3, "text": "Step outside your own front door and you will find a huge variety of homes across the globe, each shaped by climate, geography and culture. In Mongolia, many nomadic families still live in a ger, a round, portable tent made of felt and wood that can be packed up and moved within a few hours when herders travel to new grazing land. In Hong Kong, by contrast, more than seven million people live in one of the most densely populated cities on Earth, and most families share small, efficient apartments stacked dozens of storeys high above narrow streets.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Homes Around the World", "num": 2, "total": 3, "text": "In parts of Southeast Asia and West Africa, stilt houses raise the living space above rivers, floodwater or simply the damp ground, keeping homes cooler and safer from pests. In the Netherlands, some families have chosen to live on the water itself, in houseboats moored along the canals — a practical answer to a small, flat country with limited land. Meanwhile, in the suburbs of many Western cities, detached houses with private gardens remain the dream for families who value space and privacy above all else.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Homes Around the World", "num": 3, "total": 3, "text": "These differences are rarely accidental. A home's shape, size and materials usually reflect what is available locally, how extended a family typically is, and how much space a culture expects each generation to share. Understanding housing diversity, then, is really a way of understanding how people everywhere adapt to their environment — and to each other.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["One type of housing is better than all the others.", "Housing around the world varies widely because of climate, geography and culture.", "All families around the world live in the same type of home."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In Mongolia, many nomadic families live in a portable tent called a ___.", "section": "While you read", "reveal": "ger", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why do people build stilt houses, according to the text?", "section": "While you read", "options": ["To make homes look more traditional", "To keep homes cooler and safer from floodwater or pests", "To save money on furniture"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Houseboats in the Netherlands are mentioned as a practical solution to limited land.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "According to the text, a home's shape and materials usually reflect what is ___ locally, family size, and cultural expectations about sharing space.", "section": "While you read", "reveal": "available", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which of the homes described in the text would you most like to live in, and why?", "Write one sentence comparing your own home to one described in the text."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Three Generations, One Roof", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think are the biggest challenges of living with grandparents or other relatives in the same house?", "Predict: what solutions might a family find for daily conflicts like these?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Three Generations, One Roof", "num": 1, "total": 3, "text": "When Zeynep's grandparents moved in with her family two years ago, the house suddenly felt smaller — and louder. Zeynep, her parents, her younger brother, and now her grandparents all share one kitchen, one living room, and, most of the time, one opinion about how loudly the television should be played. 'At first, it was strange,' Zeynep admits. 'My grandmother wanted dinner at six, my parents preferred eight, and nobody could agree on the thermostat.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Three Generations, One Roof", "num": 2, "total": 3, "text": "Daily conflicts like these are common in multi-generational households, where different generations often have different habits, schedules and expectations about privacy. Zeynep's family found that the biggest arguments weren't really about dinner times or the television — they were about respect and personal space. Her parents felt that they had lost some control over their own home; her grandparents felt that their advice, built on decades of experience, was not always welcome.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Three Generations, One Roof", "num": 3, "total": 3, "text": "Slowly, the family developed a few simple house rules: everyone gets one hour of quiet time in the evening, chores are divided fairly between the generations, and big decisions — from meals to holidays — are discussed together at a short Sunday meeting. 'It's not perfect,' says Zeynep, 'but we've learned to compromise, and honestly, having my grandparents here has been the best thing that's happened to our family. My brother and I have learned so much from them, and they don't feel lonely anymore.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main challenge described in the first paragraph?", "section": "While you read", "options": ["The family cannot afford a bigger house.", "Different generations sharing one home have different daily habits.", "Zeynep's grandparents refuse to help with chores."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "According to the text, the biggest arguments in Zeynep's family were really about respect and ___.", "section": "While you read", "reveal": "personal space", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Zeynep's family solved every conflict immediately and perfectly.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The family developed house rules and learned to compromise over time — it's not described as perfect.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What rule did the family create for evenings?", "section": "While you read", "options": ["No television after dinner", "One hour of quiet time", "A strict bedtime for everyone"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The family discusses big decisions together at a short ___ meeting.", "section": "While you read", "reveal": "Sunday", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think living with extended family has more advantages or disadvantages? Why?", "Write one sentence giving your own opinion about multi-generational households."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Family Meeting: Finding a Solution", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what kind of problem do you think this family meeting will be about?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Family Meeting: Finding a Solution", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is the family meeting mainly about?", "section": "While you listen", "options": ["Choosing a new house", "Solving a disagreement about chores", "Planning a holiday"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Ayşe says she has been very ___ with homework this week.", "section": "While you listen", "reveal": "busy", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The grandfather has lived in the house for over forty years." (function () {

  function canReveal(sc) { return ["word", "notice", "question", "cue", "audio"].indexOf(sc.type) >= 0 && !sc.shown; }

  /* ---------- baskı modu (slayt PDF) ---------- */

  /* ---------- gezinme ---------- */
  function deck() { return DECKS[cur.d]; }
  function screen() { return deck().screens[cur.s]; }

    var rb = $(".preveal"); rb.hidden = !canReveal(sc);
    rb.textContent = sc.type === "notice" && cur.step < sc.items.length && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    $(".pnotes-body").textContent = sc.note || "Bu ekran için not yok.";
    $(".pprev").disabled = cur.d === 0 && cur.s === 0;
    if (sc.timer) setTimer(sc.timer, false);
    try { history.replaceState(null, "", "#" + d.id + "-" + (cur.s + 1)); } catch (e) {}
    store.set("us:present:" + P.key, { d: cur.d, s: cur.s });
    bindStage(sc);
  }
  function go(dd, ss) { cur.d = dd; cur.s = ss; cur.revealed = false; cur.step = 0; render(); }
  function next() {
    var d = deck();
    if (cur.s < d.screens.length - 1) go(cur.d, cur.s + 1);
    else if (cur.d < DECKS.length - 1) go(cur.d + 1, 0);
  }
  function prev() {

    else if (cur.d > 0) go(cur.d - 1, DECKS[cur.d - 1].screens.length - 1);
  }
  function reveal() {
    var sc = screen(); if (!canReveal(sc)) return;
    if (sc.type === "notice" && cur.step < sc.items.length) { cur.step++; if (cur.step >= sc.items.length) cur.revealed = true; }
    else cur.revealed = true;
    var keep = stage.querySelector(".porder-line") ? stage.querySelector(".porder-line").innerHTML : null;
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    if (keep !== null) stage.querySelector(".porder-line").innerHTML = keep;
    var rb = $(".preveal"); rb.textContent = sc.type === "notice" && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    bindStage(sc);
  }
  function bindStage(sc) {
    $$(".popt", stage).forEach(function (b) { b.addEventListener("click", function () { $$(".popt", stage).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); }); });
    var pl = stage.querySelector("[data-audio]");
    if (pl) { var au; pl.addEventListener("click", function () { if (!au) au = new Audio(pl.getAttribute("data-audio")); if (au.paused) { au.play().catch(function () {}); pl.textContent = "❚❚ Pause"; } else { au.pause(); pl.textContent = "▶ Play"; } }); }
    var hid = stage.querySelector(".phide"); if (hid) hid.addEventListener("click", function () { hid.classList.add("on"); cur.revealed = true; });
  }
  stage.addEventListener("click", function (e) {
    var c = e.target.closest(".pchipw"); if (!c) return;
    var line = stage.querySelector(".porder-line"), bank = stage.querySelector(".porder-bank");
    (c.parentNode === bank ? line : bank).appendChild(c);
  });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b && "speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(b.getAttribute("data-say")); u.lang = "en-GB"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  });

  /* ---------- araçlar: sayaç ---------- */
  var T = { left: 0, total: 0, id: null };
  var tbox = $(".ptimer");
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function drawT() { $(".ptime", tbox).textContent = fmt(T.left); tbox.classList.toggle("ending", T.left > 0 && T.left <= 10); tbox.classList.toggle("done", T.left === 0 && T.total > 0); }
  function setTimer(sec, start) { stopT(); T.left = T.total = sec; tbox.hidden = false; drawT(); if (start) startT(); }
  function startT() { if (T.id || !T.left) return; T.id = setInterval(function () { T.left--; drawT(); if (T.left <= 0) { stopT(); beep(); } }, 1000); $(".ptgo", tbox).textContent = "❚❚"; }
  function stopT() { clearInterval(T.id); T.id = null; if (tbox) $(".ptgo", tbox).textContent = "▶"; }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime + t); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {} }
  $(".ptgo", tbox).addEventListener("click", function () { T.id ? stopT() : startT(); });
  $$("[data-t]", tbox).forEach(function (b) { b.addEventListener("click", function () { setTimer(+b.getAttribute("data-t"), true); }); });
  $(".ptclose", tbox).addEventListener("click", function () { stopT(); tbox.hidden = true; });

  /* ---------- araçlar: rastgele öğrenci ---------- */
  var pick = $(".ppick"), used = [];
  $("#p-size").value = store.get("us:classsize", 30);
  function pickOne() {
    var n = Math.max(2, Math.min(60, +$("#p-size").value || 30)); store.set("us:classsize", n);
    if (used.length >= n) used = [];
    var r; do { r = 1 + Math.floor(Math.random() * n); } while (used.indexOf(r) >= 0);
    used.push(r);
    var big = $(".pnum", pick); var k = 0;
    var spin = setInterval(function () { big.textContent = 1 + Math.floor(Math.random() * n); if (++k > 10) { clearInterval(spin); big.textContent = r; } }, 60);
    $(".pused", pick).textContent = "Seçilenler: " + used.join(", ");
  }
  $(".pgo", pick).addEventListener("click", pickOne);
  $(".ppclose", pick).addEventListener("click", function () { pick.hidden = true; });

  /* ---------- araçlar: puan tablosu ---------- */
  var score = $(".pscore"), S = store.get("us:score:" + P.key, [0, 0]);
  function drawS() { $$(".pts", score).forEach(function (x, i) { x.textContent = S[i]; }); store.set("us:score:" + P.key, S); }
  $$("[data-sc]", score).forEach(function (b) { b.addEventListener("click", function () { var a = b.getAttribute("data-sc").split(","); S[+a[0]] = Math.max(0, S[+a[0]] + (+a[1])); drawS(); }); });
  $(".psreset", score).addEventListener("click", function () { S = [0, 0]; drawS(); });
  drawS();

  /* ---------- düğmeler & klavye ---------- */
  function tool(name) {
    if (name === "timer") { tbox.hidden = !tbox.hidden; }
    if (name === "pick") { pick.hidden = !pick.hidden; if (!pick.hidden) pickOne(); }
    if (name === "score") { score.hidden = !score.hidden; }
    if (name === "notes") { var n = $(".pnotes"); n.hidden = !n.hidden; }
    if (name === "full") { var d = document.documentElement; if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(function () {}); } else document.exitFullscreen(); }
  }
  $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { tool(b.getAttribute("data-tool")); }); });
  $(".pnext").addEventListener("click", next);
  $(".pprev").addEventListener("click", prev);
  $(".preveal").addEventListener("click", reveal);
  $$(".pdeck").forEach(function (b, i) { b.addEventListener("click", function () { go(i, 0); }); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,textarea,select")) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); next(); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); prev(); }
    else if (k === "r" || k === "enter") { e.preventDefault(); reveal(); }
    else if (k === "t") tool("timer"); else if (k === "p") tool("pick"); else if (k === "s") tool("score"); else if (k === "n") tool("notes"); else if (k === "f") tool("full");
  });
  // dokunmatik kaydırma
  var sx = null;
  stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) (dx < 0 ? next : prev)(); sx = null; });

  // başlangıç: hash ya da kayıtlı konum
  var m = (location.hash || "").match(/^#([a-z0-9-]+)-(\d+)$/), start = store.get("us:present:" + P.key, { d: 0, s: 0 });
  if (m) { DECKS.forEach(function (d, i) { if (d.id === m[1]) { start = { d: i, s: Math.min(+m[2] - 1, d.screens.length - 1) }; } }); }
  if (!DECKS[start.d] || !DECKS[start.d].screens[start.s]) start = { d: 0, s: 0 };
  go(start.d, start.s);
})();
</script></body></html>
