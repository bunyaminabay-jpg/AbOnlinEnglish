.pq{font:600 clamp(1.6rem,4vw,3.4rem)/1.3 "Outfit",sans-serif;margin:0 0 .6em}

ed the river's ecosystem for years afterwards.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "displacement", "pos": "n.", "ipa": "", "tr": "yerinden edilme, göçe zorlanma", "example": "The earthquake caused the displacement of thousands of residents.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "resilience", "pos": "n.", "ipa": "", "tr": "dayanıklılık, toparlanma gücü", "example": "The town's resilience impressed the international relief teams.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "relief effort", "pos": "n. phrase", "ipa": "", "tr": "yardım çalışması", "example": "Volunteers joined the relief effort within days of the flood.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "artificial intelligence (AI)", "pos": "n. phrase", "ipa": "", "tr": "yapay zeka", "example": "Artificial intelligence can now analyse satellite images to spot early signs of a wildfire.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "predict", "pos": "v.", "ipa": "", "tr": "tahmin etmek, öngörmek", "example": "Scientists used weather data to predict the storm three days in advance.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "algorithm", "pos": "n.", "ipa": "", "tr": "algoritma", "example": "The app's algorithm compares rainfall data with river levels to warn of floods.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "data analysis", "pos": "n. phrase", "ipa": "", "tr": "veri analizi", "example": "Data analysis helped hospitals prepare for the number of patients after the earthquake.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "early warning system", "pos": "n. phrase", "ipa": "", "tr": "erken uyarı sistemi", "example": "The early warning system gave residents twenty minutes to leave the area.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "sustainable", "pos": "adj.", "ipa": "", "tr": "sürdürülebilir", "example": "Rebuilding with sustainable materials can help the town recover safely.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "vulnerable", "pos": "adj.", "ipa": "", "tr": "kırılgan, savunmasız", "example": "Coastal communities are particularly vulnerable to rising sea levels.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“erken uyarı sistemi”", "options": ["drought", "vulnerable", "early warning system"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“algoritma”", "options": ["algorithm", "flood", "relief effort"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“dayanıklılık, toparlanma gücü”", "options": ["natural disaster", "data analysis", "resilience"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sürdürülebilir”", "options": ["artificial intelligence (AI)", "resilience", "sustainable"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“bir olayın ardından yaşanan dönem”", "options": ["predict", "aftermath", "vulnerable"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“tahliye etmek”", "options": ["evacuate", "landslide", "ecosystem"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Defining Relative Clauses (who / which / that)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Scientists <mark>who study earthquakes<\/mark> can now predict some tremors more accurately.", "The flood <mark>that destroyed the village<\/mark> changed the way the government plans for disasters.", "This is the kind of technology <mark>which helps doctors diagnose diseases faster<\/mark>.", "People <mark>who live near the coast<\/mark> are usually the most vulnerable to storms."], "ask": "In each sentence, does the relative clause give essential information about the noun before it, or could we remove it without losing important meaning? Which word introduces each clause?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["who", "which", "that", "no commas"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use ___ or ___ for people.", "section": "Complete the rule", "reveal": "who / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use ___ or ___ for things.", "section": "Complete the rule", "reveal": "which / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Defining relative clauses give essential information, so we use ___ around them.", "section": "Complete the rule", "reveal": "no commas", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A defining relative clause gives essential information about the noun in the main clause; without it, the sentence's meaning would be incomplete or unclear. Use who/that for people and which/that for things. No commas are used with defining relative clauses.", "tr": "Defining (tanımlayıcı) relative clause, ana cümledeki isim hakkında zorunlu/temel bilgi verir; bu bilgi olmadan cümlenin anlamı eksik veya belirsiz kalır. İnsanlar için who/that, nesneler için which/that kullanılır. Bu tür cümlelerde virgül KULLANILMAZ.", "when_en": "We use defining relative clauses when we need to make clear exactly which person or thing we are talking about — for example, identifying one specific disaster among many.", "when": "Hangi kişi ya da nesneden bahsettiğimizi netleştirmek istediğimizde defining relative clause kullanırız — örneğin birçok deprem arasından belirli birini tanımlarken.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Scientists study earthquakes.", "They can now predict some tremors."], "reveal": "Scientists who study earthquakes can now predict some tremors.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["The disaster destroyed hundreds of homes.", "It happened last spring."], "reveal": "The disaster that happened last spring destroyed hundreds of homes.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["An algorithm analyses weather data.", "It can warn people hours before a storm."], "reveal": "An algorithm that analyses weather data can warn people hours before a storm.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The volunteers helped flood victims.", "They worked day and night."], "reveal": "The volunteers who worked day and night helped flood victims.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["This is the app.", "It predicts wildfires using AI."], "reveal": "This is the app which predicts wildfires using AI.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / the scientists / develop early warning systems / do you know them"], "reveal": "Do you know the scientists who develop early warning systems?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about natural disasters or technology, each with a defining relative clause (who/which/that).", "chips": ["Scientists who...", "The disaster that...", "A system which...", "People who..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Scientists who study earthquakes work at the university.", "The app that predicts floods is free."], "negative": ["People who don't prepare for disasters are more at risk.", "This isn't the system which we tested last year."], "question": ["Is this the technology that helps predict wildfires?", "Do you know the scientist who developed this algorithm?"], "short": ["Yes, it is. / No, it isn't.", "Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The scientist, who developed the app, works at our university.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The scientist who developed the app works at our university.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the village which it was destroyed by the flood.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the village which was destroyed by the flood.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "The volunteers ___ arrived first saved many lives.", "section": "A · Choose the correct option.", "options": ["who", "which", "whom"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This is the drone ___ films the flooded areas from above.", "section": "A · Choose the correct option.", "options": ["who", "which", "whose"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "People ___ live in coastal areas face a higher flood risk.", "section": "A · Choose the correct option.", "options": ["which", "who", "whom"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The scientist ___ built the early warning app won an award.", "section": "B · Complete with who / which / that.", "reveal": "who / that", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This is the technology ___ helps doctors predict disease outbreaks.", "section": "B · Complete with who / which / that.", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The town ___ was hit by the earthquake is slowly rebuilding.", "section": "B · Complete with who / which / that.", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The engineer, who designed the system, is famous.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The engineer who designed the system is famous.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This is the app that predicts wildfires.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Have you seen the video ___ shows the flood damage?", "section": "Dialogue · Complete with that/which.", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes! It's the one ___ went viral last week.", "section": "Dialogue · Complete with that/which.", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "predicts / the app / floods / which / is very accurate", "section": "Dialogue · Reorder the sentence.", "words": ["the", "app", "which", "predicts", "floods", "is", "very", "accurate"], "end": ".", "reveal": "The app which predicts floods is very accurate.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Non-Defining Relative Clauses (who / which, with commas)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The 2023 earthquake, <mark>which affected millions of people<\/mark>, changed disaster policy across the region.", "Dr. Aylin Kaya, <mark>who leads the early warning project<\/mark>, spoke at the conference yesterday.", "Wildfires, <mark>which are becoming more frequent because of climate change<\/mark>, threaten entire ecosystems.", "My uncle, <mark>who works for a relief organisation<\/mark>, has helped after three major floods."], "ask": "Is the information in the relative clause essential, or is it extra/additional information? What punctuation marks it off from the rest of the sentence? Could you use 'that' instead of 'who/which' here?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["extra/additional", "commas", "cannot use 'that'"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Non-defining relative clauses give ___ information — the sentence still makes sense without them.", "section": "Complete the rule", "reveal": "extra/additional", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We separate a non-defining clause from the rest of the sentence with ___.", "section": "Complete the rule", "reveal": "commas", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In non-defining clauses, we ___.", "section": "Complete the rule", "reveal": "cannot use 'that'", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "A non-defining relative clause adds extra information about the noun; the sentence still makes complete sense without it. Commas are used before and after the clause, and 'that' is NOT used in non-defining clauses.", "tr": "Non-defining (tanımlayıcı olmayan) relative clause, ana cümledeki isim hakkında EK/fazladan bilgi verir; bu bilgi çıkarılsa bile cümle hâlâ anlamlıdır. Cümlenin başında ve sonunda VİRGÜL kullanılır ve bu tür cümlelerde 'that' KULLANILMAZ.", "when_en": "We use non-defining relative clauses to add an interesting or extra detail about a noun whose identity is already clear (proper names, unique people or places).", "when": "Zaten kim/ne olduğu belli olan bir isim (özel isimler, tek olan yer/kişiler) hakkında ilginç ya da ek bir detay eklemek istediğimizde non-defining relative clause kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["The Kobe earthquake which happened in 1995 killed thousands of people."], "reveal": "The Kobe earthquake, which happened in 1995, killed thousands of people.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Professor Demir who studies climate change gave a lecture on droughts."], "reveal": "Professor Demir, who studies climate change, gave a lecture on droughts.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The Amazon rainforest which produces a huge amount of oxygen is losing trees every year."], "reveal": "The Amazon rainforest, which produces a huge amount of oxygen, is losing trees every year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["This app which was created by students won a technology prize."], "reveal": "This app, which was created by students, won a technology prize.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["My cousin who volunteers for disaster relief is travelling to the flood zone."], "reveal": "My cousin, who volunteers for disaster relief, is travelling to the flood zone.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about people or places you know, adding extra (non-defining) information with who/which and commas.", "chips": ["My..., who..., ...", "..., which..., is/was..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The 2023 earthquake, which affected millions, changed disaster policy.", "Dr. Kaya, who leads the project, spoke yesterday."], "negative": ["The report, which wasn't published until March, surprised experts.", "My uncle, who doesn't usually travel far, went to help."], "question": ["Have you read about the Amazon, which is losing trees every year?", "Do you know Dr. Kaya, who developed the warning system?"], "short": ["Yes, I have. / No, I haven't.", "Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The Amazon rainforest, that produces oxygen, is shrinking.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The Amazon rainforest, which produces oxygen, is shrinking.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My uncle who works for a relief organisation is here.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My uncle, who works for a relief organisation, is here.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Mount Everest, ___ is the world's highest mountain, attracts thousands of climbers.", "section": "A · Choose the correct option.", "options": ["that", "which", "who"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My sister, ___ works as a nurse, helped after the earthquake.", "section": "A · Choose the correct option.", "options": ["who", "that", "which"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which sentence is punctuated correctly?", "section": "A · Choose the correct option.", "options": ["The scientist, who developed the app won an award.", "The scientist who developed the app, won an award.", "The scientist, who developed the app, won an award."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The flood, ___ destroyed hundreds of homes, happened in April.", "section": "B · Complete with who / which.", "reveal": "which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Professor Aydın, ___ leads our research team, is studying drought patterns.", "section": "B · Complete with who / which.", "reveal": "who", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The report that we published last year, was very detailed.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The report that we published last year was very detailed.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Türkiye, which lies on two continents, experiences frequent earthquakes.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Have you met Dr. Kaya, ___ leads the AI disaster project?", "section": "Dialogue · Complete with who/which.", "reveal": "who", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Not yet, but I read her report, ___ was published last month.", "section": "Dialogue · Complete with who/which.", "reveal": "which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Omitting the Relative Pronoun (Object Relative Clauses)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The report <mark>(that)<\/mark> scientists published last year warned about rising sea levels.", "The app <mark>(which)<\/mark> my brother uses tracks earthquake activity in real time.", "I still remember the storm <mark>(that)<\/mark> we experienced two years ago.", "The volunteers <mark>(who)<\/mark> the organisation trained worked in the flood zone."], "ask": "In each sentence, is the person/thing in the relative clause the subject or the object of the verb inside that clause? Which word could be left out without changing the meaning?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["object", "subject", "cannot be omitted"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "When the relative pronoun is the ___ of the relative clause verb (the clause already has its own subject), it can often be omitted.", "section": "Complete the rule", "reveal": "object", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "When the relative pronoun is the ___ of the relative clause verb, it must stay.", "section": "Complete the rule", "reveal": "subject", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A relative pronoun that is the subject of the clause ___.", "section": "Complete the rule", "reveal": "cannot be omitted", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "The relative pronoun (that/which/who) can usually be omitted when it is the OBJECT of the relative clause (the clause has its own subject). It cannot be omitted when it is the SUBJECT of the clause. This rule only applies to defining relative clauses.", "tr": "Relative pronoun (that/which/who), relative clause içinde NESNE görevindeyse (clause'un kendi öznesi varsa) genellikle atlanabilir. Ancak relative pronoun clause'un ÖZNESİ ise atlanamaz. Bu kural sadece defining relative clause'lar için geçerlidir.", "when_en": "We often omit the object relative pronoun in speech and everyday writing to make sentences sound more natural and less formal.", "when": "Konuşma dilinde ve günlük yazıda cümleyi daha akıcı hale getirmek için nesne konumundaki relative pronoun'u atlarız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["The scientist that we interviewed studies volcanoes. (object)"], "reveal": "The scientist we interviewed studies volcanoes.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["The data that the sensors collect helps predict earthquakes. (object)"], "reveal": "The data the sensors collect helps predict earthquakes.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The engineers who designed the app are from Izmir. (subject)"], "reveal": "cannot omit — 'who' is the subject: The engineers who designed the app are from Izmir.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The house that the storm destroyed was empty. (object)"], "reveal": "The house the storm destroyed was empty.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The system which predicts floods was built by students. (subject)"], "reveal": "cannot omit — 'which' is the subject: The system which predicts floods was built by students.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write two sentences with an object relative clause where you can omit the pronoun, and one sentence with a subject relative clause where you cannot.", "chips": ["The ... I ...", "The ... that/which ... (subject) ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The report (that) we read was alarming.", "The scientist who studies volcanoes gave a talk."], "negative": ["The data (that) we collected wasn't complete.", "The system which predicts floods doesn't always work."], "question": ["Is this the app (that) you downloaded?", "Is this the scientist who developed the app?"], "short": ["Yes, it is. / No, it isn't.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The scientist studies volcanoes gave a talk.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The scientist who studies volcanoes gave a talk.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This is the report which, I read yesterday.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This is the report (which) I read yesterday.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Which sentence CANNOT drop the relative pronoun?", "section": "A · Choose the correct option.", "options": ["The house (that) the flood destroyed is empty.", "The scientist who studies volcanoes gave a talk.", "The report (that) we published was long."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The app ___ my brother downloaded tracks earthquakes. (most natural, informal)", "section": "A · Choose the correct option.", "options": ["that", "— (no word needed)", "whom"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The volunteers ___ arrived first started the rescue.", "section": "A · Choose the correct option.", "options": ["(nothing)", "who", "—"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The data the sensors ___ (collect) helps scientists predict storms.", "section": "B · Complete with the correct form.", "reveal": "collect", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "This is the algorithm ___ engineers designed for flood prediction. (formal style, add the pronoun)", "section": "B · Complete with the correct form.", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The engineers designed the app won an award.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The engineers who designed the app won an award.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The report we read yesterday was alarming.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Is this the data ___ the AI system uses? (formal)", "section": "Dialogue · Complete with that/which.", "reveal": "that / which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "destroyed / the flood / the house / was empty", "section": "Dialogue · Reorder the sentence.", "words": ["the", "house", "the", "flood", "destroyed", "was", "empty"], "end": ".", "reveal": "The house the flood destroyed was empty.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Relative Clauses with 'whose' (Possession)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["The scientist <mark>whose research predicted the earthquake<\/mark> received an award.", "We interviewed a family <mark>whose house was destroyed by the flood<\/mark>.", "This is the village <mark>whose water supply was affected by the drought<\/mark>.", "The company <mark>whose app warns people about wildfires<\/mark> is expanding across the country."], "ask": "What does 'whose' show — possession, location or time? Can 'whose' be used only for people, or for people and things too?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["possession", "people and things", "noun"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Whose' shows ___ — something belongs to someone or something.", "section": "Complete the rule", "reveal": "possession", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Whose' can be used for ___, unlike who/which.", "section": "Complete the rule", "reveal": "people and things", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After 'whose' we always need a ___ (whose + noun).", "section": "Complete the rule", "reveal": "noun", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Whose' is a possessive relative pronoun used to show that something belongs to a person or thing already mentioned. It can be used for people AND things/places, and it is always followed by a noun (whose + noun).", "tr": "'Whose', bir kişi ya da şeye ait olan bir başka isim hakkında bilgi vermek için kullanılan iyelik bildiren relative pronoun'dur. Hem insanlar hem de nesneler/yerler için kullanılabilir ve kendisinden sonra mutlaka bir isim gelir (whose + isim).", "when_en": "We use 'whose' to introduce a feature that belongs to a person or place — their house, family, system, and so on.", "when": "Bir kişinin ya da yerin sahip olduğu bir özelliği (evi, ailesi, sistemi vb.) tanıtırken 'whose' kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["We interviewed a family.", "Their house was destroyed."], "reveal": "We interviewed a family whose house was destroyed.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["The scientist won an award.", "Her research predicted the earthquake."], "reveal": "The scientist whose research predicted the earthquake won an award.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The village lost its water supply.", "Its wells dried up during the drought."], "reveal": "The village whose wells dried up during the drought lost its water supply.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The company is expanding.", "Its app warns people about wildfires."], "reveal": "The company whose app warns people about wildfires is expanding.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I spoke to a boy.", "His school was flooded last year."], "reveal": "I spoke to a boy whose school was flooded last year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences with 'whose', describing people, places or organisations connected to natural disasters or technology.", "chips": ["The scientist whose...", "A family whose...", "The city whose..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The scientist whose research predicted the earthquake won an award.", "The village whose wells dried up needs help."], "negative": ["The family whose house wasn't damaged still helped their neighbours.", "This isn't the company whose app failed."], "question": ["Is this the scientist whose research predicted the earthquake?", "Do you know the family whose house was destroyed?"], "short": ["Yes, it is. / No, it isn't.", "Yes, I do. / No, I don't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The scientist who's research predicted the earthquake won an award.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The scientist whose research predicted the earthquake won an award.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The village whose it lost its water supply needs help.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The village whose water supply was lost needs help.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "The engineer ___ app predicts wildfires works at our university.", "section": "A · Choose the correct option.", "options": ["who", "whose", "which"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This is the town ___ water supply was affected by the drought.", "section": "A · Choose the correct option.", "options": ["who", "whose", "which"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct sentence.", "section": "A · Choose the correct option.", "options": ["The scientist who's research is famous spoke today.", "The scientist whose research is famous spoke today.", "The scientist which research is famous spoke today."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We met a family ___ house had been flooded twice.", "section": "B · Complete with whose.", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The company ___ app won the innovation prize is based in Ankara.", "section": "B · Complete with whose.", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The scientist who's research predicted the flood is famous now.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The scientist whose research predicted the flood is famous now.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This is the village whose wells dried up during the drought.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Do you know the family ___ house was rebuilt after the earthquake?", "section": "Dialogue · Complete with whose.", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "predicted / whose / the earthquake / the scientist / research / won an award", "section": "Dialogue · Reorder the sentence.", "words": ["the", "scientist", "whose", "research", "predicted", "the", "earthquake", "won", "an", "award"], "end": ".", "reveal": "The scientist whose research predicted the earthquake won an award.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "When the Ground Shakes: The Real Cost of a Natural Disaster", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you expect this text to compare or describe?", "What do you already know about the effects of an earthquake on a town or a natural environment?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "When the Ground Shakes: The Real Cost of a Natural Disaster", "num": 1, "total": 4, "text": "At 4:17 in the morning, the small town of Elmalı, which had never experienced a serious earthquake before, began to shake violently for almost forty seconds. Buildings that had stood for decades collapsed within minutes, and the streets, which were usually silent at that hour, filled with dust, noise and frightened residents searching for their families. By sunrise, rescue teams whose job it was to search the rubble had already pulled dozens of survivors from collapsed buildings, but for many families the search continued for days.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "When the Ground Shakes: The Real Cost of a Natural Disaster", "num": 2, "total": 4, "text": "The disaster's impact on the surrounding countryside was just as severe as its impact on the town itself. The earthquake triggered several landslides that blocked mountain roads and changed the course of a small river, flooding farmland that had fed the community for generations. Forests on the hillsides, whose roots normally hold the soil in place, were badly damaged, which made the land even more vulnerable to future landslides. Local wildlife, including birds and small mammals that depended on those forests, lost much of their natural habitat almost overnight.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "When the Ground Shakes: The Real Cost of a Natural Disaster", "num": 3, "total": 4, "text": "In the weeks that followed, thousands of people who had lost their homes were moved to temporary shelters, and this displacement created its own challenges: overcrowding, limited clean water, and the stress of an uncertain future. Yet the relief effort that followed also showed remarkable resilience. Volunteers whose only connection to Elmalı was a desire to help arrived from across the country, and within a month a temporary school, which the community built almost entirely by hand, was already open for local children.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "When the Ground Shakes: The Real Cost of a Natural Disaster", "num": 4, "total": 4, "text": "Experts who study natural disasters point out that Elmalı's experience is far from unique. Every year, similar events devastate communities that are simply unprepared for what nature can do — a reminder that understanding both the human and the environmental cost of a disaster is the first step towards being ready for the next one.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Elmalı's earthquake only damaged buildings, not the countryside.", "The earthquake had a serious impact on both the town and the natural environment around it.", "The relief effort in Elmalı failed completely."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The earthquake triggered several ___ that blocked mountain roads and changed the course of a river.", "section": "While you read", "reveal": "landslides", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, why did the damaged forests make the land more vulnerable to future landslides?", "section": "While you read", "options": ["Because the trees attracted more rain", "Because their roots normally hold the soil in place", "Because the wildlife left the area"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The temporary school in Elmalı was built entirely by government workers.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The temporary school was built almost entirely by hand by the community and volunteers.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Thousands of people who had lost their homes experienced ___ , which created overcrowding and limited clean water.", "section": "While you read", "reveal": "displacement", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which effect of the earthquake — on people or on nature — do you think was more serious? Why?", "Write one sentence describing how you think you would feel in Elmalı's situation, using a relative clause."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Can Technology Predict the Next Disaster?", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think technology can and cannot do to prevent damage from a natural disaster?", "Have you ever heard of an app or a system that warns people about floods, earthquakes or wildfires?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Can Technology Predict the Next Disaster?", "num": 1, "total": 4, "text": "For most of human history, natural disasters arrived almost without warning. Today, however, artificial intelligence and data analysis are changing that completely. Scientists who study climate patterns now use algorithms that can process huge amounts of satellite data, weather records and historical information — far more than any human team could analyse alone — to identify the early signs of an earthquake, flood or wildfire before it happens.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Can Technology Predict the Next Disaster?", "num": 2, "total": 4, "text": "One clear example is the early warning system that many coastal cities have started to install. Sensors, which are placed along riverbanks and coastlines, constantly send data to a central system whose algorithm compares current conditions with thousands of past events. When the pattern matches a known danger, the system can send an alert to residents' phones minutes — or sometimes hours — before a flood or a tsunami arrives. In regions prone to wildfires, similar technology uses satellite images to detect the first signs of smoke, often long before anyone on the ground notices anything unusual.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Can Technology Predict the Next Disaster?", "num": 3, "total": 4, "text": "The benefits of this technology are not limited to prediction. After a disaster strikes, hospitals whose emergency departments would otherwise be overwhelmed can use data models to estimate how many patients they are likely to receive and what kind of injuries to expect, allowing them to prepare staff and supplies more effectively. Humanitarian organisations, which used to rely mainly on phone calls and paper reports, now use real-time data to decide where relief teams are needed most urgently.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Can Technology Predict the Next Disaster?", "num": 4, "total": 4, "text": "Of course, technology is not a perfect solution. Systems that depend on expensive sensors and reliable internet connections are often unavailable in the poorest and most vulnerable communities — the very places that frequently need them most. Experts agree that AI and data can dramatically reduce the damage a disaster causes, but only if the people who design these systems remember to make them available to everyone, not just to wealthy cities that can already afford them.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main purpose of the text?", "section": "While you read", "options": ["To explain why technology cannot help with natural disasters", "To describe how AI and data are changing disaster prediction and response", "To list every country that has an early warning system"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Sensors placed along riverbanks and coastlines send data to a central system whose ___ compares current conditions with past events.", "section": "While you read", "reveal": "algorithm", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "How can data models help hospitals after a disaster?", "section": "While you read", "options": ["By replacing doctors completely", "By estimating patient numbers and likely injuries so staff can prepare", "By predicting exactly which patients will survive"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "According to the text, early warning technology is equally available to every community in the world.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Early warning technology is often unavailable in the poorest and most vulnerable communities.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Humanitarian organisations now use ___ data to decide where relief teams are needed most urgently.", "section": "While you read", "reveal": "real-time", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you agree that AI can 'dramatically reduce the damage a disaster causes'? Why or why not?", "What is one problem with relying on technology for disaster prediction, according to the text?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "After the Flood: A Radio Interview", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what do you think the rescue involved, and what does Deniz think about technology and disasters?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "After the Flood: A Radio Interview", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What method did Deniz's team mainly use for the rescue?", "section": "While you listen", "options": ["Helicopters and drones", "Small boats and teamwork", "Government trucks"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "According to Deniz, the local disaster response ___ worked well.", "section": "While you listen", "reveal": "system", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Deniz thinks technology could never help prevent this kind of disaster.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz thinks technology and early warnings could help prevent future disasters.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In the word 'guest', the letter 'u' is:", "section": "While you listen", "options": ["pronounced /juː/", "silent", "pronounced /ʌ/"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Predicting the Unpredictable — A Project Brief", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What natural disaster and technology idea would you choose to research if you did this project?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Predicting the Unpredictable — A Project Brief", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What are students asked to research?", "section": "While you listen", "options": ["A famous scientist", "A real natural disaster and a technology solution", "The history of their school"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Students should find out about the disaster's environmental and ___ impact.", "section": "While you listen", "reveal": "human", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Students can only present individually.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students can present individually or in pairs.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Nature Under Threat: Discussing Disaster Impact", "text": "In pairs, discuss the environmental and human impact of a natural disaster you know about (from the news, Reading 1, or your own experience). Use at least three relative clauses (defining, non-defining or whose) to give extra information, and try to use topic vocabulary accurately.", "steps": [], "chips": [], "timer": 300, "levels": ["", "", ""], "note": "Model question", "qtype": "mcq", "q": "The scientists ___ study earthquakes work at the research centre.", "section": "Exit ticket", "options": ["which", "who", "whose"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The flood, ___ destroyed hundreds of homes, happened last spring.", "section": "Exit ticket", "reveal": "which", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "This is the app ___ predicts wildfires using AI.", "section": "Exit ticket", "options": ["who", "which", "whose"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The engineer ___ app won the innovation prize studied in Istanbul.", "section": "Exit ticket", "reveal": "whose", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence is correctly punctuated?", "section": "Exit ticket", "options": ["My uncle who works for a relief organisation is here.", "My uncle, who works for a relief organisation, is here.", "My uncle, who works for a relief organisation is here."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The report we read yesterday, was alarming.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fi (function () {
  "use strict";
  var el = document.getElementById("present-data");
  var P = JSON.parse(el.textContent);
  var DECKS = P.decks || [];
  var root = document.querySelector("[data-present]");
  var stage = root.querySelector(".pstage");
  var PRINT = location.hash === "#print";
  function $(s, r) { return (r || root).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || root).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function blanks(s) { return esc(s).replace(/_{3,}/g, '<span class="pblank"></span>'); }
  function safeMark(s) { return esc(s).replace(/&lt;mark&gt;/g, "<mark>").replace(/&lt;\/mark&gt;/g, "</mark>"); }
  var store = { get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var cur = { d: 0, s: 0, revealed: false, step: 0 };

  /* ---------- ekran çizimi ---------- */
  function screenHTML(sc, reveal) {
    var h = "";
    var sec = sc.section ? '<p class="psec">' + esc(sc.section) + "</p>" : "";
    switch (sc.type) {
      case "title":
        h = '<div class="p-title"><p class="pk">' + esc(sc.kicker || "") + '</p><h1>' + esc(sc.title) + "</h1>" +
          (sc.list ? '<div class="pchips">' + sc.list.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "") + "</div>";
        break;
      case "prompt":
        h = '<div class="p-block"><h2>' + esc(sc.title) + '</h2><p class="pbig">' + esc(sc.text) + "</p>" +
          (sc.chips && sc.chips.length ? '<div class="pchips alt">' + sc.chips.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "") + "</div>";
        break;
      case "list":
        h = '<div class="p-block"><h2>' + esc(sc.title) + "</h2>" + (sc.text ? '<p class="pmed">' + esc(sc.text) + "</p>" : "") +
          (sc.chips ? '<div class="pchips alt big">' + sc.list.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>"
            : '<ol class="plist">' + sc.list.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>") + "</div>";
        break;
      case "word":
        h = '<div class="p-word"><div class="pw">' + esc(sc.word) + '</div><div class="pwm">' + esc(sc.pos) + (sc.ipa ? " · " + esc(sc.ipa) : "") +
          ' <button type="button" class="psay" data-say="' + esc(sc.word) + '" aria-label="Dinle">🔊</button></div>' +
          '<div class="phide' + (reveal ? " on" : "") + '"><p class="ptr">' + esc(sc.tr) + '</p><p class="pex">' + esc(sc.example) + "</p></div></div>";
        break;
      case "notice":
        var n = reveal ? sc.items.length : cur.step;
        h = '<div class="p-block"><h2>' + esc(sc.title) + '</h2><ul class="pnotice">' + sc.items.map(function (x, i) {
          return '<li class="' + (i < n ? "on" : "") + '">' + safeMark(x) + "</li>"; }).join("") + "</ul>" +
          '<p class="pask' + (n >= sc.items.length ? " on" : "") + '">' + esc(sc.ask || "") + "</p></div>";
        break;
      case "rule":
        h = '<div class="p-block p-rule"><h2>' + esc(sc.title) + '</h2><p class="pbig">' + esc(sc.en) + '</p><p class="ptrl"><b>TR</b> ' + esc(sc.tr) + "</p>" +
          (sc.when_en ? '<p class="pmed"><b>When?</b> ' + esc(sc.when_en) + '</p><p class="ptrl"><b>TR</b> ' + esc(sc.when) + "</p>" : "") + "</div>";
        break;
      case "form":
        var f = sc.form, cols = [["Positive", "positive"], ["Negative", "negative"], ["Question", "question"], ["Short answers", "short"]].filter(function (c) { return f[c[1]] && f[c[1]].length; });
        h = '<div class="p-block"><h2>' + esc(sc.title) + '</h2><div class="pform">' + cols.map(function (c) {
          return "<div><h3>" + c[0] + "</h3>" + f[c[1]].map(function (x) { return "<p>" + esc(x) + "</p>"; }).join("") + "</div>"; }).join("") + "</div></div>";
        break;
      case "question":
        h = '<div class="p-q">' + sec + '<p class="pq">' + blanks(sc.q) + "</p>" + (sc.prompt ? '<p class="pmed">(' + esc(sc.prompt) + ")</p>" : "");
        if (sc.options) {
          h += '<div class="popts">' + sc.options.map(function (o, k) {
            var cls = reveal ? (k === sc.answer ? " right" : " dim") : "";
            return '<button type="button" class="popt' + cls + '" data-k="' + k + '"><b>' + "abcd"[k] + "</b>" + esc(o) + "</button>"; }).join("") + "</div>";
          if (sc.qtype === "judge" && sc.fix) h += '<p class="pans' + (reveal ? " on" : "") + '">✓ ' + esc(sc.fix) + "</p>";
        } else if (sc.qtype === "order") {
          h += '<div class="porder-line"></div><div class="porder-bank">' + shuffle(sc.words).map(function (w) { return '<button type="button" class="pchipw">' + esc(w) + "</button>"; }).join("") +
            '</div><p class="pend">' + esc(sc.end || "") + '</p><p class="pans' + (reveal ? " on" : "") + '">✓ ' + esc(sc.reveal) + "</p>";
        } else {
          h += '<p class="pans' + (reveal ? " on" : "") + '">✓ ' + esc(sc.reveal) + "</p>";
        }
