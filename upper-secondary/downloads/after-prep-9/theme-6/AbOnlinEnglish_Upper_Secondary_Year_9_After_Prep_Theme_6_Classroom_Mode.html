<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sınıf Modu · Theme 6 Life in the World &amp; Culture</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@400;600;700&display=swap"><style>/* Sınıf Modu — projeksiyon ve akıllı tahta için yüksek kontrast, büyük yazı */
.pres{--c:#2766D6;--ink:#131F3A;--muted:#5B6680;--line:#D9DEE8;--paper:#FFFFFF;--soft:#F2F4F8;
  position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--paper);color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pres *{box-sizing:border-box}
.pres button{font-family:inherit}
.pbar{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,2vw,24px);border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.pbrand{font:700 1rem/1 var(--sans,"Outfit");text-decoration:none;color:var(--ink);white-space:nowrap}
.pbrand .b1{color:#D9602A}.pbrand .b3{color:#23835A}
.pdecks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.pdeck{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.pdeck[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ptools{display:flex;gap:6px}
.ptool{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.ptool:hover{border-color:var(--c)}
.ptool kbd{font:600 .7rem/1 monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
@media (max-width:900px){.ptool kbd,.ptool .tl{display:none}}
.pstage{overflow:auto;display:grid;place-items:center;padding:clamp(16px,3vw,48px);border-top:6px solid var(--c)}
.pscreen{width:min(1200px,100%)}
.pk{font:700 clamp(.9rem,1.4vw,1.2rem)/1 var(--sans,"Outfit");letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.psec{font:700 clamp(.85rem,1.3vw,1.1rem)/1.2 "Outfit",sans-serif;color:var(--c);margin:0 0 1em;text-transform:none}
.p-title h1{font:700 clamp(2.6rem,7vw,6rem)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 .4em}
.p-block h2{font:700 clamp(1.8rem,4vw,3.4rem)/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 .5em;color:var(--ink)}
.pbig{font-size:clamp(1.4rem,3vw,2.6rem);line-height:1.35;margin:0 0 .6em}
.pmed{font-size:clamp(1.1rem,2.1vw,1.8rem);line-height:1.4;margin:0 0 .6em}
.ptrl{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--muted);margin:0 0 1em}
.ptrl b{font:700 .7em/1 monospace;background:var(--soft);padding:3px 6px;border-radius:4px;margin-right:6px}
.pchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:.8em}
.pchips span{font-size:clamp(1rem,1.8vw,1.5rem);padding:.35em .9em;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.pchips.alt span{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff);font-weight:600}
.pchips.big span{font-size:clamp(1.3rem,2.6vw,2.2rem)}
.plist{font-size:clamp(1.3rem,2.8vw,2.4rem);line-height:1.4;padding-left:1.2em;margin:0}
.plist li{margin-bottom:.4em}
.plist.small{font-size:clamp(1.1rem,2vw,1.7rem)}
.p-word{text-align:center}
.pw{font:700 clamp(3rem,10vw,8rem)/1 "Outfit",sans-serif;color:var(--c);letter-spacing:-.01em}
.pwm{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--muted);margin:.4em 0 1em;display:flex;gap:10px;justify-content:center;align-items:center}
.psay{border:0;background:var(--soft);border-radius:50%;width:56px;height:56px;font-size:1.5rem;cursor:pointer}
.phide{opacity:.08;filter:blur(8px);cursor:pointer;transition:all .25s}
.phide.on{opacity:1;filter:none}
.ptr{font:700 clamp(1.6rem,4vw,3.2rem)/1.2 "Outfit",sans-serif;margin:0 0 .4em}
.pex{font-size:clamp(1.2rem,2.5vw,2.1rem);font-style:italic;color:var(--ink);margin:0}
.pnotice{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:.5em}
.pnotice li{font-size:clamp(1.3rem,3vw,2.5rem);padding:.35em .6em;border-radius:12px;background:var(--soft);opacity:.08}
.pnotice li.on{opacity:1}
.pnotice mark{background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--ink);padding:0 .15em;border-radius:6px;font-weight:700}
.pask{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;opacity:0}
.pask.on{opacity:1}
.p-rule .pbig{font-weight:600}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pform div{background:var(--soft);border-radius:14px;padding:18px}
.pform h3{font:700 .95rem/1 "Outfit",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.pform p{font-size:clamp(1.1rem,2vw,1.7rem);margin:0 0 .3em}
.pq{font:600 clamp(1.6rem,4vw,3.4rem)/1.3 "Outfit",sans-serif;margin:0 0 .6em}
.pblank{display:inline-block;width:3.2em;border-bottom:4px solid var(--c);margin:0 .15em;vertical-align:-.1em}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.popt{display:flex;gap:14px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:.6em .9em;font-size:clamp(1.2rem,2.6vw,2.2rem);cursor:pointer;color:var(--ink)}
.popt b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);font-size:.7em;flex:none}
.popt.sel{border-color:var(--c)}
.popt.right{border-color:#23835A;background:#E1F3EA}
.popt.right b{background:#23835A;color:#fff}
.popt.dim{opacity:.4}
.pans{font:700 clamp(1.4rem,3.2vw,2.8rem)/1.3 "Outfit",sans-serif;color:#23835A;margin:.6em 0 0;opacity:0}
.pans.on{opacity:1}
.pans.big{font-size:clamp(1.6rem,3.8vw,3.2rem)}
.pcues{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pcues span{font:600 clamp(1.3rem,3vw,2.6rem)/1.2 "Outfit",sans-serif;padding:.3em .7em;border-radius:14px;border:3px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pcues i{font-style:normal;font-size:2rem;color:var(--muted)}
.porder-line{min-height:3.4em;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.porder-bank{display:flex;flex-wrap:wrap;gap:10px}
.pchipw{font:600 clamp(1.2rem,2.6vw,2.2rem)/1 "Outfit",sans-serif;padding:.4em .7em;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.porder-line .pchipw{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:var(--c)}
.pend{font-size:2rem;font-weight:700;margin:.2em 0}
.p-read .ptext{font-size:clamp(1.4rem,3vw,2.6rem);line-height:1.55;margin:0;max-width:40ch}
.pplay{font:700 1.4rem/1 "Outfit",sans-serif;padding:.6em 1.2em;border-radius:999px;border:0;background:var(--c);color:#fff;cursor:pointer;margin-bottom:1em}
.ptrans{font-size:clamp(1.1rem,2.2vw,1.8rem);opacity:0}
.ptrans.on{opacity:1}
.ptrans p{margin:0 0 .4em}
.plevels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:1em}
.plevels div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:clamp(1rem,1.6vw,1.3rem)}
.plevels b{display:block;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.muted{color:var(--muted)}

.pfoot{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,2vw,24px);border-top:1px solid var(--line);background:var(--paper)}
.pnav{min-width:64px;height:60px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:1.6rem;cursor:pointer;color:var(--ink)}
.pnav.pnext{background:var(--c);border-color:var(--c);color:#fff;min-width:120px;font-weight:700;font-size:1.1rem}
.pnav[disabled]{opacity:.35}
.preveal{height:60px;border-radius:16px;border:0;background:#23835A;color:#fff;font:700 1.1rem/1 "Outfit",sans-serif;padding:0 22px;cursor:pointer}
.pmid{flex:1;display:grid;gap:6px}
.pprog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.pprog span{display:block;height:100%;background:var(--c);width:0;transition:width .2s}
.pcount{font:600 .9rem/1 monospace;color:var(--muted)}

.pnotes{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;width:min(900px,94vw);background:#131F3A;color:#fff;border-radius:14px;padding:14px 18px;font-size:1rem;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30}
.pnotes b{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#F6A677;margin-bottom:4px}
.ptimer{position:fixed;right:18px;top:78px;z-index:30;background:#131F3A;color:#fff;border-radius:16px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ptimer .row1{display:flex;align-items:center;gap:10px}
.ptime{font:700 2.4rem/1 monospace;min-width:4ch;text-align:center}
.ptimer.ending .ptime{color:#F6A677}
.ptimer.done{background:#B8342D}
.ptimer button{border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;padding:6px 9px;cursor:pointer}
.ptimer .presets{display:flex;gap:4px}
.ppick{position:fixed;inset:0;z-index:40;background:rgba(19,31,58,.7);display:grid;place-items:center}
.ppick .card{background:#fff;border-radius:22px;padding:28px 34px;text-align:center;display:grid;gap:14px;min-width:min(420px,90vw)}
.pnum{font:700 clamp(5rem,16vw,11rem)/1 "Outfit",sans-serif;color:var(--c)}
.ppick label{font-size:.95rem;color:var(--muted)}
.ppick input{width:70px;font:600 1rem "Outfit";padding:6px;border:1.5px solid var(--line);border-radius:8px;margin-left:6px}
.ppick .row2{display:flex;gap:10px;justify-content:center}
.ppick .row2 button{border:0;border-radius:12px;padding:12px 18px;font:700 1rem "Outfit";cursor:pointer}
.pgo{background:var(--c);color:#fff}
.pused{font-size:.85rem;color:var(--muted)}
.pscore{position:fixed;left:18px;top:78px;z-index:30;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.pscore .team{display:flex;align-items:center;gap:8px}
.pscore .team b{min-width:70px}
.pscore .pts{font:700 2rem/1 monospace;min-width:2ch;text-align:center}
.pscore button{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-weight:700;cursor:pointer}
.pscore .psreset{width:auto;padding:0 10px;font-size:.8rem}
[hidden]{display:none!important}

/* baskı (slayt PDF) */
.pres.printing{position:static;display:block}
.pres.printing .pbar,.pres.printing .pfoot,.pres.printing .ptimer,.pres.printing .ppick,.pres.printing .pscore,.pres.printing .pnotes{display:none!important}
.pres.printing .pstage{display:block;padding:0;border:0;overflow:visible}
.pslide{break-after:page;width:297mm;height:209mm;box-sizing:border-box;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;border-top:5mm solid var(--c);padding:6mm 10mm 4mm}
.pslide-top{display:flex;justify-content:space-between;font-size:10pt;color:#5B6680}
.pslide-body{display:grid;align-content:center;zoom:.8;padding:0 6mm}
.pslide-note{font-size:9pt;color:#34405A;background:#F2F4F8;border-radius:6px;padding:6px 10px}
.pres.printing .phide,.pres.printing .pnotice li,.pres.printing .pask,.pres.printing .ptrans,.pres.printing .pans{opacity:1;filter:none}
@page{size:A4 landscape;margin:0}

chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "subtitles", "pos": "n. (plural)", "ipa": "", "tr": "alt yazı", "example": "Many viewers now prefer subtitles over dubbing to hear the original voices.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "tournament", "pos": "n.", "ipa": "", "tr": "turnuva", "example": "The international football tournament brought together fans from six continents.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "fan base", "pos": "n. phrase", "ipa": "", "tr": "hayran kitlesi", "example": "The band built a huge international fan base through social media.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "cultural exchange", "pos": "n. phrase", "ipa": "", "tr": "kültürel değişim", "example": "The school's cultural exchange programme sends students abroad every summer.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "authenticity", "pos": "n.", "ipa": "", "tr": "özgünlük", "example": "Food critics often debate the authenticity of fusion dishes.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin e ce", "title": "Notice", "items": ["This dish <mark>must<\/mark> be a local speciality — everyone in the market is buying it.", "The festival <mark>might<\/mark> attract thousands of visitors this year, but nothing is certain yet.", "She <mark>can't<\/mark> be a professional chef — she just burnt the rice!", "The film <mark>could<\/mark> become a global hit if it does well at international festivals."], "ask": "Which modal shows the speaker is almost certain something is true? Which shows the speaker is almost certain something is NOT true? Which two show the speaker is only guessing?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["can't", "must", "might / could / may"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "For a strong positive conclusion based on evidence, we use ___ + base verb.", "section": "Complete the rule", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For a strong negative conclusion (we are almost sure something is impossible), we use ___ + base verb.", "section": "Complete the rule", "reveal": "can't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For a guess when we are not sure, we use ___ + base verb.", "section": "Complete the rule", "reveal": "might / could / may", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use 'must' (positive) and 'can't' (negative) for a strong logical conclusion based on evidence. We use 'might', 'may' or 'could' for a guess when we are not sure. These modals are followed by the base form of the verb.", "tr": "Bir kanıta dayanarak güçlü bir sonuca varırken 'must' (olumlu) ve 'can't' (olumsuz) kullanılır. Emin olmadığımız bir tahmin yaparken 'might', 'may' ya da 'could' kullanılır. Bu modallerden sonra fiilin yalın hâli gelir.", "when_en": "We use these modals when drawing a conclusion from evidence, or when speculating without being sure — for example, guessing where a dish comes from or why a film became popular.", "when": "Bir olayla ilgili elimizdeki kanıtlara dayanarak sonuç çıkarırken ya da emin olmadan tahminde bulunurken bu yapıları kullanırız — örneğin bir yemeğin nereden geldiğini ya da bir filmin neden popüler olduğunu tahmin ederken.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the queue is so long", "must", "be a popular street food stall"], "reveal": "The queue is so long — it must be a popular street food stall.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "speak", "five languages", "must"], "reveal": "She must speak five languages — she works as an international tour guide.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this actor", "not / famous", "can't"], "reveal": "This actor can't be famous — nobody in the audience recognised him.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the band", "might", "release a new album this year"], "reveal": "The band might release a new album this year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["that restaurant", "could", "be expensive"], "reveal": "That restaurant could be expensive — it's in the city centre.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / the tournament", "must", "be difficult to organise"], "reveal": "The tournament must be difficult to organise, mustn't it?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences of your own using must, can't, might/could to make deductions or guesses about a food, film, sport or musical event you know about.", "chips": ["It must…", "It can't…", "It might…", "It could…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["This must be a traditional recipe.", "The concert might sell out quickly."], "negative": ["That can't be true — the restaurant only opened yesterday.", "It might not be ready by the festival."], "question": ["Could this dish be vegetarian?"], "short": ["It must be. / It can't be.", "It might. / It might not."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She must to be a fan of that band.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She must be a fan of that band.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "It mustn't be true.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "It can't be true.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Look at the huge queue outside — that food truck ___ be really popular.", "section": "A · Choose the correct option.", "options": ["must", "can't", "mightn't"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She's only twelve — she ___ be the director of the film festival.", "section": "A · Choose the correct option.", "options": ["must", "can't", "might"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The band ___ perform a surprise song tonight — nobody is sure.", "section": "A · Choose the correct option.", "options": ["must", "can't", "might"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This dish is very spicy — it ___ contain chilli.", "section": "A · Choose the correct option.", "options": ["must", "mustn't", "might not"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "He speaks perfect Korean, so he ___ have lived in Korea for a while.", "section": "B · Complete with must, can't or might.", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "That restaurant only opened last week, so the recipe ___ be a hundred years old.", "section": "B · Complete with must, can't or might.", "reveal": "can't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I'm not sure who wrote the soundtrack — it ___ be the same composer as the last film.", "section": "B · Complete with must, can't or might.", "reveal": "might / could", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She mustn't be the singer — her voice sounds completely different.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She can't be the singer — her voice sounds completely different.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "This street food stall must be famous — it's in every travel guide.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: The tickets sold out in ten minutes — the concert ___ be really popular.", "section": "Dialogue · Complete with must, can't or might.", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: True, but the reviews are mixed, so it ___ actually be that good live.", "section": "Dialogue · Complete with must, can't or might.", "reveal": "might not / may not", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "chef / must / that / a / be / professional", "section": "Dialogue · Reorder the sentence.", "words": ["that", "must", "be", "a", "professional", "chef"], "end": ".", "reveal": "That must be a professional chef.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Modals of Obligation and Necessity: must, have to, need, had to", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Visitors <mark>must<\/mark> remove their shoes before entering the temple.", "You <mark>have to<\/mark> book a table in advance — the restaurant is always full.", "We <mark>need to<\/mark> try the local street food while we're here — everyone recommends it.", "Last year, festival organisers <mark>had to<\/mark> cancel the concert because of bad weather."], "ask": "Which modal expresses the speaker's own personal rule, and which expresses an outside rule or fact? What form do we use for a past obligation?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["an outside rule", "had to", "the speaker's own feeling", "need to"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Must' often expresses ___ of obligation (a personal decision).", "section": "Complete the rule", "reveal": "the speaker's own feeling", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Have to' usually expresses ___ (a law, rule, or fact outside the speaker).", "section": "Complete the rule", "reveal": "an outside rule", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'___' is another common way to express necessity, similar to 'have to'.", "section": "Complete the rule", "reveal": "need to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For a past obligation, we use '___' (there is no past form of 'must' for obligation).", "section": "Complete the rule", "reveal": "had to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Must' often expresses the speaker's own feeling of obligation, while 'have to' expresses an obligation from outside (a rule, law or fact). 'Need to' is close in meaning to 'have to'. For the past, we use 'had to' — there is no past form of 'must' for obligation.", "tr": "'Must', konuşmacının kendi hissettiği bir zorunluluğu; 'have to' ise dışarıdan (kural, kanun, gerçek) gelen bir zorunluluğu anlatır. 'Need to' anlam olarak 'have to'ya yakındır. Geçmiş zamanda hem 'must' hem 'have to' yerine 'had to' kullanılır.", "when_en": "We use these modals to talk about rules, requirements and obligations — for example, rules you must follow when visiting a country, or things you need to do to prepare for an event.", "when": "Bir kurala, gereksinime ya da yükümlülüğe atıfta bulunurken — örneğin bir ülkeyi ziyaret ederken uyulması gereken kurallar ya da bir etkinlik için yapılması gerekenler hakkında konuşurken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["visitors", "must", "buy a ticket before the tour"], "reveal": "Visitors must buy a ticket before the tour.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["students", "have to", "wear formal clothes for the ceremony (school rule)"], "reveal": "Students have to wear formal clothes for the ceremony.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "need to", "practise our presentation about Mexican cuisine"], "reveal": "We need to practise our presentation about Mexican cuisine.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["last month / the festival", "had to", "move indoors because of the rain"], "reveal": "Last month, the festival had to move indoors because of the rain.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "must", "remember to try the local delicacy (personal decision)"], "reveal": "I must remember to try the local delicacy.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "have to", "book tickets online for the tournament"], "reveal": "Do you have to book tickets online for the tournament?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about obligations connected to travelling to a new country: one with must, one with have to, and one about a past obligation with had to.", "chips": ["Before you travel, you must…", "In most countries, you have to…", "Last time, I had to…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You must try the local street food.", "We have to arrive early for the ceremony."], "negative": ["You don't have to bring a gift, but it's polite.", "We didn't have to queue for long."], "question": ["Do we have to wear traditional clothes?", "Did you have to get a visa?"], "short": ["Yes, you do. / No, you don't.", "Yes, I did. / No, I didn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Yesterday we must book a table.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Yesterday we had to book a table.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She has to to attend the festival.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She has to attend the festival.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "In many temples, visitors ___ cover their shoulders — it's a strict rule.", "section": "A · Choose the correct option.", "options": ["must", "might", "should"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Last year, the organisers ___ postpone the tournament because of the storm.", "section": "A · Choose the correct option.", "options": ["must", "had to", "have to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ book seats online — the cinema doesn't sell tickets at the door anymore.", "section": "A · Choose the correct option.", "options": ["have to", "must (personal feeling)", "need (without to)"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I really ___ (must) remember to send them the recipe before I forget.", "section": "B · Complete with the correct form.", "reveal": "must", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ you ___ (have to) show your passport at the border?", "section": "B · Complete with the correct form.", "reveal": "do / have to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "  Obligation, Prohibition and Permission", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You <mark>don't have to<\/mark> tip in this country — it isn't expected.", "Visitors <mark>mustn't<\/mark> touch the artefacts in the museum.", "You <mark>can't<\/mark> bring outside food into the stadium during the tournament.", "Guests <mark>are allowed to<\/mark> take photos, but flash photography isn't permitted."], "ask": "Which phrase means 'it isn't necessary'? Which two mean 'it is forbidden'? Which one means 'it is permitted'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["not necessary", "forbidden", "permission"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Don't have to' / 'don't need to' mean something is ___.", "section": "Complete the rule", "reveal": "not necessary", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Mustn't' and 'can't' mean something is ___.", "section": "Complete the rule", "reveal": "forbidden", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Can' / 'be allowed to' give ___ to do something.", "section": "Complete the rule", "reveal": "permission", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Don't have to' / 'don't need to' show that something is NOT necessary (it's optional). 'Mustn't' and 'can't' show that something is forbidden. 'Can' and 'be allowed to' show that something is permitted.", "tr": "'Don't have to / don't need to' bir şeyin zorunlu OLMADIĞINI belirtir. 'Mustn't' ve 'can't' bir şeyin yasak olduğunu belirtir. 'Can' ve 'be allowed to' ise izin verildiğini anlatır.", "when_en": "We use these forms to explain the rules of a place or event — what isn't necessary, what is forbidden, and what is permitted.", "when": "Bir yerin ya da etkinliğin kurallarını açıklarken — nelerin zorunlu olmadığını, nelerin yasak olduğunu ve nelere izin verildiğini anlatırken bu yapıları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["visitors", "mustn't", "feed the animals at the sanctuary"], "reveal": "Visitors mustn't feed the animals at the sanctuary.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "don't have to", "dress formally for this festival"], "reveal": "You don't have to dress formally for this festival.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["fans", "aren't allowed to", "bring glass bottles into the stadium"], "reveal": "Fans aren't allowed to bring glass bottles into the stadium.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["students", "are allowed to", "choose their own country to research"], "reveal": "Students are allowed to choose their own country to research.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "can't", "take photos backstage without permission"], "reveal": "You can't take photos backstage without permission.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / we", "have to", "buy tickets in advance for the film festival"], "reveal": "Do we have to buy tickets in advance for the film festival?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three rules for visitors to an event or place you know well: one with don't have to, one with mustn't, and one with are allowed to.", "chips": ["You don't have to…", "You mustn't…", "You are allowed to…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You are allowed to bring your own snacks.", "You can take photos here."], "negative": ["You don't have to buy a ticket in advance.", "You mustn't touch the exhibits."], "question": ["Are we allowed to film the performance?"], "short": ["Yes, you are. / No, you aren't.", "Yes, you can. / No, you can't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You mustn't buy a ticket in advance — it's optional.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You don't have to buy a ticket in advance — it's optional.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Visitors don't have to touch the paintings.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Visitors mustn't touch the paintings.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You ___ wear a suit to the beach festival — casual clothes are fine.", "section": "A · Choose the correct option.", "options": ["mustn't", "don't have to", "can't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Fans ___ bring fireworks into the stadium — it's strictly forbidden.", "section": "A · Choose the correct option.", "options": ["don't have to", "mustn't", "are allowed to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Students ___ choose any country they like for the cultural portfolio project.", "section": "A · Choose the correct option.", "options": ["are allowed to", "mustn't", "don't need"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You ___ bring your passport for a local festival, but you do need it for the international one.", "section": "B · Complete with don't have to, mustn't or can.", "reveal": "don't have to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Visitors ___ touch the ancient instruments in the museum.", "section": "B · Complete with don't have to, mustn't or can.", "reveal": "mustn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You ___ film the concert on your phone — it's allowed as long as you don't use flash.", "section": "B · Complete with don't have to, mustn't or can.", "reveal": "can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "You mustn't bring your own snacks — it's completely optional.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You don't have to bring your own snacks — it's completely optional.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Fans aren't allowed to bring glass bottles into the stadium.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "At this festival, you ___ buy a ticket weeks in advance, but you ___ bring outside food, and children under six ___ enter free.", "section": "Text · Complete with don't have to, mustn't, can or are allowed to.", "reveal": "don't have to / mustn't / are allowed to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Modals of Advice (should, ought to, had better, could) + Be able to", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You <mark>should<\/mark> try the local specialities when you travel — they're part of the culture.", "We <mark>had better<\/mark> book our tournament tickets today, or they'll sell out.", "You <mark>ought to<\/mark> learn a few phrases of the language before your trip.", "After years of practice, she <mark>is able to<\/mark> cook dishes from over twenty countries."], "ask": "Which modals give friendly advice? Which one gives a warning about something urgent? Which structure talks about ability, not advice?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a strong warning", "friendly advice", "ability, not advice"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Should' and 'ought to' give ___ or a recommendation.", "section": "Complete the rule", "reveal": "friendly advice", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Had better' gives ___ — there could be a bad result if the advice isn't followed.", "section": "Complete the rule", "reveal": "a strong warning", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Be able to' expresses ___.", "section": "Complete the rule", "reveal": "ability, not advice", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Should' and 'ought to' give friendly advice or a recommendation (they are close in meaning, but 'should' is more common in speech). 'Had better' gives a stronger, more urgent warning, implying a bad result if not followed. 'Be able to' expresses ability (it can be used in the present, future and past), not advice.", "tr": "'Should' ve 'ought to' nazik tavsiye vermek için kullanılır (anlamları neredeyse aynıdır, ama 'should' konuşma dilinde daha yaygındır). 'Had better' kötü bir sonuç olabileceğini ima eden daha güçlü/acil bir uyarı verir. 'Be able to', yetenek anlatır (present, future ve past zamanlarda çekimlenebilir), tavsiye değildir.", "when_en": "We use 'should/ought to' to give advice, 'had better' for an urgent warning, and 'be able to' to describe ability — for example, when recommending something to a visitor, or talking about someone's skills.", "when": "Birine tavsiye verirken 'should/ought to', acil bir uyarı yaparken 'had better', bir yeteneği anlatırken 'be able to' kullanırız — örneğin bir festivale gidecek birine öneride bulunurken ya da birinin dil/beceri yeteneğinden bahsederken.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["you", "should", "try the street food market on Friday nights"], "reveal": "You should try the street food market on Friday nights.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "had better", "leave now or we'll miss the opening ceremony"], "reveal": "We had better leave now, or we'll miss the opening ceremony.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["tourists", "ought to", "respect local dining customs"], "reveal": "Tourists ought to respect local dining customs.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["by next year / he", "be able to", "speak three languages"], "reveal": "By next year, he will be able to speak three languages.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "not / be able to", "attend the festival last year (illness)"], "reveal": "She wasn't able to attend the festival last year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "should", "book tickets for the film early"], "reveal": "Should you book tickets for the film early?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three pieces of advice for someone visiting a cultural festival for the first time, using should, ought to and had better.", "chips": ["You should…", "You ought to…", "You'd better…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You should try the local delicacy.", "She is able to cook dishes from many countries."], "negative": ["You shouldn't miss the opening ceremony.", "He wasn't able to get tickets last year."], "question": ["Should we book in advance?", "Will you be able to join us at the festival?"], "short": ["Yes, you should. / No, you shouldn't.", "Yes, I will. / No, I won't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You should to try the local food.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should try the local food.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She can be able to speak four languages.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is able to speak four languages. / She can speak four languages.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You ___ try the street food here — it's famous all over the country.", "section": "A · Choose the correct option.", "options": ["should", "had better not", "wasn't able to"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ hurry, or we'll miss the beginning of the concert!", "section": "A · Choose the correct option.", "options": ["should", "had better", "are able to"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "After moving abroad, she ___ speak three languages fluently.", "section": "A · Choose the correct option.", "options": ["should", "had better", "is able to"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You really ___ book your tournament tickets today — they usually sell out fast.", "section": "B · Complete with should, had better or (be) able to.", "reveal": "had better / should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Last year he wasn't ___ get a visa in time, so he missed the festival.", "section": "B · Complete with should, had better or (be) able to.", "reveal": "able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "By the end of the exchange programme, you ___ (will) understand a lot more about the local culture.", "section": "B · Complete with should, had better or (be) able to.", "reveal": "will be able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "You should to visit the museum before it closes.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should visit the museum before it closes.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We'd better leave now, or we'll miss the opening ceremony.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: You ___ try to get tickets online — they always sell out at the door.", "section": "Dialogue · Complete with should, had better or be able to.", "reveal": "should / had better", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Good idea. I hope I'll ___ find good seats.", "section": "Dialogue · Complete with should, had better or be able to.", "reveal": "be able to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The World on One Plate", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think the text will compare?", "Name one dish you have tried that mixes ingredients or styles from two different countries."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The World on One Plate", "num": 1, "total": 4, "text": "Walk through a night market in Bangkok, a food hall in Istanbul, or a food truck festival in Los Angeles, and you will notice something similar: dishes from completely different culinary traditions sitting side by side. A steaming bowl of Vietnamese pho might be served next to Mexican tacos, while a stall selling Turkish gözleme stands opposite one offering Korean fried chicken. This mixing of cuisines is not an accident — it is one of the clearest signs of globalisation in everyday life.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The World on One Plate", "num": 2, "total": 4, "text": "For centuries, food travelled slowly, carried by traders, sailors and migrants along routes such as the Silk Road. Spices, rice and tea moved from one culture to another over months or years. Today, the same process happens almost instantly. A new fusion restaurant in Seoul can go viral on social media, and within days, food lovers in São Paulo or Cairo are trying to recreate the recipe at home. Globalisation hasn't only sped up the exchange of food; it has completely reshaped what \"authentic\" cuisine even means.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The World on One Plate", "num": 3, "total": 4, "text": "Not everyone welcomes this change. Some chefs and food historians worry that fusion cuisine and global franchises could slowly replace local culinary heritage, especially among younger generations who grow up eating international fast food rather than traditional family recipes. Others argue the opposite: that global attention actually helps preserve dying culinary traditions, because chefs who blend old recipes with new ideas often bring worldwide interest — and funding — back to the original dish.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The World on One Plate", "num": 4, "total": 4, "text": "Whatever the outcome, one thing seems certain. As long as people keep travelling, migrating and sharing photos of their meals online, the world's cuisines will keep influencing each other — and our plates will continue to tell the story of a more connected planet.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Fusion food is always better than traditional food.", "Globalisation is changing how cuisines mix and how we understand \"authentic\" food.", "Food never changes from one generation to the next."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In the past, food travelled slowly along routes such as the ___.", "section": "While you read", "reveal": "Silk Road", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, some chefs and food historians worry that:", "section": "While you read", "options": ["fusion cuisine and global franchises could replace local culinary heritage", "traditional recipes are becoming too expensive", "food no longer travels between countries"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Everyone in the text agrees that globalisation is bad for traditional food.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says opinions are divided — some worry, but others think global attention helps preserve traditions.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A new fusion restaurant can go viral on social media, and within days, people elsewhere try to ___ the recipe at home.", "section": "While you read", "reveal": "recreate", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you think globalisation is generally good or bad for local food traditions? Give a reason.", "Write one sentence describing a fusion dish you would like to try."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "When Screens and Stadiums Cross Borders", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What sport, film or type of music from another country do you enjoy?", "Do you think it's easier to access international entertainment now than it was for your parents' generation?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "When Screens and Stadiums Cross Borders", "num": 1, "total": 4, "text": "Twenty years ago, a teenager in a small town might have grown up watching only local television and listening to music sung in their own language. Today, that same teenager can stream a Korean drama with subtitles, follow a Spanish football league on their phone, and add a Nigerian afrobeats song to their playlist — all before breakfast. Entertainment, like food, has become genuinely global.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "When Screens and Stadiums Cross Borders", "num": 2, "total": 4, "text": "Sport offers one of the clearest examples. International tournaments such as the World Cup or the Olympics attract fan bases that stretch across every continent, uniting people who may never have met and who support their teams for reasons connected to family, history or simple love of the game. A goal scored in one stadium can be celebrated by millions of people thousands of kilometres away within seconds, thanks to live streaming and social media.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "When Screens and Stadiums Cross Borders", "num": 3, "total": 4, "text": "Film and music tell a similar story. A blockbuster produced in one country can top the box office worldwide, and a song released with no marketing budget can become a global phenomenon purely because listeners share it online. Streaming platforms now recommend content from dozens of countries, meaning audiences are exposed to storytelling styles, humour and music that would have been almost impossible to access a generation ago.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "When Screens and Stadiums Cross Borders", "num": 4, "total": 4, "text": "Of course, this cultural exchange raises questions too. Does easy access to international blockbusters threaten smaller national film industries? Could the popularity of a handful of global superstars crowd out local musicians? For now, most researchers agree that globalisation in entertainment tends to add variety rather than erase it — but they also agree that supporting local artists remains important if that variety is going to survive.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the writer's main point about entertainment today?", "section": "While you read", "options": ["Local entertainment no longer exists anywhere.", "People now have easy access to sport, film and music from all over the world.", "Streaming platforms only show content from one country."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "International tournaments such as the World Cup attract ___ that stretch across every continent.", "section": "While you read", "reveal": "fan bases", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "According to the text, most researchers think globalisation always destroys local culture.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Most researchers think globalisation tends to add variety, but supporting local artists is still important.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What question does the text raise about globalisation in entertainment?", "section": "While you read", "options": ["Whether it could threaten smaller national film industries", "Whether stadiums should be built bigger", "Whether subtitles should be removed from films"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A song released with no marketing budget can become a global ___ purely because listeners share it online.", "section": "While you read", "reveal": "phenomenon", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you agree that supporting local artists is important, even when global stars are easy to access? Why or why not?", "Describe one international film, song or sports event that became popular in Türkiye."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning an International Potluck", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["Predict: what kind of rules or problems might come up when organising a food event with students from different countries?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning an International Potluck", "audio": null, "transcript": [], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What must every dish at the potluck have?", "section": "While you listen", "options": ["A price tag", "A label with the main ingredients", "A photo of the cook"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Students are allowed to bring alcoholic drinks to the potluck.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Students mustn't bring alcoholic drinks — only non-alcoholic ones are allowed.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Milo, the exchange student, is bringing a ___ recipe from Finland.", "secti (function () {
  "use strict";
  var el = document.getElementById("present-data");
  var P = JSON.parse(el.textContent);

  function $(s, r) { return (r || root).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || root).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

          (sc.list ? '<div class="pchips">' + sc.list.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "") + "</div>";
        break;
      case "prompt":
        h = '<div class="p-block"><h2>' + esc(sc.title) + '</h2><p class="pbig">' + esc(sc.text) + "</p>" +
          (sc.chips && sc.chips.length ? '<div class="pchips alt">' + sc.chips.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "") + "</div>";
        break;
      case "list":
        h = '<div class="p-block"><h2>' + esc(sc.title) + "</h2>" + (sc.text ? '<p class="pmed">' + esc(sc.text) + "</p>" : "") +
          (sc.chips ? '<div class="pchips alt big">' + sc.list.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>"
            : '<ol class="plist">' + sc.list.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>") + "</div>";
        break;
      case "word":
        h = '<div class="p-word"><div class="pw">' + esc(sc.word) + '</div><div class="pwm">' + esc(sc.pos) + (sc.ipa ? " · " + esc(sc.ipa) : "") +
          ' <button type="button" class="psay" data-say="' + esc(sc.word) + '" aria-label="Dinle">🔊</button></div>' +
          '<div class="phide' + (reveal ? " on" : "") + '"><p class="ptr">' + esc(sc.tr) + '</p><p class="pex">' + esc(sc.example) + "</p></div></div>";
        break;
      case "notice":
        var n = reveal ? sc.items.length : cur.step;
        h = '<div class="p-block"><h2>' + esc(sc.title) + '</h2><ul class="pnotice">' + sc.items.map(function (x, i) {
          return '<li class="' + (i < n ? "on" : "") + '">' + safeMark(x) + "</li>"; }).join("") + "</ul>" +
          '<p class="pask' + (n >= sc.items.length ? " on" : "") + '">' + esc(sc.ask || "") + "</p></div>";
        break;
      case "rule":
        h = '<div class="p-block p-rule"><h2>' + esc(sc.title) + '</h2><p class="pbig">' + esc(sc.en) + '</p><p class="ptrl"><b>TR</b> ' + esc(sc.tr) + "</p>" +
          (sc.when_en ? '<p class="pmed"><b>When?</b> ' + esc(sc.when_en) + '</p><p class="ptrl"><b>TR</b> ' + esc(sc.when) + "</p>" : "") + "</div>";
        break;
      case "form":
        var f = sc.form, cols = [["Positive", "positive"], ["Negative", "negative"], ["Question", "question"], ["Short answers", "short"]].filter(function (c) { return f[c[1]] && f[c[1]].length; });
        h = '<div class="p-block"><h2>' + esc(sc.title) + '</h2><div class="pform">' + cols.map(function (c) {
          return "<div><h3>" + c[0] + "</h3>" + f[c[1]].map(function (x) { return "<p>" + esc(x) + "</p>"; }).join("") + "</div>"; }).join("") + "</div></div>";
        break;
      case "question":
        h = '<div class="p-q">' + sec + '<p class="pq">' + blanks(sc.q) + "</p>" + (sc.prompt ? '<p class="pmed">(' + esc(sc.prompt) + ")</p>" : "");
        if (sc.options) {

            return '<button type="button" class="popt' + cls + '" data-k="' + k + '"><b>' + "abcd"[k] + "</b>" + esc(o) + "</button>"; }).join("") + "</div>";
          if (sc.qtype === "judge" && sc.fix) h += '<p class="pans' + (reveal ? " on" : "") + '">✓ ' + esc(sc.fix) + "</p>";
        } else if (sc.qtype === "order") {
          h += '<div class="porder-line"></div><div class="porder-bank">' + shuffle(sc.words).map(function (w) { return '<button type="button" class="pchipw">' + esc(w) + "</button>"; }).join("") +
            '</div><p class="pend">' + esc(sc.end || "") + '</p><p class="pans' + (reveal ? " on" : "") + '">✓ ' + esc(sc.reveal) + "</p>";
        } else {
          h += '<p class="pans' + (reveal ? " on" : "") + '">✓ ' + esc(sc.reveal) + "</p>";
        }
        h += "</div>";
