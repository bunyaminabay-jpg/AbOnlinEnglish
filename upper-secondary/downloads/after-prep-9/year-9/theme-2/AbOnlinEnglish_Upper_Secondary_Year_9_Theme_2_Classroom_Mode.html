<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sınıf Modu · Theme 2 Classroom Life</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@400;600;700&display=swap"><style>/* Sınıf Modu — projeksiyon ve akıllı tahta için yüksek kontrast, büyük yazı */
.pres{--c:#2766D6;--ink:#131F3A;--muted:#5B6680;--line:#D9DEE8;--paper:#FFFFFF;--soft:#F2F4F8;
  position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--paper);color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pres *{box-sizing:border-box}
.pres button{font-family:inherit}
.pbar{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,2vw,24px);border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.pbrand{font:700 1rem/1 var(--sans,"Outfit");text-decoration:none;color:var(--ink);white-space:nowrap}
.pbrand .b1{color:#D9602A}.pbrand .b3{color:#23835A}
.pdecks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.pdeck{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.pdeck[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ptools{display:flex;gap:6px}
.ptool{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.ptool:hover{border-color:var(--c)}
.ptool kbd{font:600 .7rem/1 monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
@media (max-width:900px){.ptool kbd,.ptool .tl{display:none}}
.pstage{overflow:auto;display:grid;place-items:center;padding:clamp(16px,3vw,48px);border-top:6px solid var(--c)}
.pscreen{width:min(1200px,100%)}
.pk{font:700 clamp(.9rem,1.4vw,1.2rem)/1 var(--sans,"Outfit");letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.psec{font:700 clamp(.85rem,1.3vw,1.1rem)/1.2 "Outfit",sans-serif;color:var(--c);margin:0 0 1em;text-transform:none}
.p-title h1{font:700 clamp(2.6rem,7vw,6rem)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 .4em}
.p-block h2{font:700 clamp(1.8rem,4vw,3.4rem)/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 .5em;color:var(--ink)}
.pbig{font-size:clamp(1.4rem,3vw,2.6rem);line-height:1.35;margin:0 0 .6em}
.pmed{font-size:clamp(1.1rem,2.1vw,1.8rem);line-height:1.4;margin:0 0 .6em}
.ptrl{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--muted);margin:0 0 1em}
.ptrl b{font:700 .7em/1 monospace;background:var(--soft);padding:3px 6px;border-radius:4px;margin-right:6px}
.pchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:.8em}
.pchips span{font-size:clamp(1rem,1.8vw,1.5rem);padding:.35em .9em;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.pchips.alt span{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff);font-weight:600}
.pchips.big span{font-size:clamp(1.3rem,2.6vw,2.2rem)}
.plist{font-size:clamp(1.3rem,2.8vw,2.4rem);line-height:1.4;padding-left:1.2em;margin:0}
.plist li{margin-bottom:.4em}
.plist.small{font-size:clamp(1.1rem,2vw,1.7rem)}
.p-word{text-align:center}
.pw{font:700 clamp(3rem,10vw,8rem)/1 "Outfit",sans-serif;color:var(--c);letter-spacing:-.01em}
.pwm{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--muted);margin:.4em 0 1em;display:flex;gap:10px;justify-content:center;align-items:center}
.psay{border:0;background:var(--soft);border-radius:50%;width:56px;height:56px;font-size:1.5rem;cursor:pointer}
.phide{opacity:.08;filter:blur(8px);cursor:pointer;transition:all .25s}
.phide.on{opacity:1;filter:none}
.ptr{font:700 clamp(1.6rem,4vw,3.2rem)/1.2 "Outfit",sans-serif;margin:0 0 .4em}
.pex{font-size:clamp(1.2rem,2.5vw,2.1rem);font-style:italic;color:var(--ink);margin:0}
.pnotice{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:.5em}
.pnotice li{font-size:clamp(1.3rem,3vw,2.5rem);padding:.35em .6em;border-radius:12px;background:var(--soft);opacity:.08}
.pnotice li.on{opacity:1}
.pnotice mark{background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--ink);padding:0 .15em;border-radius:6px;font-weight:700}
.pask{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;opacity:0}
.pask.on{opacity:1}
.p-rule .pbig{font-weight:600}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pform div{background:var(--soft);border-radius:14px;padding:18px}
.pform h3{font:700 .95rem/1 "Outfit",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.pform p{font-size:clamp(1.1rem,2vw,1.7rem);margin:0 0 .3em}
.pq{font:600 clamp(1.6rem,4vw,3.4rem)/1.3 "Outfit",sans-serif;margin:0 0 .6em}
.pblank{display:inline-block;width:3.2em;border-bottom:4px solid var(--c);margin:0 .15em;vertical-align:-.1em}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.popt{display:flex;gap:14px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:.6em .9em;font-size:clamp(1.2rem,2.6vw,2.2rem);cursor:pointer;color:var(--ink)}
.popt b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);font-size:.7em;flex:none}
.popt.sel{border-color:var(--c)}
.popt.right{border-color:#23835A;background:#E1F3EA}
.popt.right b{background:#23835A;color:#fff}
.popt.dim{opacity:.4}
.pans{font:700 clamp(1.4rem,3.2vw,2.8rem)/1.3 "Outfit",sans-serif;color:#23835A;margin:.6em 0 0;opacity:0}
.pans.on{opacity:1}
.pans.big{font-size:clamp(1.6rem,3.8vw,3.2rem)}
.pcues{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pcues span{font:600 clamp(1.3rem,3vw,2.6rem)/1.2 "Outfit",sans-serif;padding:.3em .7em;border-radius:14px;border:3px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pcues i{font-style:normal;font-size:2rem;color:var(--muted)}
.porder-line{min-height:3.4em;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.porder-bank{display:flex;flex-wrap:wrap;gap:10px}
.pchipw{font:600 clamp(1.2rem,2.6vw,2.2rem)/1 "Outfit",sans-serif;padding:.4em .7em;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.porder-line .pchipw{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:var(--c)}
.pend{font-size:2rem;font-weight:700;margin:.2em 0}
.p-read .ptext{font-size:clamp(1.4rem,3vw,2.6rem);line-height:1.55;margin:0;max-width:40ch}
.pplay{font:700 1.4rem/1 "Outfit",sans-serif;padding:.6em 1.2em;border-radius:999px;border:0;background:var(--c);color:#fff;cursor:pointer;margin-bottom:1em}
.ptrans{font-size:clamp(1.1rem,2.2vw,1.8rem);opacity:0}
.ptrans.on{opacity:1}
.ptrans p{margin:0 0 .4em}
.plevels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:1em}
.plevels div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:clamp(1rem,1.6vw,1.3rem)}
.plevels b{display:block;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.muted{color:var(--muted)}

.pfoot{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,2vw,24px);border-top:1px solid var(--line);background:var(--paper)}
.pnav{min-width:64px;height:60px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:1.6rem;cursor:pointer;color:var(--ink)}
.pnav.pnext{background:var(--c);border-color:var(--c);color:#fff;min-width:120px;font-weight:700;font-size:1.1rem}
.pnav[disabled]{opacity:.35}
.preveal{height:60px;border-radius:16px;border:0;background:#23835A;color:#fff;font:700 1.1rem/1 "Outfit",sans-serif;padding:0 22px;cursor:pointer}
.pmid{flex:1;display:grid;gap:6px}
.pprog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.pprog span{display:block;height:100%;background:var(--c);width:0;transition:width .2s}
.pcount{font:600 .9rem/1 monospace;color:var(--muted)}

.pnotes{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;width:min(900px,94vw);background:#131F3A;color:#fff;border-radius:14px;padding:14px 18px;font-size:1rem;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30}

.ptimer.done{background:#B8342D}

.pused{font-size:.85rem;color:var(--muted)}

[hidden]{display:none!important}

.pres.printing{position:static;display:block}

@page{size:A4 landscape;margin:0}

ndividuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "timetable", "pos": "noun", "ipa": "/ˈtaɪmteɪbl/", "tr": "ders programı", "example": "I check my timetable every morning before school.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "quickly", "pos": "adverb", "ipa": "/ˈkwɪkli/", "tr": "hızlıca", "example": "He gets dressed quickly and never misses the bus.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "slowly", "pos": "adverb", "ipa": "/ˈsləʊli/", "tr": "yavaşça", "example": "She writes slowly but very neatly.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "carefully", "pos": "adverb", "ipa": "/ˈkeəfəli/", "tr": "dikkatlice", "example": "Emir listens carefully and takes notes in every lesson.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "usually", "pos": "adverb", "ipa": "/ˈjuːʒuəli/", "tr": "genellikle", "example": "I usually study for thirty minutes after school.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“saçını taramak”",  notes every evening.", "We <mark>don't have<\/mark> breakfast together on school days.", "He <mark>doesn't plan<\/mark> his homework before dinner."], "ask": "Which sentences are about 'I/we' and which are about 'he/she'? What changes on the verb with he/she? How is the negative different for he/she?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["base verb", "-s / -es", "don't", "doesn't"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "With I, you, we or they, we use the ___.", "section": "Complete the rule", "reveal": "base verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "With he, she or it, we add ___ to the verb.", "section": "Complete the rule", "reveal": "-s / -es / -s/-es", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative with I, you, we or they is ___ + base verb.", "section": "Complete the rule", "reveal": "don't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative with he, she or it is ___ + base verb.", "section": "Complete the rule", "reveal": "doesn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the Simple Present Tense to talk about daily and study routines and habits. Use the base verb with I/you/we/they, and add -s/-es with he/she/it. Negative: don't (I/you/we/they), doesn't (he/she/it) + base verb.", "tr": "Simple Present Tense, günlük ve çalışma rutinlerini, alışkanlıkları anlatmak için kullanılır. I/you/we/they ile fiilin yalın hâli, he/she/it ile fiile -s/-es eklenir. Olumsuzda I/you/we/they ile 'don't', he/she/it ile 'doesn't' kullanılır.", "when_en": "We use this to talk about things we do every day or regularly — our daily and study routines and habits.", "when": "Her gün ya da düzenli olarak yaptığımız şeyleri; günlük ve çalışma rutinlerimizi, alışkanlıklarımızı anlatırken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I", "wake up", "at seven"], "reveal": "I wake up at seven.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Zeynep", "revise", "her notes every evening"], "reveal": "Zeynep revises her notes every evening.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "not / have", "breakfast together"], "reveal": "We don't have breakfast together.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "not / plan", "his homework early"], "reveal": "He doesn't plan his homework early.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; ra 766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Simple Present Questions, Time Expressions and Adverbs of Manner", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>Do<\/mark> you usually hand in your homework on time?", "<mark>Does<\/mark> Emir take notes quickly in class?", "I <mark>always<\/mark> comb my hair before school, but I <mark>never<\/mark> plan my bag the night before.", "She listens <mark>carefully<\/mark> and writes <mark>slowly<\/mark> but neatly."], "ask": "Which word starts a question about I/you/we/they, and which about he/she/it? Where do 'always' and 'never' go in the sentence? Where do 'carefully' and 'slowly' go?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["Do", "Does", "before the main verb", "after the verb (or object)"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "Questions with I/you/we/they start with ___.", "section": "Complete the rule", "reveal": "Do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Questions with he/she/it start with ___.", "section": "Complete the rule", "reveal": "Does", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Adverbs of frequency (always, usually, often, sometimes, never) usually go ___.", "section": "Complete the rule", "reveal": "before the main verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Adverbs of manner (quickly, slowly, carefully) usually go ___.", "section": "Complete the rule", "reveal": "after the verb (or object)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "In Simple Present questions, use Do with I/you/we/they and Does with he/she/it, and keep the base verb. Adverbs of frequency (always, usually, often, sometimes, never) go before the main verb; adverbs of manner (quickly, slowly, carefully) usually go after the verb or object.", "tr": "Şimdiki zaman sorularında I/you/we/they ile 'Do', he/she/it ile 'Does' kullanılır ve fiil yalın hâlde kalır. Sıklık zarfları (always, usually, often, sometimes, never) ana fiilden önce; tarz zarfları (quickly, slowly, carefully) genellikle fiilden (veya nesneden) sonra gelir.", "when_en": "We use this to ask questions about routines, and to say how often (frequency) or how (manner) we do something.", "when": "Rutinler hakkında soru sorarken, bir şeyi ne sıklıkla yaptığımızı (sıklık zarfı) ve nasıl yaptığımızı (tarz zarfı) anlatırken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["? / you", "usually", "hand in your homework on time"], "reveal": "Do you usually hand in your homework on time?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / Emir", "take notes", "quickly"], "reveal": "Does Emir take notes quickly?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "always", "comb my hair before school"], "reveal": "I always comb my hair before school.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "listen", "carefully in class"], "reveal": "She listens carefully in class.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "write", "slowly but neatly"], "reveal": "He writes slowly but neatly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / your classmates", "often", "revise together"], "reveal": "Do your classmates often revise together?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences: one question with Do/Does, one with an adverb of frequency, and one with an adverb of manner.", "chips": ["Do you...?", "I always/usually/never...", "I... carefully/quickly/slowly."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I always comb my hair before school.", "She listens carefully in class."], "negative": ["I never plan my bag the night before.", "He doesn't write quickly."], "question": ["Do you usually hand in your homework on time?", "Does Emir take notes quickly?"], "short": ["Yes, I do. / No, I don't.", "Yes, he does. / No, he doesn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You do usually hand in your homework?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Do you usually hand in your homework?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She listens careful in class.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She listens carefully in class.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ you usually hand in your homework on time?", "section": "A · Choose the correct option.", "options": ["Do", "Does", "Are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ Emir take notes quickly?", "section": "A · Choose the correct option.", "options": ["Do", "Does", "Is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I ___ comb my hair before school.", "section": "A · Choose the correct option.", "options": ["always", "quickly", "careful"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She writes slowly but ___.", "section": "A · Choose the correct option.", "options": ["neat", "neatly", "neats"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ your classmates often revise together?", "section": "B · Complete with Do/Does.", "reveal": "Do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ he plan his homework carefully?", "section": "B · Complete with Do/Does.", "reveal": "Does", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Does Emir takes notes quickly?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Does Emir take notes quickly?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I usually check my timetable before school.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you take notes carefully in every lesson?", "section": "Dialogue · Complete with Do/Does or an adverb.", "reveal": "Do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I ___. I ___ (usually) sit near the board.", "section": "Dialogue · Complete with Do/Does or an adverb.", "reveal": "do / usually", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a study habit.", "section": "Dialogue · Complete with Do/Does or an adverb.", "words": ["does", "your", "classmate", "usually", "revise", "before", "a", "test"], "end": "?", "reveal": "Does your classmate usually revise before a test?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A New Friend in Room 9B", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think this story is about?", "Guess: what might happen on someone's first day with a new classmate?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A New Friend in Room 9B", "num": 1, "total": 5, "text": "My name is Emir, and today I have a new classmate — his name is Kerem, and he sits next to me in Room 9B. At first, we don't talk much, but at break time, Kerem asks me about my daily routine, and we quickly become friends.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A New Friend in Room 9B", "num": 2, "total": 5, "text": "I tell him about my typical school day. I wake up at half past six, get dressed quickly, and have a fast breakfast with my family. I check my timetable every morning before I leave the house, so I never forget my books.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A New Friend in Room 9B", "num": 3, "total": 5, "text": "Kerem laughs and says his morning routine is very different. He wakes up early too, but he doesn't have breakfast at home — he usually has it at school, at break time, with his new classmates. He combs his hair carefully and always plans his school bag the night before.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A New Friend in Room 9B", "num": 4, "total": 5, "text": "In class, Kerem takes notes quickly, but he also listens carefully to the teacher. I write more slowly, but I revise my notes every evening, and that habit helps me remember new words. We both hand in our homework on time, and our teacher says that's an excellent habit for a good student.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A New Friend in Room 9B", "num": 5, "total": 5, "text": "By the end of the day, Kerem and I aren't strangers any more — we're friends. Our friendship starts with a simple conversation about daily routines, but I think it's going to be a strong one.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the story mainly about?", "section": "While you read", "options": ["A school trip", "Emir's new friendship with a classmate", "A test at school"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When does Emir wake up?", "section": "While you read", "options": ["At half past six", "At seven o'clock", "At break time"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where does Kerem usually have breakfast?", "section": "While you read", "options": ["At home", "At school, at break time", "He never has breakfast"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what does Kerem do the night before school?", "section": "While you read", "options": ["He revises his notes", "He plans his school bag", "He checks his timetable"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Emir and Kerem are still strangers at the end of the day.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "By the end of the day, Emir and Kerem aren't strangers any more — they're friends.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why do Emir and Kerem become friends so quickly?", "section": "While you read", "options": ["Because they have exactly the same morning routine", "Because they talk about their daily routines and find things to share", "Because they sit in different classrooms"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Think about your first meeting with a new classmate. What did you talk about?", "Compare Emir's morning routine with Kerem's. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Zeynep's Study Routine", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think a good study routine looks like?", "Guess two habits a hardworking student might have."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Zeynep's Study Routine", "num": 1, "total": 5, "text": "My classmate Zeynep always has the best grades in our class, so one day I ask her about her study routine. She smiles and says it isn't a secret — she just has good habits.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Zeynep's Study Routine", "num": 2, "total": 5, "text": "Zeynep gets home from school at half past three, and she doesn't start studying immediately. First, she has a snack and rests for twenty minutes. Then she checks her timetable for tomorrow and plans her homework carefully.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Zeynep's Study Routine", "num": 3, "total": 5, "text": "She revises her notes every evening, usually for about forty-five minutes. She reads slowly and takes notes as she reads, because she says that helps her remember new information. She never leaves her homework until the last minute — she always hands it in early.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Zeynep's Study Routine", "num": 4, "total": 5, "text": "I ask her if studying every day is difficult, and she says no, because she does it in small steps, not all at once. On test days, she often repeats key vocabulary quietly to herself on the bus to school.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Zeynep's Study Routine", "num": 5, "total": 5, "text": "After we talk, I decide to try Zeynep's study routine myself. I don't become a perfect student overnight, but slowly, my new habits start to work — and my classmate Zeynep is happy to help me along the way.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A classroom test", "Zeynep's study routine and habits", "A school trip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Zeynep do first when she gets home?", "section": "While you read", "options": ["She starts studying immediately", "She has a snack and rests", "She goes to bed"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How long does Zeynep usually revise her notes?", "section": "While you read", "options": ["About ten minutes", "About forty-five minutes", "About two hours"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what does Zeynep often do on test days?", "section": "While you read", "options": ["She repeats key vocabulary quietly on the bus", "She skips breakfast", "She stays up very late"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep leaves her homework until the last minute.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Zeynep never leaves her homework until the last minute — she always hands it in early.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the writer's decision to try Zeynep's routine suggest?", "section": "While you read", "options": ["Good study habits can be learned from a classmate", "Studying every day is impossible", "Only naturally clever students can get good grades"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If you asked a classmate about their study routine, what would you want to know first?", "Write two sentences about one study habit you have or would like to start."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "     var d = deck(), sc = screen();
    root.style.setProperty("--c", d.color);
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    $(".pcount").textContent = (cur.s + 1) + " / " + d.screens.length;
    $(".pprog span").style.width = ((cur.s + 1) / d.screens.length * 100) + "%";
    $$(".pdeck").forEach(function (b, i) { b.setAttribute("aria-current", i === cur.d ? "true" : "false"); });
    var rb = $(".preveal"); rb.hidden = !canReveal(sc);
    rb.textContent = sc.type === "notice" && cur.step < sc.items.length && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    $(".pnotes-body").textContent = sc.note || "Bu ekran için not yok.";
    $(".pprev").disabled = cur.d === 0 && cur.s === 0;
    if (sc.timer) setTimer(sc.timer, false);
    try { history.replaceState(null, "", "#" + d.id + "-" + (cur.s + 1)); } catch (e) {}
    store.set("us:present:" + P.key, { d: cur.d, s: cur.s });
    bindStage(sc);
  }
  function go(dd, ss) { cur.d = dd; cur.s = ss; cur.revealed = false; cur.step = 0; render(); }
  function next() {
    var d = deck();
    if (cur.s < d.screens.length - 1) go(cur.d, cur.s + 1);
    else if (cur.d < DECKS.length - 1) go(cur.d + 1, 0);
  }
  function prev() {
    if (cur.s > 0) go(cur.d, cur.s - 1);
    else if (cur.d > 0) go(cur.d - 1, DECKS[cur.d - 1].screens.length - 1);
  }
  function reveal() {
    var sc = screen(); if (!canReveal(sc)) return;
    if (sc.type === "notice" && cur.step < sc.items.length) { cur.step++; if (cur.step >= sc.items.length) cur.revealed = true; }
    else cur.revealed = true;
    var keep = stage.querySelector(".porder-line") ? stage.querySelector(".porder-line").innerHTML : null;
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    if (keep !== null) stage.querySelector(".porder-line").innerHTML = keep;
    var rb = $(".preveal"); rb.textContent = sc.type === "notice" && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    bindStage(sc);
  }
  function bindStage(sc) {
    $$(".popt", stage).forEach(function (b) { b.addEventListener("click", function () { $$(".popt", stage).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); }); });
    var pl = stage.querySelector("[data-audio]");
    if (pl) { var au; pl.addEventListener("click", function () { if (!au) au = new Audio(pl.getAttribute("data-audio")); if (au.paused) { au.play().catch(function () {}); pl.textContent = "❚❚ Pause"; } else { au.pause(); pl.textContent = "▶ Play"; } }); }
    var hid = stage.querySelector(".phide"); if (hid) hid.addEventListener("click", function () { hid.classList.add("on"); cur.revealed = true; });
  }
  stage.addEventListener("click", function (e) {
    var c = e.target.closest(".pchipw"); if (!c) return;
    var line = stage.querySelector(".porder-line"), bank = stage.querySelector(".porder-bank");
    (c.parentNode === bank ? line : bank).appendChild(c);
  });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b && "speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(b.getAttribute("data-say")); u.lang = "en-GB"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  });

  /* ---------- araçlar: sayaç ---------- */
  var T = { left: 0, total: 0, id: null };
  var tbox = $(".ptimer");
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function drawT() { $(".ptime", tbox).textContent = fmt(T.left); tbox.classList.toggle("ending", T.left > 0 && T.left <= 10); tbox.classList.toggle("done", T.left === 0 && T.total > 0); }
  function setTimer(sec, start) { stopT(); T.left = T.total = sec; tbox.hidden = false; drawT(); if (start) startT(); }
  function startT() { if (T.id || !T.left) return; T.id = setInterval(function () { T.left--; drawT(); if (T.left <= 0) { stopT(); beep(); } }, 1000); $(".ptgo", tbox).textContent = "❚❚"; }
  function stopT() { clearInterval(T.id); T.id = null; if (tbox) $(".ptgo", tbox).textContent = "▶"; }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime + t); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {} }
  $(".ptgo", tbox).addEventListener("click", function () { T.id ? stopT() : startT(); });
  $$("[data-t]", tbox).forEach(function (b) { b.addEventListener("click", function () { setTimer(+b.getAttribute("data-t"), true); }); });
  $(".ptclose", tbox).addEventListener("click", function () { stopT(); tbox.hidden = true; });

  /* ---------- araçlar: rastgele öğrenci ---------- */
  var pick = $(".ppick"), used = [];
  $("#p-size").value = store.get("us:classsize", 30);
  function pickOne() {
    var n = Math.max(2, Math.min(60, +$("#p-size").value || 30)); store.set("us:classsize", n);
    if (used.length >= n) used = [];
    var r; do { r = 1 + Math.floor(Math.random() * n); } while (used.indexOf(r) >= 0);
    used.push(r);
    var big = $(".pnum", pick); var k = 0;
    var spin = setInterval(function () { big.textContent = 1 + Math.floor(Math.random() * n); if (++k > 10) { clearInterval(spin); big.textContent = r; } }, 60);
    $(".pused", pick).textContent = "Seçilenler: " + used.join(", ");
  }
  $(".pgo", pick).addEventListener("click", pickOne);
  $(".ppclose", pick).addEventListener("click", function () { pick.hidden = true; });

  /* ---------- araçlar: puan tablosu ---------- */
  var score = $(".pscore"), S = store.get("us:score:" + P.key, [0, 0]);
  function drawS() { $$(".pts", score).forEach(function (x, i) { x.textContent = S[i]; }); store.set("us:score:" + P.key, S); }
  $$("[data-sc]", score).forEach(function (b) { b.addEventListener("click", function () { var a = b.getAttribute("data-sc").split(","); S[+a[0]] = Math.max(0, S[+a[0]] + (+a[1])); drawS(); }); });
  $(".psreset", score).addEventListener("click", function () { S = [0, 0]; drawS(); });
  drawS();

  /* ---------- düğmeler & klavye ---------- */
  function tool(name) {
    if (name === "timer") { tbox.hidden = !tbox.hidden; }
    if (name === "pick") { pick.hidden = !pick.hidden; if (!pick.hidden) pickOne(); }
    if (name === "score") { score.hidden = !score.hidden; }
    if (name === "notes") { var n = $(".pnotes"); n.hidden = !n.hidden; }
    if (name === "full") { var d = document.documentElement; if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(function () {}); } else document.exitFullscreen(); }
  }
  $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { tool(b.getAttribute("data-tool")); }); });
  $(".pnext").addEventListener("click", next);
  $(".pprev").addEventListener("click", prev);
  $(".preveal").addEventListener("click", reveal);
  $$(".pdeck").forEach(function (b, i) { b.addEventListener("click", function () { go(i, 0); }); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,textarea,select")) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); next(); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); prev(); }
    else if (k === "r" || k === "enter") { e.preventDefault(); reveal(); }
    else if (k === "t") tool("timer"); else if (k === "p") tool("pick"); else if (k === "s") tool("score"); else if (k === "n") tool("notes"); else if (k === "f") tool("full");
  });
  // dokunmatik kaydırma
  var sx = null;
  stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) (dx < 0 ? next : prev)(); sx = null; });

  // başlangıç: hash ya da kayıtlı konum
  var m = (location.hash || "").match(/^#([a-z0-9-]+)-(\d+)$/), start = store.get("us:present:" + P.key, { d: 0, s: 0 });
  if (m) { DECKS.forEach(function (d, i) { if (d.id === m[1]) { start = { d: i, s: Math.min(+m[2] - 1, d.screens.length - 1) }; } }); }
  if (!DECKS[start.d] || !DECKS[start.d].screens[start.s]) start = { d: 0, s: 0 };
  go(start.d, start.s);
})();
</script></body></html>
