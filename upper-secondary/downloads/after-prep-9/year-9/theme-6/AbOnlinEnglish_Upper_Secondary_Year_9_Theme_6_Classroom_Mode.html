<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sınıf Modu · Theme 6 Life in the City &amp; Country</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@400;600;700&display=swap"><style>/* Sınıf Modu — projeksiyon ve akıllı tahta için yüksek kontrast, büyük yazı */
.pres{--c:#2766D6;--ink:#131F3A;--muted:#5B6680;--line:#D9DEE8;--paper:#FFFFFF;--soft:#F2F4F8;

.pres *{box-sizing:border-box}
.pres button{font-family:inherit}
.pbar{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,2vw,24px);border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.pbrand{font:700 1rem/1 var(--sans,"Outfit");text-decoration:none;color:var(--ink);white-space:nowrap}
.pbrand .b1{color:#D9602A}.pbrand .b3{color:#23835A}
.pdecks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.pdeck{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.pdeck[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ptools{display:flex;gap:6px}
.ptool{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.ptool:hover{border-color:var(--c)}
.ptool kbd{font:600 .7rem/1 monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
@media (max-width:900px){.ptool kbd,.ptool .tl{display:none}}
.pstage{overflow:auto;display:grid;place-items:center;padding:clamp(16px,3vw,48px);border-top:6px solid var(--c)}
.pscreen{width:min(1200px,100%)}

.p-title h1{font:700 clamp(2.6rem,7vw,6rem)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 .4em}

.ptrl{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--muted);margin:0 0 1em}
.ptrl b{font:700 .7em/1 monospace;background:var(--soft);padding:3px 6px;border-radius:4px;margin-right:6px}
.pchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:.8em}

.pchips.alt span{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff);font-weight:600}
.pchips.big span{font-size:clamp(1.3rem,2.6vw,2.2rem)}
.plist{font-size:clamp(1.3rem,2.8vw,2.4rem);line-height:1.4;padding-left:1.2em;margin:0}
.plist li{margin-bottom:.4em}
.plist.small{font-size:clamp(1.1rem,2vw,1.7rem)}
.p-word{text-align:center}
.pw{font:700 clamp(3rem,10vw,8rem)/1 "Outfit",sans-serif;color:var(--c);letter-spacing:-.01em}
.pwm{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--muted);margin:.4em 0 1em;display:flex;gap:10px;justify-content:center;align-items:center}
.psay{border:0;background:var(--soft);border-radius:50%;width:56px;height:56px;font-size:1.5rem;cursor:pointer}
.phide{opacity:.08;filter:blur(8px);cursor:pointer;transition:all .25s}
.phide.on{opacity:1;filter:none}
.ptr{font:700 clamp(1.6rem,4vw,3.2rem)/1.2 "Outfit",sans-serif;margin:0 0 .4em}
.pex{font-size:clamp(1.2rem,2.5vw,2.1rem);font-style:italic;color:var(--ink);margin:0}
.pnotice{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:.5em}
.pnotice li{font-size:clamp(1.3rem,3vw,2.5rem);padding:.35em .6em;border-radius:12px;background:var(--soft);opacity:.08}
.pnotice li.on{opacity:1}
.pnotice mark{background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--ink);padding:0 .15em;border-radius:6px;font-weight:700}
.pask{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;opacity:0}
.pask.on{opacity:1}
.p-rule .pbig{font-weight:600}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pform div{background:var(--soft);border-radius:14px;padding:18px}
.pform h3{font:700 .95rem/1 "Outfit",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.pform p{font-size:clamp(1.1rem,2vw,1.7rem);margin:0 0 .3em}
.pq{font:600 clamp(1.6rem,4vw,3.4rem)/1.3 "Outfit",sans-serif;margin:0 0 .6em}
.pblank{display:inline-block;width:3.2em;border-bottom:4px solid var(--c);margin:0 .15em;vertical-align:-.1em}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.popt{display:flex;gap:14px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:.6em .9em;font-size:clamp(1.2rem,2.6vw,2.2rem);cursor:pointer;color:var(--ink)}
.popt b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);font-size:.7em;flex:none}
.popt.sel{border-color:var(--c)}
.popt.right{border-color:#23835A;background:#E1F3EA}
.popt.right b{background:#23835A;color:#fff}
.popt.dim{opacity:.4}
.pans{font:700 clamp(1.4rem,3.2vw,2.8rem)/1.3 "Outfit",sans-serif;color:#23835A;margin:.6em 0 0;opacity:0}
.pans.on{opacity:1}
.pans.big{font-size:clamp(1.6rem,3.8vw,3.2rem)}
.pcues{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pcues span{font:600 clamp(1.3rem,3vw,2.6rem)/1.2 "Outfit",sans-serif;padding:.3em .7em;border-radius:14px;border:3px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pcues i{font-style:normal;font-size:2rem;color:var(--muted)}
.porder-line{min-height:3.4em;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}

.ptrans{font-size:clamp(1.1rem,2.2vw,1.8rem);opacity:0}
.ptrans.on{opacity:1}

.plevels b{display:block;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.muted{color:var(--muted)}

.pfoot{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,2vw,24px);border-top:1px solid var(--line);background:var(--paper)}
.pnav{min-width:64px;height:60px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:1.6rem;cursor:pointer;color:var(--ink)}
.pnav.pnext{background:var(--c);border-color:var(--c);color:#fff;min-width:120px;font-weight:700;font-size:1.1rem}

.pmid{flex:1;display:grid;gap:6px}
.pprog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}

.pcount{font:600 .9rem/1 monospace;color:var(--muted)}

.pres.printing{position:static;display:block}

ime", "does", "the", "food", "festival", "start"], "end": "?", "reveal": "What time does the food festival start?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Present Progressive: Current Actions and Preferences", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Look! The vendor <mark>is grilling<\/mark> sweetcorn on the corner.", "We <mark>are trying<\/mark> street food from five different countries this weekend.", "I <mark>am not eating<\/mark> anything spicy today — my stomach hurts.", "<mark>Are<\/mark> you <mark>enjoying<\/mark> the food festival so far?"], "ask": "Which sentences describe actions happening right now? How is the verb formed (be + verb + -ing)?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["am/is/are + verb-ing", "am not/isn't/aren't", "Am/Is/Are", "now, at the moment, right now"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We form the present progressive with ___.", "section": "Complete the rule", "reveal": "am/is/are + verb-ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative form is ___ + verb-ing.", "section": "Complete the rule", "reveal": "am not/isn't/aren't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A question starts with ___ + subject + verb-ing?", "section": "Complete the rule", "reveal": "Am/Is/Are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Time words like ___ often signal the present progressive.", "section": "Complete the rule", "reveal": "now, at the moment, right now", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use the Present Progressive (am/is/are + verb-ing) to talk about actions happening now, around now, or temporary preferences.", "tr": "Present Progressive (am/is/are + fiil-ing), şu anda ya da bu günlerde devam eden eylemleri ve geçici tercihleri anlatmak için kullanılır.", "when_en": "We use this to describe what is happening right now at a festival or in the kitchen, or a preference we have at the moment.", "when": "Bir festivalde ya da mutfakta şu anda olup biten olayları, ya da bu dönemde tercih ettiğimiz şeyleri anlatırken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["the vendor", "grill", "sweetcorn"], "reveal": "The vendor is grilling sweetcorn.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "try", "street food from five countries"], "reveal": "We are trying street food from five countries.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "not / eat", "anything spicy today"], "reveal": "I'm not eating anything spicy today.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "enjoy", "the food festival"], "reveal": "Are you enjoying the food festival?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "cook", "dinner right now"], "reveal": "My parents are cooking dinner right now.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / the chef", "make", "Turkish pizza"], "reveal": "Is the chef making Turkish pizza?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about what is happening at a food festival or in your kitchen right now.", "chips": ["Right now, I am...", "At the moment, my family is...", "We aren't..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["The vendor is grilling sweetcorn.", "We are trying new dishes."], "negative": ["I'm not eating spicy food today.", "They aren't cooking at home tonight."], "question": ["Are you enjoying the festival?", "Is the chef making falafel?"], "short": ["Yes, I am. / No, I'm not.", "Yes, she is. / No, she isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She is cook dinner.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is cooking dinner.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I amn't hungry.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I'm not hungry.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Look! The vendor ___ sweetcorn.", "section": "A · Choose the correct option.", "options": ["grills", "is grilling", "grill"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ street food from five countries this weekend.", "section": "A · Choose the correct option.", "options": ["try", "are trying", "tries"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I ___ anything spicy today.", "section": "A · Choose the correct option.", "options": ["am not eating", "don't eating", "not eat"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you enjoying the festival?", "section": "A · Choose the correct option.", "options": ["Do", "Are", "Is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My parents ___ (cook) dinner right now.", "section": "B · Complete with the present progressive.", "reveal": "are cooking", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ (the chef / make) Turkish pizza at the moment?", "section": "B · Complete with the present progressive.", "reveal": "Is the chef making", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She is cook falafel for the festival.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is cooking falafel for the festival.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We are trying street food from five countries this weekend.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ you ___ (eat) right now?", "section": "Dialogue · Complete with the present progressive.", "reveal": "are / eating", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (try) grilled sweetcorn — it's delicious!", "section": "Dialogue · Complete with the present progressive.", "reveal": "am trying / 'm trying", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a current action at a festival.", "section": "Dialogue · Complete with the present progressive.", "words": ["is", "the", "vendor", "grilling", "sweetcorn"], "end": "?", "reveal": "Is the vendor grilling sweetcorn?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Balıkesir Street Food Festival", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of food do you think you can find at a street food festival?", "Guess: what three things might people do at a food festival?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Balıkesir Street Food Festival", "num": 1, "total": 5, "text": "Every September, our town holds the Balıkesir Street Food Festival, and it's one of my favourite weekends of the year. Dozens of food stalls line the main square, and the smell of grilled sweetcorn and spicy sauces fills the air.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Balıkesir Street Food Festival", "num": 2, "total": 5, "text": "This year, my family is trying food from five different countries. At one stall, a vendor is making fresh falafel with chickpeas, herbs and a squeeze of lemon. At another, a woman is grilling Turkish pizza — thin, crispy and topped with minced meat and vegetables.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Balıkesir Street Food Festival", "num": 3, "total": 5, "text": "My little brother always asks the same Wh-question at every stall: 'What's in this dish?' He loves sweetcorn with cream and cheese, and he doesn't stop eating it until it's finished! I prefer something spicier, so I usually order falafel or a stuffed pepper.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Balıkesir Street Food Festival", "num": 4, "total": 5, "text": "The festival isn't only about eating, though. There's live music, a cooking competition, and a stage where local chefs show their family recipes to the crowd. Right now, a famous local chef is demonstrating how to make a traditional dessert with homemade cream.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Balıkesir Street Food Festival", "num": 5, "total": 5, "text": "By the end of the day, we are all full, happy and a little bit sleepy. For me, the best part of the festival is trying a new flavour every year — and finding out which local specialty I like best.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A cooking competition on TV", "A street food festival in the writer's town", "A trip to another country"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the writer's brother's favourite food at the festival?", "section": "While you read", "options": ["Falafel", "Sweetcorn with cream and cheese", "Turkish pizza"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the writer usually order?", "section": "While you read", "options": ["Something spicy, like falafel or a stuffed pepper", "Only sweetcorn", "Only dessert"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is happening at the festival right now, according to the text?", "section": "While you read", "options": ["A local chef is demonstrating a dessert recipe", "Everyone is going home", "The vendors are closing their stalls"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The festival only has food stalls — there's nothing else to do.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There's also live music, a cooking competition and chef demonstrations.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does the writer say the festival is her favourite weekend?", "section": "While you read", "options": ["Because she doesn't like her town", "Because she enjoys trying new food and flavours every year", "Because school is closed"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If your town held a street food festival, which dish would you want to try first? Why?", "Write two sentences describing what a vendor at the festival might be doing right now."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "My Grandmother's Stuffed Peppers", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think 'stuffed peppers' means? Guess the ingredients.", "Do you have a special family recipe? Think of one dish."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My Grandmother's Stuffed Peppers", "num": 1, "total": 5, "text": "In my family, Sunday lunch always means one thing: my grandmother's stuffed peppers. It's a traditional recipe that she learned from her own mother, and now she's teaching it to me, step by step.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Grandmother's Stuffed Peppers", "num": 2, "total": 5, "text": "This morning, we are preparing the ingredients together in her kitchen. She is washing the peppers while I am chopping onions, tomatoes and fresh herbs. 'What do we add next?' I ask her, and she always answers with a smile: 'A little rice, a little love.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Grandmother's Stuffed Peppers", "num": 3, "total": 5, "text": "My grandmother says every family has its own version of this dish — some add sweetcorn, some use different spices, and some make it spicier than others. Ours isn't very spicy, but it's full of flavour, with rice, herbs and a spoonful of cream on top.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Grandmother's Stuffed Peppers", "num": 4, "total": 5, "text": "While the peppers are cooking slowly in the oven, we sit at the table and my grandmother tells stories about her own childhood. She often asks me Wh-questions like 'Do you prefer this dish or your mother's soup?' — and I honestly can't choose!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Grandmother's Stuffed Peppers", "num": 5, "total": 5, "text": "When the stuffed peppers are finally ready, the whole house smells delicious. For me, this homemade meal isn't only about the taste — it's about spending time with my grandmother and keeping our family's recipe alive for the next generation.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is this text mainly about?", "section": "While you read", "options": ["A restaurant review", "A family tradition of cooking stuffed peppers together", "A trip to a food festival"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Who is the writer cooking with?", "section": "While you read", "options": ["A friend", "Her grandmother", "A professional chef"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the writer doing while her grandmother washes the peppers?", "section": "While you read", "options": ["Chopping onions, tomatoes and herbs", "Watching TV", "Setting the table"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the family add to make the dish full of flavour but not too spicy?", "section": "While you read", "options": ["Extra chili", "Rice, herbs and cream", "Only sweetcorn"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The writer's grandmother never talks while they cook.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She tells stories about her childhood while the peppers are cooking.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why is this meal special to the writer, according to the last paragraph?", "section": "While you read", "options": ["Because it is the cheapest meal she knows", "Because it connects her to her grandmother and family tradition", "Because it takes the least time to cook"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read     var d = deck(), sc = screen();
    root.style.setProperty("--c", d.color);
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    $(".pcount").textContent = (cur.s + 1) + " / " + d.screens.length;
    $(".pprog span").style.width = ((cur.s + 1) / d.screens.length * 100) + "%";
    $$(".pdeck").forEach(function (b, i) { b.setAttribute("aria-current", i === cur.d ? "true" : "false"); });
    var rb = $(".preveal"); rb.hidden = !canReveal(sc);
    rb.textContent = sc.type === "notice" && cur.step < sc.items.length && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    $(".pnotes-body").textContent = sc.note || "Bu ekran için not yok.";
    $(".pprev").disabled = cur.d === 0 && cur.s === 0;
    if (sc.timer) setTimer(sc.timer, false);
    try { history.replaceState(null, "", "#" + d.id + "-" + (cur.s + 1)); } catch (e) {}
    store.set("us:present:" + P.key, { d: cur.d, s: cur.s });
    bindStage(sc);
  }
  function go(dd, ss) { cur.d = dd; cur.s = ss; cur.revealed = false; cur.step = 0; render(); }
  function next() {
    var d = deck();
    if (cur.s < d.screens.length - 1) go(cur.d, cur.s + 1);
    else if (cur.d < DECKS.length - 1) go(cur.d + 1, 0);
  }
  function prev() {
    if (cur.s > 0) go(cur.d, cur.s - 1);
    else if (cur.d > 0) go(cur.d - 1, DECKS[cur.d - 1].screens.length - 1);
  }
  function reveal() {
    var sc = screen(); if (!canReveal(sc)) return;
    if (sc.type === "notice" && cur.step < sc.items.length) { cur.step++; if (cur.step >= sc.items.length) cur.revealed = true; }
    else cur.revealed = true;
    var keep = stage.querySelector(".porder-line") ? stage.querySelector(".porder-line").innerHTML : null;
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    if (keep !== null) stage.querySelector(".porder-line").innerHTML = keep;
    var rb = $(".preveal"); rb.textContent = sc.type === "notice" && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    bindStage(sc);
  }
  function bindStage(sc) {
    $$(".popt", stage).forEach(function (b) { b.addEventListener("click", function () { $$(".popt", stage).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); }); });
    var pl = stage.querySelector("[data-audio]");
    if (pl) { var au; pl.addEventListener("click", function () { if (!au) au = new Audio(pl.getAttribute("data-audio")); if (au.paused) { au.play().catch(function () {}); pl.textContent = "❚❚ Pause"; } else { au.pause(); pl.textContent = "▶ Play"; } }); }
    var hid = stage.querySelector(".phide"); if (hid) hid.addEventListener("click", function () { hid.classList.add("on"); cur.revealed = true; });
  }
  stage.addEventListener("click", function (e) {
    var c = e.target.closest(".pchipw"); if (!c) return;
    var line = stage.querySelector(".porder-line"), bank = stage.querySelector(".porder-bank");
    (c.parentNode === bank ? line : bank).appendChild(c);
  });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b && "speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(b.getAttribute("data-say")); u.lang = "en-GB"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  });

  /* ---------- araçlar: sayaç ---------- */
  var T = { left: 0, total: 0, id: null };
  var tbox = $(".ptimer");
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function drawT() { $(".ptime", tbox).textContent = fmt(T.left); tbox.classList.toggle("ending", T.left > 0 && T.left <= 10); tbox.classList.toggle("done", T.left === 0 && T.total > 0); }
  function setTimer(sec, start) { stopT(); T.left = T.total = sec; tbox.hidden = false; drawT(); if (start) startT(); }
  function startT() { if (T.id || !T.left) return; T.id = setInterval(function () { T.left--; drawT(); if (T.left <= 0) { stopT(); beep(); } }, 1000); $(".ptgo", tbox).textContent = "❚❚"; }
  function stopT() { clearInterval(T.id); T.id = null; if (tbox) $(".ptgo", tbox).textContent = "▶"; }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime + t); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {} }
  $(".ptgo", tbox).addEventListener("click", function () { T.id ? stopT() : startT(); });
  $$("[data-t]", tbox).forEach(function (b) { b.addEventListener("click", function () { setTimer(+b.getAttribute("data-t"), true); }); });
  $(".ptclose", tbox).addEventListener("click", function () { stopT(); tbox.hidden = true; });

  /* ---------- araçlar: rastgele öğrenci ---------- */
  var pick = $(".ppick"), used = [];
  $("#p-size").value = store.get("us:classsize", 30);
  function pickOne() {
    var n = Math.max(2, Math.min(60, +$("#p-size").value || 30)); store.set("us:classsize", n);
    if (used.length >= n) used = [];
    var r; do { r = 1 + Math.floor(Math.random() * n); } while (used.indexOf(r) >= 0);
    used.push(r);
    var big = $(".pnum", pick); var k = 0;
    var spin = setInterval(function () { big.textContent = 1 + Math.floor(Math.random() * n); if (++k > 10) { clearInterval(spin); big.textContent = r; } }, 60);
    $(".pused", pick).textContent = "Seçilenler: " + used.join(", ");
  }
  $(".pgo", pick).addEventListener("click", pickOne);
  $(".ppclose", pick).addEventListener("click", function () { pick.hidden = true; });

  /* ---------- araçlar: puan tablosu ---------- */
  var score = $(".pscore"), S = store.get("us:score:" + P.key, [0, 0]);
  function drawS() { $$(".pts", score).forEach(function (x, i) { x.textContent = S[i]; }); store.set("us:score:" + P.key, S); }
  $$("[data-sc]", score).forEach(function (b) { b.addEventListener("click", function () { var a = b.getAttribute("data-sc").split(","); S[+a[0]] = Math.max(0, S[+a[0]] + (+a[1])); drawS(); }); });
  $(".psreset", score).addEventListener("click", function () { S = [0, 0]; drawS(); });
  drawS();

  /* ---------- düğmeler & klavye ---------- */
  function tool(name) {
    if (name === "timer") { tbox.hidden = !tbox.hidden; }
    if (name === "pick") { pick.hidden = !pick.hidden; if (!pick.hidden) pickOne(); }
    if (name === "score") { score.hidden = !score.hidden; }
    if (name === "notes") { var n = $(".pnotes"); n.hidden = !n.hidden; }
    if (name === "full") { var d = document.documentElement; if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(function () {}); } else document.exitFullscreen(); }
  }
  $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { tool(b.getAttribute("data-tool")); }); });
  $(".pnext").addEventListener("click", next);
  $(".pprev").addEventListener("click", prev);
  $(".preveal").addEventListener("click", reveal);
  $$(".pdeck").forEach(function (b, i) { b.addEventListener("click", function () { go(i, 0); }); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,textarea,select")) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); next(); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); prev(); }
    else if (k === "r" || k === "enter") { e.preventDefault(); reveal(); }
    else if (k === "t") tool("timer"); else if (k === "p") tool("pick"); else if (k === "s") tool("score"); else if (k === "n") tool("notes"); else if (k === "f") tool("full");
  });
  // dokunmatik kaydırma
  var sx = null;
  stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) (dx < 0 ? next : prev)(); sx = null; });

  // başlangıç: hash ya da kayıtlı konum
  var m = (location.hash || "").match(/^#([a-z0-9-]+)-(\d+)$/), start = store.get("us:present:" + P.key, { d: 0, s: 0 });
  if (m) { DECKS.forEach(function (d, i) { if (d.id === m[1]) { start = { d: i, s: Math.min(+m[2] - 1, d.screens.length - 1) }; } }); }
  if (!DECKS[start.d] || !DECKS[start.d].screens[start.s]) start = { d: 0, s: 0 };
  go(start.d, start.s);
})();
</script></body></html>
