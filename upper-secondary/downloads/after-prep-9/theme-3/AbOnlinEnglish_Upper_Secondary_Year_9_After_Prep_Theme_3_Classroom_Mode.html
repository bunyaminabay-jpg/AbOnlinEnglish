<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sınıf Modu · Theme 3 Personal Life &amp; Well-Being</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@400;600;700&display=swap"><style>/* Sınıf Modu — projeksiyon ve akıllı tahta için yüksek kontrast, büyük yazı */

.pdeck{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.pdeck[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ptools{display:flex;gap:6px}
.ptool{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.ptool:hover{border-color:var(--c)}

@media (max-width:900px){.ptool kbd,.ptool .tl{display:none}}
.pstage{overflow:auto;display:grid;place-items:center;padding:clamp(16px,3vw,48px);border-top:6px solid var(--c)}

.ptrl{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--muted);margin:0 0 1em}
.ptrl b{font:700 .7em/1 monospace;background:var(--soft);padding:3px 6px;border-radius:4px;margin-right:6px}
.pchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:.8em}

.pchips.alt span{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff);font-weight:600}

.plist{font-size:clamp(1.3rem,2.8vw,2.4rem);line-height:1.4;padding-left:1.2em;margin:0}
.plist li{margin-bottom:.4em}
.plist.small{font-size:clamp(1.1rem,2vw,1.7rem)}
.p-word{text-align:center}
.pw{font:700 clamp(3rem,10vw,8rem)/1 "Outfit",sans-serif;color:var(--c);letter-spacing:-.01em}
.pwm{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--muted);margin:.4em 0 1em;display:flex;gap:10px;justify-content:center;align-items:center}
.psay{border:0;background:var(--soft);border-radius:50%;width:56px;height:56px;font-size:1.5rem;cursor:pointer}
.phide{opacity:.08;filter:blur(8px);cursor:pointer;transition:all .25s}

.ptr{font:700 clamp(1.6rem,4vw,3.2rem)/1.2 "Outfit",sans-serif;margin:0 0 .4em}
.pex{font-size:clamp(1.2rem,2.5vw,2.1rem);font-style:italic;color:var(--ink);margin:0}

.pnotice li{font-size:clamp(1.3rem,3vw,2.5rem);padding:.35em .6em;border-radius:12px;background:var(--soft);opacity:.08}
.pnotice li.on{opacity:1}
.pnotice mark{background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--ink);padding:0 .15em;border-radius:6px;font-weight:700}
.pask{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;opacity:0}
.pask.on{opacity:1}
.p-rule .pbig{font-weight:600}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pform div{background:var(--soft);border-radius:14px;padding:18px}
.pform h3{font:700 .95rem/1 "Outfit",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.pform p{font-size:clamp(1.1rem,2vw,1.7rem);margin:0 0 .3em}
.pq{font:600 clamp(1.6rem,4vw,3.4rem)/1.3 "Outfit",sans-serif;margin:0 0 .6em}
.pblank{display:inline-block;width:3.2em;border-bottom:4px solid var(--c);margin:0 .15em;vertical-align:-.1em}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.popt{display:flex;gap:14px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:.6em .9em;font-size:clamp(1.2rem,2.6vw,2.2rem);cursor:pointer;color:var(--ink)}
.popt b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);font-size:.7em;flex:none}
.popt.sel{border-color:var(--c)}
.popt.right{border-color:#23835A;background:#E1F3EA}
.popt.right b{background:#23835A;color:#fff}
.popt.dim{opacity:.4}
.pans{font:700 clamp(1.4rem,3.2vw,2.8rem)/1.3 "Outfit",sans-serif;color:#23835A;margin:.6em 0 0;opacity:0}
.pans.on{opacity:1}
.pans.big{font-size:clamp(1.6rem,3.8vw,3.2rem)}
.pcues{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pcues span{font:600 clamp(1.3rem,3vw,2.6rem)/1.2 "Outfit",sans-serif;padding:.3em .7em;border-radius:14px;border:3px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pcues i{font-style:normal;font-size:2rem;color:var(--muted)}
.porder-line{min-height:3.4em;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}

.pchipw{font:600 clamp(1.2rem,2.6vw,2.2rem)/1 "Outfit",sans-serif;padding:.4em .7em;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}

.ptrans.on{opacity:1}

.muted{color:var(--muted)}

.pprog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}

.pcount{font:600 .9rem/1 monospace;color:var(--muted)}

elin <mark>was jogging<\/mark> in the park, she <mark>twisted<\/mark> her ankle.", "At 8 p.m. yesterday, I <mark>was doing<\/mark> a breathing exercise to calm down after a stressful day."], "ask": "Which actions were short and complete? Which action was already in progress when something else happened? Where do 'while' and 'when' usually go?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["was/were + -ing", "verb + -ed / irregular form", "in progress at a specific past time", "interrupted an action in progress"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "For a completed action in the past, we use the Simple Past: ___.", "section": "Complete the rule", "reveal": "verb + -ed / irregular form", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "For an action that was ___ in the past, we use the Past Progressive: ___.", "section": "Complete the rule", "reveal": "in progress at a specific past time / was/were + -ing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A short action in the Simple Past often ___ a longer action in the Past Progressive (with 'while' or 'when').", "section": "Complete the rule", "reveal": "interrupted an action in progress", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "The Simple Past describes a completed, often short action in the past (verb + -ed or an irregular form). The Past Progressive (was/were + -ing) describes an action that was in progress at a specific past moment. 'While' usually introduces the Past Progressive, 'when' usually introduces the Simple Past; the two combine when a shorter action interrupts a longer one.", "tr": "Simple Past, geçmişte tamamlanmış, kısa süreli eylemleri anlatır (fiil + -ed ya da düzensiz fiil). Past Progressive (was/were + -ing) ise geçmişte belirli bir anda devam etmekte olan bir eylemi anlatır. 'While' genellikle Past Progressive ile, 'when' ise genellikle Simple Past ile kullanılır; uzun eylem yarıda kesildiğinde bu iki zaman birlikte kullanılır.", "when_en": "We use these tenses to describe a past illness, accident or stressful moment, and to show that one action was happening when another one occurred.", "when": "Geçmişte yaşadığımız bir hastalık, kaza ya da stresli bir anı anlatırken; bir eylem devam ederken başka bir şeyin olduğunu belirtirken bu zamanları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["I", "feel / anxious", "when the results came out"], "reveal": "I was feeling anxious when the results came out.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["last week", "I / catch", "a cold"], "reveal": "Last week I caught a cold.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["while / she", "jog", "she twisted her ankle"], "reveal": "While she was jogging, she twisted her ankle.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["at 9 p.m. yesterday", "I / do", "a breathing exercise"], "reveal": "At 9 p.m. yesterday I was doing a breathing exercise.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["when the phone rang", "we / talk", "about stress management"], "reveal": "When the phone rang, we were talking about stress management.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "sleep well", "last night"], "reveal": "Did you sleep well last night?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about a time you felt unwell or stressed: one completed action, one interrupted action with 'while', and one question in the Simple Past.", "chips": ["Last…, I felt…", "While I was…, …", "When…, I was…", "Did you ever…?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I caught a cold last week.", "She was feeling stressed all morning."], "negative": ["He didn't sleep well last night.", "We weren't exercising much that month."], "question": ["Did you recover quickly?", "Was she jogging when it happened?"], "short": ["Yes, I did. / No, I didn't.", "Yes, she was. / No, she wasn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "While I jogged, my phone rang.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "While I was jogging, my phone rang.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I was catching a cold last week.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I caught a cold last week.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She was feel stressed yesterday.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She was feeling stressed yesterday.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I ___ a bad headache after the exam.", "section": "A · Choose the correct option.", "options": ["had", "was having", "have"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "While she ___ in the park, it started to rain.", "section": "A · Choose the correct option.", "options": ["jogged", "was jogging", "jogs"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When the alarm rang, I ___ yoga.", "section": "A · Choose the correct option.", "options": ["did", "was doing", "do"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you sleep well last night?", "section": "A · Choose the correct option.", "options": ["Did", "Were", "Was"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then hurt your back?", "section": "Dialogue · Complete with Simple Past or Past Progressive.", "reveal": "were / doing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (lift) some boxes at home, and I ___ (feel) a sharp pain suddenly.", "section": "Dialogue · Complete with Simple Past or Past Progressive.", "reveal": "was lifting / felt", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "you / when / it happened / were / doing / what", "section": "Dialogue · Reorder the question.", "words": ["what", "were", "you", "doing", "when", "it", "happened"], "end": "?", "reveal": "What were you doing when it happened?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Talking About the Past: could (ability), used to, would", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["As a child, I <mark>could<\/mark> run for hours without getting tired.", "I <mark>used to<\/mark> eat a lot of junk food, but now I try to eat more vegetables.", "Every summer, my grandmother <mark>would<\/mark> take a long walk before breakfast.", "We didn't <mark>use to<\/mark> worry so much about screen time when we were younger."], "ask": "Which word talks about a past ability? Which two describe repeated past habits? Which one is NOT normally used for past states like 'live' or 'have'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a past ability", "repeated actions only, not states", "past habits and states that are now different"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'Could' + base verb describes ___ (a general skill in the past).", "section": "Complete the rule", "reveal": "a past ability", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Used to' + base verb describes ___ , contrasted with the present.", "section": "Complete the rule", "reveal": "past habits and states that are now different", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Would' + base verb also describes past habits, but it is used for ___ .", "section": "Complete the rule", "reveal": "repeated actions only, not states", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Could' describes a general past ability (negative: couldn't). 'Used to' + base verb describes past habits AND states (live, have, like) that are no longer true. 'Would' also describes repeated past habits/actions, but it is NOT used with state verbs like live, have or like.", "tr": "'Could' geçmişteki genel bir yeteneği anlatır (olumsuzu: couldn't). 'Used to' + fiil, geçmişte düzenli olan ama artık geçerli olmayan alışkanlıkları VE durumları (yaşamak, sahip olmak gibi) anlatır. 'Would' da tekrar eden geçmiş alışkanlıkları anlatır, ancak durum bildiren fiillerle (live, have, like) KULLANILMAZ.", "when_en": "We use these forms to describe past abilities, habits and states that have changed, especially when comparing old and new habits related to health and well-being.", "when": "Geçmişteki yeteneklerimizi, alışkanlıklarımızı ve şimdi farklı olan durumlarımızı anlatırken; sağlık, spor ya da yeme alışkanlıklarındaki değişimi karşılaştırırken bu yapıları kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["As a child, I", "swim / not", "very well."], "reveal": "As a child, I couldn't swim very well.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["My dad", "always / go", "for a run before work (habit)"], "reveal": "My dad would always go for a run before work.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I", "eat / not", "vegetables when I was younger (state, now different)"], "reveal": "I didn't use to eat vegetables when I was younger.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["She", "touch her toes without bending her knees (past ability)"], "reveal": "She could touch her toes without bending her knees.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["We", "live", "in a small flat before we moved (state)"], "reveal": "We used to live in a small flat before we moved.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "used to / have", "more free time in Grade 7"], "reveal": "Did you use to have more free time in Grade 7?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences comparing your habits or abilities now with the past: one with 'could', one with 'used to', and one with 'would'.", "chips": ["When I was younger, I could…", "I used to…, but now…", "Every weekend, I would…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I could run fast as a child.", "We used to eat out every Friday.", "My grandmother would walk every morning."], "negative": ["I couldn't sleep well that week.", "I didn't use to like vegetables."], "question": ["Could you swim when you were five?", "Did you use to play outside a lot?"], "short": ["Yes, I could. / No, I couldn't.", "Yes, I did. / No, I didn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I would live in İzmir when I was a child.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I used to live in İzmir when I was a child.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She use to exercise every day.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She used to exercise every day.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I could improved my diet last year.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I improved my diet last year. / I was able to improve my diet last year.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "As a child, I ___ swim across the whole pool.", "section": "A · Choose the correct option.", "options": ["could", "would", "used"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ a big garden before we moved to the city.", "section": "A · Choose the correct option.", "options": ["would have", "used to have", "could have"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Every evening, my mum ___ read to us before bed.", "section": "A · Choose the correct option.", "options": ["used", "would", "could"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "I ___ (not/use to) exercise regularly, but now I go to the gym three times a week.", "section": "B · Complete with the correct form.", "reveal": "didn't use to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ you ___ (use to) live near the sea?", "section": "B · Complete with the correct form.", "reveal": "Did / use to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She would like sport a lot when she was younger.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She used to like sport a lot when she was younger.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "When I was ten, I could stay up late and still wake up early with lots of energy.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "When I was in primary school, I ___ (have) lots of energy. Every day after school, I ___ (play) football with my friends for hours, and I ___ (not/get) tired at all.", "section": "Text · Complete with could, used to or would.", "reveal": "used to have / would play / couldn't get", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Wh- Questions: How long…? and other question words", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>How long<\/mark> have you had that cough?", "<mark>Why<\/mark> did you feel so anxious before the presentation?", "<mark>How often<\/mark> do you check your phone during the day?", "<mark>What<\/mark> helped you recover from the stress of exam season?"], "ask": "What information does each question word ask for — duration, reason, frequency or a thing/action? What comes right after the question word?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["duration (length of time)", "reason", "frequency", "auxiliary + subject + base verb"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'How long' asks about ___.", "section": "Complete the rule", "reveal": "duration (length of time)", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Why' asks about the ___ for something.", "section": "Complete the rule", "reveal": "reason", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'How often' asks about ___.", "section": "Complete the rule", "reveal": "frequency", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After the wh- word, a question usually follows this word order: ___.", "section": "Complete the rule", "reveal": "auxiliary + subject + base verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Wh- question words (what, why, how long, how often, etc.) ask for specific information and normally come first in the question, followed by auxiliary + subject + base verb. 'How long' asks about duration, 'how often' about frequency, and 'why' about reason.", "tr": "Wh- soru kelimeleri (what, why, how long, how often, what helped vb.) belirli bir bilgi istemek için kullanılır ve genellikle cümlenin başına gelir; ardından yardımcı fiil + özne + yalın fiil sırası izlenir. 'How long' süre, 'how often' sıklık, 'why' sebep sorar.", "when_en": "We use wh- questions to get detailed information about health, feelings and habits — for example, to ask how long a symptom has lasted or why someone feels stressed.", "when": "Sağlık, duygular ve alışkanlıklar hakkında ayrıntılı bilgi almak istediğimizde wh- sorularını kullanırız — örneğin bir semptomun ne kadar sürdüğünü ya da neden stresli hissettiğimizi sormak için.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Answer: I've had this headache for two days."], "reveal": "How long have you had this headache?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Answer: I felt stressed because I had three tests in one day."], "reveal": "Why did you feel stressed?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Answer: I check my phone about ten times a day."], "reveal": "How often do you check your phone?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Answer: Talking to my best friend helped me feel better."], "reveal": "What helped you feel better?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Answer: I usually go to bed around eleven."], "reveal": "What time do you usually go to bed?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four wh- questions you could ask a classmate about their well-being (sleep, stress, exercise, screen time), using at least two different question words.", "chips": ["How long…?", "How often…?", "Why…?", "What…?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["How long have you had this symptom?", "Why do you feel anxious today?"], "negative": ["Why didn't you sleep well last night?"], "question": ["How often do you exercise?", "What helps you relax?"], "short": ["For about a week. / Since Monday.", "Because I had a big test."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How long you have had this cough?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How long have you had this cough?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "How often you check your phone?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How often do you check your phone?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ have you been feeling tired?", "section": "A · Choose the correct option.", "options": ["How long", "How often", "Why"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ do you check social media during the day?", "section": "A · Choose the correct option.", "options": ["Why", "How often", "How long"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ did you feel so relieved after the exam?", "section": "A · Choose the correct option.", "options": ["Why", "How long", "How often"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ helped you cope with the stress before the exam?", "section": "B · Complete with the correct wh- word.", "reveal": "What", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ have you had that headache — since this morning or longer?", "section": "B · Complete with the correct wh- word.", "reveal": "How long", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "How long you have felt this way?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "How long have you felt this way?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Why did you feel so anxious before the presentation?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "long / had / how / that / you / cough / have", "section": "Dialogue · Reorder the question.", "words": ["how", "long", "have", "you", "had", "that", "cough"], "end": "?", "reveal": "How long have you had that cough?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-3", "title": "Gramer 4", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Question Tags (Simple Past, Past Progressive, used to)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["You didn't sleep well last night, <mark>did you<\/mark>?", "She used to play a lot of sport, <mark>didn't she<\/mark>?", "You were feeling stressed before the test, <mark>weren't you<\/mark>?", "We couldn't finish the relaxation exercise in time, <mark>could we<\/mark>?"], "ask": "When the main sentence is negative, is the tag positive or negative? What auxiliary verb does each tag repeat?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["negative", "positive", "same auxiliary/modal as the main verb"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "A positive sentence takes a ___ tag.", "section": "Complete the rule", "reveal": "negative", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "A negative sentence takes a ___ tag.", "section": "Complete the rule", "reveal": "positive", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The tag always uses the ___ (did/didn't, was/wasn't, could/couldn't…).", "section": "Complete the rule", "reveal": "same auxiliary/modal as the main verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Question tags with past tenses follow the same golden rule: a positive sentence takes a negative tag, a negative sentence takes a positive tag, and the tag repeats the same auxiliary or modal as the main sentence (did/didn't, was/wasn't, could/couldn't; 'used to' takes did/didn't).", "tr": "Geçmiş zamanlarla kullanılan question tag'ler de aynı altın kurala uyar: olumlu cümleye olumsuz, olumsuz cümleye olumlu bir tag eklenir; tag ana cümledeki yardımcı fiil/modal ile aynı olur (did/didn't, was/wasn't, could/couldn't, used to → didn't).", "when_en": "We use these tags to check or confirm information about a past situation or habit, especially when talking about health and feelings.", "when": "Geçmişte yaşanan bir durumu ya da alışkanlığı teyit etmek istediğimizde, özellikle sağlık ve duygu durumu hakkında sohbet ederken bu tag'leri kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["You felt exhausted after the trip, ___?"], "reveal": "You felt exhausted after the trip, didn't you?", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["She wasn't sleeping well last month, ___?"], "reveal": "She wasn't sleeping well last month, was she?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["They used to go jogging together, ___?"], "reveal": "They used to go jogging together, didn't they?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["You couldn't relax during exam week, ___?"], "reveal": "You couldn't relax during exam week, could you?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["He was feeling anxious before the interview, ___?"], "reveal": "He was feeling anxious before the interview, wasn't he?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three true statements about a past habit or feeling, each with a question tag, and ask a partner to confirm them.", "chips": ["You used to…, didn't you?", "You were feeling…, weren't you?", "You couldn't…, could you?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You slept badly last night, didn't you?"], "negative": ["She wasn't feeling well, was she?"], "question": ["They used to exercise together, didn't they?"], "short": ["Yes, I did. / No, I didn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You used to smoke, usedn't you?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You used to smoke, didn't you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You couldn't sleep, could you not?", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You couldn't sleep, could you?", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "You felt better after the walk, ___?", "section": "A · Choose the correct tag.", "options": ["didn't you", "did you", "weren't you"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She wasn't coping well with the stress, ___?", "section": "A · Choose the correct tag.", "options": ["was she", "wasn't she", "did she"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You used to skip breakfast, ___?", "section": "B · Complete with the correct tag.", "reveal": "didn't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "They couldn't finish the relaxation exercise, ___?", "section": "B · Complete with the correct tag.", "reveal": "could they", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "You were feeling anxious yesterday, was you?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You were feeling anxious yesterday, weren't you?", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "You used to play a team sport, ___?", "section": "Dialogue · Add the tag.", "reveal": "didn't you", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-4", "title": "Gramer 5", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Prepositions and Prepositional Phrases", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I've had this cough <mark>for<\/mark> three days and it started <mark>after<\/mark> the school trip.", "She's really good <mark>at<\/mark> dealing <mark>with<\/mark> stress.", "Talking <mark>about<\/mark> your feelings can help you cope <mark>with<\/mark> anxiety.", "He went <mark>to<\/mark> the doctor's <mark>because of<\/mark> a persistent headache."], "ask": "Which prepositions go with time (for, after)? Which prepositions are 'fixed' after certain words (good at, cope with, talk about)? What comes after 'because of'?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["a noun or -ing form", "a duration of time", "fixed expressions with adjectives/verbs"], "chips": true, "text": "Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'For' + a number/period expresses ___.", "section": "Complete the rule", "reveal": "a duration of time", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Expressions like 'good at', 'cope with' and 'talk about' are ___ — the preposition doesn't change.", "section": "Complete the rule", "reveal": "fixed expressions with adjectives/verbs", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Because of' is followed by ___ , not a full clause.", "section": "Complete the rule", "reveal": "a noun or -ing form", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Prepositions form fixed expressions of time (for + duration, since + starting point), reason (because of + noun/-ing) and with certain verbs/adjectives (good at, cope with, deal with, talk to/about). These patterns need to be learned individually, since they often don't match Turkish word-for-word.", "tr": "Edatlar (preposition) zaman (for + süre, since + başlangıç noktası), sebep (because of + isim/-ing) ve belirli fiil/sıfatlarla sabit kalıplar (good at, cope with, deal with, talk to/about) oluşturur. Bu kalıplar ezberlenmelidir çünkü çoğu zaman Türkçedeki karşılıklarıyla birebir örtüşmez.", "when_en": "We need the correct prepositions when describing how long a health or emotional state has lasted, its cause, or how someone deals with it.", "when": "Bir sağlık ya da duygu durumunun ne kadar sürdüğünü, sebebini ya da onunla nasıl başa çıkıldığını anlatırken doğru edatları kullanmamız gerekir.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["She's very good ___ managing her time."], "reveal": "She's very good at managing her time.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["I've felt tired ___ almost a week now."], "reveal": "I've felt tired for almost a week now.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["He missed school ___ a bad cold."], "reveal": "He missed school because of a bad cold.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Talking ___ a counsellor really helped her."], "reveal": "Talking to a counsellor really helped her.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["It's important to deal ___ stress in a healthy way."], "reveal": "It's important to deal with stress in a healthy way.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["My sleep improved ___ I started switching off my phone earlier."], "reveal": "My sleep improved after I started switching off my phone earlier.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about well-being using at least three different prepositional phrases from this lesson (for + time, good at, cope with, because of, talk to/about).", "chips": ["I'm good at…", "I try to cope with… by…", "I felt better because of…"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I've had this cold for three days.", "She's good at staying calm."], "negative": ["He isn't very good at coping with pressure.", "We didn't talk about it much."], "question": ["How long have you had it for?", "What helps you deal with stress?"], "short": ["Since Monday. / For a week.", "Exercise and sleep."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I'm good in managing stress.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I'm good at managing stress.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He missed school because of he was ill.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He missed school because he was ill. / He missed school because of his illness.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I've felt tired since three days.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I've felt tired for three days.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "I've had this headache ___ two days.", "section": "A · Choose the correct option.", "options": ["since", "for", "at"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She's really good ___ handling stressful situations.", "section": "A · Choose the correct option.", "options": ["in", "at", "with"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "He stayed home ___ a bad stomach ache.", "section": "A · Choose the correct option.", "options": ["because", "because of", "for"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "It's important to talk ___ your feelings instead of hiding them.", "section": "B · Complete with the correct preposition.", "reveal": "about", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I've felt more energetic ___ I started sleeping eight hours a night.", "section": "B · Complete with the correct preposition.", "reveal": "since", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She copes with pressure really well.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "I've been feeling low since a few weeks.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I've been feeling low for a few weeks.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "I've been feeling stressed ___ two weeks now, mostly ___ the amount of homework I have. Talking ___ my parents ___ it really helps me cope ___ the pressure.", "section": "Text · Complete with the correct preposition.", "reveal": "for / because of / to / about / with", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Finding Balance: A Student's Story", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think \"finding balance\" means for a student?", "Have you ever felt exhausted from doing too many things at once? What happened?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Finding Balance: A Student's Story", "num": 1, "total": 4, "text": "Last year, seventeen-year-old Deniz used to think that being busy meant being successful. Between classes, football practice, and a part-time weekend job, he barely had time to sleep, let alone see his friends. He used to skip breakfast most mornings and would often stay up past midnight finishing homework, telling himself that he could rest \"later.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Finding Balance: A Student's Story", "num": 2, "total": 4, "text": "Then, one Tuesday in November, everything caught up with him. While he was sitting in a maths lesson, Deniz suddenly felt dizzy and exhausted, and he couldn't concentrate on anything the teacher was saying. He went to see the school counsellor, who explained that his body and mind were showing clear signs of burnout — a state that happens when stress builds up for too long without enough rest, food, or social contact.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Finding Balance: A Student's Story", "num": 3, "total": 4, "text": "With the counsellor's help, Deniz slowly started to rebuild a more balanced routine. He began going to bed thirty minutes earlier, ate a proper breakfast, and — most importantly — made time each week to see his friends without talking about school at all. He also learned a short mindfulness exercise to do whenever he felt anxious before a test.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Finding Balance: A Student's Story", "num": 4, "total": 4, "text": "Six months later, Deniz still works hard, but he no longer believes that exhaustion is a sign of success. \"I used to think rest was a waste of time,\" he says, \"but now I know that looking after my physical, mental and social health is what actually helps me perform better — in football, in exams, and just in everyday life.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the main idea of the text?", "section": "While you read", "options": ["Deniz stopped playing football because of stress.", "Deniz learned that balancing physical, mental and social health matters more than staying constantly busy.", "The school counsellor told Deniz to stop studying completely."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Deniz's counsellor explained that his symptoms were signs of ___.", "section": "While you read", "reveal": "burnout", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which of these was NOT part of Deniz's new routine?", "section": "While you read", "options": ["Going to bed earlier", "Eating a proper breakfast", "Quitting football completely"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz felt dizzy while he was doing his weekend job.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz felt dizzy while he was sitting in a maths lesson.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Deniz learned a short ___ exercise to use whenever he felt anxious before a test.", "section": "While you read", "reveal": "mindfulness", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Do you agree with Deniz that being busy doesn't always mean being successful? Why or why not?", "Write one sentence describing a habit you used to have that you have now changed."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Hidden Link Between Sleep, Stress and Social Life", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think the connection is between sleep and getting ill?", "Do you think talking to friends can actually reduce stress? Why or why not?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Hidden Link Between Sleep, Stress and Social Life", "num": 1, "total": 4, "text": "Most teenagers know that sleep matters, but few realise how closely it is connected to both mental health and the immune system. When you don't get enough sleep, your body produces more of the stress hormone cortisol, which can make you feel more anxious and less able to concentrate. At the same time, a tired immune system finds it harder to fight off common illnesses, so poor sleepers often catch more colds during exam periods.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Hidden Link Between Sleep, Stress and Social Life", "num": 2, "total": 4, "text": "Chronic stress — stress that continues for weeks or months rather than a single stressful day — has a similar double effect. It doesn't just affect how we feel emotionally; research shows it can also weaken the immune system and even affect digestion and heart rate over time. This is why doctors increasingly describe physical and mental health as two sides of the same coin rather than separate issues.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Hidden Link Between Sleep, Stress and Social Life", "num": 3, "total": 4, "text": "Social health plays a surprisingly powerful role here too. Studies of students have found that those with strong social support — close friends, family, or a supportive club or team — tend to cope with stress far more effectively than those who feel isolated. Simply talking to someone about a problem, rather than facing it alone, appears to lower stress levels almost immediately.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Hidden Link Between Sleep, Stress and Social Life", "num": 4, "total": 4, "text": "The good news is that small changes can make a real difference. Experts recommend a consistent sleep schedule, at least one proper conversation a day with someone you trust, and short breaks for physical movement between long study sessions. None of these require expensive equipment or hours of free time — just a little planning and, perhaps, a change of mindset about what \"looking after yourself\" really means.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what happens when teenagers don't get enough sleep?", "section": "While you read", "options": ["Their immune system gets stronger.", "Their stress hormone levels rise and their immune system weakens.", "They automatically become more social."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Stress that continues for weeks or months, rather than a single day, is called ___ stress.", "section": "While you read", "reveal": "chronic", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "ques . Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "She's really good ___ dealing with stress.", "section": "Exit ticket", "options": ["in", "at", "with"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "I've felt tired since three days.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I've felt tired for three days.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Going for a walk always helps me ___ stress after a busy day.", "section": "Exit ticket", "options": ["cope with", "cope", "deal"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My little brother needs a lot of encouragement — he isn't very ___ when things go wrong.", "section": "Exit ticket", "options": ["resilient", "resilience", "resiliently"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "When I was a teenager, I ___ (would) spend hours playing video games every weekend.", "section": "Exit ticket", "reveal": "would", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order.", "section": "Exit ticket", "     DECKS.forEach(function (d) {
      d.screens.forEach(function (sc, i) {
        out += '<section class="pslide" style="--c:' + d.color + '"><div class="pslide-top"><span>' + esc(P.theme) + " · " + esc(d.title) + "</span><span>" + (i + 1) + " / " + d.screens.length + "</span></div>" +
          '<div class="pslide-body">' + screenHTML(sc, true) + "</div>" + (sc.note ? '<div class="pslide-note">' + esc(sc.note) + "</div>" : "") + "</section>";
      });
    });
    stage.innerHTML = out;
    return;
  }

  /* ---------- gezinme ---------- */
  function deck() { return DECKS[cur.d]; }
  function screen() { return deck().screens[cur.s]; }
  function render() {
    var d = deck(), sc = screen();
    root.style.setProperty("--c", d.color);
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    $(".pcount").textContent = (cur.s + 1) + " / " + d.screens.length;
    $(".pprog span").style.width = ((cur.s + 1) / d.screens.length * 100) + "%";
    $$(".pdeck").forEach(function (b, i) { b.setAttribute("aria-current", i === cur.d ? "true" : "false"); });
    var rb = $(".preveal"); rb.hidden = !canReveal(sc);
    rb.textContent = sc.type === "notice" && cur.step < sc.items.length && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    $(".pnotes-body").textContent = sc.note || "Bu ekran için not yok.";
    $(".pprev").disabled = cur.d === 0 && cur.s === 0;
    if (sc.timer) setTimer(sc.timer, false);
    try { history.replaceState(null, "", "#" + d.id + "-" + (cur.s + 1)); } catch (e) {}
    store.set("us:present:" + P.key, { d: cur.d, s: cur.s });
    bindStage(sc);
  }
  function go(dd, ss) { cur.d = dd; cur.s = ss; cur.revealed = false; cur.step = 0; render(); }
  function next() {
    var d = deck();
    if (cur.s < d.screens.length - 1) go(cur.d, cur.s + 1);
    else if (cur.d < DECKS.length - 1) go(cur.d + 1, 0);
  }
  function prev() {
    if (cur.s > 0) go(cur.d, cur.s - 1);
    else if (cur.d > 0) go(cur.d - 1, DECKS[cur.d - 1].screens.length - 1);
  }
  function reveal() {
    var sc = screen(); if (!canReveal(sc)) return;
    if (sc.type === "notice" && cur.step < sc.items.length) { cur.step++; if (cur.step >= sc.items.length) cur.revealed = true; }
    else cur.revealed = true;
    var keep = stage.querySelector(".porder-line") ? stage.querySelector(".porder-line").innerHTML : null;
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    if (keep !== null) stage.querySelector(".porder-line").innerHTML = keep;
    var rb = $(".preveal"); rb.textContent = sc.type === "notice" && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    bindStage(sc);
  }
  function bindStage(sc) {
    $$(".popt", stage).forEach(function (b) { b.addEventListener("click", function () { $$(".popt", stage).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); }); });
    var pl = stage.querySelector("[data-audio]");
    if (pl) { var au; pl.addEventListener("click", function () { if (!au) au = new Audio(pl.getAttribute("data-audio")); if (au.paused) { au.play().catch(function () {}); pl.textContent = "❚❚ Pause"; } else { au.pause(); pl.textContent = "▶ Play"; } }); }
    var hid = stage.querySelector(".phide"); if (hid) hid.addEventListener("click", function () { hid.classList.add("on"); cur.revealed = true; });
  }
  stage.addEventListener("click", function (e) {
    var c = e.target.closest(".pchipw"); if (!c) return;
    var line = stage.querySelector(".porder-line"), bank = stage.querySelector(".porder-bank");
    (c.parentNode === bank ? line : bank).appendChild(c);
  });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b && "speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(b.getAttribute("data-say")); u.lang = "en-GB"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  });

  /* ---------- araçlar: sayaç ---------- */
  var T = { left: 0, total: 0, id: null };
  var tbox = $(".ptimer");
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function drawT() { $(".ptime", tbox).textContent = fmt(T.left); tbox.classList.toggle("ending", T.left > 0 && T.left <= 10); tbox.classList.toggle("done", T.left === 0 && T.total > 0); }
  function setTimer(sec, start) { stopT(); T.left = T.total = sec; tbox.hidden = false; drawT(); if (start) startT(); }
  function startT() { if (T.id || !T.left) return; T.id = setInterval(function () { T.left--; drawT(); if (T.left <= 0) { stopT(); beep(); } }, 1000); $(".ptgo", tbox).textContent = "❚❚"; }
  function stopT() { clearInterval(T.id); T.id = null; if (tbox) $(".ptgo", tbox).textContent = "▶"; }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime + t); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {} }
  $(".ptgo", tbox).addEventListener("click", function () { T.id ? stopT() : startT(); });
  $$("[data-t]", tbox).forEach(function (b) { b.addEventListener("click", function () { setTimer(+b.getAttribute("data-t"), true); }); });
  $(".ptclose", tbox).addEventListener("click", function () { stopT(); tbox.hidden = true; });

  /* ---------- araçlar: rastgele öğrenci ---------- */
  var pick = $(".ppick"), used = [];
  $("#p-size").value = store.get("us:classsize", 30);
  function pickOne() {
    var n = Math.max(2, Math.min(60, +$("#p-size").value || 30)); store.set("us:classsize", n);
    if (used.length >= n) used = [];
    var r; do { r = 1 + Math.floor(Math.random() * n); } while (used.indexOf(r) >= 0);
    used.push(r);
    var big = $(".pnum", pick); var k = 0;
    var spin = setInterval(function () { big.textContent = 1 + Math.floor(Math.random() * n); if (++k > 10) { clearInterval(spin); big.textContent = r; } }, 60);
    $(".pused", pick).textContent = "Seçilenler: " + used.join(", ");
  }
  $(".pgo", pick).addEventListener("click", pickOne);
  $(".ppclose", pick).addEventListener("click", function () { pick.hidden = true; });

  /* ---------- araçlar: puan tablosu ---------- */
  var score = $(".pscore"), S = store.get("us:score:" + P.key, [0, 0]);
  function drawS() { $$(".pts", score).forEach(function (x, i) { x.textContent = S[i]; }); store.set("us:score:" + P.key, S); }
  $$("[data-sc]", score).forEach(function (b) { b.addEventListener("click", function () { var a = b.getAttribute("data-sc").split(","); S[+a[0]] = Math.max(0, S[+a[0]] + (+a[1])); drawS(); }); });
  $(".psreset", score).addEventListener("click", function () { S = [0, 0]; drawS(); });
  drawS();

  /* ---------- düğmeler & klavye ---------- */
  function tool(name) {
    if (name === "timer") { tbox.hidden = !tbox.hidden; }
    if (name === "pick") { pick.hidden = !pick.hidden; if (!pick.hidden) pickOne(); }
    if (name === "score") { score.hidden = !score.hidden; }
    if (name === "notes") { var n = $(".pnotes"); n.hidden = !n.hidden; }
    if (name === "full") { var d = document.documentElement; if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(function () {}); } else document.exitFullscreen(); }
  }
  $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { tool(b.getAttribute("data-tool")); }); });
  $(".pnext").addEventListener("click", next);
  $(".pprev").addEventListener("click", prev);
  $(".preveal").addEventListener("click", reveal);
  $$(".pdeck").forEach(function (b, i) { b.addEventListener("click", function () { go(i, 0); }); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,textarea,select")) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); next(); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); prev(); }
    else if (k === "r" || k === "enter") { e.preventDefault(); reveal(); }
    else if (k === "t") tool("timer"); else if (k === "p") tool("pick"); else if (k === "s") tool("score"); else if (k === "n") tool("notes"); else if (k === "f") tool("full");
  });
  // dokunmatik kaydırma
  var sx = null;
  stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) (dx < 0 ? next : prev)(); sx = null; });

  // başlangıç: hash ya da kayıtlı konum
  var m = (location.hash || "").match(/^#([a-z0-9-]+)-(\d+)$/), start = store.get("us:present:" + P.key, { d: 0, s: 0 });
  if (m) { DECKS.forEach(function (d, i) { if (d.id === m[1]) { start = { d: i, s: Math.min(+m[2] - 1, d.screens.length - 1) }; } }); }
  if (!DECKS[start.d] || !DECKS[start.d].screens[start.s]) start = { d: 0, s: 0 };
  go(start.d, start.s);
})();
</script></body></html>
