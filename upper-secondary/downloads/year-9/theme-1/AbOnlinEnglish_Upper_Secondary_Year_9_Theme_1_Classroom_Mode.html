<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sınıf Modu · Theme 1 School Life</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@400;600;700&display=swap"><style>/* Sınıf Modu — projeksiyon ve akıllı tahta için yüksek kontrast, büyük yazı */
.pres{--c:#2766D6;--ink:#131F3A;--muted:#5B6680;--line:#D9DEE8;--paper:#FFFFFF;--soft:#F2F4F8;
  position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--paper);color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pres *{box-sizing:border-box}
.pres button{font-family:inherit}
.pbar{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,2vw,24px);border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.pbrand{font:700 1rem/1 var(--sans,"Outfit");text-decoration:none;color:var(--ink);white-space:nowrap}
.pbrand .b1{color:#D9602A}.pbrand .b3{color:#23835A}
.pdecks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.pdeck{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.pdeck[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ptools{display:flex;gap:6px}
.ptool{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.ptool:hover{border-color:var(--c)}
.ptool kbd{font:600 .7rem/1 monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
@media (max-width:900px){.ptool kbd,.ptool .tl{display:none}}
.pstage{overflow:auto;display:grid;place-items:center;padding:clamp(16px,3vw,48px);border-top:6px solid var(--c)}
.pscreen{width:min(1200px,100%)}
.pk{font:700 clamp(.9rem,1.4vw,1.2rem)/1 var(--sans,"Outfit");letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.psec{font:700 clamp(.85rem,1.3vw,1.1rem)/1.2 "Outfit",sans-serif;color:var(--c);margin:0 0 1em;text-transform:none}
.p-title h1{font:700 clamp(2.6rem,7vw,6rem)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 .4em}
.p-block h2{font:700 clamp(1.8rem,4vw,3.4rem)/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 .5em;color:var(--ink)}
.pbig{font-size:clamp(1.4rem,3vw,2.6rem);line-height:1.35;margin:0 0 .6em}
.pmed{font-size:clamp(1.1rem,2.1vw,1.8rem);line-height:1.4;margin:0 0 .6em}
.ptrl{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--muted);margin:0 0 1em}
.ptrl b{font:700 .7em/1 monospace;background:var(--soft);padding:3px 6px;border-radius:4px;margin-right:6px}
.pchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:.8em}
.pchips span{font-size:clamp(1rem,1.8vw,1.5rem);padding:.35em .9em;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.pchips.alt span{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 35%,#fff);font-weight:600}
.pchips.big span{font-size:clamp(1.3rem,2.6vw,2.2rem)}
.plist{font-size:clamp(1.3rem,2.8vw,2.4rem);line-height:1.4;padding-left:1.2em;margin:0}
.plist li{margin-bottom:.4em}
.plist.small{font-size:clamp(1.1rem,2vw,1.7rem)}
.p-word{text-align:center}
.pw{font:700 clamp(3rem,10vw,8rem)/1 "Outfit",sans-serif;color:var(--c);letter-spacing:-.01em}
.pwm{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--muted);margin:.4em 0 1em;display:flex;gap:10px;justify-content:center;align-items:center}
.psay{border:0;background:var(--soft);border-radius:50%;width:56px;height:56px;font-size:1.5rem;cursor:pointer}
.phide{opacity:.08;filter:blur(8px);cursor:pointer;transition:all .25s}
.phide.on{opacity:1;filter:none}
.ptr{font:700 clamp(1.6rem,4vw,3.2rem)/1.2 "Outfit",sans-serif;margin:0 0 .4em}
.pex{font-size:clamp(1.2rem,2.5vw,2.1rem);font-style:italic;color:var(--ink);margin:0}
.pnotice{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:.5em}
.pnotice li{font-size:clamp(1.3rem,3vw,2.5rem);padding:.35em .6em;border-radius:12px;background:var(--soft);opacity:.08}
.pnotice li.on{opacity:1}
.pnotice mark{background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--ink);padding:0 .15em;border-radius:6px;font-weight:700}
.pask{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;opacity:0}
.pask.on{opacity:1}
.p-rule .pbig{font-weight:600}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pform div{background:var(--soft);border-radius:14px;padding:18px}
.pform h3{font:700 .95rem/1 "Outfit",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:0 0 .6em}
.pform p{font-size:clamp(1.1rem,2vw,1.7rem);margin:0 0 .3em}
.pq{font:600 clamp(1.6rem,4vw,3.4rem)/1.3 "Outfit",sans-serif;margin:0 0 .6em}
.pblank{display:inline-block;width:3.2em;border-bottom:4px solid var(--c);margin:0 .15em;vertical-align:-.1em}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.popt{display:flex;gap:14px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:.6em .9em;font-size:clamp(1.2rem,2.6vw,2.2rem);cursor:pointer;color:var(--ink)}
.popt b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);font-size:.7em;flex:none}
.popt.sel{border-color:var(--c)}
.popt.right{border-color:#23835A;background:#E1F3EA}
.popt.right b{background:#23835A;color:#fff}
.popt.dim{opacity:.4}
.pans{font:700 clamp(1.4rem,3.2vw,2.8rem)/1.3 "Outfit",sans-serif;color:#23835A;margin:.6em 0 0;opacity:0}
.pans.on{opacity:1}
.pans.big{font-size:clamp(1.6rem,3.8vw,3.2rem)}
.pcues{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pcues span{font:600 clamp(1.3rem,3vw,2.6rem)/1.2 "Outfit",sans-serif;padding:.3em .7em;border-radius:14px;border:3px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pcues i{font-style:normal;font-size:2rem;color:var(--muted)}
.porder-line{min-height:3.4em;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.porder-bank{display:flex;flex-wrap:wrap;gap:10px}
.pchipw{font:600 clamp(1.2rem,2.6vw,2.2rem)/1 "Outfit",sans-serif;padding:.4em .7em;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.porder-line .pchipw{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:var(--c)}
.pend{font-size:2rem;font-weight:700;margin:.2em 0}
.p-read .ptext{font-size:clamp(1.4rem,3vw,2.6rem);line-height:1.55;margin:0;max-width:40ch}
.pplay{font:700 1.4rem/1 "Outfit",sans-serif;padding:.6em 1.2em;border-radius:999px;border:0;background:var(--c);color:#fff;cursor:pointer;margin-bottom:1em}
.ptrans{font-size:clamp(1.1rem,2.2vw,1.8rem);opacity:0}
.ptrans.on{opacity:1}
.ptrans p{margin:0 0 .4em}
.plevels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:1em}
.plevels div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:clamp(1rem,1.6vw,1.3rem)}
.plevels b{display:block;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.muted{color:var(--muted)}

.pfoot{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,2vw,24px);border-top:1px solid var(--line);background:var(--paper)}
.pnav{min-width:64px;height:60px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:1.6rem;cursor:pointer;color:var(--ink)}
.pnav.pnext{background:var(--c);border-color:var(--c);color:#fff;min-width:120px;font-weight:700;font-size:1.1rem}
.pnav[disabled]{opacity:.35}
.preveal{height:60px;border-radius:16px;border:0;background:#23835A;color:#fff;font:700 1.1rem/1 "Outfit",sans-serif;padding:0 22px;cursor:pointer}
.pmid{flex:1;display:grid;gap:6px}
.pprog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.pprog span{display:block;height:100%;background:var(--c);width:0;transition:width .2s}
.pcount{font:600 .9rem/1 monospace;color:var(--muted)}

.pnotes{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;width:min(900px,94vw);background:#131F3A;color:#fff;border-radius:14px;padding:14px 18px;font-size:1rem;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30}
.pnotes b{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#F6A677;margin-bottom:4px}
.ptimer{position:fixed;right:18px;top:78px;z-index:30;background:#131F3A;color:#fff;border-radius:16px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ptimer .row1{display:flex;align-items:center;gap:10px}
.ptime{font:700 2.4rem/1 monospace;min-width:4ch;text-align:center}
.ptimer.ending .ptime{color:#F6A677}
.ptimer.done{background:#B8342D}
.ptimer button{border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;padding:6px 9px;cursor:pointer}
.ptimer .presets{display:flex;gap:4px}
.ppick{position:fixed;inset:0;z-index:40;background:rgba(19,31,58,.7);display:grid;place-items:center}
.ppick .card{background:#fff;border-radius:22px;padding:28px 34px;text-align:center;display:grid;gap:14px;min-width:min(420px,90vw)}
.pnum{font:700 clamp(5rem,16vw,11rem)/1 "Outfit",sans-serif;color:var(--c)}
.ppick label{font-size:.95rem;color:var(--muted)}
.ppick input{width:70px;font:600 1rem "Outfit";padding:6px;border:1.5px solid var(--line);border-radius:8px;margin-left:6px}
.ppick .row2{display:flex;gap:10px;justify-content:center}
.ppick .row2 button{border:0;border-radius:12px;padding:12px 18px;font:700 1rem "Outfit";cursor:pointer}
.pgo{background:var(--c);color:#fff}
.pused{font-size:.85rem;color:var(--muted)}
.pscore{position:fixed;left:18px;top:78px;z-index:30;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.pscore .team{display:flex;align-items:center;gap:8px}
.pscore .team b{min-width:70px}
.pscore .pts{font:700 2rem/1 monospace;min-width:2ch;text-align:center}
.pscore button{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-weight:700;cursor:pointer}
.pscore .psreset{width:auto;padding:0 10px;font-size:.8rem}
[hidden]{display:none!important}

/* baskı (slayt PDF) */
.pres.printing{position:static;display:block}
.pres.printing .pbar,.pres.printing .pfoot,.pres.printing .ptimer,.pres.printing .ppick,.pres.printing .pscore,.pres.printing .pnotes{display:none!important}
.pres.printing .pstage{display:block;padding:0;border:0;overflow:visible}
.pslide{break-after:page;width:297mm;height:209mm;box-sizing:border-box;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;border-top:5mm solid var(--c);padding:6mm 10mm 4mm}
.pslide-top{display:flex;justify-content:space-between;font-size:10pt;color:#5B6680}
.pslide-body{display:grid;align-content:center;zoom:.8;padding:0 6mm}
.pslide-note{font-size:9pt;color:#34405A;background:#F2F4F8;border-radius:6px;padding:6px 10px}
.pres.printing .phide,.pres.printing .pnotice li,.pres.printing .pask,.pres.printing .ptrans,.pres.printing .pans{opacity:1;filter:none}
@page{size:A4 landscape;margin:0}

yla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "To be (am/is/are): nationality and origin", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I <mark>am<\/mark> Turkish and I <mark>am<\/mark> from Balıkesir.", "Kasia <mark>is<\/mark> Polish. She <mark>is<\/mark> from Warsaw.", "We <mark>are<\/mark> students of different nationalities, but we <mark>aren't<\/mark> from the same country.", "<mark>Is<\/mark> Zoltán Hungarian? — Yes, he <mark>is<\/mark>. / No, he <mark>isn't<\/mark>."], "ask": "Which form of 'be' goes with I, with he/she, and with we/they? How do we make it negative and a question?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["am", "is", "are", "Is / Are"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "With I, we use ___.", "section": "Complete the rule", "reveal": "am", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "With he, she or it, we use ___.", "section": "Complete the rule", "reveal": "is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "With we, you or they, we use ___.", "section": "Complete the rule", "reveal": "are", "note": "Students write the answer, then check with a partner. Pick me country"], "reveal": "We aren't from the same country.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / Zoltán", "Hungarian"], "reveal": "Is Zoltán Hungarian?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["Leyla and Kasia", "not / from Türkiye"], "reveal": "Leyla and Kasia aren't from Türkiye.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "an exchange student"], "reveal": "Are you an exchange student?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about yourself and one classmate: your nationality, where you are from, and one thing you are not.", "chips": ["I am...", "I am from...", "My classmate is...", "We aren't..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I am Turkish.", "She is from Warsaw."], "negative": ["We aren't from the same country.", "He isn't Polish."], "question": ["Is Zoltán Hungarian?", "Are you an exchange student?"], "short": ["Yes, he is. / No, he isn't.", "Yes, we are. / No, we aren't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She are Polish.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is Polish.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge"  "reveal": "Are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "He are from Hungary.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He is from Hungary.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We are students of different nationalities.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Hi! ___ you new here?", "section": "Dialogue · Complete with am/is/are.", "reveal": "Are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, I ___. I ___ from Azerbaijan.", "section": "Dialogue · Complete with am/is/are.", "reveal": "am / am", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question.", "section": "Dialogue · Complete with am/is/are.", "words": ["is", "your", "capital", "city", "Baku"], "end": "?", "reveal": "Is your capital city Baku?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Can: possibility, opportunity and ability", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["In Istanbul, you <mark>can<\/mark> visit lots of famous mosques and palaces.", "Kasia <mark>can<\/mark> speak Polish, English and a little German.", "You <mark>can't<\/mark> see the northern lights in Türkiye — it's too far south.", "<mark>Can<\/mark> you visit the capital by train? — Yes, you <mark>can<\/mark>."], "ask": "Which sentences talk about what is possible to do in a place? Which talk about a language/skill ability? How do we make 'can' negative and a question?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["can", "can't", "Can", "base verb"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'___' shows something is possible or that someone has the ability to do it.", "section": "Complete the rule", "reveal": "can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative is '___', for things that are not possible.", "section": "Complete the rule", "reveal": "can't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a question, '___' comes before the subject.", "section": "Complete the rule", "reveal": "Can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After can/can't, we always use the ___ (no -s, no 'to').", "section": "Complete the rule", "reveal": "base verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use 'can' to talk about possibility or opportunity in a place, and about ability (including language skills). Negative: can't. Question: Can + subject + base verb? Always use the base verb after can/can't.", "tr": "'Can' bir yerde neyin mümkün olduğunu (imkan/fırsat) ve bir yeteneği anlatmak için kullanılır. Olumsuzda 'can't', soruda 'can' özneden önce gelir. Can'dan sonra fiilin yalın hâli kullanılır.", "when_en": "We use this to say what you can see or do in a country or city, and to talk about language skills and other abilities.", "when": "Bir ülkede/şehirde nelerin görülüp yapılabileceğini, ve bir dili/beceriyi ne kadar iyi bildiğimizi anlatırken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["in Istanbul", "visit", "famous mosques and palaces"], "reveal": "In Istanbul, you can visit famous mosques and palaces.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Kasia", "speak", "Polish, English and a little German"], "reveal": "Kasia can speak Polish, English and a little German.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "not / see", "the northern lights in Türkiye"], "reveal": "You can't see the northern lights in Türkiye.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "visit", "the capital by train"], "reveal": "Can you visit the capital by train?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["tourists", "climb", "the old castle tower"], "reveal": "Tourists can climb the old castle tower.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / we", "try", "the national dish at the festival"], "reveal": "Can we try the national dish at the festival?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences with can/can't about your own country: one about a tourist attraction, one about a language ability, and one negative sentence.", "chips": ["In my country, you can...", "I can speak...", "You can't..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["You can visit the old town on foot.", "She can speak three languages."], "negative": ["You can't see the sea from the capital.", "He can't speak Hungarian yet."], "question": ["Can you visit the castle at night?", "Can she speak Azerbaijani?"], "short": ["Yes, you can. / No, you can't.", "Yes, she can. / No, she can't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She can to speak three languages.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She can speak three languages.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She cans speak Polish.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She can speak Polish.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "In our capital, you ___ visit a famous old castle.", "section": "A · Choose the correct option.", "options": ["can", "is", "are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Kasia ___ speak Polish and English.", "section": "A · Choose the correct option.", "options": ["cans", "can", "is can"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "You ___ see the sea from our capital — it's inland.", "section": "A · Choose the correct option.", "options": ["can", "can't", "isn't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you visit the tourist attraction by bus?", "section": "A · Choose the correct option.", "options": ["Do", "Can", "Are"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "In Baku, you ___ (see) the famous Flame Towers.", "section": "B · Complete with can/can't.", "reveal": "can see", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Zoltán ___ (not/speak) Turkish, but he ___ (speak) English very well.", "section": "B · Complete with can/can't.", "reveal": "can't speak / can speak", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "You can to visit the monument for free.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You can visit the monument for free.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Tourists can try the national dish at the festival.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ you tell me about a tourist attraction in your country?", "section": "Dialogue · Complete with can/can't.", "reveal": "Can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Sure! You ___ visit our biggest castle — it's 800 years old.", "section": "Dialogue · Complete with can/can't.", "reveal": "can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about ability.", "section": "Dialogue · Complete with can/can't.", "words": ["can", "you", "speak", "any", "other", "languages"], "end": "?", "reveal": "Can you speak any other languages?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "My New Pen Pal from Poland", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think this blog post is about?", "Guess: what three things might Elif ask her new pen pal about?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My New Pen Pal from Poland", "num": 1, "total": 5, "text": "Hi, everyone! My name is Elif, and I'm a student at a school in Balıkesir, Türkiye. This month, our class started an international pen-pal project, and I'm so excited — my pen pal is Kasia, and she's from Poland!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My New Pen Pal from Poland", "num": 2, "total": 5, "text": "Kasia is Polish, and she is from Warsaw, the capital city of Poland. In her first email, she told me that Warsaw's official language is Polish, but she can also speak good English and a little German. I told her that I am Turkish, and my nearest big city is İzmir.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My New Pen Pal from Poland", "num": 3, "total": 5, "text": "Kasia says that in Warsaw, you can visit the Old Town, with its colourful buildings and the famous Royal Castle. You can also see a huge monument called the Palace of Culture and Science from almost anywhere in the city! She sent me a photo of the castle — it looks amazing.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My New Pen Pal from Poland", "num": 4, "total": 5, "text": "I wrote back and told her about my own country. I explained that Ankara is the capital of Türkiye, but I live near İstanbul, where you can visit incredible mosques, palaces and the famous Grand Bazaar. I also told her about our national day, the 29th of October, when we celebrate the founding of the Turkish Republic.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My New Pen Pal from Poland", "num": 5, "total": 5, "text": "Kasia and I are already planning to be video-call friends. We aren't in the same country, but with a pen pal like Kasia, the world feels a little smaller — and a lot more interesting!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A trip to Poland", "Elif's new international pen pal", "How to learn Polish"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Kasia's nationality?", "section": "While you read", "options": ["Turkish", "Hungarian", "Polish"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the capital city of Poland?", "section": "While you read", "options": ["Warsaw", "Kraków", "Gdańsk"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what can you visit in Warsaw?", "section": "While you read", "options": ["The Grand Bazaar", "The Old Town and the Royal Castle", "The Flame Towers"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Elif and Kasia are from the same country.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif and Kasia aren't from the same country — Elif is Turkish and Kasia is Polish.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does Elif say the world feels 'a little smaller'?", "section": "While you read", "options": ["Because she is moving to Poland", "Because having a pen pal connects her to another country", "Because Poland and Türkiye are very close"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If you had a pen pal from another country, what would you tell them about your country first? Write two sentences.", "Compare Elif's city with Kasia's city. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "International Day at Our School", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think happens on an 'International Day' at a school?", "Guess two things students might do to celebrate other countries at school."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "International Day at Our School", "num": 1, "total": 5, "text": "Every spring, our school celebrates International Day, and it's one of my favourite events of the year. Students from different classes prepare a small stand about a country — its flag, capital city, nationality, and one famous tourist attraction.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "International Day at Our School", "num": 2, "total": 5, "text": "This year, my group chose Azerbaijan. We learned that the capital of Azerbaijan is Baku, and that Azerbaijani is the official language there. We found out that in Baku, you can see the famous Flame Towers, which light up in different colours at night. We also made a poster with the flag and some facts about the population.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "International Day at Our School", "num": 3, "total": 5, "text": "Other groups presented Hungary and Poland. The Hungarian group explained that Budapest is the capital of Hungary, and that you can go sightseeing along the Danube River. The Polish group talked about Warsaw's Old Town and even brought a small national dish to try — everyone loved it!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "International Day at Our School", "num": 4, "total": 5, "text": "In the afternoon, each group gave a short presentation about their country. We answered questions like 'Can you tell us about a national day in this country?' and 'What can tourists do there?' It was a great chance to practise speaking and to learn about the world at the same time.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "International Day at Our School", "num": 5, "total": 5, "text": "At the end of the day, our teacher said that International Day helps us understand that although we come from different countries and speak different languages, we can still learn from each other and be good friends.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is International Day at this school?", "section": "While you read", "options": ["A sports competition", "A day when students present facts about different countries", "A national exam"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the capital of Azerbaijan?", "section": "While you read", "options": ["Baku", "Warsaw", "Budapest"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What can tourists see in Baku, according to the text?", "section": "While you read", "options": ["The Royal Castle", "The Flame Towers", "The Grand Bazaar"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What did the Hungarian group say you can do in Budapest?", "section": "While you read", "options": ["Go sightseeing along the Danube River", "Visit a famous castle", "Try a national dish"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Each group only made a poster and did not speak to the class.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Each group also gave a short presentation and answered questions.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the teacher's final comment suggest?", "section": "While you read", "options": ["Learning about other countries can build friendship and understanding", "International Day is not very useful", "Students should only study their own country"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If your school had an International Day, which country would you choose to present? Why?", "Write two sentences about what tourists can do in your own country or city."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Video Call with a New Friend", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a video call between Elif (from Türkiye) and Kasia (from Poland).", "Guess: what three questions might they ask each other about their countries?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Video Call with a New Friend", "audio": null, "transcript": [{"speaker": "Elif", "line": "Hi, Kasia! It's so nice to finally see you! I'm Elif, and I'm from Türkiye."}, {"speaker": "Kasia", "line": "Hi, Elif! Nice to meet you too. I'm Kasia, and I'm Polish — I'm from Warsaw."}, {"speaker": "Elif", "line": "Warsaw is the capital, isn't it? What's it like there?"}, {"speaker": "Kasia", "line": "Yes, it is! It's a big, busy city. You can visit the Old Town and see the Royal Castle — it's beautiful at night."}, {"speaker": "Elif", "line": "That sounds amazing. Can you speak any other languages besides Polish?"}, {"speaker": "Kasia", "line": "Yes, I can speak English and a little German. What about you — what's your capital?"}, {"speaker": "Elif", "line": "Our capital is Ankara, but I live near İstanbul. You can visit incredible mosques and palaces there."}, {"speaker": "Kasia", "line": "Wow, I'd love to see that one day! Can we talk again next week?"}, {"speaker": "Elif", "line": "Of course we can! Let's plan our International Day presentation together too."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is Kasia's nationality?", "section": "While you listen", "options": ["Turkish", "Hungarian", "Polish"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then r       case "audio":
        h = '<div class="p-block"><h2>' + esc(sc.title) + "</h2>" + (sc.audio ? '<button type="button" class="pplay" data-audio="' + esc(sc.audio) + '">▶ Play</button>' : '<p class="pmed muted">Ses kaydı yakında — transkripti öğretmen okuyabilir.</p>') +
          '<div class="ptrans' + (reveal ? " on" : "") + '">' + (sc.transcript || []).map(function (x) { return "<p><b>" + esc(x.speaker) + "</b> " + esc(x.line) + "</p>"; }).join("") + "</div></div>";
        break;
      case "task":
        h = '<div class="p-block"><p class="pk">' + esc(sc.kicker) + '</p><h2>' + esc(sc.title) + '</h2><p class="pmed">' + esc(sc.text) + "</p>" +
          (sc.steps && sc.steps.length ? '<ol class="plist small">' + sc.steps.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>" : "") +
          (sc.chips && sc.chips.length ? '<div class="pchips alt">' + sc.chips.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "") +
          (sc.levels && sc.levels.filter(Boolean).length ? '<div class="plevels">' + ["Support", "Core", "Extension"].map(function (l, i) { return sc.levels[i] ? "<div><b>" + l + "</b>" + esc(sc.levels[i]) + "</div>" : ""; }).join("") + "</div>" : "") + "</div>";
        break;
    }
    return h;
  }
  function canReveal(sc) { return ["word", "notice", "question", "cue", "audio"].indexOf(sc.type) >= 0 && !sc.shown; }

  /* ---------- baskı modu (slayt PDF) ---------- */
  if (PRINT) {
    root.classList.add("printing");
    var out = "";
    DECKS.forEach(function (d) {
      d.screens.forEach(function (sc, i) {
        out += '<section class="pslide" style="--c:' + d.color + '"><div class="pslide-top"><span>' + esc(P.theme) + " · " + esc(d.title) + "</span><span>" + (i + 1) + " / " + d.screens.length + "</span></div>" +
          '<div class="pslide-body">' + screenHTML(sc, true) + "</div>" + (sc.note ? '<div class="pslide-note">' + esc(sc.note) + "</div>" : "") + "</section>";
      });
    });
    stage.innerHTML = out;
    return;
  }

  /* ---------- gezinme ---------- */
  function deck() { return DECKS[cur.d]; }
  function screen() { return deck().screens[cur.s]; }
  function render() {
    var d = deck(), sc = screen();
    root.style.setProperty("--c", d.color);
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    $(".pcount").textContent = (cur.s + 1) + " / " + d.screens.length;
    $(".pprog span").style.width = ((cur.s + 1) / d.screens.length * 100) + "%";
    $$(".pdeck").forEach(function (b, i) { b.setAttribute("aria-current", i === cur.d ? "true" : "false"); });
    var rb = $(".preveal"); rb.hidden = !canReveal(sc);
    rb.textContent = sc.type === "notice" && cur.step < sc.items.length && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    $(".pnotes-body").textContent = sc.note || "Bu ekran için not yok.";
    $(".pprev").disabled = cur.d === 0 && cur.s === 0;
    if (sc.timer) setTimer(sc.timer, false);
    try { history.replaceState(null, "", "#" + d.id + "-" + (cur.s + 1)); } catch (e) {}
    store.set("us:present:" + P.key, { d: cur.d, s: cur.s });
    bindStage(sc);
  }
  function go(dd, ss) { cur.d = dd; cur.s = ss; cur.revealed = false; cur.step = 0; render(); }
  function next() {
    var d = deck();
    if (cur.s < d.screens.length - 1) go(cur.d, cur.s + 1);
    else if (cur.d < DECKS.length - 1) go(cur.d + 1, 0);
  }
  function prev() {
    if (cur.s > 0) go(cur.d, cur.s - 1);
    else if (cur.d > 0) go(cur.d - 1, DECKS[cur.d - 1].screens.length - 1);
  }
  function reveal() {
    var sc = screen(); if (!canReveal(sc)) return;
    if (sc.type === "notice" && cur.step < sc.items.length) { cur.step++; if (cur.step >= sc.items.length) cur.revealed = true; }
    else cur.revealed = true;
    var keep = stage.querySelector(".porder-line") ? stage.querySelector(".porder-line").innerHTML : null;
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    if (keep !== null) stage.querySelector(".porder-line").innerHTML = keep;
    var rb = $(".preveal"); rb.textContent = sc.type === "notice" && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    bindStage(sc);
  }
  function bindStage(sc) {
    $$(".popt", stage).forEach(function (b) { b.addEventListener("click", function () { $$(".popt", stage).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); }); });
    var pl = stage.querySelector("[data-audio]");
    if (pl) { var au; pl.addEventListener("click", function () { if (!au) au = new Audio(pl.getAttribute("data-audio")); if (au.paused) { au.play().catch(function () {}); pl.textContent = "❚❚ Pause"; } else { au.pause(); pl.textContent = "▶ Play"; } }); }
    var hid = stage.querySelector(".phide"); if (hid) hid.addEventListener("click", function () { hid.classList.add("on"); cur.revealed = true; });
  }
  stage.addEventListener("click", function (e) {
    var c = e.target.closest(".pchipw"); if (!c) return;
    var line = stage.querySelector(".porder-line"), bank = stage.querySelector(".porder-bank");
    (c.parentNode === bank ? line : bank).appendChild(c);
  });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b && "speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(b.getAttribute("data-say")); u.lang = "en-GB"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  });

  /* ---------- araçlar: sayaç ---------- */
  var T = { left: 0, total: 0, id: null };
  var tbox = $(".ptimer");
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function drawT() { $(".ptime", tbox).textContent = fmt(T.left); tbox.classList.toggle("ending", T.left > 0 && T.left <= 10); tbox.classList.toggle("done", T.left === 0 && T.total > 0); }
  function setTimer(sec, start) { stopT(); T.left = T.total = sec; tbox.hidden = false; drawT(); if (start) startT(); }
  function startT() { if (T.id || !T.left) return; T.id = setInterval(function () { T.left--; drawT(); if (T.left <= 0) { stopT(); beep(); } }, 1000); $(".ptgo", tbox).textContent = "❚❚"; }
  function stopT() { clearInterval(T.id); T.id = null; if (tbox) $(".ptgo", tbox).textContent = "▶"; }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime + t); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {} }
  $(".ptgo", tbox).addEventListener("click", function () { T.id ? stopT() : startT(); });
  $$("[data-t]", tbox).forEach(function (b) { b.addEventListener("click", function () { setTimer(+b.getAttribute("data-t"), true); }); });
  $(".ptclose", tbox).addEventListener("click", function () { stopT(); tbox.hidden = true; });

  /* ---------- araçlar: rastgele öğrenci ---------- */
  var pick = $(".ppick"), used = [];
  $("#p-size").value = store.get("us:classsize", 30);
  function pickOne() {
    var n = Math.max(2, Math.min(60, +$("#p-size").value || 30)); store.set("us:classsize", n);
    if (used.length >= n) used = [];
    var r; do { r = 1 + Math.floor(Math.random() * n); } while (used.indexOf(r) >= 0);
    used.push(r);
    var big = $(".pnum", pick); var k = 0;
    var spin = setInterval(function () { big.textContent = 1 + Math.floor(Math.random() * n); if (++k > 10) { clearInterval(spin); big.textContent = r; } }, 60);
    $(".pused", pick).textContent = "Seçilenler: " + used.join(", ");
  }
  $(".pgo", pick).addEventListener("click", pickOne);
  $(".ppclose", pick).addEventListener("click", function () { pick.hidden = true; });

  /* ---------- araçlar: puan tablosu ---------- */
  var score = $(".pscore"), S = store.get("us:score:" + P.key, [0, 0]);
  function drawS() { $$(".pts", score).forEach(function (x, i) { x.textContent = S[i]; }); store.set("us:score:" + P.key, S); }
  $$("[data-sc]", score).forEach(function (b) { b.addEventListener("click", function () { var a = b.getAttribute("data-sc").split(","); S[+a[0]] = Math.max(0, S[+a[0]] + (+a[1])); drawS(); }); });
  $(".psreset", score).addEventListener("click", function () { S = [0, 0]; drawS(); });
  drawS();

  /* ---------- düğmeler & klavye ---------- */
  function tool(name) {
    if (name === "timer") { tbox.hidden = !tbox.hidden; }
    if (name === "pick") { pick.hidden = !pick.hidden; if (!pick.hidden) pickOne(); }
    if (name === "score") { score.hidden = !score.hidden; }
    if (name === "notes") { var n = $(".pnotes"); n.hidden = !n.hidden; }
    if (name === "full") { var d = document.documentElement; if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(function () {}); } else document.exitFullscreen(); }
  }
  $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { tool(b.getAttribute("data-tool")); }); });
  $(".pnext").addEventListener("click", next);
  $(".pprev").addEventListener("click", prev);
  $(".preveal").addEventListener("click", reveal);
  $$(".pdeck").forEach(function (b, i) { b.addEventListener("click", function () { go(i, 0); }); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,textarea,select")) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); next(); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); prev(); }
    else if (k === "r" || k === "enter") { e.preventDefault(); reveal(); }
    else if (k === "t") tool("timer"); else if (k === "p") tool("pick"); else if (k === "s") tool("score"); else if (k === "n") tool("notes"); else if (k === "f") tool("full");
  });
  // dokunmatik kaydırma
  var sx = null;
  stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) (dx < 0 ? next : prev)(); sx = null; });

  // başlangıç: hash ya da kayıtlı konum
  var m = (location.hash || "").match(/^#([a-z0-9-]+)-(\d+)$/), start = store.get("us:present:" + P.key, { d: 0, s: 0 });
  if (m) { DECKS.forEach(function (d, i) { if (d.id === m[1]) { start = { d: i, s: Math.min(+m[2] - 1, d.screens.length - 1) }; } }); }
  if (!DECKS[start.d] || !DECKS[start.d].screens[start.s]) start = { d: 0, s: 0 };
  go(start.d, start.s);
})();
</script></body></html>
