s — she always shares her lunch.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "stubborn", "pos": "adjective", "ipa": "/ˈstʌbən/", "tr": "inatçı", "example": "My little brother is stubborn; he never changes his mind.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "shy", "pos": "adjective", "ipa": "/ʃaɪ/", "tr": "utangaç", "example": "She's shy in class, but talkative with close friends.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "outgoing", "pos": "adjective", "ipa": "/ˈaʊtɡəʊɪŋ/", "tr": "girişken, dışa dönük", "example": "Kerem is outgoing and makes new friends easily.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "reliable", "pos": "adjective", "ipa": "/rɪˈlaɪəbl/", "tr": "güvenilir", "example": "You can always count on Elif — she's very reliable.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "talkative", "pos": "adjective", "ipa": "/ˈtɔːkətɪv/", "tr": "konuşkan", "example": "My aunt is talkative and loves telling stories.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“çekici”", "options": ["brunette", "attractive", "honest"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sarışın”", "options": ["blond / blonde", "stubborn", "reliable"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“dalgalı saç”", "options": ["reliable", "wavy hair", "stubborn"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“kıvırcık saç”", "options": ["brunette", "outgoing", "curly hair"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“inatçı”", "options": ["stubborn", "curly hair", "wavy hair"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“utangaç”", "options": ["shy", "medium-height", "generous"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "To be: describing appearance and personality", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Elif <mark>is<\/mark> slim, and she <mark>is<\/mark> very cheerful.", "Kerem and his brother <mark>are<\/mark> tall, but they <mark>aren't<\/mark> talkative.", "My grandmother <mark>was<\/mark> attractive when she was young — now she <mark>is<\/mark> still elegant.", "<mark>Is<\/mark> your new neighbour friendly? — Yes, she <mark>is<\/mark>. She's also very generous."], "ask": "Which form of 'be' goes with I, with he/she, and with we/they? What kind of word comes after 'be' when we describe a person?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["is", "are", "adjective", "Is / Are"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "With he, she or it, we use ___.", "section": "Complete the rule", "reveal": "is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "With we, you or they, we use ___.", "section": "Complete the rule", "reveal": "are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After 'to be', we usually use an ___ to describe appearance or personality.", "section": "Complete the rule", "reveal": "adjective", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a question, we start with ___ + subject.", "section": "Complete the rule", "reveal": "Is / Are / Is/Are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use 'to be' with an adjective to describe a person's physical appearance and personality. Use am with I, is with he/she/it, and are with we/you/they. Negative: add 'not' (isn't, aren't). Question: put the 'be' verb before the subject.", "tr": "'To be' bir kişinin fiziksel görünüşünü ve kişiliğini anlatmak için sıfatlarla birlikte kullanılır. I ile am, he/she/it ile is, we/you/they ile are kullanılır. Olumsuzda 'not' eklenir (isn't, aren't); soruda be fiili özneden önce gelir.", "when_en": "We use this to describe a person's looks (height, hair colour, etc.) and character (cheerful, honest, etc.).", "when": "Bir kişinin dış görünüşünü (boy, saç rengi, vb.) ve kişiliğini (neşeli, dürüst, vb.) tanımlarken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["Elif", "slim", "cheerful"], "reveal": "Elif is slim. She is cheerful.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["Kerem and his brother", "tall", "not / talkative"], "reveal": "Kerem and his brother are tall. They aren't talkative.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my grandmother", "attractive", "when she was young"], "reveal": "My grandmother was attractive when she was young.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", " kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Elif ___ slim and cheerful.", "section": "A · Choose the correct option.", "options": ["am", "is", "are"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Kerem and his brother ___ tall.", "section": "A · Choose the correct option.", "options": ["is", "are", "am"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My best friend ___ moody at all.", "section": "A · Choose the correct option.", "options": ["isn't", "aren't", "don't"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ your neighbour friendly?", "section": "A · Choose the correct option.", "options": ["Do", "Is", "Are"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My grandmother ___ (not) tall, but she ___ very generous.", "section": "B · Complete with am/is/are.", "reveal": "isn't / is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ you outgoing or shy?", "section": "B · Complete with am/is/are.", "reveal": "Are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "He are handsome and honest.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He is handsome and honest.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "They are talkative and outgoing.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ your sister blonde or brunette?", "section": "Dialogue · Complete with am/is/are.", "reveal": "Is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: She ___ brunette, and she ___ very reliable too.", "section": "Dialogue · Complete with am/is/are.", "reveal": "is / is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about personality.", "section": "Dialogue · Complete with am/is/are.", "words": ["is", "your", "new", "neighbour", "generous"], "end": "?", "reveal": "Is your new neighbour generous?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Too and enough", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["This bag is <mark>too<\/mark> heavy for me to carry alone.", "My little brother is <mark>too<\/mark> stubborn to change his mind.", "She isn't confident <mark>enough<\/mark> to speak in front of the class yet.", "Are you <mark>brave enough<\/mark> to try the new club?"], "ask": "Does 'too' come before or after the adjective? Does 'enough' come before or after the adjective? Do both words show a problem, or something positive?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["too + adjective", "adjective + enough", "more than necessary", "not as much as necessary"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We say ___ (word order for too).", "section": "Complete the rule", "reveal": "too + adjective", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We say ___ (word order for enough).", "section": "Complete the rule", "reveal": "adjective + enough", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Too' means the amount is ___ — it's a problem.", "section": "Complete the rule", "reveal": "more than necessary", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'Not... enough' means the amount is ___ — it's also a problem.", "section": "Complete the rule", "reveal": "not as much as necessary", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "'Too' comes before the adjective and shows more than necessary — a problem (too + adjective). 'Enough' comes after the adjective and shows whether something is sufficient or not (adjective + enough). Both are often followed by 'to + verb'.", "tr": "'Too' sıfattan önce gelir ve gerekenden fazlasını, bir sorunu anlatır (too + sıfat). 'Enough' sıfattan sonra gelir ve yeterliliği ya da yetersizliği anlatır (sıfat + enough). Her ikisi de genellikle 'to + fiil' ile devam eder.", "when_en": "We use this to say that a quality or amount is more, or less, than what is needed.", "when": "Bir şeyin ya da bir kişinin özelliğinin, gereken miktardan fazla ya da az olduğunu anlatırken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["this bag", "too", "heavy"], "reveal": "This bag is too heavy for me to carry alone.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["my brother", "too", "stubborn", "change his mind"], "reveal": "My brother is too stubborn to change his mind.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she", "not / confident enough", "speak in front of the class"], "reveal": "She isn't confident enough to speak in front of the class.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / you", "brave enough", "try the new club"], "reveal": "Are you brave enough to try the new club?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["this shirt", "too", "small", "for him"], "reveal": "This shirt is too small for him.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["he", "not / patient enough", "wait quietly"], "reveal": "He isn't patient enough to wait quietly.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences about yourself or a friend using too and enough.", "chips": ["I am too...", "I am... enough to...", "My friend isn't... enough to..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["He is too shy to speak up.", "She is patient enough to wait."], "negative": ["She isn't confident enough.", "It isn't too difficult."], "question": ["Are you brave enough to try it?", "Is it too far to walk?"], "short": ["Yes, I am. / No, I'm not.", "Yes, it is. / No, it isn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She is enough tall to reach the shelf.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is tall enough to reach the shelf.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He is very stubborn to change his mind.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He is too stubborn to change his mind.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "This bag is ___ heavy for me.", "section": "A · Choose the correct option.", "options": ["too", "enough", "very"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "She isn't confident ___ to speak up.", "section": "A · Choose the correct option.", "options": ["too", "enough", "so"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My brother is ___ stubborn to listen to advice.", "section": "A · Choose the correct option.", "options": ["too", "enough", "as"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you brave enough to try the new club?", "section": "A · Choose the correct option.", "options": ["Do", "Are", "Is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "This shirt is ___ small for him.", "section": "B · Complete with too/enough.", "reveal": "too", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "He isn't patient ___ to wait quietly.", "section": "B · Complete with too/enough.", "reveal": "enough", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She is enough tall to see over the fence.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She is tall enough to see over the fence.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "He is too shy to speak in front of the class.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Is your cousin outgoing ___ to join the drama club?", "section": "Dialogue · Complete with too/enough.", "reveal": "enough", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Not really — she's ___ shy for the stage.", "section": "Dialogue · Complete with too/enough.", "reveal": "too", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a sentence about a problem with 'too'.", "section": "Dialogue · Complete with too/enough.", "words": ["this", "jacket", "is", "too", "small", "for", "me"], "end": ".", "reveal": "This jacket is too small for me.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "My Two Best Friends", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What kind of information do you expect in a text about two friends?", "Guess: what three adjectives might the writer use to describe her friends?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My Two Best Friends", "num": 1, "total": 5, "text": "I have two best friends, Elif and Kerem, and they are completely different from each other — but I love them both!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Best Friends", "num": 2, "total": 5, "text": "Elif is medium-height and slim, with straight, brunette hair and a few freckles on her nose. She is quiet in big groups, but she isn't shy with people she knows well. Elif is honest and reliable — if she promises something, she always keeps her word. She is also a little stubborn: once she decides something, it's very hard to change her mind!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Best Friends", "num": 3, "total": 5, "text": "Kerem, on the other hand, is tall with short, curly, blond hair. He's outgoing and talkative, and he's cheerful almost all the time. Kerem is generous too; he's always ready to share his notes or help a classmate with homework. He isn't patient enough to sit still for very long, though — he's always moving or talking!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Best Friends", "num": 4, "total": 5, "text": "Elif and Kerem aren't similar in appearance or personality, but they are both good, honest people, and that's why I'm lucky to have them as my best friends.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Two Best Friends", "num": 5, "total": 5, "text": "Next month, our class is doing a 'Guess the Person' project, and I'm going to describe one of them on a poster without saying their name. I think my classmates will guess correctly — Elif and Kerem are both easy to recognise once you know them!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A school project about posters", "The writer's two best friends", "How to make new friends"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Elif look like?", "section": "While you read", "options": ["Tall with curly blond hair", "Medium-height and slim with brunette hair", "Short with freckles and blond hair"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which word best describes Kerem's personality?", "section": "While you read", "options": ["Shy and quiet", "Outgoing and talkative", "Moody and stubborn"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what is Elif like when she makes a decision?", "section": "While you read", "options": ["She changes her mind easily", "She is stubborn about it", "She asks Kerem for advice"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Elif and Kerem look and behave in a very similar way.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif and Kerem aren't similar in appearance or personality.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why is the writer going to describe a friend on a poster?", "section": "While you read", "options": ["For a homework punishment", "For a class 'Guess the Person' project", "To sell it at a school fair"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Think of a friend of yours. Write two sentences describing their appearance and personality.", "Compare Elif and Kerem. Find one similarity and one difference between them."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The School Club Fair", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think happens at a 'club fair' at school?", "Guess: which personality traits help someone choose a school club?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The School Club Fair", "num": 1, "total": 5, "text": "Every September, our school holds a Club Fair, where every club has a small table so new students can find out what to join. This year, I helped my classmates find the right club by thinking about their personalities.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The School Club Fair", "num": 2, "total": 5, "text": "My friend Aslı is very outgoing and talkative, and she's confident enough to speak in front of a big group, so I suggested the Debate Club. She's also generous with her time and always helps younger students, so the Debate Club's mentoring programme is perfect for her.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The School Club Fair", "num": 3, "total": 5, "text": "My other friend, Burak, is a bit shy and quiet, but he's honest and extremely reliable — he never forgets a deadline. He isn't outgoing enough for the Drama Club, but he's a brilliant, patient artist, so the Art Club was an easy choice for him.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The School Club Fair", "num": 4, "total": 5, "text": "Then there's Zeynep, who is cheerful but sometimes a little moody before lunch! She's too creative and too energetic to sit still for long, so I recommended the Dance Club, where she can move around and express herself.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The School Club Fair", "num": 5, "total": 5, "text": "By the end of the fair, all three of my friends had signed up for a club that really suited their character. I think that's the secret: a club isn't just about a hobby — it's about finding people with a personality that matches your own.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the Club Fair mainly about?", "section": "While you read", "options": ["A sports competition", "Students choosing a club that matches their personality", "A test on personality vocabulary"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why is the Debate Club right for Aslı?", "section": "While you read", "options": ["She is shy and quiet", "She is outgoing, talkative and confident", "She loves painting"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Burak's personality like, according to the text?", "section": "While you read", "options": ["Shy but honest and reliable", "Outgoing and moody", "Talkative and stubborn"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", " "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Who Is She? — A Guessing Game", "audio": null, "transcript": [{"speaker": "Deniz", "line": "OK, I'm thinking of someone in our class. Ask me yes/no questions about her appearance!"}, {"speaker": "Aslı", "line": "Great! Is she tall or medium-height?"}, {"speaker": "Deniz", "line": "She's medium-height, actually."}, {"speaker": "Aslı", "line": "Is her hair blond or brunette?"}, {"speaker": "Deniz", "line": "She's brunette, with long, wavy hair."}, {"speaker": "Aslı", "line": "Does she have freckles?"}, {"speaker": "Deniz", "line": "Yes, she does — a few, on her nose."}, {"speaker": "Aslı", "line": "Is she talkative and outgoing?"}, {"speaker": "Deniz", "line": "Not really — she's quite shy in big groups, but she's very honest and reliable."}, {"speaker": "Aslı", "line": "I think I know! Is it Elif?"}, {"speaker": "Deniz", "line": "Yes, it is! Well done — your turn now!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is Deniz's height like?", "section": "While you listen", "options": ["Tall", "Medium-height", "Short"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is her hair like?", "section": "While you listen", "options": ["Short and blond", "Long and wavy, brunette", "Curly and grey"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the person's personality like?", "section": "While you listen", "options": ["Outgoing and talkative", "Shy, honest and reliable", "Moody and stubborn"], "answer": 1, "note":         break;
      case "task":
        h = '<div class="p-block"><p class="pk">' + esc(sc.kicker) + '</p><h2>' + esc(sc.title) + '</h2><p class="pmed">' + esc(sc.text) + "</p>" +
          (sc.steps && sc.steps.length ? '<ol class="plist small">' + sc.steps.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>" : "") +
          (sc.chips && sc.chips.length ? '<div class="pchips alt">' + sc.chips.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "") +
          (sc.levels && sc.levels.filter(Boolean).length ? '<div class="plevels">' + ["Support", "Core", "Extension"].map(function (l, i) { return sc.levels[i] ? "<div><b>" + l + "</b>" + esc(sc.levels[i]) + "</div>" : ""; }).join("") + "</div>" : "") + "</div>";
        break;
    }
    return h;
  }
  function canReveal(sc) { return ["word", "notice", "question", "cue", "audio"].indexOf(sc.type) >= 0 && !sc.shown; }

  /* ---------- baskı modu (slayt PDF) ---------- */
  if (PRINT) {
    root.classList.add("printing");
    var out = "";
    DECKS.forEach(function (d) {
      d.screens.forEach(function (sc, i) {
        out += '<section class="pslide" style="--c:' + d.color + '"><div class="pslide-top"><span>' + esc(P.theme) + " · " + esc(d.title) + "</span><span>" + (i + 1) + " / " + d.screens.length + "</span></div>" +
          '<div class="pslide-body">' + screenHTML(sc, true) + "</div>" + (sc.note ? '<div class="pslide-note">' + esc(sc.note) + "</div>" : "") + "</section>";
      });
    });
    stage.innerHTML = out;
    return;
  }

  /* ---------- gezinme ---------- */
  function deck() { return DECKS[cur.d]; }
  function screen() { return deck().screens[cur.s]; }
  function render() {
    var d = deck(), sc = screen();
    root.style.setProperty("--c", d.color);
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    $(".pcount").textContent = (cur.s + 1) + " / " + d.screens.length;
    $(".pprog span").style.width = ((cur.s + 1) / d.screens.length * 100) + "%";
    $$(".pdeck").forEach(function (b, i) { b.setAttribute("aria-current", i === cur.d ? "true" : "false"); });
    var rb = $(".preveal"); rb.hidden = !canReveal(sc);
    rb.textContent = sc.type === "notice" && cur.step < sc.items.length && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    $(".pnotes-body").textContent = sc.note || "Bu ekran için not yok.";
    $(".pprev").disabled = cur.d === 0 && cur.s === 0;
    if (sc.timer) setTimer(sc.timer, false);
    try { history.replaceState(null, "", "#" + d.id + "-" + (cur.s + 1)); } catch (e) {}
    store.set("us:present:" + P.key, { d: cur.d, s: cur.s });
    bindStage(sc);
  }
  function go(dd, ss) { cur.d = dd; cur.s = ss; cur.revealed = false; cur.step = 0; render(); }
  function next() {
    var d = deck();
    if (cur.s < d.screens.length - 1) go(cur.d, cur.s + 1);
    else if (cur.d < DECKS.length - 1) go(cur.d + 1, 0);
  }
  function prev() {
    if (cur.s > 0) go(cur.d, cur.s - 1);
    else if (cur.d > 0) go(cur.d - 1, DECKS[cur.d - 1].screens.length - 1);
  }
  function reveal() {
    var sc = screen(); if (!canReveal(sc)) return;
    if (sc.type === "notice" && cur.step < sc.items.length) { cur.step++; if (cur.step >= sc.items.length) cur.revealed = true; }
    else cur.revealed = true;
    var keep = stage.querySelector(".porder-line") ? stage.querySelector(".porder-line").innerHTML : null;
    stage.innerHTML = '<div class="pscreen">' + screenHTML(sc, cur.revealed) + "</div>";
    if (keep !== null) stage.querySelector(".porder-line").innerHTML = keep;
    var rb = $(".preveal"); rb.textContent = sc.type === "notice" && !cur.revealed ? "Sonraki cümle (R)" : "Cevabı göster (R)";
    bindStage(sc);
  }
  function bindStage(sc) {
    $$(".popt", stage).forEach(function (b) { b.addEventListener("click", function () { $$(".popt", stage).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); }); });
    var pl = stage.querySelector("[data-audio]");
    if (pl) { var au; pl.addEventListener("click", function () { if (!au) au = new Audio(pl.getAttribute("data-audio")); if (au.paused) { au.play().catch(function () {}); pl.textContent = "❚❚ Pause"; } else { au.pause(); pl.textContent = "▶ Play"; } }); }
    var hid = stage.querySelector(".phide"); if (hid) hid.addEventListener("click", function () { hid.classList.add("on"); cur.revealed = true; });
  }
  stage.addEventListener("click", function (e) {
    var c = e.target.closest(".pchipw"); if (!c) return;
    var line = stage.querySelector(".porder-line"), bank = stage.querySelector(".porder-bank");
    (c.parentNode === bank ? line : bank).appendChild(c);
  });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b && "speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(b.getAttribute("data-say")); u.lang = "en-GB"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  });

  /* ---------- araçlar: sayaç ---------- */
  var T = { left: 0, total: 0, id: null };
  var tbox = $(".ptimer");
  function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  function drawT() { $(".ptime", tbox).textContent = fmt(T.left); tbox.classList.toggle("ending", T.left > 0 && T.left <= 10); tbox.classList.toggle("done", T.left === 0 && T.total > 0); }
  function setTimer(sec, start) { stopT(); T.left = T.total = sec; tbox.hidden = false; drawT(); if (start) startT(); }
  function startT() { if (T.id || !T.left) return; T.id = setInterval(function () { T.left--; drawT(); if (T.left <= 0) { stopT(); beep(); } }, 1000); $(".ptgo", tbox).textContent = "❚❚"; }
  function stopT() { clearInterval(T.id); T.id = null; if (tbox) $(".ptgo", tbox).textContent = "▶"; }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime + t); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {} }
  $(".ptgo", tbox).addEventListener("click", function () { T.id ? stopT() : startT(); });
  $$("[data-t]", tbox).forEach(function (b) { b.addEventListener("click", function () { setTimer(+b.getAttribute("data-t"), true); }); });
  $(".ptclose", tbox).addEventListener("click", function () { stopT(); tbox.hidden = true; });

  /* ---------- araçlar: rastgele öğrenci ---------- */
  var pick = $(".ppick"), used = [];
  $("#p-size").value = store.get("us:classsize", 30);
  function pickOne() {
    var n = Math.max(2, Math.min(60, +$("#p-size").value || 30)); store.set("us:classsize", n);
    if (used.length >= n) used = [];
    var r; do { r = 1 + Math.floor(Math.random() * n); } while (used.indexOf(r) >= 0);
    used.push(r);
    var big = $(".pnum", pick); var k = 0;
    var spin = setInterval(function () { big.textContent = 1 + Math.floor(Math.random() * n); if (++k > 10) { clearInterval(spin); big.textContent = r; } }, 60);
    $(".pused", pick).textContent = "Seçilenler: " + used.join(", ");
  }
  $(".pgo", pick).addEventListener("click", pickOne);
  $(".ppclose", pick).addEventListener("click", function () { pick.hidden = true; });

  /* ---------- araçlar: puan tablosu ---------- */
  var score = $(".pscore"), S = store.get("us:score:" + P.key, [0, 0]);
  function drawS() { $$(".pts", score).forEach(function (x, i) { x.textContent = S[i]; }); store.set("us:score:" + P.key, S); }
  $$("[data-sc]", score).forEach(function (b) { b.addEventListener("click", function () { var a = b.getAttribute("data-sc").split(","); S[+a[0]] = Math.max(0, S[+a[0]] + (+a[1])); drawS(); }); });
  $(".psreset", score).addEventListener("click", function () { S = [0, 0]; drawS(); });
  drawS();

  /* ---------- düğmeler & klavye ---------- */
  function tool(name) {
    if (name === "timer") { tbox.hidden = !tbox.hidden; }
    if (name === "pick") { pick.hidden = !pick.hidden; if (!pick.hidden) pickOne(); }
    if (name === "score") { score.hidden = !score.hidden; }
    if (name === "notes") { var n = $(".pnotes"); n.hidden = !n.hidden; }
    if (name === "full") { var d = document.documentElement; if (!document.fullscreenElement) { (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(function () {}); } else document.exitFullscreen(); }
  }
  $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { tool(b.getAttribute("data-tool")); }); });
  $(".pnext").addEventListener("click", next);
  $(".pprev").addEventListener("click", prev);
  $(".preveal").addEventListener("click", reveal);
  $$(".pdeck").forEach(function (b, i) { b.addEventListener("click", function () { go(i, 0); }); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,textarea,select")) return;
    var k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); next(); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); prev(); }
    else if (k === "r" || k === "enter") { e.preventDefault(); reveal(); }
    else if (k === "t") tool("timer"); else if (k === "p") tool("pick"); else if (k === "s") tool("score"); else if (k === "n") tool("notes"); else if (k === "f") tool("full");
  });
  // dokunmatik kaydırma
  var sx = null;
  stage.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) (dx < 0 ? next : prev)(); sx = null; });

  // başlangıç: hash ya da kayıtlı konum
  var m = (location.hash || "").match(/^#([a-z0-9-]+)-(\d+)$/), start = store.get("us:present:" + P.key, { d: 0, s: 0 });
  if (m) { DECKS.forEach(function (d, i) { if (d.id === m[1]) { start = { d: i, s: Math.min(+m[2] - 1, d.screens.length - 1) }; } }); }
  if (!DECKS[start.d] || !DECKS[start.d].screens[start.s]) start = { d: 0, s: 0 };
  go(start.d, start.s);
})();
</script></body></html>
