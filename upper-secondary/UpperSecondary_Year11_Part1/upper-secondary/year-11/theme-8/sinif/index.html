": "The federation announced the new training schedule.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "claim", "pos": "verb", "ipa": "/kleɪm/", "tr": "iddia etmek", "example": "The coach claimed his team deserved to win.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "admit", "pos": "verb", "ipa": "/ədˈmɪt/", "tr": "kabul etmek, itiraf etmek", "example": "The captain admitted that the team had played poorly.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "explain", "pos": "verb", "ipa": "/ɪkˈspleɪn/", "tr": "açıklamak", "example": "The coach explained why he changed the tactics.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "word", "word": "deny", "pos": "verb", "ipa": "/dɪˈnaɪ/", "tr": "reddetmek, inkâr etmek", "example": "The player denied breaking the rules of the game.", "note": "Say it twice, class repeats (chorus → rows → individuals). Ask for a guess before revealing the meaning. / İki kez söyleyin, koro–sıra–bireysel tekrar; anlamı açmadan tahmin ettirin."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“turnuva”", "options": ["coach", "tournament", "injury"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“sakatlık”", "options": ["injury", "press conference", "championship"], "answer": 0, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“taraftar”", "options": ["headline", "supporter", "victory"], "answer": 1, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“stadyum”", "options": ["victory", "tournament", "stadium"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“gol/puan atmak; skor”", "options": ["athlete", "report", "score"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}, {"type": "question", "qtype": "mcq", "section": "Quick game · What's the word?", "q": "“açıklamak”", "options": ["defeat", "interview", "explain"], "answer": 2, "note": "Team game: teams take turns; use the scoreboard. / Takım oyunu: sırayla cevap, puan tablosunu kullanın."}]}, {"id": "grammar-0", "title": "Gramer 1", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Reported Speech — Statements & Tense Back-shift", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Direct: \"I am tired,\" said the coach. → Reported: The coach said he <mark>was<\/mark> tired.", "Direct: \"We trained hard,\" she said. → Reported: She said they <mark>had trained<\/mark> hard.", "Direct: \"I will play tomorrow,\" he said. → Reported: He said he <mark>would play<\/mark> the next day.", "Direct: \"I can run fast,\" the athlete said. → Reported: The athlete said she <mark>could run<\/mark> fast."], "ask": "What happens to the verb tense when a direct statement becomes reported speech?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["was", "had won", "would train", "could not play"], "chips": true, "text": "Complete the reported sentences with the correct back-shifted verb form.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "\"I am nervous,\" she said. → She said she ___ nervous.", "section": "Complete the rule", "reveal": "was", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"We won the match,\" the captain said. → The captain said they ___ the match.", "section": "Complete the rule", "reveal": "had won", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"I will train every day,\" the athlete said. → The athlete said she ___ every day.", "section": "Complete the rule", "reveal": "would train", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"I can't play tonight,\" he said. → He said he ___ tonight.", "section": "Complete the rule", "reveal": "could not play", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "When we report a statement, the reporting verb (said, told) is usually in the past, so the tense of the original statement moves one step back into the past: present simple → past simple, present continuous → past continuous, past simple → past perfect, will → would, can → could.", "tr": "Bir ifadeyi aktarırken, aktaran fiil (said, told) genellikle geçmiş zamanda olduğu için, orijinal cümlenin zamanı bir adım geriye kayar: geniş zaman → geçmiş zaman, şimdiki zaman → geçmiş zamanın hikayesi, geçmiş zaman → miş'li geçmiş (had + V3), will → would, can → could.", "when_en": "We use reported speech to tell someone what another person said, without quoting their exact words — very common in sports news reports and interview summaries.", "when": "Reported speech, başka birinin söylediklerini onun tam kelimelerini alıntılamadan aktarmak için kullanılır — spor haberlerinde ve röportaj özetlerinde çok sık görülür.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["coach", "say", "team / play well"], "reveal": "The coach said the team had played well.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["captain", "say", "he / be / proud"], "reveal": "The captain said he was proud.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["referee", "say", "the goal / not count"], "reveal": "The referee said the goal did not count.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["athlete", "say", "she / win / next time"], "reveal": "The athlete said she would win next time.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["coach", "say", "players / need / more training"], "reveal": "The coach said the players needed more training.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["reporter", "say", "the match / start / late"], "reveal": "The reporter said the match had started late.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["fan", "say", "the team / play / better than last year"], "reveal": "The fan said the team was playing better than last year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences reporting something a coach, athlete, or commentator said about a sports event.", "chips": ["The coach said...", "The commentator explained that...", "The player admitted that..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Subject + said/told (object) + (that) + clause with back-shifted tense"], "negative": ["Subject + said + (that) + subject + did not/had not + verb"], "question": ["Not used for statements — see reporting questions in a later theme."], "short": ["He said he was tired.", "She told me she had trained hard."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He said he is tired.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He said he was tired.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She told that she won the race.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She said that she had won the race.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "\"I am ready for the match,\" she said. → She said she ___ ready for the match.", "section": "", "reveal": "was", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"We trained all summer,\" the team said. → The team said they ___ all summer.", "section": "", "reveal": "had trained", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "\"I will score a goal,\" the striker said. Reported speech:", "section": "", "options": ["The striker said he will score a goal.", "The striker said he would score a goal.", "The striker said he scored a goal.", "The striker says he would score a goal."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "\"I can't play today,\" he said. → He said he can't play today.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He said he could not play that day.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "\"The referee made a mistake,\" the coach said.", "section": "", "reveal": "The coach said (that) the referee had made a mistake.", "prompt": "The coach said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: he / said / tired / was / the coach", "section": "", "words": ["the", "coach", "said", "he", "was", "tired"], "end": ".", "reveal": "The coach said he was tired.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "\"I am watching the match,\" she said. → She said she ___ the match.", "section": "", "reveal": "was watching", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "\"We have won three championships,\" the captain said proudly.", "section": "", "reveal": "The captain said proudly (that) they had won three championships.", "prompt": "The captain said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "\"I could not train yesterday because of my injury,\" the athlete said. Reported speech:", "section": "", "options": ["The athlete said she could not train the day before because of her injury.", "The athlete said she cannot train yesterday because of her injury.", "The athlete said she could not train yesterday because of her injury.", "The athlete says she could not train the day before because of her injury."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Reported Speech — Pronouns, Time Expressions & Reporting Verbs", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["Direct: \"I will win tomorrow,\" she said. → Reported: She said <mark>she<\/mark> would win <mark>the next day<\/mark>.", "Direct: \"We played here last week,\" they said. → Reported: They said <mark>they<\/mark> had played <mark>there the week before<\/mark>.", "Direct: \"This is my best season,\" the athlete said. → Reported: The athlete said <mark>that was her<\/mark> best season.", "Direct: \"I'm training now,\" he said. → Reported: He said he was training <mark>then<\/mark>."], "ask": "How do pronouns and time/place words change when direct speech becomes reported speech?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["the day before", "her", "that day", "there"], "chips": true, "text": "Complete the sentence with the correct pronoun or time expression.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "\"I trained here yesterday,\" she said. → She said she had trained ___ the day before.", "section": "Complete the rule", "reveal": "there", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"My coach helped me,\" she said. → She said ___ coach had helped her.", "section": "Complete the rule", "reveal": "her", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"We play tomorrow,\" the players said. → The players said they would play ___.", "section": "Complete the rule", "reveal": "the day before", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"I saw the match today,\" he said. → He said he had seen the match ___.", "section": "Complete the rule", "reveal": "that day", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "In reported speech, pronouns change to match the reporter's point of view (I → he/she, my → his/her, we → they), and time/place expressions shift away from the moment of speaking (today → that day, tomorrow → the next day, yesterday → the day before, here → there). We also choose the reporting verb carefully: 'say' does not take a personal object (say something), while 'tell' needs one (tell someone something).", "tr": "Reported speech'te zamirler, aktaran kişinin bakış açısına göre değişir (I → he/she, my → his/her, we → they); zaman/yer ifadeleri de konuşma anından uzaklaşacak şekilde değişir (today → that day, tomorrow → the next day, yesterday → the day before, here → there). Ayrıca aktaran fiil dikkatle seçilir: 'say' kişisel bir nesne almaz (say something), 'tell' ise bir nesneye ihtiyaç duyar (tell someone something).", "when_en": "We use these changes whenever the reporting happens at a different time or place from the original statement — for example, a journalist reporting a coach's comments a day after they were made.", "when": "Bu değişiklikler, aktarma işlemi orijinal ifadenin söylendiği zamandan veya yerden farklı bir zaman/yerde yapıldığında kullanılır — örneğin bir gazetecinin, bir antrenörün yorumlarını ertesi gün aktarması gibi.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["player", "tell", "reporter", "I / feel / great today"], "reveal": "The player told the reporter (that) he felt great that day.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["coach", "tell", "journalist", "my team / train / hard this week"], "reveal": "The coach told the journalist (that) his team was training hard that week.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["captain", "say", "we / meet / here tomorrow"], "reveal": "The captain said (that) they would meet there the next day.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["athlete", "tell", "fans", "I / retire / next year"], "reveal": "The athlete told the fans (that) she would retire the following year.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["referee", "explain", "the decision / be / correct"], "reveal": "The referee explained (that) the decision was correct.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["commentator", "add", "this match / be / the best of the season"], "reveal": "The commentator added (that) that match was the best of the season.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Imagine you interviewed an athlete yesterday. Write 2-3 sentences reporting what they said, using 'told' at least once and changing pronouns/time expressions correctly.", "chips": ["The athlete told me that...", "She explained that...", "He added that..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Subject + said/told (object) + (that) + clause with adjusted pronouns & time/place words"], "negative": ["Subject + said/told + (that) + subject + did not/had not + verb (adjusted pronouns & time/place words)"], "question": ["Not covered in this point — see statement patterns above."], "short": ["He told me he was training then.", "They said they had played there."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She said me she was tired.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She told me she was tired.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He said he will play here tomorrow.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He said he would play there the next day.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "\"I feel great,\" the athlete said. → The athlete said ___ felt great.", "section": "", "reveal": "she", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "\"We will train tomorrow,\" the coach said. → The coach said they would train ___.", "section": "", "reveal": "the next day", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "\"My team played well here,\" the captain said. Reported speech:", "section": "", "options": ["The captain said his team had played well here.", "The captain said his team had played well there.", "The captain said my team had played well there.", "The captain said his team plays well there."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "\"I saw the match yesterday,\" she told me. → She told me she had seen the match yesterday.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She told me she had seen the match the day before.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "\"I will meet you here tomorrow,\" the reporter said.", "section": "", "reveal": "The reporter said (that) he/she would meet me there the next day.", "prompt": "The reporter said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Put the words in order: the coach / his / team / said / had trained / hard", "section": "", "words": ["the", "coach", "said", "his", "team", "had", "trained", "hard"], "end": ".", "reveal": "The coach said his team had trained hard.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "\"We won this championship last year, and we will win it again next year,\" the captain told the fans.", "section": "", "reveal": "The captain told the fans (that) they had won that championship the year before, and they would win it again the following year.", "prompt": "The captain told the fans...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly reports: \"I am not playing well this season,\" the striker admitted.", "section": "", "options": ["The striker admitted he is not playing well this season.", "The striker admitted he was not playing well that season.", "The striker admitted he was not play well that season.", "The striker admits he was not playing well this season."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Historic Win for the City Team", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think happened in the match?", "Have you ever watched a match that ended in a surprising result?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Historic Win for the City Team", "num": 1, "total": 4, "text": "Last Saturday, the City Basketball Team achieved a historic victory in the regional championship final, defeating their long-time rivals by a score of 78 to 74. The match, held at the packed City Sports Hall, kept thousands of supporters on the edge of their seats until the final minute.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Historic Win for the City Team", "num": 2, "total": 4, "text": "After the game, the team captain spoke to reporters. She said she had never felt so proud of her teammates. She explained that the players had trained twice a day for the past month and that their hard work had finally paid off. She also added that the whole team had believed in victory even when they were losing by ten points in the third quarter.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Historic Win for the City Team", "num": 3, "total": 4, "text": "The coach told journalists that the turning point of the match had come when a young substitute player scored three important baskets in a row. He said the young player had shown great courage under pressure and that he was extremely proud of the entire squad. He also mentioned that the team would begin preparing immediately for the national tournament next month.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Historic Win for the City Team", "num": 4, "total": 4, "text": "Fans who attended the match praised both teams for their sportsmanship. One supporter said the atmosphere in the hall had been unforgettable, with both sets of fans cheering loudly throughout the game. Local newspapers described the victory as one of the most exciting sporting moments the city had seen in years, and many are already looking forward to the national tournament.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What was the final score of the match?", "section": "While you read", "options": ["74 to 78", "78 to 74", "80 to 74", "78 to 70"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The captain said she had never felt so proud of her teammates.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The coach said the turning point came when a young ___ player scored three baskets in a row.", "section": "While you read", "reveal": "substitute", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what will the team do next?", "section": "While you read", "options": ["Retire from competition", "Change their coach", "Prepare for the national tournament", "Play a friendly match"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in reported speech: \"The atmosphere in the hall was unforgettable,\" the supporter said.", "section": "While you read", "reveal": "The supporter said (that) the atmosphere in the hall had been unforgettable.", "prompt": "The supporter said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The team had been losing by ten points in the third quarter before the comeback.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you read", "list": ["Why do you think the captain mentioned the team's training schedule?", "Do you think fair sportsmanship is as important as winning? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Interview: Life of a Young Athlete", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What questions would you ask a young professional athlete?", "What do you think is the hardest part of being a professional athlete?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Interview: Life of a Young Athlete", "num": 1, "total": 5, "text": "Our school magazine recently interviewed Deniz Aksoy, a nineteen-year-old swimmer who recently qualified for the national team. In the interview, Deniz talked openly about training, sacrifice, and staying motivated.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Interview: Life of a Young Athlete", "num": 2, "total": 5, "text": "When asked about her daily routine, Deniz explained that she woke up at five every morning to train before school. She said that balancing school work and swimming was the most difficult part of her life as a student athlete. She added that her family had always supported her, even when she felt like giving up.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Interview: Life of a Young Athlete", "num": 3, "total": 5, "text": "The interviewer asked Deniz what advice she would give to young people who wanted to become athletes. She replied that discipline was more important than natural talent, and she said that anyone could improve with consistent practice. She also mentioned that she had failed to qualify for the national team twice before finally succeeding this year.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Interview: Life of a Young Athlete", "num": 4, "total": 5, "text": "Deniz told the interviewer that her biggest goal was to represent her country at an international competition. She said she was not afraid of losing, because every competition taught her something new. Finally, she admitted that without the support of her coach and family, she would never have achieved her dream.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Interview: Life of a Young Athlete", "num": 5, "total": 5, "text": "The interview ended with Deniz thanking her school for allowing her to combine her studies with intense training, and she encouraged other students to follow their passions, whatever they might be.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "gap", "q": "Deniz said she woke up at ___ every morning to train.", "section": "While you read", "reveal": "five", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "According to Deniz, what is more important than natural talent?", "section": "While you read", "options": ["Money", "Discipline", "Luck", "Equipment"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz qualified for the national team on her first attempt.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She had failed to qualify twice before finally succeeding this year.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in reported speech: \"My family has always supported me,\" Deniz said.", "section": "While you read", "reveal": "Deniz said (that) her family had always supported her.", "prompt": "Deniz said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What is Deniz's biggest goal, according to the interview?", "section": "While you read", "options": ["To become a coach", "To win a scholarship", "To represent her country internationally", "To change sports"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What personal quality do you think helped Deniz succeed the most?", "Would you be willing to make similar sacrifices for a goal you care about?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Radio Sports News: Local Derby Result", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What information do you expect to hear in a radio sports news report?", "Predict two facts you might hear about a football match result."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Radio Sports News: Local Derby Result", "audio": null, "transcript": [{"speaker": "Presenter", "line": "Good evening, and welcome to Sports Tonight. Let's start with today's big local derby."}, {"speaker": "Reporter", "line": "Thanks. This afternoon, the Riverside Football Club defeated their city rivals two goals to one, in front of a full stadium."}, {"speaker": "Presenter", "line": "What did the Riverside coach say after the match?"}, {"speaker": "Reporter", "line": "He said his players had shown incredible determination, especially in the second half. He also said the team had worked on set pieces all week, and that the training had clearly paid off."}, {"speaker": "Presenter", "line": "And what about the losing side? Did their coach comment?"}, {"speaker": "Reporter", "line": "Yes, he admitted his team had made too many mistakes in defence. He said they would review the match carefully before their next game."}, {"speaker": "Presenter", "line": "Any news about injuries?"}, {"speaker": "Reporter", "line": "The Riverside captain told us that one of the defenders had felt pain in his ankle, but the club doctor said it was not serious."}, {"speaker": "Presenter", "line": "Thanks for the update. Now let's move on to tonight's basketball results."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "gap", "q": "Riverside won the match by ___ goals to one.", "section": "While you listen", "reveal": "two", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The Riverside coach said the training on set pieces had paid off.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What did the losing coach admit?", "section": "While you listen", "options": ["That the referee was unfair", "That his team had made too many mistakes in defence", "That his best player was injured", "That the stadium was too small"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in reported speech: \"It is not serious,\" the club doctor said.", "section": "While you listen", "reveal": "The club doctor said (that) it was not serious.", "prompt": "The club doctor said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you listen", "list": ["What differences did you notice between the winning coach's and the losing coach's comments?", "How does a reporter usually introduce what a coach 'said'?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Interview: A Coach Talks About the New Season", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What questions might a journalist ask a coach at the start of a new season?", "What kind of goals do sports teams usually set at the beginning of a season?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Interview: A Coach Talks About the New Season", "audio": null, "transcript": [{"speaker": "Journalist", "line": "Coach, thank you for joining us. How do you feel about the new season?"}, {"speaker": "Coach", "line": "I feel optimistic. I told the players last week that this season would be different from the last one."}, {"speaker": "Journalist", "line": "What changes have you made to the team?"}, {"speaker": "Coach", "line": "We brought in two new players, and I explained to the whole squad that everyone would need to work harder in training."}, {"speaker": "Journalist", "line": "Some fans say the team's biggest weakness last year was defence. Do you agree?"}, {"speaker": "Coach", "line": "Yes, I do. I admitted to the players that our defence had been too weak, and we have spent extra time fixing that problem."}, {"speaker": "Journalist", "line": "What is your main goal for this season?"}, {"speaker": "Coach", "line": "I told the board that our goal was to finish in the top three. I said the players were ready and that they believed in themselves."}, {"speaker": "Journalist", "line": "Thank you, coach, and good luck this season."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What did the coach tell the players about the new season?", "section": "While you listen", "options": ["It would be the same as last season", "It would be different from last season", "It would be his last season", "It would be shorter than usual"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The coach admitted the team's defence had been too weak.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The coach told the board that the goal was to finish in the top ___.", "section": "While you listen", "reveal": "three", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in reported speech: \"Everyone will need to work harder,\" the coach explained.", "section": "While you listen", "reveal": "The coach explained (that) everyone would need to work harder.", "prompt": "The coach explained...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you listen", "list": ["Do you think the coach's goal (finishing in the top three) is realistic? Why or why not?", "Which reporting verbs did the coach use to describe his own words to others (told, explained, admitted, said)?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Athlete Interview Role-Play", "text": "One student plays a journalist and the other plays an athlete or coach after an important match. The journalist asks at least five questions; the athlete/coach answers in character. Afterwards, each pair reports three things their partner said to the class using reported speech.", "steps": ["In pairs, decide who is the journalist and who is the athlete/coach.", "The journalist prepares 5 interview questions about a recent match or competition.", "Role-play the interview, speaking naturally.", "Swap roles and repeat with a new topic.", "Each student reports 3 things their partner said to the class, using reported speech."], "chips": ["Can you tell us how you feel about...?", "What was the turning point of the match?", "I felt that...", "Our coach told us that...", "He/She said (that)...", "He/She told me (that)..."], "timer": 600, "levels": ["Give weaker pairs a list of ready-made interview questions and sentence starters for reporting ('He said that...', 'She told me that...').", "Students create their own questions and answers, then report using at least two different reporting verbs.", "Stronger pairs add follow-up questions and report using a wider range of reporting verbs (admit, explain, claim, deny)."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Sports Debate: Fair Play vs Winning at All Costs", "text": "In small groups, students discuss whether winning is more important than playing fairly, using examples from sports they know. Each group presents a short summary of their discussion to the class, including at least one reported statement from a group member.", "steps": ["In groups, discuss: Is it acceptable to break the rules if it helps your team win?", "Give real or imagined examples of fair play and unfair play in sports.", "Agree on a short group opinion.", "Choose one group member to summarise the discussion for the class, quoting a group member's opinion in reported speech."], "chips": ["In my opinion...", "I think fair play is more important because...", "Some people believe that...", "One of my classmates said that...", "I disagree because..."], "timer": 600, "levels": ["Provide a simple opinion frame: 'I think... because...' and a short vocabulary list (fair, unfair, rule, cheat, respect).", "Students give reasons and at least one real or invented example to support their opinion.", "Stronger groups compare fair play rules across two different sports and report contrasting opinions from group members."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Write a Sports News Report", "text": "Write a short sports news report about an imaginary match or competition. Include a headline, the result, at least two reported statements from a player or coach, and a closing sentence about what happens next.", "steps": ["Choose a sport and decide the result of the match/competition.", "Write a short, catchy headline.", "Note down 2-3 quotes a player or coach might have said.", "Turn those quotes into reported speech for your report.", "Add a final sentence about future plans (next match, tournament, etc.)."], "chips": ["championship", "victory", "defeat", "score", "supporters", "stadium", "The coach said (that)...", "The captain told reporters (that)...", "He/She added that...", "The match ended..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "Interview Script and Summary", "text": "Write a short interview script (5 questions and answers) with an imaginary athlete or coach about a recent competition. Then write a short paragraph (4-6 sentences) summarising the interview using reported speech.", "steps": ["Choose your interviewee (athlete, coach) and the topic (a recent win, a big goal, an injury, etc.).", "Write 5 interview questions.", "Write natural, original answers for the interviewee.", "Rewrite the key answers as reported speech in a short summary paragraph.", "Check that reporting verbs (said, told, explained, admitted) are used correctly."], "chips": ["interview", "press conference", "admit", "explain", "claim", "deny", "When asked about..., he/she said (that)...", "He/She explained that...", "He/She admitted that...", "According to..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "\"I am training every day,\" the athlete said. Reported speech:", "section": "Exit ticket", "options": ["The athlete said he trains every day.", "The athlete said he was training every day.", "The athlete said he is training every day.", "The athlete says he was training every day."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Complete: a person who watches and supports a team is called a ___.", "section": "Exit ticket", "reveal": "supporter / fan", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "A referee's job is to write sports news articles.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "A referee's job is to control a match and enforce the rules.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in reported speech: \"We will win the next match,\" the captain said.", "section": "Exit ticket", "reveal": "The captain said (that) they would win the next match.", "prompt": "The captain said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence uses 'tell' correctly?", "section": "Exit ticket", "options": ["She told that she was tired.", "She told me that she was tired.", "She said me that she was tired.", "She told about she was tired."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "order", "q": "Put the words in order: had won / said / the coach / the match / they", "section": "Exit ticket", "words": ["the", "coach", "said", "they", "had", "won", "the", "match"], "end": ".", "reveal": "The coach said they had won the match.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "\"I saw the game yesterday,\" he said. → He said he had seen the game ___.", "section": "Exit ticket", "reveal": "the day before", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'a place where large sports events are held'?", "section": "Exit ticket", "options": ["referee", "stadium", "tournament", "commentator"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "In reported speech, 'here' usually changes to 'there'.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite in reported speech: \"My team is playing well this season,\" the fan said.", "section": "Exit ticket", "reveal": "The fan said (that) his/her team was playing well that season.", "prompt": "The fan said...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}], "theme": "Year 11 · Theme 8 · Sports", "key": "year-11-8"}</script><script src="../../../assets/us-present.js"></script></body></html>
