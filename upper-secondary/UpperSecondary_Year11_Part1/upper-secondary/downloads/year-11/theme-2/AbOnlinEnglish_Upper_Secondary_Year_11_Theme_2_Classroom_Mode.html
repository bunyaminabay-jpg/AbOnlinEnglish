ss", "/", "very well"], "reveal": "We can't play chess very well.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["He", "/", "couldn't", "/", "swim", "/", "as a child"], "reveal": "He couldn't swim as a child.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["They", "/", "can", "/", "speak", "/", "two languages"], "reveal": "They can speak two languages.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "/", "could", "/", "ride", "/", "a horse", "?"], "reveal": "Could you ride a horse?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about a skill you can do now and a skill you could (or couldn't) do as a child.", "chips": ["I can...", "When I was young, I could..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I can swim.", "She could swim when she was six."], "negative": ["I can't swim.", "She couldn't swim when she was three."], "question": ["Can you swim?", "Could she swim at six?"], "short": ["Yes, I can. / No, I can't.", "Yes, she could. / No, she couldn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She cans play the piano.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She can play the piano.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I could to ride a bike when I was five.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I could ride a bike when I was five.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "When I was four, I ___ already count to a hundred.", "section": "", "options": ["can", "can't", "could", "couldn't"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ you play any musical instrument? (present)", "section": "", "reveal": "Can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence is correct?", "section": "", "options": ["He could to swim last year.", "He can swims well.", "He could swim when he was young.", "He cans swim."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "She could plays tennis when she was ten.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She could play tennis when she was ten.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: ride / could / a bike / I / when / young / I / was", "section": "", "words": ["I", "could", "ride", "a", "bike", "when", "I", "was", "young"], "end": ".", "reveal": "I could ride a bike when I was young.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "gap", "q": "My father ___ (not / can) juggle at all, even now.", "section": "", "reveal": "can't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a past ability sentence: I can play the violin now, but not when I was seven.", "section": "", "reveal": "I couldn't play the violin when I was seven.", "prompt": "I couldn't...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Even though she practises every day, she still ___ (not / can) do a backflip.", "section": "", "reveal": "can't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as a question about past ability: He could speak French fluently by the age of ten.", "section": "", "reveal": "Could he speak French fluently by the age of ten?", "prompt": "Could he...", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the sentence with correct modal verb use.", "section": "", "options": ["She could to paint beautifully.", "She could paints beautifully.", "She could paint beautifully.", "She cans paint beautifully."], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Weekend Woodcarver", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think this person does at weekends?", "Do you know anyone who is skilled at a craft hobby?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Weekend Woodcarver", "num": 1, "total": 4, "text": "Ahmet works as an accountant during the week, but every Saturday morning he becomes a completely different person. He puts on an old apron, opens his small garden shed, and picks up a piece of wood and a set of carving tools. Ahmet is passionate about woodcarving, and he has been practising this hobby for almost six years.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Weekend Woodcarver", "num": 2, "total": 4, "text": "It all started when his grandfather gave him a small wooden bird he had carved himself. Ahmet was fascinated and decided he wanted to learn the same skill. At first, he was a complete novice and found the work slow and difficult. He couldn't even carve a simple spoon without cutting his fingers. However, he was fond of the quiet, careful process, and he refused to give up.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Weekend Woodcarver", "num": 3, "total": 4, "text": "Ahmet joined a local craft club, where more experienced members were happy to share tips with beginners. He practised for at least two hours every weekend, and slowly his skills improved. Now he can carve detailed animal figures, small boxes, and even simple furniture. His favourite pieces are wooden birds, just like the one his grandfather gave him.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Weekend Woodcarver", "num": 4, "total": 4, "text": "Ahmet says that woodcarving helps him relax after a stressful week at work. \"I enjoy focusing on one small task and seeing something beautiful appear from a plain piece of wood,\" he explains. He is now keen on entering his work in a regional craft competition next spring, something he could never have imagined doing when he first picked up a carving knife.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is Ahmet's job?", "section": "While you read", "options": ["Woodcarver", "Accountant", "Craft teacher", "Shed builder"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Ahmet's grandfather gave him a small wooden ___.", "section": "While you read", "reveal": "bird", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Ahmet found woodcarving easy from the very beginning.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ahmet found it slow and difficult at first, and he was a complete novice.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "How does Ahmet feel about woodcarving now?", "section": "While you read", "options": ["Bored by it", "Passionate about it", "Confused by it", "Annoyed by it"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Ahmet is planning to enter a regional craft ___ next spring.", "section": "While you read", "reveal": "competition", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What can we infer about Ahmet's attitude towards learning new skills?", "section": "While you read", "options": ["He gives up easily.", "He is patient and determined.", "He prefers to learn alone.", "He only likes fast results."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Would you like to try woodcarving? Why or why not?", "What hobby have you learned slowly, like Ahmet learned woodcarving?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Twins, Different Talents", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Do you know any twins? Do they usually have the same interests?", "Guess: what different hobbies might two twin sisters have?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Twins, Different Talents", "num": 1, "total": 4, "text": "Elif and Deniz are twin sisters, but their hobbies could hardly be more different. Elif is crazy about rock climbing. Every weekend, she travels to a climbing centre outside the city, where she can now climb walls that would have seemed impossible to her two years ago. As a child, she couldn't even climb the small tree in their garden without help, so her family is amazed at how far she has come.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Twins, Different Talents", "num": 2, "total": 4, "text": "Deniz, on the other hand, is interested in something much quieter: chess. She loves sitting for hours studying old games and planning her next move. She joined the school chess club in Year 9 and quickly became one of its strongest players. Unlike her sister, Deniz has always preferred activities that let her think carefully rather than move quickly.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Twins, Different Talents", "num": 3, "total": 4, "text": "Their parents say that the girls have always had opposite personalities, even though they look almost identical. Elif enjoys taking risks and testing her body's limits, while Deniz prefers solving problems calmly in her mind. Interestingly, both girls agree on one thing: they can't stand giving up on a challenge, whether it's a difficult climbing route or a tricky chess puzzle.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Twins, Different Talents", "num": 4, "total": 4, "text": "Last month, the twins decided to try something new together: a beginner's pottery class. Neither of them had any experience, and at first their bowls looked more like flat plates. However, after a few lessons, both sisters could shape a simple, even bowl, and they agreed it was fun to be complete beginners together for once.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What hobby is Elif crazy about?", "section": "While you read", "options": ["Chess", "Rock climbing", "Pottery", "Woodcarving"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Deniz joined the school ___ club in Year 9.", "section": "While you read", "reveal": "chess", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "As a child, Elif could easily climb trees.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "As a child, Elif couldn't climb the small tree in their garden without help.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What do the two sisters have in common, according to the text?", "section": "While you read", "options": ["They both prefer quiet activities.", "They both can't stand giving up on a challenge.", "They both dislike trying new things.", "They both started rock climbing together."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The twins tried a beginner's ___ class together last month.", "section": "While you read", "reveal": "pottery", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What can we infer about how the sisters felt during the pottery class?", "section": "While you read", "options": ["Embarrassed and unwilling to continue", "Amused and encouraged by improving together", "Angry that their bowls were not perfect", "Uninterested in the activity"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Do you think it's more common for siblings to share hobbies or have different ones? Why?", "Which of the two sisters' hobbies would you rather try, and why?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Choosing a New Hobby", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What hobby would you like to try but have never had the chance to?", "Listen and find out which hobby each speaker decides to try."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Choosing a New Hobby", "audio": null, "transcript": [{"speaker": "Mert", "line": "So, the community centre is offering some new weekend courses. Are you interested in signing up for one?"}, {"speaker": "Aslı", "line": "Definitely. I've always been keen on trying pottery, but I've never had the chance before."}, {"speaker": "Mert", "line": "Really? I didn't know you liked pottery. I thought you were more into music."}, {"speaker": "Aslı", "line": "I am, but I can't play any instrument well, and honestly, I hate practising scales! Pottery seems more relaxing."}, {"speaker": "Mert", "line": "That makes sense. What about me? I can't decide between the photography course and the rock climbing course."}, {"speaker": "Aslı", "line": "Well, which one are you more passionate about?"}, {"speaker": "Mert", "line": "I think photography, actually. I'm fascinated by how a good photo can tell a whole story."}, {"speaker": "Aslı", "line": "Then choose photography! You can always try climbing another time."}, {"speaker": "Mert", "line": "You're right. I'll sign up for the photography course, and you can sign up for pottery. We can share what we learn."}, {"speaker": "Aslı", "line": "Sounds like a great plan!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What hobby does Aslı decide to try?", "section": "While you listen", "options": ["Photography", "Pottery", "Rock climbing", "Music"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Aslı enjoys practising musical scales.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Aslı hates practising scales.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Mert can't decide between photography and ___.", "section": "While you listen", "reveal": "rock climbing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why does Mert choose photography?", "section": "While you listen", "options": ["He is more passionate about it.", "It is cheaper.", "Aslı is also doing it.", "He already owns a camera."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "At the end, Mert and Aslı agree to share what they ___.", "section": "While you listen", "reveal": "learn", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you listen", "list": ["Would you rather try pottery or photography? Why?", "Do you think it's a good idea to try a hobby with a friend? Why?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "My Grandfather the Chess Champion", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What skills do people often learn from older family members?", "Listen to Zeynep talking about her grandfather's hobby."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "My Grandfather the Chess Champion", "audio": null, "transcript": [{"speaker": "Zeynep", "line": "I want to tell you about my grandfather, who is eighty-two years old and still crazy about chess. He learned to play when he was only seven, and he could beat most adults in our neighbourhood by the time he was twelve. Everyone was amazed at how skilled he was."}, {"speaker": "Zeynep", "line": "When I was little, he taught me the rules, but I couldn't understand the strategy at all at first. I found it boring, to be honest, and I much preferred drawing or playing outside. However, my grandfather was very patient, and slowly I became more interested in the game."}, {"speaker": "Zeynep", "line": "Now we play together every Sunday afternoon. I still can't beat him very often — maybe once every ten games — but I really enjoy our matches. He says that chess isn't just about winning; it's about thinking carefully and never giving up."}, {"speaker": "Zeynep", "line": "Last year, he entered a seniors' chess tournament for the first time in decades, and he actually won third place! My whole family was so proud of him. He's already keen on entering again next year."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "How old was Zeynep's grandfather when he learned to play chess?", "section": "While you listen", "options": ["Seven", "Twelve", "Eighty-two", "Ten"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep loved chess from the very first lesson.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Zeynep found chess boring at first and preferred drawing or playing outside.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Zeynep and her grandfather now play chess every ___ afternoon.", "section": "While you listen", "reveal": "Sunday", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What did Zeynep's grandfather achieve last year?", "section": "While you listen", "options": ["He won first place in a tournament.", "He won third place in a seniors' tournament.", "He stopped playing chess.", "He taught a chess class."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Has anyone in your family taught you a hobby or skill? What was it?", "Do you agree that a hobby like chess is 'not just about winning'? Why?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Hobby Interview", "text": "In pairs, interview your partner about their hobbies, likes/dislikes, and preferences, then report one interesting fact to the class.", "steps": ["Prepare 4-5 questions about hobbies, likes, dislikes, and preferences.", "Take turns interviewing each other and note down the answers.", "Choose one interesting or surprising answer to share with the class.", "Report back briefly, using full sentences."], "chips": ["What do you enjoy doing in your free time?", "Are you interested in...?", "I'm really keen on...", "I'd prefer... to...", "I can't stand..."], "timer": 300, "levels": ["Give students a list of question starters and hobby vocabulary to choose from.", "Students form their own questions using the target structures.", "Students ask one follow-up question for each answer to get more detail."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Can You? Could You?", "text": "In small groups, students find out what abilities each group member has now and had as a child, then present the most surprising ability to the class.", "steps": ["In groups, ask each other abou
