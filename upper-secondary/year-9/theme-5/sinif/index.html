e", "are having", "has"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I usually ___ my bedroom on Saturday mornings.", "section": "A · Choose the correct option.", "options": ["tidy", "am tidying", "tidies"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ you iron your own clothes?", "section": "A · Choose the correct option.", "options": ["Are", "Do", "Is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My dad ___ (relax) on the sofa right now.", "section": "B · Complete with the correct tense.", "reveal": "is relaxing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ (not/have) a garden — we live in a block of flats.", "section": "B · Complete with the correct tense.", "reveal": "don't have", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "She is iron her school shirt every morning.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She irons her school shirt every morning.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "At the moment, my grandmother is baking bread in the oven.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ you ___ (do) right now?", "section": "Dialogue · Complete with the correct tense.", "reveal": "are / doing", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I ___ (tidy) my bedroom. I always ___ (do) this on Sundays.", "section": "Dialogue · Complete with the correct tense.", "reveal": "am tidying / do", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a current action.", "section": "Dialogue · Complete with the correct tense.", "words": ["are", "you", "relaxing", "in", "the", "living", "room"], "end": "?", "reveal": "Are you relaxing in the living room?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "There is / There are + prepositions of place", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["<mark>There is<\/mark> a big garden behind our house.", "<mark>There are<\/mark> two bathrooms in our new apartment.", "The sofa is <mark>between<\/mark> the window and the bookshelf.", "<mark>Is there<\/mark> a balcony in your flat? — Yes, <mark>there is<\/mark>."], "ask": "Which sentences use 'there is' and which use 'there are'? Why? What prepositions show where things are?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["There is", "There are", "singular", "plural"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use '___' with a ___ noun (one thing).", "section": "Complete the rule", "reveal": "There is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use '___' with a ___ noun (more than one thing).", "section": "Complete the rule", "reveal": "There are", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a question, we say 'Is there...?' with a ___ noun.", "section": "Complete the rule", "reveal": "singular", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a question, we say 'Are there...?' with a ___ noun.", "section": "Complete the rule", "reveal": "plural", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use 'there is' with singular nouns and 'there are' with plural nouns to say that something exists in a place. We use prepositions of place (in, on, behind, between, next to) to say exactly where something is.", "tr": "'There is' tekil isimlerle, 'there are' çoğul isimlerle bir yerde bir şeyin var olduğunu anlatmak için kullanılır. Bir şeyin yerini belirtmek için 'in, on, behind, between, next to' gibi edatlar kullanılır.", "when_en": "We use this to say what rooms or furniture a house has, and exactly where they are.", "when": "Bir evde veya odada hangi eşyaların/odaların bulunduğunu ve bunların tam olarak nerede olduğunu anlatırken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["a big garden", "behind", "our house"], "reveal": "There is a big garden behind our house.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["two bathrooms", "in", "our new apartment"], "reveal": "There are two bathrooms in our new apartment.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["not / a fridge", "in", "the hallway"], "reveal": "There isn't a fridge in the hallway.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / a balcony", "in", "your flat"], "reveal": "Is there a balcony in your flat?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["a rug", "between", "the sofa and the TV"], "reveal": "There is a rug between the sofa and the TV.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / any wardrobes", "in", "your bedroom"], "reveal": "Are there any wardrobes in your bedroom?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write four sentences about your own house or flat using there is/there are and at least two prepositions of place (in, on, behind, between, next to).", "chips": ["There is...", "There are...", "There isn't...", "Is there...?"], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["There is a garden behind our house.", "There are two bedrooms upstairs."], "negative": ["There isn't a fridge in the hallway.", "There aren't any pillows on the sofa."], "question": ["Is there a balcony in your flat?", "Are there any wardrobes in your bedroom?"], "short": ["Yes, there is. / No, there isn't.", "Yes, there are. / No, there aren't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "There is two bathrooms in our flat.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There are two bathrooms in our flat.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "The rug is between the sofa and.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The rug is between the sofa and the TV.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "___ a small garden behind our cottage.", "section": "A · Choose the correct option.", "options": ["There is", "There are", "They are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ three bedrooms in our new apartment.", "section": "A · Choose the correct option.", "options": ["There is", "There are", "It is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The wardrobe is ___ the bed and the window.", "section": "A · Choose the correct option.", "options": ["between", "behind", "in"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ any pillows on your sofa?", "section": "A · Choose the correct option.", "options": ["Is there", "Are there", "Do there"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ a big oven in our kitchen.", "section": "B · Complete with there is/there are.", "reveal": "There is", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ (not) a balcony in our old flat.", "section": "B · Complete with there is/there are.", "reveal": "There isn't / There is not", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "There  "title": "Before you read", "list": ["Look at the title. What do you think this blog post will describe?", "Guess: what three rooms or things might the writer mention?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My Dream Cottage in the Countryside", "num": 1, "total": 5, "text": "Hi, readers! I'm Aslı, and today I want to tell you about my family's little cottage in the countryside, near my grandparents' village. We usually spend every summer holiday here, and it's my favourite place in the world.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Dream Cottage in the Countryside", "num": 2, "total": 5, "text": "Our cottage isn't very big — it has a kitchen, a living room, two bedrooms and one bathroom. There is a small bathtub in the bathroom, and there is a big old fridge in the kitchen that always makes a funny noise! My favourite room is the living room, because there is a soft sofa with colourful pillows, and a warm rug on the floor.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Dream Cottage in the Countryside", "num": 3, "total": 5, "text": "Behind the cottage, there is a lovely garden with apple trees and vegetables. My grandmother usually works in the garden every morning, but this morning she is relaxing on the balcony instead, because it's raining. My grandfather often relaxes in his favourite chair after lunch, and right now he is reading the newspaper there.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Dream Cottage in the Countryside", "num": 4, "total": 5, "text": "We don't have a big wardrobe like at home, so we usually keep our clothes in a small suitcase! My mum is ironing our clothes for tomorrow at the moment, because we're going to visit our neighbours for dinner.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Dream Cottage in the Countryside", "num": 5, "total": 5, "text": "I love our cottage because it's quiet and simple. There isn't a lot of furniture, but there is a lot of love in this little house. Every summer, I look forward to coming back here.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A hotel in the city", "Aslı's family cottage in the countryside", "How to build a house"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How many bedrooms does the cottage have?", "section": "While you read", "options": ["One", "Two", "Three"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Aslı's favourite room, and why?", "section": "While you read", "options": ["The kitchen, because of the fridge", "The living room, because of the sofa and rug", "The bathroom, because of the bathtub"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Aslı's grandmother doing this morning, according to the text?", "section": "While you read", "options": ["Working in the garden", "Relaxing on the balcony", "Ironing clothes"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The cottage has a big wardrobe for their clothes.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The cottage doesn't have a big wardrobe — they keep their clothes in a small suitcase.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does Aslı say there is 'a lot of love' in the cottage?", "section": "While you read", "options": ["Because it has expensive furniture", "Because it's a big, modern house", "Because it's a simple place where her family spends happy time together"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If you had a small cottage in the countryside, which room would be your favourite? Write two sentences.", "Compare Aslı's cottage with your own house. Find one similarity and one difference."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Day in Our Neighbourhood", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think happens in a typical neighbourhood on a normal day?", "Guess two things neighbours might do together."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Day in Our Neighbourhood", "num": 1, "total": 5, "text": "I live in a block of flats in a friendly neighbourhood, and I love watching what happens outside my window every day. Right now, it's Saturday morning, and our neighbourhood is full of activity.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day in Our Neighbourhood", "num": 2, "total": 5, "text": "Mr. Aydın, who lives in the villa opposite our building, usually works in his garden on Saturdays, and today he is exactly that — planting flowers near his front gate. His neighbour, Mrs. Kaya, often has coffee on her balcony in the morning, and she is doing that right now too, waving to everyone who passes by.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day in Our Neighbourhood", "num": 3, "total": 5, "text": "Down the street, a family in a detached house is having a small barbecue in their garden, even though it's still morning! Their children usually play football in the street after school, but today, because it's the weekend, they are already outside with a ball.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day in Our Neighbourhood", "num": 4, "total": 5, "text": "My own family doesn't usually do much on Saturday mornings — we normally relax at home. But today is different: my dad is washing our car, my mum is tidying the living room, and I am helping my little brother clean his bedroom.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Day in Our Neighbourhood", "num": 5, "total": 5, "text": "Later, we are all meeting our neighbours for a small neighbourhood picnic in the park nearby. I really enjoy living here — everyone knows everyone, and there is always something interesting happening on our street.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is this text mainly about?", "section": "While you read", "options": ["A trip to another city", "A busy Saturday in the writer's neighbourhood", "How to plant a garden"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Mr. Aydın doing right now?", "section": "While you read", "options": ["Washing his car", "Planting flowers in his garden", "Having a barbecue"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Mrs. Kaya often do in the morning?", "section": "While you read", "options": ["Have coffee on her balcony", "Play football in the street", "Clean her bedroom"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the writer's family doing this morning?", "section": "While you read", "options": ["Relaxing all morning, as usual", "Washing the car, tidying and cleaning", "Having a picnic in the park"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The writer's family usually does a lot of activities on Saturday mornings.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The writer's family doesn't usually do much on Saturday mornings — today is different.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What can we infer about the neighbourhood at the end of the text?", "section": "While you read", "options": ["The neighbours don't know each other well", "It's a friendly place where neighbours spend time together", "The writer wants to move away"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["What do people in your neighbourhood usually do at the weekend? Write two sentences.", "Write two sentences about what your family is doing right now, at this moment."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "House-Hunting with Mum", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a mother and her son visiting a new apartment with an estate agent.", "Guess: what three questions might they ask about the apartment?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "House-Hunting with Mum", "audio": null, "transcript": [{"speaker": "Agent", "line": "Welcome! So, this apartment has three bedrooms, a kitchen, a living room and two bathrooms."}, {"speaker": "Mum", "line": "That sounds great. Is there a balcony? My son loves having breakfast outside."}, {"speaker": "Agent", "line": "Yes, there is — it's just through the living room. Come and see."}, {"speaker": "Deniz", "line": "Wow, this living room is big! Is there space for a sofa and a rug here?"}, {"speaker": "Agent", "line": "Definitely. And look, there's a modern kitchen with a new oven and a big fridge."}, {"speaker": "Mum", "line": "Perfect. Are there any wardrobes in the bedrooms, or do we need to buy our own?"}, {"speaker": "Agent", "line": "There are built-in wardrobes in two of the bedrooms."}, {"speaker": "Deniz", "line": "Mum, I really like this apartment. Can we take it?"}, {"speaker": "Mum", "line": "Let's think about it, but I'm relaxing already just imagining our new home!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "How many bedrooms does the apartment have?", "section": "While you listen", "options": ["Two", "Three", "Four"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Why does Mum ask about the balcony?", "section": "While you listen", "options": ["She wants to grow vegetables there", "Her son loves having breakfast outside", "She wants to iron clothes there"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the kitchen have, according to the agent?", "section": "While you listen", "options": ["A new oven and a big fridge", "A bathtub and a wardrobe", "A sofa and a rug"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How many bedrooms have built-in wardrobes?", "section": "While you listen", "options": ["One", "Two", "Three"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz doesn't like the apartment at all.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz really likes the apartment and wants to take it.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Would you like to live in this apartment? Why or why not?", "Write two questions you would ask about a new house or flat."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "What Are You Doing Right Now?", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a phone call between two friends, Ela and Cem, on a Sunday afternoon.", "Predict: what do you think they are doing at home?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "What Are You Doing Right Now?", "audio": null, "transcript": [{"speaker": "Ela", "line": "Hi, Cem! What are you doing right now? I'm bored."}, {"speaker": "Cem", "line": "Hi, Ela! I'm helping my dad in the garden. We're planting some flowers."}, {"speaker": "Ela", "line": "That sounds nice. I don't usually do gardening, but I love relaxing outside sometimes."}, {"speaker": "Cem", "line": "What about you? What's happening at your house?"}, {"speaker": "Ela", "line": "My mum is cleaning the kitchen, and my brother is tidying his bedroom. I'm just sitting on the sofa, watching them!"}, {"speaker": "Cem", "line": "Ha! Do you usually help with the housework?"}, {"speaker": "Ela", "line": "Sometimes. I usually iron my own clothes, but I don't like cleaning the bathroom."}, {"speaker": "Cem", "line": "Me neither! Hey, do you want to come to my house later? We can relax in the living room."}, {"speaker": "Ela", "line": "Sure, that sounds great. See you soon!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is Cem doing right now?", "section": "While you listen", "options": ["Cleaning the kitchen", "Planting flowers in the garden with his dad", "Watching TV"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Ela's mum doing?", "section": "While you listen", "options": ["Cleaning the kitchen", "Ironing clothes", "Planting flowers"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Ela usually do, but not like doing?", "section": "While you listen", "options": ["Ironing her clothes", "Cleaning the bathroom", "Sitting on the sofa"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Ela is helping her mum clean the kitchen right now.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ela is just sitting on the sofa, watching her family do the housework.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What do Cem and Ela decide to do later?", "section": "While you listen", "options": ["Do more housework", "Meet and relax in the living room", "Go to the park"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["What are you usually doing on a Sunday afternoon?", "Write one sentence about what you are doing right now, at this exact moment."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Describe Your Dream House", "text": "Imagine your dream house (real or invented, for creative-writing purposes). Describe its rooms and furniture to your partner using vocabulary and 'there is/there are', while your partner draws a simple sketch based on your description.", "steps": ["Think of your dream house: type of house, number of rooms, key furniture.", "Describe it to your partner, room by room, while they sketch it.", "Your partner asks 2-3 follow-up questions with 'Is there...?' or 'Are there...?'", "Swap roles and repeat with your partner's dream house.", "Compare your sketches and share one interesting detail with the class."], "chips": ["There is a... / There are...", "It's a villa/cottage/apartment with...", "The... is next to/between/behind the...", "In the living room, there is..."], "timer": 600, "levels": ["Give students a simple house outline with room labels to guide the description.", "Full description with at least 6 pieces of furniture/rooms and 2 follow-up questions.", "Fast finishers add two sentences with the Present Progressive about what is happening in a room right now."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "What's Happening at Home? — Phone Roleplay", "text": "Roleplay a phone call between two friends. One friend asks what the other is doing right now at home, and what they usually do at the weekend, using the Simple Present and the Present Progressive.", "steps": ["In pairs, decide who calls first.", "Caller asks what their partner is doing right now.", "Partner answers with the Present Progressive, then adds what they usually do (Simple Present).", "Swap roles and repeat with a new situation.", "Perform your best phone call for another pair."], "chips": ["What are you doing right now?", "I'm ...-ing at the moment.", "What do you usually do at the weekend?", "I usually... but today I'm..."], "timer": 300, "levels": ["Give a phone-call script frame with gaps for lower-level students.", "A full phone call with at least 4 exchanges, mixing both tenses correctly.", "Fast finishers add an invitation to visit and describe a room they will relax in."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My House", "text": "Write a short description of your own house or flat (or an invented one, for creative-writing purposes) for a new pen pal. Include the type of house, its rooms, at least three pieces of furniture, and one sentence about what your family usually does there.", "steps": ["Choose a title for your description, e.g. 'My Apartment' or 'My Family's Cottage'.", "Note the type of house and the number of rooms.", "List three or four pieces of furniture using 'there is/there are'.", "Add one sentence with the Simple Present about a family routine at home.", "Check your grammar and punctuation."], "chips": ["apartment", "living room", "bedroom", "kitchen", "sofa", "wardrobe", "There is... / There are...", "My house/flat has...", "In the... there is/are...", "We usually..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "My Neighbourhood", "text": "Write a short blog post about your neighbourhood (real or invented, for creative-writing purposes) for the school website. Describe what your neighbours usually do, and what is happening in your street right now.", "steps": ["Choose a title for your blog post, e.g. 'A Day in My Neighbourhood'.", "Say what kind of neighbourhood it is (quiet, busy, friendly).", "Describe two things neighbours usually do there, using the Simple Present.", "Say two things that are happening right now, using the Present Progressive.", "End with one sentence about why you like (or don't like) your neighbourhood."], "chips": ["neighbour", "neighbourhood", "garden", "balcony", "to relax", "to iron", "My neighbourhood is...", "Our neighbours usually...", "Right now, ...", "I like/don't like living here because..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'neighbourhood'", "section": "Exit ticket", "options": ["a piece of furniture", "the area around your home where you live", "a type of house"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'cottage' mean?", "section": "Exit ticket", "options": ["a small house, often in the countryside", "a large block of flats", "a piece of furniture"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "I usually ___ my bedroom on Saturdays.", "section": "Exit ticket", "options": ["tidy", "am tidying", "tidies"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Look! My dad ___ dinner in the kitchen right now.", "section": "Exit ticket", "options": ["cooks", "is cooking", "cook"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ a big garden behind our house.", "section": "Exit ticket", "options": ["There is", "There are", "It is"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ any wardrobes in the bedrooms?", "section": "Exit ticket", "options": ["Is there", "Are there", "Do there"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla , "section": "Exit ticket", "options": ["neighbour", "landmark", "wardrobe"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
