ptions": ["Do", "Does", "Is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The security guard ___ IDs every morning.", "section": "A · Choose the correct option.", "options": ["check", "checks", "checking"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My father ___ (work) in a big office.", "section": "B · Complete with the Simple Present.", "reveal": "works", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "My aunt ___ (not/work) at night; she ___ (work) in the morning.", "section": "B · Complete with the Simple Present.", "reveal": "doesn't work / works", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "My sister work as an accountant.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My sister works as an accountant.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Does your uncle work at the shopping centre?", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ your mother do?", "section": "Dialogue · Complete with the Simple Present.", "reveal": "does", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: She ___ (be) a pharmacist. She ___ (work) at a small pharmacy.", "section": "Dialogue · Complete with the Simple Present.", "reveal": "is / works", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a job.", "section": "Dialogue · Complete with the Simple Present.", "words": ["does", "your", "father", "work", "in", "an", "office"], "end": "?", "reveal": "Does your father work in an office?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Prepositions of place: at, in, on (workplaces)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["My mother works <mark>at<\/mark> the pharmacy near our house.", "My father works <mark>in<\/mark> a big office <mark>in<\/mark> the city centre.", "There's a photo of my uncle <mark>on<\/mark> the wall of the bank.", "Does your cousin work <mark>at<\/mark> a shop <mark>in<\/mark> Balıkesir?"], "ask": "Which preposition do we use for a specific point or building? Which one do we use for a bigger, enclosed space? Which one do we use for a surface?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["at", "in", "on", "specific place"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use ___ for a specific point or building, like 'at the pharmacy'.", "section": "Complete the rule", "reveal": "at", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use ___ for a bigger, enclosed space, like 'in the office' or 'in Balıkesir'.", "section": "Complete the rule", "reveal": "in", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We use ___ for a surface, like 'on the wall' or 'on the shelf'.", "section": "Complete the rule", "reveal": "on", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "'At the bank' tells us the ___ where someone works.", "section": "Complete the rule", "reveal": "specific place", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Use 'at' for a specific point or building (at the bank), 'in' for a bigger, enclosed space (in the office, in Balıkesir), and 'on' for a surface (on the wall).", "tr": "'At' belirli bir nokta veya bina için (at the bank), 'in' daha büyük, kapalı bir alan için (in the office, in Balıkesir), 'on' ise bir yüzey için (on the wall) kullanılır.", "when_en": "We use this to say where a family member works or where something is located.", "when": "Bir aile üyesinin nerede çalıştığını veya bir şeyin nerede olduğunu anlatırken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["My mother", "work", "at the pharmacy"], "reveal": "My mother works at the pharmacy.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["My father", "work", "in a big office"], "reveal": "My father works in a big office.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["There's a photo", "my uncle", "on the wall"], "reveal": "There's a photo of my uncle on the wall.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / your cousin", "work", "at a pharmacy"], "reveal": "Does your cousin work at a pharmacy?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["My sister", "work", "in a shopping centre"], "reveal": "My sister works in a shopping centre.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["The security guard", "stand", "at the door"], "reveal": "The security guard stands at the door.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözl ion", "qtype": "mcq", "q": "There's a poster ___ the wall of the shop.", "section": "A · Choose the correct option.", "options": ["at", "in", "on"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Does your cousin work ___ a shopping centre?", "section": "A · Choose the correct option.", "options": ["at", "in", "on"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The security guard stands ___ the door of the bank.", "section": "B · Complete with at/in/on.", "reveal": "at", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "My uncle works ___ a warehouse ___ the edge of town.", "section": "B · Complete with at/in/on.", "reveal": "in / at", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "My aunt works on a bank in the city centre.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My aunt works at a bank in the city centre.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "My sister works in a shopping centre.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: Where does your father work?", "section": "Dialogue · Complete with at/in/on.", "reveal": "-", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: He works ___ an office ___ Balıkesir.", "section": "Dialogue · Complete with at/in/on.", "reveal": "in / in", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about a workplace.", "section": "Dialogue · Complete with at/in/on.", "words": ["does", "your", "mother", "work", "at", "a", "pharmacy"], "end": "?", "reveal": "Does your mother work at a pharmacy?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "My Family, Different Jobs", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think this blog post is about?", "Guess: what three jobs might the writer's family members have?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "My Family, Different Jobs", "num": 1, "total": 6, "text": "Hi, everyone! My name is Deniz, and today I want to tell you about the different jobs in my family. We're not a family of teachers or doctors — we all do very different things!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Family, Different Jobs", "num": 2, "total": 6, "text": "My mother is a pharmacist, and she works at a small pharmacy in the town centre. Every day, she checks medicine and serves customers who need advice. She doesn't work on Sundays, so that's our family day together.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Family, Different Jobs", "num": 3, "total": 6, "text": "My father is an electrician. He doesn't work in an office — he visits different houses and fixes the lights and wires. His work routine changes every day, because every house has a different problem!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Family, Different Jobs", "num": 4, "total": 6, "text": "My aunt works as a bank clerk at a branch in the city centre. She serves customers, checks their information, and helps them with their money. My uncle, on the other hand, works at a big shopping centre nearby, where he's a security guard. He checks IDs and makes sure everyone is safe.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Family, Different Jobs", "num": 5, "total": 6, "text": "My cousin is still a student, but she works as a shop assistant at the weekend. She serves customers in a small clothes shop and says she loves talking to people all day.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "My Family, Different Jobs", "num": 6, "total": 6, "text": "Every family has different jobs and different work routines, but we all sit down together on Sunday and talk about our week. I think that's the best part!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A family of doctors", "The different jobs of the writer's family members", "How to become a pharmacist"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Deniz's mother's job?", "section": "While you read", "options": ["Bank clerk", "Pharmacist", "Security guard"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where does Deniz's father work?", "section": "While you read", "options": ["In an office", "In different houses, fixing lights and wires", "At a shopping centre"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Deniz's uncle do at the shopping centre?", "section": "While you read", "options": ["He serves customers in a shop", "He checks IDs as a security guard", "He works as an accountant"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz's mother works every day, including Sundays.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz's mother doesn't work on Sundays — that's the family day together.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "Why does Deniz think Sunday is the best part of the week?", "section": "While you read", "options": ["Because everyone works together", "Because the family sits down together and talks", "Because the shops are closed"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If you wrote about your own family's jobs, which job would you describe first? Write two sentences.", "Compare two jobs in the text. Find one similarity and one difference between them."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Career Day at Our School", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think happens on a 'Career Day' at a school?", "Guess two jobs that students might present on Career Day."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Career Day at Our School", "num": 1, "total": 6, "text": "Every autumn, our school organises a Career Day, and it's always one of the most interesting days of the year. Each student chooses one family member's job and prepares a short poster and presentation about it.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Career Day at Our School", "num": 2, "total": 6, "text": "This year, I chose my aunt's job. She's a flight attendant, so I explained that she works on planes and travels to different cities every week. I made a poster with a photo of an airport and some facts about her work routine.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Career Day at Our School", "num": 3, "total": 6, "text": "My classmate Ela presented her father's job. He's a mechanic, and he works in a garage near our neighbourhood. Ela explained that he fixes cars every day and sometimes works late in the evening when there's a lot of work.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Career Day at Our School", "num": 4, "total": 6, "text": "Another classmate, Kerem, talked about his mother, who works as an accountant in an office in the city centre. He said she doesn't work with cars or customers — she works with numbers and computers all day.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Career Day at Our School", "num": 5, "total": 6, "text": "In the afternoon, each student gave a short presentation and answered questions like 'Does your family member work at the weekend?' and 'What does a typical work day look like for them?' It was a great chance to practise speaking and learn about different jobs.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Career Day at Our School", "num": 6, "total": 6, "text": "At the end of the day, our teacher said that Career Day helps us understand that every job is important, whether it's fixing cars, serving customers, or helping people with their money.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is Career Day at this school?", "section": "While you read", "options": ["A sports competition", "A day when students present a family member's job", "A school trip"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the writer's aunt's job?", "section": "While you read", "options": ["Bank clerk", "Flight attendant", "Mechanic"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Ela's father do?", "section": "While you read", "options": ["He works as an accountant", "He fixes cars in a garage", "He works at a shopping centre"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Kerem say about his mother's job?", "section": "While you read", "options": ["She works with numbers and computers", "She serves customers in a shop", "She works on planes"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Each student only made a poster and did not speak to the class.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Each student also gave a short presentation and answered questions.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the teacher's final comment suggest?", "section": "While you read", "options": ["Some jobs are more important than others", "Every job is important, whatever it is", "Only office jobs are worth presenting"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If your school had a Career Day, whose job would you choose to present? Why?", "Write two sentences about what a family member of yours does at work."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Phone Call About Jobs", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear a phone call between two friends, Elif and Deniz, talking about their parents' jobs.", "Guess: what three questions might they ask each other about jobs?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Phone Call About Jobs", "audio": null, "transcript": [{"speaker": "Elif", "line": "Hi, Deniz! I'm doing my English homework about family jobs. What does your mother do?"}, {"speaker": "Deniz", "line": "Hi, Elif! My mother is a pharmacist. She works at a pharmacy in the town centre."}, {"speaker": "Elif", "line": "Oh, nice! Does she work every day?"}, {"speaker": "Deniz", "line": "No, she doesn't work on Sundays. What about your father?"}, {"speaker": "Elif", "line": "He's an electrician. He doesn't work in an office — he visits houses and fixes lights and wires."}, {"speaker": "Deniz", "line": "That sounds interesting! Does he have the same work routine every day?"}, {"speaker": "Elif", "line": "No, it changes every day because every house has a different problem. What does your father do?"}, {"speaker": "Deniz", "line": "He works as a security guard at a shopping centre. He checks IDs and makes sure everyone is safe."}, {"speaker": "Elif", "line": "That's great for our project! Let's write our notes and finish the homework together."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is Deniz's mother's job?", "section": "While you listen", "options": ["Bank clerk", "Pharmacist", "Security guard"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Does Deniz's mother work on Sundays?", "section": "While you listen", "options": ["Yes, every Sunday", "No, she doesn't", "Only in the morning"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Elif's father's job?", "section": "While you listen", "options": ["Electrician", "Mechanic", "Accountant"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Deniz's father do at the shopping centre?", "section": "While you listen", "options": ["He serves customers", "He checks IDs as a security guard", "He repairs the building"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Elif and Deniz decide not to do the homework together.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Elif and Deniz decide to write their notes and finish the homework together.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Have you ever talked to a friend about your parents' jobs? What did you say?", "Write two questions you would like to ask a classmate about a family member's job."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning the Career Day Presentation", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning their Career Day presentation about a family member's job.", "Predict: what information do you think they need to include?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning the Career Day Presentation", "audio": null, "transcript": [{"speaker": "Kerem", "line": "So, for Career Day, I'm presenting my mother's job. Can you help me plan it?"}, {"speaker": "Ela", "line": "Sure! First, what does your mother do exactly?"}, {"speaker": "Kerem", "line": "She's an accountant. She works in an office in the city centre."}, {"speaker": "Ela", "line": "Good. We should also say what she does every day and if she works at weekends."}, {"speaker": "Kerem", "line": "She checks numbers and prepares reports. She doesn't work at weekends."}, {"speaker": "Ela", "line": "Perfect, let's add that. What about a photo for the poster?"}, {"speaker": "Kerem", "line": "I can bring a photo of her office. Can you help me practise the presentation tomorrow?"}, {"speaker": "Ela", "line": "Yes, I can. Let's meet at break time and practise together."}, {"speaker": "Kerem", "line": "Great, see you at break!"}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Whose job is Kerem presenting?", "section": "While you listen", "options": ["His father's", "His mother's", "His uncle's"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is Kerem's mother's job?", "section": "While you listen", "options": ["Bank clerk", "Accountant", "Pharmacist"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Does Kerem's mother work at weekends?", "section": "While you listen", "options": ["Yes, every weekend", "No, she doesn't", "Only on Saturdays"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Kerem and Ela decide not to practise the presentation together.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Kerem and Ela decide to meet at break time and practise together.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "When will Kerem and Ela practise the presentation?", "section": "While you listen", "options": ["At break time", "After school", "Next week"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["If you planned a Career Day presentation, whose job would you choose? Why?", "Write one sentence with the Simple Present about a family member's daily work activity."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Guess the Job", "text": "Think of a job for an invented family member. Walk around the class and answer your classmates' yes/no questions with the Simple Present and at/in/on so they can guess the job. Then guess theirs.", "steps": ["Secretly choose a job and a workplace for your invented family member.", "Find a partner and let them ask up to 5 yes/no questions with 'does'.", "Answer honestly with short answers.", "Swap roles, then find a new partner.", "After 4-5 rounds, share one interesting guess with the class."], "chips": ["Does he/she work in an office?", "Does he/she work at a shopping centre?", "Does he/she serve customers?", "Yes, he/she does. / No, he/she doesn't."], "timer": 600, "levels": ["Give students a list of sample questions before they start.", "5 rounds of guessing with a partner.", "Fast finishers add one extra clue using 'at/in/on' about the workplace."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Career Day — Interview a Classmate", "text": "Interview a partner about a family member's job, workplace and work routine (real or invented, for creative-writing purposes). Take notes, then prepare to present your partner's family member as part of the 'Career Day' presentation.", "steps": ["In pairs, take turns asking the interview questions and noting the answers.", "Check the job title and workplace name together.", "Prepare 4-5 sentences introducing your partner's family member.", "Practise your short presentation with your partner.", "Present your partner's family member to a small group or the whole class."], "chips": ["What does your... do?", "Where does he/she work?", "What does he/she do every day?", "This is [name]'s [family member]. He/She works as... He/She works at/in..."], "timer": 300, "levels": ["Give a question and sentence-starter card for lower-level students.", "Full interview + a short presentation about your partner's family member.", "Fast finishers add one extra sentence with 'at/in/on' about the workplace."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Family Member's Job Profile", "text": "Write a short job profile about a family member (or an invented family member, for creative-writing purposes) for the school website. Include their job, workplace, and at least two things they do every day at work.", "steps": ["Choose a title for your profile, e.g. 'My Aunt the Pharmacist'.", "Note the person's job and workplace.", "List two or three things they do every day.", "Add one sentence about their work routine (weekends, shifts, etc.).", "Check your grammar and punctuation."], "chips": ["workplace", "work routine", "shift", "to serve customers", "to check IDs", "branch", "He/She works as...", "He/She works at/in...", "Every day, he/she...", "He/She doesn't..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Day at My Family Member's Workplace", "text": "Imagine you are spending a day at a family member's workplace (real or invented, for creative-writing purposes). Write a diary entry or postcard describing where you are, what your family member does, and what you see them do.", "steps": ["Choose a family member and a workplace for your text.", "Say where you are, using at/in/on.", "Describe what your family member does, using the Simple Present.", "Say two things you see happening at the workplace.", "End with a short closing line."], "chips": ["workplace", "warehouse", "office", "shopping centre", "to serve customers", "to check IDs", "Today I'm at...", "He/She works...", "I can see...", "It's interesting because..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'security guard'", "section": "Exit ticket", "options": ["a person who serves food", "a person who checks IDs and keeps a place safe", "a person who repairs cars"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'work routine' mean?", "section": "Exit ticket", "options": ["a person's usual pattern of work activities", "a type of workplace", "a family member"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My aunt ___ as a bank clerk.", "section": "Exit ticket", "options": ["work", "works", "working"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My uncle ___ on Sundays.", "section": "Exit ticket", "options": ["doesn't work", "don't work", "isn't work"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My mother works ___ the pharmacy.", "section": "Exit ticket", "options": ["at", "on", "for"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "My father works ___ a big office ___ İzmir.", "section": "Exit ticket", "options": ["at / at", "in / in", "on / on"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In 'My Family, Different Jobs', what is Deniz's mother's job?", "section": "Exit ticket", "options": ["Bank clerk", "Pharmacist", "Accountant"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz's mother works every day, including Sundays.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Deniz's mother doesn't work on Sundays.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In 'Career Day at Our School', what is Ela's father's job?", "section": "Exit ticket", "options": ["Accountant", "Mechanic", "Flight attendant"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ your father work in an office? (soru: Simple Present)", "section": "Exit ticket", "reveal": "Does", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "There's a photo of my uncle ___ the wall. (yüzey)", "section": "Exit ticket", "reveal": "on", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'a member of your family who is not your parent, brother or sister'?", "section": "Exit ticket", "options": ["workplace", "relative", "shift"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
