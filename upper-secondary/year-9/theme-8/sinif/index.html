. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The main character ___ the strange invention at first.", "section": "A · Choose the correct option.", "options": ["doesn't trust", "don't trust", "not trusts"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ the hero save the city in the end?", "section": "A · Choose the correct option.", "options": ["Do", "Does", "Is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The scientists ___ (build) a new robot to help them.", "section": "B · Complete with the Simple Present.", "reveal": "build", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The crew ___ (not/escape) at first, but they find a way out later.", "section": "B · Complete with the Simple Present.", "reveal": "don't escape / do not escape", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The hero save the city with the help of a robot.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The hero saves the city with the help of a robot.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "The main character doesn't trust the strange invention.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ (happen) at the start of the film?", "section": "Dialogue · Complete with the Simple Present.", "reveal": "happens", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: A spaceship ___ (land) near a small town, and everyone ___ (panic).", "section": "Dialogue · Complete with the Simple Present.", "reveal": "lands / panics", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question about the ending of a film.", "section": "Dialogue · Complete with the Simple Present.", "words": ["does", "the", "hero", "save", "the", "city", "in", "the", "end"], "end": "?", "reveal": "Does the hero save the city in the end?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Simple Future (will): Predictions about Technology", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["By 2050, robots <mark>will<\/mark> do most of the housework at home.", "I think artificial intelligence <mark>will<\/mark> help doctors diagnose illnesses faster.", "Cars <mark>won't<\/mark> need drivers in fifty years' time.", "<mark>Will<\/mark> people live on other planets one day? — I think they <mark>will<\/mark>."], "ask": "Which word do we use before the verb to talk about the future? How do we make it negative and a question? Does the verb change for he/she/it?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["will", "won't", "Will", "base verb"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "We use '___' + base verb to make predictions about the future.", "section": "Complete the rule", "reveal": "will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative form is '___', for things we don't expect to happen.", "section": "Complete the rule", "reveal": "won't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a question, '___' comes before the subject.", "section": "Complete the rule", "reveal": "Will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After will/won't, the verb stays in its ___ (no -s, no 'to').", "section": "Complete the rule", "reveal": "base verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use 'will' to make predictions about the future and to express what the speaker believes, expects or guesses will happen. Negative: won't. Question: Will + subject + base verb? Always use the base verb after will/won't, even with he/she/it.", "tr": "'Will' gelecekle ilgili tahminlerde, konuşmacının inandığı veya beklediği şeyleri, görüş ve tahminlerini anlatmak için kullanılır. Olumsuzda 'won't', soruda 'will' özneden önce gelir. Will'den sonra fiilin yalın hâli kullanılır, he/she/it ile bile -s almaz.", "when_en": "We use this to make predictions about future technology, inventions and events.", "when": "Gelecekteki teknoloji, icatlar ve olaylar hakkında tahminde bulunurken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["robots", "do", "most of the housework by 2050"], "reveal": "Robots will do most of the housework by 2050.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["artificial intelligence", "help", "doctors diagnose illnesses faster"], "reveal": "Artificial intelligence will help doctors diagnose illnesses faster.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["cars", "not / need", "drivers in fifty years"], "reveal": "Cars won't need drivers in fifty years.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / people", "live", "on other planets one day"], "reveal": "Will people live on other planets one day?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["scientists", "discover", "new forms of clean energy"], "reveal": "Scientists will discover new forms of clean energy.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / everyone", "have", "a personal robot at home"], "reveal": "Will everyone have a personal robot at home?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three predictions with will/won't about technology in fifty years' time.", "chips": ["In fifty years, people will...", "I think robots will...", "Cars won't..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["Robots will do most of the housework.", "She will invent something amazing one day."], "negative": ["Cars won't need drivers in the future.", "People won't use paper books very much."], "question": ["Will people live on other planets?", "Will robots replace teachers?"], "short": ["Yes, they will. / No, they won't.", "Yes, I think so. / No, I don't think so."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "Robots will to do the housework.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Robots will do the housework.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She wills discover a new planet.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She will discover a new planet.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "By 2050, robots ___ do most of the housework.", "section": "A · Choose the correct option.", "options": ["will", "is", "are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Artificial intelligence ___ help doctors work faster.", "section": "A · Choose the correct option.", "options": ["wills", "will", "is will"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Cars ___ need drivers in fifty years — they will drive themselves.", "section": "A · Choose the correct option.", "options": ["will", "won't", "isn't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ people live on other planets one day?", "section": "A · Choose the correct option.", "options": ["Do", "Will", "Are"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Scientists ___ (discover) new forms of clean energy soon.", "section": "B · Complete with will/won't.", "reveal": "will discover", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "I don't think people ___ (not/use) paper books much in the future.", "section": "B · Complete with will/won't.", "reveal": "will use", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I think robots will to replace some workers.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I think robots will replace some workers.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "Scientists will discover new forms of clean energy.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What do you think technology ___ (be) like in fifty years?", "section": "Dialogue · Complete with will/won't.", "reveal": "will be", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: I think everyone ___ have a personal robot, but cars ___ fly.", "section": "Dialogue · Complete with will/won't.", "reveal": "will / won't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a prediction about space travel.", "section": "Dialogue · Complete with will/won't.", "words": ["people", "will", "travel", "to", "other", "planets", "one", "day"], "end": ".", "reveal": "People will travel to other planets one day.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Film Review: Attack of the Robots", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What genre do you think this film is?", "Guess: what might happen in a film called 'Attack of the Robots'?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Film Review: Attack of the Robots", "num": 1, "total": 5, "text": "'Attack of the Robots' is a new science fiction film, and it is already one of the most popular films of the year. If you enjoy space adventures with exciting special effects, this film is definitely for you.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Film Review: Attack of the Robots", "num": 2, "total": 5, "text": "The plot follows a young engineer named Mira, who discovers a hidden spaceship in an old factory. Inside, she finds a group of friendly robots who warn her about an alien invasion that is coming to Earth. Mira doesn't trust the robots at first, but she soon realises they need her help.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Film Review: Attack of the Robots", "num": 3, "total": 5, "text": "Together, Mira and the robots build a new device that can stop the aliens. The special effects in the invasion scenes are incredible — the alien ships look completely real, and the futuristic city looks amazing on the big screen. The film also has a few funny moments, so it isn't only action and drama; it has a little comedy too.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Film Review: Attack of the Robots", "num": 4, "total": 5, "text": "The main character, Mira, is brave and clever, and the robot characters are surprisingly funny. My favourite character is a small robot called Ziggy, who makes the audience laugh in almost every scene, even during the most dangerous parts of the story.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Film Review: Attack of the Robots", "num": 5, "total": 5, "text": "Does the film have a happy ending? I won't tell you exactly what happens, but I will say this: 'Attack of the Robots' is an exciting, funny and futuristic film that both teenagers and adults will enjoy. I give it four stars out of five!", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["Instructions for building a robot", "A review of a science fiction film", "A true story about aliens"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Mira discover in the old factory?", "section": "While you read", "options": ["A hidden spaceship", "A new invention shop", "An alien city"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do Mira and the robots build together?", "section": "While you read", "options": ["A new spaceship", "A device to stop the aliens", "A cartoon film"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the reviewer, what makes the character Ziggy special?", "section": "While you read", "options": ["He is the villain of the film", "He makes the audience laugh", "He doesn't speak in the film"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mira trusts the robots immediately when she meets them.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Mira doesn't trust the robots at first — she trusts them later.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What can you infer about the reviewer's overall opinion of the film?", "section": "While you read", "options": ["The reviewer dislikes the film and doesn't recommend it", "The reviewer enjoys the film and recommends it to others", "The reviewer has no opinion about the film"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Would you like to watch 'Attack of the Robots'? Why or why not? Write two sentences.", "Think of a film you have seen. Write one sentence describing its plot using the Simple Present."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Türkiye's Journey to Space", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you already know about Türkiye's space activities?", "Guess: what kinds of goals might a national space programme have?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Türkiye's Journey to Space", "num": 1, "total": 5, "text": "In recent years, Türkiye has taken exciting steps into space science and technology. The country now has its own National Space Programme, with clear goals for the future of Turkish space exploration.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Türkiye's Journey to Space", "num": 2, "total": 5, "text": "One of the programme's aims is to send more Turkish satellites into orbit to improve communication, weather prediction and agriculture across the country. Engineers and scientists are working on new devices and futuristic technology that will make these satellites smarter and more efficient.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Türkiye's Journey to Space", "num": 3, "total": 5, "text": "The programme also has bigger dreams. Officials say that Türkiye will develop its own spaceport in the coming years, and that Turkish astronauts will take part in future international space missions. Some experts predict that within a few decades, Türkiye will also contribute to missions that explore the Moon and beyond.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Türkiye's Journey to Space", "num": 4, "total": 5, "text": "Young people play an important part in this journey too. Universities and technology centres across Türkiye now offer programmes where students can study robotics, artificial intelligence and space engineering. Many students dream of becoming the scientists who will discover new technology for future space missions.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Türkiye's Journey to Space", "num": 5, "total": 5, "text": "Nobody knows exactly what the future will bring, but one thing is clear: Türkiye's space journey is only just beginning. As one young engineer said in an interview, 'In fifty years, I think our inventions will help people travel further into space than we ever imagined.'", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["A science fiction film about space", "Türkiye's National Space Programme and its future plans", "How to become an astronaut"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is one aim of Türkiye's National Space Programme, according to the text?", "section": "While you read", "options": ["To send more Turkish satellites into orbit", "To build a new type of robot", "To make a new film about aliens"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do officials say Türkiye will build in the coming years?", "section": "While you read", "options": ["A new spaceship museum", "Its own spaceport", "A robot factory"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What can students study at universities and technology centres, according to the text?", "section": "While you read", "options": ["Robotics, artificial intelligence and space engineering", "Film-making and animation only", "Only foreign languages"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The text says that Türkiye's space journey is already finished.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says Türkiye's space journey is only just beginning.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the young engineer's quotation at the end suggest?", "section": "While you read", "options": ["She is not hopeful about the future of space travel", "She believes future inventions will help people travel further into space", "She thinks space travel is not important"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Do you think you would like to work in Türkiye's space programme one day? Why or why not?", "Write one prediction with 'will' about the future of space travel."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Choosing a Movie for Friday Night", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two friends, Ege and Sude, deciding which film to watch on Friday night.", "Guess: what film genres do you think they will talk about?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Choosing a Movie for Friday Night", "audio": null, "transcript": [{"speaker": "Ege", "line": "Hey, do you want to watch a film on Friday night? I really want to see something new."}, {"speaker": "Sude", "line": "Sure! What genre do you feel like? I love comedies, but I know you prefer action films."}, {"speaker": "Ege", "line": "Actually, I'd like to try something different. What about that new science fiction film, 'Attack of the Robots'?"}, {"speaker": "Sude", "line": "Oh, I read a review of that! It follows an engineer who discovers a spaceship and has to stop an alien invasion."}, {"speaker": "Ege", "line": "That sounds exciting! Does it have good special effects?"}, {"speaker": "Sude", "line": "Yes, apparently they're amazing. The reviewer also says it has a few funny moments, so it isn't only action."}, {"speaker": "Ege", "line": "Perfect — a bit of comedy and a bit of action! Let's watch that one."}, {"speaker": "Sude", "line": "Great choice. I think we'll both enjoy it. Let's meet at seven."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What genre does Sude say she loves?", "section": "While you listen", "options": ["Horror", "Comedy", "Documentary"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Which film do Ege and Sude decide to watch?", "section": "While you listen", "options": ["Attack of the Robots", "A romantic comedy", "A nature documentary"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the film's plot follow, according to Sude?", "section": "While you listen", "options": ["A pilot who discovers a new planet", "An engineer who discovers a spaceship and stops an alien invasion", "A robot who wants to become human"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the reviewer say about the film's special effects?", "section": "While you listen", "options": ["They are amazing", "They are disappointing", "There aren't any"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Ege and Sude decide not to watch a film together.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ege and Sude decide to watch 'Attack of the Robots' together at seven.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Which film genre do you prefer — comedy, action or science fiction? Why?", "Write one sentence describing the plot of a film you enjoy, using the Simple Present."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "What Will Technology Be Like in 2050?", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students, Deniz and Zeynep, discussing predictions for technology in the future.", "Predict: what kinds of technology do you think they will mention?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "What Will Technology Be Like in 2050?", "audio": null, "transcript": [{"speaker": "Deniz", "line": "Our homework is to make predictions about technology in 2050. What do you think will change the most?"}, {"speaker": "Zeynep", "line": "I think artificial intelligence will help doctors diagnose illnesses much faster than today."}, {"speaker": "Deniz", "line": "That's a good prediction. I think robots will do most of the housework too."}, {"speaker": "Zeynep", "line": "Definitely! And I don't think people will drive cars themselves — cars will drive us instead."}, {"speaker": "Deniz", "line": "Will people live on other planets, do you think?"}, {"speaker": "Zeynep", "line": "Maybe not by 2050, but I think scientists will discover a lot more about space by then."}, {"speaker": "Deniz", "line": "I agree. I also think new inventions will help protect the environment."}, {"speaker": "Zeynep", "line": "That's a great point. Let's add all these predictions to our project."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What is Zeynep's prediction about artificial intelligence?", "section": "While you listen", "options": ["It will replace all teachers", "It will help doctors diagnose illnesses faster", "It will stop working by 2050"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Deniz predict robots will do?", "section": "While you listen", "options": ["Fly spaceships", "Most of the housework", "Write film reviews"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does Zeynep say about cars in the future?", "section": "While you listen", "options": ["People won't drive them themselves", "Nobody will use cars anymore", "Cars will only be used in films"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Zeynep is sure that people will live on other planets by 2050.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Zeynep says maybe not by 2050, but scientists will discover more about space.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What is the purpose of Deniz and Zeynep's conversation?", "section": "While you listen", "options": ["To review a film together", "To make predictions about future technology for their homework", "To plan a trip to space"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Which prediction from the conversation do you agree with most? Why?", "Write one prediction of your own about technology in fifty years' time."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Pitch Your Own Film", "text": "Invent your own film (any genre). Describe its plot, main character and genre to your partner using the Simple Present, as if you are pitching the idea to a film company.", "steps": ["Individually, plan a short film idea: genre, main character, and 3-4 plot events.", "Take turns pitching your film idea to your partner using the Simple Present.", "Your partner asks at least 2 questions about the plot.", "Swap roles, then find a new partner and pitch again.", "Vote as a class on the most original film idea."], "chips": ["My film is a [genre] about...", "The main character discovers/finds/builds...", "In the end, the hero...", "Does that sound interesting?"], "timer": 600, "levels": ["Give students a genre word bank and plot-event sentence starters.", "One full pitch with a partner, including 2 questions answered.", "Fast finishers add one sentence using 'will' to predict how audiences will react to the film."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Predictions for the Future", "text": "In small groups, discuss and agree on three predictions about technology or life in fifty years' time, then present and defend your predictions to the class.", "steps": ["In groups of 3-4, brainstorm 5-6 possible predictions about the future.", "Discuss each idea and choose the group's top three predictions.", "Prepare one sentence with 'will/won't' for each prediction, with a reason.", "Present your three predictions to another group or the whole class.", "Listen to another group's predictions and say if you agree or disagree."], "chips": ["I think ... will/won't happen because...", "Do you agree that...?", "I'm not sure I agree. I think...", "By 2075, people will probably..."], "timer": 300, "levels": ["Give a list of topic prompts (transport, school, health, homes, space).", "Three agreed predictions presented with reasons.", "Fast finishers debate one prediction they disagree with, giving reasons."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "Write a Film Review", "text": "Write a short review of a film you know well (or an invented film, for creative-writing purposes). Describe its genre, plot and main character, and give your opinion.", "steps": ["Choose a title for your review, e.g. 'Film Review: [Film Title]'.", "Note the genre and one sentence about the plot.", "Describe the main character in one or two sentences.", "Add your opinion: did you enjoy it? Would you recommend it?", "Check your grammar and punctuation."], "chips": ["genre", "plot", "character", "special effects", "science fiction", "film review", "The film is a [genre] about...", "The main character...", "In the end,...", "I recommend/don't recommend this film because..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "My Invention for the Future", "text": "Imagine an invention that will exist in the future. Write a paragraph describing what it will do and how it will change people's lives, using 'will'.", "steps": ["Choose a futuristic invention (real idea or your own creation).", "Say what it will do, using 'will'.", "Say how it will change daily life for people.", "Add one prediction about when it might exist.", "End with your own opinion about the invention."], "chips": ["invention", "futuristic", "technology", "artificial intelligence", "device", "prediction", "In the future, there will be...", "This invention will...", "It will help people...", "I think it will..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'genre'", "section": "Exit ticket", "options": ["the main character of a film", "a type or category of film", "a special effect"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'futuristic' mean?", "section": "Exit ticket", "options": ["belonging to the past", "relating to an imagined future", "very old and traditional"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "A young robot ___ a hidden spaceship in the forest.", "section": "Exit ticket", "options": ["discover", "discovers", "discovering"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "The aliens ___ Earth in the film.", "section": "Exit ticket", "options": ["invades", "invade", "invading"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "By 2050, robots ___ do most of the housework.", "section": "Exit ticket", "options": ["will", "is", "are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Cars ___ need drivers in fifty years.", "section": "Exit ticket", "options": ["will", "won't", "don't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In 'Attack of the Robots', what does Mira discover in the old factory?", "section": "Exit ticket", "options": ["A hidden spaceship", "A cartoon studio", "A new invention shop"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mira trusts the robots immediately when she meets them.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Mira doesn't trust the robots at first — she trusts them later.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In 'Türkiye's Journey to Space', what will officials build in the coming years?", "section": "Exit ticket", "options": ["A new spaceport", "A robot factory", "A film studio"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ people live on other planets one day? (soru: will)", "section": "Exit ticket", "reveal": "Will", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The main character ___ (not/trust) the invention at first. (Simple Present)", "section": "Exit ticket", "reveal": "doesn't trust", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'a person's role or part in a film'?", "section": "Exit ticket", "options": ["character", "device", "genre"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
