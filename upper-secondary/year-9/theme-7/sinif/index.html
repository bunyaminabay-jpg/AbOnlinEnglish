s...", "There wasn't..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["There were many whales in this ocean.", "This forest was the tiger's habitat."], "negative": ["There wasn't a nature reserve here before.", "The desert wasn't this dry fifty years ago."], "question": ["Was there a shelter for injured animals?", "Were there cheetahs in this grassland?"], "short": ["Yes, there was. / No, there wasn't.", "Yes, there were. / No, there weren't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "There was thousands of tigers.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There were thousands of tigers.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This forest were a safe habitat.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This forest was a safe habitat.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "Fifty years ago, there ___ thousands of tigers in this forest.", "section": "A · Choose the correct option.", "options": ["was", "were", "is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This area ___ a safe habitat for cheetahs.", "section": "A · Choose the correct option.", "options": ["was", "were", "are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "There ___ a nature reserve here in 1990.", "section": "A · Choose the correct option.", "options": ["isn't", "wasn't", "weren't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ there many whales in this ocean last century?", "section": "A · Choose the correct option.", "options": ["Did", "Was", "Were"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The ocean ___ (not) polluted fifty years ago.", "section": "B · Complete with was/were/there was/there were.", "reveal": "wasn't / was not", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ (there) a shelter for injured animals last year?", "section": "B · Complete with was/were/there was/there were.", "reveal": "Was there", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "There was many cheetahs in this grassland.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There were many cheetahs in this grassland.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "There wasn't a nature reserve here in 1990.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: ___ there many tigers in this forest a hundred years ago?", "section": "Dialogue · Complete with was/were.", "reveal": "Were", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: Yes, there ___. There ___ thousands of them.", "section": "Dialogue · Complete with was/were.", "reveal": "were / were", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a sentence about the past.", "section": "Dialogue · Complete with was/were.", "words": ["this", "grassland", "was", "a", "safe", "habitat", "for", "cheetahs"], "end": ".", "reveal": "This grassland was a safe habitat for cheetahs.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Should: advice, recommendation and obligation", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["We <mark>should<\/mark> protect endangered animals like tigers and whales.", "Poachers <mark>shouldn't<\/mark> hunt endangered species illegally.", "You <mark>should<\/mark> report illegal hunting to the local authorities.", "<mark>Should<\/mark> we build more nature reserves? — Yes, we <mark>should<\/mark>."], "ask": "Which sentences give advice or a recommendation? Which show that something is (or isn't) the right thing to do? How do we make 'should' negative and a question?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["should", "shouldn't", "Should", "base verb"], "chips": true, "text": "Look at the Notice sentences again. Complete the rule with the words in the box.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "'___' gives advice, a recommendation or shows an obligation.", "section": "Complete the rule", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The negative is '___', for things that are not a good idea or not allowed.", "section": "Complete the rule", "reveal": "shouldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "In a question, '___' comes before the subject.", "section": "Complete the rule", "reveal": "Should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "After should/shouldn't, we always use the ___ (no -s, no 'to').", "section": "Complete the rule", "reveal": "base verb", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use 'should' to give advice, make a recommendation or talk about an obligation — 'ought to'. Negative: shouldn't. Question: Should + subject + base verb? Always use the base verb after should/shouldn't.", "tr": "'Should' tavsiye, öneri veya bir yükümlülük belirtmek için kullanılır; 'gerekir/-meli/-malı' anlamı taşır. Olumsuzda 'shouldn't', soruda 'should' özneden önce gelir. Should'dan sonra fiilin yalın hâli kullanılır.", "when_en": "We use this to give people or governments advice about protecting wildlife and habitats, and to say what is or isn't the right thing to do.", "when": "İnsanlara veya hükümetlere yaban hayatını ve habitatları korumaları için tavsiye verirken, doğru ya da yanlış davranışları belirtirken kullanırız.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["we", "protect", "endangered animals like tigers and whales"], "reveal": "We should protect endangered animals like tigers and whales.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["poachers", "not / hunt", "endangered species illegally"], "reveal": "Poachers shouldn't hunt endangered species illegally.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you", "report", "illegal hunting to the local authorities"], "reveal": "You should report illegal hunting to the local authorities.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / we", "build", "more nature reserves"], "reveal": "Should we build more nature reserves?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["people", "not / buy", "products made from endangered animals"], "reveal": "People shouldn't buy products made from endangered animals.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["? / governments", "spend", "more money on conservation"], "reveal": "Should governments spend more money on conservation?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write three sentences with should/shouldn't giving advice about protecting an endangered animal or its habitat.", "chips": ["We should...", "People shouldn't...", "Governments should..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["We should protect this species.", "Governments should build more reserves."], "negative": ["Poachers shouldn't hunt illegally.", "You shouldn't disturb wild animals."], "question": ["Should we report illegal hunting?", "Should people buy products from endangered animals?"], "short": ["Yes, we should. / No, we shouldn't.", "Yes, you should. / No, you shouldn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We should to protect endangered animals.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We should protect endangered animals.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "He shoulds report illegal hunting.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He should report illegal hunting.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "mcq", "q": "We ___ protect endangered animals and their habitats.", "section": "A · Choose the correct option.", "options": ["should", "was", "were"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Poachers ___ hunt endangered species — it's illegal.", "section": "A · Choose the correct option.", "options": ["should", "shouldn't", "isn't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "___ we build more nature reserves?", "section": "A · Choose the correct option.", "options": ["Do", "Should", "Were"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "People ___ buy products made from endangered animals.", "section": "A · Choose the correct option.", "options": ["shoulds", "shouldn't", "isn't should"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "You ___ (report) illegal hunting to the local authorities.", "section": "B · Complete with should/shouldn't.", "reveal": "should report", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Tourists ___ (not/feed) wild animals in a nature reserve.", "section": "B · Complete with should/shouldn't.", "reveal": "shouldn't feed", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Governments should to spend more money on conservation.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Governments should spend more money on conservation.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "judge", "q": "We should protect this species before it becomes extinct.", "section": "C · Judge the sentence.", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A: What ___ we do to help endangered animals?", "section": "Dialogue · Complete with should/shouldn't.", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "B: We ___ support conservation projects, and we ___ buy illegal animal products.", "section": "Dialogue · Complete with should/shouldn't.", "reveal": "should / shouldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "order", "q": "Make a question with should.", "section": "Dialogue · Complete with should/shouldn't.", "words": ["should", "we", "build", "more", "nature", "reserves"], "end": "?", "reveal": "Should we build more nature reserves?", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Saving the Bengal Tiger", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you already know about tigers and why they are endangered?", "Guess: what two or three threats do you think tigers face today?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Saving the Bengal Tiger", "num": 1, "total": 5, "text": "A hundred years ago, there were more than 100,000 tigers living in the wild across Asia. Today, there are only a few thousand left, and the Bengal tiger is one of the most endangered big cats in the world.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Bengal Tiger", "num": 2, "total": 5, "text": "Bengal tigers live in grasslands and forests, mostly in India, Bangladesh and Nepal. Fifty years ago, their habitat was much bigger, and there were plenty of grasslands and forests for them to hunt in. Today, much of that habitat has disappeared because of farming and new towns.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Bengal Tiger", "num": 3, "total": 5, "text": "Illegal hunting is another serious threat. Poachers sometimes kill tigers illegally and sell their skin and bones, even though this is against the law almost everywhere. Climate change is also a growing threat, because it changes the grasslands and forests where tigers live.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Bengal Tiger", "num": 4, "total": 5, "text": "Conservation groups are working hard to help. They protect large areas of grassland as nature reserves, where tigers can live safely. In some reserves, there weren't many tigers ten years ago, but numbers are slowly growing again thanks to this protection.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Saving the Bengal Tiger", "num": 5, "total": 5, "text": "Experts say that everyone should help protect the Bengal tiger. Governments should create more nature reserves, and people shouldn't buy products made from endangered animals. If we protect their habitat now, future generations should still be able to see wild tigers.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is the text mainly about?", "section": "While you read", "options": ["How to visit India", "Why the Bengal tiger is endangered and how it can be protected", "The history of big cats"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How many tigers were there in the wild a hundred years ago, according to the text?", "section": "While you read", "options": ["A few thousand", "More than 100,000", "About 500"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where do Bengal tigers mostly live?", "section": "While you read", "options": ["Oceans and deserts", "Grasslands and forests in India, Bangladesh and Nepal", "Rainforests in South America"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what do poachers sometimes do?", "section": "While you read", "options": ["Build nature reserves", "Illegally kill tigers and sell their skin and bones", "Study tiger habitats"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Tiger numbers in some reserves are falling every year.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Tiger numbers in some reserves are slowly growing again thanks to protection.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the text suggest people should do?", "section": "While you read", "options": ["Buy more animal products", "Not buy products made from endangered animals", "Stop visiting nature reserves"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Why do you think it is important to protect tigers, not just for tigers but for the whole habitat?", "Write two sentences about what you think governments should do to protect endangered animals."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Diary from Green Valley Nature Reserve", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What do you think students can see and learn on a school trip to a nature reserve?", "Guess two rules that visitors probably should follow in a nature reserve."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Diary from Green Valley Nature Reserve", "num": 1, "total": 5, "text": "Monday, 14 September — Today our class visited Green Valley Nature Reserve, and it was an unforgettable day! Our guide, Ms Aylin, told us that fifty years ago, this whole area was open grassland, and there were cheetahs and other wild animals living here freely.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Diary from Green Valley Nature Reserve", "num": 2, "total": 5, "text": "We started with a short talk about the reserve's history. Ms Aylin explained that there wasn't a proper shelter for injured animals here until 2015, when the reserve built a new animal hospital. Now the shelter helps hundreds of animals every year.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Diary from Green Valley Nature Reserve", "num": 3, "total": 5, "text": "Next, we walked along a nature trail and saw the reserve's small lake, where migrating birds stop to rest. Ms Aylin said that this species of bird was almost extinct thirty years ago, but thanks to conservation work, there are now hundreds of them again.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Diary from Green Valley Nature Reserve", "num": 4, "total": 5, "text": "In the afternoon, a ranger explained why illegal hunting is such a big problem for wildlife, and why poachers are a serious threat to endangered species. She said that visitors should always stay on the paths and shouldn't feed the wild animals, because it can be dangerous for both people and animals.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Diary from Green Valley Nature Reserve", "num": 5, "total": 5, "text": "By the end of the day, I understood something important: we should all do our part to protect wildlife, whether that means supporting a nature reserve, reporting illegal hunting, or simply learning more about the animals that share our planet.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What is this diary entry mainly about?", "section": "While you read", "options": ["A football match", "A school trip to a nature reserve", "A family holiday"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What was Green Valley Nature Reserve like fifty years ago, according to the guide?", "section": "While you read", "options": ["A busy city", "Open grassland with cheetahs and other wild animals", "A desert"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When did the reserve build its animal shelter?", "section": "While you read", "options": ["1990", "2015", "There isn't one"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does the ranger say visitors shouldn't do?", "section": "While you read", "options": ["Take photos", "Feed the wild animals", "Walk on the paths"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The bird species at the lake is still almost extinct today.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Thanks to conservation work, there are now hundreds of this bird species again.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does the writer's final comment suggest?", "section": "While you read", "options": ["Only rangers can help protect wildlife", "Everyone has a role to play in protecting wildlife", "Nature reserves are not useful"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["If you visited a nature reserve, which animal or habitat would you most want to see? Why?", "Write two sentences about what visitors should and shouldn't do in a nature reserve."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "A Class Trip to the Nature Reserve", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students, Deniz and Elif, talking about their class trip to a nature reserve.", "Guess: what two things do you think they will talk about — an animal, a place, or a rule?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "A Class Trip to the Nature Reserve", "audio": null, "transcript": [{"speaker": "Deniz", "line": "That trip to Green Valley Nature Reserve was amazing! I didn't know there were cheetahs so close to our town."}, {"speaker": "Elif", "line": "I know! Ms Aylin said that fifty years ago, this whole area was open grassland, full of wild animals."}, {"speaker": "Deniz", "line": "Really? So there weren't any farms or roads here back then?"}, {"speaker": "Elif", "line": "No, there weren't. It was all natural habitat. Now only the reserve protects that grassland."}, {"speaker": "Deniz", "line": "I liked the animal shelter too. Was there always a shelter like that?"}, {"speaker": "Elif", "line": "No, there wasn't — it opened in 2015. Before that, injured animals didn't have anywhere safe to go."}, {"speaker": "Deniz", "line": "We should visit again next year. Maybe we can join a conservation project."}, {"speaker": "Elif", "line": "Good idea! I think we should ask our teacher about that tomorrow."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What did the students see on their class trip?", "section": "While you listen", "options": ["A desert", "A nature reserve with cheetahs", "An ocean"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What was the area like fifty years ago, according to Elif?", "section": "While you listen", "options": ["A city", "Open grassland full of wild animals", "A farm"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "When did the animal shelter open?", "section": "While you listen", "options": ["2015", "1990", "It hasn't opened yet"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What do Deniz and Elif want to do next year?", "section": "While you listen", "options": ["Move to the reserve", "Visit again and join a conservation project", "Stop visiting nature reserves"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "There were farms and roads in the area fifty years ago.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There weren't any farms or roads — it was all natural habitat.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "list", "title": "After you listen", "list": ["Have you ever visited a nature reserve or a zoo? What did you see there?", "Write one sentence with 'there was/were' about a place you know well in the past."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Planning a Project on Endangered Animals", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["You will hear two students planning a class project about an endangered animal.", "Predict: what advice do you think they will give about protecting it?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Planning a Project on Endangered Animals", "audio": null, "transcript": [{"speaker": "Deniz", "line": "For our project, I think we should choose the cheetah. It's endangered and really interesting."}, {"speaker": "Elif", "line": "Good idea. We should explain its habitat first — grasslands, mostly in Africa."}, {"speaker": "Deniz", "line": "Right. And we shouldn't forget the threats — illegal hunting and habitat loss."}, {"speaker": "Elif", "line": "Exactly. I read that we should also mention climate change as a threat."}, {"speaker": "Deniz", "line": "Should we include some advice for our classmates too? Like what they can do?"}, {"speaker": "Elif", "line": "Yes, definitely. We should tell them not to buy illegal animal products."}, {"speaker": "Deniz", "line": "Good point. Should we make a poster or a short presentation?"}, {"speaker": "Elif", "line": "Let's do both — a poster with pictures, and a short spoken presentation."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "Which animal do Deniz and Elif choose for their project?", "section": "While you listen", "options": ["Tiger", "Cheetah", "Whale"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Where does the cheetah mostly live, according to Elif?", "section": "While you listen", "options": ["Oceans", "Grasslands, mostly in Africa", "Deserts in Asia"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What two threats do they mention?", "section": "While you listen", "options": ["Illegal hunting and habitat loss", "Cold weather and disease", "Tourism and farming"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Deniz and Elif decide not to give their classmates any advice.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They decide to tell their classmates not to buy illegal animal products.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What will Deniz and Elif make for their project?", "section": "While you listen", "options": ["Only a poster", "Only a presentation", "A poster and a short presentation"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["If you planned a project about an endangered animal, which animal would you choose? Why?", "Write one sentence with 'should' giving advice about protecting an animal you know."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "Then and Now: Describing a Habitat", "text": "Choose a habitat (real or invented, for creative-speaking purposes) and describe how it was in the past and what it is like now, using was/were and there was/there were.", "steps": ["In pairs, choose a habitat: a forest, a grassland, an ocean or a desert.", "Think of three things that were true about it in the past.", "Think of how it has changed today.", "Take turns describing your habitat's past and present to your partner.", "Share one interesting fact with the whole class."], "chips": ["Fifty years ago, there was/were...", "This area was/wasn't...", "Today, there is/isn't...", "Was there...? — Yes, there was. / No, there wasn't."], "timer": 600, "levels": ["Give students a list of sample sentence starters before they start.", "Describe at least three past facts and one present-day comparison.", "Fast finishers add one question with 'was/were there' for their partner to answer."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "What Should We Do? — A Wildlife Roundtable", "text": "In small groups, discuss what should and shouldn't be done to protect an endangered animal of your choice, then agree on three pieces of advice to share with the class.", "steps": ["In groups, choose one endangered animal to discuss.", "Each student suggests one piece of advice using 'should' or 'shouldn't'.", "Discuss and agree on the group's three best pieces of advice.", "Prepare a short spokesperson summary for the class.", "Present your group's advice to the class."], "chips": ["I think we should...", "People shouldn't...", "Governments should...", "Should we...? — Yes, I think so. / No, I don't think so."], "timer": 300, "levels": ["Give a list of sample advice sentences for lower-level students.", "Three pieces of advice with should/shouldn't, presented to the class.", "Fast finishers add one sentence about what tourists should do in a nature reserve."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "An Endangered Animal Fact File", "text": "Write a short fact file about an endangered animal (real or invented, for creative-writing purposes). Include its habitat, what it was like in the past, and at least two things people should do to protect it.", "steps": ["Choose a title for your fact file, e.g. 'All About the Snow Leopard'.", "Note the animal's habitat and one fact about it in the past.", "List two or three threats it faces.", "Add two sentences of advice using 'should'.", "Check your grammar and punctuation."], "chips": ["endangered", "habitat", "species", "threat", "conservation", "protect", "There was/were...", "Its habitat is...", "We should...", "People shouldn't..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A Letter to a Local Newspaper about Protecting Wildlife", "text": "Imagine you are writing a short letter to a local newspaper about protecting wildlife near your town (real or invented, for creative-writing purposes). Explain what the habitat used to be like and what people should do now.", "steps": ["Choose a habitat or animal near your town to write about.", "Say what it was like in the past using 'was/were'.", "Explain the main threat it faces now.", "Give two pieces of advice using 'should'.", "End with a polite closing sentence."], "chips": ["wildlife", "nature reserve", "illegal", "protect", "survive", "conservation", "In the past, there was/were...", "Now, ...", "I think we should...", "We shouldn't..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct meaning: 'endangered'", "section": "Exit ticket", "options": ["very common", "at risk of disappearing", "living in a zoo"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What does 'habitat' mean?", "section": "Exit ticket", "options": ["a natural home for an animal", "a type of hunting", "a nature reserve's rule"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Fifty years ago, there ___ thousands of tigers in this forest.", "section": "Exit ticket", "options": ["was", "were", "is"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "This area ___ a safe habitat for cheetahs.", "section": "Exit ticket", "options": ["was", "were", "are"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "We ___ protect endangered animals and their habitats.", "section": "Exit ticket", "options": ["should", "was", "were"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "Poachers ___ hunt endangered species — it's illegal.", "section": "Exit ticket", "options": ["should", "shouldn't", "isn't"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "In 'Saving the Bengal Tiger', where do Bengal tigers mostly live?", "section": "Exit ticket", "options": ["Oceans and deserts", "Grasslands and forests", "Cities and towns"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Tiger numbers in some reserves are falling every year.", "section": "Exit ticket", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Tiger numbers in some reserves are slowly growing again thanks to protection.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "In 'A Diary from Green Valley Nature Reserve', when did the animal shelter open?", "section": "Exit ticket", "options": ["2015", "1990", "It hasn't opened yet"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "___ there many tigers in this forest a hundred years ago? (soru: were)", "section": "Exit ticket", "reveal": "Were", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Governments ___ create more nature reserves. (should)", "section": "Exit ticket", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which word means 'a person who illegally hunts protected animals'?", "section": "Exit ticket", "options": ["ranger", "poacher", "guide"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}]}</script><script src="../../../assets/us-present.js"></script></body></html>
