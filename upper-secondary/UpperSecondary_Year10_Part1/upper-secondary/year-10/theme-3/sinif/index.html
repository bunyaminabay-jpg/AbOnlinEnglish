shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["she / meet / the doctor / at 4 pm / tomorrow"], "reveal": "She is meeting the doctor at 4 pm tomorrow.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["they / already decide / buy / new sports shoes"], "reveal": "They are going to buy new sports shoes.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the exam / start / at 9 o'clock / next Monday"], "reveal": "The exam starts at 9 o'clock next Monday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / think / more people / follow / a healthy diet / in the future"], "reveal": "I think more people will follow a healthy diet in the future.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we / plan / to visit / a new clothes shop / this Saturday"], "reveal": "We are going to visit a new clothes shop this Saturday.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about your own future plans or predictions for your health, habits, or style, using at least two different future forms.", "chips": ["I think in the future...", "Next month, I am going to...", "On Saturday, I am..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["People will live longer.", "I am going to join a gym.", "We are seeing the dentist at 3 pm.", "The clinic opens at nine."], "negative": ["People won't eat as much fast food.", "I am not going to buy that jacket.", "We aren't meeting today.", "The shop doesn't close early on Fridays."], "question": ["Will people wear different clothes in 2050?", "Are you going to change your diet?", "Are you meeting the doctor tomorrow?", "Does the shop open on Sundays?"], "short": ["Yes, they will. / No, they won't.", "Yes, I am. / No, I'm not.", "Yes, I am. / No, I'm not.", "Yes, it does. / No, it doesn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I think it will rains tomorrow.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I think it will rain tomorrow.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I'm going buy new shoes.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I'm going to buy new shoes.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "I think doctors ___ (find) new ways to help people sleep better in the future.", "section": "", "reveal": "will find", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Look, those clouds are black! It ___ soon.", "section": "", "options": ["will rain", "is going to rain", "rains", "is raining"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "We ___ (have) a school health check next Tuesday according to the plan.", "section": "", "reveal": "are having", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "The new term ___ on the 15th of September, according to the school calendar.", "section": "", "options": ["will start", "is going to start", "starts", "is starting"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "I'm going to studying medicine after school.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I'm going to study medicine after school.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: will / probably / people / wear / smart fabrics / in the future", "section": "", "words": ["people", "will", "probably", "wear", "smart", "fabrics", "in", "the", "future"], "end": ".", "reveal": "People will probably wear smart fabrics in the future.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using 'be going to': She has already bought a ticket for the fashion show.", "section": "", "reveal": "She is going to go to the fashion show. / She's going to the fashion show.", "prompt": "She ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "By the time we finish school, scientists ___ (probably / discover) new treatments for common illnesses.", "section": "", "reveal": "will probably have discovered / will probably discover", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence describes a fixed personal arrangement rather than a general prediction?", "section": "", "options": ["I will probably see a doctor sometime.", "I'm seeing the doctor at 5 pm on Friday.", "Doctors will use more technology.", "People will exercise more."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}]}, {"id": "grammar-1", "title": "Gramer 2", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Can / could (ability) and Should (advice)", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["I <mark>can run<\/mark> five kilometres now, but I <mark>couldn't run<\/mark> that far last year.", "You <mark>should drink<\/mark> more water when you have a fever.", "He <mark>shouldn't wear<\/mark> that jacket to a formal event.", "When I was younger, I <mark>could stay<\/mark> up late, but I can't anymore."], "ask": "What is the difference in meaning between can, could, and should in these sentences?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["can", "couldn't", "should", "shouldn't"], "chips": true, "text": "Complete the sentences with can, can't, could, couldn't, should, or shouldn't.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "She ___ speak three languages, so she can help tourists easily.", "section": "Complete the rule", "reveal": "can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "When he was a child, he ___ swim at all.", "section": "Complete the rule", "reveal": "couldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "If you have a sore throat, you ___ drink warm tea with honey.", "section": "Complete the rule", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "You ___ stay up so late before an exam; it isn't good for your health.", "section": "Complete the rule", "reveal": "shouldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Can/could express ability (can = present, could = past). Should/shouldn't give advice or recommend the right thing to do.", "tr": "Can/could yetenek belirtir (can = şimdiki zaman, could = geçmiş zaman). Should/shouldn't ise tavsiye vermek veya doğru olanı önermek için kullanılır.", "when_en": "Use can/could when talking about physical or mental ability; use should/shouldn't when giving advice about health, habits, or behaviour.", "when": "Fiziksel veya zihinsel yetenekten bahsederken can/could, sağlık, alışkanlık veya davranış hakkında tavsiye verirken should/shouldn't kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["you / have a headache / take a short rest"], "reveal": "If you have a headache, you should take a short rest.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / not / touch my toes / when I was younger"], "reveal": "I couldn't touch my toes when I was younger.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["she / play the piano / very well / now"], "reveal": "She can play the piano very well now.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["you / eat too much sugar / not / good idea"], "reveal": "You shouldn't eat too much sugar.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["students / wear / comfortable shoes / for sports day"], "reveal": "Students should wear comfortable shoes for sports day.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my grandfather / run fast / when he was young"], "reveal": "My grandfather could run fast when he was young.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences: one about something you can/could do, and one or two giving health or fashion advice with should/shouldn't.", "chips": ["I can...", "When I was younger, I could...", "If you feel tired, you should..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I can swim.", "She could read at the age of four.", "You should rest more."], "negative": ["I can't run very fast.", "He couldn't walk after the injury.", "You shouldn't skip breakfast."], "question": ["Can you touch your toes?", "Could you swim as a child?", "Should I see a doctor?"], "short": ["Yes, I can. / No, I can't.", "Yes, I could. / No, I couldn't.", "Yes, you should. / No, you shouldn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "She can to speak Spanish.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She can speak Spanish.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "You should to drink more water.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "You should drink more water.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "My sister ___ (can) dance really well; she's been learning for years.", "section": "", "reveal": "can", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "You have a bad cough. What ___ you do?", "section": "", "options": ["can", "should", "could", "will"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "When I was seven, I ___ (not/could) ride a bicycle.", "section": "", "reveal": "couldn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "He should wears a coat because it's cold outside.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "He should wear a coat because it's cold outside.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: too / eat / shouldn't / fast food / much / you", "section": "", "words": ["you", "shouldn't", "eat", "too", "much", "fast", "food"], "end": ".", "reveal": "You shouldn't eat too much fast food.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite as advice using should: It is a good idea for you to sleep eight hours a night.", "section": "", "reveal": "You should sleep eight hours a night.", "prompt": "You ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly talks about a past ability that no longer exists?", "section": "", "options": ["I can play football when I was ten.", "I could play football when I was ten, but now my knee hurts.", "I should play football when I was ten.", "I will play football when I was ten."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "If you keep feeling dizzy, you really ___ (should) see a doctor soon.", "section": "", "reveal": "should", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "grammar-2", "title": "Gramer 3", "color": "#2766D6", "screens": [{"type": "title", "kicker": "Grammar", "title": "Comparative adjectives, as...as / same...as / like / alike, and -ing/-ed adjectives", "note": "Don't give the rule yet. / Kuralı henüz vermeyin."}, {"type": "notice", "title": "Notice", "items": ["This jacket is <mark>warmer than<\/mark> that one.", "My style is <mark>as casual as<\/mark> my brother's.", "These two outfits look <mark>alike<\/mark>, don't they?", "The lesson about healthy habits was really <mark>interesting<\/mark>, so I felt <mark>interested<\/mark> the whole time."], "ask": "What patterns do you notice for comparing things and for using -ing/-ed adjectives?", "note": "Reveal the sentences one by one. Ask: What is the same in these sentences? / Cümleleri tek tek açın; ‘Ortak olan ne?’ diye sorun."}, {"type": "list", "title": "Complete the rule", "list": ["healthier than", "as comfortable as", "the same colour as", "exhausting", "exhausted"], "chips": true, "text": "Complete the sentences with the correct comparative form or -ing/-ed adjective.", "note": "Pairs complete the rule in their notebooks (2 min). / İkililer kuralı deftere tamamlar."}, {"type": "question", "qtype": "gap", "q": "A salad is usually ___ a burger.", "section": "Complete the rule", "reveal": "healthier than", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "These trainers are ___ my old ones.", "section": "Complete the rule", "reveal": "as comfortable as", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Her scarf is ___ her bag.", "section": "Complete the rule", "reveal": "the same colour as", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "The long hike was really ___, so by the evening everyone felt ___.", "section": "Complete the rule", "reveal": "exhausting / exhausted", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "Comparative adjectives (+ than) compare two different things. As...as and same...as show two things are equal; like and alike show similarity. -ing adjectives describe what causes a feeling; -ed adjectives describe the person who feels it.", "tr": "Karşılaştırmalı sıfatlar (+ than) iki farklı şeyi kıyaslar. As...as ve same...as iki şeyin eşit olduğunu; like ve alike ise benzerliği gösterir. -ing sıfatları bir duyguya neden olan şeyi, -ed sıfatları ise o duyguyu hisseden kişiyi tanımlar.", "when_en": "Use these structures when comparing habits, clothes, or people, and when describing how something makes you feel.", "when": "Alışkanlıkları, kıyafetleri veya kişileri karşılaştırırken ve bir şeyin sizi nasıl hissettirdiğini anlatırken bu yapılar kullanılır.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["this coat / warm / that coat"], "reveal": "This coat is warmer than that coat.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["my shoes / not / as expensive as / your shoes"], "reveal": "My shoes are not as expensive as your shoes.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the two sisters / dress / alike"], "reveal": "The two sisters dress alike.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["his style / like / his father's style"], "reveal": "His style is like his father's style.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["the documentary about future cities / fascinating"], "reveal": "The documentary about future cities was fascinating.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["I / feel / bored / during the slow lesson"], "reveal": "I felt bored during the slow lesson.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences comparing two outfits, habits, or people using comparatives, as...as, or like/alike, and one sentence with an -ing or -ed adjective.", "chips": ["... is more ... than ...", "... is as ... as ...", "I felt ... when ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["This dress is nicer than that one.", "My routine is as healthy as hers.", "They look alike.", "The class was interesting."], "negative": ["This dress isn't as expensive as that one.", "My style is not the same as my sister's.", "I wasn't bored during the lesson."], "question": ["Is this jacket warmer than that one?", "Is your diet as healthy as your friend's?", "Were you interested in the topic?"], "short": ["Yes, it is. / No, it isn't.", "Yes, it is. / No, it isn't.", "Yes, I was. / No, I wasn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "This shirt is more cheap than that one.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "This shirt is cheaper than that one.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "I am boring in this lesson.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I am bored in this lesson.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "Walking is ___ (cheap) than driving everywhere.", "section": "", "reveal": "cheaper", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "My trainers are ___ hers; we bought the same pair.", "section": "", "options": ["as comfortable as", "more comfortable than", "comfortabler than", "the comfortable as"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The two brothers look very ___ (alike/like) — people often mix them up.", "section": "", "reveal": "alike", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "I was really exciting about the new fashion show.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "I was really excited about the new fashion show.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put the words in order: healthier / a / diet / balanced / than / is / fast food", "section": "", "words": ["a", "balanced", "diet", "is", "healthier", "than", "fast", "food"], "end": ".", "reveal": "A balanced diet is healthier than fast food.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using same...as: My jacket and your jacket are the same colour.", "section": "", "reveal": "My jacket is the same colour as your jacket.", "prompt": "My jacket ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Which sentence correctly uses 'like' to compare?", "section": "", "options": ["He dresses like his older brother.", "He dresses alike his older brother.", "He dresses as his older brother.", "He dresses same his older brother."], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "After the exhausting exam week, all the students felt completely ___ (exhaust).", "section": "", "reveal": "exhausted", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Small Habits, Big Difference", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Think about your own daily routine. What habits do you think are healthy or unhealthy?", "Look at the title. What small habits do you think the text will mention?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Small Habits, Big Difference", "num": 1, "total": 4, "text": "Many teenagers believe that being healthy means going to the gym every day or following a strict diet. In fact, doctors say that small daily habits often make the biggest difference to how we feel. Simple things like drinking enough water, sleeping at regular times, and taking short breaks from screens can improve both our body and our mind.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Small Habits, Big Difference", "num": 2, "total": 4, "text": "Sleep is one of the most important habits for teenagers. Experts recommend eight to nine hours a night, but many students go to bed late because of homework or phones. As a result, they feel exhausted the next day and find it harder to concentrate in lessons. A simple change, like putting phones away thirty minutes before bed, can make sleep much better.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Small Habits, Big Difference", "num": 3, "total": 4, "text": "Movement matters too, but it doesn't have to mean intense exercise. A short walk after school, stretching in the morning, or even dancing to your favourite song can lift your mood and give you more energy. Doctors say that these small activities are often easier to keep up than a strict gym plan, because they fit naturally into a busy student's day.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Small Habits, Big Difference", "num": 4, "total": 4, "text": "Finally, well-being isn't only physical. Talking to friends and family, taking breaks when you feel stressed, and doing something you enjoy every day all help your mental health. In the future, more schools will probably teach students about these small habits, because a healthy routine now can shape a healthier life later.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, what do doctors say makes the biggest difference to well-being?", "section": "While you read", "options": ["Going to the gym every day", "Following a strict diet", "Small daily habits", "Taking expensive medicine"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "How many hours of sleep do experts recommend for teenagers?", "section": "While you read", "options": ["Five to six hours", "Six to seven hours", "Eight to nine hours", "Ten to eleven hours"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "The text says movement must always mean intense exercise at the gym.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says movement doesn't have to mean intense exercise; small activities like a walk or stretching are enough.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "A simple change like putting phones away thirty minutes before bed can make ___ better.", "section": "While you read", "reveal": "sleep", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the writer predict about schools in the future?", "section": "While you read", "options": ["Schools will stop teaching about health.", "Schools will probably teach students about small habits.", "Schools will only focus on sport.", "Schools will remove all screen time rules."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite this idea from the text using should: 'Doctors say small daily habits make a big difference.'", "section": "While you read", "reveal": "Students should build small healthy habits. / We should focus on small daily habits.", "prompt": "Students ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Which habit from the text do you already have? Which one would you like to start?", "Do you agree that small habits matter more than a strict plan? Why or why not?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Fashion: More Than Just Clothes", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What does your favourite outfit say about you?", "Do you think fashion will change a lot in the next twenty years?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Fashion: More Than Just Clothes", "num": 1, "total": 4, "text": "For many teenagers, fashion is not just about following trends — it's a way to show who they are. Some students prefer casual clothes like jeans and trainers because they feel more comfortable and confident in them. Others enjoy trying new styles and mixing colours, patterns, and accessories to create a look that feels unique.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Fashion: More Than Just Clothes", "num": 2, "total": 4, "text": "Personal style can also change with mood and occasion. A student might wear relaxed, casual clothes for a normal school day but choose something more formal for a special event, like a presentation or a family celebration. Many young people say that what they wear can affect how they feel — a comfortable, well-matched outfit often makes them feel more relaxed and self-assured.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Fashion: More Than Just Clothes", "num": 3, "total": 4, "text": "Fashion trends are also becoming more thoughtful. More brands are now making clothes that are as comfortable as they are stylish, and many young shoppers say they prefer simple, practical designs over expensive, uncomfortable ones. Social media has made it easier to discover new styles, but it has also encouraged some teenagers to buy too many clothes that they rarely wear.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Fashion: More Than Just Clothes", "num": 4, "total": 4, "text": "In the future, experts predict that fashion will focus more on comfort, individuality, and responsible choices. Instead of buying lots of cheap clothes, more people will probably choose fewer items that they really love and that match their own personal taste. For today's teenagers, fashion is becoming less about copying others and more about expressing themselves.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "According to the text, why do some students prefer casual clothes?", "section": "While you read", "options": ["Because they are cheaper", "Because they feel more comfortable and confident", "Because their school requires it", "Because they are difficult to find"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "A comfortable, well-matched outfit often makes people feel more relaxed and ___.", "section": "While you read", "reveal": "self-assured / confident", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "The text says social media has only had positive effects on how teenagers shop for clothes.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "The text says social media has helped people discover styles but has also encouraged some teenagers to buy too many clothes they rarely wear.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What do experts predict about fashion in the future?", "section": "While you read", "options": ["It will focus only on price.", "It will focus more on comfort, individuality, and responsible choices.", "It will disappear completely.", "It will become exactly the same for everyone."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What is the writer's overall opinion of fashion for today's teenagers?", "section": "While you read", "options": ["It is only about copying celebrities.", "It is becoming a way to express themselves.", "It should be ignored completely.", "It is too expensive to matter."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Do you agree that clothes can affect how confident you feel? Give an example.", "What do you think fashion will look like in twenty years?"], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "At the School Health Room", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What do you usually say to a nurse or doctor when you don't feel well?", "Look at the title. What kind of problem do you think the student will describe?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "At the School Health Room", "audio": null, "transcript": [{"speaker": "Nurse", "line": "Hi Ali, come in. You don't look very well today. What's wrong?"}, {"speaker": "Ali", "line": "I have a really bad headache, and my throat is a bit sore too."}, {"speaker": "Nurse", "line": "Okay. Do you have a fever? Let me check your temperature."}, {"speaker": "Ali", "line": "I don't think so, but I feel quite tired and exhausted."}, {"speaker": "Nurse", "line": "Your temperature looks normal, so it's probably just a mild cold. You should drink plenty of water and get some rest."}, {"speaker": "Ali", "line": "Should I go home, or can I stay for my last lesson?"}, {"speaker": "Nurse", "line": "I think you should go home and rest today. You'll probably feel better by tomorrow if you sleep early tonight."}, {"speaker": "Ali", "line": "Okay, thank you. I'll call my mum now."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What two symptoms does Ali mention first?", "section": "While you listen", "options": ["A headache and a sore throat", "A fever and a cough", "A stomachache and a headache", "A sore throat and an ankle injury"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Ali's temperature is high, so he has a fever.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Ali's temperature looks normal; the nurse says it's probably just a mild cold.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "The nurse tells Ali he should drink plenty of water and get some ___.", "section": "While you listen", "reveal": "rest", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What does the nurse advise Ali to do?", "section": "While you listen", "options": ["Stay for his last lesson", "Go home and rest", "See a different doctor", "Take strong medicine immediately"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite the nurse's advice as a should-sentence: 'It's a good idea for you to sleep early tonight.'", "section": "While you listen", "reveal": "You should sleep early tonight.", "prompt": "You ___", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you listen", "list": ["Do you think Ali made the right decision by going home? Why or why not?", "What advice would you give a friend with similar symptoms?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Life in 2050: A Class Discussion", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What changes do you expect in daily life by the year 2050?", "Do you think people will dress differently in the future?"], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Life in 2050: A Class Discussion", "audio": null, "transcript": [{"speaker": "Teacher", "line": "Today we're going to talk about the future. What do you think life will be like in 2050?"}, {"speaker": "Zeynep", "line": "I think people will be healthier because technology will help us track our habits more easily."}, {"speaker": "Teacher", "line": "That's an interesting idea. What about fashion, Emre? How do you think people will dress?"}, {"speaker": "Emre", "line": "I think clothes will be more comfortable than they are now, and maybe smarter too, with technology inside them."}, {"speaker": "Teacher", "line": "Do you think people will still care about looking stylish?"}, {"speaker": "Emre", "line": "Yes, but I think comfort will be just as important as style, not less important."}, {"speaker": "Zeynep", "line": "I agree. I also think people will exercise more because they'll understand how important well-being is."}, {"speaker": "Teacher", "line": "Great predictions! Let's write some of these ideas down for our project."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "According to Zeynep, why does she think people will be healthier in 2050?", "section": "While you listen", "options": ["Because food will be cheaper", "Because technology will help track habits", "Because schools will be shorter", "Because everyone will live near a hospital"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "Emre thinks clothes will be more comfortable and maybe ___ too.", "section": "While you listen", "reveal": "smarter", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Emre thinks people will stop caring about looking stylish in the future.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "Emre thinks comfort will be just as important as style, not that style will disappear.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "mcq", "q": "What does Zeynep predict about exercise in the future?", "section": "While you listen", "options": ["People will exercise less.", "People will exercise more.", "Exercise will disappear.", "Only athletes will exercise."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Do you agree with Zeynep and Emre's predictions? Why or why not?", "What is one prediction of your own about health or fashion in 2050?"], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "use", "title": "Konuşma & Yazma", "color": "#23835A", "screens": [{"type": "task", "kicker": "Speaking", "title": "At the Doctor's: Symptoms and Advice", "text": "In pairs, role-play a short conversation between a patient describing symptoms and a doctor or nurse giving simple health advice using should/shouldn't.", "steps": ["Choose roles: Student A is the patient, Student B is the doctor or nurse.", "Student A describes two or three symptoms.", "Student B asks a follow-up question and gives advice using should/shouldn't.", "Switch roles and repeat with a different illness.", "Perform your favourite version for another pair."], "chips": ["I have a...", "I've got a...", "I feel...", "You should...", "You shouldn't...", "I think you have..."], "timer": 600, "levels": ["Give weaker students a short list of symptom words and advice phrases to choose from.", "Students create their own short dialogue of about six to eight lines using the target language.", "Stronger students add a follow-up question, such as asking how long the advice should be followed."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Speaking", "title": "Fashion and Future Predictions", "text": "Discuss personal fashion preferences and make predictions about how fashion and well-being will change in the future.", "steps": ["Each student describes their own fashion preferences and gives a reason.", "Compare two outfits or styles in the group using comparatives or as...as.", "Together, make three predictions about fashion or well-being in twenty years.", "Choose a group spokesperson to share your best prediction with the class."], "chips": ["I prefer... because...", "My style is as... as...", "I think people will...", "In the future, we're going to..."], "timer": 600, "levels": ["Provide a simple sentence frame: 'I think in the future, people will...'", "Groups produce at least three original predictions with reasons.", "Stronger groups justify their predictions with a short explanation of why they think it will happen."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "A Short Health Advice Note", "text": "Write a short note to a friend who is feeling unwell. Describe possible symptoms and give at least three pieces of advice using should/shouldn't.", "steps": ["Decide on the illness or symptoms your friend has.", "List three pieces of advice you want to give.", "Think of a friendly opening and closing line."], "chips": ["headache", "sore throat", "fever", "rest", "recover", "I heard you have...", "You should...", "You shouldn't...", "I hope you feel better soon."], "time
