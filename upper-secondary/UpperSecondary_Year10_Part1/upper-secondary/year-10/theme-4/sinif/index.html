": "My grandparents ___ live in a small village.", "section": "Complete the rule", "reveal": "used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "My father ___ eat vegetables when he was a child.", "section": "Complete the rule", "reveal": "didn't use to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Did your family ___ celebrate this festival?", "section": "Complete the rule", "reveal": "use to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "My aunt ___ visit us every Sunday.", "section": "Complete the rule", "reveal": "used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "rule", "title": "The rule", "en": "We use used to + base form to talk about past habits or states that are no longer true.", "tr": "Used to + fiilin yalın hali, artık doğru olmayan geçmiş alışkanlıkları veya durumları anlatmak için kullanılır.", "when_en": "Use used to for repeated actions or states in the past that have changed. It has no present form.", "when": "Used to, geçmişte tekrarlanan ancak artık değişmiş olan eylem veya durumlar için kullanılır; şimdiki zaman hali yoktur.", "note": "Confirm the rule the students found. Turkish line is for support only. / Öğrencilerin bulduğu kuralı onaylayın; Türkçe satır destek içindir."}, {"type": "cue", "section": "Build sentences · Example", "cue": ["my mother", "/", "used to", "/", "sew", "/", "her own clothes"], "reveal": "My mother used to sew her own clothes.", "shown": true, "note": "Model the first one together. / İlkini birlikte yapın."}, {"type": "cue", "section": "Build sentences", "cue": ["my grandfather", "/", "used to", "/", "tell", "/", "long stories"], "reveal": "My grandfather used to tell long stories.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["we", "/", "not", "/", "used to", "/", "have", "/", "a television"], "reveal": "We didn't use to have a television.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my parents", "/", "used to", "/", "dance", "/", "every weekend"], "reveal": "My parents used to dance every weekend.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["my sister", "/", "used to", "/", "collect", "/", "stamps"], "reveal": "My sister used to collect stamps.", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "cue", "section": "Build sentences", "cue": ["did", "/", "your family", "/", "use to", "/", "live", "/", "abroad"], "reveal": "Did your family use to live abroad?", "note": "Students say the sentence aloud; pick a number, then reveal. / Öğrenciler sözlü kurar; rastgele numara ile sorun, sonra açın."}, {"type": "prompt", "title": "Your turn", "text": "Write 2-3 original sentences about habits your family used to have in the past.", "chips": ["My family used to ...", "We didn't use to ..."], "timer": 240, "note": "4 minutes writing, then 3 volunteers read aloud. / 4 dk yazma, 3 gönüllü okur."}, {"type": "form", "title": "Form", "form": {"positive": ["I/He/She/They used to live here."], "negative": ["I/He/She/They didn't use to live here."], "question": ["Did I/he/she/they use to live here?"], "short": ["Yes, I did. / No, I didn't."]}, "note": "Students copy the table. / Tabloyu deftere aldırın."}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "My grandmother uses to cook every day.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My grandmother used to cook every day.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "judge", "section": "Error detective", "q": "We didn't used to have a garden.", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "We didn't use to have a garden.", "note": "Who can find the mistake? / Hatayı kim bulacak?"}, {"type": "question", "qtype": "gap", "q": "My grandfather ___ (used to) work on a farm.", "section": "", "reveal": "used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "We ___ have a big garden, but now we live in a flat.", "section": "", "reveal": "used to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct question form.", "section": "", "options": ["Did your family used to travel a lot?", "Did your family use to travel a lot?", "Does your family used to travel a lot?", "Was your family use to travel a lot?"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "'My parents use to live in a village when they were young.' is correct.", "section": "", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "My parents used to live in a village when they were young.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "order", "q": "Put in order: used to / my brother / a bicycle / ride / to school", "section": "", "words": ["my", "brother", "used", "to", "ride", "a", "bicycle", "to", "school"], "end": ".", "reveal": "My brother used to ride a bicycle to school.", "note": "Pairs write the sentence in their notebooks. A volunteer taps the words on the board. / İkililer deftere yazar, bir gönüllü tahtada kelimelere dokunarak kurar."}, {"type": "question", "qtype": "rewrite", "q": "Make negative: My family used to have a big house.", "section": "", "reveal": "My family didn't use to have a big house.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "___ your grandparents ___ (use to) speak another language at home?", "section": "", "reveal": "Did ... use to", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "rewrite", "q": "Turn into a question: Your family used to live near the sea.", "section": "", "reveal": "Did your family use to live near the sea?", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "The Yılmaz Family: Then and Now", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. What do you think will be different between the past and now?", "What household chores did families use to share long ago?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "The Yılmaz Family: Then and Now", "num": 1, "total": 5, "text": "The Yılmaz family lives in a busy apartment in Izmir, but their daily routine looks very different from their grandparents' routine fifty years ago.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Yılmaz Family: Then and Now", "num": 2, "total": 5, "text": "Today, Mrs Yılmaz wakes up at six thirty, checks her phone, and drives her children to school before going to her office. Her husband works from home three days a week and cooks dinner using recipes he finds online. Their two children, Deniz and Elif, have busy afternoons: Deniz plays football twice a week, and Elif takes a coding class on Saturdays.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Yılmaz Family: Then and Now", "num": 3, "total": 5, "text": "Fifty years ago, Mrs Yılmaz's grandparents used to live in a small village outside the city. There was no electricity in the house until the 1970s, and there wasn't a television for many years. Her grandfather used to get up before sunrise to work on the family's small farm, and her grandmother used to bake bread every morning. The children walked to school, and in the evening the whole extended family sat together and told stories, because there wasn't much else to do for entertainment.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Yılmaz Family: Then and Now", "num": 4, "total": 5, "text": "One thing that hasn't changed, though, is Sunday lunch. Just like fifty years ago, the Yılmaz family still gathers every Sunday, and relatives from nearby towns often join them. \"My grandmother could cook the most delicious dishes with very simple ingredients,\" says Mrs Yılmaz. \"I try to keep some of her recipes alive, even though our lives are completely different now.\"", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "The Yılmaz Family: Then and Now", "num": 5, "total": 5, "text": "Deniz says he sometimes finds it hard to imagine life without the internet, but he loves listening to his great-grandmother's stories about the old village house and its enormous garden.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What does Mr Yılmaz do three days a week?", "section": "While you read", "options": ["He drives the children to school.", "He works from home.", "He works on a farm.", "He bakes bread."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Mrs Yılmaz's grandparents had electricity from the beginning.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "There was no electricity in the house until the 1970s.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Fifty years ago, the family ___ (there was/were) no television for many years.", "section": "While you read", "reveal": "there wasn't", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Why did the extended family tell stories in the evening?", "section": "While you read", "options": ["Because they liked reading.", "Because there wasn't much else to do for entertainment.", "Because the grandfather was a storyteller.", "Because it was a school activity."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What has NOT changed for the Yılmaz family?", "section": "While you read", "options": ["Their house.", "Their Sunday lunch tradition.", "Their jobs.", "Their village."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "rewrite", "q": "Rewrite using 'used to': Her grandfather got up before sunrise every day (in the past, no longer true).", "section": "While you read", "reveal": "Her grandfather used to get up before sunrise every day.", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "list", "title": "After you read", "list": ["Compare the Yılmaz family's routine today with their grandparents' routine. What are the biggest differences?", "Do you know any family traditions that have not changed over the generations? Share one."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "reading-1", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "Homes and Families Around the World", "note": ""}, {"type": "list", "title": "Before you read", "list": ["What types of houses do you know from different countries?", "Do you think family size is the same in every country? Why or why not?"], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "Homes and Families Around the World", "num": 1, "total": 6, "text": "Families and homes look very different from country to country, and each type of home tells us something about the people who live there.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Homes and Families Around the World", "num": 2, "total": 6, "text": "In Japan, many urban families live in small, well-organised apartments, often just outside big cities like Tokyo. Homes are usually compact, so families use clever storage and furniture that can be folded away, such as low tables and futon beds. Traditionally, several generations used to live together, but today many young couples prefer their own smaller home close to their parents.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Homes and Families Around the World", "num": 3, "total": 6, "text": "In Morocco, many families live in a riad, a traditional house built around a beautiful inner courtyard. In the past, riads were built for extended families, with grandparents, parents, aunts, uncles and cousins all living together under one roof. There wasn't a strict separation between generations; everyone shared meals and celebrations in the central courtyard.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Homes and Families Around the World", "num": 4, "total": 6, "text": "In Norway, detached wooden houses, called \"hytte\" for holiday homes, are extremely common, and many nuclear families own a small cabin in the mountains or by the sea. Norwegian families often spend weekends there, hiking, skiing or simply relaxing away from the city.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Homes and Families Around the World", "num": 5, "total": 6, "text": "In Nigeria, extended family networks are very important, and it is common for grandparents, uncles, aunts and cousins to live in the same compound, a group of houses built close together around a shared yard. Children often grow up surrounded by many relatives, and neighbours are treated almost like family members.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "Homes and Families Around the World", "num": 6, "total": 6, "text": "These examples show that although family structures and homes are different around the world, the value families place on being together often stays the same.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "question", "qtype": "mcq", "q": "What kind of furniture do many Japanese families use?", "section": "While you read", "options": ["Large sofas and dining tables.", "Furniture that can be folded away.", "Only outdoor furniture.", "Antique wooden furniture."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "A riad in Morocco is built around an inner courtyard.", "section": "While you read", "options": ["Correct", "Incorrect"], "answer": 0, "fix": "", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "In Norway, many families own a small ___ in the mountains or by the sea.", "section": "While you read", "reveal": "cabin / hytte", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "What is a compound, as described in the text about Nigeria?", "section": "While you read", "options": ["A single large house.", "A group of houses built close together around a shared yard.", "An apartment building.", "A school building."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "mcq", "q": "What idea connects all the examples in the text?", "section": "While you read", "options": ["All families live in apartments.", "All families value being together, even with different home types.", "All countries have the same family structure.", "All houses have courtyards."], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you read", "list": ["Which type of house from the text would you most like to live in? Why?", "Compare a compound or riad with the type of home common in your own country."], "timer": 180, "note": "Group discussion, then share. / Grup tartışması, sonra paylaşım."}]}, {"id": "listening-0", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Grandma's Old House", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What questions would you ask your grandparents about their childhood home?", "Listen and find out what Grandma's house used to be like."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Grandma's Old House", "audio": null, "transcript": [{"speaker": "A", "line": "Grandma, can you tell me about the house you grew up in?"}, {"speaker": "B", "line": "Of course! It was a small stone house in the mountains. There were only two bedrooms for six people."}, {"speaker": "A", "line": "Six people in two bedrooms? Was it crowded?"}, {"speaker": "B", "line": "A little, but we didn't use to mind. We spent most of our time outside anyway."}, {"speaker": "A", "line": "What did you use to do for fun?"}, {"speaker": "B", "line": "I could climb trees very well, and my brother and I used to play football with a ball made of old socks."}, {"speaker": "A", "line": "That's amazing! You didn't have a real football, did you?"}, {"speaker": "B", "line": "No, we didn't! There wasn't much money for toys back then."}, {"speaker": "A", "line": "And what about school? You walked there, didn't you?"}, {"speaker": "B", "line": "Yes, every day, even in winter. It used to take almost an hour each way."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "How many bedrooms did Grandma's house have?", "section": "While you listen", "options": ["One", "Two", "Three", "Four"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "judge", "q": "Grandma had a real football to play with.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "She used a ball made of old socks.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı–aşağı ile oylayın; yanlışsa bir öğrenci düzeltsin."}, {"type": "question", "qtype": "gap", "q": "Grandma ___ climb trees very well.", "section": "While you listen", "reveal": "could", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "How did Grandma get to school?", "section": "While you listen", "options": ["By bus", "By bicycle", "She walked", "Her father drove her"], "answer": 2, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "list", "title": "After you listen", "list": ["Would you like to live in a small house with five other people? Why or why not?", "Ask a partner what their grandparents used to do for fun."], "timer": 180, "note": "Role-play in pairs. / İkili canlandırma."}]}, {"id": "listening-1", "title": "Dinleme", "color": "#C23676", "screens": [{"type": "title", "kicker": "Listening", "title": "Family Hobby Night", "note": ""}, {"type": "list", "title": "Before you listen", "list": ["What hobby does your family enjoy doing together?", "Listen to find out what this family does on Friday nights."], "note": "Predict. / Tahmin."}, {"type": "audio", "title": "Family Hobby Night", "audio": null, "transcript": [{"speaker": "A", "line": "So what does your family do together for fun?"}, {"speaker": "B", "line": "Every Friday, we have a family hobby night. My dad loves old films, so we watch one together."}, {"speaker": "A", "line": "Your dad likes films, doesn't he? What kind?"}, {"speaker": "B", "line": "Mostly comedies and a few action films. My mum prefers documentaries, though."}, {"speaker": "A", "line": "And what about you and your sister?"}, {"speaker": "B", "line": "My sister is really into sports. She plays basketball for the school team."}, {"speaker": "A", "line": "She's quite tall, isn't she?"}, {"speaker": "B", "line": "Yes, she is! And I'm more into board games. I could beat everyone at chess last year."}, {"speaker": "A", "line": "That's impressive! So does everyone agree on what to watch on Friday?"}, {"speaker": "B", "line": "Not always, but we take turns choosing, so it's fair."}], "note": "Play twice: first for gist, then for detail. Show the transcript only at the end. / İki kez dinletin; transkripti en sonda açın."}, {"type": "question", "qtype": "mcq", "q": "What does the family do every Friday?", "section": "While you listen", "options": ["Play chess", "Have a family hobby night", "Go to the cinema", "Play basketball"], "answer": 1, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "The sister plays ___ for the school team.", "section": "While you listen", "reveal": "basketball", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "judge", "q": "Everyone in the family always agrees on what film to watch.", "section": "While you listen", "options": ["Correct", "Incorrect"], "answer": 1, "fix": "They take turns choosing because they don't always agree.", "note": "Thumbs up = correct, thumbs down = incorrect. Ask a student to correct it. / Başparmak yukarı– re and Choose", "text": "Each group receives a description of a different house type (detached house, apartment, riad-style courtyard house, or hytte cabin). Discuss the advantages and disadvantages, then choose which one your imaginary family would live in and why.", "steps": ["Read your group's house description together.", "List two advantages and two disadvantages of the house for a family.", "Decide as a group whether your imaginary family would choose this house.", "Present your decision and reasons to the class."], "chips": ["This house has ...", "A big advantage is ...", "Our family could ...", "It doesn't have a garden, does it?"], "timer": 600, "levels": ["Provide a simple table (advantages/disadvantages) for students to fill in before speaking.", "Groups discuss and justify their choice using target vocabulary and grammar.", "Groups compare their house with another group's house and debate which is better for a large extended family."], "note": "Model the first question with a strong student. Monitor and note common errors for feedback. / Güçlü bir öğrenciyle örnekleyin; dolaşıp sık hataları not alın."}, {"type": "task", "kicker": "Writing", "title": "My Family: Then and Now", "text": "Write a paragraph comparing your family's daily routine or home today with how it used to be in your grandparents' generation.", "steps": ["Choose 3-4 points to compare (routine, house, hobbies, chores).", "Note down was/were, there was/were, used to, and could examples for each point.", "Write an introduction sentence, then one sentence per point, then a short conclusion."], "chips": ["routine", "household", "generation", "tradition", "chore", "My grandparents used to ...", "There was/were ... in their house.", "My grandmother/grandfather could ...", "Nowadays, my family ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}, {"type": "task", "kicker": "Writing", "title": "A House and a Family from the World", "text": "Choose a type of house and family from a country you find interesting (real or imagined) and describe the house, the family who lives there, and what makes it special.", "steps": ["Choose a country and house type.", "Note down details: rooms, location, family members, traditions.", "Write about the house first, then the family, then one special tradition."], "chips": ["extended family", "nuclear family", "neighbourhood", "rural", "urban", "This house is located in ...", "The family who lives there ...", "There is/are ... in the house.", "One tradition they have is ..."], "timer": 900, "levels": [], "note": "Plan together, write alone, peer-check with the checklist. / Birlikte planlayın, bireysel yazın, kontrol listesiyle akran değerlendirmesi."}]}, {"id": "review", "title": "Çıkış kartı", "color": "#B57A0C", "screens": [{"type": "title", "kicker": "Review", "title": "Exit ticket", "note": "Last 5 minutes. / Son 5 dakika."}, {"type": "question", "qtype": "gap", "q": "There ___ a small farm behind my grandparents' house.", "section": "Exit ticket", "reveal": "was", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "mcq", "q": "Choose the correct question tag: 'Your father works from home, ___?'", "section": "Exit ticket", "options": ["doesn't he", "does he", "isn't he", "didn't he"], "answer": 0, "note": "Give 10 seconds to think. Students show 1, 2 or 3 fingers for a, b, c. Then reveal. / 10 sn düşünme süresi; öğrenciler parmakla oy verir, sonra cevabı açın."}, {"type": "question", "qtype": "gap", "q": "My grandmother ___ (can) cook amazing traditional food.", "section": "Exit ticket", "reveal": "could", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgel
