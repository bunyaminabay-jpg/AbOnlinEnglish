ber for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}, {"type": "question", "qtype": "gap", "q": "Deniz: Not everywhere. You ___ (take) photos in some rooms.", "section": "Dialogue · Complete the conversation. Use can / can't and the verb in brackets.", "reveal": "can't take / cannot take", "note": "Students write the answer, then check with a partner. Pick a number for the answer. / Önce deftere, sonra eşiyle kontrol; rastgele numara ile bir öğrenciye sorun."}]}, {"id": "reading-0", "title": "Okuma", "color": "#0B8A80", "screens": [{"type": "title", "kicker": "Reading", "title": "A Weekend in Baku", "note": ""}, {"type": "list", "title": "Before you read", "list": ["Look at the title. Which country is Baku the capital of?", "What do tourists usually do in a capital city? Guess three things."], "timer": 90, "note": "Pairs predict; write predictions on the board to check later. / Tahminleri tahtaya yazın, okuduktan sonra kontrol edin."}, {"type": "paragraph", "title": "A Weekend in Baku", "num": 1, "total": 4, "text": "Hi, I'm Leyla. I'm from Azerbaijan and I'm a student at an international school in Ankara. My native language is Azerbaijani, but I can speak Turkish and English, too.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend in Baku", "num": 2, "total": 4, "text": "Last month my classmates asked me about my capital, Baku. Baku is on the coast of the Caspian Sea. The old part of the city is called İçərişəhər. It is very ancient and it has a castle wall, narrow streets and the Maiden Tower.", "note": "Silent reading first (jigsaw: half the class reads 1–2, half 3–4). Then one student summarises. / Önce sessiz okuma; yapboz okuma için sınıfı ikiye bölün."}, {"type": "paragraph", "title": "A Weekend in Baku", "num": 3, "total": 4, "text": "Tourists can walk a
